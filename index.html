다."],"a":2,"e":"선하증권은 유통증권(negotiable instrument)으로서 배서·교부에 의해 운송 중 화물의 전매가 가능하다는 점이 핵심 효용이므로, 전매를 불가능하게 한다는 설명은 성립하지 않는다."},{"id":"dd060b9e19","s":1,"n":"62","q":"다음에서 기명식선하증권(Straight B/L)의 특성과 상관이 없는 것은?","o":["수하인 란에 특정인의 명칭(회사명 또는 성명)이 기재된 B/L","대부분 국가에서 기명식선하증권은 Non-negotiable증권으로 규정","우리 상법은 기명식인 경우에도 특별히 배서금지표시가 없는 한 배서에 의해 양도 가능","“ORDER...”라는 문구가 포함되어 있거 유통이 가능한 B/L"],"a":3,"e":"\"ORDER\" 문구가 들어가 유통이 가능한 것은 지시식 선하증권(Order B/L)의 특성이다. 기명식(Straight B/L)은 수하인이 특정되어 원칙적으로 비유통(non-negotiable) 증권이다."},{"id":"891fbf7c2c","s":1,"n":"63","q":"신용장상에 「Shipment to be effected by JG Shipping Co.」라고 명시되어 있는 경우 다음 설명중 옳은 것은?","o":["수입자로부터 별도의 허가를 받아 수출자가 JG해운의 선박을 수배하여 물품을 선적한다.","수출자는 매입은행에 매입의뢰시 JG해운이 발생한 선하증권을 제시하여야 한다.","수입자가 JG해운으로부터 선하증권을 발급받아 수출자에게 교부한다.","JG해운은 수입자의 운송대리인이나, 운임은 수출자가 부담한다."],"a":1,"e":"신용장에 특정 선사에 의한 선적이 조건으로 명시되면 그 선사가 발행한 선하증권을 제시해야 서류가 신용장 조건에 일치하며, 매입은행은 이를 기준으로 수리·매입한다."},{"id":"283d8b7e96","s":1,"n":"64","q":"다음 중 운송구간(선적항 및 양륙항)이 동일 국가인 경우의 B/L은?","o":["내국선하증권 (Local B/L )","적색 선하증권(Red B/L)","선적선하증권(Shipped B/L)","통선하증권 (Through B/L)"],"a":0,"e":"선적항과 양륙항이 모두 같은 국가 안에 있는 국내 구간 운송에 발행되는 것이 내국선하증권(Local B/L)이다. 통선하증권(Through B/L)은 복수 운송인·구간을 통합하는 증권이다."},{"id":"605428310c","s":1,"n":"65","q":"B/L상 송하인으로 기재되는 것은 신용장상의 수익자가 일반적이지만 수익자 이외의 제3자를 송하인으로 허용하는 이유는?","o":["수입자가 수익자로 부터 물품을 조달 받기위한 경우","신용장에 구체적인 명시를 확실하게 하기 위한 경우","신용장발행 의뢰인이 물품의 실매도인을 수입자에게 알리고 싶지 않을 경우","수하인에게 신속하게 화물의 인도가 이루어 질 수 있도록 제도화 한 경우"],"a":2,"e":"신용장 개설의뢰인(수입자)이 실제 물품 공급자를 수입자 측 거래선에 알리고 싶지 않은 중계무역 등의 사정 때문에 수익자 아닌 제3자를 송하인(shipper)으로 기재하는 것이 허용된다."},{"id":"f4b3a76be9","s":1,"n":"66","q":"다음에서 FIATA 복합운송 선하증권 표준약관 (1992)의 내용과 다른 것은?","o":["포워더의 물품에 대한 책임기간은 포워더가 물품을 인수한때부터 물품을 인도할 때까지이다.","복합운송 선하증권이라 할지라도 이 약관은 단일 운송수단만이 사용된 경우에도 똑같이 적용된다.","화주는 위험품의 경우 포워더가 물품을 인수하기 전에 화물의 정확한 성질을 서면으로 통지해야 한다.","물품이 인도되어야 할 날 또는 인도되지 않아 멸실된 것으로 간주권한을 갖는 날로부터 1년 이내에 소송이 제기되지 않으면 포워더는 모든 책임으로 면제된다."],"a":3,"e":"FIATA FBL(1992) 표준약관의 제소기한(time bar)은 인도일 또는 인도되어야 했던 날로부터 9개월이며, 1년이 아니다. 책임기간은 수령부터 인도까지의 전 구간이다."},{"id":"526df63817","s":1,"n":"67","q":"다음에서 B/L 화물 전량이 On Dock 터미널에서 인수 또는 반입된 시점을 말하는 것은?","o":["LCL","FCL","CFS","OBL"],"a":1,"e":"FCL은 컨테이너 단위로 화주가 적입한 화물을 운송인이 On Dock 터미널(CY)에서 전량 인수·반입하는 형태로, 그 반입시점이 운송인의 화물 수취시점이 된다. LCL은 CFS 반입이 기준이다."},{"id":"0416eae42d","s":1,"n":"68","q":"우리나라 관행 상 화물의 수취와 선박이 접안 후 발해하는 B/L은 다음 중 어느 것인가?","o":["수령선하증권","용선계약부선하증권","선적선하증권","통선하증권"],"a":2,"e":"우리나라 실무에서는 본선 접안·적재 후 본선적재 문언이 들어간 선적선하증권(Shipped·On Board B/L)을 발행하며, 수령선하증권(Received B/L)은 신용장에서 통상 수리되지 않는다."},{"id":"21a6e068d2","s":1,"n":"69","q":"다음 중 B/L 상 운임 및 요금 적용 시 중요 준수사항과 관계가 없는 것은?","o":["미국발착 화물의 경우는 FMC에 신고 ․ 발효 중인 S/C 또는 공표한 Tariff 운임을 적용하여야 한다.","선하증권에 기재된 화물전량이 운송인에 의해 수취된 날에 유효한 S/C 또는 Tariff 운임을 적용하여야 한다.","Minimum B/L Charge가 있는 경우, 실재 화물량(CBM 또는 Kilo ton)에 대해 산정한 운임이 Minimum Charge보다 작은 경우는 Minimum B/L Charge를 적용한다.","송하인이 화물의 가액을 신고하여 이를 B/L에 기재하는 경우는 종가요금(ad valorem charge)을 적용하지 말아야 한다."],"a":3,"e":"송하인이 화물 가액을 신고하고 이를 B/L에 기재하면 운송인의 책임한도가 신고가액으로 확대되므로 종가운임(ad valorem charge)을 반드시 적용·징수해야 한다."},{"id":"9fe305f1d3","s":1,"n":"70","q":"다음 중 미국을 발착(發着)하는 화물에 대한 운임적용관려 주요사항으로 적합하지 않은 것은?","o":["미연방해사위원회(FMC)에 신고한 S/C 운임의 적용하여야 한다.","일반에 공표한 TARIFF 운임의 적용하여야 한다.","만약 어떤 품목에 대한 S/C운임이 표정Tariff의 운임보다 높을 경우는 Tariff운임을 적용할 수 없다고 S/C로 약정한다.","S/C에 의거 화물운송이 이루어지면 B/L에는 S/C로 약정한 운임을 적용 ․ 표기하고 그대로 징수하여야 한다"],"a":2,"e":"S/C(Service Contract)가 체결되면 해당 화물에는 FMC에 신고·발효된 S/C 운임을 그대로 적용·징수해야 하며, Tariff와 비교해 유리한 쪽을 골라 적용하는 식의 약정은 허용되지 않는다."},{"id":"e117fbc0b2","s":1,"n":"71","q":"다음에서 U.S. Shipping Act을 기준으로 운임의 오적용과 벌칙내용을 설명한 것 중 알맞게 짝지어 진 것은?","o":["고의적이 아닌 경우 : 위반 건(B/L)당 USD 10,000 이하의 벌금","고의적인 경우 : 위반 건(B/L)당 USD 25,000 이하의 벌금","추가벌칙 : FMC는 벌금 + 6개월 이내에서 Tariff 정지 가능","Tariff가 정지된 후 화물운송 : 건당 USD 25,000이하의 벌금"],"a":1,"e":"U.S. Shipping Act상 운임 오적용에 대한 벌금은 고의적(knowing and willful)인 경우 위반 건당 USD 25,000 이하이며, 고의가 아닌 경우는 USD 5,000 이하로 규정된다."},{"id":"c606d8dba8","s":1,"n":"72","q":"항해용선계약에서 화물량보다 실제 선적량이 적은 경우 용선자(Charterer)인 화주가 그 부족분에 대해서도 지불하는 운임은?","o":["선불운임(Advanced Freight)","부적운임(Dead Freight)","반송운임(Back Freight)","후불운임(Destination Freight)"],"a":1,"e":"항해용선계약에서 용선자가 약정 선적량(계약 화물량)을 채우지 못한 경우 그 부족분에 대해 지급하는 공적운임이 부적운임(Dead Freight)이며, 이는 손해배상적 성격의 운임이다."},{"id":"ce2078e07f","s":1,"n":"73","q":"운임은 운송계약의 중요사항인데 운임액수가 기재되지 않은 선하증권의 효력은?","o":["선하증권소지인의 화물인도청구권에 막대한 영향을 미친다.","운임료에 벌칙금을 추후에 지불하여야 한다.","선하증권의 본질을 해하지 않으므로 유효하다고 본다.","운임 전액과 화물을 인도할 의무가 없다."],"a":2,"e":"운임액은 선하증권의 법정기재사항이 아니라 임의기재사항이므로, 금액이 기재되지 않아도 증권의 본질인 화물수취·인도청구권과 유통성에는 영향이 없어 유효하다."},{"id":"7981f63756","s":1,"n":"74","q":"선하증권의 임의적 기재사항에서 운송계약 내용의 보충 또는 참고사항과 상관이 없는 것은?","o":["단순 참고용(for merchant reference only)으로서 최종목적지","컨테이너에 의한 운송의 경우 컨테이너 번호 및 Seal번호","운임의 지급지, 지급조건 (prepaid, collect등)","운송선박의 명칭 및 국적과 톤수"],"a":3,"e":"운송선박의 명칭·국적·톤수는 선박을 특정하는 법정기재사항(선박명 등)에 속한다. 최종목적지 참고표시, 컨테이너·Seal 번호, 운임지급지·조건은 계약내용을 보충하는 임의기재사항이다."},{"id":"27a00b3231","s":1,"n":"75","q":"다음에서 화물손해의 통고 및 제소기한을 짝지은 것으로 알맞지 않은 것은?","o":["화물손상의 통지기한 : 인도 후 3일 이내","화물멸실의 통지기한 :화물이 도착되었어야 할 날부터 3일","멸실, 손상된 화물의 명세서(서면)제출기한: 30일 이내","제소기한 : 화물인도 후 3년 이내"],"a":3,"e":"헤이그규칙 및 우리 상법상 화물 손해에 대한 제소기한은 인도일(또는 인도되어야 할 날)로부터 1년이며 3년이 아니다. 손상 통지는 인도 후 3일, 명세서 제출은 30일이 기준이다."},{"id":"71a5cd10b1","s":1,"n":"76","q":"다음에서 운송인의 자유재량권 및 권리 등에 관한 B/L상의 약관의 예로 적당하지 않은 것은?","o":["분할선적의 자유","컨테이너화물의 갑판적(ondeck stowage)할 권리","운송물명세에 관한 서면제공의무","환적운송(transshipment and forwarding)할 자유"],"a":2,"e":"운송물 명세에 관한 서면제공은 송하인의 통지의무이자 운송인의 확인 대상일 뿐, 운송인의 자유재량권이 아니다. 분할선적·갑판적·환적의 자유는 운송인의 재량권 약관에 해당한다."},{"id":"c44131c732","s":1,"n":"77","q":"만약, B/L발행일이 05. 10. 1일이고 선적일이 ’05.10. 2일인 \"90 days after shipping date\"조건의 환어음을 ‘05.10.10일 인수할 경우 만기일은?","o":["05.12.30","05.12.30","06.01.03","05.10.08"],"a":1,"e":"\"90 days after shipping date\"는 인수일이 아니라 선적일(05.10.2)을 기산점으로 하므로 만기는 12월 말일경(선적일 산입 기준 12.30)이 되며, 어음 인수일 10.10은 만기 계산과 무관하다."},{"id":"f44f1d34ec","s":1,"n":"78","q":"다음 중 선하증권에서 운송인의 면책사유에 관한 약관으로 관계가 없는 것은?","o":["불가항력에 기인한 손해","송하인 또는 화물소유자의 행위에 기인한 손해","불완전한 기호에 기인한 인도사고 또는 지연","운송도중 화물의 재포장 등 합리적인 조치"],"a":3,"e":"운송 중 화물의 재포장 등 합리적 조치는 운송인이 화물을 보전하기 위해 행하는 재량권·권리에 관한 약관이며 면책사유가 아니다. 불가항력, 송하인의 행위, 불완전한 기호는 면책사유다."},{"id":"fd8462e3c4","s":1,"n":"79","q":"다음에서 선하증권통일조약의 배상한도액을 올바르게 짝지은 것은?","o":["Hague Rules 1924 - 30 pointcarề franc / kg당","Hague-Visby Rules, 1968 - 100 Sterling pound / 포장당","Hamburg Rules, 1978 - 666.67 SDR / 포장당","UN국제복합운송조약 1980 - 920 SDR / 포장당"],"a":3,"e":"UN국제복합운송조약(1980)은 포장당 920 SDR 또는 kg당 2.75 SDR을 한도로 한다. Hague 1924는 포장당 100파운드, Hague-Visby는 666.67 SDR/포장, Hamburg는 835 SDR/포장이다."},{"id":"1c1e4455ec","s":1,"n":"80","q":"다음 중 CIF계약에서 매도인이 제공해야 할 기본적인 서류로 상업송장, 보험증권 이외에 요구되는 서류는?","o":["선하증권","검사증명서","항공운송장","원산지증명서"],"a":0,"e":"CIF는 매도인이 운송계약과 적하보험을 부보하는 조건이므로 상업송장·보험증권과 함께 해상운송을 증명하는 선하증권(B/L) 제공이 기본 서류의무다."},{"id":"d733bc3972","s":1,"n":"81","q":"다음 중 주요국가의 운송인의 책임배상한도액을 비교한 것 중 올바르지 못한 것은?","o":["한국해상법 - 500 SDR / 포장당","미국 COGSA - US $ 500/ 포장장","중국 해상법 - 920 SDR / 포장당","독일, 프랑스 - VISBY Rules와 동일 (666.67 SDR)"],"a":2,"e":"중국 해상법의 책임한도는 Hague-Visby와 같은 포장당 666.67 SDR(또는 kg당 2 SDR)로, 920 SDR은 UN복합운송조약의 한도다. 한국 상법 500 SDR, 미국 COGSA USD 500은 옳다."},{"id":"729d533cbd","s":1,"n":"82","q":"다음 선하증권의 종류 중 사고부 선하증권을 뜻하는 용어가 아닌 것은?","o":["Foul B/L","Dirty B/L","B/L with reservation","Switch B/L"],"a":3,"e":"Switch B/L은 중계무역용으로 기재사항을 바꾸어 재발행한 증권이다. 사고부 선하증권은 화물·포장의 하자가 적요(remark)로 기재된 것으로 Foul·Dirty B/L, B/L with reservation이라 한다."},{"id":"185baa05f9","s":1,"n":"83","q":"선하증권이 오기된 경우의 실무적 정정방법과 사후처리를 설명한 것 중 올바르지 않는 것은?","o":["선하증권상의 원 기재가 오기라는 사실의 확인된 경우는 증빙할 수 있는 서류를 대조하여 사실을 확인하고 정정하여야 한다.","선하증권상의 통지처에게도 당해 운송에 관한 정확한 정보를 통지하지 않아도 된다.","출항지 세관에 이미 제출한 적하목록의 정정절차를 취한다","목적지의 운송인사무소에 동 정정사실을 통보하여 사실과 부합되는 적하목록이 해당 세관에 제출되도록 한다."],"a":1,"e":"오기 정정 시에는 송하인·수하인은 물론 통지처(notify party)에게도 정정된 정확한 운송정보를 통지해야 한다. 아울러 출항지·목적지 세관의 적하목록 정정절차도 함께 이행해야 한다."},{"id":"4100a33063","s":1,"n":"84","q":"다음 주어진 선하증권의 법정기재사항에서 수출입 실적의 기준이 되는 것은 무엇인가?","o":["운송품의 종류(Description)","중량 및 용적(Weight or Measurement)","운송품의 기호(Marks)","포장의 종류 및 개수(Package and Number)"],"a":1,"e":"수출입 실적 집계와 관세·운임 산정의 기준이 되는 계량 항목은 중량 및 용적(Weight or Measurement)이며, 화물의 종류·기호·포장 개수는 화물 식별을 위한 기재사항이다."},{"id":"f3ef74ea5b","s":1,"n":"85","q":"선하증권의 전자화와 관련한 설명이다. 거리가 먼 것은?","o":["Trade Card는 전자선하증권 서비스를 세계 최초로 제공하였다.","전자선하증권은 어떤 선하증권의 종류가 아니라 현행 B/L이 갖는 기능을 전자적 방법으로 운영하려는 일련의 시스템을 말한다.","Bolero는 전자선하증권 유통을 위해 Rule Book을 활용한다.","전자선하증권에 관한 CMI 통일규칙(CMI Rules for Electronic Bill of Lading)이 제정되었다."],"a":0,"e":"전자선하증권 서비스를 세계 최초로 상용 제공한 것은 Rule Book 기반의 Bolero이며, TradeCard는 무역대금 결제·서류 매칭 중심의 플랫폼이다."},{"id":"18b3bd4653","s":1,"n":"86","q":"FCL화물을 운송할 경우 운송인의 면책조항으로 통상 선화증권의 물품명세란에 삽입되는 조항은?","o":["More or Less Clause","Unknown Clause","Force Majeure Clause","Arbitration Clause"],"a":1,"e":"FCL은 화주가 직접 적입·시봉하여 운송인이 내용물을 확인할 수 없으므로 \"Shipper's load and count\", \"said to contain\" 등 부지약관(Unknown Clause)을 물품명세란에 삽입해 면책을 확보한다."},{"id":"86a9818a92","s":1,"n":"87","q":"선하증권의 법적 의미로서 맞지 않는 것은?","o":["권리증권","영수증","운임표","계약증서"],"a":2,"e":"선하증권은 화물의 수취를 증명하는 영수증, 운송계약의 증거서류, 화물인도청구권을 표창하는 권리증권(document of title)이다. 운임은 임의기재사항일 뿐 증권이 운임표는 아니다."},{"id":"51346e0bff","s":1,"n":"88","q":"다음의 Stable B/L과 관련된 설명 중 적합하지 않은 것은?","o":["선하증권의 어떤 형태를 말하는 것은 아니다.","B/L의 제시시기가 필요이상으로 지연되었을 때 지연된 선하증권을 의미한다.","신용장에 선적일 이후 서류를 제시하여야 할 기한을 규정하지 않는한 선적일 이후 20일 이내에 제시하여야 한다.","신용장에 \"Stable B/L acceptable\"이란 문언이 없으면 B/L 발행일자 이후 21일 경과한 것은 수리를 할 수 없다."],"a":2,"e":"UCP600에 따르면 신용장에 제시기한이 정해지지 않은 경우 선적일 후 21일 이내(신용장 유효기일 내)에 서류를 제시해야 하며, 이를 넘기면 Stale B/L로 수리 거절된다. 20일이 아니다."},{"id":"95dd00efc6","s":1,"n":"89","q":"선하증권을 재발급을 요청사유와 요청자에 관한 설명 중 적당하지 않은 것은?","o":["송하인이 OBL을 은행에 네고하기 전에 분실한 경우 - 송화인","송하인이 네고한 후 그 네고은행과 신용장개설은행간에 우송 중 분실한 경우 - 송화인","수하인이 네고은행과 신용장개설은행 간에 우송 중 분실한 경우 - 수하인","수하인이 개설은행으로부터 신용장 대금을 지급하고 OBL을 취득한 이후 그것을 소지하고 있던 자가 분실 한 경우 - 수하인"],"a":2,"e":"네고은행과 개설은행 사이 우송 중 분실은 아직 수하인이 증권을 취득하기 전 단계이므로 재발급 요청 주체는 송하인(및 네고은행)이며, 수하인이 요청할 지위에 있지 않다."},{"id":"05617bde3d","s":1,"n":"90","q":"다음에서 선하증권의 실무상의 문제점으로 언급되는 사항으로 타당하지 않은 것은?","o":["선하증권이 화물보다 늦게 도착하는 문제","선하증권의 보증도 문제","선하증권원본의 문제","선하증권의 유통성문제"],"a":3,"e":"유통성(negotiability)은 선하증권의 본질적 장점이자 존재 이유로 문제점이 아니다. 실무상 문제로는 증권이 화물보다 늦게 도착하는 지연, 보증도(L/G 인도), 원본 분실·관리 문제가 거론된다."},{"id":"094c0cb768","s":1,"n":"91","q":"다음 중 선하증권원본의 분실문제에 대한 설명으로 타당하지 않은 것은?","o":["비용과 위험 부담","선하증권의 재발행절차의 복잡성","선하증권의 보증도","공시최고, 제권판결 등 선하증권권리의 회복절차의 복잡성 및 장기간이 소요로 현실성 없음."],"a":2,"e":"보증도(L/G delivery)는 원본이 화물보다 늦게 도착할 때 화물을 먼저 인도하는 관행의 문제로 분실 문제와는 구별된다. 분실 문제는 비용·위험 부담, 재발행 절차와 제권판결 절차의 번잡성이다."},{"id":"2c87bd88ad","s":1,"n":"92","q":"다음 주어진 수출화물의 선적 상황 하에서 발생되는 선하증권의 표기 내용 중 적합하지 않은 것을 고르시오. [FOB 부산으로 하여 양말 150박스를 20ft 컨테이너에 FCL로 운송계약을 체결하였으나 생산지까지 컨테이너가 들어올 수 없어서 부산항의 CFS에 반입하여 젖재하여 선적하였음]","o":["One container said to contain 150 box","Port of loading : Busan","Shipper's load and count","Freight : collect"],"a":2,"e":"CFS에서 운송인(또는 CFS operator)이 적입한 화물은 운송인이 수량을 확인한 것이므로 화주 적입을 전제로 한 \"Shipper's load and count\" 표기는 부적합하다. FOB이므로 Freight collect는 옳다."},{"id":"baf13efe3e","s":1,"n":"93","q":"다음에서 SWB(Sea Waybill)의 활용이 선하증권문제의 해결에 도움이 된다는 논거와 해당사항이 없는 것은?","o":["SWB의 소지여부가 수하(受荷)의 권리와 관계없다.","화물인도와 SWB과 상환할 필요가 없다.","SWB은 분실되어도 위험이 수반되지 않는다.","화물에 대한 물권적 효력이 있다."],"a":3,"e":"Sea Waybill은 유통증권이 아닌 단순 운송계약·화물수취 증거서류로서 권리증권성(물권적 효력)이 없다. 그래서 상환 없이 인도되고 분실 위험도 작은 것이다."},{"id":"0bbecc793c","s":1,"n":"94","q":"다음에서 SWB의 활용이 가능한 운송물이 아닌 것은?","o":["개인용품 및 이사화물","NVOCC간의 운송화물","고가격의 물품","견본품"],"a":2,"e":"SWB은 권리증권이 아니어서 담보력이 없으므로 은행 담보나 전매가 필요한 고가품 운송에는 부적합하다. 이사화물·개인용품, NVOCC 간 화물, 견본품 등 전매 가능성이 낮은 화물에 활용된다."},{"id":"e1c2a8ea76","s":1,"n":"95","q":"다음에서 화물의 수입운송의 절차를 간략하게 열거한 것으로 알맞은 것은?","o":["청약접수 - 선적서류입수 - 신용장 개설 - 수입통관 - 화물인출","선적서류입수 - 청약접수 - 신용장개설 - 화물인출 - 수입통관","신용장개설 - 선적서류입수 - 청약접수 - 수입통관 - 화물인출","청약접수 - 신용장개설 - 선적서류입수 - 수입통관 - 화물인출"],"a":3,"e":"수입운송은 청약접수(계약) → 신용장 개설 → 선적서류 입수 → 수입통관 → 화물인출(D/O에 의한 반출) 순으로 진행된다."},{"id":"3a01c36649","s":1,"n":"96","q":"다음에서 항만의 사용목적에 따른 분류로서 해당되지 않는 것은?","o":["상업항(Commercial Harbor)","하구항(Estuary Harbor)","검역항(Quarantine Harbor)","공업항(Industrial Harbor)"],"a":1,"e":"하구항(Estuary Harbor)은 지형·입지에 따른 분류다. 사용목적에 따른 분류는 상업항, 공업항, 어항, 검역항, 군항, 피난항 등으로 나뉜다."},{"id":"9d2d45e86d","s":1,"n":"97","q":"다음 선하증권의 기재사항중 ETA와 ETD를 파악할 수 있도록 하여 선하증권의 진위여부를 확인할 수 있는 정보를 제공하는 사항은?","o":["B/L Issuing Date","Shipping Port, Unloading Port","Voyage No. 와 On Board Date","Ocean Vessel Name"],"a":2,"e":"항차번호(Voyage No.)와 본선적재일(On Board Date)을 통해 해당 선박의 ETA·ETD 및 실제 운항 스케줄과 대조가 가능하므로 선하증권의 진위 확인 정보로 활용된다."},{"id":"d02ce05bf5","s":1,"n":"98","q":"다음 항만의 주요시설 중 안벽(quey)의 부속물의 분류에 해당되지 않는 것은?","o":["펜더(Fender)","계선주(Mooring post)","부두(wharf)","해분(ocean basin)"],"a":2,"e":"부두(wharf)는 선박이 접안하는 계류시설 자체이지 안벽의 부속물이 아니다. 안벽 부속물은 펜더(방충재), 계선주(bollard·mooring post), 캡스턴, 계선환 등이다."},{"id":"1927809bc7","s":1,"n":"99","q":"중앙정부 또는 지방정부가 일정수의 위원을 선출하여 독립된 운영체를 구성하여 항만을 운영관리하는 형태는?","o":["국유제(Nationalized port)","공영자치제(Authority port)","사유제(Private port)","시유제(Municipal port)"],"a":1,"e":"중앙·지방정부가 위원을 선임해 독립된 운영주체(Port Authority)를 구성하여 항만을 관리·운영하는 형태가 공영자치제이며, 국유제·시유제·사유제와 구분된다."},{"id":"cb33f670fd","s":1,"n":"100","q":"다음에서 컨테이너 터미널의 제시설을 설명한 것으로 해당사항이 먼 것은?","o":["에이프런(apron) - 컨테이너 전용의 갠트리 크레인이 안벽전체에 걸쳐 사용될 수 있도록 크레인용 레일이 설치되어 있는 곳이다.","마셜링 야드(marshalling yard) - 에이프런의 내륙 쪽에 컨테이너를 쌓아 둔 넓은 장소이다.","컨테이너 프레이트 스테이션(container freight station) - LCL 화물을 목적지별로 분류한 다음 컨테이너에 적입하는 장소이다.","컨테이너 야드(container yard) - yard operation을 총괄하는 사령실로 화물의 배치,하역 작업에 대한 계획, 지시, 감독을 행한다."],"a":3,"e":"야드 작업을 총괄하며 화물 배치와 하역계획·지시·감독을 수행하는 곳은 컨트롤 타워(control tower·통제실)다. 컨테이너 야드(CY)는 컨테이너를 인수·인도·보관하는 장소다."},{"id":"bab75fe1ae","s":1,"n":"101","q":"다음 중 신용장에 대한 설명으로 맞는 것은?","o":["수입업자의 거래 제의(inquiry)이다.","수입업자의 주문에 대한 수출업자의 수주이다.","자국의 거래 은행을 통해 수출업자의 거래 은행 앞으로 개설한다.","송하인에게 화물의 제조 완료 시점을 알리는 것이다."],"a":2,"e":"신용장(L/C)은 수입업자(개설의뢰인)의 요청으로 자국 거래은행이 수출업자의 거래은행을 통해 수출업자를 수익자로 개설하는 조건부 지급확약이다. 거래제의(inquiry)나 수주 확인, 제조완료 통지와는 성질이 다르다."},{"id":"31a523f3a8","s":1,"n":"102","q":"다음에서 컨테이너 터미널이 기본적으로 갖추고 있는 시설이라고 할 수 없는 것은?","o":["방파제","에이프런(apron)","마셜링 야드(marshalling yard)","컨테이너 야드(container yard)"],"a":0,"e":"방파제(breakwater)는 항만 외곽시설로 터미널 자체 시설이 아니다. 컨테이너 터미널의 기본 시설은 안벽과 에이프런, 마셜링 야드, CY·CFS 등 하역·장치 관련 설비다."},{"id":"430c4e48f6","s":1,"n":"103","q":"다음 중 EDI에 의한 항만 운영 정보 시스템(PORT-MIS)의 장점이라 할 수 있는 것은?","o":["사람이 정보를 처리하므로, 부가가치가 많이 발생한다.","문서없는 체제이지만, 종이가 낭비되는 것은 여전하다.","사람과 사람사이 접촉해서 일을 처리하므로, 정확하게 일을 처리할 수 있다.","사람이 일일이 방문하는 데 따른 인건비와 교통비 등 많은 비용이 절감된다."],"a":3,"e":"EDI 기반 PORT-MIS는 방문·대면 없이 입출항 신고 등을 전산 처리하므로 인건비와 교통비 등 거래비용이 크게 절감된다. 무서류(paperless)·자동처리가 핵심이어서 나머지 설명은 반대다."},{"id":"e000da8b0c","s":1,"n":"104","q":"다음 중 방수, 방습, 방청을 요하는 제품을 포장하는 데 사용되는 포장 방법은?","o":["밀폐형(close type) 목상자","개방형(open type) 목상자","팔랫(pallet) 포장","번들(bundle)포장"],"a":0,"e":"방수·방습·방청이 요구되는 제품은 외기와 차단되는 밀폐형(close type) 목상자로 포장한다. 개방형 목상자나 팔레트·번들 포장은 통기 구조여서 습기와 염분 침입을 막지 못한다."},{"id":"628769b046","s":1,"n":"105","q":"다음 중 화물이 바다에 추락하는 것을 방지하기 위해 사용되는 하역용구는?","o":["핸드트럭","지게차","카고슈트","카고네트"],"a":3,"e":"카고네트(cargo net)는 슬링 화물을 그물로 감싸 낙하와 해상 추락을 막는 하역용구다. 핸드트럭·지게차는 하역운반기기, 카고슈트는 화물을 활강시키는 이송장치다."},{"id":"b1e2cdeb4e","s":1,"n":"106","q":"다음에서 장기간 화물을 보관할 수 있고 화물의 가공, 검사 등이 가능한 설비는 무엇인가?","o":["장치장(yard)","창고(warehouse)","상옥(shed)","부선(barge)"],"a":1,"e":"창고(warehouse)는 지붕과 벽을 갖춘 보관시설로 야드나 상옥(shed)과 달리 장기 보관은 물론 화물의 가공·검사·분류 등 부가작업까지 수행할 수 있다."},{"id":"f5223d8a98","s":1,"n":"107","q":"다음 중 선창 내에 적재된 화물의 손상 방지와 선체 보호를 위한 설비가 아닌 것은?","o":["카고슬링(cargo sling)","보텀실링(bottom ceilling)","통풍기(ventilator)","사이드스파링(side sparring)"],"a":0,"e":"카고슬링(cargo sling)은 화물을 매달아 옮기는 하역용구일 뿐 선창 내 보호설비가 아니다. 보텀실링과 사이드스파링은 선체·화물 간 완충 격리, 통풍기는 발한(sweat) 방지 설비다."},{"id":"6946eab989","s":1,"n":"108","q":"다음에서 갑판상에 설치되어 있고, 하역 작업에 가장 많이 사용되는 크레인은?","o":["겐트리 크레인","해상크레인","덱크레인","다리형크레인"],"a":2,"e":"덱크레인(deck crane)은 갑판에 상시 설치되어 본선 하역에 가장 널리 쓰인다. 겐트리·다리형 크레인은 안벽의 육상 설비이고, 해상크레인은 중량물 전용 부선 설비다."},{"id":"093c9ec4cb","s":1,"n":"109","q":"다음에서 하역용 원치의 구비요건 중 맞는 것은?","o":["역전 장치가 없을 것","감는 속도가 항상 일정할 것","전문 기능인만 취급이 가능할 것","정격 하중을 정격 속도로 감아 들일 수 있을 것"],"a":3,"e":"하역용 윈치는 정격하중을 정격속도로 안전하게 감아올릴 수 있어야 한다. 역전(역회전) 장치와 속도 조절 기능이 필수이며, 조작이 단순·안전해야 하므로 나머지는 요건에 반한다."},{"id":"1a7b08a929","s":1,"n":"110","q":"항해 시의 화물의 관리 중 가장 중요한 사항은 무엇인가?","o":["선창 청소","통풍 환기","빌지 측심","풍향, 풍속측정"],"a":1,"e":"항해 중 화물관리의 핵심은 통풍·환기로, 선창 내외 온습도 차에 의한 발한(ship's sweat)과 그에 따른 곰팡이·녹·변질을 방지하는 것이다. 빌지 측심 등은 보조적 관리다."},{"id":"710ce6cfcd","s":1,"n":"111","q":"다음 중 적화계획 작성 시 고려해야 할 사항이 아닌 것은?","o":["화물의 성질 및 포장","운송 기간 및 기후","선박의 구조 설비","본선의 여객수"],"a":3,"e":"적화계획(stowage plan)은 화물의 성질과 포장, 항해기간과 기후, 선박의 구조·하역설비, 항구별 양적하 순서와 복원성을 고려한다. 여객 수는 화물 적재와 무관한 항목이다."},{"id":"3215975bbc","s":1,"n":"112","q":"다음 중 하역의 요점으로 해당사항이 먼 것은?","o":["최대량의 화물 적재","신속한 하역","편리한 하역","안전한 하역"],"a":2,"e":"하역의 요점은 신속·안전·경제성 확보와 화물·선체 손상 방지에 있다. '편리한 하역'은 작업 여건에 관한 부수 조건이어서 하역의 핵심 요점으로 열거되지 않는다."},{"id":"f5821381f1","s":1,"n":"113","q":"화물의 선적시 및 양화시에 편리하게 이용하는 것으로, 화물의 적재상태를 기입한 것은?","o":["적화척도","화물 적재도","적화용적도","배수량등곡선도"],"a":1,"e":"화물 적재도(stowage plan)는 선창·창구별 화물의 종류·수량·적재위치를 도시해 선적과 양하 시 바로 참조하는 도면이다. 적화용적도나 배수량등곡선도는 선박 계산용 자료다."},{"id":"6216dde0ef","s":1,"n":"114","q":"다음 중 컨테이너 외부에 표시되는 항목이 아닌 것은?","o":["소유자의 기호 및 번호","최대총중량","적재선박의 이름","소유자의 국적명"],"a":2,"e":"컨테이너 외부에는 소유자 기호·컨테이너 번호, 소유자 국적·등록기호, 최대총중량(MGW)·자중·용적 등 규격 표시를 한다. 적재 선박명은 항차마다 달라져 표시 대상이 아니다."},{"id":"0844332cf1","s":1,"n":"115","q":"다음 중 B/L을 분할하여 수입신고 할 수 있는 경우가 아닌 것은?","o":["일괄사후납부 적용, 비적용물품을 구분하여 신고하자고 하는 경우","신고물품중 일부가 통관이 보류된 경우","검사, 검역결과 전 물품에 대하여 합격된 경우","B/L을 분할하여도 물품검사 및 과세가격 산출에 어려움이 없는 경우"],"a":2,"e":"검사·검역에서 전량 합격했다면 구분 신고할 실익이 없어 B/L 분할 대상이 아니다. 분할은 일부 통관보류, 사후납부 적용·비적용 구분 등 필요가 있고 검사·과세가격 산출에 지장이 없을 때 허용된다."},{"id":"12896b1a8f","s":1,"n":"116","q":"다음에서 컨테이너 터미널의 기본적인 기능과 관계가 없는 것은?","o":["하역기능","혼재기능","보관기능","포장기능"],"a":3,"e":"컨테이너 터미널의 기본 기능은 하역(선적·양하), 보관·장치, CFS를 통한 혼재(consolidation)와 컨테이너 수급·수리다. 화물 포장은 화주 단계의 업무여서 터미널 기능이 아니다."},{"id":"acb4cb6982","s":1,"n":"117","q":"다음 컨테이너 운송과정에서 보관기능과 관련이 없는 것은?","o":["컨테이너 야드","에이프런","내륙 컨테이너 기지","마샬링 야드"],"a":1,"e":"에이프런(apron)은 안벽과 마셜링 야드 사이의 하역작업 공간으로 갠트리크레인이 작업·이동하는 통로이며 보관 기능이 없다. CY, 마셜링 야드, ICD는 장치·보관 기능을 갖는다."},{"id":"2399582ba8","s":1,"n":"118","q":"다음 중 국제 운송의 목표에 대하여 에 대하여 서술한 것 중 그 내용이 부적합 한 것?","o":["국제간 물적이동을 효율적으로 추진하여 재화의 소비 효용을 증대","화물운송이 저렴한 비용으로 결정하여 수입지에서 가격 경쟁력을 유지","안정하고 정확하게 운송되어 수입상이 당해 수입화물의 처분이 용이","운송의 독점성이 중요하므로 운송인의 전횡으로 면책이 불 필요"],"a":3,"e":"국제운송의 목표는 저비용·정확·안전한 수송으로 재화의 소비효용과 가격경쟁력을 높이는 것이다. 운송인의 독점과 전횡을 전제로 면책을 부정하는 논리는 목표가 될 수 없다."},{"id":"99d95eeb29","s":1,"n":"119","q":"국제 무역거래에서 해상운송과 함께 도로, 철도, 하천, 호수를 이용한 운송의 형태는 다음 중 어느 것인가?","o":["내륙운송","해상운송","항공운송","복합운송"],"a":0,"e":"해상운송에 접속되는 도로·철도·하천·호수(내수로) 구간은 내륙운송(inland transport)에 해당한다. 복합운송은 이러한 구간들을 단일계약·단일책임으로 묶은 상위 개념이다."},{"id":"d58eaeb5d9","s":1,"n":"120","q":"1960년대 들어 국제간 교역량이 확대되어 적어도 두가지 이상의 운송수단에 의하여 물품을 운송하기 위한 단일계약에 의해 이루어지는 물품운송은?","o":["내륙운송","해상운송","항공운송","복합운송"],"a":3,"e":"서로 다른 두 가지 이상의 운송수단을 단일계약·단일책임·일관운임으로 연결하는 것이 복합운송(multimodal transport)이며, 컨테이너화와 함께 1960년대에 본격화되었다."},{"id":"95a8a60b2b","s":1,"n":"121","q":"다음 중 복합운송의 요건과 거리가 먼 것은?","o":["단일운송계약과 단일 책임(uniform liability)","일괄운임(through rate)의 적용","복합운송증권(multimodel trasnport document:MTD)의 발행","단일화 된 운송수단(Single modes of transport)의 이용"],"a":3,"e":"복합운송의 요건은 이종 운송수단의 결합, 단일운송계약과 단일책임, 일관운임(through rate), 복합운송증권(MTD) 발행이다. 단일 운송수단만 이용하는 것은 개념 자체와 모순된다."},{"id":"d33bd78331","s":1,"n":"122","q":"다음의 운송형태 중에서 Land Bridge방식을 이용하고 있는 것은?","o":["해공복합운송","해상운송","해륙복합운송","항공운송"],"a":2,"e":"랜드브리지는 해상-육상-해상(sea-land-sea)으로 대륙 철도를 교량처럼 활용하는 방식이므로 해륙복합운송에 속한다. ALB·CLB·SLB·MLB가 대표적 형태다."},{"id":"b26ae54bd5","s":1,"n":"123","q":"해공복합운송에 대한 설명 중 적합하지 않은 것은?","o":["해상운송이 가지는 저운임과 항공운송이 갖는 신속성을 효과적으로 결합","일반적인 항로는 일본과 북미서해안간의 태평양해상에서는 해상운송을 이용하고, 미국내륙 및 미국과 유럽간에는 항공운송을 이용","대륙과 해상을 잇는 교량역할을 하는 land bridge 방식으로 이용","운송일수가 대폭 단축되며, 항공운송만 이용하는 경우에 비해 소요운임이 적게드는 이점"],"a":2,"e":"랜드브리지는 대륙 철도로 해상 구간을 연결·단축하는 해륙복합운송 방식이므로 해공복합운송의 설명이 될 수 없다. 해공복합운송은 해상의 저운임과 항공의 신속성을 결합한 형태다."},{"id":"1ac25fd7bd","s":1,"n":"124","q":"복합운송에서 일관운임(Through rate)의 설정에 대한 설명으로 타당하지 않은 것은?","o":["복합운송의 서비스 대가로 각 운송구간마다 분할된 운임을 설정해야 한다.","운송구간에 대한 책임이 복합운송인에게 집중되어 있으므로 이에 대한 반대 급부도 하나로 통합되어야 한다.","복합운송의 서비스 대가로 전 운송구간의 단일화된 운임을 설정하여야 한다.","일관운임의 산출은 단순 합산이 아닌 Scale merit(규모의 경제)가 반영되어 산출하여 합리적인 요율을 제시할 수 있다."],"a":0,"e":"일관운임(through rate)은 전 운송구간을 하나로 묶은 단일 운임이다. 책임이 복합운송인에게 집중되므로 반대급부도 통합되어야 하고 규모의 경제가 반영되며, 구간별 분할 운임은 개념에 반한다."},{"id":"9593d7ef52","s":1,"n":"125","q":"화주에 대해 운송계약의 체결자인 복합운송인이 전 운송구간에 대한 책임을 지지만, 그 책임은 운송구간 고유의 원칙에 의하는 체계는 다음 중 어느 것인가?","o":["단일책임체계(Uniform Liability System)","이종책임체계(Network Liabilty System)","변형단일책임체계(Modified Liability System)","단일운송인책임체계(Single Carrier's Liability System)"],"a":1,"e":"전 구간 책임은 복합운송인이 지되 손해발생 구간 고유의 법규(헤이그규칙·바르샤바조약·CMR·CIM 등)를 적용하는 방식이 이종책임체계(network liability system)다."},{"id":"7b17b2dd7d","s":1,"n":"126","q":"Land Bridge의 목적으로 적당하지 않은 것은?","o":["운송비용의 절감","전체 소요시간의 감소","주요 내륙운송망에 탁월한 접근성을 가진 소수의 항만에 화물량을 집중","해상-육상-해상으로 이어지는 운송구간으로 해상운송구간을 집중하기 위한 운송 증감"],"a":3,"e":"랜드브리지의 목적은 운송비와 총 소요시간 절감, 내륙 접근성이 좋은 소수 거점항으로의 화물 집중이다. 해상운송 구간을 늘리는 것이 아니라 대륙 육상운송으로 대체해 단축하는 것이 본질이다."},{"id":"f422f6be22","s":1,"n":"127","q":"Land Bridge의 특징을 서술한 것으로 적합하지 않은 것은?","o":["단일운송수단의 통제와 책임","단일 선하증권","Sea-Land-Sea 방식을 통한 복합운송의 형태","해공복합운송의 한 형태"],"a":3,"e":"랜드브리지는 Sea-Land-Sea 방식을 단일 선하증권과 단일 운송인 책임으로 묶은 해륙복합운송이다. 해공복합운송의 한 형태라는 서술은 사실과 다르다."},{"id":"8144b16b75","s":1,"n":"128","q":"시베리아를 육상가교로 하여 한국, 일본, 극동, 동남아, 호주 등과 유럽대륙, 스칸디나비아반도를 연결하는 복합운송형태는?","o":["ALB(American Land Bridge)","CTB(Canadian Land Bridge)","SLB(Siberian Land Bridge)","MLB(Mini Land Bridge)"],"a":2,"e":"시베리아 횡단철도(TSR)를 육상가교로 극동·동남아·호주와 유럽·스칸디나비아를 잇는 것이 SLB다. ALB·CLB는 북미 대륙 횡단, MLB는 미국 내륙 거점항까지의 단축 경로다."},{"id":"4508ae2491","s":1,"n":"129","q":"SLB(Siberian Land Bridge)의 특성을 설명한 것 중 거리가 먼 것은?","o":["SLB의 운영주체는 TSR(Trans Siberian Railway)이다.","1971년 부터 본격 개시되어 한국, 대만, 홍콩, 필리핀, 호주, 뉴질랜드까지 집하지역이 확대되었다.","부산~보스토치니(Vostochny)간을 컨테이너선으로 해상운송한 후 시베리아 철도의 컨테이너전용열자(block train)으로 러시아의 유럽국경까지 운송한 후 유럽의 철도, 트럭, 선박을 이용하는 복합일관운송한다.","1979년 일본의 포워더에 의해서 개발된 운송루트이다."],"a":3,"e":"SLB는 구소련이 TSR을 기반으로 1960년대 후반 시험운송을 거쳐 1971년부터 본격 운영한 경로다. 1979년 일본 포워더가 개발했다는 서술은 사실과 다르다."},{"id":"e01f461bc2","s":1,"n":"130","q":"부산에서 로테르담간 루트별 B26수송거리를 비교한 것 중 사실과 관계가 먼 것은?","o":["시베리아(Siberia) 철도 경유 ~ 13,000㎞","수에즈(Swez)운하 경유 - 20,000㎞","케이프타운(Cape Town) 경유 ~ 27,000㎞","피나마(Panama) 경유 ~ 23,000㎞"],"a":1,"e":"부산~로테르담은 SLB(시베리아철도) 경유가 약 13,000km로 최단이고, 파나마운하 경유 약 23,000km, 케이프타운 경유 약 27,000km 순으로 길어진다. 수에즈 경유 수치가 교재 비교표와 어긋나 사실과 거리가 있는 항목으로 처리된다."},{"id":"16815a787c","s":1,"n":"131","q":"IPI(Interior Point Internmodal)의 특징을 설명한 것 중 해당사실이 아닌 것은?","o":["선사 자신이 내륙까지의 B/.L을 발급한다.","최근에는 화주운전(door)까지 운송을 수배하는 Store Delivery Service도 성행한다.","최종목적지로의 인도까지 모두 선사가 수배한다.","Port to Port의 운송서비스를 말한다."],"a":3,"e":"IPI(내륙지점 복합운송)는 선사가 내륙지점까지 자기 B/L을 발행하고 최종 목적지 인도까지 수배하는 방식이다. 항구 간(port to port) 서비스라는 설명은 IPI의 정의에 정면으로 반한다."},{"id":"909058a66d","s":1,"n":"132","q":"1964년에 Air Canda가 개발한 최초의 해공복합운송 루트는 다음 중 어느 것인가?","o":["러시아 경유 해공복합운송","북미서안 경유 해공복합운송","동남아시아 경유 해공복합운송","동유럽 해공복합운송"],"a":1,"e":"최초의 해공복합운송(sea & air)은 1964년 에어캐나다가 개발한 북미 서안(밴쿠버) 경유 루트로, 태평양은 해상운송, 이후 내륙·대서양 구간은 항공운송으로 연결했다."},{"id":"8bbb1727ed","s":1,"n":"133","q":"이종 및 동종 수송수단을 조합하여 수송하는 운송인은?","o":["송화인","수화인","중개인","복합운송인"],"a":3,"e":"자기 명의로 전 구간 운송계약을 체결하고 이종·동종 운송수단을 조합해 수송하는 자가 복합운송인(MTO)이다. 송·수화인은 계약 상대방이고 중개인은 주선 기능에 그친다."},{"id":"9e764a83c5","s":1,"n":"134","q":"다음 중 복합운송인(Multimodal Transport Operator: MTO)에 대한 설명으로 적합하지 않은 것은?","o":["전체의 운송계약구간에 대하여 운송인으로서의 지위에서 복합운송증권을 발행한다.","운송의 전과정에서 발생한 손해에 대한 책임이 집중된다.","반드시 대리인을 통해서 운송계약을 체졀한 계약당사자이어야만 한다.","운송에 참가하는 구간운송인은 복합운송인의 이행보조자의 관계이다."],"a":2,"e":"MTO는 자기 이름으로 직접 운송계약을 체결하는 계약당사자이며 반드시 대리인을 거칠 필요가 없다. 책임 집중, 복합운송증권 발행, 구간운송인의 이행보조자 지위는 옳은 설명이다."},{"id":"4ba914819c","s":1,"n":"135","q":"우리나라의 복합운송인에 대한 설명으로 적합하지 않은 것은?","o":["운송인 기능을 수행하기 때문에 실제 운송인과 똑같은 운송책임을 부담한다.","운송 책임 부보에 대한 증거문서인 복합운송증권(CTD)을 발행한다.","모두 FIATA B/L을 발행한다.","단순포워딩과 복합운송이 엄격히 분리되어 있어서 영업적 지위가 다르다."],"a":3,"e":"우리나라는 국제물류주선업자가 단순 주선과 복합운송을 함께 수행하므로 두 영업이 엄격히 분리되어 있지 않다. 참고로 FIATA B/L은 FIATA 회원사만 발행하므로 '모두 발행'도 엄밀히는 부정확하다."},{"id":"18216cba32","s":1,"n":"136","q":"복합운송인의 요건에 대하여 설명한 것으로 적당하지 않은 요건은 다음 중 어느 것인가?","o":["운송책임의 단일성","여러 개의 계약으로 다수의 구간운송 행위를 실행","복합운송증권의 발행","일관운임의 설정"],"a":1,"e":"복합운송인의 요건은 운송책임의 단일성, 복합운송증권 발행, 일관운임 설정이다. 구간별로 여러 개의 계약을 나누어 체결하면 복합운송이 아니라 개별 운송의 연속에 불과하다."},{"id":"576e578b78","s":1,"n":"137","q":"복합운송이 되기 위해서 복합운송인이 화주에 대해서 유가증권으로 복합운송증권을 발행하는 이유는?","o":["법적으로 운송책임을 단일화 시키기 위함","운송책임의 다양성과 표리의 관례를 위함","구간별 운송의 책임을 송화인과 함께 분담하기 위함","전체운송기간을 단축하기 위함"],"a":0,"e":"복합운송증권(MTD)을 유가증권으로 발행하는 것은 전 구간의 운송책임을 복합운송인에게 단일화·집중시키고 이를 법적으로 표창하기 위함이다. 책임 분담이나 기간 단축이 목적이 아니다."},{"id":"3430527ebc","s":1,"n":"138","q":"복합운송의 유형 중 운송수단을 직접보유하지 않았지만 운송주체의 제반기능과 책임, 의무를 수행하는 일종의 계약운송인은?","o":["캐리어형 복합운송인(Carrier operator)","포워더향 복합운송인","NVOCC(Non Vessel Operation Common Carrier)형 복합운송인","해상운송인(Ocean Common Carrier)"],"a":1,"e":"선박 등 운송수단을 직접 보유하지 않으면서 계약운송인(contracting carrier)으로서 운송주체의 기능과 책임을 지는 유형이 포워더형 복합운송인이다. 캐리어형은 실제운송인, NVOCC는 미국법상 무선박 해상운송인 개념이다."},{"id":"4a63aae079","s":1,"n":"139","q":"이종책임체계(Network Liability System)에서 각 운송구간 고유의 원칙에 따른 책임규칙으로 적합하지 않은 것은?","o":["해상운송구간 - 헤이그규칙(Hague Rules)","항공운송구간 - 바르샤바조약(Warsaw Convention)","도로운송구간 - 도로화물운송조약(CMR) 또는 각국의 일반화물 자동차 운송약관","철도운송구간 - 에이그-비스비규칙(Hahue-Visby Rules)"],"a":3,"e":"이종책임체계에서 철도운송구간에는 국제철도물품운송조약(CIM)이 적용된다. 헤이그-비스비규칙은 해상운송 구간에 적용되는 규범이므로 철도구간 준거법으로 맞지 않는다."},{"id":"5207c4bc16","s":1,"n":"140","q":"복합운송의 Modified Uniform Liability System(변형단일책임체제)를 채책한 국제조약규칙이 아닌 것은?","o":["1978년 Harmburg Rules","1956년 도로화물운송조약(CMR)","1992년 UNCTAD/ICC 복합운송증권규칙","1980년 UN국제복합 운송조약"],"a":1,"e":"변형단일책임체계는 1978년 함부르크규칙, 1980년 UN국제복합운송조약, 1992년 UNCTAD/ICC 규칙에 반영되었다. CMR은 도로 단일운송 조약으로 이종책임체계의 도로구간 준거법이다."},{"id":"d675f04637","s":1,"n":"141","q":"복합운송에 대한 각 조약(규칙)뼐 책임한도액으로 적합하지 않은 것은?","o":["Hague-Visby Ruels(1968) - 30 포앙카레프랑 (약 US $2.00)","Hamburg Rules(1978) - 2.5 SDR (약 US $3.50)","CMR(1956) - 50제미날 프랑 (약 US $ 16.00)","UNCTAD/ICC(1992) - 2 SDR (약 US $2.80)"],"a":2,"e":"CMR(1956)의 책임한도는 화물 1kg당 25 제미날(금)프랑이며 50프랑이 아니다. 헤이그-비스비 30 포앙카레프랑, 함부르크 2.5 SDR, UNCTAD/ICC 2 SDR은 옳은 수치다."},{"id":"41e6cdf457","s":1,"n":"142","q":"1980년 UN 국제복합운송조약상의 운송인의 책임내용으로 적합하지 않은 것은?","o":["복합운송인의 책임은 과실책임주의에 의한다.","복합운송인의 책임한도액은 손해 발생국간이 판명된 때는 국제법, 국제조약 또는 UN 조약상의 책임한도액이 가장 높은 금액으로 한다.","복합운송인의 책임한도는 이종책임제계에 의하지 않고 변형단일책임체계에 의한다.","복압운송인에 의한 물품의 수취지 또는 인도지의 어느 한 국각가 체약국이면 UN 조약이 강제적을 적용될 수 없다."],"a":3,"e":"UN국제복합운송조약은 물품의 수취지 또는 인도지 중 어느 한쪽이 체약국이면 강제 적용된다. 과실책임주의 채택과 변형단일책임체계에 의한 한도 설정은 옳은 설명이다."},{"id":"dd769d2acc","s":1,"n":"143","q":"복합운송인의 책임제한에 관한 설명으로 바람직하지 않은 것은?","o":["멸실/훼손된 물품의 포장 당 666.67 SDR 또는 1㎏당 2 SDR 중 큰 금액으로 제한","해상운송이나 내수로운송이 포함된 경우는 물품의 1㎏당 8.33 SDR로 제한","특정구간에서 책임이 발생되었을 때는 그 구간에 적용되는 국제조약 또는 해당국의 강행법이 정한 책임한도액에 따름","지연손해의 책임한도는 복합운송계약에 의한 운임을 초과하지 않는 금액으로 제한"],"a":1,"e":"해상 또는 내수로 운송이 포함되지 않은 경우에 1kg당 8.33 SDR이 적용된다. 해상·내수로가 포함되면 포장당 666.67 SDR 또는 1kg당 2 SDR 중 높은 금액이 한도가 된다."},{"id":"4ed7589a58","s":1,"n":"144","q":"인도지연의 경우 복합운송인의 책임한도액에 대하여 서술한 것으로 적합하지 않은 것은?","o":["복합운송계약상의 운임총액을 상한으로 한다.","지연된 운송물에 대하여 지급되는 운임의 2.5배에 상당하는 금액으로 제한한다.","1978년 Hamburg Rule을 따른다.","지연과 일부 멸실, 훼손이 같이 발생할 경우는 해당 운송물의 전손(total loss)의 경우에 인정되는 한도액을 10% 초과한다."],"a":3,"e":"지연손해와 일부 멸실·훼손이 함께 발생하더라도 총 배상액은 해당 운송물 전손(total loss) 시 인정되는 한도액을 초과할 수 없다. 10% 초과 인정이라는 규정은 없다."},{"id":"fcd34ce7ac","s":1,"n":"145","q":"1975년 ICC의 국제복합운송증권에 관한 통일규칙에서 복합운송인의 주요 면책사항을 규정한 내용과 거리가 먼 것은?","o":["화주의 작위 또는 부작위로 기인한 손해 및 포장이나 기호의 오류 또는 불충분 등에 기인한 손해","불가항력 및 동맹파업 등에 기인한 손해","운송물의 고유의 하자 등에 의한 손해","특정구간에서 멸실 또는 훼손에 의한 손해"],"a":3,"e":"특정 구간에서 생긴 멸실·훼손은 면책사유가 아니라 그 구간에 적용되는 법규에 따라 복합운송인이 책임을 지는 사항이다. 화주 귀책·포장 불량, 불가항력·동맹파업, 화물 고유하자가 면책사유다."},{"id":"57b166a001","s":1,"n":"146","q":"다음 중 1992년 UNCTAD/ICC복합운송증권규칙에 대한 설명으로서 적합하지 않은 것은?","o":["이 규칙을 복합운송계약에 삽입시키는 경우 이 규칙이 적용되며, 이경우 단일운송 또는 복합운송계약이냐에 관계없이 적용됨","책임원칙은 변형단일책임체계을 원칙으로 함","인도지연에 따른 간접손해에 대해서는 운임의 2.5배 범위내에서 계상함","전손에 대한 책임한도액을 규정함"],"a":2,"e":"1992년 UNCTAD/ICC 규칙은 인도지연에 따른 간접·결과적 손해는 배상하지 않고 지연손해도 해당 운임 범위로 제한한다. 운임 2.5배 기준은 함부르크규칙 계열의 규정이다."},{"id":"46bf3dce24","s":1,"n":"147","q":"Freight Forwarder가 화주의 화물을 요구하는 목적지까지 안전하고 신속하게 운송하는데 이때 제공되는 서비스가 아닌 것은?","o":["통관 및 입출고","선적 및 운송","보험 및 운임료결정","집화 및 환적"],"a":2,"e":"프레이트 포워더는 집화·혼재·환적, 선적과 운송 주선, 통관·입출고, 보험 부보 대행 등을 제공하지만 운임률 자체를 결정하는 주체는 실제운송인인 선사(또는 운임동맹)다."},{"id":"32acc74e3a","s":1,"n":"148","q":"영국에서 선사를 위해 선복판매를 하며 그들의 일부는 지금도 선적중개인으로 활동하는 이는?","o":["Forwarding Agent","Shipping Agent","Insurance Agent","Trading Agent"],"a":1,"e":"영국에서 선사를 대리해 선복(space)을 판매하던 해운대리점(shipping agent)이 오늘날에도 선적중개인 역할을 수행한다. Forwarding agent는 화주 측 운송주선인이다."},{"id":"30051178fe","s":1,"n":"149","q":"최초 유럽에서 원래 소량화물을 철도화차 단위의 화물량으로 집화나 분배를 하는 사업가를 말하는 던 것은?","o":["Forwarding Agent","Shipping Agent","Insurance Agent","Trading Agent"],"a":0,"e":"유럽에서 소량화물(LCL)을 모아 철도화차 단위로 집화·분배하던 운송주선인이 포워딩 에이전트(forwarding agent)의 기원이며, 이것이 오늘날 프레이트 포워더로 발전했다."},{"id":"a8a2b4f602","s":1,"n":"150","q":"다음 중 Freight Forwarder에 대한 설명으로 적합하지 않은 것은?","o":["화주의 대리인으로 적절한 운송수단을 선택한다.","운송에 따르는 일체의 부대업무를 처리해준다.","집화, 분배, 혼재업무를 행하는 운송의 주체자로서의 기능을 지니고 있다.","독자적으로 영업망을 개설하거나 영업광고를 할 수 없다."],"a":3,"e":"포워더는 독립 사업자로서 자기 영업망을 개설하고 광고·집화 영업을 자유롭게 할 수 있다. 화주 대리인으로서 운송수단 선택, 부대업무 처리, 혼재를 통한 운송주체 기능은 옳은 설명이다."},{"id":"73b4bd4936","s":1,"n":"151","q":"Freight Forwarder의 업무 유형 중에서 복합운송인(MTO) 또는 무선박운송인(NVOCC)으로서 행동하는 유형은?","o":["Local 유형","International 유형","Carrier 유형","Deliverry 유형"],"a":2,"e":"포워더가 자기 명의로 운송계약을 체결하고 전 구간 운송책임을 지는 형태가 Carrier 유형이며, 선박 없이 운송인 역할을 하는 NVOCC·복합운송인(MTO)이 여기에 속한다."},{"id":"769b03d2a6","s":1,"n":"152","q":"다음 중 Freight Forwarder의 기능으로 적당하지 않은 것은?","o":["운송계약의 체결 및 선복의 예약","화물운송의 조언 및 관계서류의 작성","화물의 집화, 분배, 혼재서비스 제공","화주를 대신하여 직접 통관수속을 제공"],"a":3,"e":"통관은 관세사의 고유업무여서 포워더가 화주를 대신해 직접 통관수속을 수행할 수 없고 서류 준비·주선까지만 가능하다. 선복예약, 혼재·집화·분배, 운송 조언은 전형적 포워더 기능이다."},{"id":"dcb71dc4d2","s":1,"n":"153","q":"화주 측면에서 Freight Forwarder의 효용성을 설명한 것 중 거리가 먼 것은?","o":["수출업차(송하인)는 비용, 시간, 인력 절감 등을 꾀할 수 있다.","수입업자(수하인)는 화물수령에 필요한 서류의 작성 및 절차에 관한 서비스를 제공 받을 수 있다.","규모의 경제(Scale Merit)를 실형하여 그 이익을 수탁자인 화주가 수혜받로록 한다.","수출입업자가 스스로 수출입상뭄의 물류코스트를 파악하게 한다."],"a":3,"e":"포워더의 효용은 화주를 대신해 물류비를 관리·절감해 주는 데 있으므로, 수출입업자가 스스로 물류코스트를 파악하게 한다는 것은 효용성 설명으로 거리가 멀다."},{"id":"090f54dbeb","s":1,"n":"154","q":"미국의 Freight Forwarder는 그 종류에 따라 각기 다른 위원회의 규제를 받고 있는데 그 사실과 거리가 먼 것은?","o":["국내운송주선인(Domestic Freight Forwarder) - 주제통상위원회(Interstate Commerce Commission)","항공운송주선인(Air Frieght Forwarder) - 민간항공위원회(Civil Aeronautics Board)","해상운송주선인(Ocean Freight Forwarder) - 육해상운송위원회(Surface Transportation Board)","해상운송주선인(Ocean Freight Forwarder) - 연방해사위원회(Federal Maritime Commission)"],"a":2,"e":"해상운송주선인(Ocean Freight Forwarder)은 연방해사위원회(FMC) 규제 대상이고, Surface Transportation Board(구 ICC)는 철도·트럭 등 지상운송을 관할한다."},{"id":"8518ee268e","s":1,"n":"155","q":"미국의 국내운송주선인(Domestic Freight Forwarder)의 통상적인 업무내용과 거리가 먼 것은?","o":["화물의 집화, 혼재, 분배, 배송업무를 수행하거나 준비","수출품의 선적 또는 선적을 위한 선복예약","수령지부터 인도지까지 화물운송에 대한 책임","화물운송을 위하여 철도, 자동차, 수상운송수단을 이용하는 것"],"a":1,"e":"수출품 선적과 선복예약(booking)은 국제(해상)운송주선인의 업무이며, 국내운송주선인은 국내 집화·혼재·분배와 철도·트럭·내수로 이용, 수령지-인도지 간 운송책임을 담당한다."},{"id":"e3e64b637f","s":1,"n":"156","q":"우리나라에 Forwarding 제도가 도입된 시기는 언제 인가?","o":["1960년대 초","1950년대 말","1970년대 초","1970년대 말"],"a":2,"e":"우리나라 포워딩(운송주선) 제도는 컨테이너화가 본격화된 1970년대 초에 도입되었다."},{"id":"0d431d1ef7","s":1,"n":"157","q":"포워딩업체들이 해운항만청에 의해 해운운송주선업의 면허를 받아 영업을 시작한 년도는?","o":["1972년","1976년","1983년","1987년"],"a":1,"e":"1976년 해운항만청으로부터 해상운송주선업 면허를 받아 포워딩업이 제도권 영업을 시작하였다."},{"id":"0fc532945c","s":1,"n":"158","q":"우리나라에서 화물유통촉진법이 제정되어 복합운송주선업이 새로이 등장한 년도는?","o":["1983년","1987년","1991년","1993년"],"a":2,"e":"1991년 화물유통촉진법 제정으로 기존 해상운송주선업과 별도로 복합운송주선업이 신설되었다."},{"id":"94e4bb8162","s":1,"n":"159","q":"1993년 한국복합운송주선업협회(KMTA)가 어느 국제협회의 회원사로 등록함으로써 해상운송주선업체들과 마찬가지로 정식으로 FIATA B/L을 사용하게 되었는가?","o":["국제복합운송협회(FIATA)","국제상공회의소(ICC)","국제해운연맹(ISF)","국제해운회의소(ICS)"],"a":0,"e":"KMTA가 1993년 국제복합운송주선업협회연맹(FIATA)에 회원으로 가입함으로써 FIATA B/L(FBL) 사용 자격을 얻었다."},{"id":"afabd50ff7","s":1,"n":"160","q":"수출지의 Forwarder는 수출화주(Shipper, Seller, Consignor)로 부터 화물의 선적을 의뢰받게 되는데 이때 선적의뢰방법은?","o":["신용장개설은행( L/C Opening Bank)","선적요청서(Shipping Request)","전신환(Telegraphic Transfer)","화물인도지시서(Delivery Order)"],"a":1,"e":"화주는 선적요청서(Shipping Request, S/R)를 제출해 선적을 의뢰하며, 이 서류가 선복예약과 B/L 작성의 기초자료가 된다."},{"id":"ff6426ce29","s":1,"n":"161","q":"선적이 완료되면 포워더는 화주에게 포워더 B/L 발행하며, 선사는 이때 포워더에게 어떤 B/L을 발행하는가?","o":["통선하증권(Through B/L)","선적선하증권(Shipped B/L)","통상선사선하증권(Ocean Carrier B/L)","수취선하증권(Received B/L)"],"a":2,"e":"선사는 포워더를 송하인으로 하여 Master B/L(Ocean Carrier B/L)을 발행하고, 포워더는 실화주에게 House B/L을 발행하는 이중 구조를 취한다."},{"id":"084f8dd558","s":1,"n":"162","q":"다음 중 포워더가 발행하는 House B/L의 종류가 아닌 것은?","o":["한국국제물류협회선하증권(KIFFA B/L)","복합운송선하증권(FIATA B/L)","파트너 선하증권(Partner B/L)","기명식선하증권(Straight B/L)"],"a":3,"e":"기명식선하증권(Straight B/L)은 수하인 기명 여부에 따른 분류일 뿐 포워더 발행 House B/L의 종류가 아니며, KIFFA B/L·FIATA B/L 등이 House B/L에 해당한다."},{"id":"2806dec6f6","s":1,"n":"163","q":"다음 중 포워딩 업무가 서비스 단계의 구분에 알맞게 기술 된 것은?","o":["포장 - 국내운송 - 적하보험 부보 - 통관 - 하역 - 창고 및 보관 - 혼재 - 선적 - 도착지 인도","포장 - 국내운송 - 통관 - 적하보험 부보 - 하역 - 창고 및 보관 - 혼재 - 선적 - 도착지 인도","포장 - 국내운송 - 적하보험 부보 - 통관 - 창고 및 보관 - 하역 - 혼재 - 선적 - 도착지 인도","포장 - 국내운송 - 통관 - 적하보험 부보 - 창고 및 보관 - 하역 - 혼재 - 선적 - 도착지 인도"],"a":3,"e":"서비스 단계는 포장-국내운송-통관-적하보험 부보-창고 및 보관-하역-혼재-선적-도착지 인도 순으로, 수출통관을 마친 뒤 부보하고 CFS 보관·하역을 거쳐 혼재·선적한다."},{"id":"7cb8d714ae","s":1,"n":"164","q":"다음 중 복합운송 주선업의 등록요건을 서술한 것으로 거리가 먼 것은?","o":["법인인 경우 자본금이 3억원 이상","화물집화창고 또는 컨테이너장치장을 소유하거나 이를 사용할 수 있는 계약을 체결 가능","1억원 이상의 보증보험에 가입","개인인 경우 자산 평가액이 5억원 이상"],"a":3,"e":"개인은 자산평가액 6억원 이상이 등록요건이므로 5억원은 맞지 않다. 법인 자본금 3억원 이상, 1억원 이상 보증보험 가입, 집화창고·CY 확보(계약 포함)는 옳다."},{"id":"4cad037376","s":1,"n":"165","q":"Forwarder가 하주를 대신해서 운송서류를 직접 작성하는데 이때 직접 작성하는 서류가 아닌 것은?","o":["선복예약서(Shipping Request S/R)","부두수취증(Dock Receipt D/R)","신용조회(Credit Inquiry)","선하증권(Bill of Lading)"],"a":2,"e":"신용조회(Credit Inquiry)는 거래상대방 신용조사 행위로 운송서류가 아니며, S/R·D/R·B/L은 포워더가 화주를 대신해 작성하는 운송서류다."},{"id":"1c03898d69","s":1,"n":"166","q":"한 사람의 Forwarder가 수입업자로 부터 위탁을 받아 다수의 수출업자로 부터 화물을 집화하여 컨테이너에 혼재하는 경우를 말하는 것은?","o":["Forwarder's Consolidation","Buyer's Consolidation","Port Consolidation","Multi Consolidation"],"a":1,"e":"수입업자(Buyer)의 위탁을 받아 다수 수출업자의 화물을 한 컨테이너에 혼재하는 것이 Buyer's Consolidation으로, 대량 구매자의 물류비 절감이 목적이다."},{"id":"32a6e983e1","s":1,"n":"167","q":"한사람의 Forwarder가 다수의 수출업자로 부터 화물을 혼재하여 혼재화물 목적지가 항만으로 되어 있는 형태는?","o":["Forwarder's Consolidation","Buyer's Consolidation","Port Consolidation","Multi Consolidation"],"a":2,"e":"다수 수출업자의 화물을 혼재해 도착지 항만(Pier)까지를 대상으로 하는 CFS/CFS형 혼재를 Port Consolidation이라 하며, 도착지 CFS에서 수하인별로 분류·인도된다."},{"id":"aa759c7e32","s":1,"n":"168","q":"Forwrder가 업무형태에서 혼재(Consolidation)의 특성에 관해 적합하지 않은 것은?","o":["소량화물(Less than Contanier Load; LCL)의 선적 용이","과다한 도착지 국내운송료 부담","Forwarder의 소량화물의 혼재이익을 취득","물량의 단위화로 하역 및 운송 취급상 용이"],"a":1,"e":"혼재는 LCL 선적을 쉽게 하고 물량 단위화로 하역·운송을 편리하게 하며 포워더는 혼재차익을 얻으므로, 도착지 국내운송료 과다 부담은 혼재의 특성이 아니다."},{"id":"015c1e0d27","s":1,"n":"169","q":"다음 중 주로 Buyer's Consolidation에 이용되는 운송구분은 다음 중 어느 것인가?","o":["CY/CY (FCL/FCL, Door/Door)","CFS/CY(LCL/FCL, Pier/Door)","CFS/CFS(LCL/LCL, Pier/Pier)","CY/CFS(FCL/LCL, Door/Pier)"],"a":1,"e":"Buyer's Consolidation은 수출지 CFS에서 혼재해 수입자 문전까지 FCL로 운송하므로 CFS/CY(LCL/FCL, Pier/Door) 조건이 이용된다."},{"id":"395ba6c926","s":1,"n":"170","q":"다음 중 주로 Forwarder's Consolidation에이용되는 운송방법은 다음 중 어느 것인가?","o":["CY/CY (FCL/FCL, Door/Door)","CFS/CY(LCL/FCL, Pier/Door)","CFS/CFS(LCL/LCL, Pier/Pier)","CY/CFS(FCL/LCL, Door/Pier)"],"a":2,"e":"Forwarder's Consolidation은 수출지 CFS 혼재 후 도착지 CFS에서 분류·인도하는 형태이므로 CFS/CFS(LCL/LCL, Pier/Pier) 조건이 이용된다."},{"id":"88139401fa","s":1,"n":"171","q":"FCL(Full Container Load)의 경우 화주가 자신의 책임과 비용을 공장 또는 창고에서 화물을 컨테이너에 적입하게 되는데 이러한 vanning 형태를 말하는 것은?","o":["Shipper's Pack","Buyer's Pack","Carrier's Pack","Importer's Pack"],"a":0,"e":"화주가 자기 책임과 비용으로 공장·창고에서 컨테이너에 적입(vanning)하는 방식은 Shipper's Pack(자가적입)이며, CFS에서 운송인이 적입하면 Carrier's Pack이다."},{"id":"5c8513df54","s":1,"n":"172","q":"다음 혼재업자(condolidator)의 임무를 설명한 것 중 적합하지 않은 것은?","o":["화물의 생산일정 파악","선적준비 완료된 화물의 혼재계획 수립","선적서류 작성 및 제출","국내운송료 및 선박운임료 결정"],"a":3,"e":"국내운송료와 해상운임은 실제운송인(선사)과 운송시장이 결정하므로 혼재업자의 임무가 아니고, 생산일정 파악, 혼재계획 수립, 선적서류 작성·제출이 혼재업자 업무다."},{"id":"6a3b904aa8","s":1,"n":"173","q":"혼재화물(Consolidated Cargoes)의 경우 혼재된 화물의 내용, 순위 및 위치를 컨테이너별로 기재한 서류를 말하는 것은?","o":["Master(Ocea Carrier) B/L","Commercial Invoice","Packing List","Container Load Plan"],"a":3,"e":"컨테이너별로 적입 화물의 명세·적입 순서·적재 위치를 기재한 서류는 컨테이너적부도(Container Load Plan, CLP)로, 도착지 적출작업의 기준이 된다."},{"id":"35bf9d76d1","s":1,"n":"174","q":"대규모의 생산설비 및 건설기자재가 특정한 공사계획에 따라 일시 또는 지속적으로 운송될 경우 발생되는 화물의 취급업무를 지칭하는 것은?","o":["Co-Loading Service","Project Cargo Handling Service","Consolidation Service","Hanging Garment Handling Service"],"a":1,"e":"특정 공사계획에 맞춰 대형 생산설비·건설기자재를 일시 또는 지속적으로 운송·관리하는 업무를 Project Cargo Handling Service라 한다."},{"id":"fb7b6c9e43","s":1,"n":"175","q":"다음 중 ATA Carnet의 특성을 설명한 것 중 적합하지 않은 것은?","o":["일시 수입이나 보세 운송에 있어 수입세 면제와 통관절차 간소화를 목적으로 발급되는 국제적 통관수첩이다.","ATA Carnet을 소지한 자가 협약 가입국에 일시반입이나 일시 수입을 위한 물품 통관시에는 세금을 지불하므로 일정기간내에 재반출할 필요가 없다.","ATA Carnet 발급물품으로 2개국 이상 순회하고자 하는 경우 수출입신고서를 필요한 만큼 더 발급받으면 가능하다.","ATA Carnet의 유효기간이 발급일로 부터 1년일 때 수출통관증서를 사용하며 수출신고시에는 동 증서를 수출신고서로 갈음한다."],"a":1,"e":"ATA Carnet은 일시반입 물품의 수입세를 면제받는 통관수첩이므로, 세금을 내고 재반출 의무가 없다는 서술은 틀리다. 정해진 기간 내 재수출이 전제조건이다."},{"id":"de6b49d577","s":1,"n":"176","q":"가죽 및 모피의류 등과 같은 고가의 의류수송 서비스 형태로 Cartib Box에 의한 운송 서비스를 말하는 것은?","o":["Co-Loading Service","Project Cargo Handling Service","Exhibition Cargo Handling Service","Hanging Garment Handling Service"],"a":3,"e":"고가의 가죽·모피 의류를 걸린 상태로 Cartib Box 등에 넣어 주름 없이 운송하는 서비스가 Hanging Garment Handling Service이다."},{"id":"2b885411b7","s":1,"n":"177","q":"전시화물 취급서비스(Exhibition Cargo Handling Service)의 특징으로 적절하지 않은 것은?","o":["포장의 중요성","비용절감","일시수입통관증서(ATA Carnet) 필요","왕복운송업무"],"a":1,"e":"전시화물은 왕복운송, 고급포장, ATA Carnet 절차가 필요해 오히려 비용이 높은 고부가 서비스이므로 비용절감은 특징이 아니다."},{"id":"f2507679f2","s":1,"n":"178","q":"Hanging 장치의 종류에서 Dead Space의 발생을 초래할 수 잇는 System으로 주로 가죽제품, 모피제품의 수송에 이용되는 것은?","o":["Rope System","Tag System","Bar System","Rack System"],"a":2,"e":"컨테이너 내부에 바(bar)를 가로질러 의류를 거는 Bar System은 상·하부 공간을 활용하지 못해 dead space가 생기며, 주로 가죽·모피 제품 수송에 이용된다."},{"id":"3fb9b9ed19","s":1,"n":"179","q":"Sea & Air Service의 특성을 설명한 것 중 관계가 먼 것은?","o":["해상운송의 저렴성(Ecnonomy of Seafreight)과 항공운송의 신속성(Speed of Aircargo)의 결합","비용면에서 가장 효과적인 운송시간소요","전형적인 해륙복합운송형태의 서비스","화물 취급상의 문제점을 최소화"],"a":2,"e":"Sea & Air는 해상운송의 저렴성과 항공운송의 신속성을 결합한 해공(海空)복합운송이므로, 전형적인 해륙복합운송이라는 설명은 관계가 멀다."},{"id":"d1a66d9a91","s":1,"n":"180","q":"Sea & Air Service의 업무 취급 절차에 관하여 설명한 것 중 관련이 적은 것은?","o":["출발지에서 최종 목적지까지 전구간을 MT(Mulimodel Transport) B/L 하나로 묶어 화주에게 발행","선적지의 경우 선하증권(B/L)이 Forwarder에게 발행","도착지에서는 항공운송장(AWB)으로 항공사와 Forwarder간에 화물이 인도","Forwarder는 중계지점(T/S Pinot)에 있는 파트너(대리점)과 도착지 대리점간의 화물운송 및 인수관련 업무처리 기준이 각각 달리 규정"],"a":3,"e":"Sea & Air에서는 중계지(T/S point) 파트너와 도착지 대리점 간 화물 인수·운송 처리기준을 통일해 운영하므로, 기준이 각각 달리 규정된다는 설명은 옳지 않다."},{"id":"4bc264aae4","s":1,"n":"181","q":"국내무역업자나 해외수출업자를 대신하여 제3국에서 생산, 선적되어 우리나라를 경유하여 다시 제3국으로 운송되는 화물 서비스는?","o":["Transhipment Cargo Service","Sea & Air Cargo Service","House Forwarding Service","Bonded Warehouse Transaction Service"],"a":0,"e":"제3국에서 생산·선적되어 우리나라를 경유해 다시 제3국으로 운송되는 화물을 다루는 것이 환적화물 취급서비스(Transhipment Cargo Service)다."},{"id":"9de76c727a","s":1,"n":"182","q":"환적화물 취급 서비스에서 일시 양륙된 통과화물이 30일 이내에 반출하지 못할 경우는 행하여야 할 절차는?","o":["화물 이적허가신청을 세관으로부터 허락을 받는다.","House B/L을 Forwarder가 세관에 신청한다.","통과화물반출기간연장신청서를 제출하여 세관장의 승인을 받는다.","재혼재작업신고서를 세관장에게 재출한다."],"a":2,"e":"일시양륙된 통과화물을 30일 내 반출하지 못하면 통과화물반출기간연장신청서를 제출해 세관장의 승인을 받아야 한다."},{"id":"1bfe28ca94","s":1,"n":"183","q":"통과화물의 적출(devanning) 실제수량과 관련하여 Forwarder가 중징계를 받는 경우는?","o":["컨테이너에 적출시 세관원과 검수인 입회하에 작업을 진행하지 않고 CFS 실무자가 참관했을 경우","적출실제수량이 신고된 수량과 상이할 경우","Forwarder가 자신이 선호하는 CFS에서 컨테이너를 적출하고자 하는 경우","적출시 다른 물품이 발견되거나 고의적인 허위신고 사실이 인지된 경우"],"a":3,"e":"적출(devanning) 과정에서 신고되지 않은 다른 물품이 발견되거나 고의적 허위신고가 확인되면 밀수·부정무역으로 취급되어 중징계 대상이 된다. 단순 수량 상이는 정정 사유다."},{"id":"7d472b64e3","s":1,"n":"184","q":"다음은 통과화물의 재혼재에 관한 사실및 절차를 기술한 것으로 관계가 적절하지 않은 것은?","o":["일시양륙된 통과화물을 보세구역에서 재혼재하여 이적하고자 하는 경우 재혼재작업신고서를 세관장에게 제출한다.","해당구역에 울타리를 치거나 황색선 등으로 구분표시를 하고 통과화물 재혼재 구역임을 알린다.","세관장은 통과화물에 대한 재혼재작업 신고가 있는 경우 세관공무원으로 하여금 당해 물품에 대한 작업상태를 확인하게 한다.","보세구역설영인은 재혼재하고자 하는 통과화물에 대한 관리대장을 비치하고 물품반출입사항 등을 기록관리한다."],"a":1,"e":"재혼재 구역은 보세구역 내에서 다른 화물과 구분되게 관리·표시하면 되고 울타리·황색선 표시를 의무화한 규정은 없다. 재혼재작업신고서 제출, 세관공무원 확인, 관리대장 비치는 옳다."},{"id":"fd5dc6a98a","s":1,"n":"185","q":"다음 중 House Forwarding Service의 목적으로 타당하지 않은 것은?","o":["수출입업자에게 불필요한 부대경비 절감","수출입업자에게 불필요한 인력절감","전문 Freight Forwarder에 의한 신속 정확한 화물 운송","전문 Freight Forwarding 업체를 통한 생산 및 판매시장개척"],"a":3,"e":"House Forwarding Service의 목적은 수출입업자의 부대경비·인력 절감과 전문 포워더에 의한 신속·정확한 운송이며, 생산 및 판매시장 개척은 해당하지 않는다."},{"id":"3d1e6f4f00","s":1,"n":"186","q":"거래상대국의 정부로부터 허가받은 보세창고(Bonded Warehouse)에 상품을 무상으로 반출하여 현지에서 매매계약을 체결하고 판매하는 거래방식은?","o":["특수화물 운송서비스 및 각종대행서비스","보세창고도거래서비스","환적화물취급서비스","프로젝트화물 취급 서비스"],"a":1,"e":"상대국 정부가 허가한 보세창고에 물품을 미판매 상태로 반출·장치한 뒤 현지에서 매매계약을 체결해 판매하는 방식이 보세창고도거래(BWT)다."},{"id":"ab7d1b68c9","s":1,"n":"187","q":"다음은 BWT(Bonded Warehouse Transaction) 물품 취급에 관한 사항을 서술한 것으로 적합하지 않은 것은?","o":["BWT 물품은 반드시 보세창고에 장치하여야 한다.","보세창고에 반입될 수 잇는 BWT 물품, Stable B/L 물품 등의 여부를 심사하기 위해서는 반입신고제가 시행되고 있다.","보세창고에 장치된 외국물품의 장치기간은 1년이내이며, 1년의 범위내에서 연장할 수 있다.","BWT 물품이 분할될 때마다 적하목록 정정업무를 하여야 하고 별도의 보세화물양수도신고서에 의해 적하목록정정 일괄처리해야 한다."],"a":2,"e":"'BWT 물품 취급 중 적합하지 않은 것' → 회사 정답은 보세창고 장치기간 1년·1년 범위 연장을 서술한 ③이다. 장치기간 지문이 나오면 ③으로 암기한다. ⚠[정답 논란] ③은 관세법 제177조와 일치하는 옳은 서술이고, BWT 물품은 분할 시마다 정정하는 것이 아니라 보세화물양수도신고서로 일괄 정정하므로 일반 이론상 정답은 ④다. 다만 채점은 회사 제공 정답 ③ 기준이므로 시험에서는 ③로 답할 것.","c":{"t":3,"n":"③은 관세법 제177조와 일치하는 옳은 서술이고, BWT 물품은 분할 시마다 정정하는 것이 아니라 보세화물양수도신고서로 일괄 정정하므로 일반 이론상 정답은 ④다."}},{"id":"551fb91c8c","s":1,"n":"188","q":"FIATA(International Federation of Freight Forwarders Associaltion) 관련서류 작성을 위해서 고객(화주)으로 부터 접수받는 서류 중 해당되지 않는 것은?","o":["FFI (FIATA Forwarding Instructions)","FIATA SDT(Shippers Declaration for the Transport of Dangerous Goods)","FIATA SIC(Shippers Intermodal Weight Certification)","FIATA FCT(Forwarders Certificate of Transport)"],"a":3,"e":"FCT(Forwarders Certificate of Transport)는 포워더가 화주에게 발행하는 서류이고, FFI·SDT·SIC는 화주가 포워더에게 제출하는 접수서류다."},{"id":"5a8ec15342","s":1,"n":"189","q":"FIATA관련 서류 작성중 Forwarder의 창고작업을 위해 사용하는 입고확인서로 고객에게 발행하는 서류는 다음 중 어느 것인가?","o":["FCR(Forwarders Certificate of Receipt)","FIATA FCT(Forwarders Certificate of Trnasport)","FBL(FIATA Multimodal Transport Bill of Lading)","FWR(FIATA Warehouse Receipt)"],"a":3,"e":"FWR(FIATA Warehouse Receipt)은 포워더의 창고 입고 사실을 확인해 고객에게 발행하는 창고증권 성격의 서류다."},{"id":"901e49826e","s":1,"n":"190","q":"복합운송에서 1인의 운송인이 전 구간의 운송을 인수하고 그 운송의 일부 또는 전부를 다른 운송인에게 하청을 준 경우의 형태는?","o":["부분운송","하청운송","공동운송","연대운송"],"a":1,"e":"1인의 운송인이 전 구간 운송을 인수한 뒤 일부 또는 전부를 다른 운송인에게 맡기는 형태가 하청운송이며, 화주에 대한 책임은 계약운송인이 부담한다."},{"id":"0ef55166d3","s":1,"n":"191","q":"다음 중 복합운송에 관한 일반적인 사실을 설명한 것으로 바르지 않은 것을 고르시오?","o":["동일한 운송수단에서 적재와 하역을 반복하는 것은 복합운송에 포함되지 않는다.","항공운송의 가장 큰 장점은 빠른 속도이다.","복합운송 시 각각의 운송수단별로 별도의 운송서류가 발행되는 것이 일반적이다.","American Land Bridge는 태평양을 횡단하여 미국서안 항구에서 하역하여 미대륙을 트럭이나 철도로 횡단한 수 다시 서안항구에서 선박에 적재하여 유럽으로 운송하는 형태의 복합운송을 말한다."],"a":2,"e":"복합운송은 운송인 1인이 전 구간에 대해 단일의 복합운송증권(MT B/L)을 발행하는 것이 본질이므로, 운송수단별로 별도 운송서류가 발행된다는 설명은 옳지 않다."},{"id":"3974199ea7","s":1,"n":"192","q":"다음 중 국제항공운송협회의 약어로 적절한 것은?","o":["OPEC","ICC","IATA","OECD"],"a":2,"e":"국제항공운송협회의 약어는 IATA(International Air Transport Association)이며, ICC는 국제상업회의소, OPEC·OECD는 항공과 무관한 기구다."},{"id":"49591c1970","s":1,"n":"193","q":"다음 중 복합운송 관련 기구로 한국복합운송주선업협회의 약어로 적절한 것은?","o":["KIFFA","FIATA","IATA","ICAO"],"a":0,"e":"한국복합운송주선업협회는 KIFFA(현 한국국제물류협회)이고, FIATA는 국제 주선인연맹, IATA·ICAO는 항공 관련 기구다."},{"id":"64cde176db","s":1,"n":"194","q":"다음 중 복합수송 확장의 애로사항이 아닌 것은?","o":["모드별 용량의 균등성","국내 및 국제 수송에 있어서의 표준화의 비일관성","안전성의 문제","민간부문의 재정 한계"],"a":0,"e":"운송수단(mode)별 용량의 균등성은 연계운송에 오히려 유리한 조건이며, 표준화의 비일관성, 안전성 문제, 민간부문 재정 한계가 복합운송 확대의 애로사항이다."},{"id":"5cd8eba6a1","s":1,"n":"195","q":"우리나라의 Forwarder의 문제점이 아닌 것은?","o":["영세성","전문성 부족","일관서비스 불능","통관업 진출"],"a":3,"e":"영세성, 전문성 부족, 일관운송서비스 불능이 우리나라 포워더의 문제점이며, 통관업 진출은 업무영역 확대에 해당해 문제점이 아니다."},{"id":"b5b3681428","s":1,"n":"196","q":"다음 중 AEO(Authorized Economic Operator)제도를 서술한 것으로 적합하지 않은 것은?","o":["선박의 안전확보, 항만시설의 보안유지와 관련한 제도이다.","수출입 정보를 사전에 세관에 제공하는 제도이다.","국가별 세관이 AEO 상호협정 체결 시 통관절차를 완하하는 제도이다.","우리나라는 2008년부터 도입하여 운영 중이다."],"a":0,"e":"AEO는 세관이 수출입 안전관리 우수업체를 인증하고 상호인정협정(MRA)으로 통관을 간소화하는 제도이며, 선박 안전·항만시설 보안은 ISPS Code 소관이다."},{"id":"b84c9c3e55","s":1,"n":"197","q":"복합운송주선인의 역할에 대한 설명으로 적절한 내용으로 묶인것은? ㉮화주에게 운송수단선택, 운송경로 등에 대한 전문적 조언 ㉯선적서류의 작성 ㉰통관업무 직접수행 ㉱포장, LCL화물의 혼재와 분류 ㉲보험의 수배","o":["㉮+㉯+㉰+㉱","㉮+㉯+㉱+㉲","㉯+㉰+㉱+㉲","㉮+㉰+㉱+㉲"],"a":1,"e":"통관업무 직접수행(㉰)은 관세사 고유업무로 제외되고, 운송수단·경로 조언, 선적서류 작성, 포장·LCL 혼재와 분류, 보험 수배가 복합운송주선인의 역할이다."},{"id":"5a844694c4","s":1,"n":"198","q":"다음 중 Freight Forwarder가 수행하는 역할로 적당하지 않은 것은?","o":["수출화주로 부터 수출통관과 국내운송을 위탁받아 이를 수행한다.","수입통관 시에는 화주를 대신하여 수입신고를 자신의 명의로 직접 수행할 수 있다.","혼재화물에 대해 입항하는 관할세관장에게 제출할 혼재 화물 적하목록을 작성한다.","수출화주의 소량화물(LCL)를 위탁받아 이를 혼재작업을 통해 FCL로 만든다."],"a":1,"e":"수입신고는 화주 또는 관세사 명의로 하여야 하므로 포워더가 자기 명의로 직접 수행할 수 없다. 수출통관·국내운송 수탁, 혼재 적하목록 작성, LCL의 FCL화는 가능하다."},{"id":"118c59349e","s":1,"n":"199","q":"다음 국제복합운송의 형태 중 화물의 납기를 고려할 때, 중국을 출발하여 한국을 경유, 미주지역 또는 중남미까지 운송할 경우 가장 효율적인 복합운송방식은 어느 것인가?","o":["Sea & Air","Train & Ship","Piggy & Back","Fishy & Back"],"a":0,"e":"중국에서 한국까지 해상으로 운송한 뒤 인천·부산에서 항공기로 환적해 미주·중남미로 보내는 Sea & Air가 납기와 운임을 동시에 만족시키는 방식이다."},{"id":"412fc48471","s":1,"n":"200","q":"다음 중 볼레로(Bolero)에 관한 특성을 기술한 것으로 거리가 먼 것은?","o":["선적서류의 처리 자동화, 대금결제 자동화를 도모","종래의 신용장 거래방식을 기본적으로 유지","시간을 단축하고 비용절감을 도모","SWIFT가 단독출자하여 설립"],"a":3,"e":"볼레로는 SWIFT와 TT Club(P&I 보험자)이 공동 출자해 설립한 무역서류 전자화 시스템이므로, SWIFT 단독출자라는 설명은 사실과 다르다."},{"id":"c2d525e06b","s":1,"n":"201","q":"우리나라 ICD에 대한 설명 중 적합한 사실이 아닌 것은?","o":["ICD는 LCL화물의 ghswo, 분류 등을 수행하는 CFS가 갖춰져 있다.","ICD는 토지이용, 운송효율성, 교통혼잡완화 등 경제적 효과가 크다.","ICD는 항만기능 중 검역기능을 수행하지 않는다.","ICD는 항만과 떨어진 산업단지 등 인근에 주로 위치한다."],"a":2,"e":"ICD(내륙컨테이너기지)는 CFS를 갖추고 통관·검역·보관·집배송 등 항만의 내륙기능을 수행하며, 수행하지 못하는 것은 본선 양적하와 마샬링(marshalling) 기능이다."},{"id":"4e76617fa3","s":1,"n":"202","q":"복합운송조건인 FCA에서 송하인과 수화인의 위험부담의 분기점은 언제 인가?","o":["수화인이 물품을 운송인으로부터 인수하는 시점","송화인이 물품을 내륙운송인에게 인도하는 시점","운송인이 물품을 수화인에게 인도하는 시점","운송인이 도착 시 항구에서 물품을 양륙하는 시점"],"a":1,"e":"FCA(Free Carrier)는 매도인이 지정장소에서 매수인이 지명한 운송인에게 물품을 인도하는 순간 위험과 비용이 이전되므로, 내륙운송인 인도 시점이 분기점이다."},{"id":"5b7a639122","s":1,"n":"203","q":"Sea & Air 복합운송에 관한 설명 중 적당하지 않은 사실은?","o":["해상운송이 지니는 운임의 저렴성과 항공운송이 갖는 신속성을 효과적으로 결합시킨 국제복합일관운송방식이다.","화물의 출발지에서 목적지까지의 운송구간 중 일정구간은 선박으로 운송하고 나머지 구간을 항공기로 운송하는 방식이다.","선사나 해운업자보다는 항공회사, 항공화물업자 및 Sea & Air 전문 Broker등이 주체자가 되어 업무를 주관한다.","아시아 출발 유럽행, 중남미행, 미국행 등 운송거리가 긴 경로에서 유효하다."],"a":2,"e":"Sea & Air는 해상운임의 저렴성과 항공의 신속성을 결합한 복합운송이나, 실무 주관 주체는 선사·해운업자 및 포워더가 중심이며 항공사가 주체라는 설명은 사실과 다르다."},{"id":"e22092fa20","s":1,"n":"204","q":"다음 중 국제복합운송증권(FIATA B/L)의 주요 내용으로 거리가 먼 것은?","o":["화물을 인도 받기위해서는 적정히 배서된 1통의 증권원본과 상환되어야 한다.","증권에 별도로 표시한 것이 없는 한 증권에 기재된 화물은 운송과 인도를 위해 수령지에서 양호한 상태로 수령하였음을 의미한다.","2가지 이상의 운송수단을 이용할 경우에 적용되며, 단일운송수단을 이용하는 경우에는 적용되지 않는다.","유통불가라는 표시가 없는 한 유통가능한 양식으로 발행하며 증권소지인은 배서 및 양도함으로써 그 권리를 양도할 수 있다."],"a":2,"e":"FIATA FBL은 유통성 복합운송증권이지만 port-to-port 등 단일 운송수단만 사용하는 운송에도 발행·사용할 수 있어, 2개 이상 수단에만 적용된다는 제한은 없다."},{"id":"08e2380417","s":1,"n":"205","q":"다음 중 국제복합운송증권(FIATA B/L)의 약관에 대한 설명으로 타당하지 못한 것은?","o":["Lien clause는 운송인, 혹은 그 대리인이 운임을 포함하여 운송관련 비용이 회수되지 않으면 해당화물을 유치할 권리를 갖는다.","선박이 적법한 이유없이 보험증권에 정해진 항해로부터 이탈하였을 때는 보험자는 그 이로(Deviation)에서 책임이 해제된다고 규정하고 있다.","B/L상에 표시되어 있는 'said to contain', 또는 'shipper's stowed, load & count'조항은 부지약관을 의미한다.","On-deck clause는 송화인이 동의하에 화물을 갑판위에 적재하는데, 해상적하보험의 경우 ICC(A)의 경우에는 담보가 안된다."],"a":3,"e":"ICC(A)는 포괄담보(all risks) 조건으로 송하인 동의하에 적재된 갑판적(on-deck) 화물의 투하·갑판유실도 담보하므로, 담보되지 않는다는 서술은 옳지 않다."},{"id":"21608ddbde","s":1,"n":"206","q":"컨테이너화물의 수입통관과 화물인도 및 수령의 절차를 설명한 것으로 적절하지 않은 것은?","o":["적하목록을 선박이 입항하기 24시간 전까지 입항예쩡지 세관장에게 전자문서로 제출하되 중국, 일본 등 근거리지역으로 부터 입항하는 경우에는 선박입항 시 까지 제출한다.","양륙된 회국화물의 수입신고서, 송품장, 가격신고서, 선하증권 부본, 포장명세서 등을 제출하여 관할 세관에 수입신고를 한다.","어떠한 경우에도 선하증권 원본의 소지인만 화물을 인도가능하다.","선박회사는 운임 및 부대비용을 징수한 후, 화물인도지시서(Delivery Order)를 발행한다."],"a":2,"e":"수입화물선취보증서(L/G), Surrendered B/L, 해상화물운송장(SWB) 등을 이용하면 B/L 원본 없이도 화물 인도가 가능하므로 \"어떠한 경우에도\"라는 단정은 틀리다."},{"id":"06c6419295","s":1,"n":"207","q":"복합운송주선인의 역할로 인한 수출업자의 이점으로 해당되지 않는 것은?","o":["소량화물의 송화인이 선박회사의 선적 거절이나 혼재(consolidation)상의 어려움의 해결된다.","복합운송증권이나 House B/L을 선적 전에 운송주선인으로부터 발급받아 금융의 원활을 기할 수 있다.","국제운송의 가장 유리한 운송경로와 운송방법을 복합운송주선인으로부터 전문적인 조언을 받을 수 있다.","수많은 개별소량화물의 직접취급으로 인한 인원과 공간을 줄일 수 있으므로 경비를 절감할 수 있다."],"a":3,"e":"수많은 개별 소량화물의 직접 취급에 드는 인원·공간 절감은 혼재(consolidation)를 맡기는 선박회사 즉 운송인 측의 이점이며, 수출업자의 이점이 아니다."},{"id":"9b454c38a4","s":1,"n":"208","q":"철도복합운송방식에 대한 특성을 설명한 것 중 가장 적절한 것은?","o":["우리나라에서도 현재 부산항과 광양항 구간에서 2단적 컨테이너 열차를 운행하고 있다.","TOFC방식의 피기백 시스템은 총중량이 크나 철도터미널에서 다단적이 가능하고, 공간의 소요가 적어 철도터미널에서 선호하는 방식이다.","철도/도로 겸용 운송시스템은 장거리 간선수송에서 2단 적재열차보다 더 많은 컨테이너를 운송할 수 있어 유리하다.","철도/도로 겸용 운송시스템인 Roadriler는 TOFC방식에 비하여 터미널 비용 및 트레일러 견인료를 절감할 수 있어 경제적이다."],"a":3,"e":"RoadRailer는 별도 대차(bogie) 없이 도로·철도를 겸용해 터미널 하역설비 비용과 트레일러 견인료를 절감한다. 국내는 터널 높이 제약으로 2단적(DST) 열차를 운행하지 않는다."},{"id":"fb1e314541","s":1,"n":"209","q":"Forwarder가 발행하는 FIATA B/L 약관에 기재된 Forwarder의 책임한도액에 대한 설명 중 거리가 먼 것은?","o":["송화인이 화물의 성질, 화물가액을 포워더에 고지하고 종가운임을 지급하며, FIATA B/L상에 기재 시 신고가액이 한도액이 된다.","포워더의 인도지연으로 인한 손해발생 시 FIATA B/L에 의거한 복합운송계약상 운임의 2배상당액을 초과하지 않는다.","화물의 멸실, 손상에 대해 포장당 또는 단위당 SDR 666.67상당액 또는 총중량 kg당 SDR2 상당액 중 더 많은 금액을 초과하지 않는다.","포워더의 총책임은 화물의 전손에 대한 책임한도를 초과하지 않는다."],"a":2,"e":"'FIATA B/L상 포워더 책임한도와 거리가 먼 것' → 회사 정답은 포장·단위당 SDR 666.67 또는 kg당 SDR 2 중 고액을 서술한 ③이다. SDR 수치 지문이 나오면 ③으로 암기한다. ⚠[정답 논란] ③은 FBL 약관 문구와 그대로 일치하고 인도지연 한도는 '운임의 2배'가 아니라 운임 상당액이므로, 일반 이론상 거리가 먼 것은 ②다. 다만 채점은 회사 제공 정답 ③ 기준이므로 시험에서는 ③로 답할 것.","c":{"t":1,"n":"③은 FBL 약관 문구와 그대로 일치하고 인도지연 한도는 '운임의 2배'가 아니라 운임 상당액이므로, 일반 이론상 거리가 먼 것은 ②다."}},{"id":"567a1a86ea","s":1,"n":"210","q":"다음 중 BOLERO의 기능으로 적합하지 않은 것은?","o":["각 볼레로 이용자의 주소, 보증 정보 등의 공통항목 저장한다.","무역금융 및 보험, 대금 결제, 물류 등 무역에서 발생되는 모든 업무를 전용네트워크를 통해 처리한다.","볼레로 선하증권과 해상화물운송장 거래에 포함된 정보 등록과 유지관리를 한다.","볼레로 서류의 작성, 전자서명, 확인, 송신, 수신을 위한 도구로서의 역할을 한다."],"a":1,"e":"BOLERO는 인터넷 기반 개방형 플랫폼으로 전자선하증권의 권리등기(Title Registry)와 전자서류 교환·인증이 핵심이며, 전용네트워크로 무역 전 업무를 처리하는 체계가 아니다."},{"id":"01c2d3d7a2","s":1,"n":"211","q":"다음 중 복합운송에 사용되는 정형거래 조건이 아닌 것은?","o":["EXW (공장인도조건)","FOB (본선인도조건)","CPT (운송비지급인도조건)","DDP (관세지급인도조건)"],"a":1,"e":"FOB(본선인도)는 본선 적재를 인도기준으로 하는 해상·내수로 전용조건이므로 복합운송에는 부적합하며, 복합운송에는 EXW·FCA·CPT·CIP·DDP 등을 사용한다."},{"id":"ec958f2fec","s":1,"n":"212","q":"보세구역에 장치되어 있는 외국물품이 장치기간경과전임에도 불구하고 공고후 매각할 수 있는 물품이 있는데 대상물품이 아닌 것은?","o":["살아있는 동식물","부패하거나 부패할 우려가 있는 물품","다른 외국물품을 해할 우려가 있는 물품","보세창고료가 현저하게 늘어날 우려가 있는 물품"],"a":3,"e":"관세법상 장치기간 경과 전 공고 후 매각 사유는 생동물, 부패 우려, 창고나 다른 외국물품을 해할 우려, 기간경과로 상품가치가 현저히 떨어질 우려 등이며 보관료 증가는 열거사유가 아니다."},{"id":"51067c7afc","s":1,"n":"213","q":"복합운송에서 Freight Forwarder가 취급할 수 있는 사업영역에 해당되지 않는 것은?","o":["국제운송물류에 대한 전반적인 컨설팅","화물의 집화, 분배, 혼재 서비스","보험의 수배 및 담보조건 등에 관한 제안","운송사고 하자물품에 대한 검정보고서의 발급"],"a":3,"e":"운송사고·하자물품에 대한 검정보고서(Surveyor's Report) 발급은 검정·감정인(surveyor)의 고유 업무로, 포워더의 취급 사업영역에 속하지 않는다."},{"id":"b2d2af13e8","s":1,"n":"214","q":"다음 중 파나마운하에 대한 설명으로 옳지 않은 것은?","o":["아시아에서 미국 동부지역으로의 All water service를 이용할 경우 통과하는 곳이다.","태평양지역의 발보아와 대서양지역의 크리스토발을 연결하는 인공의 운하이다.","Panamax Ship이란 파나마운하를 지나갈 수 있는 최대 크기의 선박을 말한다.","아시아에서 미국 동부지역으로의 컨테이너화물 운송시 파나마운하를 거쳐 운송하는 것이 MLB(Mini Land Bridge) Service보다 운임수준이 높은 편이다."],"a":3,"e":"아시아~미국 동안 구간에서 파나마운하 경유 All Water Service는 MLB(Mini Land Bridge)보다 운송기간은 길지만 운임수준은 낮은 것이 일반적이다."},{"id":"e14beb7307","s":1,"n":"215","q":"소량화물(LCL)인 경우 화인에 반드시 표시되어야 하는 사항은?","o":["원산지와 최종도착지","화번과 최종도착지","주화인과 화번","주화인과 최종도착지"],"a":1,"e":"LCL은 한 컨테이너에 여러 화주 화물이 혼재되므로 개별 화물 식별과 오분류 방지를 위해 화번(Case No.)과 최종도착지(목적지) 표시가 반드시 필요하다."},{"id":"adcc085c9b","s":1,"n":"216","q":"항공화물 혼재업자(consoliator)의 역할에 관한 설명 중 틀린 것은?","o":["항공사의 운송수단을 이용하여 항공사와 같은 입장에서 송화인과 화물운송교섭을 한다.","자체 화물운송요율과 운송약관을 적용하여 자체항공화물운송장(House Air waybill)을 발행한다.","항공회사와 대리점계약을 체결하고 항공사를 대리하여 화물집하활동을 하고 항공사를 대신하여 운송장을 발행한다.","대리점으로서 송화인을 위한 화물의 예약․혼재, 트럭운송, 포장, 통관 관련서류를 작성한다."],"a":2,"e":"혼재업자(consolidator)는 자기 운임률·운송약관으로 House AWB를 발행하는 계약운송인이며, 항공사를 대리해 Master AWB를 발행하는 것은 항공화물운송대리점(agent)의 역할이다."},{"id":"0e5ab971a2","s":1,"n":"217","q":"다음 중 운송주선인의 일반적인 기능이라고 볼 수 없는 것은?","o":["소량화물의 혼재운송","운송수단의 수배","수출승인의 대행","복합운송의 주선"],"a":2,"e":"수출승인(E/L) 취득은 화주가 관계 행정기관에 직접 수행하는 사항으로, 혼재·운송수단 수배·복합운송 주선과 달리 운송주선인의 일반적 기능으로 보지 않는다."},{"id":"7f3a77129f","s":1,"n":"218","q":"선박을 보유하지 않는 자가 운송계약을 체결하는 운송인을 무엇이라 하는가?","o":["Forwarder","Contract Carrier","NVOCC","Common carrier"],"a":2,"e":"선박 등 운송수단을 직접 보유하지 않으면서 자기 명의로 운송계약을 체결하고 House B/L을 발행하는 계약운송인을 NVOCC(무선박운송인)라 한다."},{"id":"bbe52c30e1","s":1,"n":"219","q":"다음 중 Dead Freight(공적운임)에 관한 설명으로 옳은 것은?","o":["지불하지 않아도 되는 운임","손상된 화물의 운임","화물을 싣지 않고도 지불해야 하는 운임","선박이 파선하여 선주가 손해를 입은 운임"],"a":2,"e":"Dead Freight(공적운임·부적운임)는 용선자가 계약한 선복량보다 적게 선적한 경우 실제 미적재분에 대해서도 지급해야 하는 운임이다."},{"id":"e53ca645b6","s":1,"n":"220","q":"다음 중 불특정 화주를 상대로 운송서비스를 제공하는 운송인은?","o":["Forwarder","Common Carrier","Industrial Carrier","Consolidator"],"a":1,"e":"Common Carrier(공중운송인)는 불특정 다수 화주를 상대로 공표된 조건에 따라 운송서비스를 제공하며, 자가화물만 운송하는 Industrial Carrier와 구별된다."},{"id":"0ae0bdba3e","s":1,"n":"221","q":"다음에서 복합운송인의 책임체계 중 단일책임으로서 전운송구간 동일형은?","o":["Network Liability System","Uniform Liability System","Combined Liability System","Modified Uniform Liability System"],"a":1,"e":"Uniform Liability System(단일책임체계)은 손해 발생 구간이나 운송수단을 구분하지 않고 전 운송구간에 동일한 책임원칙과 한도를 적용하는 방식이다."},{"id":"d555a50ada","s":1,"n":"222","q":"다음에서 LCL화물을 모아 선사가 컨테이너에 적입하는 곳을 이르는 말은?","o":["Container Yard","Container Freight Station","Bonded Warehouse","ODCY"],"a":1,"e":"CFS(Container Freight Station)는 여러 화주의 LCL화물을 집화해 혼재(consolidation)·적입(vanning)하고 수입 시 분류·인도하는 장소이다."},{"id":"7f0a52c461","s":1,"n":"223","q":"다음 중 항공운송이나 복합운송 시 이용할 수 없는 정형거래조건은?","o":["FOB","FCA","CPT","CIP"],"a":0,"e":"FOB는 본선 적재를 기준으로 하는 해상 전용 조건이므로 항공·복합운송에는 부적합하고, 대응 조건으로 FCA를 사용한다."},{"id":"d8df1c17c0","s":1,"n":"224","q":"정형거래조건에 대한 다음의 설명 중 타당하지 않은 것은?","o":["FOB 조건에서 물품에 대한 위험부담의 분기점은 본선의 선측난간(Ship's Rail)이다.","FCA 조건에서 물품에 대한 위험부담의 분기점은 선적지에서 운송인에게 인도하는 시점이다.","CIF 조건에서 운송위험에 따라 손해가 발생하면 보험금은 매도인이 청구한다.","CIF 조건에서 매도인은 목적지까지의 운임 및 보험료를 부담하여야 한다."],"a":2,"e":"CIF에서 보험계약자는 매도인이나 위험은 선적 시 매수인에게 이전되므로, 운송 중 손해에 대한 보험금 청구는 보험증권을 배서양도 받은 매수인(피보험자)이 한다."},{"id":"75049a686f","s":1,"n":"225","q":"최초의 운송인이 전운송구간에 걸친 운송을 인수하고 그 전부 또는 일부를 다른 운송인에게 운송시키는 형태의 계약을 무엇이라 하는가?","o":["통운송계약","일괄운송계약","후속운송계약","혼합운송계약"],"a":0,"e":"통운송계약(through transport contract)은 최초 운송인이 전 구간 운송을 인수한 뒤 전부 또는 일부를 하수운송인에게 이행시키는 계약형태이다."},{"id":"77b84464d2","s":1,"n":"226","q":"다음에서 물품의 선적과 양륙에 소요되는 하역비를 화주가 모두 부담하는 조건은?","o":["F.I.","F.I.O.","Liner","F.O."],"a":1,"e":"F.I.O.(Free In and Out)는 선주가 선적·양륙 하역비 모두를 면하는 조건으로, 적양하 비용을 화주(용선자)가 전부 부담한다."},{"id":"f6f4bf7115","s":1,"n":"227","q":"다음 중 화주가 화물을 선적하는데 드는 비용만 부담하고 양륙비용은 선박회사에서 부담하는 하역조건은?","o":["F.I","F.O","liner terms","F.I.O"],"a":0,"e":"F.I.(Free In)는 선적비는 화주가, 양륙비는 선주가 부담하는 조건이며, 반대로 F.O.(Free Out)는 선적비 선주·양륙비 화주 부담이다."},{"id":"abd1977110","s":1,"n":"228","q":"다음 중 선적에 대한 다음 설명중 옳은 것은?","o":["Immediate shipment\"의 경우 수출승인후 30일 이내 선적해야 한다.","환적에 대한 언급이 없는 경우 환적은 금지된다.","선적일이 누락된 신용장은 무효이므로 신용장을 변경하여야 한다.","최종선적일이 공휴일이라도 반드시 최종선적일까지 선적하여야 한다."],"a":3,"e":"UCP600상 공휴일에 따른 익영업일 연장은 유효기일·제시기간에만 적용되고 최종선적일(latest shipment date)은 연장되지 않는다. 환적은 금지 명시가 없으면 허용된다."},{"id":"d3b2e7c7f8","s":1,"n":"229","q":"다음 중 SLB에 대한 설명으로 옳은 것은?","o":["극동에서 미국대서양연안까지의 복합운송루트를 말한다.","극동에서 미국 태평양 연안까지의 복합운송을 말한다.","극동에서 유럽까지의 복합운송구간 중 시베리아횡단철도를 이용하는 방식이다.","극동에서 미국을 통하여 남미로 수출되는 화물의 복합운송구간이다."],"a":2,"e":"SLB(Siberian Land Bridge)는 극동에서 유럽·중동행 화물을 해상운송과 시베리아횡단철도(TSR)로 연결하는 대륙횡단 복합운송 경로이다."},{"id":"d4d27996d7","s":1,"n":"230","q":"선화증권통일조약(Hague Rule)에서 규정하고 있는 선박회사의 면책사항이 아닌 것은?","o":["천재지변","상업과실","해난위험","전쟁위험"],"a":1,"e":"Hague Rules는 항해과실(nautical fault)·화재·불가항력·해상위험 등은 면책하지만, 화물의 적부·보관 등 상업과실(commercial fault)에 대해서는 면책되지 않는다."},{"id":"86f63f41c3","s":1,"n":"231","q":"다음 중 항공화물운송의 설명으로 옳지 않은 것은?","o":["운송보험료가 싸다.","화물의 적기인도를 통한 재고비용의 절감이 가능하다.","대량화물의 중단거리운송에 적합하다.","물품의 파손율이 적으며 포장비용이 적게 든다."],"a":2,"e":"항공운송은 소량·고가·긴급화물의 장거리 운송에 경쟁력이 있으며, 대량화물의 중·단거리 운송은 해상 또는 육상운송이 유리하다."},{"id":"352b44dedf","s":1,"n":"232","q":"다음중 화물운송과 직접적으로 관련 있는 국제규칙이 아닌 것은?","o":["The Warsaw Conventions, 1929","United Nations Convention on the Carriage of Goods by Sea, 1978","Revised American Foreign Trade Definitions, 1941","International Convention for the Unification of Certain Rules of Law Relating to Bills of Lading, 1924"],"a":2,"e":"Revised American Foreign Trade Definitions(1941)는 정형거래조건 해석규칙이며, 나머지는 각각 항공(바르샤바)·해상(함부르크 규칙)·선하증권(헤이그 규칙) 운송조약이다."},{"id":"22530a5dd1","s":1,"n":"233","q":"다음 중 복합운송의 경우가 아닌 것은?","o":["운송책임의 단일성","복합운송증권발행","일관운임설정","운송주선인만 관여한 운송"],"a":3,"e":"복합운송은 2가지 이상 상이한 운송수단의 결합을 전제로 단일책임·단일운임·복합운송증권을 요건으로 하므로, 주선인만 개입한 단일수단 운송은 복합운송이 아니다."},{"id":"7a211096a2","s":1,"n":"234","q":"다음중 복합운송인이 발행하는 복합운송증권(CTD)의 특징으로 적절하지 못한 것은?","o":["도로․철도․내수로․해상 또는 항공운송이 결합된 복합운송이 상이한 운송인에 의하여 이루어지더라도 복합운송증권은 처음부터 끝까지 전운송구간을 커버하는 서류이다.","복합운송증권은 복합운송인에게 통운송(through transport)의 전체적인 책임을 지고, 어느 구간에서 발생하였든 화물의 멸실이나 손상에 대해 책임을 지는 해상운송인이 발행한다.","복합운송증권은 실질적인 운송인(actual carrier)에 의해서만 발행되는 선하증권과는 달리 운송인 뿐만 아니라 운송주선인(freight forwarder)에 의해서도 발행된다.","복합운송증권은 본선적재 전에 복합운송인이 수탁 또는 수취한 상태에서 발행되는 서류이다."],"a":1,"e":"복합운송증권(CTD)은 전 구간 책임을 인수한 복합운송인(MTO)이 발행하며 실제운송인이 아닌 운송주선인도 발행할 수 있으므로, 해상운송인이 발행한다는 서술은 옳지 않다."},{"id":"d7bbcf8e50","s":1,"n":"235","q":"다음 중 정기선 경영회사의 경영요건과 관련이 적은 것은?","o":["적절한 수의 선박","1척의 선박만으로도 운영","해외점포구성","터미널 시설구비"],"a":1,"e":"정기선(liner)은 공표된 스케줄에 따른 규칙적 배선이 생명이므로 적정 척수의 선박, 해외 대리점망, 터미널 시설이 필요하며 1척만으로는 운영이 불가능하다."},{"id":"1baae7ca57","s":1,"n":"236","q":"다음에서 부정기선을 경영하는 회사가 중점을 두어야 할 사항과 관계가 먼 것은?","o":["적절한 배선을 통한 유리한 수요에 계약","운임률의 급격변동 고려","전용부두 및 창고를 구비","정확한 정보수집을 통한 물동량 파악"],"a":2,"e":"부정기선(tramper)은 화물·항로가 수시로 변하므로 시황·물동량 정보수집과 운임률 변동 대응이 핵심이며, 전용부두·창고 구비는 정기선이나 전용선 경영의 요건이다."},{"id":"b1091ab05f","s":1,"n":"237","q":"장기운송계약(COA)를 체결했을 해운경영에 주는 이점에 적절한 내용이 아닌 것은?","o":["장기계약을 담보로 자금조달용이","해운시황변동에 따른 위험을 감소","단기용선을 통해 조달하여 안정성 확보","안정된 경영으로 해운 산업발전에 기여"],"a":2,"e":"COA(장기운송계약)의 이점은 안정적 물량 확보와 시황변동 위험 회피, 계약 담보 금융조달인데, 단기용선 의존은 오히려 시황 변동에 노출되므로 취지에 반한다."},{"id":"5b9e3e8134","s":1,"n":"238","q":"다음 중 해운기업에서의 품질관리의 중요성이 대두된 배경을 설명한 것과 관계가 적절하지 못한 것은?","o":["선박의 전문화 및 대형화","해양오염 및 해양사고의 대형화","해양환경보호를 위한 시스템 개발","해운구간의 단일운임을 적용과 책임"],"a":3,"e":"해운 품질관리(ISM 등)는 선박의 대형화·전문화, 해양사고와 오염의 대형화, 환경보호 시스템 요구에서 대두되었고 단일운임 적용은 운임정책 문제로 무관하다."},{"id":"04ffacd9a5","s":1,"n":"239","q":"다음 중 해운기업의 품질관리를 위한 ISM 코드의 목적으로 타당하지 않은 것은?","o":["국제적 기준 이상의 수준유지","선박의 안전 및 해양오염방지","해운기업의 해상 및 육상부서의 안전관리 시스템 수립","선박안전관리에 관련된 사람의 범위를 축소하여 인건비 절약"],"a":3,"e":"ISM Code는 국제기준 이상의 안전수준 유지, 선박안전·해양오염방지, 육상·해상 조직의 안전관리시스템(SMS) 수립을 목적으로 하며 인력 축소나 인건비 절감은 목적이 아니다."},{"id":"b49c92b164","s":1,"n":"240","q":"다음에서 ISM코드의 경제적인효과를 통한 기대효과로 올바르지 않은 것은?","o":["인명과 재산피해의 감소","생산성향상을 통한 비용의 절감","보험료의 상승","대형해난 사고의 최소화"],"a":2,"e":"ISM Code 이행은 사고와 인적·물적 피해를 줄이고 운항 효율을 높여 보험료 인하 효과를 가져오므로, 보험료 상승은 기대효과가 아니다."},{"id":"f7ec60ba82","s":1,"n":"241","q":"ISM 코드에 의거한 안전관리시스템은 의무적으로 외부심사를 받아야 하는 내용을 설명한 것 중 올바르지 않은 것은?","o":["육상조직 - 매년 연차심사","선박 - 2년 6개월에 중간심사","선박 - 매 5년마다 갱신심사","육상조직 - 매 2년마다 갱신심사"],"a":3,"e":"외부심사는 육상조직 DOC의 경우 매년 연차심사와 5년마다 갱신심사, 선박 SMC의 경우 중간심사와 5년마다 갱신심사로 구성되므로 육상조직 2년 갱신은 틀리다."},{"id":"7043d77111","s":1,"n":"242","q":"다음에서 ISM 코드의 기대 효과라고 할 수 없는 것은?","o":["인명과 재산 피해를 야기시킬 수 있는 사고의 감소","선박 운항 효율의 증가","안전 및 환경보호를 위한 안전문화의 확립","항만국 통제(PSC)의 면제"],"a":3,"e":"ISM Code 인증(DOC·SMC) 취득은 사고 감소, 운항효율 향상, 안전문화 확립에 기여하지만 항만국통제(PSC) 면제 사유는 아니며 오히려 PSC 점검 항목이 된다."},{"id":"2c8342fab2","s":1,"n":"243","q":"다음 중 해사관습과 해사실무를 통일하는 해사사법의 기관은?","o":["UN 무역개발회의(UN Conference on Trade and Development)","국제해법회(Commite Maritime International)","국제해사기구(Inter-Governmental Maritime Consulatiative Organization)","국제해운회의소(International Chamber of Shipping)"],"a":1,"e":"국제해법회(CMI, Comité Maritime International)는 해사관습과 해사실무·해상법의 국제적 통일을 추진하는 민간 학술단체로 주요 해사조약 초안을 마련해 왔다."},{"id":"1af8791deb","s":1,"n":"244","q":"다음 중 운송인인 선박회사가 다수의 송화인의 개개의 화물을 운송하는 것을 인수하는 계약은?","o":["용선운송계약","정기용선계약","개품운송계약","항해용선계약"],"a":2,"e":"개품운송계약은 운송인이 다수 송하인의 개별 화물을 인수해 운송하는 계약으로 정기선에서 선하증권 발행으로 성립하며, 선복 전부·일부를 빌리는 용선계약과 구별된다."},{"id":"49b20c3c07","s":1,"n":"245","q":"다음 중 항해용선계약의 특징을 설명한 것으로 바람직하지 못한 것은?","o":["선장은 선주가 임명한다.","항해 항차수를 계약내용으로 한다.","용선자가 부족한 선복을 보충하기 위해서이다.","항해에 대한 대가는 운임이며, 선박적재량 또는 선복량에 따라 지불한다."],"a":2,"e":"부족한 선복을 보충하기 위해 일정 기간 선박을 빌리는 것은 정기용선(time charter)의 목적이며, 항해용선은 특정 항해 단위로 선복을 빌려 운임을 지급하는 계약이다."},{"id":"ad9c68a54b","s":1,"n":"246","q":"다음에서 해상기업으로 적용되지 않는 것은?","o":["해상예선업","해난구조업","해상보험업","준설업"],"a":2,"e":"해상보험업은 해상위험을 인수해 해상기업을 지원하는 보조적 업종이며, 예선업·해난구조업·준설업은 선박을 이용해 직접 해상활동을 하는 해상기업에 속한다."},{"id":"a4b9756d06","s":1,"n":"247","q":"다음 해상운송에서 선박의 성질에 관한 설명 중 올바른 것은?","o":["동산성","비인격성","합성물","법인성"],"a":2,"e":"선박은 선체·기관·속구 등이 결합된 합성물로서, 동산이지만 등기·저당 대상이 되어 부동산에 준해 취급되고 선명·국적 등 인격성도 인정된다."},{"id":"8e1fa8225d","s":1,"n":"248","q":"다음에서 해상기업의 주체가 아닌 자는 누구인가?","o":["정기용선자","선박공유자","선박소유자","선박의 선장"],"a":3,"e":"해상기업의 주체는 선박소유자·선박공유자·선박임차인·정기용선자 등이며, 선장은 선박소유자를 위해 항해를 지휘하는 해상기업 보조자에 해당한다."},{"id":"867337180d","s":1,"n":"249","q":"다음에서 해상운송은 컨테이너화 되어 가고 있는데 그 이유로 올바른 것은?","o":["자본이 적게 소요된다.","선박의 정박 기간이 늘어난다.","안전하게 운송할 수 있다.","하역인부를 많이 고용할 수 있다."],"a":3,"e":"'해상운송이 컨테이너화되는 이유' → 회사 정답은 하역인부를 많이 고용할 수 있다는 ④다. 보기 ④로 고정해 암기한다. ⚠[정답 논란] 컨테이너화의 본래 효과는 파손·도난 감소에 따른 안전한 운송이며 하역인력과 정박기간은 오히려 줄어들므로, 일반 이론상 정답은 ③이다. 다만 채점은 회사 제공 정답 ④ 기준이므로 시험에서는 ④로 답할 것.","c":{"t":2,"n":"컨테이너화의 본래 효과는 파손·도난 감소에 따른 안전한 운송이며 하역인력과 정박기간은 오히려 줄어들므로, 일반 이론상 정답은 ③이다."}},{"id":"20725937aa","s":1,"n":"250","q":"해운원가의 특성을 기술한 것 중 바람직하지 못한 것은?","o":["운송원가는 생산을 전제로 원가각 계상된다.","해운원가는 진행기준(기간별) 원가계산이다.","해운원가에서 금리는 선비로 인정되지 않는다.","복합운송의 경우는 그에 따른 원가도 계상해야 한다."],"a":2,"e":"차입금 이자 등 금리는 선박 취득과 관련된 자본비(capital costs)로서 선비에 계상되므로, 선비로 인정되지 않는다는 서술은 옳지 않다."},{"id":"1639a2e20a","s":1,"n":"251","q":"해운원가의 구성요소로 해당되지 않는 것은?","o":["자본비","관리비","재고비","운항비"],"a":2,"e":"해운원가는 자본비(선비)·운항비·관리비 등으로 구성되며, 재고자산이 발생하지 않는 용역산업이므로 제조업식 재고비는 원가 구성요소가 아니다."},{"id":"a59add0835","s":1,"n":"252","q":"화물량의 증감에 따라 비례하여 발생하는 제반비용은?","o":["화물변동비","운항변동비","운항고정비","일반관리비"],"a":0,"e":"화물변동비는 하역비·화물비·대리점비처럼 취급 화물량의 증감에 비례해 발생하는 비용이다. 운항고정비·일반관리비는 화물량과 무관하게 발생한다."},{"id":"5c48fd3a14","s":1,"n":"253","q":"선박을 운항가능한 상태로 유지하기 위한 비용은?","o":["일반관리지","운항변동비","운항고정비","영업외비용"],"a":2,"e":"운항고정비는 화물량과 무관하게 선박을 운항 가능한 상태로 유지하기 위해 지출되는 선원비·수리비·보험료·감가상각 관련 비용 등을 말한다."},{"id":"1df59c2d93","s":1,"n":"254","q":"다음 중 선박의 입출항 및 정박을 위한 제반비용인 항비의 종류가 아닌 것은?","o":["도선료(pilotage)","예선료(tug charge)","부두사용료(wharfage)","운항준비비(Running cost)"],"a":3,"e":"항비(port charges)는 도선료·예선료·부두사용료·입항료·계선료 등 입출항과 정박에 드는 비용이며, 운항준비비는 선박 취항 이전 단계의 준비비용이므로 항비가 아니다."},{"id":"5a40a2e7d0","s":1,"n":"255","q":"화물변동비 중 화물 수입 및 화물량의 크기에 따라 발생하는 비용은 다음 중 어느 것인가?","o":["하역비","화물비","장비비","대리점비"],"a":3,"e":"대리점비는 대리점 수수료 형태로 화물 유치 실적, 즉 운임수입과 화물량 규모에 연동해 발생하는 화물변동비다."},{"id":"d32718d438","s":1,"n":"256","q":"해운용역을 생산하기 위한 원가의 발생을 인식하고 이를 분류, 종합, 분석하는 것을 의미하는 것은?","o":["일반관리비계산","선박취득관리비계산","운항준비비용계산","해운원각계산"],"a":3,"e":"해운원가계산은 해운용역 생산에 소요된 원가의 발생을 인식하고 이를 분류·집계·분석하는 일련의 회계 절차를 말한다."},{"id":"133237368b","s":1,"n":"257","q":"해운원가계산의 목적으로 타당하지 않는 것은?","o":["판매가격의 결정에 필요한 원가자료를 제공","예산집행계획 및 통제에 필요한 원가자료를 제공","선박투입을 위한 운항준비비계상을 제공","화물운송에 따른 손익을 계산하는데 필요한 원가자료를 제공"],"a":2,"e":"해운원가계산의 목적은 운임(판매가격) 결정, 예산 편성·통제, 항로별 손익 계산 자료 제공이며, 운항준비비 계상 자체는 목적이 아니라 원가 항목의 처리 문제다."},{"id":"7dfc393902","s":1,"n":"258","q":"해상운임의 종류에서 운임부과방법에 따른 분류로 적당하지 않은 것은?","o":["종가운임(ad valorem freight)","차별운임(discrimination rate)","최저운임(minmum rate)","경쟁운임(open rate)"],"a":3,"e":"운임부과방법에 따른 분류는 종가운임·최저운임·차별운임·무차별운임 등이며, 경쟁운임(open rate)은 해운동맹이 운임을 개방해 자유 경쟁에 맡기는 운임 결정방식상의 구분이다."},{"id":"436fa0e6e7","s":1,"n":"259","q":"북미 태평양 연안항만에거 하역되어 동부내륙지역으로 육상운송되는 화물에 대해 낮은 해상운임률을 적용하여 화물을 유치하기 위한 정책운임은 다음 중 어느 것인가?","o":["무차별 운임(freight all kinds rate)","경쟁운임(open rate)","특별운임(Special rates)","O.C.P. Rate(overland common point rate)"],"a":3,"e":"O.C.P. Rate는 북미 태평양안 항만에서 양륙 후 내륙공동지점(Overland Common Point)까지 육상운송되는 화물에 낮은 해상운임률을 적용해 화물을 유치하는 정책운임이다."},{"id":"152103f766","s":1,"n":"260","q":"한 개의 중량이 3톤 이상의 초중량화물에 부과하는 할증료는 다음 중 어느 것인가?","o":["장척할증료(lengthy surcharge)","중량할증운임(heavy lift surcharge)","용적할증운임(measurement surcharge)","체선할증료(port cogestion surcharge)"],"a":1,"e":"중량할증운임(heavy lift surcharge)은 단일 화물의 중량이 일정 기준(3톤 등)을 초과할 때 특수 하역설비와 위험 부담을 반영해 부과하는 할증료다."},{"id":"48fe0c2d67","s":1,"n":"261","q":"부정기선 운임의 산정기준에 대해 서술한 내용 중 적합하지 않은 것은?","o":["운임조건은 용선계약에 의해 결정된다.","운임은 적재화물의 수량에 대해 결정한다.","운임은 중량과 용적에 의해 결정된다.","운임은 선복에 대하여 결정되기도 한다."],"a":2,"e":"중량과 용적 중 큰 쪽을 택해 부과하는 방식은 정기선(liner) 운임의 특징이고, 부정기선 운임은 용선계약에 따라 적재화물 수량이나 선복 전체(lumpsum) 기준으로 결정된다."},{"id":"e531fd694d","s":1,"n":"262","q":"다음 중 부적운임(dead freight)에 대한 설명 중 적합한 것은?","o":["기항지 간에 용적이나 중량 등을 기준으로 한 운임을 말한다.","선적 시에 양하항을 확정하지 않고 출항 후 일정기간 뒤에 양하항이 지정되는 양하선택권부 화물에 부과하는 운임을 말한다.","송화인이 운송계약체결 후 화물의 관리를 태만하게 하였거나 또는 여약한 선적을 이행하지 못한 경우 선주에게 지불해야 할 운임을 말한다.","해운동맹이 비동맹선사와의 경재, 특정화물의 유치, 대량화물에 대한 우대 등을 위해 일정조전을 갖춘 굥우 요율을 인하하여 적용하는 운임을 말한다."],"a":2,"e":"부적운임(dead freight)은 송화인이 약정한 선적량을 채우지 못해 비게 된 선복에 대해 선주에게 지급하는 손해배상적 성격의 운임이다."},{"id":"463b3d2921","s":1,"n":"263","q":"다음은 해상운임의 지급 시기에 대하여 서술한 내용 중 적합하지 않은 것은?","o":["해상운임은 선적과 동시에 송화인에게 지급하는 운임을 선불운임(freight prepaid)라고 한다.","양륙지에서 매수인이 화물을 수령할 때 지급하는 운임을 후불운임(freight collect)라고 한다.","일반적으로 CIF계약이나 CFR계약에서는 통상운임이 후불로 지불 된다.","FOB와 같이 후불인 경우에는 양륙지에서 화물인도지시서(Delivery Order) 발급일, 즉 운임지급일의 환율을 적용한다."],"a":2,"e":"CIF·CFR은 매도인이 운임을 부담하는 조건이므로 통상 선불운임(freight prepaid)으로 지급되며, 후불운임(freight collect)은 FOB처럼 매수인이 운임을 부담하는 조건에서 사용된다."},{"id":"289274f7d9","s":1,"n":"264","q":"다음에서 항공운송을 선택하는 화물의 종류라고 할 수 있는 것은?","o":["고가화물(보석, 반도체 등)","장척화물","저가화물","산적화물"],"a":0,"e":"항공운송은 운임 부담률이 높아 보석·반도체·의약품처럼 단위당 가치가 크고 긴급성·정시성이 요구되는 고가 소량화물에 적합하다."},{"id":"23b4b1018f","s":1,"n":"265","q":"다음 중 화물의 수량이 많은 경우에 이용할 수 있는 운송수단은?","o":["자동차운송","항공운송","해상운송","복합운송"],"a":2,"e":"해상운송은 대량 수송성과 장거리 저운임이라는 규모의 경제 특성을 지녀 벌크·컨테이너 등 대량화물 수송에 가장 유리하다."},{"id":"64bd9036bf","s":1,"n":"266","q":"다음 중 복합운송 할 때 화물의 손상에 대해 책임을 지는 사람은?","o":["선주","화주","트럭운송버자","복합운송인"],"a":3,"e":"복합운송인(MTO)은 전 구간에 대해 단일계약·단일운임으로 화주에게 일괄책임(single liability)을 지므로 손상 발생 구간과 무관하게 책임 주체가 된다."},{"id":"314eee6770","s":1,"n":"267","q":"다음에서 운송 물류 활동을 구성하는 요소가 아닌 것은?","o":["운송모드(mode)","운송 네트워크(network)","운송 노드(node)","운송 링크(link)"],"a":1,"e":"운송물류 활동은 운송수단인 모드(mode), 결절점인 노드(node), 연결선인 링크(link)로 구성된다. 네트워크는 이들이 결합된 결과 체계일 뿐 개별 구성요소가 아니다."},{"id":"3912e8c56d","s":1,"n":"268","q":"다음에서 정기선 항로에서 컨테이너 운송과 재래식 정기선에서 사용하는 계약은?","o":["개품운송계약","항해용선계약","정기용선계약","물건운송계약"],"a":0,"e":"정기선 항로의 컨테이너·재래정기선 운송은 다수 화주의 개별 화물을 인수하는 개품운송계약(contract of carriage in a general ship)으로 체결되며 선하증권이 그 증거가 된다."},{"id":"6ded5534ed","s":1,"n":"269","q":"부정기선 항로에서 항해용선계약을 체결 했을 시 운송의 책임자는 누구인가?","o":["선주","화주","해상운송인","중개인"],"a":2,"e":"항해용선에서도 화물운송의 이행책임은 운송인(carrier) 지위에 있는 선주 측, 즉 해상운송인이 부담하며 감항능력주의의무와 화물관리의무를 진다."},{"id":"c177d9de45","s":1,"n":"270","q":"개품운송계약의 대표적인 것은 컨테이너 운송이고, 이는 국제해운에서 어떤 계약으로 발전하였는가?","o":["국제복합운송계약","항해용선계약","정기용선계약","물건운송계약"],"a":0,"e":"컨테이너화로 해상구간이 육상·항공과 결합되면서 개품운송계약은 단일책임·단일운임의 국제복합운송계약(multimodal transport contract)으로 발전하였다."},{"id":"0b1c81b02a","s":1,"n":"271","q":"해상운송인은 송하인에게 운항광고에 명시한 지정항과 운항표에 따라서 감항 능력이 있는 선박을 정시에 입항시켜야 할 의무는?","o":["하역준비완료통지의무","선박제공의 의무","감항능력주의의무","항해을 빨리 완성할 의무"],"a":1,"e":"배선표상 지정항에 감항성 있는 선박을 예정 시기에 배선·제공해야 하는 것은 운송인의 선박제공의무이며, 이는 감항능력주의의무와 구별된다."},{"id":"39b9033741","s":1,"n":"272","q":"다음에서 운송 모드(mode)에 해당되는 것이 아닌 것은?","o":["해상운송","복합운송","화물터미널","항공운송"],"a":2,"e":"운송 모드는 해상·항공·철도·도로 등 실제 운송수단을 뜻한다. 화물터미널은 화물의 집화·환적이 일어나는 노드(node)에 해당한다."},{"id":"973b4ab11f","s":1,"n":"273","q":"다음에서 일반적으로 생산자의 공장에서 소비자의 문전까지 문전 서비스를 하는 형태의 운송 서비스는?","o":["해상운송","복합운송","철도운송","항공운송"],"a":1,"e":"복합운송은 서로 다른 두 개 이상의 운송수단을 결합해 생산자 공장에서 소비자 문전까지 이어지는 door to door 서비스를 제공한다."},{"id":"0f847ce68a","s":1,"n":"274","q":"다음에서 본선인도조건(free on board:FOB)에 대한 설명 중 적절하지 않은 것은?","o":["무역 상거래 조건의 하나로 FOB의 가격은 수입항 인도 가격이라고 한다.","매도인이 본선상에서 화물의 인도를 마칠 때까지의 일체의 비용과 위험을 부담한다.","FOB의 가격은 무역상품을 수출항에서 매수자에게 인도할 때의 가격을 말한다.","화물의 인도이후에는 매수인의 책임이 된다."],"a":0,"e":"FOB는 수출항 본선 적재(on board)를 인도지점으로 하는 수출항 인도가격이며, 그때까지의 비용·위험은 매도인이 지고 이후는 매수인에게 이전된다."},{"id":"16e6c4b76b","s":1,"n":"275","q":"화물을 도착항에서 인도를 받으려면 반드시 필요한 유가 증권은?","o":["환어음","선하증권","약속어음","지급위탁증권"],"a":1,"e":"선하증권(B/L)은 화물인도청구권을 표창하는 권리증권이자 유가증권이므로 도착항에서 화물을 수령하려면 원본 제시가 필요하다."},{"id":"52a7ed19bb","s":1,"n":"276","q":"본선이 목적항에 입항한 후 수화인은 선화증권을 선박회사에 주고 지급 받는 서류는?","o":["화물인도지시서","소요량증명서","원산지 증명서","구매확인서"],"a":0,"e":"수화인이 원본 B/L을 선사에 제출하면 선사는 화물인도지시서(D/O)를 발급하고, 수화인은 이를 창고·CY 측에 제시해 화물을 인수한다."},{"id":"624b297726","s":1,"n":"277","q":"다음에서 용선운송에서 B/L 보다 우선하는 것은?","o":["지급위탁증권","용선계약서","지연손해금","용선료"],"a":1,"e":"용선운송에서 B/L은 운송조건의 증거일 뿐이고 용선자와 선주 사이의 권리·의무는 용선계약서(charter party)가 우선 규율한다."},{"id":"5db551d127","s":1,"n":"278","q":"다음 중 자본력이 약한 운항선사가 선복을 보충하면서 선대(fleet)를 늘리는 일종의 할부제도 내지 리스제도는?","o":["나용선계약","항해용선계약","정기용선계약","선복용선계약"],"a":0,"e":"나용선계약(bareboat charter), 특히 국적취득조건부 나용선(BBCHP)은 용선료를 분할 납부하며 선박을 확보하는 할부·리스형 선대 확충 방식이다."},{"id":"10d93d1b5c","s":1,"n":"279","q":"다음에서 발틱국제해사위원회에 대한 설명으로 적절한 것은?","o":["1905년 발틱해와 백해지역의 교역에 주로 참여하던 선주들의 공동이익을 위하여 코펜하겐에서 창설된 순수 민간기구이다.","국적을 불문하고 선박을 검사하고 선급을 정하여 100톤 이상의 모든 항해선의 등급과 내용이 기록된 Lloyd's Register Book을 통하여 정보를 제공함에 있다.","국가별 대리점협회와 개별 대리점으로 구성된 기구로서 1926년 비엔나에서 국제적인 대리업의 확장에 따른 제반 문제점을 다루기 위해 설립되었다.","선원문제에 관한 선주의 권익보호와 자문을 위해 1909년 창설된 민간기구로 런던에 본부를 두고 있다."],"a":0,"e":"BIMCO(발틱국제해사위원회)는 1905년 코펜하겐에서 발틱해·백해 교역 선주들의 공동이익을 위해 설립된 민간기구로 표준계약서식을 제정한다."},{"id":"47d13373fb","s":1,"n":"280","q":"다음에서 운송인(carrier)인 선박회사가 다수의 송화인의 개개의 화물을 운송하는 것을 인수하는 계약은?","o":["나용선계약","개품용선계약","정기용선계약","선복용선계약"],"a":1,"e":"다수 송화인의 개별 화물을 인수하는 계약은 개품운송계약이다(보기 ②의 '개품용선계약'은 표기 오류로 개품운송계약을 지칭)."},{"id":"e21c6dbfb4","s":1,"n":"281","q":"다음은 개품운송계약의 설명으로 올바르지 않은 것은?","o":["개품운송계약에서 운송계약은 불요식 계약이므로 별도의 계약서 작성은 필요 없다.","무역계약상의 가격조건에 따라 선복을 확보하여야 할 책임이 수출업자에 있는지 또는 수입업자에 있는지가 결정된다.","개품운송계약은 송화인 또는 그 대리인인 운송인이 선박회사, 대리점, freight forwarder 등이 발행하는 배선표를 잘 검토하여 적당한 선박을 선정한 다음 운송을 신청하여 운송인이 이를 승낙함으로써 운송계약이 체결된다.","타인소유의 선박을 일정한 조건을 정하여 차용할 때의 계약을 말한다."],"a":3,"e":"타인 소유 선박을 조건을 정해 차용하는 것은 용선계약(charter party)의 정의이며, 개품운송계약은 선복의 일부에 화물 단위로 운송을 위탁하는 계약이다."},{"id":"5ef5af1410","s":1,"n":"282","q":"다음에서 선주는 일체의 선박부속용구를 갖추고 선원을 승선시키는 등 선박의 운항상태를 갖추어 선박을 소정의 항구에서 용선자에게 인도하여야 하는 의무의 계약은?","o":["나용선계약","기간용선계약","정기용선계약","선복용선계약"],"a":1,"e":"선원 배승·선용품 구비 등 운항 가능한 상태로 선박을 인도하는 것은 기간용선(time charter, 정기용선)에서 선주가 지는 의무다. 나용선은 선체만 인도한다."},{"id":"f8465e300b","s":1,"n":"283","q":"다음에서 서로다른 운송수단이 2개이상 결합되어 있지만 운송구간에 대한 단일 책임을 지는 운송수단은?","o":["해상운송","항공운송","철도운송","복합운송"],"a":3,"e":"복합운송은 2개 이상 이종 운송수단을 결합하면서도 복합운송인이 전 구간에 단일책임을 지는 형태로, 통운송(through transport)과 구별된다."},{"id":"32a713e0f4","s":1,"n":"284","q":"본선이 입항하면 CY 운영자는 집화된 컨테이너를 갠드리크레인을 사용하고 선적하고, 송화인에게 무엇을 발급해 주는가?","o":["환어음","지급위탁증권","약속어음","선하증권"],"a":3,"e":"CY 운영자가 집화·선적을 마치면 운송인은 화물 수취와 운송계약을 증명하는 선하증권을 송화인에게 발급한다."},{"id":"2462cd5558","s":1,"n":"285","q":"다음에서 운송수단을 직접 보유하지 않고 선박회사, 항공회사, 철도회사 등의 실제운송인을 하청운송인으로 사용하여 운송사업을 하는 자는?","o":["철도운송인","해상운송인","항공운송인","복합운송인"],"a":3,"e":"복합운송인(계약운송인·NVOCC)은 자기 운송수단 없이 선사·항공사·철도를 실제운송인으로 하청시켜 자기 명의로 운송을 인수한다."},{"id":"148f117083","s":1,"n":"286","q":"다음의 국가들 중 Hague Rules에 가입을 하지 않은 나라는?","o":["Canada","France","Australia","Japan"],"a":1,"e":"Canada·Australia·Japan은 Hague Rules(1924)을 국내법으로 수용한 당사국으로 제시되며, 시험 기준상 France는 미가입국으로 분류된다."},{"id":"0ad959c445","s":1,"n":"287","q":"다음에서 선하증권의 이전(transfer)에 대한 설명으로 적절하지 않은 것은?","o":["선하증권 소유자가 자기의 소유권을 새로운 소유자에게 이전시키는 목적으로 그 물건을 타인에게 교부하는 것을 이전(transfer)이라 한다.","지시식 선하증권, 배서금지문언이 없는 기명식 선하증권, 무기명식 선하증권 및 선택무기명식 선하증권의 이전은 양도라고 한다.","양도배서금지문언이 있는 기명식 선하증권의 이전은 지명채권양도라고 한다.","선하증권에서 양도는 기명식 선하증권에 대하여 사용된다."],"a":3,"e":"양도(assignment)는 지시식·무기명식 등 유통성 증권의 이전에 쓰이며, 배서금지 기명식 B/L의 이전은 지명채권양도가 된다. 기명식 전용이라는 서술은 옳지 않다."},{"id":"f65b8d5fb0","s":1,"n":"288","q":"다음에서 기명식 선하증권과 이전(transfer)에 대한 설명으로 올바르지 않는 것은?","o":["기명식 선하증권은 양도는 가능하다.","기명식 선하증권의 양수인은 양도된 취지를 운송인에게 합법적으로 통지하여야 된다.","기명식 선하증권의 양도된 사실을 통지 하기 전에 이미 양도인에게 물건이 인도된 경우에 양도는 무효가 된다.","선하증권에서 양도는 기명식 선하증권에 대하여 사용된다."],"a":2,"e":"통지 전에 양도인에게 화물이 인도되었다 해도 양도 자체가 무효로 되는 것은 아니며, 운송인의 선의 인도가 면책되고 양수인은 양도인에게 책임을 물을 수 있다."},{"id":"669c3155ab","s":1,"n":"289","q":"다음에서 해상화물 운송장의 법적 특징으로 관계가 먼 것은?","o":["물품을 수취 또는 선적을 증명하는 서류라는 점에서는 B/L의 성격과 일치한다.","물품을 인수하기 위하여 수화인의 운송인에게 제시하여야 하는 B/L과는 달리 제시할 필요가 없다.","해상화물운송장은 물품을 대표하는 유가증권적 성격이 강하다.","해상화물운송장은 기명식으로된 유통불능성의 성격을 지니고 있다."],"a":2,"e":"해상화물운송장(Sea Waybill)은 화물수취증·운송계약 증거일 뿐 유통성 없는 기명식 서류로 권리증권성이 없다. 유가증권적 성격이 강하다는 것은 B/L의 특징이다."},{"id":"d0b8d7ffdd","s":1,"n":"290","q":"다음 중 선하증권의 이전과 관련된 용어의 부적절한 설명은?","o":["이전은 유통증권 또는 권리증권의 소유자가 자기의 소유권을 새로운 소유자에게 이전시키는 목적으로 그 물건을 타인에게 교부하는 것을 말한다.","유통은 양도의 개념으로 증권상의 권리를 유통이라는 방법으로 양수받은 자는 증권상의 정당한 권리자이지만, 정당한 소지인이 아니다.","배서는 유통증권의 소지인이 가지고 있는 증권상의 권리를 타인에게 이전하는 목적으로 통상 그 증권의 배면에 서명하고 피이전자에게 이것을 교부하는 것을 말한다.","양도는 화물의 양도와는 달르기 때문에 배서의 형식과 그 방법은 중요치 않다."],"a":3,"e":"배서(endorsement)는 법정 형식에 따라 증권 배면에 서명·교부해야 효력이 생기므로, 형식과 방법이 중요하지 않다는 서술은 성립하지 않는다."},{"id":"d586d7c893","s":1,"n":"291","q":"다음에서 Hague Rules에 대한 설명으로 적합하지 않은 것은?","o":["Hague Rules는 선하증권에 대한 약간의 통일에 관한 국제조약이다.","Hague Rules는 각국의 해상물건운송법에 대한 특별법의 지위만을 가지고 있을 뿐이다.","Hague Rules의 적용을 받는 해상물건운송계약은 선하증권 또는 이와 유사한 권리증권에 의해 증명된 운송계약에 한한다.","Hague Rules는 단순히 선하증권만을 규정하는 통일법으로 그 지위를 갖는다."],"a":3,"e":"Hague Rules는 선하증권에 관한 일부 규칙을 통일하고 운송인의 책임·면책·책임한도를 규율하는 조약으로, 선하증권만을 규정하는 완결적 통일법은 아니다."},{"id":"84c0da729b","s":1,"n":"292","q":"다음에서 유통불능선하증권(Non-negotiable B/L)에 대한 설명으로 올바르지 않는 것은?","o":["유통불능선하증권(Non-negotiable B/L)은 권리증권이라고 볼 수 없다.","유통불능선하증권은 물건을 수령해야 할 사람이 특정인으로 되어 있는 기명식 선하증권(Straight B/L)을 말한다.","유통불능선하증권은 물건의 인도청구권을 표창하고 물건을 상징하고 있기 때문에 권리증권이라고 할 수 있다.","유통불능선하증권의 경우, 선박회사는 물건을 목적지에서 수화인 난에 기재된 특정인에 인도하는 의무를 부담하고 있으므로 선하증권의 제시와는 관계가 없다."],"a":2,"e":"유통불능선하증권(Straight B/L)은 특정 기명 수화인에게만 인도되어 배서·양도로 유통되지 않으므로 권리증권성이 부정된다는 것이 이 문제의 전제다."},{"id":"61d90b2c6e","s":1,"n":"293","q":"다음에서 유통가능선하증권(Negotiable B/L)에 대한 설명으로 부적합한 것은?","o":["유통가능선하증권(Negotiable B/L)은 선하증권의 수화인 난에 To order of Mr. A, To bearer라고 기재되어 있는 경우이다.","유통가능선하증권은 배서 또는 인도에 의하여 유통되므로 운송인은 증권의 제시없이도 인도할 수 있다.","유통가능선하증권의 경우 운송인은 증권의 회수가 없으면 물건을 인도할 수 없으므로 증권의 소지인은 물건들을 완전하게 점유할 수 있다.","유통가능선하증권은 물건의 상징이고 완전한 권리증권이다."],"a":1,"e":"유통가능 B/L에서 운송인은 원본 증권의 회수·제시 없이 화물을 인도할 수 없으며, 무증권 인도는 운송인의 손해배상책임을 발생시킨다."},{"id":"550a5c0a14","s":1,"n":"294","q":"다음 중 만약 본선이 도착하였음에도 불구하고 선하증권이 도착하지 아니한 경우의 해결책으로 가장 좋은 방법은?","o":["우선, 본선이 그 항에서 서류가 도착하는 것을 기다리는 방법이 있을 수 있다.","선박회사가 선박의 체선을 피하기 위하여 화물을 하역 또는 양륙하여 창고에 보관하는 방법이 있을 수 있다.","현재 실무적으로 광범위하게 사용되고 있는 것이 화물의 L/G(Letter of Guarantee; 수입화물선취보증서) 인도를 통해 문제를 해결 할 수 있다.","물품의 인도를 신속히 하고 서류의 분실에 따른 제반위험을 회피하고자 하는 목적으로 비유통성 해상화물운송장(Non-Negotiable Sea Waybill)을 사용할 수 있다."],"a":3,"e":"선하증권 지연 문제의 근본 해결책은 원본 제시가 불필요한 비유통성 해상화물운송장(Sea Waybill) 사용이다. L/G 인도는 선사에 위험을 남기는 임시방편이다."},{"id":"cae807e64b","s":1,"n":"295","q":"다음 중 선하증권이 인도에 의해 유통되는 경우에 관한 설멍으로 바람직하지 않은 것은?","o":["선하증권은 지참인식으로 발행되어 지참인식의 배서를 한경우에는 인도만으로 유통한다.","선하증권이 특정인의 지시식으로 발행되어 그 자가 백지백서애 배서한 경우에는 인도만으로 유통한다.","선하증권은 지참인식으로 발행되기 때문에 언제든지 인도만으로 유통할 수 있다.","선하증권은 분실할 경우 위험이 있기 때문에 실제로 지참인식으로 발행되는 경우는 거의 없으므로 배서를 해야만 인도 유통이 가능하다."],"a":2,"e":"실무상 분실 위험 때문에 B/L이 지참인식(bearer)으로 발행되는 일은 거의 없으며, 지참인식 배서나 백지배서를 거쳐야 인도만으로 유통된다."},{"id":"39f655f936","s":1,"n":"296","q":"다음에서 배서에 대한 설명으로 부적당한 것은?","o":["지시식의 어음, 수표 또는 지시금지가 없는 기명식의 어음, 수표 등 유가증권을 제3자에게 양도하는 방법을 말한다.","소지인식은 피배서인을 지정하지 아니하고 단순히 소지인에게 인도하라는 취지의 인도문언과 함께 배서인이 서명하는 방법이다.","양도방법이 배서에 의하도록 결정되어 있는 경우 배서 이외의 방법으로 양도할 수 있다.","신용장에서 요구되고 있는 환어음, 운송증권 등은 전형적인 증권적 채권이므로 배서에 의하여 제3자에게 자유로이 양도될 수 있다."],"a":2,"e":"양도방법이 배서로 정해진 유가증권은 배서라는 법정 방식을 갖춰야 권리가 이전되므로, 배서 이외의 방법으로 양도할 수 있다는 서술은 옳지 않다."},{"id":"441ff0e022","s":1,"n":"297","q":"다음에서 연지급신용장과 같은 효과를 지닌 신용장은?","o":["매입신용장(negotiation credit)","인수신용장(acceptance credit)","지급신용장(payment credit)","확인신용장(confirmed credit)"],"a":1,"e":"인수신용장(acceptance credit)은 기한부 어음을 인수해 만기에 지급하므로, 어음 없이 만기 지급을 약정하는 연지급신용장(deferred payment credit)과 실질적 효과가 같다."},{"id":"4eb4ae435d","s":1,"n":"298","q":"다음에서 Siberian Land Bridge(SLB)에 의한 국제복합운송경로의 운송구가별 적용법규가 알맞게 연결된 것은?","o":["해상운송기간: 사회주의 연락운수 규칙","소련 국경에서 유럽국경까지의 철도운송구간: 도로에 의한 국제물품운송에 관한 국제조약","유럽 및 소련 내륙 도로운송구간: 도로에 의한 물품 운송에 관한 국제조약","Vostochny에서 소련 국경까지의 철도운송구간: Hague Rules"],"a":2,"e":"SLB의 유럽·소련 내륙 도로운송구간에는 CMR(도로에 의한 물품운송에 관한 국제조약)이 적용된다. 해상구간은 Hague Rules, 국제철도구간은 CIM, 소련 내 철도는 사회주의 연락운수규칙이 적용된다."},{"id":"644387580f","s":1,"n":"299","q":"다음은 해상화물운송장의 단점을 설명한 것으로 적당하지 않은 것은?","o":["자유로이 수화인을 변결할 수 있으므로 화환어음을 매도하기 위해서는 은행을 수화인으로 해야 한다.","해상화물운송장의 제출 없이도 물품을 인도 받을 수 있기 때문에 L/G인도에 따른 문제로 화물인도를 신속히 할 수 있다.","해상화물운송장은 권리증권이 아니기 때문에 항해 중에 증권을 이전함으로써 물품을 전매하는 것이 불가능하다.","해상화물운송장은 담보력이 없다."],"a":1,"e":"L/G 없이 신속히 화물을 인도받을 수 있다는 점은 해상화물운송장의 장점이다. 단점은 권리증권성·담보력 부재와 전매 불가에 있다."},{"id":"186448bd9e","s":1,"n":"300","q":"다음에서 선하증권에서 운송물의 동일성을 표시하는 사항을 기입할 필요에 대한 설명으로 적당한 것은?","o":["해상화물 운송에 있어서 화물의 적재를 손쉽게 할 수 있기위해서 이다.","선하증권은 원래 본선의 선장이 발행하는 해상운송물의 수취증과 같은 역할을 하기 때문이다.","화물의 대금을 정확하게 지불 받기위해서이다.","화물의 최종 목적지에서 확인은행의 대리인에게 대금의 지불수단으로 사용하기 위해서이다."],"a":1,"e":"선하증권은 본래 선장이 발행하는 운송물 수취증(receipt)이므로, 인도할 화물의 동일성을 특정하기 위해 화인·개수·중량 등 명세 기재가 필요하다."},{"id":"66d2ca7a83","s":1,"n":"301","q":"다음 선하증권의 송화인에 대한 설명으로 올바르지 않은 것은?","o":["선하증권에 기재될 모든 사항을 정확하게 운송인에게 신고하여야 하고 부정확한 사항으로 인한 손실 및 비용에 대하여 책임을 져야 한다.","운송인이 서명한 선하증권(bill of lading)을 취득할 권리를 가진 자이다.","선하증권 발행자인 운송인은 권리 양도증서가 없어도 선하증권상에 기재된 송화인이 아닌 자에게 선하증권을 교부할 수 있다.","위험물의 등급에 적합한 용기에 포장하고 위험물임을 표시하는 mark 및 label을 부착할 의무가 있다"],"a":2,"e":"선하증권은 기명된 송화인(shipper)에게 교부되는 것이 원칙이며, 권리양도증서 없이 제3자에게 교부하면 운송인이 책임을 진다. 신고 정확성 의무, 위험물 포장·표시 의무, 서명된 B/L 취득권은 모두 송화인의 지위에 부합한다."},{"id":"91ca376231","s":1,"n":"302","q":"다음에서 복합운송증권에 대한 개념을 잘못 설명하고 있는 것은?","o":["복합운송에 대해 복합운송인이 발행한는 증권이다.","발행자인 운송인이 운송품의 수령을 증명하고, 운송계약의 증거가 되는 권리증권의 성격이다.","복합운송증권은 선하증궘과 똑같이 유통증권으로서의 기능을 갖고 있다.","복합운송증권은 선하증권과 달리 유가증권의 성격을 갖고 있지 않다."],"a":3,"e":"복합운송증권(MTD)도 선하증권과 마찬가지로 운송품 수령증·운송계약 증거이자 권리증권으로서 유통성과 유가증권성을 갖는다. 유가증권성이 없다는 설명은 성립하지 않는다."},{"id":"acebf693f1","s":1,"n":"303","q":"다음 중 매입신용장에서 추심은행의 역할은?","o":["매수인의 대리인","매도인(어음의 발행인)의 대리인","지급은행의 대리인","확인은행의 대리인"],"a":1,"e":"매입신용장(negotiation L/C)에서 추심은행은 환어음 발행인인 매도인(수출자)을 위해 대금을 추심하는 대리인 지위에 있다. 매수인·지급은행·확인은행의 대리인이 아니다."},{"id":"ec4be06dbb","s":1,"n":"304","q":"다음은 OCP(Overland Common Point)에 대한 설명으로 부적절한 것은?","o":["미국대륙에서 공동운임을 과징하는 지역을 말한다.","우리 나라 수출업자들이 OCP지역에 대하여 관심을 갖고 있는 것은 이 지역으로 가는 OCP화물이 OCP Rate라는 할인운임의 혜택을 받고 있기 때문이다","최근에는 선사들에 의한 MLB 및 IPI 일반수송이 발달함에 따라 OCP Service는 증가하고 있다.","OCP서비스를 이용하려는 경우 선하증권이면에 OCP목적지, 운송수단(철도, 트럭, 항공), OCP운송인을 명시하여야 한다"],"a":2,"e":"OCP는 로키산맥 동쪽 내륙지역을 대상으로 할인된 OCP Rate가 적용되는 미국 공동운임 지역이다. 다만 선사 주도의 MLB·IPI 서비스가 발달하면서 OCP Service는 오히려 축소·감소 추세이다."},{"id":"faedb285a0","s":1,"n":"305","q":"다음 중 복합운송서류가 자동수리 되기 위해서 갖추어야 할 요건과 관계가 없는 것은?","o":["상품의 발송, 수탁 또는 본선적재 내용을 명기하여야 한다.","용선계약 또는 범선에 선적하였다는 표시가 있어야 한다.","약식운송서류도 수리할 수 있다.","발급된 원본 모두가 제시되어야 한다."],"a":1,"e":"자동수리 요건은 발송·수탁 또는 본선적재 표시, 약식(short form) 서류 허용, 원본 전통 제시 등이며, 용선계약(charter party)이나 범선 적재 표시가 있는 서류는 오히려 수리 거절 사유이다."},{"id":"f189403dee","s":1,"n":"306","q":"다음 한국, 대만, 홍콩, 호주지역은 NVOCC의 어느 국가가 총대리점으로 TRS 서비스를 맡고 있는가?","o":["러시아","영국","프랑스","독일"],"a":3,"e":"TSR/TRS 서비스에서 한국·대만·홍콩·호주 지역은 독일계 NVOCC가 SOTRA와 총대리점계약을 맺고 TRS 서비스를 담당해 왔다."},{"id":"7cf9e74df3","s":1,"n":"307","q":"다음은 중국대륙의 국제복합운송경로에 대한 설명으로 적합하지 않은 것은?","o":["중국대륙을 횡단하여 유럽까지 화물을 운송할 수 있는 중국횡단철도(Trans Chinese Rail :TCR)가 1992년 12월 1일부터 개통되었다","TCR은 러시아의 Vostochny를 통하여 북유럽으로 가는 시베리아횡단 철도(TSR)보다 2,000㎞ 가량 거리가 짧아 졌다.","부산에서 로테르담까지 해상운송하는 거리가 10,370㎞인데 이 TCR을 이용하면 해상운송거리보다 9,420㎞정도로 짧아지고 운송기간도 1주일 정도 줄일 수 있다.","TCR을 이용하여 유럽행 화물을 운송하는 경우 운송비를 15∼20% 정도 절감시킬 수 있다."],"a":2,"e":"TCR은 1992년 개통되어 TSR보다 약 2,000km 단축, 유럽행 운송비 15~20% 절감 효과가 있다고 설명된다. 반면 부산~로테르담 해상거리와 TCR 거리 및 단축기간 수치는 실제와 맞지 않아 잘못된 기술이다."},{"id":"862d840e0d","s":1,"n":"308","q":"다음 중 신용장의 이용을 규율하고 있는 규칙으로 신용장통일규칙은 언제 탄생되었는가?","o":["1933년","1983년","1905년","1972년"],"a":0,"e":"신용장통일규칙(UCP)은 국제상업회의소(ICC)가 1933년 제정하였고 이후 여러 차례 개정을 거쳐 현재 UCP 600에 이르고 있다."},{"id":"85e4264870","s":1,"n":"309","q":"다음 중 MLB의 운송경로에 대해 알맞게 설명한 것은?","o":["미국대륙이 극동과 유럽을 이어주는 운송시스템에서 다리역할을 한다는 개념에서 Mini Land Bridge라고 부른다.","LA-NY간의 북미 내륙운송비가 비싸기 때문에 SLB보다 경쟁력이 약하다.","MLB
