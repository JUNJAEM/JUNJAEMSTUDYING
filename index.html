한 자료제출 요구 등 조사권을 갖지만, 원인규명이 특히 곤란한 사건의 심판 참여는 비상임심판관 등 심판기관의 역할이다."},{"id":"0e7c26e185","s":3,"n":"73","q":"다음 중 중앙해난심판원은 몇 명의 심판관으로 구성되는가?","o":["1명 이상","3명 이상","5명 이상","7명 이상"],"a":2,"e":"중앙해양안전심판원은 5명 이상의 심판관으로 구성되며, 지방심판원(3명 이상)보다 합의체 규모가 크다."},{"id":"d25d9d850b","s":3,"n":"74","q":"다음에서 해사보좌인에 대한 특성을 설명한 것으로 해당사항이 없는 것은?","o":["금치산자는 해사보좌인이 되지 못한다.","해사보좌인은 지방 심판원에 등록을 하여야 한다.","수심인의 이익을 위하여 심판상의 행위를 하는 자이어야 한다.","지정해난 관계인을 위하여 심판상의 행위를 하는 자이어야 한다."],"a":1,"e":"해사보좌인은 중앙심판원에 등록하고 중앙심판원장의 감독을 받으므로 지방심판원 등록은 해당되지 않으며, 금치산자 등 결격사유자는 될 수 없다."},{"id":"0ddc222d5a","s":3,"n":"75","q":"다음에서 해사보좌인은 누구의 감독을 직접 받어야 하는가?","o":["자벙해난심판원장","해양수산부장관","중앙해난심판원장","법부부장관"],"a":2,"e":"해사보좌인은 중앙해양안전심판원에 등록되어 중앙심판원장의 직접 감독을 받으며, 수심인·지정해양사고관련자를 위해 심판상 행위를 대리한다."},{"id":"3e6207c599","s":3,"n":"76","q":"지방해난심판원에서 결정을 받은 자가 중앙해난심판원에 대하여 이의를 제출할 수 잇는 기간은 몇일 이내인가?","o":["7일이내","10일이내","14일이내","30일이내"],"a":0,"e":"심판원의 결정에 불복하는 자는 그 결정을 받은 날부터 7일 이내에 중앙심판원에 이의를 제출할 수 있고, 재결에 대한 불복(제2심 청구)은 이와 별도의 기간이 적용된다."},{"id":"5cf2a20a6f","s":3,"n":"77","q":"대한민구 영사가 국외에서 해난 사실을 인지하였을 때 누구에게 통보하여야 하는가?","o":["지방해난심판원","지방수석조사관","중앙해난심판원","중앙수석조사관"],"a":3,"e":"재외공관의 영사가 국외 해양사고를 인지한 경우 중앙수석조사관에게 통보하여야 하며, 이후 선적항 관할 지방심판원에서 처리된다."},{"id":"2c65622c7d","s":3,"n":"78","q":"다음 중 해난심판법상의 해난으로 정의될 수 없는 경우는?","o":["타선박의 표류를 인지","선박의 안전 또는 운항 저해","선박구조설비 또는 운용에 관련된 사람의 사상","선박이 멸실되거나 선박운용에 관련하여 시설의 손상"],"a":0,"e":"해양사고는 선박의 멸실·손상, 사람의 사상, 선박 운용과 관련된 시설 손상, 안전·운항 저해 등 실제 피해나 위험이 발생한 경우를 말하므로, 단순히 타선박의 표류를 인지한 사실은 해양사고가 아니다."},{"id":"aad8e89fa3","s":3,"n":"79","q":"다음 중 해난이 발생하고 몇 년이 경과하고 나면 심판을 청구할 수 없는가?","o":["1년","3년","5년","7년"],"a":1,"e":"해양사고 발생일부터 3년이 지나면 심판청구의 제척기간이 지나 조사관은 심판을 청구할 수 없다."},{"id":"306c1fd3be","s":3,"n":"80","q":"다음에서 지방해난심판원은 누구의 심판 청구에 의하여 개시하는가?","o":["심판관","수심인","조사관","해사보좌인"],"a":2,"e":"심판은 검사와 유사한 지위를 갖는 조사관의 심판청구에 의해 개시되는 탄핵주의(불청구 불심판) 구조이며, 심판관은 청구가 있어야 심리한다."},{"id":"46544199dd","s":3,"n":"81","q":"다음 중 해양오염방지법 상 해양 시선에 속하지 않는 것은?","o":["해역과 연결된 구조물","해역에 고정설치 된 부선","이동할 수 있는 해저석유 채취장치","사람을 수용할 수 있는 시설을 갖춘 구조물"],"a":2,"e":"해양시설은 해역에 고정·설치된 구조물이나 시설을 말하므로, 이동할 수 있는 해저석유 채취장치는 선박에 준해 취급되어 해양시설에 포함되지 않는다."},{"id":"a207f654cf","s":3,"n":"82","q":"선박 좌초 시의 조치사항 중 적당하지 않는 것은?","o":["좌초 즉시 기관전속 후진을 걸어 선저 손상을 감소 할 수 있도록 한다.","일단 기관 정지 후 침수 유무를 확인한다.","선위, 전체 주위의 수심, 저질 등을 조사한다.","자력이초 가능 여부 등을 검토한다."],"a":0,"e":"좌초 직후 무리하게 전속후진을 걸면 선저 파공 확대와 프로펠러·타 손상, 침수 악화를 초래하므로, 우선 기관을 정지하고 침수·수심·저질·자력이초 가능성을 조사해야 한다."},{"id":"f3d8e169eb","s":3,"n":"83","q":"선박충돌 즉시 선수 방위 및 선위의 확인이 필요한 가장 주된 이유는 무엇인가?","o":["선체 손상의 정도를 확인하기 위하여","기관 사용 가능성 여부를 판단하기 위하여","충돌의 원인을 규명하기 위하여","구난 작업의 효율성을 높이기 위하여"],"a":2,"e":"충돌 직후의 선수방위(침로)와 선위는 시간 경과로 소실되는 결정적 증거이므로, 충돌 원인 규명과 과실비율 산정을 위해 즉시 기록·확인한다."},{"id":"67b793c783","s":3,"n":"84","q":"다음 중 일반적으로 많이 사용하는 해상 수색(Search)의 방법이 아닌 것은?","o":["Sector Search","Expanding Square Search","Parallel Sweep Search","Contour Search"],"a":3,"e":"해상수색에는 확대사각형(Expanding Square), 부채꼴(Sector), 병행소해(Parallel Sweep), 항로수색(Track Line) 등이 쓰이며, Contour Search는 항공 산악수색 기법으로 일반 해상수색법이 아니다."},{"id":"0d4b195bf4","s":3,"n":"85","q":"조난자가 위치표시를 하기 위하여 취해야할 조치 중 틀린 것은?","o":["해묘를 투하하여 표류를 감소시킨다.","구명정, 구명 뗏목 등을 서로 분산시킨다.","조난신호 용구를 적절히 사용한다.","휴대용 무선통신기를 이용하여 구조자와 교신을 시도한다."],"a":1,"e":"구명정·구명뗏목은 분산시키지 말고 서로 결합·집결시켜 발견 가능성과 표적 크기를 키워야 하며, 해묘 투하·조난신호 용구·무선 교신은 옳은 조치다."},{"id":"b9f48b69d7","s":3,"n":"86","q":"다음 중 유독가스에 중독된 환자의 조치 방법으로 옳지 않은 것은?","o":["신선한 공기가 있는 곳으로 이동한다.","다량의 음료를 제공하여 구토하도록 한다.","옷을 느슨하게 풀어주고 의식이 있는 환자는 심호흡을 시킨다.","가능하다면 산소를 공급한다."],"a":1,"e":"유독가스 중독자에게 다량의 음료를 마시게 해 구토를 유발하면 기도 폐색과 흡인의 위험이 커지므로 금기이며, 신선한 공기 이동·의복 이완·산소 공급이 기본 처치다."},{"id":"51355604f6","s":3,"n":"87","q":"다음 중 충돌사고 시 선주에의 보고 내용과 가장 거리가 먼 것은 어느 것인가?","o":["본선의 출항일, 출항항, 목적항","상대선의 선명, 선적항, 출항항","본선의 자이로컴퍼스 오차","유출유의 유무 및 확산 상황"],"a":3,"e":"'충돌사고 시 선주 보고 내용과 가장 거리가 먼 것' → 회사 정답은 유출유의 유무 및 확산 상황이다. 보기 ④로 고정해 암기한다. ⚠[정답 논란] 유출유 유무·확산 상황은 방제와 오염책임 대응상 최우선 보고사항이고 자이로컴퍼스 오차가 선주 보고와 가장 무관하므로, 일반 이론상 정답은 ③이다. 다만 채점은 회사 제공 정답 ④ 기준이므로 시험에서는 ④로 답할 것.","c":{"t":2,"n":"유출유 유무·확산 상황은 방제와 오염책임 대응상 최우선 보고사항이고 자이로컴퍼스 오차가 선주 보고와 가장 무관하므로, 일반 이론상 정답은 ③이다."}},{"id":"2f085b3edc","s":3,"n":"88","q":"자동 충돌방지장치에서 충돌회피를 위하여 미리 시뮬레이션을 하여 그 예상결과를 판단 할 수 있는 기능은?","o":["시행조선 기능","경보 기능","물표추적 기능","항적표시 기능"],"a":0,"e":"ARPA의 시행조선(Trial Maneuver) 기능은 가정한 침로·속력 변경을 모의계산해 DCPA·TCPA 변화를 미리 확인하는 충돌회피 판단 기능이다."},{"id":"147cec35f8","s":3,"n":"89","q":"다음 중 충돌사고의 원인과 가장 거리가 먼 것은 어는 것인가?","o":["선교 항해 당직자의 주의 태만으로 인한 과실","항해사의 적절한 운용술의 미숙","항해장비의 정비 불량과 운용 미숙","강한 횡조류압력에 의한 항로 이탈"],"a":3,"e":"충돌은 대부분 당직 태만, 운용술 미숙, 장비 정비·운용 불량 등 인적 과실에서 비롯되며, 강한 횡조류에 의한 항로 이탈은 자연적 외력 요인으로 직접적 충돌원인과는 거리가 있다."},{"id":"da2cd55122","s":3,"n":"90","q":"선원(승조원)의 근로환경의 특수성을 기술한 것 중 타당하지 않은 것은?","o":["해상에서 일어날 다양한 위험과 선체 또는 기계장비의 고장위험등을 안고 있다.","고립된 공간에서 직장근무와 개인적 사생활을 함께하는 운명공동체적인 성격을 띤다.","선상에서의 생활로 가정적, 사회적, 문화적 생활이 제한 받고 있다.","임금을 받을 목적으로 배안에서 근로를 제공하고 고용된다."],"a":3,"e":"임금을 목적으로 선내에서 근로를 제공한다는 것은 선원의 일반적 정의(근로계약의 본질)일 뿐, 위험성·운명공동체성·생활제약 같은 해상근로의 특수성 설명은 아니다."},{"id":"f4edf9c355","s":3,"n":"91","q":"선장의 업무 분장으로 해당되지 않는 것은?","o":["선박, 승조원의 지휘, 감독, 선내 제반 업무의 총괄","선박의 안전 운항 및 인명, 재선의 보호관리","갑판부 업무 총괄 및 하역 책임","선박의 경제적 운항과 영업상의 수익 증진을 위한 노력"],"a":2,"e":"갑판부 업무 총괄과 하역 책임은 1등항해사(Chief Officer)의 분장사항이고, 선장은 선박·승조원 지휘감독, 안전운항과 인명·재산 보호, 경제적 운항 등을 담당한다."},{"id":"2874c21104","s":3,"n":"92","q":"갑판부에 분장된 업무로 해당되지 않는 것은?","o":["선내의료, 위생 관련 업무","항해 및 정박 당직 업무","해사관련 법규 및 사규의 준수, 이행","안전설비 및 관련 비품의 보수 및 유지"],"a":2,"e":"해사 법규와 사규의 준수·이행은 특정 부서의 분장업무가 아니라 선장을 포함한 전 승조원의 공통 의무이며, 항해·정박 당직, 안전설비 보수, 선내 의료·위생은 갑판부 소관이다."},{"id":"2a83f786bd","s":3,"n":"93","q":"선장을 보좌 하고 갑판부 업무 총괄로 선내 기율관계 책임사관의 역할을 담당하는 자는?","o":["1등 항해사","2등 항해사","갑판장","1등 기관사"],"a":0,"e":"선장을 보좌하며 갑판부 업무를 총괄하고 선내 기율(규율) 유지의 책임사관 역할을 하는 직책은 1등항해사(Chief Officer)이다."},{"id":"b6901822c9","s":3,"n":"94","q":"항해 시 항해사와 조를 지워 선교당직근무를 하며 출항 시는 선장, 도선사, 항해사의 명령에 의거 업무수행을 하는 자는?","o":["갑판원","갑판장","갑판수","조기장"],"a":1,"e":"'항해사와 조를 지어 선교당직을 하며 출항 시 선장·도선사·항해사 지시로 업무를 수행하는 자' → 회사 정답은 갑판장이다. 보기 ②로 고정해 암기한다. ⚠[정답 논란] 선교당직에서 조타·경계를 담당하는 부원은 갑판수(Quarter Master)이고 갑판장(Bosun)은 갑판 작업을 지휘하는 직책이므로, 일반 이론상 정답은 ③이다. 다만 채점은 회사 제공 정답 ② 기준이므로 시험에서는 ②로 답할 것.","c":{"t":2,"n":"선교당직에서 조타·경계를 담당하는 부원은 갑판수(Quarter Master)이고 갑판장(Bosun)은 갑판 작업을 지휘하는 직책이므로, 일반 이론상 정답은 ③이다."}},{"id":"1fb0804b97","s":3,"n":"95","q":"기관부에 분장된 업무로 적합하지 않은 것은?","o":["기관의 운전 관련 업무","연료 및 윤활류의 수급 및 관리","화물 및 하역 관련 업무","항해 및 정박 당직 업무"],"a":2,"e":"화물 및 하역 관련 업무는 갑판부의 분장사항이고, 기관부는 기관 운전, 연료·윤활유 수급과 관리, 기관 당직 등을 담당한다."},{"id":"a3fddd9077","s":3,"n":"96","q":"기관장의 주요 업무 사항에 적합하지 않은 것은?","o":["선내보수 및 정비업무 책임","승선실습 및 육원승선 실습 등 선내교육의 집행","연료 및 윤활유의 관리 및 에너지 절감 방안 수립 및 실천","선내 기강 확립 및 질서 유지"],"a":3,"e":"선내 기강 확립과 질서 유지는 선박 최고책임자인 선장의 고유 업무이며, 기관장은 기관 정비·보수 책임, 연료·윤활유 관리와 에너지 절감, 기관부 실습 교육 등을 담당한다."},{"id":"1640af9b1d","s":3,"n":"97","q":"기관부의 직장으로 1기사의 지시를 받아 기관의 정비 및 보수 작업등을 수행하는 자는?","o":["기관수(oiler)","기관원(wiper)","조기장(No. 1 oiler)","갑관수(quarter master)"],"a":2,"e":"기관부 부원의 직장(職長)으로 1등기관사의 지시를 받아 기관 정비·보수 작업을 지휘하는 자는 조기장(No.1 Oiler)이며, 갑판부의 갑판장에 대응하는 직책이다."},{"id":"1a0de85c9c","s":3,"n":"98","q":"통사부에 분장된 업무가 아닌 것은?","o":["무선통신 관련 업무","선내보수 관련 업무","선내급식 관련 업무","출입항 수속 및 내객 접대, 일반 서무 업무"],"a":1,"e":"선내보수(선체·기관 정비) 업무는 갑판부와 기관부의 소관이고, 통사부(사무부)는 무선통신, 선내급식, 출입항 수속과 내객 접대 등 서무 업무를 담당한다."},{"id":"0cf5c06963","s":3,"n":"99","q":"다음 중 해상노동의 특수성에 대한 설명으로 관계가 먼 것은?","o":["선박은 하나의 위험공동체를 이룬다.","국가의 보호감독으로부터 고립되지 않은 선내생활을 한다.","선원의 선내질서유지를 통한 해상의 안전도모에 따른 제약을 동반한다.","선원은 가정과 분리된 이중생활을 강요받을 수밖에 없는 상황에서 노동이 이루어진다."],"a":1,"e":"선원은 육상과 격리된 채 국가의 보호·감독이 미치기 어려운 선내생활을 하므로 선장에게 광범위한 공법상 권한이 인정되는 것이며, 고립되지 않는다는 서술은 해상노동의 특수성과 배치된다."},{"id":"25183197a6","s":3,"n":"100","q":"다음에서 해양사고의 조사 및 심판에 관한 법률에서 권고의 대상자는 누구 인가?","o":["해기사","도선사","해기사와 도선사","해기사, 도선사 이외의 자"],"a":3,"e":"권고는 징계 대상인 해기사·도선사 이외의 자(선박소유자, 안전관리책임자 등 지정해양사고관련자)에게 재발방지를 위해 행하는 조치이며, 해기사·도선사에게는 징계를 과한다."},{"id":"d8a9973b30","s":4,"n":"","q":"항해용선계약(Voyage Charter Party)에 관한 설명중 틀린 것은?","o":["용선료를 용선기간에 따라 결정하고 용선개시전에 미리 선급한다.","용선자는 선복을 이용하고 선주는 운송행위를 한다.","선주와 용선자간의 계약내용으로는 선내하역비 부담조건과 정박기간에 관한 사항이 중요시 된다.","용선자는 선주에게 운임을 지급하고 선주는 선박운항에 따른 제비용을 부담한다."],"a":0,"e":"용선료를 기간 기준으로 정하고 선급하는 것은 정기(기간)용선계약의 방식이다. 항해용선(voyage charter)은 특정 항구 간 1항차를 대상으로 화물량 또는 선복 기준 운임을 정하고, 선내하역비 부담조건과 정박기간이 핵심 쟁점이다."},{"id":"e85a70200b","s":4,"n":"","q":"항해용선의 운임은 화물의 수량을 기초로 지불되나, 정기용선의 용선료는 무엇에준거하여 지불되는가?","o":["인도기일","항행구역","계약기간","하역시간"],"a":2,"e":"정기용선료는 화물수량이 아니라 계약기간(용선기간)에 준거해 재화중량톤당 월정액 등으로 지급된다."},{"id":"3cb3f5551f","s":4,"n":"","q":"다음은 항해용선계약을 체결하는 순서로 올바르게 짝 지어진 것은?","o":["Inquiry for ship's space - Firm offer for ship's space - Fixture note - Counter offer","Firm offer for ship's space - Inquiry for ship's space - Fixture note - Counter offer","Firm offer for ship's space - Inquiry for ship's space - Counter offer - Fixture offer","Inquiry for ship's space - Firm offer for ship's space - Counter offer - Firm offer"],"a":0,"e":"선복조회(inquiry)로 시작해 선복확약(firm offer)을 거쳐 선복확약서(fixture note)를 작성하며, 조건이 맞지 않으면 반대청약(counter offer)이 오간다."},{"id":"49b9084dd8","s":4,"n":"","q":"다음 중 항해용선계약의 본질로 관계가 적은 것은?","o":["어느 항에서 어느 항까지 화물의 수송을 화주인 용선자(charterer)와 선주(owner) 사이에 맺는 운송계약을 말한다.","계약의 주 내용이 어디까지나 기간으로 계약하는 용선이다.","항해용선은 1항해를 대상으로 하는 단독항해용선(single voyage charter)이 통상이다.","연속항해의 경우에 있어서도 기본적 내용은 단독항해용선의 경우와 거의 같다."],"a":1,"e":"기간을 계약의 주 내용으로 하는 것은 정기용선(time charter)이며, 항해용선은 특정 항 간 화물운송을 목적으로 한다."},{"id":"49b20c3c07","s":4,"n":"","q":"다음 중 항해용선계약의 특징을 설명한 것으로 바람직하지 못한 것은?","o":["선장은 선주가 임명한다.","항해 항차수를 계약내용으로 한다.","용선자가 부족한 선복을 보충하기 위해서이다.","항해에 대한 대가는 운임이며, 선박적재량 또는 선복량에 따라 지불한다."],"a":2,"e":"부족한 선복을 보충하기 위해 일정 기간 선박을 빌리는 것은 정기용선(time charter)의 목적이며, 항해용선은 특정 항해 단위로 선복을 빌려 운임을 지급하는 계약이다."},{"id":"d3eb368cca","s":4,"n":"","q":"다음에서 선복의 전부를 빌리기는 하지만 어느 특정 항해를 위해 용선되는 계약을 무엇이라고 하는가?","o":["전부용선계약(whole charter)","일부용선계약(partial charter)","항해용선계약(voyage charter)","정기용선계약(time charter)"],"a":2,"e":"선복 전부를 특정 1항해 단위로 빌리는 계약은 항해용선계약(voyage charter)이다. 전부용선은 선복 전부 대상의 상위 개념, 정기용선은 기간 기준."},{"id":"c606d8dba8","s":4,"n":"","q":"항해용선계약에서 화물량보다 실제 선적량이 적은 경우 용선자(Charterer)인 화주가 그 부족분에 대해서도 지불하는 운임은?","o":["선불운임(Advanced Freight)","부적운임(Dead Freight)","반송운임(Back Freight)","후불운임(Destination Freight)"],"a":1,"e":"항해용선계약에서 용선자가 약정 선적량(계약 화물량)을 채우지 못한 경우 그 부족분에 대해 지급하는 공적운임이 부적운임(Dead Freight)이며, 이는 손해배상적 성격의 운임이다."},{"id":"5db551d127","s":4,"n":"","q":"다음 중 자본력이 약한 운항선사가 선복을 보충하면서 선대(fleet)를 늘리는 일종의 할부제도 내지 리스제도는?","o":["나용선계약","항해용선계약","정기용선계약","선복용선계약"],"a":0,"e":"나용선계약(bareboat charter), 특히 국적취득조건부 나용선(BBCHP)은 용선료를 분할 납부하며 선박을 확보하는 할부·리스형 선대 확충 방식이다."},{"id":"c177d9de45","s":4,"n":"","q":"개품운송계약의 대표적인 것은 컨테이너 운송이고, 이는 국제해운에서 어떤 계약으로 발전하였는가?","o":["국제복합운송계약","항해용선계약","정기용선계약","물건운송계약"],"a":0,"e":"컨테이너화로 해상구간이 육상·항공과 결합되면서 개품운송계약은 단일책임·단일운임의 국제복합운송계약(multimodal transport contract)으로 발전하였다."},{"id":"6ded5534ed","s":4,"n":"","q":"부정기선 항로에서 항해용선계약을 체결 했을 시 운송의 책임자는 누구인가?","o":["선주","화주","해상운송인","중개인"],"a":2,"e":"항해용선에서도 화물운송의 이행책임은 운송인(carrier) 지위에 있는 선주 측, 즉 해상운송인이 부담하며 감항능력주의의무와 화물관리의무를 진다."},{"id":"3912e8c56d","s":4,"n":"","q":"다음에서 정기선 항로에서 컨테이너 운송과 재래식 정기선에서 사용하는 계약은?","o":["개품운송계약","항해용선계약","정기용선계약","물건운송계약"],"a":0,"e":"정기선 항로의 컨테이너·재래정기선 운송은 다수 화주의 개별 화물을 인수하는 개품운송계약(contract of carriage in a general ship)으로 체결되며 선하증권이 그 증거가 된다."},{"id":"26fb92e5ab","s":4,"n":"","q":"다음의 부정기선의 용선방법의 종류에 해당되지 않는 것은?","o":["정기용선","항해용선","나용선","개품운송"],"a":3,"e":"용선계약(charter)의 종류는 정기(기간)용선, 항해용선, 나용선(선체용선)이다. 개품운송(個品運送)은 다수 화주의 화물을 선하증권으로 운송하는 정기선 운송계약으로 용선방법이 아니다."},{"id":"d3eb368cca","s":4,"n":"","q":"다음에서 선복의 전부를 빌리기는 하지만 어느 특정 항해를 위해 용선되는 계약을 무엇이라고 하는가?","o":["전부용선계약(whole charter)","일부용선계약(partial charter)","항해용선계약(voyage charter)","정기용선계약(time charter)"],"a":2,"e":"선복 전부를 특정 1항해 단위로 빌리는 계약은 항해용선계약(voyage charter)이다. 전부용선은 선복 전부 대상의 상위 개념, 정기용선은 기간 기준."},{"id":"fc8ab56a27","s":4,"n":"","q":"다음의 부정기선 운항형태 중 선박만을 용선하여 인적 및 물적요소 전체를 용선자가 부담하는 방식은 무엇인가?","o":["항해용선(Voyage Charter)","일대용선(Daily Charter)","선복용선(Lump-sum Charter)","나용선(Bare-boat Charter)"],"a":3,"e":"나용선(Bare-boat Charter)은 선체만 빌리는 임대차 성격의 용선으로, 선원 배승·연료·수리·보험 등 인적·물적 요소 전부를 용선자가 부담하고 선주는 선박만 제공한다."},{"id":"a48b41a597","s":4,"n":"","q":"부정기선의 경우 신속한 항해나 정확한 스케쥴보다는 무엇이 더 중요한가?","o":["화물의 가치","화물의 출하 시기","저렴한 운임","화물의 수송 단위"],"a":2,"e":"부정기선(tramper)은 저운임부담력 대량 원자재를 실어 나르므로 정시성보다 단위당 저렴한 운임이 핵심 경쟁요소이며, 신속성·정확한 스케줄은 정기선의 강점이다."},{"id":"10bba605a6","s":4,"n":"","q":"다음에서 부정기선 운항 시 관심을 두어야 할 점은 무엇인가?","o":["적절한 배선","육상설비투자","저렴한 운임","항로및 항해시기"],"a":0,"e":"부정기선은 고정 항로·스케줄이 없어 화물이 있는 곳에 선박을 붙이는 적절한 배선(ship allocation)이 수익을 좌우하며, 공선항해(ballast voyage) 최소화가 그 목표다."},{"id":"0bdb4d36a7","s":4,"n":"","q":"다음에서 본선 갑판 상에 컨테이너 하역용 갠트리 크레인을 장착하고 있는 컨테이너 선은?","o":["기어 컨테이너선","세미 컨테이너선","풀 컨테이너선","컨버터블 컨테이너선"],"a":0,"e":"기어(Geared) 컨테이너선으로, 갑판에 자체 갠트리 크레인을 갖춰 하역설비가 없는 항만에서도 자력 하역이 가능하다. 반대는 하역장비가 없는 Gearless 선박이다."},{"id":"7dd5ccac7c","s":4,"n":"","q":"정기선운영에서 컨테이너 적재를 목적으로 하고 있지만 벌크도 실을 수 있는 겸용 선박은?","o":["기어 컨테이너선","세미 컨테이너선","풀 컨테이너선","컨버터블 컨테이너선"],"a":3,"e":"컨버터블 컨테이너선(Convertible Container Ship)은 화물창의 일부 또는 전부를 컨테이너와 벌크·일반화물용으로 전환할 수 있는 겸용선으로, 시황에 따라 용도를 바꿀 수 있다."},{"id":"f47ba03973","s":4,"n":"","q":"다음 중 컨테이너 적재를 목적으로 하고 있지만 벌크도 실을 수 있는 겸용 선박은?","o":["풀 컨테이너선(Full container ship)","컨버터블 컨테이너선(Convertible container ship)","세미 컨테이너선(Semi-container ship)","기어레스 컨테이너선(Gearless container ship)"],"a":1,"e":"컨버터블 컨테이너선(convertible container ship)은 화물창의 셀 가이드를 착탈·전환할 수 있어 컨테이너 적재를 주목적으로 하면서 필요 시 벌크화물도 실을 수 있는 겸용선이다."},{"id":"a49df36063","s":4,"n":"","q":"다음에서 컨테이너와 컨테이너를 넣지 않은 화물(break bulk) 두 가지를 적재하는 장비를 설치한 선박은?","o":["풀 컨테이너선(Full container ship)","컨버터블 컨테이너선(Convertible container ship)","세미 컨테이너선(Semi-container ship)","기어레스 컨테이너선(Gearless container ship)"],"a":2,"e":"세미 컨테이너선(semi-container ship)은 재래 화물선을 개조해 일부 선창에만 컨테이너를 적재하고 나머지에는 브레이크 벌크(break bulk) 화물을 싣도록 양쪽 하역장비를 갖춘 과도기적 선형이다."},{"id":"7660517fc7","s":4,"n":"","q":"해운동맹의 일괄운임인상(GRI)인 경우에는 화주 및 화주단체에 몇일 전에 통보해야 하는가?","o":["150일","100일","50일","30일"],"a":0,"e":"Liner Code는 일괄운임인상(GRI) 시 화주 및 화주단체에 최소 150일 전 사전 통보와 협의를 요구해 화주가 대응할 시간을 보장한다."},{"id":"2c620fd076","s":4,"n":"","q":"다음에서 1등 항해사가 적화계획을 세울 때에는 최대의 경제성이 발생할 수 있게 하기 위해 중점을 두어야 하는 것과 거리가 먼 것은?","o":["적화의 양을 결정한다.","중심의 위치를 적당하게 한다.","트림(배의 전후의 경사)을 최적으로 한다.","선창의 용적을 결정한다."],"a":3,"e":"적화계획(stowage plan)은 적화량 결정, 중심(重心) 위치 조정, 최적 트림 확보에 중점을 두며, 선창 용적은 선박 고유의 제원으로 계획으로 결정할 대상이 아니다."},{"id":"a921ddd274","s":4,"n":"","q":"선박의 조정이나 선적량의 산출에서 사용하는 거리로 선박법상 그 표시를 규정하고 있는 것은?","o":["형흘수 ((Moulded draft)","용골 흘수 (Keel draft)","전부흘수(Fore draft)","중앙부 흘수(Midship draft)"],"a":1,"e":"용골 흘수(keel draft)는 용골 하면에서 수면까지의 깊이로 실제 선박 조종과 적재량(재화중량) 산출에 쓰이며 선박법상 흘수 표시 규정의 기준이 된다. 형흘수는 형선(외판 내면) 기준 값이다."},{"id":"444b77213a","s":4,"n":"","q":"선박의 안전을 확보하기 위해 선체 높이의 일정 부분이 물에 잠기지 않도록 하여 예비부력을 확보해야 하는 데 이를 무엇이라 하는가?","o":["건현(Freeboard)","만재 흘수선(Full load line)","횡경사(Heel)","전장(Length over al)"],"a":0,"e":"건현(freeboard)은 만재흘수선상 갑판선 상단까지의 수직거리로, 선체 일정 부분을 물에 잠기지 않게 남겨 예비부력(reserve buoyancy)을 확보해 안전을 지키는 개념이다."},{"id":"d87c6e5d00","s":4,"n":"","q":"선박에서 인간의 몸을 포함한 모든 동물들의 척추와 같은 역할을 하는 구조부재는?","o":["선저 만곡부","용골","늑골","플레어"],"a":1,"e":"용골(keel)은 선저 중심선을 따라 선수에서 선미까지 이어지는 주요 종강력재로, 선체의 척추 역할을 하며 종강도의 기준이 된다."},{"id":"4fa30d34e0","s":4,"n":"","q":"선박의 선저와 선측을 연결하는 곡선 부분으로 대개의 경우에 원형으로 구성되어 있는 것을 말하는 것은?","o":["선저 만곡부(Bilge)","용골(Keel)","늑판(Floor)","외판 (Shell plating)"],"a":0,"e":"선저 만곡부(bilge)는 선저와 선측을 잇는 원호형 곡선부로, 빌지 킬(bilge keel)을 붙여 횡동요를 줄이기도 한다. 용골은 중심선 종강력재, 늑판은 이중저 횡부재다."},{"id":"a1f4024ac6","s":4,"n":"","q":"다음 중 외판 철판의 투께를 포함한 선폭으로 주로 입거 시나 운하 통과 시에 이용되는 선폭은?","o":["형폭(Moulded breadth)","전폭(Extreme breadth)","형깊이((Moulded depth)","용골 깊이(Keel depth)"],"a":1,"e":"전폭(extreme breadth)은 외판 강판 두께를 포함한 선체 최대 폭으로, 입거(docking)나 운하·안벽 통과 등 선박 조정에 사용된다. 형폭은 외판 내면 기준 폭이다."},{"id":"f984685543","s":4,"n":"","q":"우리나라의 선급에서는 배의 깊이를 용골의 상면에서 측정하는데 선박에서 가장 내측의 선을 무엇이라고 하는가?","o":["형깊이((Moulded depth)","용골 깊이(Keel depth)","형선 (Molding line)","흘수(Draft)"],"a":2,"e":"형선(molding line)은 외판 내면, 즉 선체 골재의 가장 내측을 연결한 기준선으로, 우리나라 선급은 용골 상면에서 이 형선을 기준으로 형깊이를 측정한다."},{"id":"0c5422d59e","s":4,"n":"","q":"다음 중 가장 오래된 역사를 지닌 CALCUTTA 해운동맹의 항로는??","o":["영국·인도항로","구주/호주 항로","극동/미태평양 항로","극동/미대서양 항로"],"a":0,"e":"1875년 결성된 캘커타 동맹(Calcutta Conference)은 영국~인도(캘커타) 항로에 조직된 세계 최초의 해운동맹으로 가장 오래된 역사를 지닌다."},{"id":"ee5b1b7891","s":4,"n":"","q":"다음에서 화물의 적화계수에 대한 설명으로 적절한 것은?","o":["화물 1미터톤이 차지하는 선창 용적을 ㎥ 단위로 표시한 수치이다.","화물 1롱톤이 차지하는 선창 용적을 ㎥ 단위로 표시한 수치이다.","화물 1미터톤이 차지하는 선창 용적을 ft³ 단위로 표시한 수치이다.","화물 1롱톤이 차지하는 선창 용적을 ft³ 단위로 표시한 수치이다."],"a":3,"e":"적화계수(stowage factor)는 화물 1롱톤(1,016kg)이 차지하는 선창 용적을 ft³로 나타낸 값으로, 수치가 클수록 용적을 많이 차지하는 경화물이다."},{"id":"d00fc1057a","s":4,"n":"","q":"다음은 선하증권의 발행시기에 대한 설명으로 적합하지 않은 것은?","o":["선하증권의 발행은 수령선하증권주의에 준거한다.","하주(용선자 또는 송하인)으로 부터 운송물을 수령한 후에 발행된다.","하주의 청구에 의하여 발행된다.","수하인의 청구에 의하여 발행된다."],"a":3,"e":"발행 청구권자는 운송물을 인도한 하주(송하인 또는 용선자)이며, 수하인은 발행을 청구할 지위에 없다."},{"id":"c75ea2bef1","s":4,"n":"","q":"다음 중 선박의 용적 및 중량 톤수에 관해 서술한 것 중 적합하게 설명한 것은?","o":["총톤수: 화물이나 여객 운송을 위해 쓰이는 실제 용적이다.","순톤수: 선박의 크기를 표시하는 단위로 보통 상갑판 이하의 모든 용적에 차폐된 장소의 용적을 더한 용적이다.","배수톤수: 선박이 물에 잠김으로써 배제한 물의 무게로 선박의 무게에 해당되는 양인 배수량에 톤수를 붙인 것이다.","운하톤수: 선박이 적재할 수 있는 최대의 무게를 나타내는 톤수를 말한다."],"a":2,"e":"배수톤수(displacement tonnage)는 선체가 배제한 물의 무게로 곧 선박 자체의 중량을 나타낸다. ①은 순톤수, ②는 총톤수, ④는 재화중량톤수(DWT)의 설명이다."},{"id":"347bbf1a6d","s":4,"n":"","q":"선박이 적재할 수 있는 최대의 무게를 나타내는 톤수를 말하는 것은?","o":["재화중량톤수","배수톤수","순톤수","운하톤수"],"a":0,"e":"재화중량톤수(DWT)는 만재흘수선까지 적재 가능한 화물·연료·청수 등의 총중량으로, 선박의 실질 수송능력을 표시하는 대표적 중량톤수다."},{"id":"7c29d6e30c","s":4,"n":"","q":"다음 중 여객이나 화물의 운송을 할 수 있는 선박 안의 장소의 크기를 나타내는 톤수는 어느 것인가?","o":["총톤수","배수톤수","순톤수","재화용적톤수"],"a":1,"e":"'여객·화물 운송을 할 수 있는 선박 안 장소의 크기를 나타내는 톤수' → 회사 정답은 배수톤수다. 보기 ②로 고정해 암기한다. ⚠[정답 논란] 운송에 직접 사용되는 선내 장소의 크기를 나타내는 것은 순톤수(N/T)이고 배수톤수는 선박의 중량 톤수이므로, 일반 이론상 정답은 ③이다. 다만 채점은 회사 제공 정답 ② 기준이므로 시험에서는 ②로 답할 것.","c":{"t":2,"n":"운송에 직접 사용되는 선내 장소의 크기를 나타내는 것은 순톤수(N/T)이고 배수톤수는 선박의 중량 톤수이므로, 일반 이론상 정답은 ③이다."}},{"id":"5bbf246441","s":4,"n":"","q":"선박이 적재할 수 있는 화물의 중량을 의미하는 톤(ton)수는?","o":["총톤수","순톤수","재화중량톤수","배수량톤수"],"a":2,"e":"재화중량톤수(DWT)는 만재흘수선까지 적재할 수 있는 화물·연료·청수 등의 최대 중량으로, 선박의 화물 적재능력을 중량으로 표시한 톤수다."},{"id":"10908b1635","s":4,"n":"","q":"다음은 만재 흘수선에 대한 설명으로 적절한 것은?","o":["선박항해의 안전을 확보할 수 있는 상태에서 허락된 최대의 흘수를 말한다.","선체 높이의 일정 부분이 물에 잠기지 않도록 하여 예비 부력을 확보하는 것을 말한다.","선체의 수면에 잠겨 있는 깊이를 용골에서 수면까지의 높이를 말한다.","안벽계류, 운하통과 및 입거 등 선박 조정에 필요한 선체의 최대 높이를 말한다."],"a":0,"e":"만재흘수선(load line)은 항해 안전을 확보할 수 있는 범위에서 허용되는 최대 흘수, 즉 최소 건현에 대응하는 한계선이다. ②는 건현, ③은 흘수의 정의다."},{"id":"badcb8fa00","s":4,"n":"","q":"선박의 깊이란 선박 길이의 중앙에 있어서, 상갑판 빔의 현측 상면에서 어디까지의 수직거리인가?","o":["용골 상면","가용골 상면","가용골 하면","용골 하면"],"a":0,"e":"선박의 깊이(형깊이)는 선체 중앙에서 상갑판 빔의 현측 상면부터 용골 상면까지의 수직거리이며, 가용골이나 용골 하면 기준이 아니다."},{"id":"f912b382bb","s":4,"n":"","q":"다음에서 흘수(draft)에 대한 설명으로 잘못된것은?","o":["선박의 용골에서 수면까지의 수직거리를 흘수라 한다.","선수에 만재흘수선표가 표시된다.","흘수에는 용골흘수와 형흘수가 있다.","적당한 흘수를 확보하는 것은 선박의 안전을 위하여 대단히 중요하다."],"a":1,"e":"만재흘수선표(load line mark)는 선체 중앙부(midship) 양 현측에 표시하며 선수에는 두지 않는다. 흘수는 용골에서 수면까지의 수직거리로 용골흘수·형흘수로 구분된다."},{"id":"d1ef1c6d5c","s":4,"n":"","q":"다음 중 용골 하(下)면에서 부터 수면까지 수직거리를 표시하는 Draft를 말하는 것은?","o":["Model Draft","Keel Draft","Deep Draft","Full Loaded Draft"],"a":1,"e":"용골 하면에서 수면까지의 흘수는 용골흘수(keel draft)이며, 형흘수(moulded draft)는 용골 상면인 형기선에서 수면까지를 잰 값이다."},{"id":"a7a16ecab6","s":4,"n":"","q":"물속에서 잠긴 선체의 깊이로, 선박의 용골에서 수면까지의 수직거리를 말하는 것은?","o":["흘수","톤수","건현","트림"],"a":0,"e":"흘수(draft)는 물에 잠긴 선체의 깊이다. 건현(freeboard)은 수면에서 갑판선까지의 높이, 트림(trim)은 선수·선미 흘수의 차를 뜻한다."},{"id":"da50551190","s":4,"n":"","q":"다음 중 선박의 배수량을 적절하게 표시한 것은?","o":["수면하의 용적 x 물의 비중","수면하의 중량 x 물의 비중","수면상의 용적 x 물의 비중","수면상의 중량 x 물의 비중"],"a":0,"e":"배수량(displacement)은 아르키메데스 원리에 따라 수면하 선체 용적에 물의 비중을 곱한 값으로, 선박의 총중량과 같다."},{"id":"587d746e7b","s":4,"n":"","q":"다음은 부심을 설명한 것으로 적당한 것은?","o":["전 중량의 중심","수면상의 용적의 중심","수면하 용적의 중심","수면하 중량의 중심"],"a":2,"e":"부심(center of buoyancy, B)은 수면하 배수 용적의 기하학적 중심으로 부력의 작용점이다. 전 중량의 중심은 무게중심(G)이다."},{"id":"0d2a321594","s":4,"n":"","q":"다음 중 부정기선 시장에서 화주의 역할로 적당한 것은?","o":["선박을 직접 소유하지는 않으나 1년 내지 2년 장기로 용선하여 화물을 확보 및 운송을 하는 자","화물을 직접 소유 혹은 구매하거나 중간 매매에 관계된 자","항해운송계약을 비롯한 각종 용선계약체결을 주도하는 자","선박의 건조와 해체를 포함하여 매각 및 매입을 하는 자"],"a":1,"e":"화주(trader)는 화물을 직접 소유·구매하거나 중간 매매에 관여하는 화물 측 당사자다. ①은 선박을 장기 용선해 운용하는 운항자(operator), ③은 브로커, ④는 선박매매·해체(S&P) 업무에 해당한다."},{"id":"a169a879d4","s":4,"n":"","q":"용선운송계약서에서 \"good steamship called the ~ classed 100A1 at Lloyed's\"와 같이 표시되는것은 무엇을 뜻하는 문구인가?","o":["선박의 표시","선박의 동정","선박의 선명","감항능력의 담보"],"a":3,"e":"\"classed 100A1 at Lloyd's\"는 선급 유지를 통해 선박이 감항능력(seaworthiness)을 갖추었음을 담보하는 문구다."},{"id":"5e471f4d57","s":4,"n":"","q":"다음에서 국내외의 화물을 주로 취급하는 항만에 해당 하는 것은?","o":["상항","산업항","어항","관광항"],"a":0,"e":"상항(commercial port)은 국내외 일반화물과 여객을 주로 취급하는 무역항이다. 산업항은 특정 원자재, 어항은 수산물, 관광항은 관광·여객 기능 중심이다."},{"id":"2dec077737","s":4,"n":"","q":"다음에서 태풍 등의 황천을 피하기 위한 항으로 진해항, 흑산도항 같은 항만을 무엇이라고 하는가?","o":["상항(Commercial Port)","산업항(Industrial Port)","관광항(Recreation Port)","피난항(Refuge Port)"],"a":3,"e":"피난항(refuge port)은 태풍 등 황천 시 선박이 일시 대피하기 위해 지정된 항만으로, 진해항·흑산도항 등이 해당한다."},{"id":"56e3798c43","s":4,"n":"","q":"항만을 입지조건으로 분류한 것 중 해항(sea port)라고도 하며 바다에 접해 있는 거의 모든 항만이 이에 해당되는 것은?","o":["하구항(Estuary port)","하천항(River port)","연안항(Coastal port)","운하항(Canal port)"],"a":2,"e":"입지조건 분류에서 연안항(coastal port)은 해안선에 직접 면한 항만으로 바다에 접한 대부분의 항이 여기 속해 해항(sea port)이라 불린다. 하구·하천·운하항은 내륙수로와 연계된 형태다."},{"id":"b29311f9c3","s":4,"n":"","q":"다음 중 목포항이나 뉴욕 항 처럼 강과 바다가 접하는 수역에 위치한 항으로 내륙 수운과 연결된 항만은?","o":["하구항(Estuary port)","하천항(River port)","연안항(Coastal port)","운하항(Canal port)"],"a":0,"e":"하구항(estuary port)은 강과 바다가 만나는 기수역에 위치해 해상운송과 내륙 수운(inland waterway)을 연결하는 항만으로, 목포·뉴욕·런던 항이 대표적이다."},{"id":"c973ff9f32","s":4,"n":"","q":"다음 중 관리 주체가 시도지사로서 지역별 육해상 운송망의 거점으로서 지역산업에 필요한 화물처리를 주목적으로 하는 항만은?","o":["국가 관리항","지방 관리항","연안항","운하항"],"a":1,"e":"지방관리(무역)항은 시·도지사가 관리주체로서 지역별 육해상 운송망 거점 기능과 지역산업용 화물처리를 주목적으로 한다. 국가관리항은 해양수산부가 직접 관리한다."},{"id":"02360250e1","s":4,"n":"","q":"다음 중 항만 물류의 특성에 관한 설명으로 타당하지 않은 것은?","o":["항만 물류의 제약성","항만 물류의 수동성","항만 물류의 불규칙성","항만 물류의 저장성"],"a":3,"e":"항만물류는 본선 입출항 일정에 좌우되는 수동성·불규칙성과 시설·수역의 제약성을 갖지만, 화물을 장기 보관하기보다 신속 통과(throughput)를 지향하므로 저장성은 특성이 아니다."},{"id":"5911121d3a","s":4,"n":"","q":"다음 중 계류시설에 속하지 않는 것은?","o":["안벽","부표","잔교","항로 표지"],"a":3,"e":"계류시설은 안벽(quay wall)·계류부표(mooring buoy)·잔교(pier)처럼 선박을 붙여 매는 시설이며, 항로표지(aids to navigation)는 항행보조시설에 속한다."},{"id":"09531a2393","s":4,"n":"","q":"정기선 해운이 취급하는 일반화물의 종류가 아닌 것은?","o":["정량화물","고가화물","단위화물","액체화물"],"a":1,"e":"정기선의 일반화물(general cargo)은 정량화물(fine cargo), 조잡화물(rough cargo), 액체화물, 단위화물(unit cargo) 등으로 나뉜다. 고가화물은 특별한 관리가 필요한 특수화물(special cargo)로 분류된다."},{"id":"689173267f","s":4,"n":"","q":"다음 중 화물의 성질상 적화와 취급에 특별한 주의를 필요로 하지 않는 화물로서 보통 잡화라 불리는 화물은?","o":["일반화물","고가화물","특별화물","벌크화물"],"a":0,"e":"적부·취급에 특별한 주의가 필요 없는 보통 잡화(general cargo)를 일반화물이라 하며, 고가화물·특별화물은 별도의 취급주의와 할증운임이 적용된다."},{"id":"1f320e554a","s":4,"n":"","q":"다음 운송 중에는 일정시간마다 온도를 측정하여 적정온도를 유지해야하는 화물에 해당하는 것은?","o":["냉장화물","고가화물","생동식물 화물","중량화물"],"a":0,"e":"냉장·냉동화물은 품목별 지정 온도를 벗어나면 변질되므로 항해 중 일정 시간마다 창내 온도를 측정·기록하여 적정 온도를 유지해야 한다."},{"id":"676b84951b","s":4,"n":"","q":"다음은 고가화물에 대한 설명으로서 올바르지 않은 것은?","o":["금괴, 보석, 귀금속, 화폐, 미술품, 정밀 기계 등 무게나 용적에 비하여 값이 비싼 화물을 말한다","고가 화물 선적시에는 담당 사관이 직접 입회하여 포장과 봉인 상태를 검사하고, 선적 서류와 대조하여 확인해야 한다.","일반적으로 고가화물에 대한 운임은 화물의 중량이난 용적에 의한다.","고가화물의 경우 시장 가격에 일정 비율로 부과한 종가운임(Ad valorem freight)제를 취한다."],"a":2,"e":"고가화물의 운임은 중량·용적 기준이 아니라 신고 가액에 일정률을 부과하는 종가운임(ad valorem freight)으로 산정한다."},{"id":"69d5da3485","s":4,"n":"","q":"다음 중 정기선 화물로 1개의 용적이 특별히 크고 해운동맹의 표정운임률에도 포함시킬 수 없고 취급하기 어려운 화물로 하역에 특별한 준비가 필요하여 할증운임이 부과되는 화물은?","o":["중량화물(Heavy Cargo)","고가화물(Valuable Cargo)","위험화물(Dangerous Cargo)","벌크화물(Bulky Cargo)"],"a":3,"e":"1개 용적이 특별히 크고 표정운임률 적용이 어려워 특별 준비와 할증운임이 필요한 화물은 용적화물(bulky cargo)이다. 중량화물은 무게, 고가화물은 가액 기준."},{"id":"b35e4fd839","s":4,"n":"","q":"다음에서 포장을 하지 않은 상태로 운송하는 화물로서 주로 부정기선 화물의 대부분이 속하는 것은?","o":["건화물(dry cargo)","액상화물(liquid cargo)","산화물(bulk cargo)","기피화물(dirty cargo)"],"a":2,"e":"산화물(bulk cargo)은 곡물·석탄·광석·시멘트처럼 포장하지 않고 살적 상태로 운송하는 화물로, 부정기선(tramper) 화물의 대부분을 차지한다."},{"id":"cc3b3dfbf0","s":4,"n":"","q":"정기선 운송에서 다른 화물을 오손시킬 우려가 있는 화물을 무엇이라고 하는가?","o":["정량화물(Fine or Clean Cargo)","조잡화물(Rough Cargo)","산적화물(Break Bulk Cargo)","단위화물(Unit Cargo, Container Cargo)"],"a":1,"e":"다른 화물을 오손시킬 우려가 있는 화물은 조잡화물(rough cargo)이며, 그런 우려가 없는 화물은 정량화물(fine or clean cargo)이다."},{"id":"fefb51c364","s":4,"n":"","q":"정기선(Liner) 해운의 특징이 아닌 것은?","o":["계획적인 선박운영이다.","나용선을 정기선이라 한다.","운임협정 및 운송약관을 적용한다.","정기운항 선박은 고성능 고단가이다."],"a":1,"e":"나용선(bareboat charter)은 선박 자체만 임대하는 용선 형태로 부정기선 영업에 이용되며 정기선과 무관하다. 계획적 배선, 운임협정 및 운송약관(태리프) 적용, 고성능·고선가 선박 투입이 정기선의 특징이다."},{"id":"6946eab989","s":4,"n":"","q":"다음에서 갑판상에 설치되어 있고, 하역 작업에 가장 많이 사용되는 크레인은?","o":["겐트리 크레인","해상크레인","덱크레인","다리형크레인"],"a":2,"e":"덱크레인(deck crane)은 갑판에 상시 설치되어 본선 하역에 가장 널리 쓰인다. 겐트리·다리형 크레인은 안벽의 육상 설비이고, 해상크레인은 중량물 전용 부선 설비다."},{"id":"a06593b9bf","s":4,"n":"","q":"선박의 현측을 통하여 크레인 등으로 화물을 하역하는 방식을 무엇이라 하는가?","o":["RO/RO","FO/FO","LO/LO","Lash"],"a":2,"e":"본선 현측에서 겐트리크레인 등으로 화물을 수직으로 들어 올려 적양하하는 방식은 LO/LO(Lift on/Lift off)다. RO/RO는 램프를 통한 자체 주행 방식, LASH는 부선(barge)을 본선에 적재하는 방식이다."},{"id":"fadb71ee1d","s":4,"n":"","q":"다음 중 이동식 컨테이너 취급장비로서 컨테이너를 차곡차곡 쌓거나 컨테이너를 내리는 일 또는 섀시나 트레일러에 싣고 내리는 일을 하는 것은?","o":["스트래들 캐리어(Straddle Carrier)","갠트리 크레인(Gantry Crane, Shore Crane, Quay Crane)","트랜스테이너(Transtainer, Transfer Crane)","위치 크레인(Winch Crane)"],"a":2,"e":"트랜스테이너(Transfer Crane)는 CY에서 컨테이너를 다단 적재·해체하고 섀시·트레일러에 상하차하는 이동식 야드 장비다. 갠트리 크레인은 안벽 본선하역용 고정 설비다."},{"id":"bc62593547","s":4,"n":"","q":"본선이 입항하면 CY 운영자는 집화된 컨테이너를 무엇을 사용하여 선적하는가?","o":["갠트리 크레인(gantry crane)","데릭 포스트(derrick post)","하역용 윈치(winch)","지브 크레인 (jib crane)"],"a":0,"e":"컨테이너 전용부두에서는 안벽에 설치된 갠트리 크레인(container gantry crane)으로 컨테이너를 선적·양하하여 하역 생산성을 확보한다."},{"id":"e4991705d6","s":4,"n":"","q":"부정기선의 일종인 벌크선의 선내 적화는 주로 무엇으로 하는가?","o":["갠트리 크레인(Gantry crane)","테릭 포스트(Derrick post)","윈치(Winch)","벨트 컨베이어(Belt conveyor)"],"a":3,"e":"벌크선의 선내 적화는 안벽 로더에서 이어지는 벨트 컨베이어(belt conveyor)로 선창에 흘려 넣는 방식이 주로 사용된다."},{"id":"20ab55207f","s":4,"n":"","q":"다음에서 LOLO(Lift On Lift On)선의 특성을 설명한 것으로 적합하지 않은 것은?","o":["컨테이너를 육상의 갠트리 크레인으로 싣고 내리는 선박이다.","화물창 내에서는 상하 방향으로 설치된 셀 가이드에 따라서 컨테이너를 중복되게 격납한다.","컨테이너를 트레일러에 의하여 적재하는 방식으로 프크리프트를 사용하여 쌓는다.","갑판 상에 컨테이너를 과적하면 항해 중 복원력에 나쁜 영향을 미칠 수 있다."],"a":2,"e":"트레일러로 끌어 넣고 포크리프트로 쌓는 방식은 RORO(Roll on Roll off)의 특징이다. LOLO선은 육상 갠트리크레인으로 수직 하역하고 셀 가이드(cell guide)에 따라 컨테이너를 다단 격납한다."},{"id":"da67b52ec8","s":4,"n":"","q":"다음에서 RORO(Roll On Roll off)선의 특징을 서술한 것으로 해당되지 않는 것은?","o":["선미 또는 현측에 설치한 램프웨이를 통해 컨테이너를 트레일러에 의해 적재하는 방식이다.","화물창 내에서는 포크리프트를 사용하여 중복으로 쌓아 격납한다.","적재 가능한 컨테이너가 적어 육상의 크레인 설비가 필요하지 않다.","갑판 상에 컨테이너를 과적하면 항해 중 복원력에 나쁜 영향을 미칠 수 있다."],"a":3,"e":"램프웨이 하역, 화물창 내 포크리프트 적재, 육상 크레인 불필요는 모두 RORO선의 특징이다. 갑판상 컨테이너 과적으로 무게중심이 상승해 복원력(GM)이 악화되는 문제는 컨테이너를 다단 적재하는 LOLO형 컨테이너선의 특성이다."},{"id":"2bc3e297ff","s":4,"n":"","q":"다음 해운동맹의 내부규제인 배선협정에 대한 설명으로 관계가 없는 것은?","o":["특정의 항로에 있어서 배선선복량을 조절·제한하고 선복과잉에 의한 과당경쟁을 방지하려는 것이다.","일정한 항로에 있어서 항해수, 기항지, 운항 schedule 등을 규제한다.","생산업자간의 수량 카르텔에 해당된다.","각 항로 사정에 따라 이 중 하나 또는 둘 이상을 개별적으로 분리시켜 실시하고 있다"],"a":3,"e":"④는 운임협정·배선협정·풀협정 등 내부규제 전반을 항로 사정에 따라 선택 실시한다는 일반론으로 배선협정 자체의 내용이 아니다. 배선협정은 항해수·기항지·선복량을 규제하는 수량 카르텔이다."},{"id":"507d4deb43","s":4,"n":"","q":"다음운 우리나라 해운업법과 그 시행령에 규정된 해운관련 업종 중 순수 해운업으로 분류되는 것은?","o":["해운중개업","선박대여업","해상화물운송사업","해상화물운송주선업"],"a":0,"e":"'해운업법상 순수 해운업' → 회사 정답은 해운중개업이다. 선박대여업·해상화물운송주선업과 구별해 '순수 해운업=해운중개업'으로 암기한다. ⚠[정답 논란] 순수 해운업은 선박으로 직접 운송을 인수·수행하는 해상화물운송사업이고 해운중개업은 해운관련(부대)업으로 분류되므로, 일반 이론상 정답은 ③이다. 다만 채점은 회사 제공 정답 ① 기준이므로 시험에서는 ①로 답할 것.","c":{"t":2,"n":"순수 해운업은 선박으로 직접 운송을 인수·수행하는 해상화물운송사업이고 해운중개업은 해운관련(부대)업으로 분류되므로, 일반 이론상 정답은 ③이다."}},{"id":"0a9ba6d3ce","s":4,"n":"","q":"해운동맹(Shipping Conference)에 관한 다음 설명중 틀린 것은?","o":["해운동맹을 부정기선동맹(Tramper Conference) 또는 협의협정(Discussion Agreement)이라고도 한다.","해운동맹에는 개방식동맹(Open Conference)과 폐쇄식동맹(Closed Conference)이 있다.","해운동맹은 계약운임제도(Contract Rate System), 운임환불제도(Freight Rebate System) 등의 수단으로 화주를 구속하기도 한다.","해운동맹의 주요기능으로는 운임협정, 항해협정, 운임공동계산협정 등이 있다."],"a":0,"e":"해운동맹은 정기항로에 취항하는 정기선사들의 카르텔이므로 정기선동맹(liner conference)이며, 부정기선동맹이라는 개념은 성립하지 않는다. 개방식·폐쇄식 구분, 계약운임제·운임환불제 등 화주구속수단, 운임·항해·공동계산협정은 옳은 서술이다."},{"id":"aeb6f55b39","s":4,"n":"","q":"벌크선에서 세계 어느 항구에도 입항할 수 있는 핸디 사이즈의 선박의 중량으로 적합한 것은?","o":["15,000~20,000 중량톤","15,000~30,000 중량톤","15,000~45,000 중량톤","15,000~50,000 중량톤"],"a":2,"e":"핸디사이즈(Handysize)는 자체 하역설비를 갖추고 수심 제약이 적어 세계 대부분 항만에 입항 가능한 소형 벌크선으로, 통상 1만5천~4만5천 재화중량톤(DWT) 급으로 분류된다."},{"id":"e8b8257497","s":4,"n":"","q":"벌크선 중 핸디사이즈(Handy size)의 선박은 무게는 어느 정도인가?","o":["1만 5,000 ~ 3만 중량톤","1만 5,000 ~ 4만 5,000중량톤","2만 ~ 4만 중량톤","2만 5,000 ~ 4만 5,000중량톤"],"a":1,"e":"벌크선 선형 구분에서 핸디사이즈(Handy size)는 약 1만 5,000~4만 5,000 중량톤급으로, 자체 하역장비(gear)를 갖춰 소규모 항만에도 입항 가능한 범용선이다."},{"id":"bf0c53747c","s":4,"n":"","q":"20ft 컨테이너를 기준으로 2,000개(2,000TEU) 내외 컨테이너를 운송할 수 있는 선박은?","o":["파나맥스(Panamax)","초대형 컨테이너선","포스트 파나맥스(Post Panamax)","핸디 사이즈(Handy size)"],"a":3,"e":"2,000TEU 내외는 핸디(피더)급 컨테이너선에 해당하며, 파나맥스는 약 4,000TEU급, 포스트 파나맥스는 파나마 운하 통과 폭을 넘는 그 이상 급이다."},{"id":"b5b3681428","s":4,"n":"","q":"다음 중 AEO(Authorized Economic Operator)제도를 서술한 것으로 적합하지 않은 것은?","o":["선박의 안전확보, 항만시설의 보안유지와 관련한 제도이다.","수출입 정보를 사전에 세관에 제공하는 제도이다.","국가별 세관이 AEO 상호협정 체결 시 통관절차를 완하하는 제도이다.","우리나라는 2008년부터 도입하여 운영 중이다."],"a":0,"e":"AEO는 세관이 수출입 안전관리 우수업체를 인증하고 상호인정협정(MRA)으로 통관을 간소화하는 제도이며, 선박 안전·항만시설 보안은 ISPS Code 소관이다."},{"id":"5c8513df54","s":4,"n":"","q":"다음 혼재업자(condolidator)의 임무를 설명한 것 중 적합하지 않은 것은?","o":["화물의 생산일정 파악","선적준비 완료된 화물의 혼재계획 수립","선적서류 작성 및 제출","국내운송료 및 선박운임료 결정"],"a":3,"e":"국내운송료와 해상운임은 실제운송인(선사)과 운송시장이 결정하므로 혼재업자의 임무가 아니고, 생산일정 파악, 혼재계획 수립, 선적서류 작성·제출이 혼재업자 업무다."},{"id":"6a3b904aa8","s":4,"n":"","q":"혼재화물(Consolidated Cargoes)의 경우 혼재된 화물의 내용, 순위 및 위치를 컨테이너별로 기재한 서류를 말하는 것은?","o":["Master(Ocea Carrier) B/L","Commercial Invoice","Packing List","Container Load Plan"],"a":3,"e":"컨테이너별로 적입 화물의 명세·적입 순서·적재 위치를 기재한 서류는 컨테이너적부도(Container Load Plan, CLP)로, 도착지 적출작업의 기준이 된다."},{"id":"1c03898d69","s":4,"n":"","q":"한 사람의 Forwarder가 수입업자로 부터 위탁을 받아 다수의 수출업자로 부터 화물을 집화하여 컨테이너에 혼재하는 경우를 말하는 것은?","o":["Forwarder's Consolidation","Buyer's Consolidation","Port Consolidation","Multi Consolidation"],"a":1,"e":"수입업자(Buyer)의 위탁을 받아 다수 수출업자의 화물을 한 컨테이너에 혼재하는 것이 Buyer's Consolidation으로, 대량 구매자의 물류비 절감이 목적이다."},{"id":"32a6e983e1","s":4,"n":"","q":"한사람의 Forwarder가 다수의 수출업자로 부터 화물을 혼재하여 혼재화물 목적지가 항만으로 되어 있는 형태는?","o":["Forwarder's Consolidation","Buyer's Consolidation","Port Consolidation","Multi Consolidation"],"a":2,"e":"다수 수출업자의 화물을 혼재해 도착지 항만(Pier)까지를 대상으로 하는 CFS/CFS형 혼재를 Port Consolidation이라 하며, 도착지 CFS에서 수하인별로 분류·인도된다."},{"id":"16ee37c530","s":4,"n":"","q":"정기용선계약의 표준시식으로 뉴욕상품거래소가 1913년 제정하여 1946년 개정한 양식은?","o":["Baltime","Produce Form","Coastcon Medcon","Benacon"],"a":1,"e":"뉴욕상품거래소가 1913년 제정하고 1946년 개정한 New York Produce Exchange Form(Produce Form)이 정기용선 표준서식이다. Baltime은 BIMCO 양식."},{"id":"d210356d19","s":4,"n":"","q":"선박 복원성의 좋고 나쁨을 판단하는 가장 중요한 요소는 어느 것인가?","o":["선박의 무게","선박의 부심","선박의 경심","메타센터의 높이"],"a":3,"e":"복원성 판단의 핵심 지표는 무게중심(G)과 경심(M) 사이 거리인 메타센터 높이 GM이며, GM이 클수록 초기복원력이 크다."},{"id":"a4984ca57d","s":4,"n":"","q":"다음에서 해상화물운송장(Sea Waybill)에 대한 설명으로 부적합한 것은?","o":["권리증권이므로 항해 중에 증권을 이전함으로써, 물품의 전매나 담보가 가능하다.","해상화물운송장에 관한 규칙은 CMI uniform rules for Sea Waybill 1990 이다.","계약상품의 인도 또는 적재를 입증하는 비유가 증권 서류이다.","송화인에게 발행하는 서류이지만, 선하증권과 달리 운송품 인도청구권을 상징하지 않기 때문에 양도성이 없다."],"a":0,"e":"해상화물운송장(Sea Waybill)은 권리증권(document of title)이 아니어서 배서·교부로 전매나 담보 설정이 불가능하고, 기명 수화인이 신분 확인만으로 화물을 인도받는 비유통 증거서류다."},{"id":"35bf9d76d1","s":4,"n":"","q":"대규모의 생산설비 및 건설기자재가 특정한 공사계획에 따라 일시 또는 지속적으로 운송될 경우 발생되는 화물의 취급업무를 지칭하는 것은?","o":["Co-Loading Service","Project Cargo Handling Service","Consolidation Service","Hanging Garment Handling Service"],"a":1,"e":"특정 공사계획에 맞춰 대형 생산설비·건설기자재를 일시 또는 지속적으로 운송·관리하는 업무를 Project Cargo Handling Service라 한다."},{"id":"de6b49d577","s":4,"n":"","q":"가죽 및 모피의류 등과 같은 고가의 의류수송 서비스 형태로 Cartib Box에 의한 운송 서비스를 말하는 것은?","o":["Co-Loading Service","Project Cargo Handling Service","Exhibition Cargo Handling Service","Hanging Garment Handling Service"],"a":3,"e":"고가의 가죽·모피 의류를 걸린 상태로 Cartib Box 등에 넣어 주름 없이 운송하는 서비스가 Hanging Garment Handling Service이다."},{"id":"f2507679f2","s":4,"n":"","q":"Hanging 장치의 종류에서 Dead Space의 발생을 초래할 수 잇는 System으로 주로 가죽제품, 모피제품의 수송에 이용되는 것은?","o":["Rope System","Tag System","Bar System","Rack System"],"a":2,"e":"컨테이너 내부에 바(bar)를 가로질러 의류를 거는 Bar System은 상·하부 공간을 활용하지 못해 dead space가 생기며, 주로 가죽·모피 제품 수송에 이용된다."},{"id":"2b885411b7","s":4,"n":"","q":"전시화물 취급서비스(Exhibition Cargo Handling Service)의 특징으로 적절하지 않은 것은?","o":["포장의 중요성","비용절감","일시수입통관증서(ATA Carnet) 필요","왕복운송업무"],"a":1,"e":"전시화물은 왕복운송, 고급포장, ATA Carnet 절차가 필요해 오히려 비용이 높은 고부가 서비스이므로 비용절감은 특징이 아니다."},{"id":"33bfeff764","s":4,"n":"","q":"다음은 양륙항 선택화물(Optional Cargo) 할증과 관계된 설명으로 잘못 된 것은?","o":["화물 선적시에 양륙항이 지정되지 않고 출항 후에 화주가 가장 편리한 양륙지를 선적하여 그 항구에서 양륙하여 화물을 인도하는 경우임.","B/L의 양륙항 난에는 예컨대 'London/Hamburg option' 혹은 'Pusan/Inchon option'과 같이 두 개 이상의 항구가 명시됨.","송화인 또는 수화인은 본선의 선적지 출항 후 최초의 선택항 도착 전 일정일(보통 24시간 또는 48시간 전)까지 양륙항을 결정하여 그 항구에 있는 선박회사 대리점에 통고함.","중개인이 선택 지정하여 양륙·하도하는 화물을 Optional Cargo라고 함."],"a":3,"e":"선택양륙항의 지정권은 중개인이 아니라 송화인·수화인(화주)에게 있으며, 최초 선택항 도착 24~48시간 전까지 화주가 양륙항을 결정해 선사 대리점에 통고한다."},{"id":"99d95eeb29","s":4,"n":"","q":"국제 무역거래에서 해상운송과 함께 도로, 철도, 하천, 호수를 이용한 운송의 형태는 다음 중 어느 것인가?","o":["내륙운송","해상운송","항공운송","복합운송"],"a":0,"e":"해상운송에 접속되는 도로·철도·하천·호수(내수로) 구간은 내륙운송(inland transport)에 해당한다. 복합운송은 이러한 구간들을 단일계약·단일책임으로 묶은 상위 개념이다."},{"id":"d58eaeb5d9","s":4,"n":"","q":"1960년대 들어 국제간 교역량이 확대되어 적어도 두가지 이상의 운송수단에 의하여 물품을 운송하기 위한 단일계약에 의해 이루어지는 물품운송은?","o":["내륙운송","해상운송","항공운송","복합운송"],"a":3,"e":"서로 다른 두 가지 이상의 운송수단을 단일계약·단일책임·일관운임으로 연결하는 것이 복합운송(multimodal transport)이며, 컨테이너화와 함께 1960년대에 본격화되었다."},{"id":"0ad959c445","s":4,"n":"","q":"다음에서 선하증권의 이전(transfer)에 대한 설명으로 적절하지 않은 것은?","o":["선하증권 소유자가 자기의 소유권을 새로운 소유자에게 이전시키는 목적으로 그 물건을 타인에게 교부하는 것을 이전(transfer)이라 한다.","지시식 선하증권, 배서금지문언이 없는 기명식 선하증권, 무기명식 선하증권 및 선택무기명식 선하증권의 이전은 양도라고 한다.","양도배서금지문언이 있는 기명식 선하증권의 이전은 지명채권양도라고 한다.","선하증권에서 양도는 기명식 선하증권에 대하여 사용된다."],"a":3,"e":"양도(assignment)는 지시식·무기명식 등 유통성 증권의 이전에 쓰이며, 배서금지 기명식 B/L의 이전은 지명채권양도가 된다. 기명식 전용이라는 서술은 옳지 않다."},{"id":"f65b8d5fb0","s":4,"n":"","q":"다음에서 기명식 선하증권과 이전(transfer)에 대한 설명으로 올바르지 않는 것은?","o":["기명식 선하증권은 양도는 가능하다.","기명식 선하증권의 양수인은 양도된 취지를 운송인에게 합법적으로 통지하여야 된다.","기명식 선하증권의 양도된 사실을 통지 하기 전에 이미 양도인에게 물건이 인도된 경우에 양도는 무효가 된다.","선하증권에서 양도는 기명식 선하증권에 대하여 사용된다."],"a":2,"e":"통지 전에 양도인에게 화물이 인도되었다 해도 양도 자체가 무효로 되는 것은 아니며, 운송인의 선의 인도가 면책되고 양수인은 양도인에게 책임을 물을 수 있다."},{"id":"669c3155ab","s":4,"n":"","q":"다음에서 해상화물 운송장의 법적 특징으로 관계가 먼 것은?","o":["물품을 수취 또는 선적을 증명하는 서류라는 점에서는 B/L의 성격과 일치한다.","물품을 인수하기 위하여 수화인의 운송인에게 제시하여야 하는 B/L과는 달리 제시할 필요가 없다.","해상화물운송장은 물품을 대표하는 유가증권적 성격이 강하다.","해상화물운송장은 기명식으로된 유통불능성의 성격을 지니고 있다."],"a":2,"e":"해상화물운송장(Sea Waybill)은 화물수취증·운송계약 증거일 뿐 유통성 없는 기명식 서류로 권리증권성이 없다. 유가증권적 성격이 강하다는 것은 B/L의 특징이다."},{"id":"d0b8d7ffdd","s":4,"n":"","q":"다음 중 선하증권의 이전과 관련된 용어의 부적절한 설명은?","o":["이전은 유통증권 또는 권리증권의 소유자가 자기의 소유권을 새로운 소유자에게 이전시키는 목적으로 그 물건을 타인에게 교부하는 것을 말한다.","유통은 양도의 개념으로 증권상의 권리를 유통이라는 방법으로 양수받은 자는 증권상의 정당한 권리자이지만, 정당한 소지인이 아니다.","배서는 유통증권의 소지인이 가지고 있는 증권상의 권리를 타인에게 이전하는 목적으로 통상 그 증권의 배면에 서명하고 피이전자에게 이것을 교부하는 것을 말한다.","양도는 화물의 양도와는 달르기 때문에 배서의 형식과 그 방법은 중요치 않다."],"a":3,"e":"배서(endorsement)는 법정 형식에 따라 증권 배면에 서명·교부해야 효력이 생기므로, 형식과 방법이 중요하지 않다는 서술은 성립하지 않는다."},{"id":"d586d7c893","s":4,"n":"","q":"다음에서 Hague Rules에 대한 설명으로 적합하지 않은 것은?","o":["Hague Rules는 선하증권에 대한 약간의 통일에 관한 국제조약이다.","Hague Rules는 각국의 해상물건운송법에 대한 특별법의 지위만을 가지고 있을 뿐이다.","Hague Rules의 적용을 받는 해상물건운송계약은 선하증권 또는 이와 유사한 권리증권에 의해 증명된 운송계약에 한한다.","Hague Rules는 단순히 선하증권만을 규정하는 통일법으로 그 지위를 갖는다."],"a":3,"e":"Hague Rules는 선하증권에 관한 일부 규칙을 통일하고 운송인의 책임·면책·책임한도를 규율하는 조약으로, 선하증권만을 규정하는 완결적 통일법은 아니다."},{"id":"84c0da729b","s":4,"n":"","q":"다음에서 유통불능선하증권(Non-negotiable B/L)에 대한 설명으로 올바르지 않는 것은?","o":["유통불능선하증권(Non-negotiable B/L)은 권리증권이라고 볼 수 없다.","유통불능선하증권은 물건을 수령해야 할 사람이 특정인으로 되어 있는 기명식 선하증권(Straight B/L)을 말한다.","유통불능선하증권은 물건의 인도청구권을 표창하고 물건을 상징하고 있기 때문에 권리증권이라고 할 수 있다.","유통불능선하증권의 경우, 선박회사는 물건을 목적지에서 수화인 난에 기재된 특정인에 인도하는 의무를 부담하고 있으므로 선하증권의 제시와는 관계가 없다."],"a":2,"e":"유통불능선하증권(Straight B/L)은 특정 기명 수화인에게만 인도되어 배서·양도로 유통되지 않으므로 권리증권성이 부정된다는 것이 이 문제의 전제다."},{"id":"61d90b2c6e","s":4,"n":"","q":"다음에서 유통가능선하증권(Negotiable B/L)에 대한 설명으로 부적합한 것은?","o":["유통가능선하증권(Negotiable B/L)은 선하증권의 수화인 난에 To order of Mr. A, To bearer라고 기재되어 있는 경우이다.","유통가능선하증권은 배서 또는 인도에 의하여 유통되므로 운송인은 증권의 제시없이도 인도할 수 있다.","유통가능선하증권의 경우 운송인은 증권의 회수가 없으면 물건을 인도할 수 없으므로 증권의 소지인은 물건들을 완전하게 점유할 수 있다.","유통가능선하증권은 물건의 상징이고 완전한 권리증권이다."],"a":1,"e":"유통가능 B/L에서 운송인은 원본 증권의 회수·제시 없이 화물을 인도할 수 없으며, 무증권 인도는 운송인의 손해배상책임을 발생시킨다."},{"id":"550a5c0a14","s":4,"n":"","q":"다음 중 만약 본선이 도착하였음에도 불구하고 선하증권이 도착하지 아니한 경우의 해결책으로 가장 좋은 방법은?","o":["우선, 본선이 그 항에서 서류가 도착하는 것을 기다리는 방법이 있을 수 있다.","선박회사가 선박의 체선을 피하기 위하여 화물을 하역 또는 양륙하여 창고에 보관하는 방법이 있을 수 있다.","현재 실무적으로 광범위하게 사용되고 있는 것이 화물의 L/G(Letter of Guarantee; 수입화물선취보증서) 인도를 통해 문제를 해결 할 수 있다.","물품의 인도를 신속히 하고 서류의 분실에 따른 제반위험을 회피하고자 하는 목적으로 비유통성 해상화물운송장(Non-Negotiable Sea Waybill)을 사용할 수 있다."],"a":3,"e":"선하증권 지연 문제의 근본 해결책은 원본 제시가 불필요한 비유통성 해상화물운송장(Sea Waybill) 사용이다. L/G 인도는 선사에 위험을 남기는 임시방편이다."},{"id":"cae807e64b","s":4,"n":"","q":"다음 중 선하증권이 인도에 의해 유통되는 경우에 관한 설멍으로 바람직하지 않은 것은?","o":["선하증권은 지참인식으로 발행되어 지참인식의 배서를 한경우에는 인도만으로 유통한다.","선하증권이 특정인의 지시식으로 발행되어 그 자가 백지백서애 배서한 경우에는 인도만으로 유통한다.","선하증권은 지참인식으로 발행되기 때문에 언제든지 인도만으로 유통할 수 있다.","선하증권은 분실할 경우 위험이 있기 때문에 실제로 지참인식으로 발행되는 경우는 거의 없으므로 배서를 해야만 인도 유통이 가능하다."],"a":2,"e":"실무상 분실 위험 때문에 B/L이 지참인식(bearer)으로 발행되는 일은 거의 없으며, 지참인식 배서나 백지배서를 거쳐야 인도만으로 유통된다."},{"id":"39f655f936","s":4,"n":"","q":"다음에서 배서에 대한 설명으로 부적당한 것은?","o":["지시식의 어음, 수표 또는 지시금지가 없는 기명식의 어음, 수표 등 유가증권을 제3자에게 양도하는 방법을 말한다.","소지인식은 피배서인을 지정하지 아니하고 단순히 소지인에게 인도하라는 취지의 인도문언과 함께 배서인이 서명하는 방법이다.","양도방법이 배서에 의하도록 결정되어 있는 경우 배서 이외의 방법으로 양도할 수 있다.","신용장에서 요구되고 있는 환어음, 운송증권 등은 전형적인 증권적 채권이므로 배서에 의하여 제3자에게 자유로이 양도될 수 있다."],"a":2,"e":"양도방법이 배서로 정해진 유가증권은 배서라는 법정 방식을 갖춰야 권리가 이전되므로, 배서 이외의 방법으로 양도할 수 있다는 서술은 옳지 않다."},{"id":"441ff0e022","s":4,"n":"","q":"다음에서 연지급신용장과 같은 효과를 지닌 신용장은?","o":["매입신용장(negotiation credit)","인수신용장(acceptance credit)","지급신용장(payment credit)","확인신용장(confirmed credit)"],"a":1,"e":"인수신용장(acceptance credit)은 기한부 어음을 인수해 만기에 지급하므로, 어음 없이 만기 지급을 약정하는 연지급신용장(deferred payment credit)과 실질적 효과가 같다."},{"id":"4eb4ae435d","s":4,"n":"","q":"다음에서 Siberian Land Bridge(SLB)에 의한 국제복합운송경로의 운송구가별 적용법규가 알맞게 연결된 것은?","o":["해상운송기간: 사회주의 연락운수 규칙","소련 국경에서 유럽국경까지의 철도운송구간: 도로에 의한 국제물품운송에 관한 국제조약","유럽 및 소련 내륙 도로운송구간: 도로에 의한 물품 운송에 관한 국제조약","Vostochny에서 소련 국경까지의 철도운송구간: Hague Rules"],"a":2,"e":"SLB의 유럽·소련 내륙 도로운송구간에는 CMR(도로에 의한 물품운송에 관한 국제조약)이 적용된다. 해상구간은 Hague Rules, 국제철도구간은 CIM, 소련 내 철도는 사회주의 연락운수규칙이 적용된다."},{"id":"644387580f","s":4,"n":"","q":"다음은 해상화물운송장의 단점을 설명한 것으로 적당하지 않은 것은?","o":["자유로이 수화인을 변결할 수 있으므로 화환어음을 매도하기 위해서는 은행을 수화인으로 해야 한다.","해상화물운송장의 제출 없이도 물품을 인도 받을 수 있기 때문에 L/G인도에 따른 문제로 화물인도를 신속히 할 수 있다.","해상화물운송장은 권리증권이 아니기 때문에 항해 중에 증권을 이전함으로써 물품을 전매하는 것이 불가능하다.","해상화물운송장은 담보력이 없다."],"a":1,"e":"L/G 없이 신속히 화물을 인도받을 수 있다는 점은 해상화물운송장의 장점이다. 단점은 권리증권성·담보력 부재와 전매 불가에 있다."},{"id":"186448bd9e","s":4,"n":"","q":"다음에서 선하증권에서 운송물의 동일성을 표시하는 사항을 기입할 필요에 대한 설명으로 적당한 것은?","o":["해상화물 운송에 있어서 화물의 적재를 손쉽게 할 수 있기위해서 이다.","선하증권은 원래 본선의 선장이 발행하는 해상운송물의 수취증과 같은 역할을 하기 때문이다.","화물의 대금을 정확하게 지불 받기위해서이다.","화물의 최종 목적지에서 확인은행의 대리인에게 대금의 지불수단으로 사용하기 위해서이다."],"a":1,"e":"선하증권은 본래 선장이 발행하는 운송물 수취증(receipt)이므로, 인도할 화물의 동일성을 특정하기 위해 화인·개수·중량 등 명세 기재가 필요하다."},{"id":"66d2ca7a83","s":4,"n":"","q":"다음 선하증권의 송화인에 대한 설명으로 올바르지 않은 것은?","o":["선하증권에 기재될 모든 사항을 정확하게 운송인에게 신고하여야 하고 부정확한 사항으로 인한 손실 및 비용에 대하여 책임을 져야 한다.","운송인이 서명한 선하증권(bill of lading)을 취득할 권리를 가진 자이다.","선하증권 발행자인 운송인은 권리 양도증서가 없어도 선하증권상에 기재된 송화인이 아닌 자에게 선하증권을 교부할 수 있다.","위험물의 등급에 적합한 용기에 포장하고 위험물임을 표시하는 mark 및 label을 부착할 의무가 있다"],"a":2,"e":"선하증권은 기명된 송화인(shipper)에게 교부되는 것이 원칙이며, 권리양도증서 없이 제3자에게 교부하면 운송인이 책임을 진다. 신고 정확성 의무, 위험물 포장·표시 의무, 서명된 B/L 취득권은 모두 송화인의 지위에 부합한다."},{"id":"91ca376231","s":4,"n":"","q":"다음에서 복합운송증권에 대한 개념을 잘못 설명하고 있는 것은?","o":["복합운송에 대해 복합운송인이 발행한는 증권이다.","발행자인 운송인이 운송품의 수령을 증명하고, 운송계약의 증거가 되는 권리증권의 성격이다.","복합운송증권은 선하증궘과 똑같이 유통증권으로서의 기능을 갖고 있다.","복합운송증권은 선하증권과 달리 유가증권의 성격을 갖고 있지 않다."],"a":3,"e":"복합운송증권(MTD)도 선하증권과 마찬가지로 운송품 수령증·운송계약 증거이자 권리증권으로서 유통성과 유가증권성을 갖는다. 유가증권성이 없다는 설명은 성립하지 않는다."},{"id":"f5821381f1","s":4,"n":"","q":"화물의 선적시 및 양화시에 편리하게 이용하는 것으로, 화물의 적재상태를 기입한 것은?","o":["적화척도","화물 적재도","적화용적도","배수량등곡선도"],"a":1,"e":"화물 적재도(stowage plan)는 선창·창구별 화물의 종류·수량·적재위치를 도시해 선적과 양하 시 바로 참조하는 도면이다. 적화용적도나 배수량등곡선도는 선박 계산용 자료다."},{"id":"59a1a387aa","s":4,"n":"","q":"적화계획 작성 시 화물의 적재 상태를 표시하기 위한 중요한 자료로 주로 선박의 각 구획을 세분화 한 도면을 무엇이라고 하는가?","o":["화물 적재도","로딩마스터","적화 용적도","하역순서도"],"a":2,"e":"적화 용적도(capacity plan)는 각 선창·탱크의 용적과 중심 위치를 구획별로 세분해 표시한 도면으로, 적화계획과 복원성 계산의 기본 자료다."},{"id":"615fa96b01","s":4,"n":"","q":"정기선 서비스의 특성이 아닌 것은?","o":["공중운송인","동종화물운송","상대적으로 고가의 서비스","대규모 운영 조직"],"a":1,"e":"정기선은 소량·다품종의 이종화물을 다수 송화인으로부터 인수해 운송한다. 공중운송인(common carrier) 지위, 상대적으로 고가의 서비스, 대규모 운영조직은 정기선의 특성이며, 동종화물 만선운송은 부정기선의 특징이다."},{"id":"81cce0fdcf","s":4,"n":"","q":"최근 해상운송이 컨테이너화 되어 가고 있다. 그 이유로 옳은 것은?","o":["자본이 적게 소요된다.","선박의 정박기간이 늘어난다.","하역인부를 많이 고용할 수 있다.","화물을 안전하게 운송할 수 있다."],"a":3,"e":"컨테이너라는 규격화된 밀폐 용기를 사용해 화물의 손상·도난을 막고 안전하게 일관수송할 수 있는 것이 컨테이너화의 근본 이유다. 초기 자본은 오히려 많이 들고 정박기간과 하역인부는 줄어든다."},{"id":"af41b6ba55","s":4,"n":"","q":"다음에서 선박의 위험 화물을 분류하는 기준에 해당되는 것은?","o":["ISO code","ISM code","SOLAS","IMDG code"],"a":3,"e":"IMDG code(국제해상위험물규칙)가 위험물을 화약류부터 유해성 물질까지 9개 급으로 분류하고 포장·표시·격리·적재 요건을 규정한다."},{"id":"e931f7bc10","s":4,"n":"","q":"특별한 위험성을 가지는 물질에 대한 특별요건을 규정한 기준에 해당되는 것은?","o":["IMO code","ISM code","SOLAS","IMDG code"],"a":0,"e":"액화가스·산적 액체화학품 등 특별한 위험성을 가진 물질의 특별요건은 IMO가 채택한 각종 코드(IGC·IBC·BC code 등)에 별도로 규정되어 있다."},{"id":"46385cfccd","s":4,"n":"","q":"다음은 해약기일에 대한 설명으로 적합하지 않은 내용은?","o":["해약기일(cancelling date)을 약정하여 해약기일이 넘으면 화주는 해약권을 발동할 수 있다.","해약기일은 C/P면에 기재되며","해약기일이 도래하더라도 선박의 운항이 일기나 고장수리 등으로 방해를 받는 수가 많기 때문에 Gencon Form에서는 입항하기 48시간 전에 화주에게 통고해야 한다.","해약기일은 본선 사정상 예정일로부터 대개 30일 정도 여유를 두는 것이 보통이다."],"a":3,"e":"해약기일(cancelling date)은 선적준비 예정일로부터 통상 10~15일 정도의 여유를 두는 것이 관행이며 30일씩 여유를 두지는 않는다."},{"id":"7f0b1cd9d4","s":4,"n":"","q":"다음 중 복합운송(Multimodal Transport)방식에 적합한 정형무역 거래조건(Trade Terms)만으로 나열된 것은?","o":["CIP, DAF, FAS","CFR, CIP, FOB","CPT, FCA, CIP","FCA, CIF, CIP"],"a":2,"e":"FCA·CPT·CIP는 운송인에게 인도하는 조건으로 운송수단을 특정하지 않아 복합운송에 적합하다. FAS·FOB·CFR·CIF는 본선(선박)을 전제로 한 해상전용 조건이다."},{"id":"86a9818a92","s":4,"n":"","q":"선하증권의 법적 의미로서 맞지 않는 것은?","o":["권리증권","영수증","운임표","계약증서"],"a":2,"e":"선하증권은 화물의 수취를 증명하는 영수증, 운송계약의 증거서류, 화물인도청구권을 표창하는 권리증권(document of title)이다. 운임은 임의기재사항일 뿐 증권이 운임표는 아니다."},{"id":"51346e0bff","s":4,"n":"","q":"다음의 Stable B/L과 관련된 설명 중 적합하지 않은 것은?","o":["선하증권의 어떤 형태를 말하는 것은 아니다.","B/L의 제시시기가 필요이상으로 지연되었을 때 지연된 선하증권을 의미한다.","신용장에 선적일 이후 서류를 제시하여야 할 기한을 규정하지 않는한 선적일 이후 20일 이내에 제시하여야 한다.","신용장에 \"Stable B/L acceptable\"이란 문언이 없으면 B/L 발행일자 이후 21일 경과한 것은 수리를 할 수 없다."],"a":2,"e":"UCP600에 따르면 신용장에 제시기한이 정해지지 않은 경우 선적일 후 21일 이내(신용장 유효기일 내)에 서류를 제시해야 하며, 이를 넘기면 Stale B/L로 수리 거절된다. 20일이 아니다."},{"id":"95dd00efc6","s":4,"n":"","q":"선하증권을 재발급을 요청사유와 요청자에 관한 설명 중 적당하지 않은 것은?","o":["송하인이 OBL을 은행에 네고하기 전에 분실한 경우 - 송화인","송하인이 네고한 후 그 네고은행과 신용장개설은행간에 우송 중 분실한 경우 - 송화인","수하인이 네고은행과 신용장개설은행 간에 우송 중 분실한 경우 - 수하인","수하인이 개설은행으로부터 신용장 대금을 지급하고 OBL을 취득한 이후 그것을 소지하고 있던 자가 분실 한 경우 - 수하인"],"a":2,"e":"네고은행과 개설은행 사이 우송 중 분실은 아직 수하인이 증권을 취득하기 전 단계이므로 재발급 요청 주체는 송하인(및 네고은행)이며, 수하인이 요청할 지위에 있지 않다."},{"id":"05617bde3d","s":4,"n":"","q":"다음에서 선하증권의 실무상의 문제점으로 언급되는 사항으로 타당하지 않은 것은?","o":["선하증권이 화물보다 늦게 도착하는 문제","선하증권의 보증도 문제","선하증권원본의 문제","선하증권의 유통성문제"],"a":3,"e":"유통성(negotiability)은 선하증권의 본질적 장점이자 존재 이유로 문제점이 아니다. 실무상 문제로는 증권이 화물보다 늦게 도착하는 지연, 보증도(L/G 인도), 원본 분실·관리 문제가 거론된다."},{"id":"094c0cb768","s":4,"n":"","q":"다음 중 선하증권원본의 분실문제에 대한 설명으로 타당하지 않은 것은?","o":["비용과 위험 부담","선하증권의 재발행절차의 복잡성","선하증권의 보증도","공시최고, 제권판결 등 선하증권권리의 회복절차의 복잡성 및 장기간이 소요로 현실성 없음."],"a":2,"e":"보증도(L/G delivery)는 원본이 화물보다 늦게 도착할 때 화물을 먼저 인도하는 관행의 문제로 분실 문제와는 구별된다. 분실 문제는 비용·위험 부담, 재발행 절차와 제권판결 절차의 번잡성이다."},{"id":"2c87bd88ad","s":4,"n":"","q":"다음 주어진 수출화물의 선적 상황 하에서 발생되는 선하증권의 표기 내용 중 적합하지 않은 것을 고르시오. [FOB 부산으로 하여 양말 150박스를 20ft 컨테이너에 FCL로 운송계약을 체결하였으나 생산지까지 컨테이너가 들어올 수 없어서 부산항의 CFS에 반입하여 젖재하여 선적하였음]","o":["One container said to contain 150 box","Port of loading : Busan","Shipper's load and count","Freight : collect"],"a":2,"e":"CFS에서 운송인(또는 CFS operator)이 적입한 화물은 운송인이 수량을 확인한 것이므로 화주 적입을 전제로 한 \"Shipper's load and count\" 표기는 부적합하다. FOB이므로 Freight collect는 옳다."},{"id":"baf13efe3e","s":4,"n":"","q":"다음에서 SWB(Sea Waybill)의 활용이 선하증권문제의 해결에 도움이 된다는 논거와 해당사항이 없는 것은?","o":["SWB의 소지여부가 수하(受荷)의 권리와 관계없다.","화물인도와 SWB과 상환할 필요가 없다.","SWB은 분실되어도 위험이 수반되지 않는다.","화물에 대한 물권적 효력이 있다."],"a":3,"e":"Sea Waybill은 유통증권이 아닌 단순 운송계약·화물수취 증거서류로서 권리증권성(물권적 효력)이 없다. 그래서 상환 없이 인도되고 분실 위험도 작은 것이다."},{"id":"0bbecc793c","s":4,"n":"","q":"다음에서 SWB의 활용이 가능한 운송물이 아닌 것은?","o":["개인용품 및 이사화물","NVOCC간의 운송화물","고가격의 물품","견본품"],"a":2,"e":"SWB은 권리증권이 아니어서 담보력이 없으므로 은행 담보나 전매가 필요한 고가품 운송에는 부적합하다. 이사화물·개인용품, NVOCC 간 화물, 견본품 등 전매 가능성이 낮은 화물에 활용된다."},{"id":"e1c2a8ea76","s":4,"n":"","q":"다음에서 화물의 수입운송의 절차를 간략하게 열거한 것으로 알맞은 것은?","o":["청약접수 - 선적서류입수 - 신용장 개설 - 수입통관 - 화물인출","선적서류입수 - 청약접수 - 신용장개설 - 화물인출 - 수입통관","신용장개설 - 선적서류입수 - 청약접수 - 수입통관 - 화물인출","청약접수 - 신용장개설 - 선적서류입수 - 수입통관 - 화물인출"],"a":3,"e":"수입운송은 청약접수(계약) → 신용장 개설 → 선적서류 입수 → 수입통관 → 화물인출(D/O에 의한 반출) 순으로 진행된다."},{"id":"3a01c36649","s":4,"n":"","q":"다음에서 항만의 사용목적에 따른 분류로서 해당되지 않는 것은?","o":["상업항(Commercial Harbor)","하구항(Estuary Harbor)","검역항(Quarantine Harbor)","공업항(Industrial Harbor)"],"a":1,"e":"하구항(Estuary Harbor)은 지형·입지에 따른 분류다. 사용목적에 따른 분류는 상업항, 공업항, 어항, 검역항, 군항, 피난항 등으로 나뉜다."},{"id":"5207c4bc16","s":4,"n":"","q":"복합운송의 Modified Uniform Liability System(변형단일책임체제)를 채책한 국제조약규칙이 아닌 것은?","o":["1978년 Harmburg Rules","1956년 도로화물운송조약(CMR)","1992년 UNCTAD/ICC 복합운송증권규칙","1980년 UN국제복합 운송조약"],"a":1,"e":"변형단일책임체계는 1978년 함부르크규칙, 1980년 UN국제복합운송조약, 1992년 UNCTAD/ICC 규칙에 반영되었다. CMR은 도로 단일운송 조약으로 이종책임체계의 도로구간 준거법이다."},{"id":"d675f04637","s":4,"n":"","q":"복합운송에 대한 각 조약(규칙)뼐 책임한도액으로 적합하지 않은 것은?","o":["Hague-Visby Ruels(1968) - 30 포앙카레프랑 (약 US $2.00)","Hamburg Rules(1978) - 2.5 SDR (약 US $3.50)","CMR(1956) - 50제미날 프랑 (약 US $ 16.00)","UNCTAD/ICC(1992) - 2 SDR (약 US $2.80)"],"a":2,"e":"CMR(1956)의 책임한도는 화물 1kg당 25 제미날(금)프랑이며 50프랑이 아니다. 헤이그-비스비 30 포앙카레프랑, 함부르크 2.5 SDR, UNCTAD/ICC 2 SDR은 옳은 수치다."},{"id":"41e6cdf457","s":4,"n":"","q":"1980년 UN 국제복합운송조약상의 운송인의 책임내용으로 적합하지 않은 것은?","o":["복합운송인의 책임은 과실책임주의에 의한다.","복합운송인의 책임한도액은 손해 발생국간이 판명된 때는 국제법, 국제조약 또는 UN 조약상의 책임한도액이 가장 높은 금액으로 한다.","복합운송인의 책임한도는 이종책임제계에 의하지 않고 변형단일책임체계에 의한다.","복압운송인에 의한 물품의 수취지 또는 인도지의 어느 한 국각가 체약국이면 UN 조약이 강제적을 적용될 수 없다."],"a":3,"e":"UN국제복합운송조약은 물품의 수취지 또는 인도지 중 어느 한쪽이 체약국이면 강제 적용된다. 과실책임주의 채택과 변형단일책임체계에 의한 한도 설정은 옳은 설명이다."},{"id":"dd769d2acc","s":4,"n":"","q":"복합운송인의 책임제한에 관한 설명으로 바람직하지 않은 것은?","o":["멸실/훼손된 물품의 포장 당 666.67 SDR 또는 1㎏당 2 SDR 중 큰 금액으로 제한","해상운송이나 내수로운송이 포함된 경우는 물품의 1㎏당 8.33 SDR로 제한","특정구간에서 책임이 발생되었을 때는 그 구간에 적용되는 국제조약 또는 해당국의 강행법이 정한 책임한도액에 따름","지연손해의 책임한도는 복합운송계약에 의한 운임을 초과하지 않는 금액으로 제한"],"a":1,"e":"해상 또는 내수로 운송이 포함되지 않은 경우에 1kg당 8.33 SDR이 적용된다. 해상·내수로가 포함되면 포장당 666.67 SDR 또는 1kg당 2 SDR 중 높은 금액이 한도가 된다."},{"id":"4ed7589a58","s":4,"n":"","q":"인도지연의 경우 복합운송인의 책임한도액에 대하여 서술한 것으로 적합하지 않은 것은?","o":["복합운송계약상의 운임총액을 상한으로 한다.","지연된 운송물에 대하여 지급되는 운임의 2.5배에 상당하는 금액으로 제한한다.","1978년 Hamburg Rule을 따른다.","지연과 일부 멸실, 훼손이 같이 발생할 경우는 해당 운송물의 전손(total loss)의 경우에 인정되는 한도액을 10% 초과한다."],"a":3,"e":"지연손해와 일부 멸실·훼손이 함께 발생하더라도 총 배상액은 해당 운송물 전손(total loss) 시 인정되는 한도액을 초과할 수 없다. 10% 초과 인정이라는 규정은 없다."},{"id":"fcd34ce7ac","s":4,"n":"","q":"1975년 ICC의 국제복합운송증권에 관한 통일규칙에서 복합운송인의 주요 면책사항을 규정한 내용과 거리가 먼 것은?","o":["화주의 작위 또는 부작위로 기인한 손해 및 포장이나 기호의 오류 또는 불충분 등에 기인한 손해","불가항력 및 동맹파업 등에 기인한 손해","운송물의 고유의 하자 등에 의한 손해","특정구간에서 멸실 또는 훼손에 의한 손해"],"a":3,"e":"특정 구간에서 생긴 멸실·훼손은 면책사유가 아니라 그 구간에 적용되는 법규에 따라 복합운송인이 책임을 지는 사항이다. 화주 귀책·포장 불량, 불가항력·동맹파업, 화물 고유하자가 면책사유다."},{"id":"3430527ebc","s":4,"n":"","q":"복합운송의 유형 중 운송수단을 직접보유하지 않았지만 운송주체의 제반기능과 책임, 의무를 수행하는 일종의 계약운송인은?","o":["캐리어형 복합운송인(Carrier operator)","포워더향 복합운송인","NVOCC(Non Vessel Operation Common Carrier)형 복합운송인","해상운송인(Ocean Common Carrier)"],"a":1,"e":"선박 등 운송수단을 직접 보유하지 않으면서 계약운송인(contracting carrier)으로서 운송주체의 기능과 책임을 지는 유형이 포워더형 복합운송인이다. 캐리어형은 실제운송인, NVOCC는 미국법상 무선박 해상운송인 개념이다."},{"id":"b9b72b5879","s":4,"n":"","q":"다음에서 NOVCC의 화물을 커버하는 선사의 선하증권을 무엇이라고 하는가?","o":["Charter Party B/L","Groupage B/L","Stable B/L","EXPRESS B/L"],"a":1,"e":"선사가 NVOCC(혼재업자)에게 발행해 혼재화물 전체를 커버하는 증권이 Master B/L, 즉 Groupage B/L이다."},{"id":"4e2d1437f3","s":4,"n":"","q":"화물이 다른 지역에 위치한 2개 이상의 선적항에서 선적되었지만 하나의 선하증권으로 이를 커버하여 발행된 B/L은?","o":["Charter Party B/L","Groupage B/L","Hitchment B/L","EXPRESS B/L"],"a":2,"e":"서로 다른 지역의 2개 이상 선적항에서 나뉘어 적재된 화물을 한 장으로 묶어 발행하는 증권이 Hitchment B/L이다."},{"id":"ff6426ce29","s":4,"n":"","q":"선적이 완료되면 포워더는 화주에게 포워더 B/L 발행하며, 선사는 이때 포워더에게 어떤 B/L을 발행하는가?","o":["통선하증권(Through B/L)","선적선하증권(Shipped B/L)","통상선사선하증권(Ocean Carrier B/L)","수취선하증권(Received B/L)"],"a":2,"e":"선사는 포워더를 송하인으로 하여 Master B/L(Ocean Carrier B/L)을 발행하고, 포워더는 실화주에게 House B/L을 발행하는 이중 구조를 취한다."},{"id":"084f8dd558","s":4,"n":"","q":"다음 중 포워더가 발행하는 House B/L의 종류가 아닌 것은?","o":["한국국제물류협회선하증권(KIFFA B/L)","복합운송선하증권(FIATA B/L)","파트너 선하증권(Partner B/L)","기명식선하증권(Straight B/L)"],"a":3,"e":"기명식선하증권(Straight B/L)은 수하인 기명 여부에 따른 분류일 뿐 포워더 발행 House B/L의 종류가 아니며, KIFFA B/L·FIATA B/L 등이 House B/L에 해당한다."},{"id":"3d1e6f4f00","s":4,"n":"","q":"거래상대국의 정부로부터 허가받은 보세창고(Bonded Warehouse)에 상품을 무상으로 반출하여 현지에서 매매계약을 체결하고 판매하는 거래방식은?","o":["특수화물 운송서비스 및 각종대행서비스","보세창고도거래서비스","환적화물취급서비스","프로젝트화물 취급 서비스"],"a":1,"e":"상대국 정부가 허가한 보세창고에 물품을 미판매 상태로 반출·장치한 뒤 현지에서 매매계약을 체결해 판매하는 방식이 보세창고도거래(BWT)다."},{"id":"551fb91c8c","s":4,"n":"","q":"FIATA(International Federation of Freight Forwarders Associaltion) 관련서류 작성을 위해서 고객(화주)으로 부터 접수받는 서류 중 해당되지 않는 것은?","o":["FFI (FIATA Forwarding Instructions)","FIATA SDT(Shippers Declaration for the Transport of Dangerous Goods)","FIATA SIC(Shippers Intermodal Weight Certification)","FIATA FCT(Forwarders Certificate of Transport)"],"a":3,"e":"FCT(Forwarders Certificate of Transport)는 포워더가 화주에게 발행하는 서류이고, FFI·SDT·SIC는 화주가 포워더에게 제출하는 접수서류다."},{"id":"5a8ec15342","s":4,"n":"","q":"FIATA관련 서류 작성중 Forwarder의 창고작업을 위해 사용하는 입고확인서로 고객에게 발행하는 서류는 다음 중 어느 것인가?","o":["FCR(Forwarders Certificate of Receipt)","FIATA FCT(Forwarders Certificate of Trnasport)","FBL(FIATA Multimodal Transport Bill of Lading)","FWR(FIATA Warehouse Receipt)"],"a":3,"e":"FWR(FIATA Warehouse Receipt)은 포워더의 창고 입고 사실을 확인해 고객에게 발행하는 창고증권 성격의 서류다."},{"id":"5c8513df54","s":4,"n":"","q":"다음 혼재업자(condolidator)의 임무를 설명한 것 중 적합하지 않은 것은?","o":["화물의 생산일정 파악","선적준비 완료된 화물의 혼재계획 수립","선적서류 작성 및 제출","국내운송료 및 선박운임료 결정"],"a":3,"e":"국내운송료와 해상운임은 실제운송인(선사)과 운송시장이 결정하므로 혼재업자의 임무가 아니고, 생산일정 파악, 혼재계획 수립, 선적서류 작성·제출이 혼재업자 업무다."},{"id":"8b5a440f86","s":4,"n":"","q":"다음 중 얕은 수심이 조선에 미치는 영향과 관계가 먼 것은?","o":["트림변화가 크게된다.","흘수가 감소한다.","타효가 떨어진다.","속력이 떨어진다."],"a":1,"e":"천수역에서는 squat 현상으로 선체가 가라앉아 흘수가 증가하므로 흘수 감소는 옳지 않고, 트림 변화 확대와 타효·속력 저하가 실제 영향이다."},{"id":"5ccee57211","s":4,"n":"","q":"다음 중 선박유지를 위한 제반 비용인 선박관리비에 해당되지 않는 것은?","o":["감가상각비","보험료","복리후생비","선용품비"],"a":3,"e":"'선박관리비에 해당되지 않는 것' → 회사 정답은 선용품비다. 보기 ④로 고정해 암기한다. ⚠[정답 논란] 선용품비는 선박관리비(직접선비) 항목이고 감가상각비는 선박 취득에 따른 자본비이므로, 일반 이론상 관리비에 해당하지 않는 것은 ①이다. 다만 채점은 회사 제공 정답 ④ 기준이므로 시험에서는 ④로 답할 것.","c":{"t":0,"n":"선용품비는 선박관리비(직접선비) 항목이고 감가상각비는 선박 취득에 따른 자본비이므로, 일반 이론상 관리비에 해당하지 않는 것은 ①이다."}},{"id":"5f2e85204a","s":4,"n":"","q":"선박 운항비(operating costs)에 해당 되지 않는 항목은 다음 중 어느 것인가?","o":["선원비(manning costs)","선용품비(stores costs)","연료비(bunker expense)","보험료(insurance)"],"a":2,"e":"운항비(operating costs)는 선원비·선용품비·수리비·보험료·일반관리비 등 선박을 운항 가능 상태로 유지하는 비용이고, 연료비는 항해 실적에 따라 변동하는 항해비(voyage costs)에 속한다."},{"id":"1460db1136","s":4,"n":"","q":"다음 중 선박의 운항비에 포함되지 않는 것은?","o":["도선료","연료비","검량비","일반관리비"],"a":3,"e":"일반관리비는 본사 조직 유지에 드는 간접비로 선박 단위 운항비에 들어가지 않는다. 도선료·연료비·검량비는 특정 항해에 직접 귀속되는 운항 관련 비용이다."},{"id":"5f2e85204a","s":4,"n":"","q":"선박 운항비(operating costs)에 해당 되지 않는 항목은 다음 중 어느 것인가?","o":["선원비(manning costs)","선용품비(stores costs)","연료비(bunker expense)","보험료(insurance)"],"a":2,"e":"운항비(operating costs)는 선원비·선용품비·수리비·보험료·일반관리비 등 선박을 운항 가능 상태로 유지하는 비용이고, 연료비는 항해 실적에 따라 변동하는 항해비(voyage costs)에 속한다."},{"id":"a59add0835","s":4,"n":"","q":"화물량의 증감에 따라 비례하여 발생하는 제반비용은?","o":["화물변동비","운항변동비","운항고정비","일반관리비"],"a":0,"e":"화물변동비는 하역비·화물비·대리점비처럼 취급 화물량의 증감에 비례해 발생하는 비용이다. 운항고정비·일반관리비는 화물량과 무관하게 발생한다."},{"id":"5c48fd3a14","s":4,"n":"","q":"선박을 운항가능한 상태로 유지하기 위한 비용은?","o":["일반관리지","운항변동비","운항고정비","영업외비용"],"a":2,"e":"운항고정비는 화물량과 무관하게 선박을 운항 가능한 상태로 유지하기 위해 지출되는 선원비·수리비·보험료·감가상각 관련 비용 등을 말한다."},{"id":"1df59c2d93","s":4,"n":"","q":"다음 중 선박의 입출항 및 정박을 위한 제반비용인 항비의 종류가 아닌 것은?","o":["도선료(pilotage)","예선료(tug charge)","부두사용료(wharfage)","운항준비비(Running cost)"],"a":3,"e":"항비(port charges)는 도선료·예선료·부두사용료·입항료·계선료 등 입출항과 정박에 드는 비용이며, 운항준비비는 선박 취항 이전 단계의 준비비용이므로 항비가 아니다."},{"id":"370898303f","s":4,"n":"","q":"다음 중 정기운송계약의 주요내용과 관계가 먼 것은?","o":["선박명세","용선료 지급","부적운임유치권","감항능력담보"],"a":2,"e":"부적운임(dead freight)에 대한 유치권은 약정 선적량 미달을 다루는 항해용선계약의 사항이다. 정기용선계약에서는 선박명세, 용선료(hire) 지급, 감항능력(seaworthiness) 담보 등이 주요 내용이다."},{"id":"67793321bf","s":4,"n":"","q":"우리나라의 한진해운과 조양상선을 비롯하여 12개국 16개 선사가 운송서비스를 제공하고 있는 항로는 다음 중 어느 항로인가?","o":["극동/북미동안항로","극동/북미서안항로","동남아항로","유럽항로"],"a":0,"e":"한진해운·조양상선 등 12개국 16개 선사가 서비스했던 항로는 극동/북미동안항로로, 물동량이 크고 경쟁이 치열한 대표적 기간항로(main trunk route)다."},{"id":"20ab55207f","s":4,"n":"","q":"다음에서 LOLO(Lift On Lift On)선의 특성을 설명한 것으로 적합하지 않은 것은?","o":["컨테이너를 육상의 갠트리 크레인으로 싣고 내리는 선박이다.","화물창 내에서는 상하 방향으로 설치된 셀 가이드에 따라서 컨테이너를 중복되게 격납한다.","컨테이너를 트레일러에 의하여 적재하는 방식으로 프크리프트를 사용하여 쌓는다.","갑판 상에 컨테이너를 과적하면 항해 중 복원력에 나쁜 영향을 미칠 수 있다."],"a":2,"e":"트레일러로 끌어 넣고 포크리프트로 쌓는 방식은 RORO(Roll on Roll off)의 특징이다. LOLO선은 육상 갠트리크레인으로 수직 하역하고 셀 가이드(cell guide)에 따라 컨테이너를 다단 격납한다."},{"id":"da67b52ec8","s":4,"n":"","q":"다음에서 RORO(Roll On Roll off)선의 특징을 서술한 것으로 해당되지 않는 것은?","o":["선미 또는 현측에 설치한 램프웨이를 통해 컨테이너를 트레일러에 의해 적재하는 방식이다.","화물창 내에서는 포크리프트를 사용하여 중복으로 쌓아 격납한다.","적재 가능한 컨테이너가 적어 육상의 크레인 설비가 필요하지 않다.","갑판 상에 컨테이너를 과적하면 항해 중 복원력에 나쁜 영향을 미칠 수 있다."],"a":3,"e":"램프웨이 하역, 화물창 내 포크리프트 적재, 육상 크레인 불필요는 모두 RORO선의 특징이다. 갑판상 컨테이너 과적으로 무게중심이 상승해 복원력(GM)이 악화되는 문제는 컨테이너를 다단 적재하는 LOLO형 컨테이너선의 특성이다."},{"id":"8340b6bb92","s":4,"n":"","q":"다음 중 해상화물운송장(Sea-waybill)을 설명한 것으로 적합하지 않은 것은?","o":["해상화물운송장은 유통성을 가지고 있다.","새롭게 항공화물운송장 처럼 선하증권을 대신할 수 있다.","해상화물운송장은 운송화물의 인도에 제시가 필요치 않다.","해상화물운송장은 운송화물의 인도에 환수가 필요치 않다."],"a":0,"e":"해상화물운송장(Sea Waybill)은 비유통성(non-negotiable) 증거서류로 배서 양도가 불가하고, 화물 인도 시 제시나 환수도 요구되지 않는다."},{"id":"f6d7648bca","s":4,"n":"","q":"선박의 운항 Schedule의 종류가 아닌 것은?","o":["Pro forma schedule","Long term schedule","Short term schedule","Costal schedule"],"a":2,"e":"'선박 운항 스케줄의 종류가 아닌 것' → 회사 정답은 Short term schedule이다. 보기 ③으로 고정해 암기한다. ⚠[정답 논란] Pro forma·Long term·Short term schedule이 통상적인 3분류이고 Costal(Coastal) schedule은 운항 스케줄 종류가 아니므로, 일반 이론상 정답은 ④다. 다만 채점은 회사 제공 정답 ③ 기준이므로 시험에서는 ③로 답할 것.","c":{"t":3,"n":"Pro forma·Long term·Short term schedule이 통상적인 3분류이고 Costal(Coastal) schedule은 운항 스케줄 종류가 아니므로, 일반 이론상 정답은 ④다."}},{"id":"f41c024fe7","s":4,"n":"","q":"다음 중 선하증권의 형식에 따른 분류로 해당되지 않는 것은?","o":["Red B/L","Short form B/L","Long form B/L","Negotiable B/L"],"a":3,"e":"Negotiable/Non-negotiable은 유통성 유무에 따른 구분이고, 형식(양식) 기준 분류는 이면약관 인쇄 여부에 따른 Long/Short form B/L과 Red B/L 등이다."},{"id":"ed64b742b5","s":4,"n":"","q":"선하증권에 의한 운송의 경우 누가 정당한 수하인인가?","o":["용선자","송하인","중개인","적정하게 배서된 OBL소지인"],"a":3,"e":"지시식 B/L에서는 적법하게 배서된 원본(OBL)의 소지인이 정당한 수하인으로서 운송물 인도청구권을 가진다."},{"id":"3372b67753","s":4,"n":"","q":"선하증권이 발행되지 않은 경우 예를 들어 SWB에 의한 운송의 경우 누가 정당한 수하인인가?","o":["용선자","당해운송계약상 수하인으로 지정된 자","법원의 제권판결을 받은자","적정하게 배서된 OBL소지인"],"a":1,"e":"SWB는 비유통증권이므로 배서와 무관하게 운송계약상 수하인으로 지정된 기명 수하인이 정당한 수하인이며 신분 확인만으로 인도받는다."},{"id":"729d533cbd","s":4,"n":"","q":"다음 선하증권의 종류 중 사고부 선하증권을 뜻하는 용어가 아닌 것은?","o":["Foul B/L","Dirty B/L","B/L with reservation","Switch B/L"],"a":3,"e":"Switch B/L은 중계무역용으로 기재사항을 바꾸어 재발행한 증권이다. 사고부 선하증권은 화물·포장의 하자가 적요(remark)로 기재된 것으로 Foul·Dirty B/L, B/L with reservation이라 한다."},{"id":"baf13efe3e","s":4,"n":"","q":"다음에서 SWB(Sea Waybill)의 활용이 선하증권문제의 해결에 도움이 된다는 논거와 해당사항이 없는 것은?","o":["SWB의 소지여부가 수하(受荷)의 권리와 관계없다.","화물인도와 SWB과 상환할 필요가 없다.","SWB은 분실되어도 위험이 수반되지 않는다.","화물에 대한 물권적 효력이 있다."],"a":3,"e":"Sea Waybill은 유통증권이 아닌 단순 운송계약·화물수취 증거서류로서 권리증권성(물권적 효력)이 없다. 그래서 상환 없이 인도되고 분실 위험도 작은 것이다."},{"id":"660c56d68c","s":4,"n":"","q":"컨테이너의 성질을 설명한 것 중 적절하지 않은 것은?","o":["항구적인 성질","반복사용이 가능할 정도의 견고성","화물의 적입 및 적출이 용이하게 설계","1m³(35.3ft³) 이하의 내용 적을 구비"],"a":3,"e":"ISO 컨테이너 정의상 내용적은 1m³(35.3ft³) 이상이어야 하며, 그 밖에 항구적 성질, 반복사용 가능한 견고성, 적입·적출 용이성을 갖춰야 한다."},{"id":"46385cfccd","s":4,"n":"","q":"다음은 해약기일에 대한 설명으로 적합하지 않은 내용은?","o":["해약기일(cancelling date)을 약정하여 해약기일이 넘으면 화주는 해약권을 발동할 수 있다.","해약기일은 C/P면에 기재되며","해약기일이 도래하더라도 선박의 운항이 일기나 고장수리 등으로 방해를 받는 수가 많기 때문에 Gencon Form에서는 입항하기 48시간 전에 화주에게 통고해야 한다.","해약기일은 본선 사정상 예정일로부터 대개 30일 정도 여유를 두는 것이 보통이다."],"a":3,"e":"해약기일(cancelling date)은 선적준비 예정일로부터 통상 10~15일 정도의 여유를 두는 것이 관행이며 30일씩 여유를 두지는 않는다."},{"id":"e21c6dbfb4","s":4,"n":"","q":"다음은 개품운송계약의 설명으로 올바르지 않은 것은?","o":["개품운송계약에서 운송계약은 불요식 계약이므로 별도의 계약서 작성은 필요 없다.","무역계약상의 가격조건에 따라 선복을 확보하여야 할 책임이 수출업자에 있는지 또는 수입업자에 있는지가 결정된다.","개품운송계약은 송화인 또는 그 대리인인 운송인이 선박회사, 대리점, freight forwarder 등이 발행하는 배선표를 잘 검토하여 적당한 선박을 선정한 다음 운송을 신청하여 운송인이 이를 승낙함으로써 운송계약이 체결된다.","타인소유의 선박을 일정한 조건을 정하여 차용할 때의 계약을 말한다."],"a":3,"e":"타인 소유 선박을 조건을 정해 차용하는 것은 용선계약(charter party)의 정의이며, 개품운송계약은 선복의 일부에 화물 단위로 운송을 위탁하는 계약이다."},{"id":"fb1e314541","s":4,"n":"","q":"Forwarder가 발행하는 FIATA B/L 약관에 기재된 Forwarder의 책임한도액에 대한 설명 중 거리가 먼 것은?","o":["송화인이 화물의 성질, 화물가액을 포워더에 고지하고 종가운임을 지급하며, FIATA B/L상에 기재 시 신고가액이 한도액이 된다.","포워더의 인도지연으로 인한 손해발생 시 FIATA B/L에 의거한 복합운송계약상 운임의 2배상당액을 초과하지 않는다.","화물의 멸실, 손상에 대해 포장당 또는 단위당 SDR 666.67상당액 또는 총중량 kg당 SDR2 상당액 중 더 많은 금액을 초과하지 않는다.","포워더의 총책임은 화물의 전손에 대한 책임한도를 초과하지 않는다."],"a":2,"e":"'FIATA B/L상 포워더 책임한도와 거리가 먼 것' → 회사 정답은 포장·단위당 SDR 666.67 또는 kg당 SDR 2 중 고액을 서술한 ③이다. SDR 수치 지문이 나오면 ③으로 암기한다. ⚠[정답 논란] ③은 FBL 약관 문구와 그대로 일치하고 인도지연 한도는 '운임의 2배'가 아니라 운임 상당액이므로, 일반 이론상 거리가 먼 것은 ②다. 다만 채점은 회사 제공 정답 ③ 기준이므로 시험에서는 ③로 답할 것.","c":{"t":1,"n":"③은 FBL 약관 문구와 그대로 일치하고 인도지연 한도는 '운임의 2배'가 아니라 운임 상당액이므로, 일반 이론상 거리가 먼 것은 ②다."}},{"id":"7353017151","s":4,"n":"","q":"다음에서 부정기선 운임에 대한 종류로서 해당되지 않는 것은?","o":["용적을 단위로 하는 화물운임","화물이 고가인 경우에는 종가운임제","중량을 단위로 하는 화물운임","화물이 저가인 경우에는 최저운임제"],"a":3,"e":"최저운임(minimum rate)은 소량 개품화물에 적용되는 정기선 운임제도이며, 부정기선 운임은 중량·용적 단위 운임과 고가품의 종가운임(ad valorem)으로 구성된다."},{"id":"c50b08edc3","s":4,"n":"","q":"다음 중 선박검사의 종류로 적합하지 않는 것은?","o":["정부검사","선급검사","예비검사","국제협약검사"],"a":2,"e":"선박검사는 정부검사, 선급검사, 국제협약검사로 대별된다. 예비검사는 선박용 물건 등에 대한 사전 확인 절차로 이 분류에는 들어가지 않는다."},{"id":"14266a0400","s":4,"n":"","q":"선박검사의 종류 중에서 선박 감항성의 유지와 해상선박보험 등에 필요한 검사는 다음 중 어느 것인가?","o":["정부검사","선급검사","예비검사","국제협약검사"],"a":1,"e":"선급검사(classification survey)는 선급협회가 감항성(seaworthiness) 유지 여부를 확인하는 검사로, 해상보험 인수와 보험료 산정의 실질적 기준이 된다."},{"id":"bbe9f96f0a","s":4,"n":"","q":"주요 국제협약에 따른 검사의 종류에 해당되지 않는 것은?","o":["국제 만재흘수선협약에 의거한 검사","해양오염방지협약에 의거한 검사","로테르담규칙에 의거한 검사","해상인명안전협약에 의거한 검사"],"a":2,"e":"로테르담 규칙(Rotterdam Rules)은 해상운송인의 책임을 규율하는 상사법 협약으로 검사 근거가 아니다. 검사 관련 협약은 SOLAS, MARPOL, 국제만재흘수선협약 등이다."},{"id":"088e500a85","s":4,"n":"","q":"다음은 항만국 통제 검사(Port State Control)에 대한 특성을 설명한 것 중 적합하지 않은 것은?","o":["선박안전기준의 국제적 적합성","선원자격기준의 국제적 적합성","근로조건기준의 국제적 적합성","운송인의 의무의 국제적 적합성"],"a":3,"e":"항만국통제(PSC)는 입항 외국선박의 선박안전·선원자격·근로조건 기준의 국제적 적합성을 점검한다. 운송인의 사법상 의무 이행은 점검 대상이 아니다."},{"id":"d752a63246","s":4,"n":"","q":"다음 중 선박의 복원력에 영향을 미치지 않는 것은 어느 것인가?","o":["배수량","트림","선폭","현호"],"a":1,"e":"복원력은 배수량, 선폭, 현호(sheer)와 건현 등 선형 요소에 좌우된다. 트림은 선수미 흘수차로 종방향 자세의 문제이며 횡복원력을 결정하는 요소가 아니다."},{"id":"29d7bdfb9e","s":4,"n":"","q":"다음 중 트림과 관계가 먼 것은 어느 것인가?","o":["능파성","타효","속력","복원력"],"a":3,"e":"트림은 능파성, 타효(조타 성능), 속력에 직접 영향을 준다. 복원력은 배수량·선폭·중심 높이 등 횡방향 요소가 지배한다."},{"id":"61a3a9b05b","s":4,"n":"","q":"다음에서 유조선의 구조설비에 해당되지 않는 것은?","o":["파형격벽","펌프실","방유구획","이중저"],"a":3,"e":"이중저(double bottom)는 일반 건화물선의 대표적 구조이며, 유조선 화물탱크부는 전통적으로 이중저 대신 파형격벽·방유구획·펌프실 등을 갖춘다."},{"id":"1e8d0579a1","s":4,"n":"","q":"다음에서 냉동식 LPG 탱커의 재액화라인에 연결되어 있는 관이 아닌 것은 어느 것인가?","o":["스파지관","분사노즐관","증기관","재액관"],"a":2,"e":"냉동식 LPG 탱커의 재액화라인에는 스파지관, 분사노즐관, 재액관 등이 연결된다. 증기관은 보일러 계통 배관으로 재액화 계통과 무관하다."},{"id":"3227677baf","s":4,"n":"","q":"다음에서 항만의 기능적 시설오 주로 화물 유통 시설및 보급 시설이 아닌 것은?","o":["창고","야적장","배관시설","저유시설"],"a":2,"e":"배관시설(pipeline)은 액체화물을 이송하는 하역·처리시설에 해당한다. 창고·야적장은 화물유통시설, 저유시설은 선박 보급시설로 분류된다."},{"id":"05744d6f21","s":4,"n":"","q":"다음 컨테이너 하역방식에서 장비의 유지비용과 컨테이너 손상율이 다른 방식에 비하여 상대적으로 높은 방식은?","o":["섀시 방식","트랜스퍼 크레인 방식","스트래들 캐리어 방식","리프트 트럭 방식"],"a":2,"e":"스트래들 캐리어(straddle carrier) 방식은 장비 구조가 복잡해 정비 부담이 크고 컨테이너를 걸쳐 직접 취급하므로 유지비와 화물 손상률이 상대적으로 높다."},{"id":"5911121d3a","s":4,"n":"","q":"다음 중 계류시설에 속하지 않는 것은?","o":["안벽","부표","잔교","항로 표지"],"a":3,"e":"계류시설은 안벽(quay wall)·계류부표(mooring buoy)·잔교(pier)처럼 선박을 붙여 매는 시설이며, 항로표지(aids to navigation)는 항행보조시설에 속한다."},{"id":"4b95248613","s":4,"n":"","q":"다음 중 운항계획 수립 시에 고려해야 할 사항과 거리가 먼 것은?","o":["운송될 화물의 양과 형태 및 특성","항만의 특성","운항채산성의 항해비와 운임수입에 의한 수익성","운송 될 화물의 공급의 변동상황"],"a":3,"e":"운항계획의 검토 요소는 화물의 물량·특성, 항만 조건, 항해비 대비 운임수입의 채산성이며, 공급 측 변동이 아니라 화물 수요 변동을 고려한다."},{"id":"2c90da025b","s":4,"n":"","q":"다음 선박 저항의 종류에서 저속선의 경우 전체 저항의 70~80%, 고속선에서도 40~50%를 차지할 정도로 전체 저항 중에 가장 큰 성분의 저항은 어느 것인가?","o":["조파저항","조와저항","마찰저항","공기저항"],"a":2,"e":"침수표면의 점성 전단으로 생기는 마찰저항이 전체 저항의 최대 성분으로, 저속선 70~80%, 고속선 40~50% 수준을 차지한다."},{"id":"0fc64ddc25","s":4,"n":"","q":"배가 전진할 때 선체 가까이 있는 물이 배의 진행과 같은 방향으로 속도를 얻어서 배를 따랄가는 흐름으로 선수에서 선미로 갈수록 증가하는 현상을 무엇이라고 하는가?","o":["반류","동요","저항","마찰"],"a":0,"e":"선체가 끌고 가는 추종 흐름을 반류(wake)라 하며 선수보다 선미에서 커져 프로펠러 유입 속도와 추진 효율(반류계수)에 영향을 준다."},{"id":"892aa03e65","s":4,"n":"","q":"선박에서 사용되는 타의 종류로 타두재의 앞쪽에는 없고 뒤쪽에만 타면적이 있는 것을 무엇이라고 하는가?","o":["균형타(Balanced rudder)","불균형타(Unbalanced rudder)","반균형타(Semi-balanced rudder)","타두재(Rudder stock)"],"a":1,"e":"타두재 앞쪽에 타면적이 없고 뒤쪽에만 있는 형식은 불균형타(unbalanced rudder)이며, 균형타는 조타 토크가 작고 반균형타는 그 중간 형태다."},{"id":"9870bc8f6b","s":4,"n":"","q":"다음 중 횡강력 구성재와 종강력 구성재를 겸하고 있는 것은?","o":["Deck Beam","Side Plateing","Frame","Beam Bracket"],"a":1,"e":"횡강력재와 종강력재를 겸하는 부재는 외판(side plating)으로, 늑골과 결합해 횡방향 강도를, 선수미 방향 연속성으로 종강도를 함께 담당한다."},{"id":"ca1fbcc03a","s":4,"n":"","q":"경영을 관리의 일련의 과정으로 이해 할 때, 그 과정 요소에 대한 설명으로 적합한 것은?","o":["실행(Do) – 경영과정을 감독하고 발생된 오류사항을 수정하는 것","계획(Plan) – 목표 설정과 목표 달성 방법을 미리 생각하여 준비하는 것","감독(Control) – 조직의 목표를 달성하기 위해 인력을 적절하게 투입하는 것","통제(See) – 설정된 목표와 방법에 따라 자원이나 인력을 사용하는 것"],"a":1,"e":"관리과정(management process)은 계획(Plan)-실행(Do)-통제(See·Control)의 순환이며, 계획은 목표 설정과 달성 방법을 사전에 준비하는 단계다. 나머지 선지는 실행·통제·조직화의 설명이 서로 뒤바뀌어 있다."},{"id":"c179242aa2","s":4,"n":"","q":"다음 해운의 기능과 역할을 서술한 것으로 타당하지 않은 것은?","o":["자국상선대 확충을 통한 국제무역발전의 촉진효과","해운력은 국방력의 척도임으로 국가안보의 기여 효과","원유나 기초 원자재의 물량 확보를 통한 국내 물가의 안정효과","해상운임을 통한 국제수지의 경감효과"],"a":3,"e":"자국 상선대의 운임수입은 운임 지급에 따른 외화 유출을 대체하고 외화를 벌어들여 국제수지를 개선·증진시키는 효과가 있다. 국제수지를 '경감'한다는 표현은 성립하지 않는다."},{"id":"1b340de232","s":4,"n":"","q":"2000년대의 한국해운발전의 현황을 기술 한 것으로 적합하지 않은 것은?","o":["WTO 시대에 따른 국제적인 개방화","각 선사나 해운회사의 부채 비율 증가","비효율적인 선대의 매각 및 축소","대대적인 구조 조정"],"a":1,"e":"2000년대에는 대대적 구조조정과 비효율 선대 매각을 통해 재무구조가 개선되어 부채비율이 오히려 낮아졌으므로 부채비율 증가는 현황과 맞지 않는다."},{"id":"b4d252a477","s":4,"n":"","q":"해상운송의 주된 영업활동 이외의 활동에서 획득한 제반 수입의 종류에 해당하지 않는 것은?","o":["수입이자","자산평가이익","환차이익","항만관련수입"],"a":3,"e":"항만관련수입은 해상운송 영업활동과 직접 연결된 부대수입이므로 영업외수입에 해당하지 않는다. 수입이자·자산평가이익·환차이익이 전형적 영업외수익이다."},{"id":"1639a2e20a","s":4,"n":"","q":"해운원가의 구성요소로 해당되지 않는 것은?","o":["자본비","관리비","재고비","운항비"],"a":2,"e":"해운원가는 자본비(선비)·운항비·관리비 등으로 구성되며, 재고자산이 발생하지 않는 용역산업이므로 제조업식 재고비는 원가 구성요소가 아니다."},{"id":"1df59c2d93","s":4,"n":"","q":"다음 중 선박의 입출항 및 정박을 위한 제반비용인 항비의 종류가 아닌 것은?","o":["도선료(pilotage)","예선료(tug charge)","부두사용료(wharfage)","운항준비비(Running cost)"],"a":3,"e":"항비(port charges)는 도선료·예선료·부두사용료·입항료·계선료 등 입출항과 정박에 드는 비용이며, 운항준비비는 선박 취항 이전 단계의 준비비용이므로 항비가 아니다."},{"id":"fbb87546eb","s":4,"n":"","q":"다음 중 해상보험에 대한 설명으로 적합하지 않은 것은?","o":["피보험이익은 계약 체결시에는 존재하지 않아도 상관없으나 사고발생시에는 반드시 존재하여야 한다.","고지사항은 보험인수 및 보험료산정에 영향을 미치는 사항들이다.","Warranty를 위반하면 위반시부터 보험자는 책임을 면하게 된다.","법정보험가액은 계약체결시의 시장가액이며 이는 보험자가 보상하는 최고한도액이다."],"a":3,"e":"보험자가 보상하는 최고한도액은 당사자가 약정한 보험금액(sum insured)이며, 법정보험가액은 피보험이익의 평가 기준에 그친다. 보험금액이 보험가액을 넘으면 초과보험이 된다."},{"id":"687bb07d2e","s":4,"n":"","q":"보험계약은 계약자유의 원칙에 따라 상호협의하여 계약내용을 정하지 않고 보험가자 제시하는 약관을 피보험자가 이를 승인함으로써 성립되는 계약이라고 하는 성격은?","o":["쌍무계약","유상계약","부합계약","사행계약"],"a":2,"e":"보험자가 미리 작성한 보통약관을 상대방이 포괄적으로 승인해 성립하는 계약을 부합계약(부종계약, Contract of Adhesion)이라 하며, 개별 교섭 없이 약관해석이 작성자 불이익 원칙을 따른다."},{"id":"0ddc222d5a","s":4,"n":"","q":"다음에서 해사보좌인은 누구의 감독을 직접 받어야 하는가?","o":["자벙해난심판원장","해양수산부장관","중앙해난심판원장","법부부장관"],"a":2,"e":"해사보좌인은 중앙해양안전심판원에 등록되어 중앙심판원장의 직접 감독을 받으며, 수심인·지정해양사고관련자를 위해 심판상 행위를 대리한다."},{"id":"5cf2a20a6f","s":4,"n":"","q":"대한민구 영사가 국외에서 해난 사실을 인지하였을 때 누구에게 통보하여야 하는가?","o":["지방해난심판원","지방수석조사관","중앙해난심판원","중앙수석조사관"],"a":3,"e":"재외공관의 영사가 국외 해양사고를 인지한 경우 중앙수석조사관에게 통보하여야 하며, 이후 선적항 관할 지방심판원에서 처리된다."},{"id":"67b793c783","s":4,"n":"","q":"다음 중 일반적으로 많이 사용하는 해상 수색(Search)의 방법이 아닌 것은?","o":["Sector Search","Expanding Square Search","Parallel Sweep Search","Contour Search"],"a":3,"e":"해상수색에는 확대사각형(Expanding Square), 부채꼴(Sector), 병행소해(Parallel Sweep), 항로수색(Track Line) 등이 쓰이며, Contour Search는 항공 산악수색 기법으로 일반 해상수색법이 아니다."},{"id":"2a83f786bd","s":4,"n":"","q":"선장을 보좌 하고 갑판부 업무 총괄로 선내 기율관계 책임사관의 역할을 담당하는 자는?","o":["1등 항해사","2등 항해사","갑판장","1등 기관사"],"a":0,"e":"선장을 보좌하며 갑판부 업무를 총괄하고 선내 기율(규율) 유지의 책임사관 역할을 하는 직책은 1등항해사(Chief Officer)이다."},{"id":"1a0de85c9c","s":4,"n":"","q":"통사부에 분장된 업무가 아닌 것은?","o":["무선통신 관련 업무","선내보수 관련 업무","선내급식 관련 업무","출입항 수속 및 내객 접대, 일반 서무 업무"],"a":1,"e":"선내보수(선체·기관 정비) 업무는 갑판부와 기관부의 소관이고, 통사부(사무부)는 무선통신, 선내급식, 출입항 수속과 내객 접대 등 서무 업무를 담당한다."},{"id":"25183197a6","s":4,"n":"","q":"다음에서 해양사고의 조사 및 심판에 관한 법률에서 권고의 대상자는 누구 인가?","o":["해기사","도선사","해기사와 도선사","해기사, 도선사 이외의 자"],"a":3,"e":"권고는 징계 대상인 해기사·도선사 이외의 자(선박소유자, 안전관리책임자 등 지정해양사고관련자)에게 재발방지를 위해 행하는 조치이며, 해기사·도선사에게는 징계를 과한다."},{"id":"3497b01297","s":4,"n":"","q":"다음 중 해양사고의 조사 및 심판에 관한 법률에서 징계의 대상은?","o":["해기사나 도선사","항해사","기관사","통신사"],"a":0,"e":"징계(면허취소·업무정지·견책)의 대상은 해기사와 도선사로 한정되고, 그 밖의 해양사고 관계인에게는 징계가 아니라 권고나 시정요청을 한다."},{"id":"3bab84cfe5","s":4,"n":"","q":"다음 중 로로(Ro-Ro)선의 특징을 설명한 것 중 해당되지 않는 것은?","o":["자동차나 트레일러, 트랙터 등의 바퀴 달린 화물을 취급","화물의 적양하 시 너무 많은 노동과 시간이 소요","화물의 적양하 작업을 위해 램프(ramp)시설을 구비","선내는 여러 개의 갑판(multi-deck)의 구조"],"a":1,"e":"로로선(Ro-Ro ship)은 램프(ramp)를 통해 차륜 화물을 자력으로 싣고 내리는 수평하역 방식이어서 하역 노동력과 시간이 크게 절감된다."},{"id":"867337180d","s":4,"n":"","q":"다음에서 해상운송은 컨테이너화 되어 가고 있는데 그 이유로 올바른 것은?","o":["자본이 적게 소요된다.","선박의 정박 기간이 늘어난다.","안전하게 운송할 수 있다.","하역인부를 많이 고용할 수 있다."],"a":3,"e":"'해상운송이 컨테이너화되는 이유' → 회사 정답은 하역인부를 많이 고용할 수 있다는 ④다. 보기 ④로 고정해 암기한다. ⚠[정답 논란] 컨테이너화의 본래 효과는 파손·도난 감소에 따른 안전한 운송이며 하역인력과 정박기간은 오히려 줄어들므로, 일반 이론상 정답은 ③이다. 다만 채점은 회사 제공 정답 ④ 기준이므로 시험에서는 ④로 답할 것.","c":{"t":2,"n":"컨테이너화의 본래 효과는 파손·도난 감소에 따른 안전한 운송이며 하역인력과 정박기간은 오히려 줄어들므로, 일반 이론상 정답은 ③이다."}},{"id":"9b454c38a4","s":4,"n":"","q":"철도복합운송방식에 대한 특성을 설명한 것 중 가장 적절한 것은?","o":["우리나라에서도 현재 부산항과 광양항 구간에서 2단적 컨테이너 열차를 운행하고 있다.","TOFC방식의 피기백 시스템은 총중량이 크나 철도터미널에서 다단적이 가능하고, 공간의 소요가 적어 철도터미널에서 선호하는 방식이다.","철도/도로 겸용 운송시스템은 장거리 간선수송에서 2단 적재열차보다 더 많은 컨테이너를 운송할 수 있어 유리하다.","철도/도로 겸용 운송시스템인 Roadriler는 TOFC방식에 비하여 터미널 비용 및 트레일러 견인료를 절감할 수 있어 경제적이다."],"a":3,"e":"RoadRailer는 별도 대차(bogie) 없이 도로·철도를 겸용해 터미널 하역설비 비용과 트레일러 견인료를 절감한다. 국내는 터널 높이 제약으로 2단적(DST) 열차를 운행하지 않는다."},{"id":"727a66fa7c","s":4,"n":"","q":"다음에서 원양 및 근해 구역의 산박의 만재 흘수선에 대한 설명으로 옳지 않은 것은?","o":["만재 흘수선 규정에 의해 원양 및 근해 구역을 항행 구역으로 하는 선막은 갑판선이다.","길이 100m를 넘는 선박은 동기북대서양 만재 흘수선을 표시하지 아니한다.","갑판상에 목재를 운송하는 선박은 목재 만재 흘수선의 규정을 따로 받는다.","목재 만제 흘수선은 화물 자체가 부력을 갖기 때문에 일반 만재 흘수선보다 더 얕은 흘수를 허용하고 있다."],"a":3,"e":"목재 만재흘수선은 갑판적 목재 자체가 부력을 갖고 갑판 강도가 보강되므로 일반 만재흘수선보다 건현을 줄여 더 깊은 흘수를 허용한다. 동기북대서양(WNA) 흘수선은 길이 100m 이하 선박에만 표시한다."},{"id":"28c848598e","s":4,"n":"","q":"LCL 화물의 송화인은 화물을 컨테이너에 넣지 않은 채로 어느 곳에 반입하는가?","o":["컨테이너야적장(CY)","컨테이너 프레이트 스테이션(CFS)","마샬링야드 (Marshalling yard)","에이프런(apron)"],"a":1,"e":"LCL 화물의 송화인은 컨테이너에 넣지 않은 낱개 상태로 CFS에 반입하며, 거기서 목적지별 혼재 적입이 이루어진다."},{"id":"ecd6d66e62","s":4,"n":"","q":"다음에서 자동차 전용 운송선의 특징을 설명한 것으로 적합하지 않은 것은?","o":["선창 내에 갑판 (Deck)의 수가 많다.","선창 및 갑판 사이에는 승강 장치와 램프로 연결되어 있다.","선수부에서 선미부에 이르는 좌, 우, 중앙의 3개 종격벽과 많은 횡격벽이 있다.","수선 하부의 면적이 넓어서 풍압력의 영향을 많이 받는다."],"a":2,"e":"선수미를 관통하는 3개 종격벽과 다수 횡격벽은 광석전용선의 구조적 특징이며, 자동차전용선은 차량 이동을 위해 격벽을 최소화한 다층 개방 갑판 구조다. 참고로 풍압은 수선 '상부' 면적이 넓어 크게 받는다."},{"id":"e935bb0a66","s":4,"n":"","q":"다음에서 운송인의 의무, 책임의 개시 장소를 말하는 것은?","o":["Place of Loading","Place of Discharge","Place of Receipt","Place of Delivery"],"a":2,"e":"운송인의 의무·책임은 화물을 수령하는 수취지(Place of Receipt)에서 개시되어 인도지(Place of Delivery)에서 종료된다."},{"id":"35b29f4d10","s":4,"n":"","q":"다음 중 운송인에 의해 화물이 인도되는 장소는?","o":["Place of Loading","Place of Discharge","Place of Receipt","Place of Delivery"],"a":3,"e":"인도지(Place of Delivery)는 운송인이 수하인에게 화물을 인도하고 운송책임이 종료되는 장소다."},{"id":"3358ded5d8","s":4,"n":"","q":"다음 이종책임체계에서 복합운송인이 항공운송구간에서는 무엇에 의해서 책임체계가 결정되는가?","o":["CIM 조약","Hague Rules","Warsaw Convention","CMR 조약"],"a":2,"e":"이종책임체계(Network Liability System)에서는 손해 발생 구간의 국제규범이 적용되므로 항공구간은 바르샤바 조약(Warsaw Convention) 계열이 규율한다. 해상은 Hague Rules, 도로는 CMR, 철도는 CIM이다."},{"id":"4a63aae079","s":4,"n":"","q":"이종책임체계(Network Liability System)에서 각 운송구간 고유의 원칙에 따른 책임규칙으로 적합하지 않은 것은?","o":["해상운송구간 - 헤이그규칙(Hague Rules)","항공운송구간 - 바르샤바조약(Warsaw Convention)","도로운송구간 - 도로화물운송조약(CMR) 또는 각국의 일반화물 자동차 운송약관","철도운송구간 - 에이그-비스비규칙(Hahue-Visby Rules)"],"a":3,"e":"이종책임체계에서 철도운송구간에는 국제철도물품운송조약(CIM)이 적용된다. 헤이그-비스비규칙은 해상운송 구간에 적용되는 규범이므로 철도구간 준거법으로 맞지 않는다."},{"id":"352b44dedf","s":4,"n":"","q":"다음중 화물운송과 직접적으로 관련 있는 국제규칙이 아닌 것은?","o":["The Warsaw Conventions, 1929","United Nations Convention on the Carriage of Goods by Sea, 1978","Revised American Foreign Trade Definitions, 1941","International Convention for the Unification of Certain Rules of Law Relating to Bills of Lading, 1924"],"a":2,"e":"Revised American Foreign Trade Definitions(1941)는 정형거래조건 해석규칙이며, 나머지는 각각 항공(바르샤바)·해상(함부르크 규칙)·선하증권(헤이그 규칙) 운송조약이다."},{"id":"d4fb1973e2","s":4,"n":"","q":"이종책임체계(Network Liability System)는 화주에 대하여 복합운송인이 전 운송구간에 걸쳐 책임을 부담하지만 손해발생 구간이 확인 된 경우 해상운송구간에서는 무엇에 의해 책임체계가 결정되는가?","o":["Warsaw Convention","CIM 조약","CMR 조약","Hague Rules"],"a":3,"e":"이종책임체계는 손해발생 구간이 확인되면 그 구간의 강행법규를 적용하므로, 해상구간은 Hague Rules(헤이그-비스비 규칙)에 따른다. Warsaw는 항공, CIM은 철도, CMR은 도로 구간에 적용된다."},{"id":"3358ded5d8","s":4,"n":"","q":"다음 이종책임체계에서 복합운송인이 항공운송구간에서는 무엇에 의해서 책임체계가 결정되는가?","o":["CIM 조약","Hague Rules","Warsaw Convention","CMR 조약"],"a":2,"e":"이종책임체계(Network Liability System)에서는 손해 발생 구간의 국제규범이 적용되므로 항공구간은 바르샤바 조약(Warsaw Convention) 계열이 규율한다. 해상은 Hague Rules, 도로는 CMR, 철도는 CIM이다."},{"id":"d28ce097a4","s":4,"n":"","q":"다음 중 운송서류의 정당한 수화인에 관한 설명으로 옳지 않은 것은?","o":["지시식 선하증권 중 \"to order\"로 발행된 경우 신용장 매입은행이 배서한 선하증권 원본 소지인","기명식 선하증권으로 발행된 경우 consignee란에 기재되어 있는 자","지시식 선하증권 중 \"to order of shipper\"로 발행된 경우 shipper가 배서한 선하증권 원본 소지인","지시식 선하증권 중 \"to the order of D bank\"로 발행된 경우 D은행이 지시한 자"],"a":0,"e":"\"to order\"만 기재된 B/L은 송화인 지시식이므로 정당한 수화인은 shipper가 배서한 원본 소지인이며, 매입은행의 배서가 기준이 되는 것은 \"to order of ○○ bank\"로 발행된 경우다."},{"id":"b42351ad3b","s":4,"n":"","q":"다음에서 복합운송증권과 통선하증권과의 차이를 설명한 것 중 올바른 것은?","o":["복합운송증권은 복합운송계약의 하청형태이고 통선하증권은 형태를 불문한다.","복합운송증권은 각 운송인 분할책임이고 통선하증권은 전구간 단일책임이다.","복합운송증권은 B/L 형식이나 통선하증권은 B/L 이외의 형식도 존재한다.","복합운송증권은 증권의 발행인으로 선박회사와 그 대리인이나 통선하증권은 운송주업자도 가능하다."],"a":0,"e":"통선하증권(Through B/L)은 하청운송 형태로 구간별 분할책임, B/L 형식, 선박회사와 그 대리인 발행에 한정되는 반면 복합운송증권(MTD)은 계약형태 불문, 전구간 단일책임, B/L 외 형식과 포워더 발행이 모두 가능하다."},{"id":"a4984ca57d","s":4,"n":"","q":"다음에서 해상화물운송장(Sea Waybill)에 대한 설명으로 부적합한 것은?","o":["권리증권이므로 항해 중에 증권을 이전함으로써, 물품의 전매나 담보가 가능하다.","해상화물운송장에 관한 규칙은 CMI uniform rules for Sea Waybill 1990 이다.","계약상품의 인도 또는 적재를 입증하는 비유가 증권 서류이다.","송화인에게 발행하는 서류이지만, 선하증권과 달리 운송품 인도청구권을 상징하지 않기 때문에 양도성이 없다."],"a":0,"e":"해상화물운송장(Sea Waybill)은 권리증권(document of title)이 아니어서 배서·교부로 전매나 담보 설정이 불가능하고, 기명 수화인이 신분 확인만으로 화물을 인도받는 비유통 증거서류다."},{"id":"c5ee224802","s":4,"n":"","q":"다음 중 UNCTAD/ICC 복합운송증권규칙에 대한 내용으로 옳지 않은 것은?","o":["단일운송 또는 복합운송의 여부와 무관하게 운송계약에 적용할 수 있다.","운송인의 반증책임을 전제로 한 과실책임원칙과 함께 변형통합책임체계를 채택하였다.","화물 인도 후 9개월 내에 소송이 제기되지 않으면 운송인은 모든 책임을 면한다.","운송인은 사용인의 항해과실 및 본선 관리상의 과실, 고의 또는 과실에 의한 화재가 아닌 경우 면책이지만 감항성 결여는 예외없이 귀책사유이다."],"a":3,"e":"UNCTAD/ICC 규칙에서 감항능력(seaworthiness)은 절대의무가 아니라 상당한 주의(due diligence)를 다하면 면책되는 사항이므로 예외 없는 귀책사유라는 서술은 틀리다. 소송제기 기간은 인도 후 9개월이다."},{"id":"d708e449e7","s":4,"n":"","q":"Hague Rules에서 적용대상에서 생동물을 제외시킨 이유로 올바르지 않은 것은?","o":["운송인이 운송을 인수하는 것을 기피한다.","생동물의 운송은 항해상 각종의 위험을 수반할 수 있다.","특약을 엄중하게 제한 하면 운임이 크게 오른다.","송화인에게 너무 편중된 이익을 초래한다."],"a":3,"e":"생동물(live animals)을 Hague Rules 적용에서 제외한 것은 항해상 특수 위험이 크고 특약을 제한하면 운임이 급등해 운송인이 인수를 기피하기 때문이다. 송화인에게 이익이 편중되기 때문이 아니다."},{"id":"941aaa0c74","s":4,"n":"","q":"정기선에 대한 일반적인 설명으로 옳지 않는 것은?","o":["부정기선보다 운임의 변동폭이 크다.","소량이고 다종 다양한 화물로 구성된다.","운항형태가 규칙적이고 반복적이다.","부정기선보다 운임이 저렴하다."],"a":0,"e":"정기선 운임은 태리프와 동맹 협정으로 안정적으로 유지되어 변동폭이 부정기선보다 작다. 소량·다종 화물 구성, 규칙적·반복적 운항은 옳으며, 개품 단위운임 수준 자체는 정기선이 오히려 높은 편이다."},{"id":"9d47d51d27","s":4,"n":"","q":"FIATA(International Federation of Freight Forwarder Association) 복합운송증권에 관한 설명으로 옳지 않은 것은?","o":["프레이트 포워더(Freight Forwarder)는 화주의 단독위험으로 화물을 보관할 수 있다.","FBL에 따르면, 화물의 손상, 멸실 등의 경우, 프레이트 포워더는 무과실을 입증하지 못하는 한 배상책임을 면할 수 없다.","해상운송이나 내수로운송이 포함되지 않은 국제복합운송의 경우, 프레이트 포워더의 책임은 멸실 또는 손상된 화물의 총중량 1kg당 8.33SDR(Special Drawing Rights)을 초과하지 않는 금액으로 제한된다.","프레이트 포워더의 총책임은 화물의 전손에 대한 책임한도를 초과한다."],"a":3,"e":"FIATA FBL상 포워더의 총책임은 화물 전손(total loss) 시의 책임한도를 초과할 수 없다. 무과실 입증책임, 해상·내수로 미포함 시 1kg당 8.33SDR 한도는 옳은 설명이다."},{"id":"fb1e314541","s":4,"n":"","q":"Forwarder가 발행하는 FIATA B/L 약관에 기재된 Forwarder의 책임한도액에 대한 설명 중 거리가 먼 것은?","o":["송화인이 화물의 성질, 화물가액을 포워더에 고지하고 종가운임을 지급하며, FIATA B/L상에 기재 시 신고가액이 한도액이 된다.","포워더의 인도지연으로 인한 손해발생 시 FIATA B/L에 의거한 복합운송계약상 운임의 2배상당액을 초과하지 않는다.","화물의 멸실, 손상에 대해 포장당 또는 단위당 SDR 666.67상당액 또는 총중량 kg당 SDR2 상당액 중 더 많은 금액을 초과하지 않는다.","포워더의 총책임은 화물의 전손에 대한 책임한도를 초과하지 않는다."],"a":2,"e":"'FIATA B/L상 포워더 책임한도와 거리가 먼 것' → 회사 정답은 포장·단위당 SDR 666.67 또는 kg당 SDR 2 중 고액을 서술한 ③이다. SDR 수치 지문이 나오면 ③으로 암기한다. ⚠[정답 논란] ③은 FBL 약관 문구와 그대로 일치하고 인도지연 한도는 '운임의 2배'가 아니라 운임 상당액이므로, 일반 이론상 거리가 먼 것은 ②다. 다만 채점은 회사 제공 정답 ③ 기준이므로 시험에서는 ③로 답할 것.","c":{"t":1,"n":"③은 FBL 약관 문구와 그대로 일치하고 인도지연 한도는 '운임의 2배'가 아니라 운임 상당액이므로, 일반 이론상 거리가 먼 것은 ②다."}},{"id":"dd769d2acc","s":4,"n":"","q":"복합운송인의 책임제한에 관한 설명으로 바람직하지 않은 것은?","o":["멸실/훼손된 물품의 포장 당 666.67 SDR 또는 1㎏당 2 SDR 중 큰 금액으로 제한","해상운송이나 내수로운송이 포함된 경우는 물품의 1㎏당 8.33 SDR로 제한","특정구간에서 책임이 발생되었을 때는 그 구간에 적용되는 국제조약 또는 해당국의 강행법이 정한 책임한도액에 따름","지연손해의 책임한도는 복합운송계약에 의한 운임을 초과하지 않는 금액으로 제한"],"a":1,"e":"해상 또는 내수로 운송이 포함되지 않은 경우에 1kg당 8.33 SDR이 적용된다. 해상·내수로가 포함되면 포장당 666.67 SDR 또는 1kg당 2 SDR 중 높은 금액이 한도가 된다."},{"id":"4ed7589a58","s":4,"n":"","q":"인도지연의 경우 복합운송인의 책임한도액에 대하여 서술한 것으로 적합하지 않은 것은?","o":["복합운송계약상의 운임총액을 상한으로 한다.","지연된 운송물에 대하여 지급되는 운임의 2.5배에 상당하는 금액으로 제한한다.","1978년 Hamburg Rule을 따른다.","지연과 일부 멸실, 훼손이 같이 발생할 경우는 해당 운송물의 전손(total loss)의 경우에 인정되는 한도액을 10% 초과한다."],"a":3,"e":"지연손해와 일부 멸실·훼손이 함께 발생하더라도 총 배상액은 해당 운송물 전손(total loss) 시 인정되는 한도액을 초과할 수 없다. 10% 초과 인정이라는 규정은 없다."},{"id":"fd8462e3c4","s":4,"n":"","q":"다음에서 선하증권통일조약의 배상한도액을 올바르게 짝지은 것은?","o":["Hague Rules 1924 - 30 pointcarề franc / kg당","Hague-Visby Rules, 1968 - 100 Sterling pound / 포장당","Hamburg Rules, 1978 - 666.67 SDR / 포장당","UN국제복합운송조약 1980 - 920 SDR / 포장당"],"a":3,"e":"UN국제복합운송조약(1980)은 포장당 920 SDR 또는 kg당 2.75 SDR을 한도로 한다. Hague 1924는 포장당 100파운드, Hague-Visby는 666.67 SDR/포장, Hamburg는 835 SDR/포장이다."},{"id":"d733bc3972","s":4,"n":"","q":"다음 중 주요국가의 운송인의 책임배상한도액을 비교한 것 중 올바르지 못한 것은?","o":["한국해상법 - 500 SDR / 포장당","미국 COGSA - US $ 500/ 포장장","중국 해상법 - 920 SDR / 포장당","독일, 프랑스 - VISBY Rules와 동일 (666.67 SDR)"],"a":2,"e":"중국 해상법의 책임한도는 Hague-Visby와 같은 포장당 666.67 SDR(또는 kg당 2 SDR)로, 920 SDR은 UN복합운송조약의 한도다. 한국 상법 500 SDR, 미국 COGSA USD 500은 옳다."},{"id":"7755985835","s":4,"n":"","q":"다음 중 선적서류에 해당되지 않는 것은?","o":["항공화물운송장","선하증권","선적계약서","포장명세서"],"a":2,"e":"선적계약서는 운송계약의 약정 문서일 뿐 대금결제·통관에 제시되는 선적서류(shipping documents)가 아니다. 선하증권(B/L), 항공화물운송장(AWB), 포장명세서(packing list)는 대표적 선적서류다."},{"id":"941aaa0c74","s":4,"n":"","q":"정기선에 대한 일반적인 설명으로 옳지 않는 것은?","o":["부정기선보다 운임의 변동폭이 크다.","소량이고 다종 다양한 화물로 구성된다.","운항형태가 규칙적이고 반복적이다.","부정기선보다 운임이 저렴하다."],"a":0,"e":"정기선 운임은 태리프와 동맹 협정으로 안정적으로 유지되어 변동폭이 부정기선보다 작다. 소량·다종 화물 구성, 규칙적·반복적 운항은 옳으며, 개품 단위운임 수준 자체는 정기선이 오히려 높은 편이다."},{"id":"e4b64f4a99","s":4,"n":"","q":"다음 중 정기선 운임시장의 특성으로 옳은 것은?","o":["운임율이 시장기능에 따라 변한다.","카르텔이 형성되어 있어 시장에의 진입이 상대적으로 어렵다.","선주의 시장통제능력이 크지 않다.","경쟁을 제한하는 제도적 장치가 전무하다."],"a":1,"e":"정기선 시장은 해운동맹·전략적 제휴 등 카르텔과 대규모 선대·조직 투자 부담 때문에 신규 진입이 상대적으로 어렵다. 시장기능에 따른 운임 변동과 선주 통제력 부재, 경쟁제한장치의 부재는 부정기선 시장의 특성이다."},{"id":"1460db1136","s":4,"n":"","q":"다음 중 선박의 운항비에 포함되지 않는 것은?","o":["도선료","연료비","검량비","일반관리비"],"a":3,"e":"일반관리비는 본사 조직 유지에 드는 간접비로 선박 단위 운항비에 들어가지 않는다. 도선료·연료비·검량비는 특정 항해에 직접 귀속되는 운항 관련 비용이다."},{"id":"e591895caf","s":4,"n":"","q":"정기선 운항 수입 중 부대 수입원의 종류가 아닌 것은?","o":["컨테이너 화물 작업장 사용료(CFS charge)","체화료(Demurrage)","지체료(Detention charge)","스페이스 사용료(charterage)"],"a":3,"e":"스페이스 사용료(charterage)는 선복 임대에서 생기는 대선 수입이다. 부대 수입은 CFS charge, 체화료(Demurrage), 지체료(Detention) 등 운송 부수 서비스에서 발생하는 수입이다."},{"id":"46ba7c7a60","s":4,"n":"","q":"다음에서 컨테이너선을 운영하면 절감되는 항목으로 해당되지 않는 것은?","o":["인건비","창고료","보험료","할증료"],"a":3,"e":"컨테이너 운송은 하역 인건비, 창고료, 포장비, 보험료를 절감시키지만 할증료(surcharge)는 유가·통화·체선 등 외부 요인에 따라 부과되는 운임 부가항목이므로 컨테이너화로 절감되는 비용이 아니다."},{"id":"35d05e78b5","s":4,"n":"","q":"다음의 부정기선 영업에 관한 내용을 서술한 것으로 적합하지 않은 것은?","o":["여러 척의 선박을 필요로 하지 않는다.","육상설비에 많은 투자를 할 필요가 없다.","자본 집약적 산업이고 공증운송인으로서의 역할을 한다.","비교적 간단하게 사업을 개시 또는 중지 할 수 있다."],"a":2,"e":"부정기선은 특정 화주와 개별 계약을 맺는 사적계약운송인(private/contract carrier)으로, 불특정 다수를 상대하는 공중운송인(common carrier)은 정기선사다. 소수 선박과 최소 육상설비로 진출입이 쉬운 것은 맞다."},{"id":"10908b1635","s":4,"n":"","q":"다음은 만재 흘수선에 대한 설명으로 적절한 것은?","o":["선박항해의 안전을 확보할 수 있는 상태에서 허락된 최대의 흘수를 말한다.","선체 높이의 일정 부분이 물에 잠기지 않도록 하여 예비 부력을 확보하는 것을 말한다.","선체의 수면에 잠겨 있는 깊이를 용골에서 수면까지의 높이를 말한다.","안벽계류, 운하통과 및 입거 등 선박 조정에 필요한 선체의 최대 높이를 말한다."],"a":0,"e":"만재흘수선(load line)은 항해 안전을 확보할 수 있는 범위에서 허용되는 최대 흘수, 즉 최소 건현에 대응하는 한계선이다. ②는 건현, ③은 흘수의 정의다."},{"id":"2e94ae04d6","s":4,"n":"","q":"컨테이너 선의 적부 계획을 수립하는데 가장 중요한 요소는?","o":["선박 운항의 안전성을 확보","선박 운항의 항로성을 확보","선박 운항의 경제성을 확보","선박 운항의 편리성을 확보"],"a":0,"e":"적부계획의 제1원칙은 복원성·종강도·고박 등 운항 안전성 확보이며, 경제성이나 하역 편의는 안전 한도 내에서 추구한다."},{"id":"737f79f869","s":4,"n":"","q":"컨테이너 터미널 시설에서 본선 입항 전에 계획된 선적 순서에 따라 슬롯에 컨테이너를 쌓아두는 곳은?","o":["에이프런","컨테이너 야드","마샬링 야드","컨테이너 프레이트 스테이션"],"a":2,"e":"마샬링 야드(marshalling yard)는 본선 입항 전 적부계획 순서대로 컨테이너를 슬롯에 대기시키는 곳이다. 에이프런은 안벽 하역공간, CFS는 LCL 혼재 장소."},{"id":"91c1e4f44e","s":4,"n":"","q":"항해용선계약에서 용선자가 선적 및 양륙의 하역 비용을 부담하고 선주는 항비를부담하는 것은?","o":["Gross Term","F.I.O. Charter","Lumpsum charter","Net Term"],"a":1,"e":"F.I.O.(Free In and Out)는 선적·양륙 하역비를 용선자가 부담하고 항비는 선주가 부담하는 조건이다."},{"id":"92612c99a3","s":4,"n":"","q":"부정기선에서 사용되는 일반적인 방식으로 선주가 모든 하역비 및 항비를 부담하는 것은?","o":["Gross Term","F.I.O. Charter","Lumpsum charter","Net Term"],"a":0,"e":"Gross Term(Berth Term)은 선주가 하역비와 항비를 모두 부담하는 부정기선의 일반적 조건이다."},{"id":"3b30691cad","s":4,"n":"","q":"용선자는 선박의 사용에 대한 총액의 운임을 지급하고 선박이 운송할 수 있는 화물의 최대 중량을 보증하는 것을?","o":["Gross Term","F.I.O. Charter","Lumpsum charter","Net Term"],"a":2,"e":"Lumpsum charter는 선복 사용에 대해 총액 운임을 지급하고 선주가 적재 가능한 최대 중량을 보증하는 방식이다."}]};
</script>
<script>
(function () {
  'use strict';

  const SHEETS = STUDY.sheets;
  const QS = STUDY.questions;
  const MARKS = ['①', '②', '③', '④', '⑤'];
  const EXAM_SIZE = 30;
  const PASS_SCORE = 80;
  const firstIndexById = new Map();
  QS.forEach((q, i) => { if (!firstIndexById.has(q.id)) firstIndexById.set(q.id, i); });
  // Each question appears once per sheet, and only in the first category sheet that lists it.
  // The "비슷하고 헷갈리는거" sheet is a hand-picked collection, so it keeps its copies of category-sheet questions.
  const COLLECTION_SHEET = SHEETS.findIndex((sh) => sh.name.includes('헷갈'));
  const sheetIndices = SHEETS.map(() => []);
  {
    const takenByCategory = new Set();
    const seen = SHEETS.map(() => new Set());
    QS.forEach((q, i) => {
      if (seen[q.s].has(q.id)) return;
      if (q.s !== COLLECTION_SHEET) {
        if (takenByCategory.has(q.id)) return;
        takenByCategory.add(q.id);
      }
      seen[q.s].add(q.id);
      sheetIndices[q.s].push(i);
    });
  }
  const keptIndex = sheetIndices.map((idx) => new Set(idx));
  const sheetIds = sheetIndices.map((idx) => [...new Set(idx.map((i) => QS[i].id))]);

  const I = {
