서비스선박회사 중에는 국내선사로서 한진해운, 현대해운 등이 있고, 외국선사는 APL, Sea-Land, BBS, Evergreen Line, Maersk 등이 있다.","한국에서 북미의 서해안항까지 해상운송되고 그 항구에서 철도에 환적된 다음 미국의 주요도시까지 철도운송된다."],"a":2,"e":"MLB(Mini Land Bridge)는 극동~미국 서안 해상운송 후 철도로 미 동안·걸프 항만까지 운송하는 항구간(port to port) 방식으로, 한진·현대 등 국내선사와 APL·Maersk 등 외국선사가 서비스한다. 유럽까지 잇는 다리 개념은 ALB, 내륙 도시까지는 IPI에 해당한다."},{"id":"319dfeaf01","s":1,"n":"310","q":"다음에서 Sea&Air 복합운송의 유용성에 대한 특성으로 알맞지 않은 것은?","o":["적정재고의 조절","적기선적의 운송수단","운송기회 및 시설부족지역의 운송수단","도난의 위험성이 많은 유럽 및 동남아시아지역으로의 해상운송의 대체운송수단"],"a":3,"e":"Sea&Air는 적정재고 조절, 적기선적, 항만·선복 부족지역 대체수단으로 유용하다. 도난 위험이 큰 지역은 중남미·아프리카 등이며 유럽·동남아를 도난 위험지역으로 든 것은 부적절하다."},{"id":"f8928868cc","s":1,"n":"311","q":"다음 중 해상운송을 통하여 화물을 보내는 것이 불안한 지역 또는 국가로 해당되지 않는 곳은?","o":["West Indies","Africa","North America","Latin America"],"a":2,"e":"West Indies, 아프리카, 중남미는 항만사정·치안·화물사고 위험이 커 해상운송이 불안한 지역으로 분류되지만, 북미(North America)는 항만·내륙 인프라가 안정된 지역이다."},{"id":"bff6858b24","s":1,"n":"312","q":"다음에서 매입신용장의 지급인이 아닌 것은?","o":["신용장 발행 은행","신용장발행은행의 본 지점","환거래은행","수출지의 은행"],"a":3,"e":"매입신용장의 지급인(drawee)은 개설은행 또는 그 본·지점, 환거래은행(correspondent bank)이 된다. 수출지 은행은 어음을 매입·추심하는 매입은행 지위이므로 지급인이 아니다."},{"id":"8de84a98aa","s":1,"n":"313","q":"다음 중 항만시설이 빈약하거나 Port Congestion이 심한 지역이 아닌 곳은?","o":["Venezuela","Iceland","Incheon","African Ports"],"a":2,"e":"Venezuela, Iceland, 아프리카 제항은 항만시설 빈약 또는 체선(port congestion)이 심한 지역으로 거론되나, 인천항은 컨테이너 처리시설이 갖춰진 정상 운영 항만이다."},{"id":"ff8422bf87","s":1,"n":"314","q":"다음에서 4면이 육지로 둘러 쌓여 있는 내륙국가로서 이웃나라의 항구를 이용하여 화물을 수입하는 국가가 아닌 국가는?","o":["Zambia","Iraq","Nigeria","Austria"],"a":1,"e":"'내륙국이 아닌 국가' → 회사 정답은 Iraq이다. Zambia·Austria를 내륙국으로 묶고 나머지 중 ②를 답으로 암기한다. ⚠[정답 논란] Iraq은 해안선이 극히 짧아 인접국 항만 의존국으로도 분류되는 반면 Nigeria는 라고스·아파파 등 자국 대형 항만을 갖춘 연안국이므로, 일반 이론상 정답은 ③이다. 다만 채점은 회사 제공 정답 ② 기준이므로 시험에서는 ②로 답할 것.","c":{"t":2,"n":"Iraq은 해안선이 극히 짧아 인접국 항만 의존국으로도 분류되는 반면 Nigeria는 라고스·아파파 등 자국 대형 항만을 갖춘 연안국이므로, 일반 이론상 정답은 ③이다."}},{"id":"3aaa85fa2c","s":1,"n":"315","q":"물건의 국제운송은 2개의 체약국간에 이루어지는 것을 필요하지 않는데 다음의 해상운송에 적용되지 않는 경우는?","o":["해상운송계약 중에 정해진 선적항이 체약국에 있을 때","선하증권 또는 해상운송계약을 증명하는 기타의 증권이 체약국에서 발행될 때","해상운송계약 중에 정해진 양하항이 체약국에 있을 때","해상운송계약 중에 정해진 선택양하항이 가상의 양하항이고 또 체약국에 없을 때"],"a":3,"e":"선적항·양하항이 체약국에 있거나 선하증권이 체약국에서 발행된 경우 조약이 적용된다. 선택양하항이 가상의 항이고 체약국에도 없는 경우는 적용 연결점이 없어 적용되지 않는다."},{"id":"3a99ad036f","s":1,"n":"316","q":"Sea & Air 복합운송서비스에서 Carrier형에 대한 설명으로 알맞은 것은?","o":["확실한 화물의 취급, 정확한 운송소요일수, 운송정보 등을 화주에게 제공하고 있다.","선사와 항공사의 일정한 스페이스를 연간계약으로 확보하고 양쪽의 운임에 자기의 서비스비용을 가산하여 통운임을 정한다.","중계지점으로부터 최종목적지까지를 자기회사소속 항공기만 이용하는 서비스 형태이다.","직접 화주에 판매하지 않고 주로 포워더에게 도매를 하는 점이 특징이다,"],"a":2,"e":"Carrier형은 항공사가 중계지에서 최종목적지까지 자사 항공기를 이용해 일관운송하는 형태다. 연간 스페이스 확보 후 통운임을 정하거나 포워더에게 도매하는 방식은 Forwarder형·Consolidator형의 특징이다."},{"id":"9d47d51d27","s":1,"n":"317","q":"FIATA(International Federation of Freight Forwarder Association) 복합운송증권에 관한 설명으로 옳지 않은 것은?","o":["프레이트 포워더(Freight Forwarder)는 화주의 단독위험으로 화물을 보관할 수 있다.","FBL에 따르면, 화물의 손상, 멸실 등의 경우, 프레이트 포워더는 무과실을 입증하지 못하는 한 배상책임을 면할 수 없다.","해상운송이나 내수로운송이 포함되지 않은 국제복합운송의 경우, 프레이트 포워더의 책임은 멸실 또는 손상된 화물의 총중량 1kg당 8.33SDR(Special Drawing Rights)을 초과하지 않는 금액으로 제한된다.","프레이트 포워더의 총책임은 화물의 전손에 대한 책임한도를 초과한다."],"a":3,"e":"FIATA FBL상 포워더의 총책임은 화물 전손(total loss) 시의 책임한도를 초과할 수 없다. 무과실 입증책임, 해상·내수로 미포함 시 1kg당 8.33SDR 한도는 옳은 설명이다."},{"id":"71953e073b","s":1,"n":"318","q":"합화물터미널사업의 등록을 한 자가 그 등록한 사항을 변경하고자 하는 경우에는 변경등록을 하여야 한다. 다음 중 복합화물터미널사업의 변경등록을 하지 않아도 되는 경미한 사항만으로 올바르게 묶인 것은 무엇인가?","o":["화물터미널의 부지면적을 10% 범위 내에서 변경하는 것, 화물터미널의 구조ㆍ설비를 변경하는 것, 영업소의 명칭ㆍ소재지를 변경하는 것, 공사기간을 변경하는 것","화물터미널의 부지면적을 10% 범위 내에서 변경하는 것, 화물터미널의 구조ㆍ설비를 변경하는 것, 영업소의 명칭ㆍ소재지를 변경하는 것","화물터미널의 부지면적을 20% 범위 내에서 감소시키는 것, 화물터미널의 구조ㆍ설비를 변경하는 것, 영업소의 명칭ㆍ소재지를 변경하는 것, 공사기간을 변경하는 것","화물터미널의 부지면적을 5% 범위 내에서 변경하는 것, 화물터미널의 구조ㆍ설비를 변경하는 것, 영업소의 명칭ㆍ소재지를 변경하는 것"],"a":1,"e":"경미한 변경사항은 부지면적 10% 범위 내 변경, 화물터미널 구조·설비 변경, 영업소 명칭·소재지 변경으로 변경등록이 면제된다. 공사기간 변경은 경미한 사항에 포함되지 않는다."},{"id":"176f308cf3","s":1,"n":"319","q":"다음에서 선하증권의 전자화와 관련한 설명으로 거리가 먼 것은?","o":["전자선하증권은 전자네고 구현을 위한 핵심기반이다.","1990년 전자선하증권에 관한 CMI 통일규칙이 제정되었다.","Bolero는 전자선하증권의 유통을 위해 Rule Book을 활용한다.","TradeCard는 전자선하증권 서비스를 세계 최초로 제공하였다."],"a":3,"e":"세계 최초의 전자선하증권 서비스는 Bolero(Rule Book 기반)이며, TradeCard는 무역대금결제·서류매칭 플랫폼이다. 1990년 CMI 전자선하증권 통일규칙 제정은 옳다."},{"id":"4171b8e9cb","s":1,"n":"320","q":"다음 중 복합운송의 특징에 속하지 않는 것은?","o":["두가지 이상의 서로 다른 운송수단에 의해 물품이 운송되어야 한다.","복합운송인이 전 구간 운송에 대해 주체로서 책임을 진다.","선박, 선적항 또는 양륙항과 관련하여 \"예정된\" 이라는 표시가 있는 복합운송서류는 수리할 수 있다.","복합운송서류는 반드시 물품이 본선에 적재된 후에 발급된다."],"a":3,"e":"복합운송증권은 운송인이 화물을 수탁(taking in charge)한 시점에 발행되므로 본선적재 후에만 발행되는 것은 아니다. 2가지 이상 운송수단, 전 구간 단일책임, \"예정된(intended)\" 표시 수리는 복합운송의 특징이다."},{"id":"21da7ef38f","s":1,"n":"321","q":"신용장에서 요구하는 B/L의 조건이 다음과 같을 경우 B/L의 Consignee란에 표시되는 내용 중 가장 정확한 것은? \"Full Set of Clean on Board Bills of Landing Made Out to Order of Korea XX Bank, Notify Applicant\"","o":["TO ORDER","APPLICANT","TO ORDER OF KOREA XX BANK","KOREA XX BANK"],"a":2,"e":"\"Made out to order of Korea XX Bank\"는 지시식 선하증권이므로 Consignee란에 \"TO ORDER OF KOREA XX BANK\"로 기재하고, 개설의뢰인(applicant)은 Notify Party에 기재한다."},{"id":"eb2f7665d1","s":1,"n":"322","q":"다음에서 Hague Rules에 관한 설명으로 옳지 않은 것은?","o":["운송인은 본선 선적개시 시부터 출항 시까지 선박의 내항성(Seaworthiness)에 대한 주의를 게을리 하지 말아야할 의무가 있다.","항해 또는 선박 자체의 취급에 대하여 선장이나 선원의 과실인 항해과실에 대하여는 운송인이 책임진다.","선박의 항해에 필요한 승조원을 배치하고 선박의 의장 및 필수품을 보급할 의무가 운송인에게 있다.","운송인은 물품의 선적, 적부, 운송, 보관 또는 양하가 적절하고 신중하게 행하여 지지 않아서 발생한 물품의 손해에 대하여 책임을 면할 수 없다."],"a":1,"e":"Hague Rules는 항해 및 선박관리상의 과실(nautical fault)에 대해 운송인을 면책한다. 감항능력 주의의무, 승조원 배치·의장 보급 의무, 상업과실(화물 취급 과실) 책임은 옳은 설명이다."},{"id":"d4fb1973e2","s":1,"n":"323","q":"이종책임체계(Network Liability System)는 화주에 대하여 복합운송인이 전 운송구간에 걸쳐 책임을 부담하지만 손해발생 구간이 확인 된 경우 해상운송구간에서는 무엇에 의해 책임체계가 결정되는가?","o":["Warsaw Convention","CIM 조약","CMR 조약","Hague Rules"],"a":3,"e":"이종책임체계는 손해발생 구간이 확인되면 그 구간의 강행법규를 적용하므로, 해상구간은 Hague Rules(헤이그-비스비 규칙)에 따른다. Warsaw는 항공, CIM은 철도, CMR은 도로 구간에 적용된다."},{"id":"1c6b323390","s":1,"n":"324","q":"다음에서 Hague Rule의 적용범위를 규정하고 있는 측면으로 해당되지 않는 것은?","o":["지리적 측면","인적 측면","내용적 측면","경제적 측면"],"a":3,"e":"Hague Rules의 적용범위는 지리적(선하증권 발행지 등), 인적(운송인·송화인 등 당사자), 내용적(운송계약·화물의 범위) 측면에서 규정되며 경제적 측면이라는 기준은 없다."},{"id":"0d2fd20229","s":1,"n":"325","q":"1980년 UN 국제복합운송조약에서 채택하고 있는 복합운송인의 책임제도는?","o":["Unifor Liability System","Modified Uniform Liability System","Tie-up System","Flexible Liability System"],"a":1,"e":"1980년 UN 국제복합운송조약은 원칙적으로 단일책임을 취하되 책임한도액 등에서 구간별 규정을 일부 인정하는 변형단일책임체계(Modified Uniform Liability System)를 채택하였다."},{"id":"9d155155a0","s":1,"n":"326","q":"다음 해상운송인의 책임을 규정한 선화증권에 대한 국제조약과 관련이 없는 것은?","o":["Hague Visby Rules","Harter Acts","Hamburg Rules","York Antwerp Reules"],"a":3,"e":"York-Antwerp Rules는 공동해손(general average) 정산에 관한 국제규칙으로 선하증권상 운송인 책임과 직접 관련이 없다. Hague-Visby, Harter Act, Hamburg Rules는 운송인 책임 관련 법규이다."},{"id":"b45a3aa220","s":1,"n":"327","q":"다음의 선하증권의 법정기재사항 중 중량 및 용적에 (weight or Measurement)에 관련된 내용과 관계가 적은 것은?","o":["개품운송계약의 운임산정기준은 중량톤 또는 용적톤 중 큰 쪽을 선택하도록 되어 있기 때문에 선하증권에 중량과 용적을 함께 기재하고 있다.","운송물의 중량과 용적은 포장물을 포함한 총중량과 총용적을 기재한다","선하증권에 기재된 중량은 수출입 실적의 기준이 된다","선하증권상의 중량은 송화인의 손해배상 책임의 기준이 된다."],"a":3,"e":"선하증권상 중량·용적은 운임산정(중량톤·용적톤 중 큰 쪽), 수출입 실적, 운송인의 책임한도 산정 기준이 된다. 송화인의 손해배상 책임 기준으로 기능하는 것이 아니다."},{"id":"6fedf2da13","s":1,"n":"328","q":"복합운송은 서로 다른 운송수단을 결합하여 운송하는 형태를 말하는데 다음 중 복합운송시스템으로 볼 수 없는 것은?","o":["피기백(Piggy-back)시스템","시앤에어(Sea-and-Air)운송시스템","랜드브리지(Land bridge)시스템","허브앤스포크(Hub-and-Spoke)운송시스템"],"a":3,"e":"Hub-and-Spoke는 중심 거점에 화물을 집중시켜 지선으로 배분하는 운송망 구성 전략으로, 이종 운송수단 결합인 복합운송시스템(Piggy-back, Sea&Air, Land Bridge)과 성격이 다르다."},{"id":"6aa3716632","s":1,"n":"329","q":"다음에서 선하증권의 유통의 효과를 설명한 것으로 관계가 먼 것은?","o":["물건의 인도 청구권의 이전","물건의 소유권의 이전","물건의 담보권의 이전","물건의 이익의 이전"],"a":3,"e":"선하증권의 유통(양도)은 화물 인도청구권, 소유권, 담보권의 이전 효과를 발생시킨다. \"이익의 이전\"은 증권 유통의 법적 효과로 인정되는 개념이 아니다."},{"id":"0e2805f1e1","s":1,"n":"330","q":"합운송주선업의 등록을 하고자 하는 자는 1억원 이상의 보증보험에 가입하여야 한다. 다음 중 보증보험 가입의 의무가 면제되는 경우로 가장 올바르게 묶인 것은?","o":["자본금이나 자산평가액이 10억원 이상인 경우, 금융기관에서 2억원 이상의 지급 보증을 받은 경우","자본금이나 자산평가액이 20억원 이상인 경우, 금융기관에서 1억원 이상의 지급 보증을 받은 경우","금융기관에서 15억원 이상의 지급 보증을 받은 경우, 3억원 이상의 화물배상책임보험에 가입한 경우","금융기관에서 1억원 이상의 지급 보증을 받은 경우, 자본금이나 자산평가액이 10억원 이상인 경우, 1억원 이상의 화물배상책임보험에 가입한 경우, 컨테이너 장치장을 소유하고 있는 경우"],"a":3,"e":"보증보험 가입의무는 금융기관의 1억원 이상 지급보증, 자본금·자산평가액 10억원 이상, 1억원 이상 화물배상책임보험 가입, 컨테이너 장치장 소유 등 대체 담보수단을 갖춘 경우에 면제된다."},{"id":"7f0b1cd9d4","s":1,"n":"331","q":"다음 중 복합운송(Multimodal Transport)방식에 적합한 정형무역 거래조건(Trade Terms)만으로 나열된 것은?","o":["CIP, DAF, FAS","CFR, CIP, FOB","CPT, FCA, CIP","FCA, CIF, CIP"],"a":2,"e":"FCA·CPT·CIP는 운송인에게 인도하는 조건으로 운송수단을 특정하지 않아 복합운송에 적합하다. FAS·FOB·CFR·CIF는 본선(선박)을 전제로 한 해상전용 조건이다."},{"id":"58ba554173","s":1,"n":"332","q":"다음 중 Hague Rules의 선하증권의 기재사항으로 관계가 없는 것은?","o":["주요한 화인(leading mark)","수화인의 신용정도","화물의 외관상 상태","각 경우에 따라 송화인이 서면으로 제출한 포장화물의 개수, 수량 또는 중량"],"a":1,"e":"Hague Rules상 선하증권 기재사항은 주요 화인(leading mark), 송화인이 서면 제출한 개수·수량·중량, 화물의 외관상 상태이다. 수화인의 신용정도는 기재사항이 아니다."},{"id":"a163648f5d","s":1,"n":"333","q":"다음 중 해상운송에서 선주가 선박의 편의치적(Flag ofConvenience)을 선호하는이유와 관계가 없는 것은?","o":["금융기관이 선박에 대한 권리행사가 용이하기 때문에 국제금융시장에서 자금조달이 용이하다.","선박의 운항 및 안전기준 등의 이행회피에 따르는 비용절감이 가능하다.","편의치적선으로 등록된 선박은 세계 각국의 항만에서의 입출항이 용이하다.","선박운항에 따른 재무상태, 거래내역을 정부에 보고하지 않는 등 선박운항에 따른 정부의 지도 감독회피가 가능하다."],"a":2,"e":"편의치적(flag of convenience)은 저렴한 세금·선원비, 안전·운항기준 회피, 정부 감독·보고 회피, 선박금융상 저당권 행사 용이 등을 이유로 선호된다. 각국 항만 입출항이 용이해지는 것은 아니며 오히려 항만국통제(PSC) 대상이 되기 쉽다."},{"id":"c079fdb67d","s":1,"n":"334","q":"신용장결제방식에 의한 국제화물운송의 경우에, 환적(Transhipment)에 대한 설명으로 옳지 않은 것은?","o":["환적은 화물의 훼손 및 멸실의 가능성이 있으므로 매수인의 경우 환적을 허용하기를 꺼 리게 된다.","복합운송이나 컨테이너 화물인 경우 환적에 대한 언급이 없는 경우 환적이 허용되는 것 으로 본다.","환적은 일반적으로 선적항에서 목적항까지의 운송과정에서 본선으로부터 양하 및 타선으 로의 재적재의 이적(移積)과정을 거치는 것을 말한다.","환적 금지조항이 있으면 해상운송 뿐만 아니라 복합운송 및 항공운송의 경우에도 환적은 당연히 금지된다."],"a":3,"e":"UCP상 컨테이너·복합운송 화물은 전 운송이 하나의 운송서류로 커버되면 환적 금지 문언이 있어도 환적을 표시한 서류가 수리될 수 있다. 따라서 금지조항이 모든 운송방식에 절대적으로 관철되지는 않는다."},{"id":"62805f610e","s":1,"n":"335","q":"다음 포워딩(Forwarding) 업무 중 LCL화물을 집화하여 FCL화물로 만드는 업무는?","o":["Projection","Combination","Consolidation","Packaging"],"a":2,"e":"여러 화주의 소량화물(LCL)을 CFS에서 모아 하나의 컨테이너 단위(FCL)로 만드는 업무를 혼재, 즉 Consolidation(groupage)이라 한다."},{"id":"dd213692f5","s":1,"n":"336","q":"다음 중 Hague Rules의 지리적 범위에 대한 설명으로 올바르지 않은 것은?","o":["제10조에 의거하면 Hague Rules는 체약국 내에서 발행되는 모든 선하증권에 적용된다.","비체약국간의 3국간 항로에도 선하증권이 발행되는 경우에는 Hague Rules가 적용된다.","Hague Rules는 입하 및 출하의 양쪽 적하품에만 적용된다.","선하증권은 통상의 경우 출발항에서 발생되므로 현실로는 체약국에서 떠나는 적하품 전부에 대하여 Hague Rules가 적용된다."],"a":2,"e":"Hague Rules는 체약국에서 발행된 선하증권에 적용되고 통상 선하증권은 선적항에서 발행되므로 사실상 체약국 출하화물(수출화물)에 적용된다. 입하·출하 양쪽 적하품에만 적용된다는 설명은 옳지 않다."},{"id":"d26fa2caf9","s":1,"n":"337","q":"다음 중 Freight Forwarder의 주요 업무에 해당하지 않는 것은?","o":["통관대행","운송관련 서류의 작성","운송의 수배","선박의 운항스케줄에 따른 배선"],"a":3,"e":"Freight Forwarder는 운송 수배, 서류 작성, 통관대행, 혼재, 보관 등을 수행하지만 자기 선박의 운항스케줄에 따른 배선(선복 배치)은 실제운송인인 선사의 업무이다."},{"id":"95025b808c","s":1,"n":"338","q":"다음 중 선하증권의 배서와 환어음의 배서의 차이점을 설명한 것으로 거리가 먼 것은?","o":["환어음은 일단 정당한 소지인에게 양도되면 권리나 양도인에 대한 개인적 항변에 침해받지 않기 때문에 피배서인의 권리가 배서인의 권리보다는 크다.","선하증권을 훔친 자나 정당한 권리를 갖지 못한 자로부터 양도받은 선의의 양수인이라 하더라도, 그 화물의 진정한 소유자에게 대항할 수 없기 때문에 피배서인이 배서인보다 더 큰 권리를 가질 수 없다.","선하증권은 정당한 권리자에 의해 양도되어야 한다.","환어음의 이면(裏面)이나 보전(補箋)에 기재하지 아니해도 효격이 있을 수 있다."],"a":3,"e":"환어음 배서는 어음의 이면 또는 보전(allonge)에 기재해야 효력이 있다. 반면 환어음 피배서인이 배서인보다 큰 권리를 가질 수 있는 점, 선하증권은 정당한 권리자로부터만 유효히 양도되는 점이 양자의 차이다."},{"id":"24e81898df","s":1,"n":"339","q":"극동아시아를 출항하여 파나마 운하를 경유해서 미국 동안(東岸) 또는 걸프만 지역의 항까지 해상운송한 후 그 곳에서 미국의 내륙지역(중계지 경유 포함)까지 철도나 트럭으로 복합운송하는 방식은?","o":["MLB(Mini-Land Bridge)","RIPI(Reversed Interior Point Intermodal)","MBS(Micro Bridge Service)","ALB(American Land Bridge)"],"a":1,"e":"극동에서 파나마운하를 경유해 미 동안·걸프항에 양하한 뒤 내륙으로 철도·트럭 운송하는 방식은 RIPI(Reversed Interior Point Intermodal)로, 서안 경유 IPI의 역방향 서비스이다."},{"id":"0287eecd68","s":1,"n":"340","q":"다음에서 TSCS(Trans Suberian Container Service)에 대한 설명으로 부적절한 것은?","o":["NVOCC가 소련구간에 대한 전소화물통과공단(SOTRA)과 TSCS 운송계약을 체결한다.","NVOCC는 각 운송구간별 운송주체자와 계약을 체결한 SOTRA와 총대리점계약을 체결하여 TSR서비스를 제공하고 있다","TSCS서비스는 철도대신 항공기로 Siberia를 횡단하는 Sea & Air 복합운송방식만을 채택하고 있다.","TRS의 운임체계는 독일의 PCT가 품목별무차별운임제도를 도입함으로써 단순화되었다"],"a":2,"e":"TSCS는 시베리아횡단철도(TSR)를 축으로 하는 Sea&Rail 복합운송이며, 항공기로 시베리아를 횡단하는 방식만 채택한다는 설명은 사실과 다르다. SOTRA와의 운송·총대리점계약, PCT의 품목무차별운임(FAK) 도입은 옳다."},{"id":"a7a1a2fb96","s":1,"n":"341","q":"다음에서 컨테이너 안의 화물 수량이 선하증권 상에 기재 된 내용과 달라 클레임이 제기될 경우를 대비하여 운송인이 이와 관련한 면책을 주장하기 위해 선하증권 상에 기재하는 문구는?","o":["Importer's Load & Count","Shipper's Load & Count","Consignee's Load & Count","Error and Omissions Excepted"],"a":1,"e":"화주가 직접 적입·검수한 FCL 컨테이너는 운송인이 내용물을 확인할 수 없으므로 \"Shipper's Load & Count(Shipper's Load, Stow and Count)\"를 부기해 수량·내용물 부지약관으로 면책을 주장한다."},{"id":"7709a73c58","s":1,"n":"342","q":"다음 중 수입상이 대금을 지급하기 전에 운송서류를 인도받으면서 그 운송서류를 제공한 은행에게 약정된 기일에 수입화물에 관한 대금결제를 서약한 보증서 성격의 서류는?","o":["Bill of Exchange","Letter of Indemnity","Commercial Invoice","Trust Receipt"],"a":3,"e":"수입상이 대금결제 전에 운송서류를 인도받으면서 화물의 소유권을 은행에 담보로 두고 약정기일 결제를 서약하는 보증서는 수입화물대도, 즉 Trust Receipt(T/R)이다."},{"id":"a77c16b275","s":1,"n":"343","q":"다음에서 선하증권에서 물건의 담보권 이전에 대한 설명으로 바람직한 것은?","o":["선하증권의 유통에 의하여 물건의 점유가 상징적으로 양수인에게 이전되고 물건이 인도되는 것을 말한다.","권리증권이 채권을 담보하려는 의사로서 채권자에게 배서, 인도된 경우에는 물건에 대한 담보권이 이전한다.","당사자의 의사에 따라 이전하는 것이므로 물건의 인도나 대금지급과 소유권의 이전과는 일단 관계가 없다","물건에 대한 이전의 의사를 어떻게 표시하느냐, 즉 권리증권의 배서, 인도행위 그 자체가 상관습상 소유권의 이전의사를 표시하는 것을 말한다."],"a":1,"e":"담보권 이전은 권리증권을 채권 담보의 의사로 채권자에게 배서·인도한 때 발생한다. ①은 인도청구권 이전, ③·④는 소유권 이전에 관한 설명이다."},{"id":"240eb74293","s":1,"n":"344","q":"다음 중 복합운송주선업협회에 관한 설명으로 옳지 않은 것은?","o":["복합운송주선업자ㆍ화물터미널사업자는 사업자협회를 전국 또는 특별시ㆍ광역시ㆍ도 단위로 설립할 수 있다.","복합운송주선업협회에 관하여 이 법에 규정한 것 외에는 민법 중 사단법인에 관한 규정을 준용한다.","협회를 설립하고자 하는 경우에는 당해 협회의 회원이 될 자격이 있는 자 5분의 1이상의 발기인이 정관을 작성하여 당해 협회의 회원이 될 자격이 있는 자의 과반수가 출석한 창립총회의 의결을 거쳐야 한다.","창립총회의 의결을 거친 후 건설교통부장관의 설립인가를 받아야 한다."],"a":2,"e":"민법상 사단법인 규정 준용과 장관 설립인가 등은 법정 내용과 일치하나, ③의 발기인 비율 및 창립총회 의결 정족수 기술은 법령상 요건과 달라 옳지 않다."},{"id":"938863c4de","s":1,"n":"345","q":"다음에서 Sea & Air 복합운송 중 Carrier형의 단점으로 알맞게 설명한 것은?","o":["Carrier형 서비스를 제공하는 항공회사는 자기회사의 항공운임에 해상운임을 가산한 전구간 일관운송운임을 정한다.","Carrier형 항공회사는 항공운송구간만을 커버하는 항공화물운송장을 발행한다.","복합운송서비스지역이 자기회사노선이 있는 지역으로 한정된다.","해상운송에 대해서는 Air Waybill면에 \"Conjunction Clause\"을 삽입함으로서 해상운송과 항공운송을 일관하여 인수하였음을 증명하고 계약한다,"],"a":2,"e":"Carrier형의 단점은 복합운송 서비스 가능지역이 해당 항공사의 자사 노선망 범위로 한정된다는 점이다. 전 구간 일관운임 설정, Conjunction Clause 삽입 등은 Carrier형의 장점·특징에 해당한다."},{"id":"8f2dd4ed6c","s":1,"n":"346","q":"다음에서 선적서류에 대한 설명 중 옳지 않은 것은?","o":["포장명세서에는 물품 명세, 단위별 중량, 화인, 일련번호 등이 기재된다.","항공화물운송장은 유가증권이다","상업송장은 대금청구서의 역할을 하고 있다.","적하목록은 선사(대리점)가 작성하는 적재화물의 명세표이다."],"a":1,"e":"항공화물운송장(Air Waybill)은 화물수취증 겸 운송계약 증거일 뿐 양도성 없는 비유통증권으로 유가증권이 아니다. 포장명세서·상업송장·적하목록에 대한 설명은 옳다."},{"id":"1904f5e9f8","s":1,"n":"347","q":"다음 중 선하증권을 다른사람에게 양도하기 위해 배서할 때 피배서인의 표시방법으로 해당되지 않는 것은?","o":["기명식","지시식","백지식","무기명식"],"a":3,"e":"선하증권 배서 시 피배서인 표시방법은 기명식(특정인 지정), 지시식(order), 백지식(무기명 blank)으로 구분된다. 백지식과 별개의 \"무기명식\"이라는 유형은 없다."},{"id":"2b8a8b15ef","s":1,"n":"348","q":"다음에서 극동아시아에서 유럽까지 시베리아 횡단 철도를 이용하는 복합운송 경로는?","o":["SLB","ALB","CLB","MLB"],"a":0,"e":"극동에서 러시아 극동항(보스토치니)까지 해상운송 후 시베리아횡단철도(TSR)로 유럽까지 연결하는 경로는 SLB(Siberian Land Bridge)이다. ALB는 미국대륙, CLB는 중국대륙 경유 경로이다."},{"id":"a337522596","s":1,"n":"349","q":"다음에서 선화증권 상 수화인에 대한 설명으로 올바르지 않는 것은?","o":["수화인에게는 운임 및 기타 요금의 지급의무 등이 있다.","목적지에서 선하증권을 제시하고 운송인에게 증권상에 기재된 화물의 인도를 청구할 수 있는 채권자이다.","수화인은 선하증권을 취득함으로써 증권상의 운송급부와 청구권을 취득한다","우리 나라 상법 및 Hamburg Rules도 선하증권의 임의 기재사항으로 규정하고 있다."],"a":3,"e":"선하증권상 수화인(consignee)은 우리 상법과 Hamburg Rules 모두 법정 기재사항으로 규정하고 있어 임의 기재사항이 아니다. 운임 지급의무, 인도청구권 취득 등은 옳은 설명이다."},{"id":"21a1a55df6","s":1,"n":"350","q":"다음 중 복합운송주선업에 대한 설명으로 적당하지 않은 것은?","o":["복합운송주선업은 2가지 이상의 운송수단을 이용하여 화물의 운송을 주선하는 사업이다.","복합운송주선업은 타인 소유의 자동차나 선박을 이용하여 화물을 운송하는 사업이다.","복합운송주선업은 자기의 명의와 타인의 계산으로 화물의 운송을 주선하는 사업이다.","복합운송주선업은 타인의 수요에 응하여 화물의 운송을 주선하는 사업이다."],"a":2,"e":"복합운송주선업(freight forwarding)은 타인의 수요에 응하여 자기의 명의와 자기의 계산으로 타인의 운송수단을 이용해 운송을 주선·인수하는 사업이다. 타인의 계산으로 한다는 설명은 단순 중개(brokerage)에 해당해 옳지 않다."},{"id":"bbc91ccb63","s":1,"n":"351","q":"다음 중 선하증권에 대한 설명으로 맞지 않은 것은?","o":["증권에 명시된 화물수취증이다.","운송의 법적 계약서이다.","운암계산서이다.","화물에 대한 권리를 입증한다."],"a":2,"e":"선하증권은 화물수취증(receipt), 운송계약의 증거(evidence of contract), 권리증권(document of title)의 3대 성질을 가진다. 운임을 계산·청구하는 운임계산서는 별개의 회계서류로 B/L의 기능이 아니다."},{"id":"af4c31bb97","s":1,"n":"352","q":"Hague Rules의 인적적용범위에 대한 설명으로 적합하지 않은 것은?","o":["Hague Rules는 한편에 있어서 해상물건운송계약에 의거하여 운송채무를 부담하는 선박소유인 또는 용선자에 대하여 적용된다.","Hague Rule는 송화인 및 선하증권 또는 이와 유사한 증권의 소지인에 대해서도 적용된다.","Hague Rules에서 운송인은 운송계약에 있어서 송화인의 상대방이 되는 선박소유자 및 용선자이다.","Hague Rules에서 운송인과 같은 이해관계인의 국적은 특정국가에만 적용된다."],"a":3,"e":"Hague Rules는 이해관계인의 국적이나 주소를 묻지 않고 체약국에서 발행된 선하증권에 적용되므로 특정 국가에 한정된다는 서술은 잘못이다. 적용 대상은 선박소유자·용선자인 운송인과 송화인, 증권 소지인이다."},{"id":"10a85fd2ae","s":1,"n":"353","q":"다음에서 Freight Forwarder의 기능 및 업무에 관한 설명으로 옳지 않은 것은?","o":["자체 운송 수단을 보유하지 않지만 집화, 분배, 혼재 등의 업무를 수행하는 운송의 주체 자로서의 기능을 수행한다","화주의 대리인으로서 적절한 운송수단을 선택하여 운송에 따르는 제반 업무를 처리해 주는 전통적인 운송주선 기능을 담당한다.","화주를 대신하여 적하보험 수배와 관련된 업무를 수행할 수 없다.","프레이트 포워더는 운송과 관련된 법적 책임 주체이다."],"a":2,"e":"프레이트 포워더는 화주의 대리인으로 적하보험(cargo insurance) 수배와 보험조건 조언까지 수행하는 것이 통상 업무이므로 이를 할 수 없다는 서술은 틀렸다."},{"id":"3521f2adf5","s":1,"n":"354","q":"극동의 주요 항만에서 북미 서안의 주요 항만까지 해상운송하며, 북미 서안에서 철도를 이용하여 미 대륙을 횡단하고, 북미 동부 또는 남부항에서 다시 대서양을 해상 운송으로 횡단하여 유럽지역 항만 또는 유럽 내륙까지 일관수송하는 복합운송경로는?","o":["MLB(Mini-Land Bridge)","RIPI(Reversed Interior Point Intermodal)","MBS(Micro Bridge Service)","ALB(American Land Bridge)"],"a":3,"e":"ALB(American Land Bridge)는 극동→북미 서안 해상운송, 대륙횡단 철도, 동안·걸프항에서 대서양 해상운송으로 유럽까지 잇는 경로다. MLB·MBS는 미국 내에서 종료되고 RIPI는 역내륙 배송이다."},{"id":"1ead874167","s":1,"n":"355","q":"다음 선하증권에 기재되는 중량 및 용적은 다음 어느 서류의 기재내용과 일치해야 하나?","o":["운항준비서","용적·중량증명서","인도지시서","하도지시서"],"a":1,"e":"B/L의 중량·용적은 검량인이 발행하는 용적·중량증명서(Certificate and List of Measurement and/or Weight) 기재와 일치해야 하며, 이 수치가 운임 산정과 클레임의 기준이 된다."},{"id":"2cea3ce508","s":1,"n":"356","q":"다음 중 수입화물이 선하증권보다 먼저 목적항에 도착하여 통관이 지연되어 화물의 변질, 보관료 증가, 판매기회의 상실 등의 부담이 발생할 우려가 있을 때 이러한 불편을 해소하기 위하여 수화인이 사용할 수 있는 서류는?","o":["D/O(Delivery Order)","T/S(Tally Sheet)","L/G(Letter of Guarantee)","T/R(Trust Receipt)"],"a":2,"e":"B/L 미착 시 수화인은 은행 연대의 수입화물선취보증장(L/G, Letter of Guarantee)을 선사에 제출해 화물을 먼저 인도받는다. D/O는 화물인도지시서, T/R은 수입담보화물대도, T/S는 검수표다."},{"id":"40fc42fed8","s":1,"n":"357","q":"다음 중 Container B/L의 경우 운송물 수취지로 기재되는 장소가 될 수 없는 곳은?","o":["CY(Con- tainer Yard)","CFS(Container Freight Station)","RFS(Rail Freight Station","Port of Loading"],"a":3,"e":"컨테이너 B/L의 수취지(place of receipt)에는 CY·CFS·RFS 등 내륙 인수지점이 기재된다. 선적항(port of loading)은 본선 선적 장소로 별도 기재란이며 운송물 수취지가 될 수 없다."},{"id":"a0f5de70a5","s":1,"n":"358","q":"다음 중 해상운송에서 사용되는 C/P(Charter Party)라는 용어와 밀접한 관련이 있는 것은?","o":["Shipping conference","Liner vessel","Tramper","Tariff rate"],"a":2,"e":"용선계약서(C/P, Charter Party)는 부정기선(tramper) 운송의 기본 계약서다. 정기선(liner)은 개별 운송계약과 공표운임률(tariff)·해운동맹(conference) 체제로 운영된다."},{"id":"103997048c","s":1,"n":"359","q":"다음 중 화주가 프레이트 포워더에게 화물의 멸실ㆍ훼손에 관한 클레임을 청구할 때 제출하는 서류가 아닌 것은?","o":["Claim Letter","B/L Copy","Survey Report","Cargo Insurance Policy"],"a":3,"e":"적하보험증권은 화주가 보험자에게 보험금을 청구할 때 쓰는 서류이고, 포워더 상대 클레임에는 클레임 통지서, B/L 사본, 검정보고서(survey report) 등 손해 입증 서류를 제출한다."},{"id":"f42f7d14d9","s":1,"n":"360","q":"다음에서 무신용장거래의 경우 매수인에 대한 설명으로 올바른 것은?","o":["매수인은 매도인 앞으로 일람출급의 환어음을 발행한다.","매수인은 환어음과 선하증권에 백지배서한다.","매수인은 백지배서된 지시식 선하증권을 가지고 있으므로 선하증권의 소지인이 된다.","매수인이 운송인에게 물건을 인도하고 운송인은 매수인의 지시식으로 선하증권을 발행한다."],"a":2,"e":"무신용장거래(D/P·D/A)에서 매수인은 매도인이 백지배서한 지시식 B/L을 취득해 증권 소지인이 된다. 환어음 발행과 백지배서, 운송물 인도는 모두 매도인(수출자)의 행위다."},{"id":"6587aeb01a","s":1,"n":"361","q":"다음 중 화물자동차와 철도가 결합되어 운송되는 복합운송방식은?","o":["피기백 방식(Piggy back system)","피쉬백 방식(Fishy back system)","버디백 방식(Birdy back system)","랜드 브리지 방식(Land bridge system)"],"a":0,"e":"피기백(piggyback)은 트레일러·컨테이너를 화차에 실어 운송하는 도로+철도 결합 방식이다. 피시백은 도로+해상, 버디백은 도로+항공, 랜드브리지는 대륙횡단 철도 연계다."},{"id":"e35a103cf7","s":1,"n":"362","q":"다음에서 선하증권의 기재사항 중 우리나라 상법 상 임의 기재사항은?","o":["선장명, 선박톤수","본선항해번호, 환율","운송물의 종류, 중량 또는 용적","선적항, 양륙항"],"a":1,"e":"본선항해번호(voyage no.)나 환율은 실무 편의상 적는 임의기재사항이다. 상법 제853조는 선박 명칭·국적·톤수, 선장명, 운송물의 종류·중량·용적, 선적항·양륙항, 운임 등을 법정기재사항으로 정한다."},{"id":"43abab33f4","s":1,"n":"363","q":"다음 중 선하증권 법정기재사항에서 포장의 종류및 개수에 대한 설명으로 관계가 없는 것은?","o":["송화인의 운송물이 손상·멸실되거나 과부족 등이 발생할 때에 운송인에게 손해배상을 청구하는데 선하증권에 기재된 운송물의 개수가 산정기준이 된다.","Hague Rules는 송화인이 당해 화물의 가격을 신고하고, 선하증권에 기재한 경우에는 그 화물이 손상 또는 멸실하였을 때 그 신고가격이 운송인의 손해배상 한도액이다.","선하증권에 container내에 적입된 물건의 포장단위가 기재되지 않고 container단위만 기재되어 있는 경우 각 container가 포장(package)의 단위로 간주된다.","선하증권에 container에 적입된 포장의 개수가 기재되어 있는 경우 container내에 적입된 포장의 개수는 일괄적으로 전체를 하나의 포장의 수로 취급된다."],"a":3,"e":"컨테이너 내부 포장 개수가 B/L에 기재되어 있으면 그 개수가 포장(package) 단위로 인정되어 책임제한액 산정 기준이 된다. 개수 기재를 무시하고 전체를 하나로 보는 것은 잘못이다."},{"id":"461dc9e356","s":1,"n":"364","q":"다음에서 Sea & Air 복합운송에 대한 설명으로 올바른 것은?","o":["출발지로부터 중계지까지는 항공운송되고 거기에서 최종목적지까지는 해상으로 운송되는 복합운송형태이다.","최초에는 한국, 일본을 비롯한 극동지역으로부터 OCP화물이 영국 및 유럽항구에 도착한 후 북미내륙 OCP Area로 항공운송되는 형태이었다.","해상운송의 저렴성과 항공운송의 신속성이라는 장점을 결합한 방식이다.","주로 Micro Bridge Service(MBS)의 경로에 주로 채택된 운송수단방식이다."],"a":2,"e":"Sea & Air는 해상운송의 저운임과 항공운송의 신속성을 결합한 방식이다. 통상 극동에서 중계지까지 해상, 이후 최종 목적지까지 항공으로 운송되므로 순서를 뒤바꾼 서술은 틀리다."},{"id":"e7ae4726b7","s":1,"n":"365","q":"복합운송주선업의 승계 중 상속 신고시에 첨부해야 하는 서류로 올바르지 못한 것은 어느 것인가?","o":["신고인인 상속인과 피상속인의 관계를 증명하는 서류","신고인과 동 순위의 다른 상속인이 있는 경우 그의 동의서","피상속인의 사망 증명 서류.","상속인의 거주지를 관할하는 시장ㆍ군수 또는 구청장의 동의서"],"a":3,"e":"상속에 의한 승계 신고에는 상속관계 증명서류, 피상속인의 사망 증명서류, 동순위 상속인의 동의서가 필요하다. 시장·군수·구청장의 동의서는 요구되지 않는다."},{"id":"05a740edc4","s":1,"n":"366","q":"장금복합운송은 부산항에서 미국의 네브라스카, 사우드타코타, 시카고 등 록키산맥 동부 내륙까지의 복합운송에 전문화 된 기업이다. 이 기업이 주로 이용하는 국제복합운송경로는?","o":["CLB","IPI","ALB","SLB"],"a":1,"e":"IPI(Interior Point Intermodal)는 북미 서안 양륙 후 철도·트럭으로 록키 동부의 내륙 도시(시카고, 네브래스카 등)까지 일관운송하는 경로다. ALB·CLB·SLB는 대륙횡단 브리지 방식이다."},{"id":"36fcab1778","s":1,"n":"367","q":"다음의 예는 선화증권의 배서방식 중 어는 것을 말하는가? Deliver to . . . Co., Ltd Tigers Trading Co., Ltd. (signed) ---------- Manger","o":["기명식","지시식","백지식","선택무기명식"],"a":0,"e":"피배서인(\"Deliver to ○○ Co., Ltd\")이 특정되어 있고 배서인이 서명한 형태는 기명식 배서(full/special endorsement)다. 지시식은 to order of ~, 백지식은 피배서인 없이 서명만 한다."},{"id":"efbe3a3ca4","s":1,"n":"368","q":"다음은 복합운송서비스와 관련된 설명으로 옳지 않은 것은?","o":["선사가 발행하는 것을 Master B/L, 복합운송업자가 발행하는 것을 House B/L이라 한다.","복합운송의 대표적인 형태가 Sea & Air 방식이며, 각종 Land Bridge 방식도 이의 일종이다.","국제복합운송은 이른 바 “Door to Door Service”를 지향하는 것으로 복합운송업자는 하주에 대해 전운송구간에 대한 일괄책임을 진다.","복합운송서류는 전복합운송구간의 단일책임을 강화하기 위하여 원칙적으로 선박을 보유한 복합운송업자만이 발행할 수 있다."],"a":3,"e":"복합운송증권(MTD)은 선박 보유와 무관하게 NVOCC·포워더도 발행할 수 있으며, 실제로 House B/L이 그 예다. 선박 보유자만 발행 가능하다는 제한은 존재하지 않는다."},{"id":"0f62a49f0f","s":1,"n":"369","q":"다음 중 미국서안에서 철도 등의 내륙운송을 거쳐 미국 동안 또는 걸프지역 항만까지 수송하는 해륙복합운송의 형태는?","o":["Interior Point Intermodal","Mini Land Bridge","Micro Land Bridge","America Land Bridge"],"a":1,"e":"MLB(Mini Land Bridge)는 북미 서안 양륙 후 대륙횡단 철도로 동안·걸프 항만까지 잇는 해륙복합운송이다. ALB는 유럽까지 연장되고, IPI·MLB(Micro)는 내륙 지점이 종착지다."},{"id":"c07cedd36e","s":1,"n":"370","q":"다음에서 외관상 운송품의 상태에 대한 선하증권상의 기재에 대한 설명으로 옳지 않은 것은?","o":["선적선하증권(On Board B/L)의 경우에는 선적에서 양륙항까지 운송인이 책임을 진다.","운송인이 선적 또는 수취할 때 외관상으로 점검하여 이상이 없으면 그 책임을 지지 않는다.","수치선하증권(Received B/L)의 경우에는 수취에서 인도 이전까지의 화물의 사고 발생에 대해 운송인이 책임을 진다.","본선수취증(mate's receipt)에 고장적요가 있는 경우에는 운송인에게 책임이 없다는 취지를 표시하기 위해 선하증권에도 고장적요가 기재된다."],"a":2,"e":"수취선하증권(Received B/L)이라도 운송인의 책임은 화물 수취 시부터 수화인에게 실제 인도할 때까지 존속하므로 \"인도 이전까지\"로 한정한 서술은 옳지 않다. 선적 여부는 책임기간의 종기와 무관하다."},{"id":"da415e46a2","s":1,"n":"371","q":"다음에서 복합운송방식을 성립시키는 기본요건에 해당되지 않는 것은?","o":["단일운임 적용","단일증권 발행","단일책임 체계","도로운송과 철도운송 간의 연계운송"],"a":3,"e":"복합운송의 기본요건은 단일운임(through rate), 단일증권(MTD), 단일책임(single carrier liability)과 서로 다른 두 종류 이상 운송수단의 결합이다. 도로·철도 연계 자체는 요건이 아니라 한 예시일 뿐이다."},{"id":"8b47e839c0","s":1,"n":"372","q":"다음 중 운송화물이 선박에 적재되었음을 증명하며, 적재된 화물을 목적지에서 수화인에게 인도할 것을 약정하여 선박회사가 발행하는 유가증권으로 옳은 것은?","o":["해상화물운송장(Sea Waybill)","수입화물선취보증장(Letter of Guarantee)","신용장 (Letter of Credit)","선하증권(Bill of Lading)"],"a":3,"e":"본선 적재 사실을 증명하고 목적항에서 수화인에게 인도를 약정하는 선박회사 발행 유가증권은 선하증권(B/L)이다. Sea Waybill은 비유통 증거서류, L/G는 보증장, L/C는 대금지급 확약서다."},{"id":"14b0b2fa6a","s":1,"n":"373","q":"다음 Hague Rules에서의 인적적용범위에서 이해관계인에 대한 설명으로 적절한 것은?","o":["운송인은 해상운송계약의 전부를 이행하는 자로 계약운송인으로부터 위탁받아 현실로 운송행위를 하는 자를 말한다.","수화인은 계약운송인과 해상운송계약을 체결하는 자를 말한다.","계약운송인은 송화인과 해상운송계약을 체결한 자를 말한다.","운송취급인은 물건을 인도를 받을 권리를 가진 자를 말한다."],"a":2,"e":"계약운송인(contracting carrier)은 송화인과 직접 해상운송계약을 체결한 자이며, 실제 운송을 수행하는 자는 실제운송인(actual carrier), 인도청구권자는 수화인이다."},{"id":"ae390cb5de","s":1,"n":"374","q":"다음은 운송과 관련된 국제조약으로 조약과 관련된 운송수단으로 바르게 연결된 것은? 가. Hamburg Rules 1978 나. UNCTAD/ICC Rules 1992 다. Motreal Convention 1999","o":["항공운송 - 해상운송 - 복합운송","도로운송 - 항공운송 - 해상운송","해상운송 - 복합운송 - 도로운송","해상운송 - 복합운송 - 항공운송"],"a":3,"e":"Hamburg Rules 1978은 해상운송, UNCTAD/ICC Rules 1992는 복합운송증권, Montreal Convention 1999는 국제항공운송에 관한 규범이다. 도로운송은 CMR, 철도는 CIM/COTIF가 규율한다."},{"id":"b587ac0ec6","s":1,"n":"375","q":"다음에서 수취선하증권(Received B/L) 상의 선박의 명칭에 관련 된 설명으로 올바르지 않은 것은?","o":["수취선하증권상의 선박명란에 선적 예정인 선박명을 기재한다.","선박명란에 선박명과 함께 \"or subsequent vessel\"이라고 기재하여 발행한다.","선박의 명칭을 \"intended vessel name\"으로 기재해도 수리한다고 규정하고 있다.","운송인이 운송물을 실제로 선박에 선적한 후 발행되므로 선하증권에 선박명칭이 기재된다."],"a":3,"e":"실제 선적 후 발행되어 본선명이 확정 기재되는 것은 선적선하증권(Shipped/On Board B/L)이다. 수취선하증권은 선적 전 발행되어 예정 선박명이나 \"intended vessel\", \"or subsequent vessel\"로 기재된다."},{"id":"78682fa9af","s":1,"n":"376","q":"다음에서 운송물의 멸실, 훼손, 지연 손해가 복합운송의 어느 구간에서 발생하였는가를 묻지않고 복합운송인은 동일한 기준에 따라 책임을 지는 체계는?","o":["분할책임체계","변형단일책임체계","단일책임체계","절충형책임체계"],"a":2,"e":"손해 발생 구간을 따지지 않고 복합운송인이 동일한 기준으로 책임지는 것이 단일책임체계(Uniform Liability System)다. 구간별 준거법을 따르는 것은 이종책임체계(Network System)다."},{"id":"2db83b0429","s":1,"n":"377","q":"다음 중 무신용장 거래와 신용장 거래의 경우의 차이점으로 적당한 것은?","o":["원칙적으로 무신용장거래와 신용장거래는 별 차이가 없다.","매도인은 환어음과 선하증권에 백지배서한다.","환어음 및 선적서류를 제시받는 수출지의 은행이 지급·인수·매입 또는 연지급을 한다.","매도인이 운송인에게 물건을 인도하고 운송인은 매도인의 지시식으로 선하증권을 발행한다."],"a":2,"e":"신용장거래에서는 매입·지급·인수·연지급을 수출지 지정은행이 담당해 대금회수가 보장되는 반면, 무신용장거래(D/P·D/A)는 은행의 지급확약이 없어 매도인이 신용위험을 부담한다."},{"id":"17d5d43948","s":1,"n":"378","q":"다음에서 항공화물 혼재업자(consoliator)의 역할에 관한 설명 중 틀린 것은?","o":["Unifor Liability System","Network Liability System","Tie-up System","Flexible Liability System"],"a":3,"e":"복합운송 책임체계는 단일책임(Uniform), 이종책임(Network), 절충형(Tie-up/변형단일)으로 구분되며 Flexible Liability System은 존재하지 않는 개념이다."},{"id":"c43beaafe4","s":1,"n":"379","q":"해상운송에서 선박회사가 선적된 화물을 확인한 후 화물에 이상이 있는 경우 사고부 선하증권(Dirty B/L)울 발행하는데 이를 은행이 매입하지 않으므로 수출상은 선박회사에 무엇을 제출하면 Clean B/L을 발행 받을 수 있는가?","o":["L/I(Letter of Indemnity)","T/R(Trust Receipt)","L/G(Letter of Guarantee)","Shipped B/L"],"a":0,"e":"사고부 B/L(Foul/Dirty B/L)은 은행이 매입하지 않으므로 수출상은 파손화물보상장(L/I, Letter of Indemnity)을 선사에 제출해 무고장 B/L(Clean B/L)을 받는다. L/G는 수입자가 쓰는 화물선취보증장이다."},{"id":"2e8eccbb9b","s":1,"n":"380","q":"실제적으로 선하증권의 송화인(shipper)란에는 운송곙약자가 제시한 서류에 의거하요 기입되는 내용이 아닌 것은?","o":["운송계약의 당사자가 아닌 제3자의 성명","신용장상의 수익자","수입업자의 대리인","지급은행의 대리인"],"a":3,"e":"B/L의 shipper란에는 신용장상 수익자, 실제 수출자, 수입업자의 대리인, 나아가 운송계약 당사자가 아닌 제3자도 기재될 수 있으나 대금결제기관인 지급은행의 대리인은 기재 대상이 아니다."},{"id":"a4984ca57d","s":1,"n":"381","q":"다음에서 해상화물운송장(Sea Waybill)에 대한 설명으로 부적합한 것은?","o":["권리증권이므로 항해 중에 증권을 이전함으로써, 물품의 전매나 담보가 가능하다.","해상화물운송장에 관한 규칙은 CMI uniform rules for Sea Waybill 1990 이다.","계약상품의 인도 또는 적재를 입증하는 비유가 증권 서류이다.","송화인에게 발행하는 서류이지만, 선하증권과 달리 운송품 인도청구권을 상징하지 않기 때문에 양도성이 없다."],"a":0,"e":"해상화물운송장(Sea Waybill)은 권리증권(document of title)이 아니어서 배서·교부로 전매나 담보 설정이 불가능하고, 기명 수화인이 신분 확인만으로 화물을 인도받는 비유통 증거서류다."},{"id":"c5ee224802","s":1,"n":"382","q":"다음 중 UNCTAD/ICC 복합운송증권규칙에 대한 내용으로 옳지 않은 것은?","o":["단일운송 또는 복합운송의 여부와 무관하게 운송계약에 적용할 수 있다.","운송인의 반증책임을 전제로 한 과실책임원칙과 함께 변형통합책임체계를 채택하였다.","화물 인도 후 9개월 내에 소송이 제기되지 않으면 운송인은 모든 책임을 면한다.","운송인은 사용인의 항해과실 및 본선 관리상의 과실, 고의 또는 과실에 의한 화재가 아닌 경우 면책이지만 감항성 결여는 예외없이 귀책사유이다."],"a":3,"e":"UNCTAD/ICC 규칙에서 감항능력(seaworthiness)은 절대의무가 아니라 상당한 주의(due diligence)를 다하면 면책되는 사항이므로 예외 없는 귀책사유라는 서술은 틀리다. 소송제기 기간은 인도 후 9개월이다."},{"id":"d708e449e7","s":1,"n":"383","q":"Hague Rules에서 적용대상에서 생동물을 제외시킨 이유로 올바르지 않은 것은?","o":["운송인이 운송을 인수하는 것을 기피한다.","생동물의 운송은 항해상 각종의 위험을 수반할 수 있다.","특약을 엄중하게 제한 하면 운임이 크게 오른다.","송화인에게 너무 편중된 이익을 초래한다."],"a":3,"e":"생동물(live animals)을 Hague Rules 적용에서 제외한 것은 항해상 특수 위험이 크고 특약을 제한하면 운임이 급등해 운송인이 인수를 기피하기 때문이다. 송화인에게 이익이 편중되기 때문이 아니다."},{"id":"4740d36ba9","s":1,"n":"384","q":"국내 상법상 선하증권의 기재사항 중 법정기재사항이 아닌 것은?","o":["선박의 명칭","송하인의 성명","면책종항","운임"],"a":2,"e":"면책약관(exemption clause)은 당사자 합의로 넣는 임의기재사항이다. 상법상 법정기재사항에는 선박의 명칭·국적·톤수, 송하인·수하인, 운송물 명세, 선적항·양륙항, 운임, 발행지·발행일 등이 포함된다."},{"id":"3358ded5d8","s":1,"n":"385","q":"다음 이종책임체계에서 복합운송인이 항공운송구간에서는 무엇에 의해서 책임체계가 결정되는가?","o":["CIM 조약","Hague Rules","Warsaw Convention","CMR 조약"],"a":2,"e":"이종책임체계(Network Liability System)에서는 손해 발생 구간의 국제규범이 적용되므로 항공구간은 바르샤바 조약(Warsaw Convention) 계열이 규율한다. 해상은 Hague Rules, 도로는 CMR, 철도는 CIM이다."},{"id":"e21da133ef","s":1,"n":"386","q":"다음 신용장의 종류에서 수출지의 은행이 지급인 및 인수인이 되는 것이 통례인 것은?","o":["매입신용장(negotiation credit)","연지급신용장(deferred payment credit)","지급신용장(payment credit)","확인신용장(confirmed credit)"],"a":1,"e":"'수출지 은행이 지급인 및 인수인이 되는 신용장' → 회사 정답은 연지급신용장(deferred payment credit)이다. 보기 ②로 고정해 암기한다. ⚠[정답 논란] 환어음의 지급인·인수인이 수출지 지정은행이 되는 것은 지급신용장(payment credit)이고 연지급신용장은 환어음을 발행하지 않으므로, 일반 이론상 정답은 ③이다. 다만 채점은 회사 제공 정답 ② 기준이므로 시험에서는 ②로 답할 것.","c":{"t":2,"n":"환어음의 지급인·인수인이 수출지 지정은행이 되는 것은 지급신용장(payment credit)이고 연지급신용장은 환어음을 발행하지 않으므로, 일반 이론상 정답은 ③이다."}},{"id":"d28ce097a4","s":1,"n":"387","q":"다음 중 운송서류의 정당한 수화인에 관한 설명으로 옳지 않은 것은?","o":["지시식 선하증권 중 \"to order\"로 발행된 경우 신용장 매입은행이 배서한 선하증권 원본 소지인","기명식 선하증권으로 발행된 경우 consignee란에 기재되어 있는 자","지시식 선하증권 중 \"to order of shipper\"로 발행된 경우 shipper가 배서한 선하증권 원본 소지인","지시식 선하증권 중 \"to the order of D bank\"로 발행된 경우 D은행이 지시한 자"],"a":0,"e":"\"to order\"만 기재된 B/L은 송화인 지시식이므로 정당한 수화인은 shipper가 배서한 원본 소지인이며, 매입은행의 배서가 기준이 되는 것은 \"to order of ○○ bank\"로 발행된 경우다."},{"id":"b42351ad3b","s":1,"n":"388","q":"다음에서 복합운송증권과 통선하증권과의 차이를 설명한 것 중 올바른 것은?","o":["복합운송증권은 복합운송계약의 하청형태이고 통선하증권은 형태를 불문한다.","복합운송증권은 각 운송인 분할책임이고 통선하증권은 전구간 단일책임이다.","복합운송증권은 B/L 형식이나 통선하증권은 B/L 이외의 형식도 존재한다.","복합운송증권은 증권의 발행인으로 선박회사와 그 대리인이나 통선하증권은 운송주업자도 가능하다."],"a":0,"e":"통선하증권(Through B/L)은 하청운송 형태로 구간별 분할책임, B/L 형식, 선박회사와 그 대리인 발행에 한정되는 반면 복합운송증권(MTD)은 계약형태 불문, 전구간 단일책임, B/L 외 형식과 포워더 발행이 모두 가능하다."},{"id":"33ce528b02","s":1,"n":"389","q":"화환어음의 결제 방식중 무신용장거래의 경우 누가 환어음과 선하증권에 백지배서하는가?","o":["매수인","매도인","운송인","수입인"],"a":1,"e":"무신용장거래에서는 매도인(수출자)이 환어음을 발행하고 환어음과 선하증권에 백지배서(blank endorsement)한 뒤 추심의뢰하며, 매수인은 그 서류를 인수·지급해 소지인이 된다."},{"id":"318f358a05","s":1,"n":"390","q":"다음 중 국제운송에서 Freight Forwarder가 취급할 수 있는 사업영역에 해당되지 않는 것은?","o":["국제운송물류에 대한 전반적인 컨설팅","화물의 집화, 분배, 혼재 서비스","보험의 수배 및 담보조건 등에 관한 제안","운송사고 하자물품에 대한 검정보고서의 발급"],"a":3,"e":"검정보고서(Survey Report)는 이해관계 없는 독립 검정기관(surveyor)이 발급하는 서류로 포워더의 업무 영역이 아니다. 포워더는 컨설팅, 집화·혼재, 보험 수배 및 조건 제안 등을 수행한다."},{"id":"07d3ef349b","s":1,"n":"391","q":"복합운송주선업자가 등록한 사항을 변경하고자 하는 경우에는 변경사유가 발생한 날부터 몇 일 이내에 변경등록을 하여야 하는가?","o":["10일 이내","15일 이내","30일 이내","60일 이내"],"a":2,"e":"국제물류주선업(복합운송주선업) 등록사항 변경은 변경사유 발생일부터 30일 이내에 변경등록해야 한다."},{"id":"9bfb41477f","s":1,"n":"392","q":"신용장에서 환어음 만기가 선적일 후 일정기간으로 명시된 경우 하나의 환어음에 대하여 세 세트의 다음과 같은 선하증권이 제시되었다면 어느 일자를 선적일로 간주하는가? 구분 선하증권1 선하증권2 선하증권3 onboard notation date 11/19 11/22 11/24 발행일 11/20 11/19 11/23","o":["11월 19일","11월 20일","11월 22일","11월 24일"],"a":3,"e":"하나의 환어음에 복수 세트의 B/L이 제시되면 가장 늦은 선적일을 기준으로 만기를 산정하므로 on board notation 중 최종일인 11월 24일이 선적일이다. 본선적재부기가 있으면 발행일이 아니라 그 부기일이 선적일이다."},{"id":"b0306eb90a","s":1,"n":"393","q":"다음 중 무신용장거래의 경우 매수인의 권리에 대한 설명으로 맞는 것은?","o":["선하증권을 발행하는 자","운송인이 물건을 인도하여야 할 증권상 권리를 가진 자","선하증권에 백지배서하는 자","환어음을 발행하는 자"],"a":1,"e":"무신용장거래에서 매수인은 백지배서된 B/L을 취득한 소지인으로서 운송인에게 운송물 인도를 청구할 증권상 권리를 가진다. 증권 발행은 운송인, 환어음 발행과 백지배서는 매도인의 몫이다."},{"id":"5fb48aefda","s":1,"n":"394","q":"다음 중 신용장통일규칙에 대한 설명 중 적합하지 않은 것은?","o":["일류 검사기관이 발행한 검사증명서를 요구하였다면 수익자 이외의 자라면 어떤자가 발행하였더라도 검사증명서는 수리할 수 있다.","신용장에서 서류사본을 개설의뢰인에게 선적 후 즉시 송부한 것을 증명하는 \"beneficiary's certificate를 요구하였다면 이 경우 이 증명서에는 수익자가 선적 후 3일 이내에 서류 사본을 송부하였다는 것이 기재되어야 한다.","신용장은 취소불능이라는 표시가 없더라도 취소가 불가능하다.","서로 다른 국가에 있는 은행의 지점은 separate bank로 간주되다."],"a":1,"e":"UCP상 \"즉시(promptly)\" 같은 불명확한 표현은 무시되고 며칠 이내라는 특정 기한을 요구한 것으로 해석되지 않으므로 3일 내 송부 기재가 필요하다는 서술은 잘못이다. 나머지는 UCP 600 제3조의 해석 원칙과 일치한다."},{"id":"699ed13144","s":1,"n":"395","q":"다음 중 갑판적의 물건에 대한 Hague Rules의 적용을 제외한 이유와 관련된 사항을 설명한 것으로 적합하지 않은 것은?","o":["갑판적 물건이 현실로 갑판에 적재되어 운송되어지는 것을 조건으로 적용되어야 한다.","선하증권에 갑판적이라고 기재하는 것만으로도 갑판적 물건이라고 적용되어야 한다.","갑판적 물건이 최초부터 선창에 적재된 경우 또는 운송 중에 선창에 적재된 경우에는 Hague Rules가 적용되어야 한다.","물건의 일부가 선창에 적재된 경우에는 그 물건이 가분물이면 전부에 대하여 Hague Rules가 적용되어야 한다."],"a":1,"e":"갑판적(on deck) 화물로 Hague Rules 적용이 배제되려면 B/L에 갑판적 기재가 있고 실제로 갑판에 적재되어 운송된다는 두 요건을 모두 충족해야 하므로 기재만으로 충분하다는 서술은 옳지 않다."},{"id":"a7bc56642c","s":1,"n":"396","q":"다음 중 신용장거래에서 용선계약부 선하증권의 서명권자가 아닌 것은?","o":["Carrier","Owner","Master","Charterer"],"a":0,"e":"UCP 600 제22조는 용선계약부 선하증권의 서명권자를 선장(master), 선주(owner), 용선자(charterer) 또는 그 기명 대리인으로 한정한다. 단순히 carrier 자격으로 한 서명은 수리되지 않는다."},{"id":"734838cefa","s":1,"n":"397","q":"다음 중 피배서인의 이름이 명기되지 않고 송화인 또는 신용장 발행은행 지시를 받아, 화물을 인도하라는 문언과 함께 배서인이 서명하는 배서 방식은?","o":["기명식","지시식","백지식","선택무기명식"],"a":1,"e":"피배서인을 특정하지 않고 \"Deliver to order of shipper(또는 개설은행)\"처럼 지시 문언과 함께 배서인이 서명하는 방식은 지시식 배서다. 백지식은 문언 없이 배서인 서명만 하는 형태다."},{"id":"bd61f9099d","s":1,"n":"398","q":"신용장거래엣 선하증권 요구시 별도의 허용문언이 없는 경우 하자로 취급받게 되는 선하증권의 내용은?","o":["packing may not be sufficient for the sea journey","goods shipped on deck","shipper's load and count","the carrier reserves the right to tranship"],"a":1,"e":"별도 허용문언이 없으면 갑판적재(on deck) 기재 B/L은 수리 거절 대상이다. shipper's load and count, 환적 유보 조항, 포장이 충분하지 않을 수 있다는 유보 문구는 UCP·ISBP상 하자가 아니다."},{"id":"f344781e42","s":1,"n":"399","q":"다음 중 복합운송주선업을 등록하고자 하는 자가 등록을 하기 위한 기준으로 맞지 않는 것은?","o":["자본금 또는 자산평가액은 개인인 경우 자산평가액이 6억원 이상인 것","컨테이너 장치장을 소유하거나 이를 사용할 수 있는 계약을 체결하였을 것","1억원 이상의 보증보험에 가입할 것","부지면적이 3만 3천 제곱미터 이상일 것"],"a":1,"e":"국제물류주선업 등록기준은 자본금 3억원(개인은 자산평가액 6억원) 이상과 1억원 이상 보증보험 가입이며 컨테이너 장치장 확보는 요건이 아니다. 부지면적 3만3천㎡는 물류터미널사업 기준이다."},{"id":"e4bd542ecf","s":1,"n":"400","q":"다음 중 해상운송인의 책임에 대한 설명으로 적합하지 않은 것은?","o":["Hague Rules는 과실책임주의를 채택하고 있다.","Hauge Rules의 운송인의 운송계약상의 의무, 운송인의 권리 및 면책을 규정하고 있다.","Hamburg Rules는 과실책임주의를 채택하고 추정과실 및 태만의 원칙까지도 채택하고 있다.","Hamburg Rule는 운송이이 물건의 멸실, 손상, 인도지연의 사실에 대해 그 방지를 위한 합리적인 방법으로 요구되는 모든 조치를 했을 경우에도 그 책임을 진다고 규정한다."],"a":3,"e":"Hamburg Rules는 추정과실책임을 채택해 운송인이 손해 방지를 위해 합리적으로 요구되는 모든 조치를 다했음을 입증하면 면책되므로, 그럼에도 책임을 진다는 서술은 옳지 않다."},{"id":"c75ea2bef1","s":2,"n":"1","q":"다음 중 선박의 용적 및 중량 톤수에 관해 서술한 것 중 적합하게 설명한 것은?","o":["총톤수: 화물이나 여객 운송을 위해 쓰이는 실제 용적이다.","순톤수: 선박의 크기를 표시하는 단위로 보통 상갑판 이하의 모든 용적에 차폐된 장소의 용적을 더한 용적이다.","배수톤수: 선박이 물에 잠김으로써 배제한 물의 무게로 선박의 무게에 해당되는 양인 배수량에 톤수를 붙인 것이다.","운하톤수: 선박이 적재할 수 있는 최대의 무게를 나타내는 톤수를 말한다."],"a":2,"e":"배수톤수(displacement tonnage)는 선체가 배제한 물의 무게로 곧 선박 자체의 중량을 나타낸다. ①은 순톤수, ②는 총톤수, ④는 재화중량톤수(DWT)의 설명이다."},{"id":"347bbf1a6d","s":2,"n":"2","q":"선박이 적재할 수 있는 최대의 무게를 나타내는 톤수를 말하는 것은?","o":["재화중량톤수","배수톤수","순톤수","운하톤수"],"a":0,"e":"재화중량톤수(DWT)는 만재흘수선까지 적재 가능한 화물·연료·청수 등의 총중량으로, 선박의 실질 수송능력을 표시하는 대표적 중량톤수다."},{"id":"f912b382bb","s":2,"n":"3","q":"다음에서 흘수(draft)에 대한 설명으로 잘못된것은?","o":["선박의 용골에서 수면까지의 수직거리를 흘수라 한다.","선수에 만재흘수선표가 표시된다.","흘수에는 용골흘수와 형흘수가 있다.","적당한 흘수를 확보하는 것은 선박의 안전을 위하여 대단히 중요하다."],"a":1,"e":"만재흘수선표(load line mark)는 선체 중앙부(midship) 양 현측에 표시하며 선수에는 두지 않는다. 흘수는 용골에서 수면까지의 수직거리로 용골흘수·형흘수로 구분된다."},{"id":"a7a16ecab6","s":2,"n":"4","q":"물속에서 잠긴 선체의 깊이로, 선박의 용골에서 수면까지의 수직거리를 말하는 것은?","o":["흘수","톤수","건현","트림"],"a":0,"e":"흘수(draft)는 물에 잠긴 선체의 깊이다. 건현(freeboard)은 수면에서 갑판선까지의 높이, 트림(trim)은 선수·선미 흘수의 차를 뜻한다."},{"id":"c47b6a846d","s":2,"n":"5","q":"일반적으로 해상에서 이용되는 선박의 속력 단위로 적합한 것은?","o":["헤르쯔(Hz)","마일(mile)","킬로미터(km)","노트(knot)"],"a":3,"e":"1노트(knot)는 1시간에 1해리(1,852m)를 항주하는 속력으로 해상 속력 단위다. mile·km는 거리 단위, Hz는 주파수 단위다."},{"id":"d210356d19","s":2,"n":"6","q":"선박 복원성의 좋고 나쁨을 판단하는 가장 중요한 요소는 어느 것인가?","o":["선박의 무게","선박의 부심","선박의 경심","메타센터의 높이"],"a":3,"e":"복원성 판단의 핵심 지표는 무게중심(G)과 경심(M) 사이 거리인 메타센터 높이 GM이며, GM이 클수록 초기복원력이 크다."},{"id":"13e2b7cb62","s":2,"n":"7","q":"다음의 설명으로 옳은 것은?","o":["외판은 선박의 현측에서 맞은편 현측까지 이어진 바닥판이다.","갑판은 선체의 외곽을 이루어 수밀을 유지하고 부력을 형성한다.","화물창은 화물 수송을 위하여 설계된 공간이다.","상갑판은 갑판 중에서 맨 위층에 있는 갑판이다."],"a":2,"e":"화물창(cargo hold)은 화물 수송 전용으로 설계된 선내 공간이다. ①과 ②는 외판(shell plating)과 갑판(deck)에 대한 설명이 서로 뒤바뀌어 있다."},{"id":"6b35956c4a","s":2,"n":"8","q":"선박에서 화물수송을 위하여 설계된 공간을 무엇이라 하는가?","o":["갑판","기관실","연료실","화물창"],"a":3,"e":"화물창(cargo hold)은 화물 적재·수송을 위해 구획된 공간이다. 기관실·연료실은 추진 관련 공간이고 갑판은 선체를 수평으로 구획하는 구조재다."},{"id":"0a5275592f","s":2,"n":"9","q":"황늑골식 구조 양식에 대한 설명 중 가장 옳은 것은?","o":["종강도가 커서 배의 중량이 가볍다.","구조가 복잡하여 건조 작업이 어렵다.","선창 내에 돌출부가 많아 공간을 효과적으로 사용할 수 없다.","늑판(floor), 늑골(frame), 보(beam) 등의 횡강도 부재를 중점적으로 배치하는 구조이다."],"a":3,"e":"횡늑골식(transverse framing)은 늑판(floor)·늑골(frame)·보(beam) 등 횡강도 부재를 중점 배치하는 방식으로, 구조가 단순해 건조가 쉬운 반면 종강도가 약하다."},{"id":"b01e3d1e3d","s":2,"n":"10","q":"선채의 구조 형식에서 주로 종강도 부재를 중심으로 배치된 구조 양식으로 유조선과 같이 액체화물을 적재하는 선박 등에 채용되는 방식은?","o":["종늑골식 구조","이중저 구조","횡늑골식 구조","혼합식 구조"],"a":0,"e":"종늑골식(longitudinal framing)은 종강도 부재를 주로 배치해 종강도가 크고 선체 중량이 가벼워, 유조선 등 대형 액체화물선에 널리 채용된다."},{"id":"e21d3e084f","s":2,"n":"11","q":"선체저항에 대한 설명 중 맞는 것은?","o":["조차저항은 속력이 빨라질수록 감소한다.","속장비는 조파저항 때문에 고려한다.","고속선에서의 조파저항은 무시하여도 좋다.","잠수함은 조파저항으로 인하여 그 속력을 낼 수 없다."],"a":1,"e":"속장비(speed-length ratio)는 조파저항(wave-making resistance) 평가를 위해 고려한다. 조파저항은 속력이 빨라지면 급증하고 고속선에서 지배적이며, 잠항 중 잠수함에는 거의 발생하지 않는다."},{"id":"897fed032b","s":2,"n":"12","q":"선박이 이접안 할때 부서 위치와 그 주요 업무가 바르게 짝지어지지 못한 것은?","o":["선교 - 선장, 보좌, 수동 조타","기관실 - 기관, 기기감시, 운전","선수 - 선수부 계류","조리실 - 통신 및 검역 준비"],"a":3,"e":"통신 및 검역 준비는 선교·통신실이 담당하는 업무이며, 조리실은 이접안 비상부서배치에서 급식 지원을 맡는다."},{"id":"64f2d7e73c","s":2,"n":"13","q":"다음 중 엘니뇨(El Niño) 및 라니냐(La Niña) 현상과 관련이 있는 해역은?","o":["열대 인도양","열대 서부 대서양","북극해 및 남극해","열대 동부 태평양"],"a":3,"e":"엘니뇨·라니냐는 열대 동부 태평양(페루 연안) 해수면 수온의 이상 상승·하강 현상으로, 남방진동과 결합한 ENSO로서 전 지구 기후에 영향을 준다."},{"id":"c50b08edc3","s":2,"n":"14","q":"다음 중 선박검사의 종류로 적합하지 않는 것은?","o":["정부검사","선급검사","예비검사","국제협약검사"],"a":2,"e":"선박검사는 정부검사, 선급검사, 국제협약검사로 대별된다. 예비검사는 선박용 물건 등에 대한 사전 확인 절차로 이 분류에는 들어가지 않는다."},{"id":"14266a0400","s":2,"n":"15","q":"선박검사의 종류 중에서 선박 감항성의 유지와 해상선박보험 등에 필요한 검사는 다음 중 어느 것인가?","o":["정부검사","선급검사","예비검사","국제협약검사"],"a":1,"e":"선급검사(classification survey)는 선급협회가 감항성(seaworthiness) 유지 여부를 확인하는 검사로, 해상보험 인수와 보험료 산정의 실질적 기준이 된다."},{"id":"8ff7790ffd","s":2,"n":"16","q":"해상보험의 기본이 되고 항시 분쟁의 소지가 있는 선박의 감항성을 유지하기 위해 산박은 정기검사를 얼마만에 실시하는가?","o":["등록검사로 부터 30개월 경과","정기 검사일로 부터 12개월 경과","등록검사 또는 매 5년마다","제조 후 8년 이후부터 매년마다 검사"],"a":2,"e":"정기검사(special survey)는 최초 등록검사 이후 매 5년 주기로 선체·기관 전반을 정밀 검사하여 감항성과 선급을 유지하는 검사다."},{"id":"8c5be24938","s":2,"n":"17","q":"선급검사 중 기기계속검사(CMS)는 어느 주기마다 검사를 실시하는가?","o":["정기 검사일로 부터 12개월 이후","정기검사일로 부터 30개월 경과","매 5년 마다","정기검사 interval중 매년마다 1/5씩 검사"],"a":3,"e":"기기계속검사(CMS, Continuous Machinery Survey)는 5년의 정기검사 interval 동안 대상 기기를 매년 약 1/5씩 나누어 순차적으로 검사하는 방식이다."},{"id":"bbe9f96f0a","s":2,"n":"18","q":"주요 국제협약에 따른 검사의 종류에 해당되지 않는 것은?","o":["국제 만재흘수선협약에 의거한 검사","해양오염방지협약에 의거한 검사","로테르담규칙에 의거한 검사","해상인명안전협약에 의거한 검사"],"a":2,"e":"로테르담 규칙(Rotterdam Rules)은 해상운송인의 책임을 규율하는 상사법 협약으로 검사 근거가 아니다. 검사 관련 협약은 SOLAS, MARPOL, 국제만재흘수선협약 등이다."},{"id":"088e500a85","s":2,"n":"19","q":"다음은 항만국 통제 검사(Port State Control)에 대한 특성을 설명한 것 중 적합하지 않은 것은?","o":["선박안전기준의 국제적 적합성","선원자격기준의 국제적 적합성","근로조건기준의 국제적 적합성","운송인의 의무의 국제적 적합성"],"a":3,"e":"항만국통제(PSC)는 입항 외국선박의 선박안전·선원자격·근로조건 기준의 국제적 적합성을 점검한다. 운송인의 사법상 의무 이행은 점검 대상이 아니다."},{"id":"2df63b2dbf","s":2,"n":"20","q":"선박 운항 관리 목표와 거리가 먼 내용은?","o":["정시운항","안전운항","경제운항","항로변경"],"a":3,"e":"운항관리의 목표는 정시운항·안전운항·경제운항이다. 항로변경은 목표가 아니라 기상 회피나 지연 회복을 위한 수단에 해당한다."},{"id":"b84140a50f","s":2,"n":"21","q":"총 선대의 운항계획 수립 시의 고려하여할 사항이 아닌 것은?","o":["운송수요의 변동","선적항의 인적관리","항해거리 및 시간","선원의 가용능력"],"a":1,"e":"선대 운항계획은 운송수요 변동, 항해거리·시간, 선원 가용능력 등을 종합 고려한다. 선적항의 인적관리는 개별 항만 현장의 노무관리 사항이다."},{"id":"f6d7648bca","s":2,"n":"22","q":"선박의 운항 Schedule의 종류가 아닌 것은?","o":["Pro forma schedule","Long term schedule","Short term schedule","Costal schedule"],"a":2,"e":"'선박 운항 스케줄의 종류가 아닌 것' → 회사 정답은 Short term schedule이다. 보기 ③으로 고정해 암기한다. ⚠[정답 논란] Pro forma·Long term·Short term schedule이 통상적인 3분류이고 Costal(Coastal) schedule은 운항 스케줄 종류가 아니므로, 일반 이론상 정답은 ④다. 다만 채점은 회사 제공 정답 ③ 기준이므로 시험에서는 ③로 답할 것.","c":{"t":3,"n":"Pro forma·Long term·Short term schedule이 통상적인 3분류이고 Costal(Coastal) schedule은 운항 스케줄 종류가 아니므로, 일반 이론상 정답은 ④다."}},{"id":"70ec69b8f7","s":2,"n":"23","q":"선박 운항시 지연 운항의 발생요인으로 거리가 먼 것은?","o":["지연입고, 화물상태 불량, 화물중량초과등의 화물관련 요인","선박 또는 기기의 고장","시간당 평균 하역 능력","선석대기 및 작업지연등의 항만 사정"],"a":2,"e":"시간당 평균 하역능력은 하역 생산성 지표일 뿐 지연 요인이 아니다. 지연은 화물 관련 문제, 선박·기기 고장, 선석대기 등 항만사정에서 발생한다."},{"id":"2a6e266a1a","s":2,"n":"24","q":"선박 지연 운항 발생시 schedule의 회복 원칙으로 타당한 것은?","o":["가능한 Port Skip은 지향한다.","Port production을 저감한다.","Gang hour를 준수하여 접안즉시 작업시행한다.","최단 시간내 회복하고 1 round voyage 이상 계속 지연 방지한다."],"a":3,"e":"지연은 최단 시간 내 회복해 1 round voyage 이상 누적되지 않게 하는 것이 원칙이다. Port skip은 지양하고 항만 생산성(port production)은 오히려 높여야 한다."},{"id":"5ccee57211","s":2,"n":"25","q":"다음 중 선박유지를 위한 제반 비용인 선박관리비에 해당되지 않는 것은?","o":["감가상각비","보험료","복리후생비","선용품비"],"a":3,"e":"'선박관리비에 해당되지 않는 것' → 회사 정답은 선용품비다. 보기 ④로 고정해 암기한다. ⚠[정답 논란] 선용품비는 선박관리비(직접선비) 항목이고 감가상각비는 선박 취득에 따른 자본비이므로, 일반 이론상 관리비에 해당하지 않는 것은 ①이다. 다만 채점은 회사 제공 정답 ④ 기준이므로 시험에서는 ④로 답할 것.","c":{"t":0,"n":"선용품비는 선박관리비(직접선비) 항목이고 감가상각비는 선박 취득에 따른 자본비이므로, 일반 이론상 관리비에 해당하지 않는 것은 ①이다."}},{"id":"5bbf246441","s":2,"n":"26","q":"선박이 적재할 수 있는 화물의 중량을 의미하는 톤(ton)수는?","o":["총톤수","순톤수","재화중량톤수","배수량톤수"],"a":2,"e":"재화중량톤수(DWT)는 만재흘수선까지 적재할 수 있는 화물·연료·청수 등의 최대 중량으로, 선박의 화물 적재능력을 중량으로 표시한 톤수다."},{"id":"015a64a077","s":2,"n":"27","q":"다음 중 선박의 크기를 나타내는 톤수로만 묶인 것을 찾으시오? ⓐ R/T(Revenue Ton) ⓑ G/T(Gross Ton) ⓒ W/T(Weight Ton) ⓓ DWT(Dead Weight Ton) ⓔ M/T(Measurement Ton) ⓕ Displacement Ton","o":["ⓑ - ⓓ - ⓕ","ⓑ - ⓒ - ⓓ","ⓐ - ⓑ - ⓔ","ⓐ - ⓓ - ⓔ"],"a":0,"e":"선박 자체의 크기를 나타내는 것은 G/T(총톤수), DWT(재화중량톤수), Displacement Ton(배수톤수)이다. R/T·W/T·M/T는 운임 부과용 화물 톤수(freight ton)다."},{"id":"46f791a065","s":2,"n":"28","q":"선주가 속한 국가가 아닌 제3국의 국적을 취득한 선박을 이르는 말은?","o":["VLCC선","편의치적선","LASH선","나용선"],"a":1,"e":"편의치적선(flag of convenience)은 조세 부담, 선원 고용, 안전규제를 회피·경감하려고 파나마·라이베리아 등 제3국에 등록한 선박이다."},{"id":"fae7dda8fb","s":2,"n":"29","q":"다음 선박의 톤수 중 순톤수(Net tonnage:N/T)에 대한 설명으로 맞는 것은?","o":["갑판 아래의 적량과 갑판 위의 밀폐된 장소의 적량을 합한 것으로 선박의 안전과 위생에 사용되는 부분의 적량(제외적량:exemptions)을 제외한 것을 말한다.","선박의 각 창의 용적과 특수화물창고 등 선박의 화물적재능력을 용적톤으로 표시한 것으로 관습상 40ft³(1.133m³)를 1톤으로 나타내고 있다.","용선계약, 선박매매거래 등 상거래의 산출기준이 되는 톤수를 말한다.","선주나 용선자의 상행위와 관련된 용적이기 때문에 항만세 ,톤세, 운하통과료,등대사용료, 항만시설사용료 등의 모든 세금과 수수료의 산출기준이 된다."],"a":3,"e":"순톤수(N/T)는 총톤수에서 제외적량을 뺀 상행위 관련 용적으로, 톤세·항만세·운하통과료·등대사용료 등 세금과 사용료 산출 기준이 된다. ①은 총톤수, ②는 재화용적톤수 설명이다."},{"id":"d752a63246","s":2,"n":"30","q":"다음 중 선박의 복원력에 영향을 미치지 않는 것은 어느 것인가?","o":["배수량","트림","선폭","현호"],"a":1,"e":"복원력은 배수량, 선폭, 현호(sheer)와 건현 등 선형 요소에 좌우된다. 트림은 선수미 흘수차로 종방향 자세의 문제이며 횡복원력을 결정하는 요소가 아니다."},{"id":"7c29d6e30c","s":2,"n":"31","q":"다음 중 여객이나 화물의 운송을 할 수 있는 선박 안의 장소의 크기를 나타내는 톤수는 어느 것인가?","o":["총톤수","배수톤수","순톤수","재화용적톤수"],"a":1,"e":"'여객·화물 운송을 할 수 있는 선박 안 장소의 크기를 나타내는 톤수' → 회사 정답은 배수톤수다. 보기 ②로 고정해 암기한다. ⚠[정답 논란] 운송에 직접 사용되는 선내 장소의 크기를 나타내는 것은 순톤수(N/T)이고 배수톤수는 선박의 중량 톤수이므로, 일반 이론상 정답은 ③이다. 다만 채점은 회사 제공 정답 ② 기준이므로 시험에서는 ②로 답할 것.","c":{"t":2,"n":"운송에 직접 사용되는 선내 장소의 크기를 나타내는 것은 순톤수(N/T)이고 배수톤수는 선박의 중량 톤수이므로, 일반 이론상 정답은 ③이다."}},{"id":"da50551190","s":2,"n":"32","q":"다음 중 선박의 배수량을 적절하게 표시한 것은?","o":["수면하의 용적 x 물의 비중","수면하의 중량 x 물의 비중","수면상의 용적 x 물의 비중","수면상의 중량 x 물의 비중"],"a":0,"e":"배수량(displacement)은 아르키메데스 원리에 따라 수면하 선체 용적에 물의 비중을 곱한 값으로, 선박의 총중량과 같다."},{"id":"3097848ebf","s":2,"n":"33","q":"다음 중 만재흘수선을 표시해야 하는 선박이 만재흘수선 이상으로 적재하여 항해 할 수 있는 경우는 어느 것인가?","o":["연해구역을 항해할 때","평수구역을 항해할 때","근해구역을 항해할 때","국제항해 시 귀국할 때"],"a":1,"e":"평수구역(항내·호소 등)을 항해할 때는 만재흘수선 규정 적용이 제외되어 그 이상 적재 항해가 가능하다. 연해·근해·국제항해에서는 반드시 준수해야 한다."},{"id":"587d746e7b","s":2,"n":"34","q":"다음은 부심을 설명한 것으로 적당한 것은?","o":["전 중량의 중심","수면상의 용적의 중심","수면하 용적의 중심","수면하 중량의 중심"],"a":2,"e":"부심(center of buoyancy, B)은 수면하 배수 용적의 기하학적 중심으로 부력의 작용점이다. 전 중량의 중심은 무게중심(G)이다."},{"id":"b9545b28cb","s":2,"n":"35","q":"다음 중 2호 선저도료(A/F paint)를 사용하는 주된 목적으로 타당한 것은?","o":["선체의 부식을 방지하기 위함이다.","수선부의 손상을 방지하기 위함이다.","해조류의 부착을 방지하기 위함이다.","건조시간을 단축하기 위함이다."],"a":2,"e":"2호 선저도료는 방오도료(A/F paint, anti-fouling)로, 따개비·해조류 등 해양생물 부착을 막아 마찰저항 증가와 선속 저하를 방지한다. 부식 방지는 방청도료의 기능이다."},{"id":"f9fabb5136","s":2,"n":"36","q":"다음 중 예인선에 적합한 기관은?","o":["디젤기관","터빈기관","왕복동기관","가솔린기관"],"a":2,"e":"예인선은 저속에서 큰 회전력과 신속한 정·역전 전환이 요구되어 왕복동기관 방식이 적합하다고 본다. 터빈기관은 고속 정속운전용이다."},{"id":"f11b68b2a8","s":2,"n":"37","q":"다음 중 예항 시 피예선에서 닻줄을 내어 주는 이유는?","o":["예색의 분리 용이","회수를 쉽게 하기 위해","수곡선을 유지하기 위해","파단력을 높이기 위해"],"a":2,"e":"피예선이 닻줄을 내어주면 예색 중간부가 자중으로 늘어져 수곡선(catenary)을 형성하고, 그 완충 작용으로 충격 하중과 예색 절단 위험이 줄어든다."},{"id":"050a3a86cc","s":2,"n":"38","q":"다음 중 초기복원력에 적합한 것은?","o":["경하상태의 복원력","경사가 처음 시작될 때의 복원력","신조당시의 복원력","경사가 10도 미만인 때의 복원력"],"a":3,"e":"초기복원력은 경사각이 약 10도 미만인 소각도 범위에서의 복원력으로, 통상 메타센터 높이 GM 값으로 평가한다."},{"id":"0062e50b8d","s":2,"n":"39","q":"다음 보원력에 대한 특성을 설명한 것 중 적합하지 않은 것은?","o":["선박의 안정성 판단에 중요한 기준이다.","복원력이 너무 작으면 선박이 전복되기 쉽다.","선박의 횡경사와 종경사에 대한 것을 연구한 것이다.","복원력이 부족하면 선박으로서의 의미를 상실한다."],"a":2,"e":"복원력은 주로 횡경사(heeling)에 대한 원위치 회복 능력을 다루며, 종경사는 트림·종복원성의 문제로 별도 취급한다."},{"id":"1ae750ab1f","s":2,"n":"40","q":"선박에서 흔히 불안전 상태라고 이야기하는 경우는 다음 중 어느 것인가?","o":["중심이 경심보다 위에 있을 때","중심이 경심보다 아래 있을 때","중심과 경심의 위치가 같을 때","중심이 부심 아래 있을 때"],"a":0,"e":"무게중심(G)이 경심(M)보다 위에 있으면 GM이 음(-)이 되어, 경사 시 모멘트가 경사를 더 키우는 불안정(unstable) 상태가 된다."},{"id":"29d7bdfb9e","s":2,"n":"41","q":"다음 중 트림과 관계가 먼 것은 어느 것인가?","o":["능파성","타효","속력","복원력"],"a":3,"e":"트림은 능파성, 타효(조타 성능), 속력에 직접 영향을 준다. 복원력은 배수량·선폭·중심 높이 등 횡방향 요소가 지배한다."},{"id":"a40633dc7f","s":2,"n":"42","q":"선박의 조난이 발생하고 퇴선을 결정하기 전에 퇴선 준비사항과 관계가 먼 것은?","o":["구명동의를 착용한다.","비상부서배치표에 따른다.","적절한 의복 착용","멀미약 복용"],"a":3,"e":"퇴선 준비는 비상부서배치표에 따라 구명동의와 보온성 있는 의복을 착용하는 것이 핵심이며, 멀미약 복용은 준비사항에 포함되지 않는다."},{"id":"9cc720a99f","s":2,"n":"43","q":"다음에서 Rope가 절단되는 순간의 최대하중을 무엇이라고 하는 가?","o":["시험하중","사용하중","파단하중","안전사용하중"],"a":2,"e":"파단하중(breaking load)은 로프가 절단되는 순간의 최대하중이며, 여기에 안전율을 적용해 낮춘 값이 안전사용하중(SWL)이다."},{"id":"d1ef1c6d5c","s":2,"n":"44","q":"다음 중 용골 하(下)면에서 부터 수면까지 수직거리를 표시하는 Draft를 말하는 것은?","o":["Model Draft","Keel Draft","Deep Draft","Full Loaded Draft"],"a":1,"e":"용골 하면에서 수면까지의 흘수는 용골흘수(keel draft)이며, 형흘수(moulded draft)는 용골 상면인 형기선에서 수면까지를 잰 값이다."},{"id":"f719a58f43","s":2,"n":"45","q":"다음 중 체크밸브(check valve)에 관한 것으로 가장 적합한 것은?","o":["황천 시 작동시키는 조타기의 밸브이다.","배수관의 도중에 설치하여 해수의 역류를 방지하는 밸브이다.","황천 시 스크류의 공전을 막기 위한 밸브이다.","보일러의 증기를 개폐하는 밸브이다."],"a":1,"e":"체크밸브(check valve)는 유체를 한 방향으로만 흐르게 하는 역류 방지 밸브로, 배수관 도중에 설치해 선외 해수의 역류 유입을 막는다."},{"id":"61a3a9b05b","s":2,"n":"46","q":"다음에서 유조선의 구조설비에 해당되지 않는 것은?","o":["파형격벽","펌프실","방유구획","이중저"],"a":3,"e":"이중저(double bottom)는 일반 건화물선의 대표적 구조이며, 유조선 화물탱크부는 전통적으로 이중저 대신 파형격벽·방유구획·펌프실 등을 갖춘다."},{"id":"ed6bffc98b","s":2,"n":"47","q":"다음 중 선저외측의 만곡부 외판에 붙은 만곡부 용골(Bilge Keel)의 설치 목적으로 타당한 것은?","o":["선속을 증대시킨다.","선체의 종강력을 증대시킨다","선체의 횡요를 완화시킨다.","조파저항을 감소시킨다."],"a":2,"e":"만곡부 용골(bilge keel)은 만곡부 외판에 부착해 횡동요(rolling) 시 물의 저항을 발생시켜 횡요를 완화하는 감요장치다."},{"id":"1e8d0579a1","s":2,"n":"48","q":"다음에서 냉동식 LPG 탱커의 재액화라인에 연결되어 있는 관이 아닌 것은 어느 것인가?","o":["스파지관","분사노즐관","증기관","재액관"],"a":2,"e":"냉동식 LPG 탱커의 재액화라인에는 스파지관, 분사노즐관, 재액관 등이 연결된다. 증기관은 보일러 계통 배관으로 재액화 계통과 무관하다."},{"id":"5e471f4d57","s":2,"n":"49","q":"다음에서 국내외의 화물을 주로 취급하는 항만에 해당 하는 것은?","o":["상항","산업항","어항","관광항"],"a":0,"e":"상항(commercial port)은 국내외 일반화물과 여객을 주로 취급하는 무역항이다. 산업항은 특정 원자재, 어항은 수산물, 관광항은 관광·여객 기능 중심이다."},{"id":"2dec077737","s":2,"n":"50","q":"다음에서 태풍 등의 황천을 피하기 위한 항으로 진해항, 흑산도항 같은 항만을 무엇이라고 하는가?","o":["상항(Commercial Port)","산업항(Industrial Port)","관광항(Recreation Port)","피난항(Refuge Port)"],"a":3,"e":"피난항(refuge port)은 태풍 등 황천 시 선박이 일시 대피하기 위해 지정된 항만으로, 진해항·흑산도항 등이 해당한다."},{"id":"56e3798c43","s":2,"n":"51","q":"항만을 입지조건으로 분류한 것 중 해항(sea port)라고도 하며 바다에 접해 있는 거의 모든 항만이 이에 해당되는 것은?","o":["하구항(Estuary port)","하천항(River port)","연안항(Coastal port)","운하항(Canal port)"],"a":2,"e":"입지조건 분류에서 연안항(coastal port)은 해안선에 직접 면한 항만으로 바다에 접한 대부분의 항이 여기 속해 해항(sea port)이라 불린다. 하구·하천·운하항은 내륙수로와 연계된 형태다."},{"id":"b29311f9c3","s":2,"n":"52","q":"다음 중 목포항이나 뉴욕 항 처럼 강과 바다가 접하는 수역에 위치한 항으로 내륙 수운과 연결된 항만은?","o":["하구항(Estuary port)","하천항(River port)","연안항(Coastal port)","운하항(Canal port)"],"a":0,"e":"하구항(estuary port)은 강과 바다가 만나는 기수역에 위치해 해상운송과 내륙 수운(inland waterway)을 연결하는 항만으로, 목포·뉴욕·런던 항이 대표적이다."},{"id":"c973ff9f32","s":2,"n":"53","q":"다음 중 관리 주체가 시도지사로서 지역별 육해상 운송망의 거점으로서 지역산업에 필요한 화물처리를 주목적으로 하는 항만은?","o":["국가 관리항","지방 관리항","연안항","운하항"],"a":1,"e":"지방관리(무역)항은 시·도지사가 관리주체로서 지역별 육해상 운송망 거점 기능과 지역산업용 화물처리를 주목적으로 한다. 국가관리항은 해양수산부가 직접 관리한다."},{"id":"0269d0b0f6","s":2,"n":"54","q":"다음에서 항만의 역할로서 적합하지 않은 것은?","o":["육해상 교통의 거점","지역 발전의 원동력","국가 경제의 기반 시설","신규고용창출의 기회"],"a":3,"e":"신규고용창출은 항만 활동에서 파생되는 부수적 경제효과일 뿐, 항만의 본래 역할로 제시되는 육해상 교통 거점, 지역발전 원동력, 국가경제 기반시설에는 포함되지 않는다."},{"id":"afc8f3b3e0","s":2,"n":"55","q":"다음에서 항만의 기능으로서 거리가 먼 것은?","o":["피난처의 기능","선박의 지원기능","자원순환의 기능","교통 체계상의 터미널 기능"],"a":2,"e":"항만의 기본 기능은 피난처(shelter), 선박 지원(보급·수리), 교통체계상 터미널(modal interface) 기능이다. 자원순환은 환경·폐기물 관리 영역으로 항만 고유 기능과 거리가 멀다."},{"id":"3df0c31700","s":2,"n":"56","q":"다음에서 항만의 수역시설과 관련이 적은 것은?","o":["항로","정박지","선회장","방파제"],"a":3,"e":"수역시설은 항로·정박지·선회장(turning basin)처럼 수면상의 공간을 말하며, 방파제(breakwater)는 파랑을 차단하는 외곽시설로 분류된다."},{"id":"f9814addb3","s":2,"n":"57","q":"항만의 외곽시설로 지나치게 빠른 조류로 부터 선석을 보호하기 위한 시설은?","o":["방파제","도류제","방조제","방사제"],"a":2,"e":"방조제는 과도한 조류·조수의 유입을 막아 선석과 항내 정온을 확보하는 외곽시설이다. 도류제는 하천 유량을 유도하고, 방사제는 표사 이동을 억제하는 시설이다."},{"id":"3227677baf","s":2,"n":"58","q":"다음에서 항만의 기능적 시설오 주로 화물 유통 시설및 보급 시설이 아닌 것은?","o":["창고","야적장","배관시설","저유시설"],"a":2,"e":"배관시설(pipeline)은 액체화물을 이송하는 하역·처리시설에 해당한다. 창고·야적장은 화물유통시설, 저유시설은 선박 보급시설로 분류된다."},{"id":"3a4f9bcb8c","s":2,"n":"59","q":"다음에서 컨테이너 터미널의 기능으로 운송 수단간의 운송량 격차를 해소하기 위해 시간적 완충을 위한 터미널의 기능은?","o":["하역 및 이송기능","보관기능","혼재기능","지원기능"],"a":1,"e":"보관기능은 본선과 육상운송수단 간 처리능력·시간 격차를 흡수하는 완충(buffer) 역할로, CY·CFS의 장치(storage) 기능이 이에 해당한다."},{"id":"c0dfa72302","s":2,"n":"60","q":"최근 컨테이너 선작은 10,000 TEU 급 선박이 나올 만큼 대형화 됨에 따라 안벽의 일반화된 규모는 어느 정도인가?","o":["길이 300~350 m, 수심 12~14 m","길이 200~250 m, 수심 11~14 m","길이 200~250 m, 수심 11~15 m","길이 300~350 m, 수심 12~15 m"],"a":3,"e":"10,000TEU급 대형 컨테이너선에 대응하는 안벽은 통상 선석 길이 300~350m, 수심 12~15m 규모로 계획된다."},{"id":"12d739b804","s":2,"n":"61","q":"다음 중 컨테이너 크레인의 구조에서 붐을 따라 이동하는 것은?","o":["붐(Boom)","운전실과 인양장치(Hoist)","트롤리(Trolley)","스프레더(Spreader)"],"a":2,"e":"트롤리(trolley)는 붐과 거더를 따라 횡행하며 스프레더를 이동시키는 부분이다. 스프레더는 컨테이너를 직접 결착하고 호이스트는 상하 인양을 담당한다."},{"id":"e8ff4fc577","s":2,"n":"62","q":"다음 장비 중에서 야드 이용률이 가장 높은 것은?","o":["컨테이너 트레인(Container Crane)","트랜스퍼 크레인(Transfer Crane)","스트래들 캐리어(Straddle Carrier)","야드 트랙터(Yard Tractor)"],"a":1,"e":"트랜스퍼 크레인(transfer crane, RTGC/RMGC)은 다단·다열 고밀도 장치가 가능해 야드 이용률이 가장 높다. 섀시나 스트래들 캐리어 방식은 단적 단수가 낮아 소요면적이 크다."},{"id":"3113687e91","s":2,"n":"63","q":"다음에서 컨테이너를 적재하고 야드 트랙터에 의해 견인되어 안벽과 야드 사이를 운행하는 장비는?","o":["야드 트랙터(Yard Tractor)","톱 핸들러 (Top Handler)","섀시(Chassis)","리치 스택커(Reach Stacker)"],"a":2,"e":"섀시(chassis)는 컨테이너를 적재한 상태로 야드 트랙터(yard tractor)에 견인되어 안벽과 야드 사이를 왕복하는 피견인 차대다."},{"id":"05744d6f21","s":2,"n":"64","q":"다음 컨테이너 하역방식에서 장비의 유지비용과 컨테이너 손상율이 다른 방식에 비하여 상대적으로 높은 방식은?","o":["섀시 방식","트랜스퍼 크레인 방식","스트래들 캐리어 방식","리프트 트럭 방식"],"a":2,"e":"스트래들 캐리어(straddle carrier) 방식은 장비 구조가 복잡해 정비 부담이 크고 컨테이너를 걸쳐 직접 취급하므로 유지비와 화물 손상률이 상대적으로 높다."},{"id":"02360250e1","s":2,"n":"65","q":"다음 중 항만 물류의 특성에 관한 설명으로 타당하지 않은 것은?","o":["항만 물류의 제약성","항만 물류의 수동성","항만 물류의 불규칙성","항만 물류의 저장성"],"a":3,"e":"항만물류는 본선 입출항 일정에 좌우되는 수동성·불규칙성과 시설·수역의 제약성을 갖지만, 화물을 장기 보관하기보다 신속 통과(throughput)를 지향하므로 저장성은 특성이 아니다."},{"id":"ed0ea7522b","s":2,"n":"66","q":"다음 중 항만에 출입하는 선박 및 화물에 대한 입출항 지원과 관계가 먼 것은?","o":["항로표지, 선박교통관리, 도선사, 예선 등 시설 및 서비스의 제공","위험 화물의 관리, 항만 보안 등의 화물에 대한 안전 관리","선원 및 화물에 대하여 출입국 심사, 통관, 검역 등의 행정서비스","화물 운임, 해상 보험을 지원하는 금융 서비스 제공"],"a":3,"e":"입출항 지원은 항로표지·VTS·도선·예선, 위험물과 항만보안 관리, 출입국·통관·검역 등 행정서비스가 중심이다. 운임·해상보험 등 금융서비스는 해운거래 지원 영역이다."},{"id":"231f866533","s":2,"n":"67","q":"다음 중 선적 컨테이너의 양하과정에서 컨테이너 터미널 작업영역으로 적합한 것은?","o":["입항 - 양하 - 장치/보관 - 반출","항만반입 - 장치/보관 - 적하 - 출항","양하 - 장치/보관 - 내륙운송 - 수입자","내륙운송 - 항만반입 - 적하 - 수입자"],"a":0,"e":"수입 컨테이너 양하 흐름에서 터미널 작업영역은 본선 입항-양하(discharging)-CY 장치/보관-게이트 반출(delivery)까지이며, 이후 내륙운송은 터미널 밖 구간이다."},{"id":"a29c97616f","s":2,"n":"68","q":"다음 중 항만을 운영하고 관리한다는 의미와 관련이 없는 것은?","o":["항만 시설의 이용에 관한 질서의 유지","항만 시설의 건설과 유지 관리","항만의 활성화와 운영 효율을 높이기 위한 제반 활동","운송 선박 번호, 운송량을 전자문서(EDI)형식으로 기록"],"a":3,"e":"항만 운영·관리는 시설 건설과 유지보수, 이용질서 유지, 활성화와 효율 제고를 위한 제반 활동을 뜻한다. 선박번호·운송량의 EDI 기록은 정보처리 업무일 뿐 운영관리 개념 자체는 아니다."},{"id":"e20cdc0eaa","s":2,"n":"69","q":"다음 중 항만 운영 주체가 다른 항만과 다른 항은?","o":["마산","인천","포항","목포"],"a":1,"e":"인천항은 인천항만공사(IPA)라는 항만공사(Port Authority)가 운영하는 반면, 마산·포항·목포는 지방해양수산청이 관리·운영한다."},{"id":"5911121d3a","s":2,"n":"70","q":"다음 중 계류시설에 속하지 않는 것은?","o":["안벽","부표","잔교","항로 표지"],"a":3,"e":"계류시설은 안벽(quay wall)·계류부표(mooring buoy)·잔교(pier)처럼 선박을 붙여 매는 시설이며, 항로표지(aids to navigation)는 항행보조시설에 속한다."},{"id":"4b95248613","s":2,"n":"71","q":"다음 중 운항계획 수립 시에 고려해야 할 사항과 거리가 먼 것은?","o":["운송될 화물의 양과 형태 및 특성","항만의 특성","운항채산성의 항해비와 운임수입에 의한 수익성","운송 될 화물의 공급의 변동상황"],"a":3,"e":"운항계획의 검토 요소는 화물의 물량·특성, 항만 조건, 항해비 대비 운임수입의 채산성이며, 공급 측 변동이 아니라 화물 수요 변동을 고려한다."},{"id":"8b5a440f86","s":2,"n":"72","q":"다음 중 얕은 수심이 조선에 미치는 영향과 관계가 먼 것은?","o":["트림변화가 크게된다.","흘수가 감소한다.","타효가 떨어진다.","속력이 떨어진다."],"a":1,"e":"천수역에서는 squat 현상으로 선체가 가라앉아 흘수가 증가하므로 흘수 감소는 옳지 않고, 트림 변화 확대와 타효·속력 저하가 실제 영향이다."},{"id":"093ad2f056","s":2,"n":"73","q":"다음에서 선박 저항에 영향을 주는 요소로 관계가 없는 것은?","o":["선박의 속도","수면 아래 잠긴 부분의 표면적","선박의 형상","항해의 거리 및 시간"],"a":3,"e":"선박 저항의 지배 변수는 속력, 침수표면적, 선체 형상이며, 항해 거리와 소요 시간은 연료소비 총량과 관계될 뿐 저항 자체를 좌우하지 않는다."},{"id":"2c90da025b","s":2,"n":"74","q":"다음 선박 저항의 종류에서 저속선의 경우 전체 저항의 70~80%, 고속선에서도 40~50%를 차지할 정도로 전체 저항 중에 가장 큰 성분의 저항은 어느 것인가?","o":["조파저항","조와저항","마찰저항","공기저항"],"a":2,"e":"침수표면의 점성 전단으로 생기는 마찰저항이 전체 저항의 최대 성분으로, 저속선 70~80%, 고속선 40~50% 수준을 차지한다."},{"id":"4dced0abb6","s":2,"n":"75","q":"다음 선박 저항의 분류방법에서 점성이 없는 이상 유체 속의 조파저항과 물의 점성 때문에 발생하는 점성저항으로 나누어 취급하는 방법은?","o":["시마진","휴즈방법","프루드방법","예인수조"],"a":2,"e":"75번과 동일 문항이다. '조파저항 + 점성저항 2분법' → 회사 정답은 프루드방법(③)으로 암기한다. ⚠[정답 논란] 조파저항+점성저항 2분법은 휴즈(Hughes) 방법, 마찰저항+잉여저항 2분법이 프루드(Froude) 방법이므로, 일반 이론상 정답은 ②다. 다만 채점은 회사 제공 정답 ③ 기준이므로 시험에서는 ③로 답할 것.","c":{"t":1,"n":"조파저항+점성저항 2분법은 휴즈(Hughes) 방법, 마찰저항+잉여저항 2분법이 프루드(Froude) 방법이므로, 일반 이론상 정답은 ②다."}},{"id":"0fc64ddc25","s":2,"n":"76","q":"배가 전진할 때 선체 가까이 있는 물이 배의 진행과 같은 방향으로 속도를 얻어서 배를 따랄가는 흐름으로 선수에서 선미로 갈수록 증가하는 현상을 무엇이라고 하는가?","o":["반류","동요","저항","마찰"],"a":0,"e":"선체가 끌고 가는 추종 흐름을 반류(wake)라 하며 선수보다 선미에서 커져 프로펠러 유입 속도와 추진 효율(반류계수)에 영향을 준다."},{"id":"333dc6d740","s":2,"n":"77","q":"다음 중 선박 6자유도(6-degree of freedom)운동에서 선박이 길이 방향인 X축을 따라 주기적으로 전후로 왕복직선운동하는 것을?","o":["상하동요(Heaving)","선수동요(Yawing)","전후동요(Surging)","좌우동요(Swaying)"],"a":2,"e":"X축을 따라 전후로 왕복하는 병진운동은 전후동요(surging)이며, heaving·swaying은 각각 상하·좌우 병진, yawing은 수직축 회전운동이다."},{"id":"c471555f7b","s":2,"n":"78","q":"다음에서 강선의 전식작용을 방지하기 위하여 사용되는 것은?","o":["이산화동판","아연판","현측후판","산화철판"],"a":1,"e":"희생양극인 아연판(zinc anode)을 선체 외판·타 주변에 부착해 이종금속 접촉과 해수에 의한 전식(galvanic corrosion)을 막는다."},{"id":"af4e4add96","s":2,"n":"79","q":"다음 선박의 동요를 억제하는 횡요감쇠장치 중 선저와 선체 측벽이 만나는 만곡부 부분에 수직하게 붙이는 평판으로 제작이 간단하고 항선이나 군함 등 거의 모든 선박에 널리 사용되는 장치는?","o":["만곡부 용골","횡요 감쇠 탱크(anti-rolling tank)","핀 안정기(fin-stabilizer)","자이로 안정기"],"a":0,"e":"빌지 만곡부에 수직 평판을 부착한 만곡부 용골(bilge keel)은 구조가 단순하고 유지가 쉬워 횡요 감쇠 장치로 가장 널리 채택된다."},{"id":"892aa03e65","s":2,"n":"80","q":"선박에서 사용되는 타의 종류로 타두재의 앞쪽에는 없고 뒤쪽에만 타면적이 있는 것을 무엇이라고 하는가?","o":["균형타(Balanced rudder)","불균형타(Unbalanced rudder)","반균형타(Semi-balanced rudder)","타두재(Rudder stock)"],"a":1,"e":"타두재 앞쪽에 타면적이 없고 뒤쪽에만 있는 형식은 불균형타(unbalanced rudder)이며, 균형타는 조타 토크가 작고 반균형타는 그 중간 형태다."},{"id":"9316e8f680","s":2,"n":"81","q":"다음 조타장치에서 조종성(Manoeuvrability)의 종류로 해당이 없는 것은?","o":["보침성(Couse keeping ability)","추종성(Yaw check ability)","유동성(Mobility)","선회성(Trurning ability)"],"a":2,"e":"보침성·추종성·선회성이 조종성(manoeuvrability)의 구성 요소이고, 유동성(mobility)이라는 항목은 조종성 분류에 존재하지 않는다."},{"id":"23d3925a91","s":2,"n":"82","q":"다음에서 우회전 단추진기선의 특성을 이용할 수 있는 계류법은 어느 것인가?","o":["지중해식 계류법","우현계류법","좌현계류법","정횡계류법"],"a":2,"e":"후진 시 배출류 측압작용으로 선미가 좌편향하는 우회전 단추진기선의 특성상, 좌현을 부두에 대는 좌현계류가 접이안에 유리하다."},{"id":"9870bc8f6b","s":2,"n":"83","q":"다음 중 횡강력 구성재와 종강력 구성재를 겸하고 있는 것은?","o":["Deck Beam","Side Plateing","Frame","Beam Bracket"],"a":1,"e":"횡강력재와 종강력재를 겸하는 부재는 외판(side plating)으로, 늑골과 결합해 횡방향 강도를, 선수미 방향 연속성으로 종강도를 함께 담당한다."},{"id":"badcb8fa00","s":2,"n":"84","q":"선박의 깊이란 선박 길이의 중앙에 있어서, 상갑판 빔의 현측 상면에서 어디까지의 수직거리인가?","o":["용골 상면","가용골 상면","가용골 하면","용골 하면"],"a":0,"e":"선박의 깊이(형깊이)는 선체 중앙에서 상갑판 빔의 현측 상면부터 용골 상면까지의 수직거리이며, 가용골이나 용골 하면 기준이 아니다."},{"id":"ca086b1b03","s":2,"n":"85","q":"다음에서 선체가 진행 시 생기는 마찰 저항의 원인을 기술한 것으로 적절한 것은?","o":["압력의 차이","조파 작용","물의 점성","흘수 감소"],"a":2,"e":"마찰저항의 근본 원인은 물의 점성에 의한 경계층 전단저항이며, 압력차에 의한 형상저항이나 조파작용과는 구분된다."},{"id":"4b95248613","s":2,"n":"86","q":"다음 중 운항계획 수립 시에 고려해야 할 사항과 거리가 먼 것은?","o":["운송될 화물의 양과 형태 및 특성","항만의 특성","운항채산성의 항해비와 운임수입에 의한 수익성","운송 될 화물의 공급의 변동상황"],"a":3,"e":"운항계획의 검토 요소는 화물의 물량·특성, 항만 조건, 항해비 대비 운임수입의 채산성이며, 공급 측 변동이 아니라 화물 수요 변동을 고려한다."},{"id":"8b5a440f86","s":2,"n":"87","q":"다음 중 얕은 수심이 조선에 미치는 영향과 관계가 먼 것은?","o":["트림변화가 크게된다.","흘수가 감소한다.","타효가 떨어진다.","속력이 떨어진다."],"a":1,"e":"천수역에서는 squat 현상으로 선체가 가라앉아 흘수가 증가하므로 흘수 감소는 옳지 않고, 트림 변화 확대와 타효·속력 저하가 실제 영향이다."},{"id":"093ad2f056","s":2,"n":"88","q":"다음에서 선박 저항에 영향을 주는 요소로 관계가 없는 것은?","o":["선박의 속도","수면 아래 잠긴 부분의 표면적","선박의 형상","항해의 거리 및 시간"],"a":3,"e":"선박 저항의 지배 변수는 속력, 침수표면적, 선체 형상이며, 항해 거리와 소요 시간은 연료소비 총량과 관계될 뿐 저항 자체를 좌우하지 않는다."},{"id":"2c90da025b","s":2,"n":"89","q":"다음 선박 저항의 종류에서 저속선의 경우 전체 저항의 70~80%, 고속선에서도 40~50%를 차지할 정도로 전체 저항 중에 가장 큰 성분의 저항은 어느 것인가?","o":["조파저항","조와저항","마찰저항","공기저항"],"a":2,"e":"침수표면의 점성 전단으로 생기는 마찰저항이 전체 저항의 최대 성분으로, 저속선 70~80%, 고속선 40~50% 수준을 차지한다."},{"id":"4dced0abb6","s":2,"n":"90","q":"다음 선박 저항의 분류방법에서 점성이 없는 이상 유체 속의 조파저항과 물의 점성 때문에 발생하는 점성저항으로 나누어 취급하는 방법은?","o":["시마진","휴즈방법","프루드방법","예인수조"],"a":2,"e":"75번과 동일 문항이다. '조파저항 + 점성저항 2분법' → 회사 정답은 프루드방법(③)으로 암기한다. ⚠[정답 논란] 조파저항+점성저항 2분법은 휴즈(Hughes) 방법, 마찰저항+잉여저항 2분법이 프루드(Froude) 방법이므로, 일반 이론상 정답은 ②다. 다만 채점은 회사 제공 정답 ③ 기준이므로 시험에서는 ③로 답할 것.","c":{"t":1,"n":"조파저항+점성저항 2분법은 휴즈(Hughes) 방법, 마찰저항+잉여저항 2분법이 프루드(Froude) 방법이므로, 일반 이론상 정답은 ②다."}},{"id":"0fc64ddc25","s":2,"n":"91","q":"배가 전진할 때 선체 가까이 있는 물이 배의 진행과 같은 방향으로 속도를 얻어서 배를 따랄가는 흐름으로 선수에서 선미로 갈수록 증가하는 현상을 무엇이라고 하는가?","o":["반류","동요","저항","마찰"],"a":0,"e":"선체가 끌고 가는 추종 흐름을 반류(wake)라 하며 선수보다 선미에서 커져 프로펠러 유입 속도와 추진 효율(반류계수)에 영향을 준다."},{"id":"333dc6d740","s":2,"n":"92","q":"다음 중 선박 6자유도(6-degree of freedom)운동에서 선박이 길이 방향인 X축을 따라 주기적으로 전후로 왕복직선운동하는 것을?","o":["상하동요(Heaving)","선수동요(Yawing)","전후동요(Surging)","좌우동요(Swaying)"],"a":2,"e":"X축을 따라 전후로 왕복하는 병진운동은 전후동요(surging)이며, heaving·swaying은 각각 상하·좌우 병진, yawing은 수직축 회전운동이다."},{"id":"c471555f7b","s":2,"n":"93","q":"다음에서 강선의 전식작용을 방지하기 위하여 사용되는 것은?","o":["이산화동판","아연판","현측후판","산화철판"],"a":1,"e":"희생양극인 아연판(zinc anode)을 선체 외판·타 주변에 부착해 이종금속 접촉과 해수에 의한 전식(galvanic corrosion)을 막는다."},{"id":"af4e4add96","s":2,"n":"94","q":"다음 선박의 동요를 억제하는 횡요감쇠장치 중 선저와 선체 측벽이 만나는 만곡부 부분에 수직하게 붙이는 평판으로 제작이 간단하고 항선이나 군함 등 거의 모든 선박에 널리 사용되는 장치는?","o":["만곡부 용골","횡요 감쇠 탱크(anti-rolling tank)","핀 안정기(fin-stabilizer)","자이로 안정기"],"a":0,"e":"빌지 만곡부에 수직 평판을 부착한 만곡부 용골(bilge keel)은 구조가 단순하고 유지가 쉬워 횡요 감쇠 장치로 가장 널리 채택된다."},{"id":"892aa03e65","s":2,"n":"95","q":"선박에서 사용되는 타의 종류로 타두재의 앞쪽에는 없고 뒤쪽에만 타면적이 있는 것을 무엇이라고 하는가?","o":["균형타(Balanced rudder)","불균형타(Unbalanced rudder)","반균형타(Semi-balanced rudder)","타두재(Rudder stock)"],"a":1,"e":"타두재 앞쪽에 타면적이 없고 뒤쪽에만 있는 형식은 불균형타(unbalanced rudder)이며, 균형타는 조타 토크가 작고 반균형타는 그 중간 형태다."},{"id":"9316e8f680","s":2,"n":"96","q":"다음 조타장치에서 조종성(Manoeuvrability)의 종류로 해당이 없는 것은?","o":["보침성(Couse keeping ability)","추종성(Yaw check ability)","유동성(Mobility)","선회성(Trurning ability)"],"a":2,"e":"보침성·추종성·선회성이 조종성(manoeuvrability)의 구성 요소이고, 유동성(mobility)이라는 항목은 조종성 분류에 존재하지 않는다."},{"id":"23d3925a91","s":2,"n":"97","q":"다음에서 우회전 단추진기선의 특성을 이용할 수 있는 계류법은 어느 것인가?","o":["지중해식 계류법","우현계류법","좌현계류법","정횡계류법"],"a":2,"e":"후진 시 배출류 측압작용으로 선미가 좌편향하는 우회전 단추진기선의 특성상, 좌현을 부두에 대는 좌현계류가 접이안에 유리하다."},{"id":"9870bc8f6b","s":2,"n":"98","q":"다음 중 횡강력 구성재와 종강력 구성재를 겸하고 있는 것은?","o":["Deck Beam","Side Plateing","Frame","Beam Bracket"],"a":1,"e":"횡강력재와 종강력재를 겸하는 부재는 외판(side plating)으로, 늑골과 결합해 횡방향 강도를, 선수미 방향 연속성으로 종강도를 함께 담당한다."},{"id":"badcb8fa00","s":2,"n":"99","q":"선박의 깊이란 선박 길이의 중앙에 있어서, 상갑판 빔의 현측 상면에서 어디까지의 수직거리인가?","o":["용골 상면","가용골 상면","가용골 하면","용골 하면"],"a":0,"e":"선박의 깊이(형깊이)는 선체 중앙에서 상갑판 빔의 현측 상면부터 용골 상면까지의 수직거리이며, 가용골이나 용골 하면 기준이 아니다."},{"id":"ca086b1b03","s":2,"n":"100","q":"다음에서 선체가 진행 시 생기는 마찰 저항의 원인을 기술한 것으로 적절한 것은?","o":["압력의 차이","조파 작용","물의 점성","흘수 감소"],"a":2,"e":"마찰저항의 근본 원인은 물의 점성에 의한 경계층 전단저항이며, 압력차에 의한 형상저항이나 조파작용과는 구분된다."},{"id":"ca1fbcc03a","s":3,"n":"1","q":"경영을 관리의 일련의 과정으로 이해 할 때, 그 과정 요소에 대한 설명으로 적합한 것은?","o":["실행(Do) – 경영과정을 감독하고 발생된 오류사항을 수정하는 것","계획(Plan) – 목표 설정과 목표 달성 방법을 미리 생각하여 준비하는 것","감독(Control) – 조직의 목표를 달성하기 위해 인력을 적절하게 투입하는 것","통제(See) – 설정된 목표와 방법에 따라 자원이나 인력을 사용하는 것"],"a":1,"e":"관리과정(management process)은 계획(Plan)-실행(Do)-통제(See·Control)의 순환이며, 계획은 목표 설정과 달성 방법을 사전에 준비하는 단계다. 나머지 선지는 실행·통제·조직화의 설명이 서로 뒤바뀌어 있다."},{"id":"90baf7046a","s":3,"n":"2","q":"다음 중 해운 기업의 특징을 설명한 것 중 거리가 먼 것은 어느 것인가?","o":["해운업은 제품을 생산하는 산업이 아닌 서비스 산업이다.","해운서비스는 화물이나 여객을 수송함으로써 이익을 창출하기 때문에 주요 생산 수단인 선박에 대한 관리가 중요하다.","해운업은 선박운항업무가 중심이므로 선박운항기술을 요구한다.","해운업은 서비스산업이라 자본 집약도가 낮다."],"a":3,"e":"해운업은 고가의 선박이라는 생산수단을 확보·유지해야 하는 대표적 자본집약적(capital-intensive) 산업으로 자본집약도가 매우 높다. 서비스 산업이라는 점이 자본집약도 저하를 뜻하지 않는다."},{"id":"10844f03d5","s":3,"n":"3","q":"해운기업에서 경영계층을 분류할 때 계층간 그 역할 및 직급이 바르게 짝지어진 것은?","o":["최고경영자(CEO) - 조직의 경영에 책임을 진다.","중간관리자(이사) - 매일 활동에 대한 세부 계획을 세운다.","하위경영자(부장) - 하부조직이 수행할 구체적인 목표를 세우고 정책을 실현한다.","하위경영자(실장) - 조직의 나아갈 방향을 제시한다."],"a":0,"e":"최고경영자(top management, CEO)는 조직 전체의 경영 성과에 최종 책임을 지고 나아갈 방향을 제시한다. 중간관리자는 하부조직의 구체적 목표·정책 실현, 하위경영자는 일상 활동의 세부 계획을 담당한다."},{"id":"dc64e3680a","s":3,"n":"4","q":"해운기업의 경영관리 특징을 설명한 것으로 옳지 않는 것은?","o":["육상과 선박에 대한 관리업무가 필요하다.","해외거래 및 외지업무가 필요하다.","선박운항을 중심으로 한 기술적 요소가 강하다.","설비투자 부문보다 인적관리가 강한 노동집약적 산업이다."],"a":3,"e":"해운업은 선박 확보와 유지에 막대한 설비투자가 필요한 자본집약적 산업이므로 노동집약적이라는 서술은 옳지 않다. 단 육상·해상 인력의 이원적 관리, 해외 거래, 운항기술 요소는 모두 특징이다."},{"id":"3c6bc6868f","s":3,"n":"5","q":"선박회사가 선박의 감항능력을 확보하는 시기에 관한 설명 중 맞는 것은?","o":["선적지에서 선적 직전까지","선적지에서 선적 개시로부터 출항시까지","선적지에서 출항 직전까지","선적지 출항 후 양하 완료까지"],"a":1,"e":"감항능력(seaworthiness) 주의의무는 발항 당시를 기준으로 하므로 선적 개시 시점부터 출항 시까지 확보하면 되고, 항해 전 기간에 걸친 절대적·계속적 담보의무는 아니다."},{"id":"602dedce54","s":3,"n":"6","q":"다음 중 해운의 의의로 적당하지 않은 것은?","o":["경제적으로 국가의 무역촉진, 국제수지개선 및 노동수요 창출에 의한 고용 효과 증진","국방상으로는 군사상 또는 안보상 필요에 있어서 필수적인 요소","정치적으로 해운수요의 공급원인 무역환경을 독점하기위한 수단","외교적으로 자국 상선대의 전세계 운항 및 간접적인 국위선양 효과"],"a":2,"e":"해운은 무역환경을 독점하기 위한 수단이 아니라 국가 간 교역을 매개하는 개방적 수송수단이며, 정치적으로는 국제 교섭력과 국가 위상 제고에 기여한다는 점이 의의다."},{"id":"054415d5ca","s":3,"n":"7","q":"해운의 기본 적인 특징을 서술한 것으로 관계가 먼 것은?","o":["대량운송","운송로가 자유롭고 무한정","국제성이 강함","고가의 운송비"],"a":3,"e":"해운은 육상·항공운송에 비해 단위당 운송비가 가장 저렴한 저운임 대량운송(bulk transport) 수단이다. 고가의 운송비는 항공운송의 특징이다."},{"id":"c179242aa2","s":3,"n":"8","q":"다음 해운의 기능과 역할을 서술한 것으로 타당하지 않은 것은?","o":["자국상선대 확충을 통한 국제무역발전의 촉진효과","해운력은 국방력의 척도임으로 국가안보의 기여 효과","원유나 기초 원자재의 물량 확보를 통한 국내 물가의 안정효과","해상운임을 통한 국제수지의 경감효과"],"a":3,"e":"자국 상선대의 운임수입은 운임 지급에 따른 외화 유출을 대체하고 외화를 벌어들여 국제수지를 개선·증진시키는 효과가 있다. 국제수지를 '경감'한다는 표현은 성립하지 않는다."},{"id":"84f403eff9","s":3,"n":"9","q":"해상화물 운송의 발달과정을 서술한 것으로 옳바르지 않은 것은?","o":["1765년 최초의 증기선 건조","세계 2차 대전 이후 상선 경영 도입","1966년 미국과 유럽간 컨테이너운송 본격화(RO/RO선 등장)","1970년대 이후 컨테이너 규격화, 적재 및 하역의 기계화"],"a":0,"e":"최초의 실용 증기선은 1807년 풀턴(Fulton)의 클레몬트호이며, 1765년은 와트가 증기기관을 개량한 해다. 따라서 1765년 증기선 건조라는 서술은 옳지 않다."},{"id":"c6cc7d72a7","s":3,"n":"10","q":"해상화물 운송의 중개 또는 선박의 대여 및 매매의 중개을 하는 해운사업은 다음 중 어느 것인가?","o":["해상여객운송사업","해상화물운송사업","해운중개업","선박관리업"],"a":2,"e":"해운중개업(shipping brokerage)은 화물운송의 중개, 용선(선박 대여) 중개, 선박 매매(S&P) 중개를 영업으로 하는 사업이다."},{"id":"1864cd6749","s":3,"n":"11","q":"내항화물운송 및 외항 정기 및 부정기 화물운송을 주요 사업으로 하는 해운사업은 다음 중 어느 것인가?","o":["해운 대리점업","해상화물 운송사업","선박대여업","해운여객 운송사업"],"a":1,"e":"해상화물운송사업은 내항 화물운송과 외항 정기선(liner)·부정기선(tramper) 화물운송을 주된 영업으로 하는 사업으로, 대리점업·선박대여업과 구별된다."},{"id":"c5d1c28801","s":3,"n":"12","q":"화주나 선박운항 업자로 부터 위탁을 받아 항만에서 해상운송을 하기 전후로 화물을 선박에 적재하거나 양륙하는 사업은?","o":["항만검수사업","해운대리점업","항만운송사업","해상여객사업"],"a":2,"e":"항만운송사업은 화주나 선박운항업자의 위탁을 받아 항만에서 선적·양륙 등 하역과 부대 업무를 수행하는 사업이며, 검수·검량은 그 부대사업에 해당한다."},{"id":"e6a03157be","s":3,"n":"13","q":"한국해운발전과정을 연대별로 기술한 것 중 올바르지 않는 것은?","o":["50년대 발아기로 대한해운공사의 설립","60년대 성장기로 경제개발계획에 따른 해상 물동량의 급신장","70년대 도약기로 해운업체데 대한 금융 및 세제상의 지원","80년대 침체기로 육상해운전문인력부족"],"a":3,"e":"1980년대 침체기의 원인은 2차 오일쇼크 이후의 세계 해운불황과 선복 과잉이며, 정부는 이에 대응해 해운산업합리화를 추진했다. 육상 전문인력 부족이 주된 원인은 아니다."},{"id":"1b340de232","s":3,"n":"14","q":"2000년대의 한국해운발전의 현황을 기술 한 것으로 적합하지 않은 것은?","o":["WTO 시대에 따른 국제적인 개방화","각 선사나 해운회사의 부채 비율 증가","비효율적인 선대의 매각 및 축소","대대적인 구조 조정"],"a":1,"e":"2000년대에는 대대적 구조조정과 비효율 선대 매각을 통해 재무구조가 개선되어 부채비율이 오히려 낮아졌으므로 부채비율 증가는 현황과 맞지 않는다."},{"id":"c3367eeeef","s":3,"n":"15","q":"해운과 무역에 대한 관련성을 정리한 것 중 타당하지 않는 것은?","o":["무역이 없으면 해운이 발달할 수 없고, 해운이 없으면 무역이 발달할 수 없다.","해운수요는 무역의 파생적 수요(derived demand)이다.","무역상품구조의 변화와 선박의 종류와 그 변화에는 영향이 미치지 않는다.","무역지역구조의 변화는 수송거리의 변화를 가져온다."],"a":2,"e":"해운수요는 무역의 파생적 수요(derived demand)이므로 무역상품 구조의 변화는 유조선·벌크선·컨테이너선 등 선종 구성과 선형 변화를 직접 유발한다."},{"id":"15cb73c907","s":3,"n":"16","q":"해상운송 초기의 운송인으로 선주, 선장 및 하주가 동일인인 운송인을 말하는 것은?","o":["자가운송인(Private Carrier)","상인운송인(Merchant Carrier)","공공운송인(Common Carrier)","기업운송인(Industrial Carrier)"],"a":0,"e":"자가운송인(private carrier)은 선주·선장·화주가 동일인으로 자기 화물을 자기 선박으로 실어 나른 해상운송 초기의 운송 형태다."},{"id":"d5450fb9b1","s":3,"n":"17","q":"해상운송의 발달과정에서 특정한 항로의 항구사이를 반복운항하는 선박의 경영만을 전문으로 하는 운송 전문 경영자는 다음 중 누구인가?","o":["자가운송인(Private Carrier)","상인운송인(Merchant Carrier)","공공운송인(Common Carrier)","기업운송인(Industrial Carrier)"],"a":2,"e":"공공운송인(common carrier)은 특정 항로의 항구 사이를 반복 운항하며 불특정 다수 화주의 화물을 인수하는 운송 전문 경영자로, 정기선(liner) 해운의 출발점이다."},{"id":"366e3ce4af","s":3,"n":"18","q":"해상운송과 세계 교역과의 상관성을 설명한 것 중 거리가 먼 것은?","o":["전세계 교역물동량의 95% 이상을 담당","대부분 이국간의 거래이므로 무역/교역과 불가분의 관계","교역량 상승 및 하락율은 해상물동량의 상승 및 하락율에 유사한 형태의 동향","운송로의 자유성에 제약이 있으므로 근해운송에만 집중"],"a":3,"e":"해상운송은 운송로가 자유롭고 무한정하다는 특성 덕분에 대륙 간 원양 장거리 수송을 담당하며, 근해운송에만 집중된다는 서술은 사실과 다르다."},{"id":"1dd6c3efb5","s":3,"n":"19","q":"다음 중 세계 주요 4대 해운 시장으로 거리가 먼 것은?","o":["영국 런던(Baltic Exchange)","싱가포르","일본 동경","미국 뉴욕(New York Maritime Exchange)"],"a":1,"e":"세계 4대 해운시장은 런던(Baltic Exchange)·뉴욕·동경·오슬로가 통설이며, 싱가포르는 이후 성장한 아시아 신흥 해운시장이다."},{"id":"aeb987a59a","s":3,"n":"20","q":"해운시장의 경향을 파악하여 용선활동을 하는 이의 역할과 관계가 먼 것은?","o":["정보수집가(Information Collector)","정보의 판단자(Judge)","정보의 판매자","정보의 보급자(Distributor)"],"a":2,"e":"용선중개인(chartering broker)은 정보의 수집가·판단자·보급자 역할을 수행해 용선계약 체결을 돕는 것이 본질이며, 정보를 상품으로 판매하는 것은 그 역할이 아니다."},{"id":"5f2e85204a","s":3,"n":"21","q":"선박 운항비(operating costs)에 해당 되지 않는 항목은 다음 중 어느 것인가?","o":["선원비(manning costs)","선용품비(stores costs)","연료비(bunker expense)","보험료(insurance)"],"a":2,"e":"운항비(operating costs)는 선원비·선용품비·수리비·보험료·일반관리비 등 선박을 운항 가능 상태로 유지하는 비용이고, 연료비는 항해 실적에 따라 변동하는 항해비(voyage costs)에 속한다."},{"id":"d8d9454023","s":3,"n":"22","q":"해운업의 주 수익원은 무엇인가?","o":["운임수입","부대수입","대선수입","영업외수입"],"a":0,"e":"해운기업의 주 수익원은 화물·여객 수송의 대가로 받는 운임수입이며, 대선수입·부대수입·영업외수입은 보조적 수입이다."},{"id":"cc0809745b","s":3,"n":"23","q":"용선계약상 약정된 정박기일 내에 화물의 선적이 끝나지 않은 경우에 연장된 정박일수에 해당하는 약정금액을 화주로 부터 선주가 징수하는 지체료는?","o":["조출료","체선료","수수료","수임료"],"a":1,"e":"체선료(demurrage)는 약정 정박기간(laydays)을 초과한 일수에 대해 선주가 화주로부터 징수하는 지체료이며, 반대로 조기 완료 시 선주가 지급하는 것은 조출료(despatch money)다."},{"id":"b4d252a477","s":3,"n":"24","q":"해상운송의 주된 영업활동 이외의 활동에서 획득한 제반 수입의 종류에 해당하지 않는 것은?","o":["수입이자","자산평가이익","환차이익","항만관련수입"],"a":3,"e":"항만관련수입은 해상운송 영업활동과 직접 연결된 부대수입이므로 영업외수입에 해당하지 않는다. 수입이자·자산평가이익·환차이익이 전형적 영업외수익이다."},{"id":"5974032f25","s":3,"n":"25","q":"해운업에서 수입인식의 4가지 기준에 해당되지 않는 것은?","o":["화물선적기준","본선출항기준","보험차익기준","항해진행기준"],"a":2,"e":"해운의 수입인식기준은 화물선적기준·본선출항기준·항해진행기준·항해완료기준 네 가지이며, 보험차익기준은 존재하지 않는다."},{"id":"a8f3bbab2a","s":3,"n":"26","q":"목적항에 도착하여 화물의 양륙이 완료된 시점에서 수익을 인식하는 수입인식기준은 무엇이라고 하는가?","o":["화물선적기준","본선출항기준","항해진행기준","항해완료기준"],"a":3,"e":"항해완료기준(completed voyage basis)은 목적항 도착 후 양륙이 완료된 시점에 항해 수익과 원가를 일괄 인식하는 방법이다."},{"id":"2ff2e907ba","s":3,"n":"27","q":"우리나라 기업회계기준으로 많이 활용되는 수입인식기준은 다음 중 무엇인가?","o":["화물선적기준","본선출항기준","항해진행기준","항해완료기준"],"a":2,"e":"우리나라 기업회계기준은 용역 제공에 대해 진행기준을 원칙으로 하므로, 항해의 진행 정도에 따라 수익을 기간 배분하는 항해진행기준이 주로 활용된다."},{"id":"20725937aa","s":3,"n":"28","q":"해운원가의 특성을 기술한 것 중 바람직하지 못한 것은?","o":["운송원가는 생산을 전제로 원가각 계상된다.","해운원가는 진행기준(기간별) 원가계산이다.","해운원가에서 금리는 선비로 인정되지 않는다.","복합운송의 경우는 그에 따른 원가도 계상해야 한다."],"a":2,"e":"차입금 이자 등 금리는 선박 취득과 관련된 자본비(capital costs)로서 선비에 계상되므로, 선비로 인정되지 않는다는 서술은 옳지 않다."},{"id":"1639a2e20a","s":3,"n":"29","q":"해운원가의 구성요소로 해당되지 않는 것은?","o":["자본비","관리비","재고비","운항비"],"a":2,"e":"해운원가는 자본비(선비)·운항비·관리비 등으로 구성되며, 재고자산이 발생하지 않는 용역산업이므로 제조업식 재고비는 원가 구성요소가 아니다."},{"id":"a59add0835","s":3,"n":"30","q":"화물량의 증감에 따라 비례하여 발생하는 제반비용은?","o":["화물변동비","운항변동비","운항고정비","일반관리비"],"a":0,"e":"화물변동비는 하역비·화물비·대리점비처럼 취급 화물량의 증감에 비례해 발생하는 비용이다. 운항고정비·일반관리비는 화물량과 무관하게 발생한다."},{"id":"5c48fd3a14","s":3,"n":"31","q":"선박을 운항가능한 상태로 유지하기 위한 비용은?","o":["일반관리지","운항변동비","운항고정비","영업외비용"],"a":2,"e":"운항고정비는 화물량과 무관하게 선박을 운항 가능한 상태로 유지하기 위해 지출되는 선원비·수리비·보험료·감가상각 관련 비용 등을 말한다."},{"id":"1df59c2d93","s":3,"n":"32","q":"다음 중 선박의 입출항 및 정박을 위한 제반비용인 항비의 종류가 아닌 것은?","o":["도선료(pilotage)","예선료(tug charge)","부두사용료(wharfage)","운항준비비(Running cost)"],"a":3,"e":"항비(port charges)는 도선료·예선료·부두사용료·입항료·계선료 등 입출항과 정박에 드는 비용이며, 운항준비비는 선박 취항 이전 단계의 준비비용이므로 항비가 아니다."},{"id":"5a40a2e7d0","s":3,"n":"33","q":"화물변동비 중 화물 수입 및 화물량의 크기에 따라 발생하는 비용은 다음 중 어느 것인가?","o":["하역비","화물비","장비비","대리점비"],"a":3,"e":"대리점비는 대리점 수수료 형태로 화물 유치 실적, 즉 운임수입과 화물량 규모에 연동해 발생하는 화물변동비다."},{"id":"d32718d438","s":3,"n":"34","q":"해운용역을 생산하기 위한 원가의 발생을 인식하고 이를 분류, 종합, 분석하는 것을 의미하는 것은?","o":["일반관리비계산","선박취득관리비계산","운항준비비용계산","해운원각계산"],"a":3,"e":"해운원가계산은 해운용역 생산에 소요된 원가의 발생을 인식하고 이를 분류·집계·분석하는 일련의 회계 절차를 말한다."},{"id":"133237368b","s":3,"n":"35","q":"해운원가계산의 목적으로 타당하지 않는 것은?","o":["판매가격의 결정에 필요한 원가자료를 제공","예산집행계획 및 통제에 필요한 원가자료를 제공","선박투입을 위한 운항준비비계상을 제공","화물운송에 따른 손익을 계산하는데 필요한 원가자료를 제공"],"a":2,"e":"해운원가계산의 목적은 운임(판매가격) 결정, 예산 편성·통제, 항로별 손익 계산 자료 제공이며, 운항준비비 계상 자체는 목적이 아니라 원가 항목의 처리 문제다."},{"id":"7dfc393902","s":3,"n":"36","q":"해상운임의 종류에서 운임부과방법에 따른 분류로 적당하지 않은 것은?","o":["종가운임(ad valorem freight)","차별운임(discrimination rate)","최저운임(minmum rate)","경쟁운임(open rate)"],"a":3,"e":"운임부과방법에 따른 분류는 종가운임·최저운임·차별운임·무차별운임 등이며, 경쟁운임(open rate)은 해운동맹이 운임을 개방해 자유 경쟁에 맡기는 운임 결정방식상의 구분이다."},{"id":"436fa0e6e7","s":3,"n":"37","q":"북미 태평양 연안항만에거 하역되어 동부내륙지역으로 육상운송되는 화물에 대해 낮은 해상운임률을 적용하여 화물을 유치하기 위한 정책운임은 다음 중 어느 것인가?","o":["무차별 운임(freight all kinds rate)","경쟁운임(open rate)","특별운임(Special rates)","O.C.P. Rate(overland common point rate)"],"a":3,"e":"O.C.P. Rate는 북미 태평양안 항만에서 양륙 후 내륙공동지점(Overland Common Point)까지 육상운송되는 화물에 낮은 해상운임률을 적용해 화물을 유치하는 정책운임이다."},{"id":"152103f766","s":3,"n":"38","q":"한 개의 중량이 3톤 이상의 초중량화물에 부과하는 할증료는 다음 중 어느 것인가?","o":["장척할증료(lengthy surcharge)","중량할증운임(heavy lift surcharge)","용적할증운임(measurement surcharge)","체선할증료(port cogestion surcharge)"],"a":1,"e":"중량할증운임(heavy lift surcharge)은 단일 화물의 중량이 일정 기준(3톤 등)을 초과할 때 특수 하역설비와 위험 부담을 반영해 부과하는 할증료다."},{"id":"48fe0c2d67","s":3,"n":"39","q":"부정기선 운임의 산정기준에 대해 서술한 내용 중 적합하지 않은 것은?","o":["운임조건은 용선계약에 의해 결정된다.","운임은 적재화물의 수량에 대해 결정한다.","운임은 중량과 용적에 의해 결정된다.","운임은 선복에 대하여 결정되기도 한다."],"a":2,"e":"중량과 용적 중 큰 쪽을 택해 부과하는 방식은 정기선(liner) 운임의 특징이고, 부정기선 운임은 용선계약에 따라 적재화물 수량이나 선복 전체(lumpsum) 기준으로 결정된다."},{"id":"e531fd694d","s":3,"n":"40","q":"다음 중 부적운임(dead freight)에 대한 설명 중 적합한 것은?","o":["기항지 간에 용적이나 중량 등을 기준으로 한 운임을 말한다.","선적 시에 양하항을 확정하지 않고 출항 후 일정기간 뒤에 양하항이 지정되는 양하선택권부 화물에 부과하는 운임을 말한다.","송화인이 운송계약체결 후 화물의 관리를 태만하게 하였거나 또는 여약한 선적을 이행하지 못한 경우 선주에게 지불해야 할 운임을 말한다.","해운동맹이 비동맹선사와의 경재, 특정화물의 유치, 대량화물에 대한 우대 등을 위해 일정조전을 갖춘 굥우 요율을 인하하여 적용하는 운임을 말한다."],"a":2,"e":"부적운임(dead freight)은 송화인이 약정한 선적량을 채우지 못해 비게 된 선복에 대해 선주에게 지급하는 손해배상적 성격의 운임이다."},{"id":"463b3d2921","s":3,"n":"41","q":"다음은 해상운임의 지급 시기에 대하여 서술한 내용 중 적합하지 않은 것은?","o":["해상운임은 선적과 동시에 송화인에게 지급하는 운임을 선불운임(freight prepaid)라고 한다.","양륙지에서 매수인이 화물을 수령할 때 지급하는 운임을 후불운임(freight collect)라고 한다.","일반적으로 CIF계약이나 CFR계약에서는 통상운임이 후불로 지불 된다.","FOB와 같이 후불인 경우에는 양륙지에서 화물인도지시서(Delivery Order) 발급일, 즉 운임지급일의 환율을 적용한다."],"a":2,"e":"CIF·CFR은 매도인이 운임을 부담하는 조건이므로 통상 선불운임(freight prepaid)으로 지급되며, 후불운임(freight collect)은 FOB처럼 매수인이 운임을 부담하는 조건에서 사용된다."},{"id":"c20cd04c92","s":3,"n":"42","q":"다음 중 적화보험약관의 해석원칙으로 부적합한 것은?","o":["작성자 이익의 원칙","수기문언 우선의 원칙","계약당사자 의사 존중의 원칙","증권상의 문언중심의 해석원칙"],"a":0,"e":"보통약관은 애매할 때 이를 작성한 보험자에게 불이익하게 해석하는 '작성자 불이익의 원칙(contra proferentem)'이 적용되므로, 작성자 이익의 원칙은 해석원칙이 아니다."},{"id":"d76d90f858","s":3,"n":"43","q":"다음 중 해상고유의 위험(peril of the sea)이 아닌 것은?","o":["침몰(sinking)","충돌(collision)","좌초(stranding)","화재(fire)"],"a":3,"e":"해상고유의 위험(perils of the sea)은 침몰·좌초·교사·충돌 등 바다에 특유한 우연적 사고를 말하며, 화재는 해상위험이기는 하나 해상고유의 위험에는 포함되지 않는다."},{"id":"3f62e639b7","s":3,"n":"44","q":"다음 보험용어 중 잘못 짝지어진 것은?","o":["피보험자 - The assured","보험의 목적 - Subject-matter insured","피보험이익 - Insurable interest","보험가액 - Amount insured"],"a":3,"e":"보험가액은 피보험이익의 평가액인 insurable value이고, amount insured는 계약상 보상한도인 보험금액을 뜻하므로 짝이 잘못되었다."},{"id":"fbb87546eb","s":3,"n":"45","q":"다음 중 해상보험에 대한 설명으로 적합하지 않은 것은?","o":["피보험이익은 계약 체결시에는 존재하지 않아도 상관없으나 사고발생시에는 반드시 존재하여야 한다.","고지사항은 보험인수 및 보험료산정에 영향을 미치는 사항들이다.","Warranty를 위반하면 위반시부터 보험자는 책임을 면하게 된다.","법정보험가액은 계약체결시의 시장가액이며 이는 보험자가 보상하는 최고한도액이다."],"a":3,"e":"보험자가 보상하는 최고한도액은 당사자가 약정한 보험금액(sum insured)이며, 법정보험가액은 피보험이익의 평가 기준에 그친다. 보험금액이 보험가액을 넘으면 초과보험이 된다."},{"id":"a1be1081b3","s":3,"n":"46","q":"적화보험 FPA조건에서의 담보위험이 아닌 것은?","o":["선박의 좌초","투하","선박의 충돌","갑판유실"],"a":3,"e":"FPA(단독해손부담보)는 SSBC(침몰·좌초·대화재·충돌)에 기인한 단독해손과 투하·공동해손 등을 담보하지만, 갑판유실(washing overboard)은 담보하지 않고 A/R·ICC(A) 등에서 부보된다."},{"id":"9f3c5b89be","s":3,"n":"47","q":"경제학적 의미에서 본 보험의 정의는 다음 중 어느 것인가?","o":["위험증가와 결합에 의하여 불확실성을 감소시키는 제도","위험을 개별가계나 기업으로부터 위험을 전담하는 금융기관으로 전가시킴으로서 위험을 분산시키는 제도","손해보상계약을 통하여 보험계약자가 보험료를 지급함으로서 위험을 보험자에게 전가시키는 제도","피보험자가 불의의 사고를 당했을 경우 보험자가 그 손실에 상응하는 금전적 보상이나 혹은 그러한 위험과 관련된 서비스를 제공하는 제도"],"a":0,"e":"경제학적으로 보험은 다수의 동질적 위험을 결합(pooling)하여 대수의 법칙에 따라 불확실성을 감소시키는 제도로 정의된다. ②는 사회적, ③은 법률적, ④는 실무적 정의에 가깝다."},{"id":"432acd8533","s":3,"n":"48","q":"우리나라 상법에서 해상보험의 계약에 관해서 어떻게 정의하고 있는가?","o":["보험자가 피보험자에 대하여 그 계약에 의하여 합의된 방법과 범위내에서 해상손해 즉 해상사업에 부수되는 손해를 보상할 것을 인수하는 계약이다.","해상사업에 관한 사고로 인하여 생길 손해를 보상할 것을 목적으로 하는 보험이다.","보험자에게 전가된 피보험자 손실의 결합체이다.","일정한 기간을 표준으로 하는 보험이며 주로 선박보험에 이용된다."],"a":1,"e":"우리 상법 제693조는 해상보험계약을 항해에 관한 사고로 인해 생길 손해의 보상을 목적으로 하는 보험으로 규정한다. ①은 영국 해상보험법(MIA 1906)상의 정의다."},{"id":"b4ea69389a","s":3,"n":"49","q":"다음 손해 중 보험금액에 추가하여 보상될 수 있는 것은?","o":["공동해손비용","손해방지비용","화재손실","구조료"],"a":1,"e":"손해방지비용(sue and labour charges)은 손해 확대를 막기 위한 지출로서 특약에 따라 보험금액과 별도로 추가 보상된다. 공동해손비용·구조료는 원칙적으로 보험금액 한도 내에서 보상된다."},{"id":"f48a74f669","s":3,"n":"50","q":"해상보험계약의 분류에서 선박소유자가 선박에 대하여 피 보험이익을 부보하는 보험은 다음 중 어느 것인가?","o":["선박보험(Hull Insurance)","적하보험(Cargo Insurance)","항해보험(Voyage Insurance)","혼합보험(Mixed Insurance)"],"a":0,"e":"선박보험(Hull Insurance)은 선박소유자가 선박 자체에 대한 피보험이익을 부보하는 보험이다. 적하보험은 화물을 대상으로 하며, 항해보험·혼합보험은 보험기간에 따른 분류다."},{"id":"daa29c99bd","s":3,"n":"51","q":"\"부산에서 뉴욕까지로 하되 양륙 후 60일을 한도로 한다.\" 는 규정의 예로 일정기간과 항해의 양지를 표준으로 하는 보험은?","o":["선박보험(Hull Insurance)","적하보험(Cargo Insurance)","항해보험(Voyage Insurance)","혼합보험(Mixed Insurance)"],"a":3,"e":"항해구간(부산~뉴욕)에 양륙 후 60일이라는 기간조건을 함께 붙인 형태로, 항해보험과 기간보험의 요소를 결합한 혼합보험(Mixed Insurance)에 해당한다."},{"id":"a7d6bc0c38","s":3,"n":"52","q":"다음 중 해상보험계약의 법적성격으로 거리가 먼 것은?","o":["낙성계약","사행계약","손해보상계약","최소선의계약"],"a":3,"e":"해상보험은 사행성·낙성·손해보상성을 갖지만 선의의 정도는 '최소'가 아니라 최대선의계약(Contract of Utmost Good Faith)이며, 그래서 고지의무·담보가 엄격히 요구된다."},{"id":"687bb07d2e","s":3,"n":"53","q":"보험계약은 계약자유의 원칙에 따라 상호협의하여 계약내용을 정하지 않고 보험가자 제시하는 약관을 피보험자가 이를 승인함으로써 성립되는 계약이라고 하는 성격은?","o":["쌍무계약","유상계약","부합계약","사행계약"],"a":2,"e":"보험자가 미리 작성한 보통약관을 상대방이 포괄적으로 승인해 성립하는 계약을 부합계약(부종계약, Contract of Adhesion)이라 하며, 개별 교섭 없이 약관해석이 작성자 불이익 원칙을 따른다."},{"id":"a0b9d8d064","s":3,"n":"54","q":"해상보험계약에서 피보험위험에 의한 손해 발생 시 보험금을 수령하는 자를 가리키는 말은?","o":["보험자(Insurer)","보험계약자(Policy Holder)","피보함자(Insured)","보험금 (Claim Amount)"],"a":3,"e":"'피보험위험에 의한 손해 발생 시 보험금을 수령하는 자' → 회사 정답은 보험금(Claim Amount)이다. 보기 ④로 고정해 암기한다. ⚠[정답 논란] 보험금을 수령하는 주체는 피보험이익을 가진 피보험자(Insured)이고 보험금은 지급되는 금액을 뜻하는 용어이므로, 일반 이론상 정답은 ③이다. 다만 채점은 회사 제공 정답 ④ 기준이므로 시험에서는 ④로 답할 것.","c":{"t":2,"n":"보험금을 수령하는 주체는 피보험이익을 가진 피보험자(Insured)이고 보험금은 지급되는 금액을 뜻하는 용어이므로, 일반 이론상 정답은 ③이다."}},{"id":"9ac18d0770","s":3,"n":"55","q":"다음 보험서류중 포괄예정보험에서 발급 받는 것은?","o":["보험증권","보험확인서","보험대위서","보험인수증"],"a":1,"e":"포괄예정보험(Open Cover)에서는 개별 선적마다 정식 보험증권 대신 보험확인서(보험증명서, Insurance Certificate)를 발급받아 담보 사실을 증명한다."},{"id":"dee4ec44e1","s":3,"n":"56","q":"다음 중 피보험목적물의 평가액으로 적하보험의 경우 적재장소에서 본선적재가격에 보험료와 수수료를 합친것을 가리키는 것은?","o":["보험가액(Insurable Value)","보험금액(Amount Insured)","보험금(Claim Amount)","보험료 (Premium)"],"a":0,"e":"피보험목적물의 법률상 평가액이 보험가액(Insurable Value)이며, 적하보험에서는 통상 본선적재 시점의 화물가격에 보험료·수수료 등 부수비용을 가산해 산정한다."},{"id":"06c4e34a7f","s":3,"n":"57","q":"다음 중 해상보험계약에서 고지불필요사항이 아닌 것은?","o":["3년의 기간보험계약에서 2년으로 단축될 수 있는 경우","보험증권상 명시된 항구에서의 적재방식","보험계약의 인수여부 또는 계약내용에 결정을 줄 수 있는 내용","도착항에서의 하역방식"],"a":2,"e":"보험자의 인수 여부나 보험료·조건 결정에 영향을 주는 중요사항(Material Circumstance)은 반드시 고지해야 하므로 고지불필요사항이 될 수 없고, 나머지는 보험자가 당연히 알 수 있는 사항이라 고지가 면제된다."},{"id":"c6796e833a","s":3,"n":"58","q":"피보험자가 고지의무를 위반하였을 경우 보험자의 권리는?","o":["보험계약의 취소","보험계약의 고지","보험계약의 부실고시","보험계약의 확인"],"a":0,"e":"고지의무(Duty of Disclosure) 위반이나 부실고지가 있으면 보험자는 계약을 취소(해지)하여 보상책임을 면할 수 있으며, 이는 최대선의계약성에서 도출되는 권리다."},{"id":"7fb2bfca08","s":3,"n":"59","q":"해상위험(Maritime Peril)에서 인위적인 위험(Perils on the Sea)인 경우는?","o":["침몰(Sinking)","좌초(Stranidng)","황천(Heavy Weather)","화재(Fire)"],"a":3,"e":"침몰·좌초·황천은 자연적 해상고유의 위험(Perils of the Sea)이지만, 화재(Fire)는 사람의 행위나 관리 소홀에서 비롯되는 인위적 위험(Perils on the Sea)으로 분류된다."},{"id":"91396de99a","s":3,"n":"60","q":"해상보험에서 구약관인 A/R(All Risks)와 신약관인 ICC(A)는 어떠한 위험부담의 원칙에 준거하나?","o":["포괄책임주의","열거책임주의","제한책임주의","협정책임주의"],"a":0,"e":"A/R과 ICC(A)는 면책위험으로 열거된 것을 제외한 모든 우연한 위험을 담보하는 포괄책임주의(All Risks Basis)를 취하며, WA·FPA나 ICC(B)·(C)는 열거책임주의다."},{"id":"f0cecdbc87","s":3,"n":"61","q":"해상보험에서 피보험자의 의사유무를 불문하고 출발지 또는 목적지가 변경된 경우에는 어떤 효력이 발생되는가?","o":["보험계약의 변경","보험계약의 고지","보험계약의 취소","보험료의 추가납부"],"a":2,"e":"항해변경(Change of Voyage)이나 이로(Deviation)로 출발지·목적지가 바뀌면 피보험자의 고의 여부와 무관하게 담보가 종료되어 계약의 효력이 상실(취소)된다."},{"id":"a03adc9d94","s":3,"n":"62","q":"다음 중 해양사고의 조사 및 심판에 관한 법률의 목적으로 알맞은 것은?","o":["해난의 원인규명과 해난의 방지","항계내의 선박교통의 안전과 질서유지","항해사 및 해기사의 자격과 정원을 정함","해난에 책임 있는 해기사의 징계"],"a":0,"e":"해양사고의 조사 및 심판에 관한 법률의 목적은 해양사고의 원인을 규명하여 같은 사고의 재발을 방지하는 데 있고, 징계는 목적 달성을 위한 수단에 불과하다."},{"id":"866133d524","s":3,"n":"63","q":"다음에서 해양사고의 조사 및 심판에 관한 법률 상 사건 심판의 원칙으로 적합하지 않은 것은?","o":["공개주의","서면 심리주의","증거심판주의","자유심증주의"],"a":1,"e":"심판은 구두심리주의(구술변론)를 원칙으로 하므로 서면 심리주의는 맞지 않으며, 공개주의·증거심판주의·자유심증주의는 심판의 기본원칙이다."},{"id":"3497b01297","s":3,"n":"64","q":"다음 중 해양사고의 조사 및 심판에 관한 법률에서 징계의 대상은?","o":["해기사나 도선사","항해사","기관사","통신사"],"a":0,"e":"징계(면허취소·업무정지·견책)의 대상은 해기사와 도선사로 한정되고, 그 밖의 해양사고 관계인에게는 징계가 아니라 권고나 시정요청을 한다."},{"id":"b0d07397f3","s":3,"n":"65","q":"다음 중 해난심판원의 판결을 무엇이라고 하는가?","o":["견책","판결","재결","처벌"],"a":2,"e":"심판원이 심판을 마치고 내리는 판단은 판결이 아니라 재결(裁決)이라 하며, 원인규명재결과 징계재결로 구성된다."},{"id":"6b45d5d4d9","s":3,"n":"66","q":"다음 중 해양사고의 조사 및 심판에 관한 법률에서 징계사유가 있는 날로부터 얼마를 경과하면 심판할 수 없는가?","o":["1년","3년","5년","7년"],"a":1,"e":"징계사유가 발생한 날부터 3년이 지나면 징계시효가 완성되어 그 사유로는 심판(징계)을 할 수 없다."},{"id":"a685248998","s":3,"n":"67","q":"다음에서 해난심판원장과 심판관의 임기는 몇 년인가?","o":["1년","2년","3년","4년"],"a":2,"e":"심판원장과 심판관의 임기는 3년으로, 신분보장을 통해 심판의 독립성과 공정성을 확보한다."},{"id":"671b15b9ec","s":3,"n":"68","q":"다음의 도시 중에 지방 해난심판원의 소재지가 아닌 곳은?","o":["인천","목포","부산","서울"],"a":3,"e":"지방심판원은 부산·인천·목포·동해에 설치되어 있고 서울에는 없으며, 서울에는 상급심 기능을 하는 중앙심판원이 있다."},{"id":"cf6b8ef62d","s":3,"n":"69","q":"만약 묵호항에서 해난이 발생하였다면 어느 해난심판원이 관할 하는 가?","o":["중앙 해난심판원","인천지방 해난심판원","동해지방 해난심판원","부산지방 해난심판원"],"a":2,"e":"묵호항은 동해지방해양안전심판원의 관할구역(동해안 일대)에 속하므로 그곳에서 발생한 사고는 동해지방심판원이 관할한다."},{"id":"4aeecd72e6","s":3,"n":"70","q":"만약 국외에서 발생한 해난은 어디에서 관할 하는 가?","o":["중앙해난심판원","선적항을 관할하는 지방해난 심판원","해난이 발생한 곳과 가장 가까운 심판원","해난이 일어난 지점을 관할하는 지방해난심판원"],"a":1,"e":"국외에서 발생한 해양사고는 사고지점 관할이 불가능하므로 그 선박의 선적항을 관할하는 지방심판원이 관할한다."},{"id":"867686e180","s":3,"n":"71","q":"다음 중 해난심판원의 조사관의 직무들로서 적합하지 않은 것은?","o":["해난심판의 청구","재결의 집행","해난의 조사","심판부 구성"],"a":3,"e":"조사관은 사고조사·심판청구·재결의 집행 등을 담당하는 반면, 심판부 구성은 심판원장의 권한이므로 조사관의 직무가 아니다."},{"id":"316872b336","s":3,"n":"72","q":"다음에서 해난심판원의 조사관의 권한을 설명한 것 중 해당되지 않는 것은?","o":["선박 기타의 장소를 검사하는 일","수심인 도는 지정해난 관계인을 출석시키거나 질문하는 일","관공서에 대하여 보고 또는 자료의 제출 및 협조를 요구하는 일","해난심판의 원인규명이 특히 곤란한 사건의 심판에 참석하는 일"],"a":3,"e":"조사관은 선박·장소 검사, 관계인 출석·질문, 관공서에 대
