    book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M9 8.5l2 2 4-4"/></svg>',
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    star: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8l2.8 5.7 6.3.9-4.6 4.4 1.1 6.2L12 17l-5.6 3 1.1-6.2L2.9 9.4l6.3-.9z"/></svg>',
    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    grid: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>',
    flag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4h11l-2 4 2 4H5"/></svg>',
  };

  // ---------- storage (this browser only) ----------
  const KEY = 'haeun-study-v1';
  function emptyStore() { return { stats: {}, wrong: {}, sessions: {}, exams: [], srs: {}, day: null }; }
  function loadStore() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s && typeof s === 'object') return Object.assign(emptyStore(), s);
    } catch (e) {}
    return emptyStore();
  }
  let store = loadStore();
  // Sheet sessions saved before duplicates were dropped: keep what was already answered, drop duplicates still ahead.
  SHEETS.forEach((_, si) => {
    const ses = store.sessions['s' + si];
    if (ses && Array.isArray(ses.order)) ses.order = ses.order.slice(0, ses.pos + 1).concat(ses.order.slice(ses.pos + 1).filter((i) => keptIndex[si].has(i)));
  });
  function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

  // ---------- 오늘의 공부: spaced review (boxes 1–4) paced to the exam date ----------
  // srs[id] = {b, due}: b 1 = just missed, 2 = right once, 3 = right again on review, 4 = solid. Unseen questions have no entry.
  const EXAM_DAY = Math.floor(Date.UTC(2026, 9, 30) / 864e5); // 2026-10-30
  const FIRST_PASS_BUFFER = 4;  // see every question at least once by this many days before the exam
  const BOX_DAYS = [0, 1, 2, 4, 7];  // days until the next review after landing in box b
  const BOX_P = [0.4, 0.55, 0.8, 0.92, 0.97];  // rough odds of a right answer per box (0 = unseen), for the score estimate
  const DAILY_REVIEW_CAP = 150;
  function dayNum(t) { const d = new Date(t); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); }
  function today() { return dayNum(Date.now()); }
  function fmtDay(n) { const d = new Date(n * 864e5); return (d.getUTCMonth() + 1) + '월 ' + d.getUTCDate() + '일'; }
  // Questions answered before this feature existed: missed ones come back today, right ones over the next few days.
  for (const id of Object.keys(store.stats)) {
    if (store.srs[id] || !firstIndexById.has(id)) continue;
    const st = store.stats[id];
    store.srs[id] = store.wrong[id] || !st[0] ? { b: 1, due: today() } : { b: 2, due: today() + 1 + Math.floor(Math.random() * 3) };
  }
  function updateSrs(id, correct) {
    const cur = store.srs[id];
    const b = correct ? (cur ? Math.min(cur.b + 1, 4) : 2) : 1;
    store.srs[id] = { b, due: today() + BOX_DAYS[b] };
  }
  function unseenIds() { return [...firstIndexById.keys()].filter((id) => !store.srs[id]); }
  function dueIds() { const t = today(); return Object.keys(store.srs).filter((id) => firstIndexById.has(id) && store.srs[id].due <= t); }
  // The day's new-question quota is fixed when the day starts, so finishing early doesn't shrink it.
  function todayPlan() {
    const t = today();
    if (!store.day || store.day.d !== t) {
      const daysLeft = Math.max(1, EXAM_DAY - FIRST_PASS_BUFFER - t + 1);  // today through the first-pass deadline
      store.day = { d: t, quota: Math.ceil(unseenIds().length / daysLeft), newDone: 0, done: 0, right: 0 };
      save();
    }
    return store.day;
  }
  function readiness() {
    let sum = 0, solid = 0, shaky = 0;
    for (const id of firstIndexById.keys()) {
      const s = store.srs[id];
      sum += BOX_P[s ? s.b : 0];
      if (s && s.b >= 3) solid++; else if (s) shaky++;
    }
    const n = firstIndexById.size;
    return { score: Math.round((sum / n) * 100), solid, shaky, unseen: n - solid - shaky, n };
  }

  // stats[id] = [right, wrong, lastTime]; wrong[id] = {t, mark}
  function record(q, correct) {
    const st = store.stats[q.id] || [0, 0, 0];
    st[correct ? 0 : 1]++;
    st[2] = Date.now();
    store.stats[q.id] = st;
    if (!correct) {
      const w = store.wrong[q.id] || { t: 0, mark: 0 };
      w.t = Date.now();
      store.wrong[q.id] = w;
    }
    const day = todayPlan();
    if (!store.srs[q.id]) day.newDone++;
    day.done++;
    if (correct) day.right++;
    updateSrs(q.id, correct);
  }
  // "찍었어요": a lucky right answer is re-filed as a miss so the question keeps coming back.
  function recordGuess(q) {
    const st = store.stats[q.id];
    if (st && st[0] > 0) { st[0]--; st[1]++; }
    const w = store.wrong[q.id] || { t: 0, mark: 0 };
    w.t = Date.now();
    store.wrong[q.id] = w;
    const day = todayPlan();
    if (day.right > 0) day.right--;
    updateSrs(q.id, false);
  }
  function inWrong(id) { return !!store.wrong[id]; }
  function toggleWrong(id) {
    if (store.wrong[id]) delete store.wrong[id];
    else store.wrong[id] = { t: Date.now(), mark: 0 };
    save();
  }

  // ---------- helpers ----------
  function esc(s) { return (s ?? '').toString().replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  function fmtTime(sec) { const m = Math.floor(sec / 60), s = sec % 60; return m + ':' + String(s).padStart(2, '0'); }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function sheetName(si) { return SHEETS[si] ? SHEETS[si].name : ''; }
  function answerText(q) { return MARKS[q.a] + ' ' + q.o[q.a]; }
  // Counted per row of the sheet (a question listed twice counts twice) so "n/50" matches the sheet's 50문제.
  function sheetProgress(si) {
    let solved = 0, right = 0, total = 0;
    for (const i of sheetIndices[si]) { if (store.stats[QS[i].id]) solved++; }
    for (const id of sheetIds[si]) {
      const st = store.stats[id];
      if (st) { right += st[0]; total += st[0] + st[1]; }
    }
    return { solved, unique: sheetIndices[si].length, acc: pct(right, total), answered: total };
  }

  // ---------- view state ----------
  const $main = document.getElementById('main');
  const $modal = document.getElementById('modalRoot');
  const state = { view: 'home', deck: null, exam: null, result: null, reviewFilter: 'wrong', wrongFilter: 'all', wrongSort: 'count', wrongSheet: -1, open: null };
  let examTimer = null;

  // Phone back button returns to the home screen instead of leaving the site mid-quiz.
  function go(view) {
    if (state.view === 'home' && view !== 'home') history.pushState({ v: 1 }, '');
    state.view = view;
    render();
    window.scrollTo(0, 0);
  }
  function goHome() {
    if (state.view !== 'home' && history.state && history.state.v) { history.back(); return; }
    state.view = 'home';
    render();
  }
  window.addEventListener('popstate', () => {
    if (state.view === 'exam' && state.exam && !state.exam.submitted) saveExamSession();
    closeModal();
    state.view = 'home';
    render();
  });

  function render() {
    clearInterval(examTimer);
    if (state.view === 'home') $main.innerHTML = renderHome(), bindHome();
    else if (state.view === 'practice') $main.innerHTML = renderPractice(), bindPractice();
    else if (state.view === 'done') $main.innerHTML = renderDone(), bindDone();
    else if (state.view === 'exam') $main.innerHTML = renderExam(), bindExam();
    else if (state.view === 'result') $main.innerHTML = renderResult(), bindResult();
    else if (state.view === 'wrong') $main.innerHTML = renderWrong(), bindWrong();
  }

  function openModal(title, body, actions) {
    $modal.innerHTML = '<div class="modal-back" id="mBack"><div class="modal" role="dialog" aria-modal="true">' +
      '<h3>' + esc(title) + '</h3>' + (body ? '<p>' + esc(body) + '</p>' : '') +
      actions.map((a, i) => '<button class="btn btn-block ' + (a.cls || 'btn-secondary') + '" data-m="' + i + '">' + esc(a.label) + '</button>').join('') +
      '</div></div>';
    $modal.querySelectorAll('[data-m]').forEach((b) => b.addEventListener('click', () => { const a = actions[+b.dataset.m]; closeModal(); if (a.run) a.run(); }));
    document.getElementById('mBack').addEventListener('click', (e) => { if (e.target.id === 'mBack') closeModal(); });
  }
  function closeModal() { $modal.innerHTML = ''; }

  // ---------- home ----------
  function renderHome() {
    const ids = Object.keys(store.stats);
    let right = 0, total = 0;
    for (const id of ids) { right += store.stats[id][0]; total += store.stats[id][0] + store.stats[id][1]; }
    const wrongIds = Object.keys(store.wrong).filter((id) => firstIndexById.has(id));
    const marked = wrongIds.filter((id) => store.wrong[id].mark).length;
    const last = store.exams[store.exams.length - 1];
    const ex = store.sessions.exam;
    const examFoot = ex && !ex.submitted
      ? '이어서 풀기 · ' + ex.answers.filter((a) => a >= 0).length + '/' + ex.order.length
      : last ? '최근 ' + pct(last.right, last.n) + '점 · 새로 시작' : '30문제 시작하기';
    return (
      '<div class="brand"><span class="brand-mark">' + I.book + '</span><div><h1>해운실무 기출풀이</h1>' +
      '<p>' + SHEETS.length + '개 시트 · 기출 ' + firstIndexById.size.toLocaleString() + '문제</p></div></div>' +
      renderTodayCard() +
      '<div class="stat-strip">' +
      '<div class="stat"><b class="num">' + ids.length.toLocaleString() + '</b><span>푼 문제</span></div>' +
      '<div class="stat"><b class="num">' + (total ? pct(right, total) + '%' : '-') + '</b><span>정답률</span></div>' +
      '<div class="stat"><b class="num">' + wrongIds.length + '</b><span>자주 틀리는 문제</span></div>' +
      '</div>' +
      '<div class="mode-grid">' +
      '<button class="mode-card exam" id="examCard"><span class="kicker">모의고사</span><h2>종합평가</h2>' +
      '<p>전체 시트에서 무작위 ' + EXAM_SIZE + '문제 · 다 풀고 한 번에 채점 · ' + PASS_SCORE + '점 합격</p>' +
      '<span class="foot">' + esc(examFoot) + I.chev + '</span></button>' +
      '<button class="mode-card wrong" id="wrongCard"><span class="kicker muted">오답노트</span><h2>자주 틀리는 문제</h2>' +
      '<p class="muted">' + (wrongIds.length ? '틀린 문제 ' + wrongIds.length + '개 · ★ ' + marked + '개 표시' : '틀린 문제가 여기에 모여요') + '</p>' +
      '<span class="foot">' + (wrongIds.length ? '모아보기' : '아직 없어요') + I.chev + '</span></button>' +
      '</div>' +
      '<span class="section-label">시트별 문제 풀기 · 무작위 순서</span>' +
      '<div class="sheet-list">' +
      SHEETS.map((sh, si) => {
        const p = sheetProgress(si);
        const ses = store.sessions['s' + si];
        const resume = ses && ses.pos > 0 && ses.pos < ses.order.length ? '<span class="resume-tag">이어풀기 ' + ses.pos + '/' + ses.order.length + '</span>' : '';
        return '<button class="sheet-row" data-sheet="' + si + '">' +
          '<span class="name">' + esc(sh.name) + resume + '</span>' +
          '<span class="chev">' + I.chev + '</span>' +
          '<span class="meta num">' + sheetIndices[si].length + '문제 · ' + p.solved + '/' + p.unique + ' 풀어봄' + (p.answered ? ' · 정답률 ' + p.acc + '%' : '') + '</span>' +
          '<span class="bar"><i style="width:' + pct(p.solved, p.unique) + '%"></i></span>' +
          '</button>';
      }).join('') +
      '</div>' +
      '<div class="home-foot"><span class="muted">기록은 이 폰 브라우저에 저장돼요</span><button id="resetBtn">기록 초기화</button></div>'
    );
  }
  function renderTodayCard() {
    const t = today();
    const dleft = EXAM_DAY - t;
    const day = todayPlan();
    const r = readiness();
    const due = Math.min(dueIds().length, DAILY_REVIEW_CAP);
    const fresh = Math.min(Math.max(0, day.quota - day.newDone), r.unseen);
    const firstPass = t <= EXAM_DAY - FIRST_PASS_BUFFER;
    const guide = dleft < 0 ? '시험이 끝났어요. 수고 많으셨어요!'
      : dleft === 0 ? '오늘 시험이에요. ★ 표시한 문제만 가볍게 훑어보세요.'
      : firstPass ? '매일 새 문제 ' + day.quota + '개 + 복습이면 ' + fmtDay(EXAM_DAY - FIRST_PASS_BUFFER) + '까지 전체 문제를 한 번씩 다 봐요.'
      : '마무리 기간이에요. 복습을 끝내고 종합평가로 실전 연습하세요.';
    return '<section class="today-card">' +
      '<div class="today-top"><div><span class="kicker">오늘의 공부</span><h2>' + (dleft > 0 ? '시험까지 ' + dleft + '일' : dleft === 0 ? '시험 당일' : '시험 끝') + '</h2>' +
      '<p>' + esc(guide) + '</p></div><span class="dday num">' + (dleft > 0 ? 'D-' + dleft : dleft === 0 ? 'D-DAY' : '') + '</span></div>' +
      '<div class="ready"><div class="ready-line"><span>예상 점수 <b class="num">약 ' + r.score + '점</b></span><span class="muted">목표 ' + PASS_SCORE + '점</span></div>' +
      '<div class="segbar"><i class="' + (r.score >= PASS_SCORE ? 'k' : 'm') + '" style="width:' + r.score + '%"></i><span class="goal" style="left:' + PASS_SCORE + '%"></span></div>' +
      '<div class="legend num"><span>확실히 앎 <b>' + r.solid + '</b></span><span>애매함 <b>' + r.shaky + '</b></span><span>아직 안 봄 <b>' + r.unseen + '</b></span></div></div>' +
      (dleft >= 0
        ? '<div class="todo num"><div><b>' + due + '</b><span>복습할 문제</span></div><div><b>' + fresh + '</b><span>새 문제</span></div><div><b>' + day.done + '</b><span>오늘 푼 문제</span></div></div>' +
          '<button class="btn btn-primary btn-block" id="todayBtn">' + (due + fresh ? '오늘의 공부 시작 · ' + (due + fresh) + '문제' : '오늘 할 일 끝! 종합평가 풀어보기') + '</button>'
        : '') +
      '</section>';
  }
  function startToday() {
    const day = todayPlan();
    const due = shuffle(dueIds()).sort((a, b) => store.srs[a].b - store.srs[b].b).slice(0, DAILY_REVIEW_CAP);
    const fresh = shuffle(unseenIds()).slice(0, Math.max(0, day.quota - day.newDone));
    if (!due.length && !fresh.length) { startExamFromHome(); return; }
    state.deck = newDeck('t', '오늘의 공부', due.concat(fresh).map((id) => firstIndexById.get(id)), false);
    state.deck.requeued = [];
    state.deck.base = state.deck.order.length;  // today's quota; re-asks of missed questions come after it
    go('practice');
  }
  function bindHome() {
    const tb = document.getElementById('todayBtn');
    if (tb) tb.addEventListener('click', startToday);
    document.getElementById('examCard').addEventListener('click', startExamFromHome);
    document.getElementById('wrongCard').addEventListener('click', () => { state.open = null; go('wrong'); });
    document.querySelectorAll('[data-sheet]').forEach((b) => b.addEventListener('click', () => startSheet(+b.dataset.sheet)));
    document.getElementById('resetBtn').addEventListener('click', () => openModal('기록을 모두 지울까요?', '푼 기록, 자주 틀리는 문제, ★ 표시, 종합평가 점수가 모두 사라져요. 되돌릴 수 없어요.', [
      { label: '모두 지우기', cls: 'btn-primary', run: () => { store = emptyStore(); save(); render(); } },
      { label: '취소', cls: 'btn-ghost' },
    ]));
  }

  // ---------- practice (sheet / wrong list): one question at a time, graded immediately ----------
  function newDeck(key, title, indices, persist) {
    return { key, title, order: shuffle(indices), pos: 0, right: 0, done: 0, chosen: -1, persist };
  }
  function persistDeck() {
    const d = state.deck;
    if (d && d.persist) store.sessions[d.key] = { order: d.order, pos: d.pos, right: d.right, done: d.done, chosen: d.chosen, guess: !!d.guess };
    save();
  }
  function startSheet(si) {
    const key = 's' + si;
    const ses = store.sessions[key];
    const begin = () => { state.deck = newDeck(key, sheetName(si), sheetIndices[si], true); persistDeck(); go('practice'); };
    if (ses && ses.pos > 0 && ses.pos < ses.order.length && ses.order.every((i) => QS[i] && QS[i].s === si)) {
      openModal(sheetName(si), '지난번에 ' + ses.order.length + '문제 중 ' + ses.pos + '문제를 풀었어요.', [
        { label: '이어서 풀기 (' + (ses.pos + 1) + '번째 문제부터)', cls: 'btn-primary', run: () => { state.deck = Object.assign({ key, title: sheetName(si), persist: true }, ses); go('practice'); } },
        { label: '새로 섞어서 처음부터', run: begin },
        { label: '취소', cls: 'btn-ghost' },
      ]);
    } else begin();
  }
  function startWrongDeck(onlyMarked, ids, title) {
    const list = (ids || Object.keys(store.wrong)).filter((id) => firstIndexById.has(id) && (!onlyMarked || (store.wrong[id] && store.wrong[id].mark)));
    if (!list.length) return;
    state.deck = newDeck('w', title || (onlyMarked ? '★ 표시한 문제' : '자주 틀리는 문제'), list.map((id) => firstIndexById.get(id)), false);
    go('practice');
  }

  function renderOptions(q, chosen, mode) {
    return '<div class="opts">' + q.o.map((t, k) => {
      let cls = 'opt', tag = '';
      if (mode === 'graded') {
        if (k === q.a) { cls += ' correct'; tag = '<span class="tag">정답</span>'; }
        else if (k === chosen) { cls += ' wrong'; tag = '<span class="tag">내 답</span>'; }
        else cls += ' dim';
      } else if (k === chosen) cls += ' chosen';
      return '<button class="' + cls + '" data-opt="' + k + '"' + (mode === 'graded' ? ' disabled' : '') + '>' +
        '<span class="mk">' + MARKS[k] + '</span><span class="tx">' + esc(t) + '</span>' + tag + '</button>';
    }).join('') + '</div>';
  }
  function qMeta(q, extra) {
    return '<div class="q-meta">' + (extra || '') + '<span class="pill">' + esc(sheetName(q.s)) + '</span>' +
      (q.n ? '<span>' + esc(q.n) + '번</span>' : '') +
      (store.wrong[q.id] ? '<span style="color:var(--bad);font-weight:700">틀린 적 있음 ' + ((store.stats[q.id] || [0, 0])[1]) + '회</span>' : '') + '</div>';
  }
  // Disputed questions are graded on the company answer (the user's workbook says to memorize it); theory is a side note.
  function explainBlock(q) {
    return (q.c
      ? '<div class="dispute"><span class="lbl">⚠ 정답 논란</span>채점은 회사 정답 <b>' + MARKS[q.a] + '</b> 기준이에요. 일반 이론으로는 <b>' + MARKS[q.c.t] + '</b>' +
        (q.c.n && !(q.e || '').includes('정답 논란') ? '<span class="why">' + esc(q.c.n) + '</span>' : '') + '</div>'
      : '') +
      (q.e ? '<div class="explain"><span class="lbl">해설</span>' + esc(q.e) + '</div>' : '');
  }

  function renderPractice() {
    const d = state.deck;
    const q = QS[d.order[d.pos]];
    const answered = d.chosen >= 0;
    const ok = answered && d.chosen === q.a;
    const guessed = ok && d.guess;
    const last = d.pos === d.order.length - 1;
    const comesBack = d.requeued && d.requeued.includes(d.order[d.pos]) && d.order.indexOf(d.order[d.pos]) === d.pos;
    // 오늘의 공부 keeps the quota fixed in the counter; missed questions are a separate "다시 풀기" round after it.
    const base = d.base || d.order.length;
    const extra = d.order.length - base;
    const inRetry = d.pos >= base;
    const counter = inRetry
      ? '다시 풀기 ' + (d.pos - base + 1) + ' / ' + extra
      : (d.pos + 1) + ' / ' + base + (extra ? ' · 다시 풀기 +' + extra : '') + (d.done ? ' · 맞힘 ' + d.right + '/' + d.done : '');
    const done = inRetry ? d.pos - base + (answered ? 1 : 0) : d.pos + (answered ? 1 : 0);
    const nextLabel = last ? '결과 보기' : d.pos === base - 1 && extra ? '틀린 ' + extra + '문제 다시 풀기' : '다음 문제';
    return (
      '<div class="quiz-head"><button class="icon-btn" id="quitBtn" aria-label="그만 풀기">' + I.close + '</button>' +
      '<div class="title"><b>' + esc(d.title) + (inRetry ? ' · 틀린 문제 한 번 더' : '') + '</b><span class="num">' + counter + '</span></div></div>' +
      '<div class="progress' + (inRetry ? ' retry' : '') + '"><i style="width:' + pct(done, inRetry ? extra : base) + '%"></i></div>' +
      '<div class="q-card">' + qMeta(q) + '<p class="q-text">' + esc(q.q) + '</p></div>' +
      renderOptions(q, d.chosen, answered ? 'graded' : 'open') +
      (answered
        ? '<div class="feedback ' + (guessed ? 'guess' : ok ? 'ok' : 'no') + '">' +
          '<div class="verdict">' + (guessed ? I.flag + '찍어서 맞혔어요' : ok ? I.check + '정답이에요' + '<button class="guess-btn" id="guessBtn">찍었어요</button>' : I.x + '틀렸어요') + '</div>' +
          '<p class="answer-line">정답 <b>' + esc(answerText(q)) + '</b></p>' +
          explainBlock(q) +
          (!ok || guessed ? '<p class="answer-line muted">' + (guessed ? '틀린 문제처럼 다시 나오게 할게요. ' : '') + '자주 틀리는 문제에 담았어요.' + (comesBack ? ' 오늘 분량을 다 풀고 나서 한 번 더 나와요.' : inRetry ? ' 내일 복습에 다시 나와요.' : '') + '</p>' : '') +
          '<button class="link-btn" id="wrongToggle">' + I.flag + (inWrong(q.id) ? '자주 틀리는 문제에서 빼기' : '자주 틀리는 문제에 담기') + '</button>' +
          '</div>' +
          '<div class="bottom-bar"><div class="inner"><button class="btn btn-primary" id="nextBtn">' + nextLabel + '</button></div></div>'
        : '')
    );
  }
  function bindPractice() {
    const d = state.deck;
    const q = QS[d.order[d.pos]];
    // Leaving after answering moves the bookmark past this question, so "이어풀기 n/N" counts finished questions.
    document.getElementById('quitBtn').addEventListener('click', () => {
      if (d.chosen >= 0) {
        if (d.pos < d.order.length - 1) { d.pos++; d.chosen = -1; d.guess = false; }
        else if (d.persist) { delete store.sessions[d.key]; d.persist = false; }
      }
      persistDeck();
      goHome();
    });
    document.querySelectorAll('[data-opt]').forEach((b) => b.addEventListener('click', () => {
      if (d.chosen >= 0) return;
      d.chosen = +b.dataset.opt;
      const ok = d.chosen === q.a;
      record(q, ok);
      d.done++; if (ok) d.right++;
      if (!ok) requeueCurrent();
      persistDeck();
      render();
      const fb = document.querySelector('.feedback');
      if (fb) fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }));
    // 오늘의 공부: a missed (or guessed) question comes back once more at the end of today's set.
    function requeueCurrent() {
      const i = d.order[d.pos];
      if (d.requeued && !d.requeued.includes(i)) { d.requeued.push(i); d.order.push(i); }
    }
    const gb = document.getElementById('guessBtn');
    if (gb) gb.addEventListener('click', () => {
      if (d.guess) return;
      d.guess = true;
      d.right--;
      recordGuess(q);
      requeueCurrent();
      persistDeck();
      render();
    });
    const tg = document.getElementById('wrongToggle');
    if (tg) tg.addEventListener('click', () => { toggleWrong(q.id); render(); });
    const nx = document.getElementById('nextBtn');
    if (nx) nx.addEventListener('click', () => {
      if (d.pos >= d.order.length - 1) { if (d.persist) delete store.sessions[d.key]; save(); state.view = 'done'; render(); window.scrollTo(0, 0); return; }
      d.pos++; d.chosen = -1; d.guess = false;
      persistDeck();
      render();
      window.scrollTo(0, 0);
    });
  }
  function renderDone() {
    const d = state.deck;
    return (
      '<div class="quiz-head"><button class="icon-btn" id="homeBtn" aria-label="처음으로">' + I.back + '</button><div class="title"><b>' + esc(d.title) + '</b><span>다 풀었어요</span></div></div>' +
      '<div class="score-card"><span class="score num">' + pct(d.right, d.done) + '<small>%</small></span>' +
      '<span class="sub num">' + d.done + '문제 중 ' + d.right + '문제 맞힘</span></div>' +
      (d.key === 't'
        ? '<p class="muted" style="text-align:center;font-size:0.86rem">오늘 할 일을 마쳤어요. 틀린 문제는 내일 복습에 다시 나와요.</p>' +
          '<button class="btn btn-primary btn-block" id="examBtn">종합평가로 실전 연습</button>'
        : '<button class="btn btn-primary btn-block" id="againBtn">다시 섞어서 풀기</button>') +
      '<button class="btn btn-secondary btn-block" id="toWrongBtn">자주 틀리는 문제 보기</button>' +
      '<button class="btn btn-ghost btn-block" id="homeBtn2">처음으로</button>'
    );
  }
  function bindDone() {
    const d = state.deck;
    document.getElementById('homeBtn').addEventListener('click', goHome);
    document.getElementById('homeBtn2').addEventListener('click', goHome);
    document.getElementById('toWrongBtn').addEventListener('click', () => { state.view = 'wrong'; render(); });
    const eb = document.getElementById('examBtn');
    if (eb) { eb.addEventListener('click', startExamFromHome); return; }
    document.getElementById('againBtn').addEventListener('click', () => {
      state.deck = newDeck(d.key, d.title, d.order, d.persist);
      persistDeck();
      state.view = 'practice'; render(); window.scrollTo(0, 0);
    });
  }

  // ---------- 종합평가: 30 distinct questions from every sheet, graded at the end ----------
  // Bank the elapsed time on every save so a paused or reloaded exam doesn't count the time away.
  function saveExamSession() {
    const ex = state.exam;
    if (ex && !ex.submitted) { ex.elapsed = examSeconds(ex); ex.start = Date.now(); store.sessions.exam = ex; }
    save();
  }
  function startExamFromHome() {
    const ex = store.sessions.exam;
    if (ex && !ex.submitted && ex.order.every((i) => QS[i])) {
      openModal('종합평가', '풀던 종합평가가 있어요 (' + ex.answers.filter((a) => a >= 0).length + '/' + ex.order.length + ' 답함).', [
        { label: '이어서 풀기', cls: 'btn-primary', run: () => { ex.start = Date.now(); state.exam = ex; go('exam'); } },
        { label: '새 30문제로 시작', run: newExam },
        { label: '취소', cls: 'btn-ghost' },
      ]);
    } else newExam();
  }
  function newExam() {
    const ids = shuffle([...firstIndexById.keys()]).slice(0, EXAM_SIZE);
    state.exam = { order: ids.map((id) => firstIndexById.get(id)), answers: ids.map(() => -1), pos: 0, start: Date.now(), elapsed: 0, submitted: false, grid: false };
    saveExamSession();
    go('exam');
  }
  function examSeconds(ex) { return Math.round(ex.elapsed + (Date.now() - ex.start) / 1000); }
  function renderExam() {
    const ex = state.exam;
    const q = QS[ex.order[ex.pos]];
    const answeredCount = ex.answers.filter((a) => a >= 0).length;
    const last = ex.pos === ex.order.length - 1;
    return (
      '<div class="quiz-head"><button class="icon-btn" id="quitBtn" aria-label="나가기">' + I.close + '</button>' +
      '<div class="title"><b>종합평가</b><span class="num">' + (ex.pos + 1) + ' / ' + ex.order.length + ' · ' + answeredCount + '개 답함</span></div>' +
      '<span class="timer num">' + I.clock + '<span id="examTimer">' + fmtTime(examSeconds(ex)) + '</span></span>' +
      '<button class="icon-btn" id="gridBtn" aria-label="답안지">' + I.grid + '</button></div>' +
      '<div class="progress"><i style="width:' + pct(answeredCount, ex.order.length) + '%"></i></div>' +
      (ex.grid ? renderOmr(ex, false) : '') +
      '<div class="q-card">' + qMeta(q, '<span class="pill">' + (ex.pos + 1) + '번</span>') + '<p class="q-text">' + esc(q.q) + '</p></div>' +
      renderOptions(q, ex.answers[ex.pos], 'open') +
      '<div class="bottom-bar"><div class="inner">' +
      '<button class="btn btn-secondary narrow" id="prevBtn"' + (ex.pos === 0 ? ' disabled' : '') + '>' + I.back + '</button>' +
      (last ? '<button class="btn btn-primary" id="submitBtn">제출하고 채점하기</button>' : '<button class="btn btn-primary" id="nextBtn">다음 문제</button>') +
      '</div></div>'
    );
  }
  function renderOmr(ex, graded) {
    return '<div class="omr">' + ex.order.map((qi, i) => {
      const a = ex.answers[i];
      let cls = '';
      if (graded) cls = a === QS[qi].a ? 'ok' : 'no';
      else { if (a >= 0) cls = 'done'; if (i === ex.pos) cls += ' cur'; }
      return '<button class="' + cls + '" data-jump="' + i + '"><span class="num">' + (i + 1) + '</span><small>' + (a >= 0 ? MARKS[a] : '') + '</small></button>';
    }).join('') + '</div>';
  }
  function bindExam() {
    const ex = state.exam;
    examTimer = setInterval(() => { const t = document.getElementById('examTimer'); if (t) t.textContent = fmtTime(examSeconds(ex)); }, 1000);
    document.getElementById('quitBtn').addEventListener('click', () => {
      saveExamSession();
      openModal('종합평가를 잠시 멈출까요?', '답한 내용은 저장돼서 나중에 이어서 풀 수 있어요.', [
        { label: '나가기', cls: 'btn-primary', run: goHome },
        { label: '계속 풀기', cls: 'btn-ghost' },
      ]);
    });
    document.getElementById('gridBtn').addEventListener('click', () => { ex.grid = !ex.grid; render(); });
    document.querySelectorAll('[data-jump]').forEach((b) => b.addEventListener('click', () => { ex.pos = +b.dataset.jump; ex.grid = false; saveExamSession(); render(); window.scrollTo(0, 0); }));
    document.querySelectorAll('[data-opt]').forEach((b) => b.addEventListener('click', () => { ex.answers[ex.pos] = +b.dataset.opt; saveExamSession(); render(); }));
    const prev = document.getElementById('prevBtn');
    prev.addEventListener('click', () => { if (ex.pos > 0) { ex.pos--; saveExamSession(); render(); window.scrollTo(0, 0); } });
    const next = document.getElementById('nextBtn');
    if (next) next.addEventListener('click', () => { ex.pos++; saveExamSession(); render(); window.scrollTo(0, 0); });
    const sub = document.getElementById('submitBtn');
    if (sub) sub.addEventListener('click', () => {
      const left = ex.answers.filter((a) => a < 0).length;
      if (left) openModal('안 푼 문제가 ' + left + '개 있어요', '안 푼 문제는 틀린 것으로 채점돼요.', [
        { label: '그래도 제출', cls: 'btn-primary', run: gradeExam },
        { label: '마저 풀기', cls: 'btn-ghost', run: () => { ex.pos = ex.answers.findIndex((a) => a < 0); ex.grid = true; render(); } },
      ]);
      else gradeExam();
    });
  }
  function gradeExam() {
    const ex = state.exam;
    ex.elapsed = examSeconds(ex);
    ex.start = Date.now();
    ex.submitted = true;
    let right = 0;
    ex.order.forEach((qi, i) => { const ok = ex.answers[i] === QS[qi].a; if (ok) right++; record(QS[qi], ok); });
    store.exams.push({ t: Date.now(), right, n: ex.order.length, secs: ex.elapsed });
    store.exams = store.exams.slice(-30);
    delete store.sessions.exam;
    save();
    state.result = ex;
    state.reviewFilter = right < ex.order.length ? 'wrong' : 'all';
    state.open = null;
    state.view = 'result';
    render();
    window.scrollTo(0, 0);
  }
  function renderResult() {
    const ex = state.result;
    const right = ex.order.filter((qi, i) => ex.answers[i] === QS[qi].a).length;
    const score = pct(right, ex.order.length);
    const pass = score >= PASS_SCORE;
    const bySheet = {};
    ex.order.forEach((qi, i) => { const s = QS[qi].s; bySheet[s] = bySheet[s] || [0, 0]; bySheet[s][1]++; if (ex.answers[i] === QS[qi].a) bySheet[s][0]++; });
    const items = ex.order.map((qi, i) => ({ qi, i, ok: ex.answers[i] === QS[qi].a })).filter((x) => state.reviewFilter === 'all' || !x.ok);
    const history = store.exams.slice(-5).map((h) => pct(h.right, h.n) + '점').join(' · ');
    return (
      '<div class="quiz-head"><button class="icon-btn" id="homeBtn" aria-label="처음으로">' + I.back + '</button><div class="title"><b>종합평가 결과</b><span class="num">' + fmtTime(ex.elapsed) + ' 걸림</span></div></div>' +
      '<div class="score-card"><span class="score num">' + score + '<small>점</small></span>' +
      '<span class="badge ' + (pass ? 'pass' : 'fail') + '">' + (pass ? '합격' : '불합격') + ' · ' + PASS_SCORE + '점 기준</span>' +
      '<span class="sub num">' + ex.order.length + '문제 중 ' + right + '문제 맞힘' + (right < ex.order.length ? ' · 틀린 ' + (ex.order.length - right) + '문제는 자주 틀리는 문제에 담았어요' : '') + '</span>' +
      (store.exams.length > 1 ? '<span class="sub num">최근 기록 ' + history + '</span>' : '') + '</div>' +
      '<span class="section-label">시트별 정답률</span>' +
      '<div class="breakdown">' + Object.keys(bySheet).sort((a, b) => a - b).map((s) => {
        const [r, n] = bySheet[s];
        const p = pct(r, n);
        return '<div class="bd-row"><span>' + esc(sheetName(+s)) + '</span><b class="num">' + r + '/' + n + '</b><span class="bar"><i class="' + (p < PASS_SCORE ? 'low' : '') + '" style="width:' + p + '%"></i></span></div>';
      }).join('') + '</div>' +
      '<span class="section-label">답안지</span>' + renderOmr(ex, true) +
      '<div class="chips"><button class="chip' + (state.reviewFilter === 'wrong' ? ' on' : '') + '" data-rf="wrong">틀린 문제만</button><button class="chip' + (state.reviewFilter === 'all' ? ' on' : '') + '" data-rf="all">전체 30문제</button></div>' +
      '<div class="w-list">' + (items.length ? items.map((x) => reviewItem(QS[x.qi], ex.answers[x.i], 'r' + x.i, x.i + 1)).join('') : '<div class="empty">다 맞혔어요!</div>') + '</div>' +
      '<div class="bottom-bar"><div class="inner">' +
      (right < ex.order.length ? '<button class="btn btn-secondary" id="retryWrongBtn">틀린 문제 다시 풀기</button>' : '') +
      '<button class="btn btn-primary" id="newExamBtn">새 종합평가</button></div></div>'
    );
  }
  function bindResult() {
    const ex = state.result;
    document.getElementById('homeBtn').addEventListener('click', goHome);
    document.querySelectorAll('[data-rf]').forEach((b) => b.addEventListener('click', () => { state.reviewFilter = b.dataset.rf; render(); }));
    document.querySelectorAll('[data-jump]').forEach((b) => b.addEventListener('click', () => {
      const i = +b.dataset.jump;
      if (state.reviewFilter === 'wrong' && ex.answers[i] === QS[ex.order[i]].a) state.reviewFilter = 'all';
      state.open = 'r' + i;
      render();
      const el = document.querySelector('[data-item="r' + i + '"]');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }));
    bindReviewItems();
    const rw = document.getElementById('retryWrongBtn');
    if (rw) rw.addEventListener('click', () => startWrongDeck(false, ex.order.filter((qi, i) => ex.answers[i] !== QS[qi].a).map((qi) => QS[qi].id)));
    document.getElementById('newExamBtn').addEventListener('click', () => { state.view = 'home'; newExam(); });
  }

  // ---------- shared expandable question row (exam review + wrong list) ----------
  function reviewItem(q, mine, key, num) {
    const open = state.open === key;
    const w = store.wrong[q.id];
    const st = store.stats[q.id] || [0, 0];
    const showStar = state.view === 'wrong';
    return '<div class="w-item' + (open ? ' open' : '') + (showStar && w && w.mark ? ' marked' : '') + '" data-item="' + key + '">' +
      '<div class="w-row">' +
      (showStar ? '<button class="star-btn' + (w && w.mark ? ' on' : '') + '" data-star="' + q.id + '" aria-label="표시">' + I.star + '</button>' : '<span style="width:12px;flex-shrink:0"></span>') +
      '<button class="w-main" data-toggle="' + key + '">' +
      '<span class="qt">' + (num ? num + '. ' : '') + esc(q.q) + '</span>' +
      '<span class="wm"><span>' + (showStar ? (q.n ? esc(q.n) + '번' : '') : esc(sheetName(q.s)) + (q.n ? ' ' + esc(q.n) + '번' : '')) + '</span>' +
      (st[1] ? '<span class="cnt">틀림 ' + st[1] + '회</span>' : '') +
      (mine !== undefined ? (mine === q.a ? '<span style="color:var(--good);font-weight:700">맞힘</span>' : '<span class="cnt">내 답 ' + (mine >= 0 ? MARKS[mine] : '안 품') + '</span>') : '') +
      '</span></button></div>' +
      (open ? '<div class="w-detail"><div class="mini-opts">' + q.o.map((t, k) =>
        '<div class="mini-opt' + (k === q.a ? ' correct' : k === mine ? ' mine' : '') + '"><span class="mk">' + MARKS[k] + '</span><span>' + esc(t) + '</span></div>').join('') + '</div>' +
        '<p class="answer-line">정답 <b>' + esc(answerText(q)) + '</b></p>' + explainBlock(q) +
        '<button class="link-btn" data-wtoggle="' + q.id + '">' + I.flag + (w ? '자주 틀리는 문제에서 빼기' : '자주 틀리는 문제에 담기') + '</button></div>' : '') +
      '</div>';
  }
  function bindReviewItems() {
    document.querySelectorAll('[data-toggle]').forEach((b) => b.addEventListener('click', () => { state.open = state.open === b.dataset.toggle ? null : b.dataset.toggle; render(); }));
    document.querySelectorAll('[data-wtoggle]').forEach((b) => b.addEventListener('click', () => { toggleWrong(b.dataset.wtoggle); render(); }));
    document.querySelectorAll('[data-star]').forEach((b) => b.addEventListener('click', () => {
      const w = store.wrong[b.dataset.star];
      if (!w) return;
      w.mark = w.mark ? 0 : 1;
      save();
      render();
    }));
  }

  // ---------- 자주 틀리는 문제 ----------
  // A question shared by several sheets is filed under its first sheet (the same one shown in its meta line).
  function wrongSheetOf(id) { return QS[firstIndexById.get(id)].s; }
  const WRONG_SORTS = { count: '많이 틀린 순', recent: '최근 틀린 순', num: '문제 번호순' };
  // Grouped by sheet (sheet order), then by the chosen sort inside each sheet.
  function wrongItems() {
    let ids = Object.keys(store.wrong).filter((id) => firstIndexById.has(id));
    if (state.wrongFilter === 'marked') ids = ids.filter((id) => store.wrong[id].mark);
    if (state.wrongSheet >= 0) ids = ids.filter((id) => wrongSheetOf(id) === state.wrongSheet);
    const cnt = (id) => (store.stats[id] || [0, 0])[1];
    const num = (id) => parseInt(QS[firstIndexById.get(id)].n, 10) || 0;
    const recent = (a, b) => store.wrong[b].t - store.wrong[a].t;
    const within = {
      count: (a, b) => (cnt(b) - cnt(a)) || recent(a, b),
      recent,
      num: (a, b) => num(a) - num(b),
    }[state.wrongSort] || recent;
    ids.sort((a, b) => (wrongSheetOf(a) - wrongSheetOf(b)) || within(a, b));
    return ids;
  }
  function wrongGroups(ids) {
    const groups = [];
    for (const id of ids) {
      const s = wrongSheetOf(id);
      if (!groups.length || groups[groups.length - 1].s !== s) groups.push({ s, ids: [] });
      groups[groups.length - 1].ids.push(id);
    }
    return groups;
  }
  function renderWrong() {
    const all = Object.keys(store.wrong).filter((id) => firstIndexById.has(id));
    const marked = all.filter((id) => store.wrong[id].mark).length;
    const bySheet = SHEETS.map(() => 0);
    for (const id of all) if (state.wrongFilter !== 'marked' || store.wrong[id].mark) bySheet[wrongSheetOf(id)]++;
    if (state.wrongSheet >= 0 && !bySheet[state.wrongSheet]) state.wrongSheet = -1;
    const ids = wrongItems();
    const groups = wrongGroups(ids);
    const one = state.wrongSheet >= 0;
    const scopeIds = one ? all.filter((id) => wrongSheetOf(id) === state.wrongSheet) : all;
    const sheetMarked = scopeIds.filter((id) => store.wrong[id].mark).length;
    return (
      '<div class="quiz-head"><button class="icon-btn" id="homeBtn" aria-label="처음으로">' + I.back + '</button>' +
      '<div class="title"><b>자주 틀리는 문제</b><span class="num">' + all.length + '문제 · ★ ' + marked + '개 표시</span></div></div>' +
      (all.length
        ? '<div class="chips">' +
          '<button class="chip' + (state.wrongFilter === 'all' ? ' on' : '') + '" data-wf="all">전체 ' + all.length + '</button>' +
          '<button class="chip' + (state.wrongFilter === 'marked' ? ' on' : '') + '" data-wf="marked">★ 표시 ' + marked + '</button>' +
          '<span class="spacer"></span>' +
          '<button class="chip" id="sortBtn">' + WRONG_SORTS[state.wrongSort] + '</button></div>' +
          '<div class="chips scroll">' +
          '<button class="chip' + (!one ? ' on' : '') + '" data-ws="-1">모든 시트</button>' +
          SHEETS.map((sh, si) => bySheet[si] ? '<button class="chip' + (state.wrongSheet === si ? ' on' : '') + '" data-ws="' + si + '">' + esc(sh.name) + '<span class="n">' + bySheet[si] + '</span></button>' : '').join('') +
          '</div>' +
          '<p class="muted" style="font-size:0.8rem">문제 옆 ★을 누르면 표시돼요. 문제를 누르면 보기와 정답이 펼쳐져요.</p>' +
          '<div class="w-list">' + (groups.length
            ? groups.map((g) => '<div class="w-group"><div class="w-group-head"><b>' + esc(sheetName(g.s)) + '<span class="num">' + g.ids.length + '문제</span></b>' +
                (one ? '' : '<button class="link-btn" data-wsplay="' + g.s + '">이 시트만 풀기' + I.chev + '</button>') + '</div>' +
                g.ids.map((id) => reviewItem(QS[firstIndexById.get(id)], undefined, 'w' + id)).join('') + '</div>').join('')
            : '<div class="empty">★ 표시한 문제가 아직 없어요.</div>') + '</div>' +
          '<button class="btn btn-ghost btn-block" id="exportBtn">목록을 엑셀(CSV)로 내보내기</button>' +
          '<div class="bottom-bar"><div class="inner">' +
          (sheetMarked ? '<button class="btn btn-secondary" id="retryMarkedBtn">★ ' + sheetMarked + '문제 풀기</button>' : '') +
          '<button class="btn btn-primary" id="retryAllBtn">' + scopeIds.length + '문제 다시 풀기</button></div></div>'
        : '<div class="empty">아직 틀린 문제가 없어요.<br>문제를 풀다 틀리면 여기에 자동으로 모여요.</div>')
    );
  }
  function bindWrong() {
    document.getElementById('homeBtn').addEventListener('click', goHome);
    document.querySelectorAll('[data-wf]').forEach((b) => b.addEventListener('click', () => { state.wrongFilter = b.dataset.wf; render(); }));
    document.querySelectorAll('[data-ws]').forEach((b) => b.addEventListener('click', () => { state.wrongSheet = +b.dataset.ws; state.open = null; render(); }));
    const sort = document.getElementById('sortBtn');
    const order = Object.keys(WRONG_SORTS);
    if (sort) sort.addEventListener('click', () => { state.wrongSort = order[(order.indexOf(state.wrongSort) + 1) % order.length]; render(); });
    bindReviewItems();
    const sheetIdsOf = (si) => Object.keys(store.wrong).filter((id) => firstIndexById.has(id) && wrongSheetOf(id) === si);
    document.querySelectorAll('[data-wsplay]').forEach((b) => b.addEventListener('click', () => {
      const si = +b.dataset.wsplay;
      startWrongDeck(state.wrongFilter === 'marked', sheetIdsOf(si), '틀린 문제 · ' + sheetName(si));
    }));
    const one = state.wrongSheet >= 0;
    const ra = document.getElementById('retryAllBtn');
    if (ra) ra.addEventListener('click', () => one ? startWrongDeck(false, sheetIdsOf(state.wrongSheet), '틀린 문제 · ' + sheetName(state.wrongSheet)) : startWrongDeck(false));
    const rm = document.getElementById('retryMarkedBtn');
    if (rm) rm.addEventListener('click', () => one ? startWrongDeck(true, sheetIdsOf(state.wrongSheet), '★ ' + sheetName(state.wrongSheet)) : startWrongDeck(true));
    const exp = document.getElementById('exportBtn');
    if (exp) exp.addEventListener('click', exportWrongCsv);
  }
  function exportWrongCsv() {
    const cell = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const head = ['표시', '틀린횟수', '시트', '번호', '문제', '보기①', '보기②', '보기③', '보기④', '정답', '정답 내용', '해설', '정답 논란(일반이론)'];
    const lines = [head.map(cell).join(',')];
    for (const id of wrongItems()) {
      const q = QS[firstIndexById.get(id)];
      lines.push([store.wrong[id].mark ? '★' : '', (store.stats[id] || [0, 0])[1], sheetName(q.s), q.n, q.q, q.o[0], q.o[1], q.o[2], q.o[3], MARKS[q.a], q.o[q.a], q.e, q.c ? MARKS[q.c.t] + ' ' + q.c.n : ''].map(cell).join(','));
    }
    const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '자주틀리는문제_' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  render();
})();
</script>
</body>
</html>
