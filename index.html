<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>해운실무 기출풀이</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  :root {
    --paper: #FAF6ED;
    --paper-alt: #F1EAD9;
    --card: #FFFFFF;
    --ink: #2A2620;
    --ink-soft: #776F60;
    --line: #E3D9C2;
    --accent: #E15B3F;
    --accent-ink: #FFFFFF;
    --accent-soft: #FBE6DF;
    --highlight: #FFD86B;
    --highlight-ink: #2A2620;
    --good: #2F7A4E;
    --good-bg: #E3F2E8;
    --bad: #B4362A;
    --bad-bg: #FBE2DD;
    --star: #E0A100;
    --warn: #9A5F0C;
    --warn-bg: #FCF0D9;
    --warn-line: #EED3A0;
    --shadow: rgba(42, 38, 32, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1C1A16;
      --paper-alt: #25221C;
      --card: #2B2822;
      --ink: #F1ECDF;
      --ink-soft: #AAA08A;
      --line: #3B372C;
      --accent: #FF7A5C;
      --accent-ink: #1C1A16;
      --accent-soft: #3D2620;
      --highlight: #7A5B12;
      --highlight-ink: #FFEFC7;
      --good: #6FCB93;
      --good-bg: #1F3527;
      --bad: #FF8F7D;
      --bad-bg: #42231E;
      --star: #FFC93C;
      --warn: #F0B65A;
      --warn-bg: #3A2D16;
      --warn-line: #5A4524;
      --shadow: rgba(0, 0, 0, 0.45);
    }
  }
  :root[data-theme="dark"] {
    --paper: #1C1A16;
    --paper-alt: #25221C;
    --card: #2B2822;
    --ink: #F1ECDF;
    --ink-soft: #AAA08A;
    --line: #3B372C;
    --accent: #FF7A5C;
    --accent-ink: #1C1A16;
    --accent-soft: #3D2620;
    --highlight: #7A5B12;
    --highlight-ink: #FFEFC7;
    --good: #6FCB93;
    --good-bg: #1F3527;
    --bad: #FF8F7D;
    --bad-bg: #42231E;
    --star: #FFC93C;
    --warn: #F0B65A;
    --warn-bg: #3A2D16;
    --warn-line: #5A4524;
    --shadow: rgba(0, 0, 0, 0.45);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Sans KR', system-ui, sans-serif;
    padding-inline: 16px;
    padding-block: 18px 110px;
    -webkit-tap-highlight-color: transparent;
  }
  h1, h2, h3, p { margin: 0; }
  h1, h2, h3 { text-wrap: balance; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  #app { max-width: 560px; margin-inline: auto; }
  main { display: flex; flex-direction: column; gap: 18px; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--ink-soft); }
  svg { display: block; }

  /* ---------- shared ---------- */
  .icon-btn {
    width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink-soft);
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .icon-btn svg { width: 19px; height: 19px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border-radius: 14px; padding: 14px 18px; font-weight: 700; font-size: 0.98rem;
    border: 1px solid transparent; background: var(--card); color: var(--ink);
  }
  .btn svg { width: 18px; height: 18px; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 8px 18px -10px var(--shadow); }
  .btn-secondary { border-color: var(--line); }
  .btn-ghost { background: transparent; color: var(--ink-soft); font-weight: 500; }
  .btn-block { width: 100%; }
  .btn:disabled { opacity: 0.45; }
  .section-label { font-size: 0.8rem; font-weight: 700; color: var(--ink-soft); letter-spacing: 0.04em; }

  /* ---------- home ---------- */
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 44px; height: 44px; border-radius: 13px; background: var(--accent); color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .brand-mark svg { width: 24px; height: 24px; }
  .brand h1 { font-family: 'Gaegu', 'Noto Sans KR', sans-serif; font-size: 1.75rem; line-height: 1.05; }
  .brand p { font-size: 0.8rem; color: var(--ink-soft); margin-top: 3px; }
  .today-card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 10px 22px -18px var(--shadow); }
  .today-top { display: flex; align-items: flex-start; gap: 12px; }
  .today-top > div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .today-top .kicker { font-size: 0.72rem; font-weight: 700; color: var(--accent); }
  .today-top h2 { font-size: 1.15rem; font-weight: 900; }
  .today-top p { font-size: 0.78rem; line-height: 1.5; color: var(--ink-soft); word-break: keep-all; }
  .dday { font-family: 'Gaegu', 'Noto Sans KR', sans-serif; font-size: 1.9rem; line-height: 1; color: var(--accent); flex-shrink: 0; }
  .ready { display: flex; flex-direction: column; gap: 7px; }
  .ready-line { display: flex; justify-content: space-between; align-items: baseline; font-size: 0.82rem; }
  .ready-line b { font-size: 1.05rem; font-weight: 900; margin-left: 4px; }
  .segbar { position: relative; display: flex; height: 9px; border-radius: 5px; background: var(--paper-alt); }
  .segbar i { border-radius: 5px; }
  .segbar i.k { background: var(--good); }
  .segbar i.m { background: var(--accent); }
  .segbar .goal { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 1px; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.74rem; color: var(--ink-soft); }
  .legend b { color: var(--ink); font-weight: 700; }
  .todo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .todo div { background: var(--paper); border-radius: 12px; padding: 10px 6px; text-align: center; display: flex; flex-direction: column; gap: 2px; }
  .todo b { font-size: 1.2rem; font-weight: 900; }
  .todo span { font-size: 0.7rem; color: var(--ink-soft); }
  .stat-strip {
    display: grid; grid-template-columns: repeat(3, 1fr);
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
  }
  .stat { padding: 12px 10px; text-align: center; display: flex; flex-direction: column; gap: 2px; }
  .stat + .stat { border-left: 1px solid var(--line); }
  .stat b { font-size: 1.25rem; font-weight: 900; }
  .stat span { font-size: 0.72rem; color: var(--ink-soft); }
  .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 340px) { .mode-grid { grid-template-columns: 1fr; } }
  .mode-card {
    text-align: left; border-radius: 18px; padding: 16px; border: 1px solid var(--line);
    background: var(--card); display: flex; flex-direction: column; gap: 6px; min-height: 132px;
  }
  .mode-card.exam { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 12px 24px -14px var(--shadow); }
  .mode-card .kicker { font-size: 0.72rem; font-weight: 700; opacity: 0.85; }
  .mode-card h2 { font-size: 1.12rem; font-weight: 900; }
  .mode-card p { font-size: 0.78rem; line-height: 1.45; opacity: 0.9; }
  .mode-card .foot { margin-top: auto; font-size: 0.78rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .mode-card .foot svg { width: 15px; height: 15px; }
  .mode-card.wrong .foot { color: var(--accent); }
  .sheet-list { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
  .sheet-row {
    width: 100%; text-align: left; border: none; background: transparent; padding: 14px 16px;
    display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center;
  }
  .sheet-row + .sheet-row { border-top: 1px solid var(--line); }
  .sheet-row .name { font-weight: 700; font-size: 0.95rem; line-height: 1.4; }
  .sheet-row .meta { font-size: 0.76rem; color: var(--ink-soft); grid-column: 1; }
  .sheet-row .chev { grid-row: 1 / span 3; grid-column: 2; color: var(--ink-soft); }
  .sheet-row .chev svg { width: 18px; height: 18px; }
  .bar { grid-column: 1; height: 5px; border-radius: 3px; background: var(--paper-alt); overflow: hidden; margin-top: 4px; }
  .bar i { display: block; height: 100%; background: var(--good); border-radius: 3px; }
  .resume-tag { display: inline-block; font-size: 0.7rem; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 8px; margin-left: 6px; vertical-align: 1px; }
  .home-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 0.82rem; }
  .home-foot a { color: var(--accent); font-weight: 700; text-decoration: none; }
  .home-foot button { border: none; background: none; color: var(--ink-soft); padding: 6px 0; }

  /* ---------- quiz ---------- */
  .quiz-head { display: flex; align-items: center; gap: 10px; }
  .quiz-head .title { flex: 1; min-width: 0; }
  .quiz-head .title b { display: block; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .quiz-head .title span { font-size: 0.78rem; color: var(--ink-soft); }
  .progress { height: 6px; border-radius: 3px; background: var(--paper-alt); overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.25s ease; }
  .progress.retry i { background: var(--warn); }
  .q-card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .q-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 0.74rem; color: var(--ink-soft); }
  .q-meta .pill { background: var(--paper-alt); border-radius: 999px; padding: 3px 9px; font-weight: 500; }
  .q-text { font-size: 1.06rem; font-weight: 700; line-height: 1.6; word-break: keep-all; }
  .opts { display: flex; flex-direction: column; gap: 9px; }
  .opt {
    width: 100%; text-align: left; border: 1.5px solid var(--line); background: var(--card);
    border-radius: 14px; padding: 13px 14px; display: flex; gap: 11px; align-items: flex-start;
    line-height: 1.55; font-size: 0.95rem; word-break: keep-all;
  }
  .opt .mk { font-weight: 900; flex-shrink: 0; width: 1.2em; text-align: center; }
  .opt .tx { flex: 1; }
  .opt .tag { flex-shrink: 0; font-size: 0.7rem; font-weight: 900; padding: 2px 7px; border-radius: 999px; margin-top: 2px; }
  .opt.chosen { border-color: var(--accent); background: var(--accent-soft); }
  .opt.correct { border-color: var(--good); background: var(--good-bg); }
  .opt.correct .tag { background: var(--good); color: var(--card); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .opt.wrong .tag { background: var(--bad); color: var(--card); }
  .opt.dim { opacity: 0.55; }
  .opt:disabled { cursor: default; }
  .feedback { border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--line); background: var(--card); }
  .feedback .verdict { font-weight: 900; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
  .feedback .verdict svg { width: 20px; height: 20px; }
  .feedback.ok .verdict { color: var(--good); }
  .feedback.no .verdict { color: var(--bad); }
  .feedback.guess .verdict { color: var(--warn); }
  .feedback.guess { background: var(--warn-bg); border-color: var(--warn-line); }
  .guess-btn { margin-left: auto; border: 1px solid var(--warn-line); background: var(--warn-bg); color: var(--warn); border-radius: 999px; padding: 6px 13px; font-size: 0.82rem; font-weight: 700; }
  .answer-line { font-size: 0.92rem; line-height: 1.55; }
  .answer-line b { background: linear-gradient(to bottom, transparent 58%, var(--highlight) 58%); color: var(--highlight-ink); }
  .explain { font-size: 0.88rem; line-height: 1.65; color: var(--ink); background: var(--paper-alt); border-radius: 12px; padding: 12px 14px; }
  .explain .lbl { display: block; font-size: 0.72rem; font-weight: 900; color: var(--ink-soft); margin-bottom: 4px; letter-spacing: 0.04em; }
  .dispute { font-size: 0.86rem; line-height: 1.6; background: var(--warn-bg); color: var(--ink); border: 1px solid var(--warn-line); border-radius: 12px; padding: 12px 14px; }
  .dispute .lbl { display: block; font-size: 0.74rem; font-weight: 900; color: var(--warn); margin-bottom: 4px; }
  .dispute .why { display: block; margin-top: 6px; color: var(--ink-soft); font-size: 0.82rem; }
  .link-btn { align-self: flex-start; border: none; background: none; padding: 4px 0; font-size: 0.84rem; font-weight: 700; color: var(--accent); display: inline-flex; gap: 6px; align-items: center; }
  .link-btn svg { width: 16px; height: 16px; }
  .bottom-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--paper) 70%, transparent);
  }
  .bottom-bar .inner { max-width: 560px; margin-inline: auto; display: flex; gap: 10px; }
  .bottom-bar .btn { flex: 1; }
  .bottom-bar .btn.narrow { flex: 0 0 auto; }

  /* ---------- exam ---------- */
  .timer { display: inline-flex; align-items: center; gap: 5px; font-size: 0.82rem; color: var(--ink-soft); font-weight: 500; }
  .timer svg { width: 15px; height: 15px; }
  .omr { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
  .omr button {
    border: 1.5px solid var(--line); background: var(--paper); border-radius: 10px; padding: 8px 0;
    font-size: 0.82rem; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 1px;
  }
  .omr button small { font-size: 0.68rem; font-weight: 500; color: var(--ink-soft); min-height: 1em; }
  .omr button.done { background: var(--accent-soft); border-color: var(--accent); }
  .omr button.cur { outline: 2px solid var(--ink); outline-offset: 1px; }
  .omr button.ok { background: var(--good-bg); border-color: var(--good); }
  .omr button.no { background: var(--bad-bg); border-color: var(--bad); }
  .score-card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 22px 18px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
  .score-card .score { font-size: 3.4rem; font-weight: 900; line-height: 1; }
  .score-card .score small { font-size: 1.1rem; font-weight: 700; color: var(--ink-soft); margin-left: 2px; }
  .badge { font-size: 0.82rem; font-weight: 900; padding: 5px 14px; border-radius: 999px; }
  .badge.pass { background: var(--good-bg); color: var(--good); }
  .badge.fail { background: var(--bad-bg); color: var(--bad); }
  .score-card .sub { font-size: 0.84rem; color: var(--ink-soft); }
  .breakdown { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 6px 16px; }
  .bd-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 10px 0; font-size: 0.84rem; align-items: center; }
  .bd-row + .bd-row { border-top: 1px solid var(--line); }
  .bd-row .bar { grid-column: 1 / span 2; margin-top: 0; }
  .bd-row .bar i.low { background: var(--bad); }

  /* ---------- review / wrong list ---------- */
  .chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 13px; font-size: 0.82rem; font-weight: 500; }
  .chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .chips .spacer { flex: 1; }
  .chips.scroll { flex-wrap: nowrap; overflow-x: auto; margin-inline: -16px; padding: 2px 16px; scrollbar-width: none; }
  .chips.scroll::-webkit-scrollbar { display: none; }
  .chips.scroll .chip { flex-shrink: 0; white-space: nowrap; }
  .chip .n { opacity: 0.6; margin-left: 4px; }
  .w-list { display: flex; flex-direction: column; gap: 10px; }
  .w-group { display: flex; flex-direction: column; gap: 10px; }
  .w-group + .w-group { margin-top: 14px; }
  .w-group-head { display: flex; align-items: center; gap: 10px; padding: 0 2px; }
  .w-group-head b { font-size: 0.95rem; flex: 1; min-width: 0; word-break: keep-all; }
  .w-group-head .num { font-size: 0.8rem; color: var(--ink-soft); font-weight: 500; margin-left: 6px; }
  .w-group-head .link-btn { flex-shrink: 0; font-size: 0.8rem; }
  .w-item { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .w-item.marked { border-color: var(--star); box-shadow: inset 4px 0 0 var(--star); }
  .w-row { display: flex; gap: 4px; align-items: stretch; }
  .star-btn { border: none; background: none; padding: 14px 6px 14px 12px; color: var(--line); flex-shrink: 0; align-self: flex-start; }
  .star-btn svg { width: 24px; height: 24px; }
  .star-btn.on { color: var(--star); }
  .w-main { flex: 1; min-width: 0; border: none; background: none; text-align: left; padding: 14px 14px 14px 4px; display: flex; flex-direction: column; gap: 5px; }
  .w-main .qt { font-size: 0.92rem; font-weight: 700; line-height: 1.5; word-break: keep-all; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .w-item.open .w-main .qt { -webkit-line-clamp: unset; display: block; }
  .w-main .wm { font-size: 0.74rem; color: var(--ink-soft); display: flex; gap: 8px; flex-wrap: wrap; }
  .w-main .wm .cnt { color: var(--bad); font-weight: 700; }
  .w-detail { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; }
  .mini-opts { display: flex; flex-direction: column; gap: 6px; }
  .mini-opt { font-size: 0.86rem; line-height: 1.5; padding: 8px 11px; border-radius: 10px; background: var(--paper); display: flex; gap: 8px; word-break: keep-all; }
  .mini-opt.correct { background: var(--good-bg); color: var(--ink); font-weight: 700; }
  .mini-opt.mine { background: var(--bad-bg); }
  .mini-opt .mk { font-weight: 900; flex-shrink: 0; }
  .empty { background: var(--card); border: 1px dashed var(--line); border-radius: 18px; padding: 34px 20px; text-align: center; color: var(--ink-soft); font-size: 0.9rem; line-height: 1.6; }

  /* ---------- modal ---------- */
  .modal-back { position: fixed; inset: 0; background: rgba(20, 18, 14, 0.5); z-index: 20; display: flex; align-items: flex-end; justify-content: center; padding: 16px; }
  .modal { width: 100%; max-width: 480px; background: var(--card); border-radius: 22px; padding: 22px 18px calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; }
  .modal h3 { font-size: 1.08rem; }
  .modal p { font-size: 0.88rem; color: var(--ink-soft); line-height: 1.55; }
</style>
</head>
<body>
<div id="app"><main id="main"></main></div>
<div id="modalRoot"></div>

<script>
const STUDY = {"sheets":[{"name":"정기선과 부정기선","count":400},{"name":"선하증권(복합운송)","count":400},{"name":"선박운용(운항), 컨테이너 장비, 항만터미널","count":100},{"name":"해운경영, 해상보험, 해상운임, 선원관리, 해양법규 등","count":100},{"name":"비슷하고 헷갈리는거 모아둠","count":229}],"questions":[{"id":"071015ebe8","s":0,"n":"1","q":"컨테이너 운송의 장점으로 적당하지 않은 것은?","o":["컨테이너를 이용함으로써 운송비, 포장비, 보험료 등을 절감할 수 있다.","컨테이너 운송은 신속하다.","컨테이너 운송은 안전하다.","컨테이너 운송은 하역시간과 정박시간이 길다."],"a":3,"e":"컨테이너화(containerization)의 핵심 효과는 하역 기계화로 하역시간과 정박시간(port time)을 크게 단축해 선박 회전율을 높이는 것이다. 하역·정박시간이 길다는 서술은 재래선(conventional ship)의 특징이다."},{"id":"f821b61dd2","s":0,"n":"2","q":"부정기선 경영의 특성으로 맞지 않는 것은?","o":["화물의 가치가 중량이나 용적에 비하여 상대적으로 적다.","화물이 대량이며, 수송단위가 크다.","화물을 한번 싣게 되면 거의 만선이 된다.","항로에 제한을 받으며, 운임이 유리한 화물을 선택할 수 있다."],"a":3,"e":"부정기선(tramper)은 화주가 지정하는 곳으로 자유롭게 배선하므로 특정 항로에 구속되지 않는다. 운임 유리한 화물을 골라 싣는 것은 맞지만 '항로 제한'은 정기선(liner)의 고정항로 특성이다."},{"id":"d780179991","s":0,"n":"3","q":"부정기선 선박운항의 특징으로 맞지 않는 것은?","o":["항로 배선시 다음 항해가 가급적 공선항해가 되도록 한다.","화물의 출하 시기, 해상 물동량의 증감 등에 관한 정보를 수집․판단한다.","육상 설비에 많은 투자를 할 필요가 없다.","부정기선 운임 시장은 선복의 수급에 따라 운임률이 급격하게 변동한다."],"a":0,"e":"부정기선 배선의 기본 원칙은 다음 항해가 가급적 공선항해(ballast voyage)가 되지 않도록 연속 화물을 확보해 실적항해율을 높이는 것이다. 공선항해는 수익 없이 비용만 발생시킨다."},{"id":"8734faf6c6","s":0,"n":"4","q":"해운은 실시해 온 대다수 국가에서 정기선 해운에 역점을 두는 의의로 맞지 않는 것은?","o":["자국의 정기선 항로를 개설하고 적정 선박량을 유지함으로써 자국 화주에게 안정적인 운임으로 정기적인 해운 서비스를 제공한다.","정기적인 배선에 의해 수출입 화물을 적기에 수송함으로써 교역상의 편의를 제공한다.","지속적으로 수송항로를 유지함으로써 당사국간의 교역 촉진과 경제 발전에 기여한다.","농산물, 광산물 등 break-bulk cargo를 전문적으로 운송하여 지역경제 발전에 기여한다."],"a":3,"e":"정기선 해운 육성의 의의는 고정항로·정기배선을 통한 안정 운임과 적기 수송, 교역 촉진에 있다. 농산물·광산물 같은 대량 산화물(bulk cargo)의 전문 수송은 부정기선의 영역이다."},{"id":"8714802e19","s":0,"n":"5","q":"정기선 해운의 서비스에 대한 설명으로 적합하지 않는 것은?","o":["정기선 운항선박은 선박의 가격이 부정기선 운항선박에 비해 저렴하다.","정기선의 운송화물은 완제품 또는 반제품 등의 공산품이 주종이다.","정기선의 송장가격은 부정기선에 비해 비싸다.","정기선 화물의 운임은 부정기선 화물에 비해 높은 편이다."],"a":0,"e":"정기선은 고속·다목적 설비(냉동창, 컨테이너 셀 가이드 등)를 갖춘 고성능선이어서 선가가 부정기선보다 오히려 비싸다. 화물이 공산품 위주여서 송장가격과 운임 수준도 높다."},{"id":"09531a2393","s":0,"n":"6","q":"정기선 해운이 취급하는 일반화물의 종류가 아닌 것은?","o":["정량화물","고가화물","단위화물","액체화물"],"a":1,"e":"정기선의 일반화물(general cargo)은 정량화물(fine cargo), 조잡화물(rough cargo), 액체화물, 단위화물(unit cargo) 등으로 나뉜다. 고가화물은 특별한 관리가 필요한 특수화물(special cargo)로 분류된다."},{"id":"61053048e6","s":0,"n":"7","q":"정기선의 일반화물 중에서 조잡화물(rough cargo)의 종류가 아닌 것은?","o":["더러운 화물(dirty cargo)","먼지나는 화물(dusty cargo)","부식성 화물(corrosive cargo)","냄새나는 화물(smelled cargo)"],"a":2,"e":"조잡화물은 더러운 화물, 먼지나는 화물, 냄새나는 화물처럼 다른 화물을 오손시킬 우려가 있는 것들이다. 부식성 화물은 산·알칼리류로서 위험화물(dangerous cargo)에 속한다."},{"id":"d255c92924","s":0,"n":"8","q":"화물 또는 포장된 화물을 적입하여 운반하는 용기를 일컬는 말은 다음 중 어느 것인가?","o":["팔레트(pallet)","컨테이너(container)","패키지(package)","박스(box)"],"a":1,"e":"컨테이너(container)는 화물이나 포장화물을 적입해 반복 운송할 수 있는 규격화된 운송용기를 말한다. 팔레트는 하역 단위화용 받침대, 패키지·박스는 포장 그 자체다."},{"id":"660c56d68c","s":0,"n":"9","q":"컨테이너의 성질을 설명한 것 중 적절하지 않은 것은?","o":["항구적인 성질","반복사용이 가능할 정도의 견고성","화물의 적입 및 적출이 용이하게 설계","1m³(35.3ft³) 이하의 내용 적을 구비"],"a":3,"e":"ISO 컨테이너 정의상 내용적은 1m³(35.3ft³) 이상이어야 하며, 그 밖에 항구적 성질, 반복사용 가능한 견고성, 적입·적출 용이성을 갖춰야 한다."},{"id":"12880411c6","s":0,"n":"10","q":"선사가 리스회사 소유의 컨테이너를 사용할 경우 그 이점을 기술한 것 중 적절하지 않은 것은?","o":["자금고정화의 확대","감가상각 불필요","노후화된 장비의 위험 방지","유지관리비 절감"],"a":0,"e":"컨테이너 리스(leasing)의 이점은 대규모 구매자금 부담을 피해 자금고정화를 회피하는 데 있다. 감가상각 불필요, 노후장비 위험 회피, 유지관리비 절감도 리스 이점이다."},{"id":"26fc30f7d2","s":0,"n":"11","q":"컨테이너를 통상 3년에서 5년간의 사용을 목적으로 리스하는 것을 무엇이라고 하는가?","o":["단기 리스(shor-term lease)","편도 리스(one-way lease)","장기 리스(long-term lease)","왕복 리스(two-way lease)"],"a":2,"e":"통상 3~5년 단위로 컨테이너를 빌려 쓰는 것은 장기 리스(long-term lease)다. 단기 리스는 성수기 일시 보충용, 편도 리스는 한 방향 편중 수요 해소용이다."},{"id":"6e99d88344","s":0,"n":"12","q":"컨테이너에 사용되는 재질이 아닌 것은?","o":["철재(steel)","알루미늄(aluminium)","플라스틱(plastics)","특수 플라스틱(fiberglass plastics)"],"a":2,"e":"컨테이너 재질은 철재(steel), 알루미늄(aluminium), 특수(강화)플라스틱 FRP가 대표적이다. 강도·내구성이 부족한 일반 플라스틱은 컨테이너 재질로 쓰이지 않는다."},{"id":"c010ab1d36","s":0,"n":"13","q":"알루미늄으로 제작한 컨테이너의 장점은?","o":["수리 용이","외부 충격에 강함","외양이 좋음","가격 저렴"],"a":2,"e":"알루미늄 컨테이너는 경량이고 부식에 강해 외관(외양)이 좋은 것이 장점이다. 반면 가격이 비싸고 외부 충격에 약하며 손상 시 수리가 어렵다."},{"id":"a65615107c","s":0,"n":"14","q":"컨테이너를 용도에 의한 분류에 타당하지 않은 것은?","o":["일반화물 컨테이너","온도조절 컨테이너","특수컨테이너","특수플라스틱 컨테이너"],"a":3,"e":"컨테이너의 용도별 분류는 일반화물 컨테이너, 온도조절(냉동·보온) 컨테이너, 특수 컨테이너로 구분한다. 특수플라스틱 컨테이너는 용도가 아닌 재질에 따른 분류다."},{"id":"7e8f33b525","s":0,"n":"15","q":"특수컨테이너 중 음료, 주류, 액체류, 화확제품을 운송하는데 사용되는 컨테이너는?","o":["탱크 컨테이너(Tank container)","벌크 컨테이너(Bulk container)","사이드 오픈 컨테이너(Side open container)","플랫폼 컨테이너(Plaftform container)"],"a":0,"e":"음료·주류·유류·화학제품 등 액체를 벌크로 싣는 것은 탱크 컨테이너(tank container)다. 벌크 컨테이너는 곡물·분말 등 살화물, 플랫폼 컨테이너는 중량·장척물용이다."},{"id":"b8a0d6c013","s":0,"n":"16","q":"정기선 항로에 운항중인 선박으로 1960년대 부터 일반잡화, 액체화물, 냉동화물을 적재할 수 있도록 된 선박은?","o":["표준 다목적선(Standard multi-purpose cargo liner)","재래 정기선(Traditional multi-deck cargo liner)","신형 다목적선(Sophisticated multipurpose cargo liner)","컨테이너 전용선(Full container ships)"],"a":1,"e":"1960년대부터 일반잡화 외에 액체화물(deep tank)과 냉동화물까지 함께 실을 수 있게 만든 다층 선창 구조의 선박이 재래 정기선(traditional multi-deck cargo liner)이다."},{"id":"7467cccd2e","s":0,"n":"17","q":"정기선 항로에 운항중인 선박으로 주로 컨테이너, 자동차, 벌크화물 등을 운송하늠 선박은?","o":["표준 다목적선(Standard multi-purpose cargo liner)","재래 정기선(Traditional multi-deck cargo liner)","신형 다목적선(Sophisticated multipurpose cargo liner)","컨테이너 전용선(Full container ships)"],"a":2,"e":"컨테이너·자동차·벌크화물을 겸용 수송하도록 갠트리 크레인 등 하역설비를 갖춘 대형선이 신형 다목적선(sophisticated multipurpose cargo liner)이다."},{"id":"1ba80b87be","s":0,"n":"18","q":"컨테이너 전용 터미널을 갖추지 않은 항로인 아프리카, 중남미, 동남아 할로 등에서 주로 운항되는 선박은?","o":["표준 다목적선(Standard multi-purpose cargo liner)","재래 정기선(Traditional multi-deck cargo liner)","신형 다목적선(Sophisticated multipurpose cargo liner)","컨테이너 전용선(Full container ships)"],"a":0,"e":"전용 컨테이너 터미널과 하역장비가 미비한 아프리카·중남미·동남아 항로에서는 본선 자체 하역설비를 갖춘 표준 다목적선(standard multi-purpose cargo liner)이 주로 투입된다."},{"id":"3895ecbea2","s":0,"n":"19","q":"신형다목적선(Sophisticated mutipurpose cargo liner)의 특징을 서술한 것 중 잘못 기술한 것은?","o":["40,000~50,000 WT 급 선박","주로 컨테이너, 자동차, 벌크화물 등을 운송","선박 건조가격이 매우 저렴","지브 크레인(jib crane), 갠트리 크레인(gantry crane) 등의 하역장비 장착"],"a":2,"e":"신형 다목적선은 4만~5만 WT급에 지브·갠트리 크레인 등 고가의 하역설비를 갖추고 컨테이너·자동차·벌크를 겸용 수송하므로 건조가격이 매우 높다."},{"id":"b6e9154b33","s":0,"n":"20","q":"선박 내에 4~5개의 선창을 갖추고 각 선창은 중갑판으로 구조된 선박으로 1970년대 초부터 많이 건조된 선박은?","o":["표준 다목적선(Standard multi-purpose cargo liner)","재래 정기선(Traditional multi-deck cargo liner)","신형 다목적선(Sophisticated multipurpose cargo liner)","컨테이너 전용선(Full container ships)"],"a":0,"e":"4~5개 선창을 중갑판(tween deck) 구조로 만들어 1970년대 초부터 많이 건조된 선박은 표준 다목적선(standard multi-purpose cargo liner)이다."},{"id":"23ed90f1bb","s":0,"n":"21","q":"선창 내에 컨테이너만을 적재하기 위해 받침대(cell guides)를 부착한 선박은?","o":["표준 다목적선(Standard multi-purpose cargo liner)","재래 정기선(Traditional multi-deck cargo liner)","신형 다목적선(Sophisticated multipurpose cargo liner)","컨테이너 전용선(Full container ships)"],"a":3,"e":"선창 내부에 셀 가이드(cell guides)를 설치해 컨테이너만 수직으로 적재하는 선박은 컨테이너 전용선(full container ship)이며, LO-LO 방식으로 하역한다."},{"id":"3bab84cfe5","s":0,"n":"22","q":"다음 중 로로(Ro-Ro)선의 특징을 설명한 것 중 해당되지 않는 것은?","o":["자동차나 트레일러, 트랙터 등의 바퀴 달린 화물을 취급","화물의 적양하 시 너무 많은 노동과 시간이 소요","화물의 적양하 작업을 위해 램프(ramp)시설을 구비","선내는 여러 개의 갑판(multi-deck)의 구조"],"a":1,"e":"로로선(Ro-Ro ship)은 램프(ramp)를 통해 차륜 화물을 자력으로 싣고 내리는 수평하역 방식이어서 하역 노동력과 시간이 크게 절감된다."},{"id":"c059365b89","s":0,"n":"23","q":"규격 화물(unitized cargo)의 운송수단으로 개발된 해상 운송 수단 중의 하나로 항만내, 내 수로(內 水路) 또는 호수 등에서 화물을 운송하는 선박은?","o":["로로(Ro-Ro)선","냉동 컨테이너 선","바지(Barge)선","컨테이너 전용선(Full container ships)"],"a":2,"e":"항만 내부, 내수로, 호수 등에서 규격화물을 운송하는 부선(平底船)은 바지선(barge)이며, 모선에 실어 나르는 LASH 방식과 결합해 활용된다."},{"id":"32acae6985","s":0,"n":"24","q":"다음 중 바지(Barge)선의 특징을 설명한 것 중 해당되지 않는 것은?","o":["항만내, 내 수로(內 水路) 또는 호수 등에서 화물을 운송하는데 주로 이용","종류로는 Oil/Water/Pushing/Towing Barge선","대형 바지선을 실을 수 있는 LASH(Lighter aboard ship)의 수송방식","원동력 장치의 화물을 취급"],"a":3,"e":"바지선은 자체 추진 원동기가 없어 예선(tug)의 밀거나 끄는 힘으로 이동하는 부선이다. 원동력 장치를 갖췄다는 설명은 바지선의 특징이 아니다."},{"id":"d6d5398999","s":0,"n":"25","q":"개별선사가 단독으로 필요한 선단을 구성하고 운항 스케줄, 기항지, 영업정책 등을 독자적으로 결정, 실시하는 정기선 운항방식은?","o":["컨소시움(Consortium)","단동운항(Independent operation)","공동운항(Joint service)","스페이스 차터(Space charter)"],"a":1,"e":"개별 선사가 단독으로 선단을 구성해 스케줄·기항지·영업정책을 독자 결정하는 방식은 단독운항(independent operation)이다. 컨소시움·공동운항은 복수 선사의 협력 형태다."},{"id":"486612aed2","s":0,"n":"26","q":"세계 최초의 해운 컨소시움은 영국에서 결성된 ACT(Associated Container Transportaion, Ltd.)로 몇년도에 결성되었는가?","o":["1964년","1971년","1966년","1984년"],"a":2,"e":"세계 최초의 해운 컨소시움은 1966년 영국에서 결성된 ACT(Associated Container Transportation, Ltd.)로, 컨테이너화 초기 대규모 투자 부담을 공동 분담하기 위해 만들어졌다."},{"id":"820b20ca25","s":0,"n":"27","q":"해운 컨소시움의 특성을 설명한 것 중 타당하지 않은 것은?","o":["선박의 공동 스케줄 작성","스페이스의 상호교환","컨테이너 터미널의 공동사용","운임 결정권 행사"],"a":3,"e":"컨소시움은 공동 스케줄, 스페이스 상호교환(space charter), 터미널·장비 공동사용 등 운항 합리화를 위한 협력체다. 운임 결정권은 해운동맹(shipping conference)이 행사한다."},{"id":"f75f2c2700","s":0,"n":"28","q":"두개 이상의 선사가 선박을 합작기업(joint venture)형태로 운항하기 위한것을 의미하는 것은?","o":["컨소시움(Consortium)","단동운항(Independent operation)","공동운항(Joint service)","스페이스 차터(Space charter)"],"a":2,"e":"두 개 이상의 선사가 합작기업(joint venture) 형태로 선박을 함께 운항하는 것이 공동운항(joint service)이다. 컨소시움보다 결합 정도가 강한 형태다."},{"id":"85de096f9a","s":0,"n":"29","q":"공동운항(joint service)의 특성으로 잘못 설명되어 진 것은?","o":["공동운항 선사들은 각자의 업체(entity)명을 가지고 독자적으로 운임 결정권 행사","자신의 명의로 해운동맹에 가입하여 공동 태리프(common tariff)를 이용가능","자신의 명의로 선하증권(B/L)을 발행 가능","자신의 임의대로 운항 스케줄을 작성 활용"],"a":3,"e":"공동운항 선사는 각자 법인 명의와 운임 결정권, B/L 발행권, 동맹 가입 자격을 유지하지만, 운항 스케줄은 참여 선사가 협의해 공동으로 작성하므로 임의 편성은 불가하다."},{"id":"5eada187e2","s":0,"n":"30","q":"북반구에 위치한 선진국과 개도국간에 주로 개설된 동서 항로가 아닌 것은?","o":["아시아 ~ 북미 항로","아시아 ~ 북유럽 항로","아시아 ~ 아프리카 항로","아시아 ~ 지중해 항로"],"a":2,"e":"동서항로(east-west trade)는 아시아~북미, 아시아~북유럽, 아시아~지중해처럼 북반구 주요 경제권을 잇는 항로다. 아시아~아프리카는 남북항로(north-south trade)에 해당한다."},{"id":"ec8c2d8910","s":0,"n":"31","q":"해운동맹의 장점을 기술 한 것과 거리 가 먼 것은?","o":["정기운항의 유지로 무역 거래의 편리","운임안정을 통한 생산 및 판매계획 수립 용이","동맹가입을 통한 영세선사의 구제","동맹의 독점성에 따른 초과 이윤의 획득"],"a":3,"e":"해운동맹의 장점은 정기배선 유지, 운임안정, 영세선사 보호 등이다. 독점적 지위를 이용한 초과이윤 획득과 고운임 유지는 화주에게 불리한 동맹의 대표적 폐해(단점)다."},{"id":"5a4b00c72a","s":0,"n":"32","q":"해운동맹의 목적으로 타당하지 않은 것은?","o":["운임협정","기항지와 배선 수의 협정","맹외선(盟外船)의 활동을 장려","적취비율 및 운임 pool제 등의 협정"],"a":2,"e":"해운동맹은 운임협정, 배선·기항지 협정, 적취비율 및 운임 풀(pool)제 등으로 회원 간 경쟁을 제한하는 카르텔이다. 맹외선(outsider)은 장려 대상이 아니라 대항선 투입 등으로 억제한다."},{"id":"b38f91989b","s":0,"n":"33","q":"해운동맹을 운영에 있어서 신규가입과 탈퇴를 극단으로 제한하는 동맹을 무엇이라고 하는가?","o":["개방동맹","폐쇄동맹","관세동맹","통화동맹"],"a":1,"e":"신규 가입과 탈퇴를 엄격히 제한해 회원 자격을 배타적으로 운영하는 동맹은 폐쇄동맹(closed conference)으로 주로 유럽계 동맹 형태다. 개방동맹은 자격만 갖추면 가입이 자유롭다."},{"id":"636a97ea78","s":0,"n":"34","q":"해운동맹의 대내적 억제수단으로 거리가 먼 것은?","o":["운임협정(Rate agreement)","배선 협정(Sailing agreement)","풀협정(Pooling agreement)","통화스왑협정(Currency swap agreement)"],"a":3,"e":"대내적 억제수단은 운임협정, 배선협정, 풀협정, 공동계산협정 등 회원사 간 경쟁 제한 장치다. 통화스왑협정은 금융거래로 해운동맹 운영수단이 아니다."},{"id":"4d38f8493e","s":0,"n":"35","q":"계약 운임제(Contract rate system)의 특징을 서술한 것 중 거리가 먼 것은?","o":["이중 운임제(Dual rate system)","동맹선사의 선박만을 이용한다는 충실의무계약(Loyalty contract)","운임가치 할인제와 달리 유보기간 없이 일정기간 경과 후에 환불금을 전액 지급","동맹에 가입한 화주에게는 낮은 운임(약 9.5%)를 적용"],"a":2,"e":"계약운임제는 동맹선만 이용하겠다는 충실계약(loyalty contract)을 맺은 화주에게 이중운임제(dual rate system)로 약 9.5~15% 낮은 운임을 적용하는 제도다. 유보기간 후 환불금 지급은 운임연환급제(deferred rebate)의 내용이다."},{"id":"0794f992b4","s":0,"n":"36","q":"북미수출운임협정(ANERA: Asia North America Eastbound Rate Agreement)에 대하여 서술한 것 중 거리가 먼 것은?","o":["1985년 8월 15일날 결성","미국선사의 제안으로 극동 및 동남아 지역의 FOB화물에 대해 포괄적인 계약 체결","선사의 채산성 악화 우려로 항로 안정화 목적","회원사의 이익증진 및 항로 안정화 목적"],"a":2,"e":"ANERA는 1985년 결성된 아시아발 북미행 운임협정체로, 미국선사 주도의 FOB화물 포괄계약과 회원사 이익 증진·항로 안정화를 목적으로 한다. 채산성 악화를 이유로 든 서술은 협정의 목적 규정과는 거리가 있다."},{"id":"7db197ae45","s":0,"n":"37","q":"한국근해수송협의회(KNFC)의 성립배경과 거리가 먼 것은?","o":["안정적인 선복량 공급을 통한 수출입화물의 수송을 원활","엔고에 따른 물동량 감소","적정한 운임율을 통한 한일항로의 질서 유지","한일간의 교역을 촉진"],"a":1,"e":"KNFC(한국근해수송협의회)는 한일항로의 과당경쟁 방지, 적정 운임률과 안정적 선복 공급, 교역 촉진을 위해 설립됐다. 엔고로 인한 물동량 감소는 성립배경이 아니다."},{"id":"1ce6bf50c2","s":0,"n":"38","q":"정기선동맹의 행동규범에 관한 UN협약(UNCTAD Liner Code)의 주요 목적을 기술한 것 중 거리가 먼 것은?","o":["세계해상물동량의 원활한 수송 촉진","정기선 서비스 공급자와 사용자의 공평한 이익 보장","세계 교역요건에 부응하는 효율적인 정기선서비스의 개발 장려","운임동맹 관행의 선화주 대외 교역에 대한 차별화"],"a":3,"e":"UNCTAD 정기선동맹 행동규범(Liner Code)의 목적은 물동량 수송 촉진, 선·화주 이익 균형, 효율적 정기선 서비스 개발이다. 동맹 관행의 차별성은 규범이 제거하려는 폐해다."},{"id":"f206aee644","s":0,"n":"39","q":"정기선동맹의 행동규범에 관한 UN협약(UNCTAD Liner Code) 발효상의 문제점이 아닌 것은?","o":["본 협약의 적용화물은 운임동맹 적취 정기선화물에 국한","본 협약의 보호주의적 성격","본 협약은 이해관계자들에게 운임동맹의 활동에 관한 정보 제공","본 협약에 서명한 EC국가들은 EC내 회원국간에는 화물공평적취규정을 미적용"],"a":2,"e":"이해관계자에게 동맹 활동 정보를 공개하도록 한 것은 투명성을 높이는 협약의 장점이다. 적용범위가 동맹 적취 정기선화물에 한정된 점, 보호주의적 성격, EC 회원국 간 40:40:20 적취규정 배제는 발효상 한계로 지적된다."},{"id":"7660517fc7","s":0,"n":"40","q":"해운동맹의 일괄운임인상(GRI)인 경우에는 화주 및 화주단체에 몇일 전에 통보해야 하는가?","o":["150일","100일","50일","30일"],"a":0,"e":"Liner Code는 일괄운임인상(GRI) 시 화주 및 화주단체에 최소 150일 전 사전 통보와 협의를 요구해 화주가 대응할 시간을 보장한다."},{"id":"c3ecb2dbb3","s":0,"n":"41","q":"정기선 회사에서 어느 항로에 어떤 선박을 투입할 것인가의 결정요인으로 적합하지 않은 것은?","o":["적양가능(積揚可能, lifting power) 및 특수설비(냉동 창, deep tank, car dock 등)","항로의 물동량과 화물의 종류에 따른 선복(ship space)","항로의 일반사정에 따른 일반설비요건","기항지의 수나 적하의 모양, 곤포(梱包)에 따른 해치(hatch)의 크기 및 Deck의 수"],"a":2,"e":"투입선박 결정요인은 적양능력(lifting power)과 냉동창·deep tank·car dock 등 특수설비, 항로 물동량과 화물 종류에 맞는 선복, 기항지 수와 곤포에 맞는 해치 크기·갑판 수다. 막연한 '일반설비요건'은 구체적 결정기준이 못 된다."},{"id":"0a3b4ccfb0","s":0,"n":"42","q":"정기선의 적선적항을 위한 가장 이상적인 배선(配船, vessel operation)조정으로 알맞은 것은?","o":["장기적으로는 선박이 진부 되었거나 노후화된 경우에는 선박을 부정기선으로 배선","단기적으로는 일정(time schedule)에 여유가 없더라도 필요한 용선료를 지출하더라도 배선","장기적으로 선복수급에 차이가 있는 항로는 그대로 유지하여 배선","계절에 따라 선복수급에 차이가 있는 항로를 조정하는 동시에 용선과 회사 보유 선박을 적절히 배치하고 여유 선박은 부정기선으로 배선"],"a":3,"e":"이상적 배선은 계절별 선복 수급 차이에 맞춰 항로를 조정하고, 사선(社船)과 용선을 적절히 배합하며 여유 선복은 부정기선으로 돌려 가동률을 높이는 것이다. 적선적항(right ship, right trade) 원칙에 부합한다."},{"id":"c10c85a687","s":0,"n":"43","q":"정기선의 항해지시서에 구성되는 주요내용으로 거리가 먼 것은?","o":["일정의 결정","특수화물과 Base cargo","적하와 선복의 배정","일반잡화의 운임료"],"a":3,"e":"항해지시서(sailing instruction)에는 일정 결정, 특수화물 및 기초화물(base cargo), 적하와 선복 배정 등 개별 항해 운항지침이 담긴다. 일반잡화 운임률은 동맹 태리프(tariff)에서 정한다."},{"id":"b28910ac47","s":0,"n":"44","q":"정기선의 집화방법, 즉 화물 선정을 위한 구체적인 방법 중 타당하지 않은 것은?","o":["선별 적재된 화물 상호간의 오손․손상을 피함","본선의 선체구조 특징에 알 맞는 화물을 기항지 사정에 맞추어 일정이 유지될 수 있는 범위내의 수량으로 조합 적재함","가장 안전하고 신속한 적양(積揚)이 가능케 함","적양비용이 최고가 되도록 적재함"],"a":3,"e":"집화·화물선정의 기준은 화물 간 오손·손상 방지, 선체구조와 기항지 사정에 맞는 조합 적재, 안전하고 신속한 적양이다. 적양비용은 최고가 아니라 최소가 되도록 해야 한다."},{"id":"269b98d094","s":0,"n":"45","q":"Booking의 기능 중에서 화주 또는 포워더로 부터 선적에 필요한 서류를 접수할 때 필요하지 않은 것은?","o":["S/R(Shipping request)","Original L/C","Packing list","Commercial invoice"],"a":1,"e":"부킹(booking) 시 접수 서류는 선적요청서(S/R), 포장명세서(packing list), 상업송장(commercial invoice) 등이다. 신용장 원본(original L/C)은 은행 대금결제용 서류로 선사가 받을 필요가 없다."},{"id":"7b9c716661","s":0,"n":"46","q":"해상운송의 속력은 일반적으로 다른 운송 수단에 비해 늦은 편인데 정기선의 속력은?","o":["12~18knot","20~24knot","18~30knot","18~20knot"],"a":2,"e":"정기선은 정시성 확보를 위해 고속선을 투입하므로 통상 18~30knot 수준의 속력을 낸다. 부정기선은 이보다 훨씬 낮은 경제속력으로 운항한다."},{"id":"67793321bf","s":0,"n":"47","q":"우리나라의 한진해운과 조양상선을 비롯하여 12개국 16개 선사가 운송서비스를 제공하고 있는 항로는 다음 중 어느 항로인가?","o":["극동/북미동안항로","극동/북미서안항로","동남아항로","유럽항로"],"a":0,"e":"한진해운·조양상선 등 12개국 16개 선사가 서비스했던 항로는 극동/북미동안항로로, 물동량이 크고 경쟁이 치열한 대표적 기간항로(main trunk route)다."},{"id":"0cd42b902d","s":0,"n":"48","q":"정기선의 화물유형으로 적합하지 않은 것은?","o":["이종화물","완제품, 반제품이 주대상화물","대량의 벌크화물이 주대상","고가품 화물이 주종"],"a":2,"e":"정기선은 완제품·반제품 등 이종(異種)의 소량 고가화물을 다수 화주로부터 모아 싣는다. 대량 벌크화물은 단일 화주와 용선계약(charter party)을 맺는 부정기선의 대상화물이다."},{"id":"7bf9475b19","s":0,"n":"49","q":"부정기선의 화물유형으로 타당하지 않은 것은?","o":["동종화물","대량의 벌크화물이 주대상","저가품 화물이 주종","고가품 화물이 주종"],"a":3,"e":"부정기선은 곡물·석탄·철광석처럼 동종·대량의 저가 벌크화물을 만선으로 실어 나른다. 고가품 화물이 주종인 것은 정기선의 특징이다."},{"id":"b25792ca46","s":0,"n":"50","q":"부정기선의 해상운임에 대하여 서술한 것으로 적합하지 않은 내용은?","o":["별도의 운임률표가 없음","선박의 수요와 공급에 의해 상당히 탄력적 결정","비교적 운임 저렴","운임률표(tariff) 보유"],"a":3,"e":"부정기선 운임은 공표된 운임률표(tariff)가 없고, 선복의 수급과 시장 상황에 따라 자유롭게 결정되는 시장운임(market rate)이며 대체로 저렴하다. 태리프 보유는 정기선의 특징이다."},{"id":"e7c58ba934","s":0,"n":"51","q":"정기선의 운송계약과 관계가 먼 것은?","o":["용선계약을 통해 체결","용선계약서(Charter party)작성","선하증권(B/L)을 통해 체결","기간용선계약을 통해 체결"],"a":2,"e":"정기선은 개품운송계약(contract of carriage)으로 선하증권(B/L)이 계약 증거가 되고, 용선계약서(C/P)·항해·기간용선은 부정기선의 계약 형태다. 따라서 ③만 정기선과 직결되며, 지문은 '관계가 깊은 것'을 묻는 것으로 읽어야 성립한다."},{"id":"f37f6e389c","s":0,"n":"52","q":"일정기간 동맹선에 선적한 화주에 대하여 운임의 일부를 되돌려 주는 제도는?","o":["이중운임제(dual rate system)","계약운임제(contract rate system)","일반운임률(base rate)","운임연환급제(deferred freight rebate system)"],"a":3,"e":"일정 기간 동맹선에만 선적한 화주에게 운임의 일부를 일정 기간 경과 후 되돌려주는 것은 운임연환급제(deferred rebate system)다. 이중운임제·계약운임제는 계약 여부에 따라 요율을 차별하는 화주구속수단이다."},{"id":"2bc4acfc71","s":0,"n":"53","q":"부정기선의 개념을 정의한 것으로 거리가 먼 것은?","o":["유조선, 광탄전용선, 살화물선 등과 같이 배 전체에 한 종류의 화물을 선적한다.","항해 용선계약(Voyage Charter)하에 만선 운항하는 선박으로 대량화물운송에 전문화되어 있다.","화주가 선적 가능한 화물, 운항 가능한 항로, 그리고 적절한 운임만 제시한다면 선주는 선적항, 양하항의 위치와 관계없이 운송계약과 함께 운항하는 선박을 말한다.","부정기선은 one ship, one cargo의 운송형태로 선박이 운항된다."],"a":3,"e":"부정기선은 항해용선 기반의 만선 대량운송이 원칙이지만 부분선복(part cargo)·병합적재도 이루어져 'one ship, one cargo'로 단정하기 어렵다. 반면 전용선 운항, 항로 비고정, 운임 협상 결정은 부정기선의 본질적 특징이다."},{"id":"3ffcaf5c23","s":0,"n":"54","q":"다음 중 부정기 선의 유형으로 타당하지 않은 것은?","o":["살물선(Bulk Carrier)","유조선(Tanker)","자동차 운반선(Car Carrier)","컨테이너 전용선(Full container ships)"],"a":3,"e":"풀컨테이너선(full container ship)은 정해진 항로를 공표된 스케줄로 반복 운항하는 정기선(liner)의 대표 선종이다. 살물선·유조선·자동차운반선은 대량 단일화물을 용선계약으로 운송하는 부정기선(tramper) 유형이다."},{"id":"8d1dc8baec","s":0,"n":"55","q":"부정기선시장에 대한 특성을 기술한 것으로 적절하지 못한 것은?","o":["다수의 선주가 수 많은 화주의 화물을 운송하기 위해 경쟁하는 완전경쟁시장임","소규모의 선주들이 많고 운임만 만족스럽다면 항로나 화물의 성질은 중요치 않음","수요와 공급의 원칙에 반해 수요의 증감에 따라 운임 등락의 변동성이 약함","운임은 화물, 화물량, 항로, 기항 항, 계절 등 여러 요소들을 고려하여 결정됨"],"a":2,"e":"부정기선 운임은 선복 수급에 즉각 반응해 등락 폭이 매우 크고 변동성이 강한 것이 특징이다. 완전경쟁시장적 구조, 항로·화물 무차별성, 다요소 운임결정은 모두 옳은 서술이다."},{"id":"aa590ef5c7","s":0,"n":"56","q":"부정기선시장에서 용선중개인이 계약관계를 face-to-face로 거래를 하는 시장은 어디 인가?","o":["영국 런던(Baltic Exchange)","노르웨이 오슬로","일본 동경","미국 뉴욕(New York Maritime Exchange)"],"a":0,"e":"용선중개인(shipbroker)이 대면으로 화물과 선복을 맞춰 거래를 성립시키는 전통적 중심 시장은 영국 런던의 발틱해운거래소(Baltic Exchange)다. 오늘날 BDI 등 운임지수 산출의 기준 시장이기도 하다."},{"id":"77f4054461","s":0,"n":"57","q":"부정기선 해운산업은 높은 리스크가 있으므로 많은 정보가 필요로 하는데 이에 해당사항이 먼 것은?","o":["선박의 이용가능성(availability of ships)","운임률","용선시장의 연속적인 변동(consequent fluctuations)","운항자의 개인 신용도"],"a":3,"e":"부정기선 영업의 핵심 정보는 선박의 이용가능성, 운임률 수준, 용선시장의 연속적 변동 같은 시장 정보다. 운항자(operator) 개인의 신용도는 계약 상대방 심사 사항일 뿐 시황 리스크 정보로 보기 어렵다."},{"id":"ca7c374aea","s":0,"n":"58","q":"부정기선시장에서 다양한 이해 관계를 지닌 관계자중 시장에서 주도적인 역할을 수행하는 당사자가 아닌 것은?","o":["화주(Trader)","운항자(oprator)","용선중개인(Broker)","보험대리인"],"a":3,"e":"부정기선시장을 주도하는 당사자는 화물을 보유·거래하는 화주(trader), 선복을 운용하는 선주·운항자(operator), 이를 연결하는 용선중개인(broker)이다. 보험대리인은 부수적 서비스 제공자에 불과하다."},{"id":"0d2a321594","s":0,"n":"59","q":"다음 중 부정기선 시장에서 화주의 역할로 적당한 것은?","o":["선박을 직접 소유하지는 않으나 1년 내지 2년 장기로 용선하여 화물을 확보 및 운송을 하는 자","화물을 직접 소유 혹은 구매하거나 중간 매매에 관계된 자","항해운송계약을 비롯한 각종 용선계약체결을 주도하는 자","선박의 건조와 해체를 포함하여 매각 및 매입을 하는 자"],"a":1,"e":"화주(trader)는 화물을 직접 소유·구매하거나 중간 매매에 관여하는 화물 측 당사자다. ①은 선박을 장기 용선해 운용하는 운항자(operator), ③은 브로커, ④는 선박매매·해체(S&P) 업무에 해당한다."},{"id":"20b7d45a8e","s":0,"n":"60","q":"용선중개인(Broker)의 기능을 설명한 것 중 거리가 먼 것은?","o":["용선을 중개한다.","선박의 투입과 거래 그리고 기타 해운관련 직업에 관계하는 등 다양한 기능을 수행한다.","용선계약체결 시 중간자로서 선주와 선주, 선주와 화주를 연계시키는 역할을 한다.","선사가 화물을 확보한 후, 시황의 변동 혹은 가용 선박의 미확보등을 사유로 계약을 다른 선사에게 되파는 (Cargo-Relet)의 역할을 한다."],"a":3,"e":"선사가 확보한 화물계약을 시황 변동이나 선복 미확보로 타 선사에 되파는 화물전대(cargo-relet)는 운항자(operator)의 영업행위다. 브로커는 용선 중개와 선주·화주 연결, 관련 부수업무를 수행하는 대리인이다."},{"id":"85e351e5ba","s":0,"n":"61","q":"용선중개인(Broker)의 기능 중에서 용선관련 재무관련 업무 수행을 행 하는데 이와 관계가 먼 것은?","o":["용선계약서의 작성","계약 후속조치와 변경사항 정리","화물을 직접 구매","운임/용선료 송금 및 수취"],"a":2,"e":"브로커의 재무 관련 업무는 용선계약서(C/P) 작성, 계약 후속조치와 변경사항 정리, 운임·용선료 송금 및 수취 등 계약 이행 관리에 국한된다. 화물을 직접 구매하는 것은 화주(trader)의 영역이다."},{"id":"2f53672c5d","s":0,"n":"62","q":"다음 중 부정기선 해운시장의 특성을 간략하게 서술한 것 중 적절하지 못한 것은?","o":["해운산업의 주체인 선주와 화주가 다양하다.","운임 조정 및 통제력이 높다.","다른 산업에 비해 시장 진입 및 퇴출 장벽이 낮다.","제도적 장치를 이용하는 경우가 있다."],"a":1,"e":"부정기선시장은 영세 다수 선주로 구성된 완전경쟁시장이어서 운임을 조정·통제할 능력이 매우 낮다. 정기선의 해운동맹(conference)처럼 운임을 협정·통제하는 카르텔 기능은 부정기선에 존재하지 않는다."},{"id":"ad8ccdc30f","s":0,"n":"63","q":"부정기선 해운산업의 운임시장에서 운임 조정 및 통제력이 적다라고 하는데 그 이유로 적당하지 않은 것은?","o":["해운시작에서 지분이 매우 미비","영세한 기업구조","상호간의 통합능력 부족","Pool제도 도입으로 하나의 관리체제"],"a":3,"e":"풀(Pool) 제도는 다수 선박을 하나의 관리체제로 묶어 선복 공급과 운임 교섭력을 높이는 장치이므로 통제력이 '적은' 이유가 될 수 없다. 시장 지분 미미, 영세한 기업구조, 통합능력 부족이 그 이유다."},{"id":"04976968ec","s":0,"n":"64","q":"해운산업에서 부정기선 시장 진입 장벽이 낮다고 보는 이유로 적당하지 않은 것은?","o":["신조 선박이나 중고 선박을 구입할 자금을 소유하거나 용선 할 수 만 있다면 부정기선을 운영할 수 있다.","해운선사를 운영할 수 있는 전문지식이나 자본기반도 없어도 진입할 수 있다.","발달된 조직구조나 제도가 필요없다.","시장졍쟁원리의 지배를 받기 때문에 자율적으로 제한하는 장치가 없다."],"a":3,"e":"진입장벽이 낮은 근거는 신조·중고선 확보나 용선만으로 영업이 가능하고, 특별한 전문조직·제도가 요구되지 않는다는 점이다. ④는 경쟁시장의 성격 서술일 뿐 진입 요건이 낮다는 직접적 근거가 아니다."},{"id":"15383f1b81","s":0,"n":"65","q":"다음 중 부정기선 시황의 변동요인으로 거리가 먼 것은?","o":["전세계 해상물동량","용선계약료","부정기선 선복수급","세계의 급작스러운 사건"],"a":1,"e":"용선계약료(운임)는 시황 변동의 결과로 나타나는 지표이지 변동을 일으키는 원인이 아니다. 시황 변동요인은 세계 해상물동량, 부정기선 선복 수급, 전쟁·사고 등 돌발사건(random shocks)이다."},{"id":"07fe79f35a","s":0,"n":"66","q":"최근들어 부정기선의 선복을 탄력적으로 공급하고 있는 이류로 관계가 적절하지 못한 것은?","o":["부정기선의 중소형화","고가의 선박건조비","효율적인 운항 및 관리","선주들간의 경쟁력 제고"],"a":0,"e":"최근 부정기선은 규모의 경제를 위해 대형화(케이프사이즈 등)되는 추세로 중소형화는 사실과 다르다. 고가의 선박건조비, 효율적 운항·관리, 선주 간 경쟁력 제고가 선복의 탄력적 공급을 유도한다."},{"id":"fb5df5afe2","s":0,"n":"67","q":"부정기선 해운 시장의 수요에 영향을 끼치는 요소가 아닌 것은?","o":["세계 경제동향(World Economy)","해상물동량(Seaborne Commodity Trades)","평균 운항거리(Average Haul)","운항환경(Operating Environment)"],"a":3,"e":"Stopford의 해상운송 수요 결정요인은 세계경제, 해상물동량, 평균운송거리(average haul), 돌발사건, 운송비용이다. 운항환경(operating environment)은 선복 공급·운항 측면 변수여서 수요요인이 아니다."},{"id":"3d4c4fc403","s":0,"n":"68","q":"해상운송 수요에 대한 개별 상품무역의 중장기적 영향에 관한 설명중 적절하지 못한 것은?","o":["특별한 물품에 대한 수요의 변화","물품 공급원의 변화","운송수요의 계절적 변화","생산기술의 변화"],"a":2,"e":"개별 상품무역이 수요에 미치는 중장기적 영향은 특정 물품 수요의 구조적 변화, 공급원(source) 이동, 생산기술 변화에서 비롯된다. 계절적 변화는 곡물 수확기처럼 단기·반복적 변동요인이다."},{"id":"ffcc26291a","s":0,"n":"69","q":"부정기선 시장의 공급에 영향을 끼치는 요소로 적당하지 않은 것은?","o":["가용 선대량(Merchant fleet)","운송비용(Transport Cost)","해체율과 해손율(Scrapping and Losses)","선대 생산성(Fleet Performance and Productivity)"],"a":1,"e":"운송비용(transport cost)은 무역량과 운송거리를 좌우하는 수요측 요인으로 분류된다. 공급요인은 가용 선대량(merchant fleet), 신조 인도, 해체율·해손율(scrapping and losses), 선대 생산성 등이다."},{"id":"c0273e21c8","s":0,"n":"70","q":"해운시장에서 미래의 수요를 예측하기 위해 선박 건조 시점은 언제가 유리하는 가?","o":["해운시황의 불황기가 끝날 무렵","해운시황의 불황기가 시작할 무렵","해운시황의 침체기가 시작될 무렵","해운시황의 호황기가 끝날 무렵"],"a":0,"e":"선박은 발주부터 인도까지 2~3년의 건조기간(lead time)이 걸리므로, 선가가 낮은 불황기 말에 발주하면 인도 시점이 회복·호황기와 겹쳐 유리하다. 호황 말 발주는 인도 시 불황과 겹쳐 손실 위험이 크다."},{"id":"d9db0cef92","s":0,"n":"71","q":"해운 운임의 주기적인 변동은 무엇에 의해 발생하는 가?","o":["신건조 인도와 선박의 노후화","선박 해체율과 해손율","선복의 수요와 공급의 균형 및 불균형","현재의 수익률"],"a":2,"e":"운임의 주기적(cyclical) 변동은 선복의 수요와 공급이 균형과 불균형을 반복하는 해운경기순환(shipping cycle)에서 발생한다. 신조 인도, 해체율, 수익률은 그 순환 과정에 작용하는 개별 변수다."},{"id":"6050ce6e16","s":0,"n":"72","q":"다음은 해운 운임의 변동에 관한 설명으로 적절하지 않은 것은?","o":["단기적인 운임변동은 주로 국지적인 화물과 선박의 수급 불균형에 의해 발생","계절적인 운임변동은 1년 중 특정 기간에 운임의 변동이 예상되는 경우로 주로 곡물 수확기를 중심으로 발생","주기적인 변동은 세계 경제 또는 경제 권역별 경제 성장 또는 생산율, 고용상태 등의 일반적인 환경에 의해 발생","주기적인 변동은 주로 그 변화 주기가 잛은 것이 특징으로 등락이 깊음"],"a":3,"e":"주기적 변동은 세계 경제순환과 선복 조정에 연동되어 주기가 길고 완만하게 진행되는 것이 특징이다. 짧은 주기와 급격한 등락은 국지적 수급 불균형에 따른 단기 변동의 성격이다."},{"id":"e1a8c2ad2c","s":0,"n":"73","q":"부정기선 운임결정에 영향을 주는 요인으로 관계가 먼 것은?","o":["경제성장과 교역량","일시적인 수요 증감에 따른 선복의 과부족","신조선 발주추세","단기운송계약 추세"],"a":3,"e":"부정기선 운임은 경제성장과 교역량, 일시적 수요 증감에 따른 선복 과부족, 신조선 발주 추세 등 수급 구조에 의해 결정된다. 단기운송계약 추세는 이미 형성된 현물(spot) 운임의 결과적 현상이다."},{"id":"f609b47861","s":0,"n":"74","q":"컨테이너 운송의 단점이라고 할 수 없는 것은?","o":["고가 선대, 터미널, 전산설비 등 자본비용","소량화물의 경우 혼재가 필요","허브 앤 스포크 시스템에 따른 서비스 품질 저하","화물 마케팅을 위한 대규모 조직의 구성과 유지"],"a":2,"e":"허브 앤 스포크(hub & spoke)는 대형선을 거점항에 집중 투입하고 피더로 연결해 효율과 빈도를 높이는 방식으로 컨테이너 운송의 장점이다. 막대한 자본비용, LCL 혼재 필요, 대규모 영업조직 유지가 단점이다."},{"id":"c29bc23ce5","s":0,"n":"75","q":"미국의 1998년 개정해운법(The Ocean Shipping Reform Act of 1998)에서 규정하고 있는 내용이 아닌 것은?","o":["대항선 투입 금지","회원선사와 화주간 비밀계약의 허용","태리프의 불신고","나도조항의 폐지"],"a":0,"e":"1998년 개정해운법(OSRA)의 핵심은 동맹선사와 화주 간 비밀 서비스계약(confidential service contract) 허용, 태리프 신고의무 폐지, 나도조항(me-too clause) 폐지다. 대항선(fighting ship) 금지는 1916년 해운법의 내용이다."},{"id":"615fa96b01","s":0,"n":"76","q":"정기선 서비스의 특성이 아닌 것은?","o":["공중운송인","동종화물운송","상대적으로 고가의 서비스","대규모 운영 조직"],"a":1,"e":"정기선은 소량·다품종의 이종화물을 다수 송화인으로부터 인수해 운송한다. 공중운송인(common carrier) 지위, 상대적으로 고가의 서비스, 대규모 운영조직은 정기선의 특성이며, 동종화물 만선운송은 부정기선의 특징이다."},{"id":"bb3e852842","s":0,"n":"77","q":"다음은 부정기선의 운임에 대한 설명이다 맞지 않은 것은?","o":["톤당운임, 선복운임, 일상요선계약운임 등이 있다.","항로에 따라 상자당 운임률이 적용된다.","상항에 근거하여 탄력적으로 결정된다.","지적운임, 선물운임, 장기계약운임 등이 있다."],"a":1,"e":"상자당 운임률(box rate)은 컨테이너 정기선에서 적용되는 품목무차별운임 방식이다. 부정기선 운임은 톤당운임·선복운임(lumpsum)·일대용선운임·지적운임·선물운임·장기계약운임 등으로 시황에 따라 탄력적으로 결정된다."},{"id":"fefb51c364","s":0,"n":"78","q":"정기선(Liner) 해운의 특징이 아닌 것은?","o":["계획적인 선박운영이다.","나용선을 정기선이라 한다.","운임협정 및 운송약관을 적용한다.","정기운항 선박은 고성능 고단가이다."],"a":1,"e":"나용선(bareboat charter)은 선박 자체만 임대하는 용선 형태로 부정기선 영업에 이용되며 정기선과 무관하다. 계획적 배선, 운임협정 및 운송약관(태리프) 적용, 고성능·고선가 선박 투입이 정기선의 특징이다."},{"id":"1fefbf5f12","s":0,"n":"79","q":"컨테이너 운송에 있어서 화주입장에서 본 장점에 해당되지 않은 것은?","o":["Door to Door 일관수송으로 적하시간과 비용의 감소","화물의 손상과 도난 감소","소량화물의 혼재작업을 ㅋ통한 콘솔(consol) 작업료 수입의 확보","화물포장비용의 절감"],"a":2,"e":"소량화물 혼재를 통한 콘솔(consol) 작업료 수입은 선사·포워더의 수익이므로 화주의 장점이 아니다. 화주 측 장점은 Door to Door 일관수송에 따른 시간·비용 절감, 화물 손상·도난 감소, 포장비 절감이다."},{"id":"7934b80014","s":0,"n":"80","q":"컨테이너 터미널이 갖추어야 할 기본 요건으로 적합하지 않은 것은?","o":["컨테이너 상태를 검사할 수 있는 시설 및 조직이 구비되어 있을 것","대량소비를 하는 대도시 근처에 위치할 것","대량컨테이너를 동시 수용하기 위하여 배후에 넓은 CY나 CFS가 확보되어 있을 것","컨테이너 터미널을 통과하는 대량 컨테이너를 신속, 정확하게 처리할 수 있는 능력이 갖춰진 시스템 하에서 운영될 것"],"a":1,"e":"컨테이너 터미널은 항만 접근성, 충분한 안벽·수심, 넓은 CY·CFS 배후부지, 신속한 처리 시스템, 컨테이너 검사 시설을 요건으로 한다. 대량소비 대도시 인접은 내륙 물류센터의 입지 조건이지 필수 요건이 아니다."},{"id":"7755985835","s":0,"n":"81","q":"다음 중 선적서류에 해당되지 않는 것은?","o":["항공화물운송장","선하증권","선적계약서","포장명세서"],"a":2,"e":"선적계약서는 운송계약의 약정 문서일 뿐 대금결제·통관에 제시되는 선적서류(shipping documents)가 아니다. 선하증권(B/L), 항공화물운송장(AWB), 포장명세서(packing list)는 대표적 선적서류다."},{"id":"d8a9973b30","s":0,"n":"82","q":"항해용선계약(Voyage Charter Party)에 관한 설명중 틀린 것은?","o":["용선료를 용선기간에 따라 결정하고 용선개시전에 미리 선급한다.","용선자는 선복을 이용하고 선주는 운송행위를 한다.","선주와 용선자간의 계약내용으로는 선내하역비 부담조건과 정박기간에 관한 사항이 중요시 된다.","용선자는 선주에게 운임을 지급하고 선주는 선박운항에 따른 제비용을 부담한다."],"a":0,"e":"용선료를 기간 기준으로 정하고 선급하는 것은 정기(기간)용선계약의 방식이다. 항해용선(voyage charter)은 특정 항구 간 1항차를 대상으로 화물량 또는 선복 기준 운임을 정하고, 선내하역비 부담조건과 정박기간이 핵심 쟁점이다."},{"id":"1ba46ece31","s":0,"n":"83","q":"다음 항해용선계약상의 선적․양륙 제비용 부담조건 중 선내하역비 전부를 용선자인 화주가 부담하는 하역조건은?","o":["Berth Term","F.I.(Free In)","F.O.(Free Out)","F.I.O.(Free In & Out)"],"a":3,"e":"선적·양륙 선내하역비를 모두 용선자(화주)가 부담하는 조건은 F.I.O.(Free In & Out)다. Berth Term은 선주 전액 부담, F.I.는 선적비만, F.O.는 양륙비만 화주 부담이다."},{"id":"0a9ba6d3ce","s":0,"n":"84","q":"해운동맹(Shipping Conference)에 관한 다음 설명중 틀린 것은?","o":["해운동맹을 부정기선동맹(Tramper Conference) 또는 협의협정(Discussion Agreement)이라고도 한다.","해운동맹에는 개방식동맹(Open Conference)과 폐쇄식동맹(Closed Conference)이 있다.","해운동맹은 계약운임제도(Contract Rate System), 운임환불제도(Freight Rebate System) 등의 수단으로 화주를 구속하기도 한다.","해운동맹의 주요기능으로는 운임협정, 항해협정, 운임공동계산협정 등이 있다."],"a":0,"e":"해운동맹은 정기항로에 취항하는 정기선사들의 카르텔이므로 정기선동맹(liner conference)이며, 부정기선동맹이라는 개념은 성립하지 않는다. 개방식·폐쇄식 구분, 계약운임제·운임환불제 등 화주구속수단, 운임·항해·공동계산협정은 옳은 서술이다."},{"id":"8cc50adc97","s":0,"n":"85","q":"다음 중 항해용선계약의 주요 계약내용이라고 볼 수 없는 것은?","o":["선박의 속도","하역조건","정박기간","운임"],"a":0,"e":"선박의 속도와 연료소비 보증은 선박 성능을 장기간 사용하는 정기용선계약(time charter)의 핵심 약정이다. 항해용선계약에서는 운임, 하역비 부담조건, 정박기간(laytime)과 체선료가 주요 내용이 된다."},{"id":"9d70d802fb","s":0,"n":"86","q":"다음 중 화물운송계약에 관한 설명중 옳은 것은?","o":["용선운송계약이란 운송인이 다수의 송화인으로부터 개개의 화물을 운송할 것을 인수하는계약을 말한다.","나용선계약이란 화물 운송을 위하여 선주로부터 선복의 일부를 용선하는 계약을 말한다.","기간용선계약은 하루 단위로 선복을 빌리는 일대용선계약을 말한다.","항해용선계약이란 특정의 항구로부터 항구까지 화물을 운송하기 위하여 용선하는 계약을 말한다."],"a":3,"e":"항해용선계약(voyage charter)은 특정 선적항에서 양륙항까지 1항차 운송을 목적으로 선복을 용선하는 계약이다. ①은 개품운송계약, ②는 선박 자체를 선원·장비 없이 임차하는 나용선, ③은 하루 단위의 일대용선(daily charter)에 대한 설명이다."},{"id":"e6e85e689d","s":0,"n":"87","q":"다음 중 부정기선의 특징과 관련이 있는 것은?","o":["주로 광석, 곡류, 목재등 살화물의 대량운송에 이용되고 있다.","항로가 일정하고 정기적으로 운항된다.","일반적으로 해운동맹에 가입한다.","운임은 운임율표에 따른다."],"a":0,"e":"부정기선은 광석·곡물·목재 등 살화물(bulk cargo)의 대량운송에 주로 이용된다. 고정 항로의 정기 운항, 해운동맹 가입, 운임율표(tariff) 적용은 모두 정기선의 특징이다."},{"id":"f32bbc8c40","s":0,"n":"88","q":"다음 중 20 feet Container에 관한 설명으로 옳은 것은?","o":["화물의 중량을 20톤까지 적재할 수 있는 컨테이너","높이와 폭의 합계가 20피트인 컨테이너","길이가 20피트인 컨테이너","높이는 8피트, 폭은 20피트인 컨테이너"],"a":2,"e":"컨테이너 규격은 길이를 기준으로 표시하므로 20피트 컨테이너는 길이가 20피트인 것을 말한다. 폭 8피트, 높이 8피트 6인치가 표준이며, 적재중량은 규격 명칭과 무관하다."},{"id":"496d65b1fe","s":0,"n":"89","q":"다음 중 용선 계약시 하역기간을 하역작업이 가능한 일자중 공휴일은 그 산정에서 제외하는 방법은?","o":["Running Laydays","Customary Quick Despatch","WWD SHEX","Weather Working Days"],"a":2,"e":"WWD SHEX는 하역 가능한 호천(好天) 기상일만 산정하면서 일요일과 공휴일(Sundays and Holidays Excepted)을 정박기간에서 제외하는 조건이다. Running laydays는 공휴일도 모두 산입하며 CQD는 관습적 조속하역 조건이다."},{"id":"941aaa0c74","s":0,"n":"90","q":"정기선에 대한 일반적인 설명으로 옳지 않는 것은?","o":["부정기선보다 운임의 변동폭이 크다.","소량이고 다종 다양한 화물로 구성된다.","운항형태가 규칙적이고 반복적이다.","부정기선보다 운임이 저렴하다."],"a":0,"e":"정기선 운임은 태리프와 동맹 협정으로 안정적으로 유지되어 변동폭이 부정기선보다 작다. 소량·다종 화물 구성, 규칙적·반복적 운항은 옳으며, 개품 단위운임 수준 자체는 정기선이 오히려 높은 편이다."},{"id":"a02357b42e","s":0,"n":"91","q":"송화인이 컨테이너를 이용하기 위하여 반출이나 반입할 때 작성하는 서류는?","o":["Dock Receipt","Container Receipt","Booking Note","Equipment Receipt"],"a":3,"e":"기기수도증(Equipment Receipt, E/R)은 송화인이나 운송인이 컨테이너·섀시 등 기기를 터미널에서 반출·반입할 때 상태와 수도 사실을 확인하기 위해 작성하는 서류다. Dock Receipt는 부두 화물수취증, Booking Note는 선복예약서다."},{"id":"e4b64f4a99","s":0,"n":"92","q":"다음 중 정기선 운임시장의 특성으로 옳은 것은?","o":["운임율이 시장기능에 따라 변한다.","카르텔이 형성되어 있어 시장에의 진입이 상대적으로 어렵다.","선주의 시장통제능력이 크지 않다.","경쟁을 제한하는 제도적 장치가 전무하다."],"a":1,"e":"정기선 시장은 해운동맹·전략적 제휴 등 카르텔과 대규모 선대·조직 투자 부담 때문에 신규 진입이 상대적으로 어렵다. 시장기능에 따른 운임 변동과 선주 통제력 부재, 경쟁제한장치의 부재는 부정기선 시장의 특성이다."},{"id":"a64d18a641","s":0,"n":"93","q":"다음 중 해운동맹의 주요 협정 내용이 아닌 것은?","o":["해상보험협정","운임협정","배선협정","공동계산협정"],"a":0,"e":"해운동맹의 주요 협정은 운임협정(rate agreement), 배선협정(sailing agreement), 운임 공동계산협정(pooling agreement), 중립감시기구 등 영업 관련 협정이다. 해상보험협정은 동맹의 협정 대상이 아니다."},{"id":"61ff41e38b","s":0,"n":"94","q":"컨테이너를 직접 적재하기 위하여 정열해 놓은 곳을 무엇이라 하는가?","o":["Storage Yard","Marshalling Yard","apron","Container Freight Station"],"a":1,"e":"하역 직전 선적 순서에 맞춰 컨테이너를 정렬해 두는 장소는 마샬링 야드(Marshalling Yard)다. 에이프런은 안벽과 접한 하역 작업대, CFS는 LCL 혼재·분류장, 스토리지 야드는 장치 보관 구역이다."},{"id":"0afd012c22","s":0,"n":"95","q":"선박의 정박기간을 당해 항구에서의 관습적 조속하역으로 설정한 조건은?","o":["CQD","Running laydays","SHEX","WWD"],"a":0,"e":"CQD(Customary Quick Despatch)는 해당 항구의 관습적 하역 방법과 속도에 따라 조속히 하역하는 정박기간 조건으로 체선료·조출료를 따지지 않는 것이 일반적이다. WWD·SHEX·Running laydays는 일수를 명시적으로 계산하는 방식이다."},{"id":"cb3057662c","s":0,"n":"96","q":"수출입 통계 및 항만 물동량 통계의 기준이 되는 컨테이너 규격은?","o":["8 feet","20 feet","35 feet","40 feet"],"a":1,"e":"수출입 및 항만 물동량 통계는 20피트 컨테이너를 1단위로 환산한 TEU(Twenty-foot Equivalent Unit) 기준으로 집계된다. 40피트 컨테이너는 2TEU(1FEU)로 환산된다."},{"id":"e37bae385a","s":0,"n":"97","q":"다음 컨테이너중 식품이나 수산물의 운송에 적합한 것은?","o":["Dry Container","Reefer Container","Open Top Container","General Ship"],"a":1,"e":"식품·수산물 등 온도 관리가 필요한 화물은 냉동·냉장장치를 갖춘 냉동컨테이너(Reefer Container)로 운송한다. 드라이 컨테이너는 일반잡화용, 오픈탑은 중량·장척 화물용이다."},{"id":"a06593b9bf","s":0,"n":"98","q":"선박의 현측을 통하여 크레인 등으로 화물을 하역하는 방식을 무엇이라 하는가?","o":["RO/RO","FO/FO","LO/LO","Lash"],"a":2,"e":"본선 현측에서 겐트리크레인 등으로 화물을 수직으로 들어 올려 적양하하는 방식은 LO/LO(Lift on/Lift off)다. RO/RO는 램프를 통한 자체 주행 방식, LASH는 부선(barge)을 본선에 적재하는 방식이다."},{"id":"d77befd8cd","s":0,"n":"99","q":"다음 중 컨테이너운송의 장점을 최대한도로 이용한 운송 방법은?","o":["CFS/CFS","CFS/CY","CY/CFS","CY/CY"],"a":3,"e":"CY/CY(FCL/FCL)는 송화인의 공장에서 컨테이너에 적입해 수화인 문전까지 개봉 없이 운송하는 Door to Door 방식으로 컨테이너의 일관수송 이점을 최대한 활용한다. CFS가 개입하면 혼재·분류 작업이 추가된다."},{"id":"49655162e7","s":0,"n":"100","q":"RORO운송과 같이 본선에 난간(Ship's Rail)을 이용할 수 없는 무역거래에서 FOB조건을 채택할 수 없는 경우에 이용할 수 있는 적합한 정형거래조건은?","o":["FCA","CIP","DDP","FAS"],"a":0,"e":"FCA(Free Carrier)는 지정장소에서 운송인에게 인도하면 위험이 이전되므로, 본선 난간(ship's rail)을 기준으로 하는 FOB를 쓸 수 없는 RO/RO·컨테이너 운송에 적합한 인코텀즈 조건이다. FAS는 선측 인도, CIP·DDP는 매도인이 운송·인도 의무를 더 부담한다."},{"id":"a74f332356","s":0,"n":"101","q":"다음 중 컨테이너에 관련된 국제협약이 아닌 것은?","o":["컨테이너 통관협약","TIR 협약","컨테이너 안전협약","TCM 조약"],"a":3,"e":"TCM 조약은 국제복합운송증권에 관한 조약안(Convention on Combined Transport of Goods)으로 컨테이너 자체를 규율하는 협약이 아니다. 컨테이너 통관협약(CCC), TIR 협약, 컨테이너 안전협약(CSC)이 컨테이너 관련 3대 국제협약이다."},{"id":"90c2dfe68b","s":0,"n":"102","q":"다음에서 하역비부담에 의한 분류에서 FIO(Free In and Out)조건으로 알맞은 것은?","o":["적하와 양하에 들어가는 하역비를 선주가 부담","적하와 양하에 들어가는 하역비를 하주가 부담","적하에 들어가는 하역비를 화주가 부담하고 양하에 들어가는 하역비를 선주가 부담","적하에 들어가는 하역비를 선주가 부담하고 양하에 들어가는 하역비를 하주가 부담"],"a":1,"e":"FIO(Free In and Out)는 선주가 적하·양하 하역비 모두에서 자유롭다는 뜻이므로, 선적과 양하 하역비를 전부 화주(용선자)가 부담한다. 부정기선 용선계약의 전형적 하역비 조건이다."},{"id":"2d55329dfd","s":0,"n":"103","q":"해상운송의 하역비 부담조건 중에서 적하작업에 들어가는 하역비를 하주가 부담하고 양하작업에 들어가는 하역비는 선주가 부담하는 조건은 무엇인가?","o":["Berth Term","FO(Free Out)","FI(Free In)","FIO(Free In and Out)"],"a":2,"e":"선주가 적하(In)에서만 면제되는 FI(Free In) 조건으로, 적하비는 화주가, 양하비는 선주가 부담한다. 반대는 FO(Free Out), 양쪽 모두 선주 부담은 Berth Term이다."},{"id":"fc8ab56a27","s":0,"n":"104","q":"다음의 부정기선 운항형태 중 선박만을 용선하여 인적 및 물적요소 전체를 용선자가 부담하는 방식은 무엇인가?","o":["항해용선(Voyage Charter)","일대용선(Daily Charter)","선복용선(Lump-sum Charter)","나용선(Bare-boat Charter)"],"a":3,"e":"나용선(Bare-boat Charter)은 선체만 빌리는 임대차 성격의 용선으로, 선원 배승·연료·수리·보험 등 인적·물적 요소 전부를 용선자가 부담하고 선주는 선박만 제공한다."},{"id":"fd558f23cb","s":0,"n":"105","q":"컨테이너 터미널의 마샬링야드(Marshalling Yard)에 대한 설명으로 옳은 것은?","o":["항만에 있어서 본선 안벽의 바로 배후에 있는 부분으로 컨테이너 하역장비가 설치된 곳이다.","선적해야 할 컨테이너를 하역 순서대로 정열해두거나 양하된 컨테이너를 배치해 놓은 장소를 말한다.","컨테이너 1 개를 채울 수 없는 소량화물을 보관하거나 컨테이너에 적입하는 장소를 말한다.","컨테이너 터미널 내에 있는 여러 종류의 하역기기를 수리, 점검하는 장소를 말한다."],"a":1,"e":"마샬링야드(Marshalling Yard)는 선적 컨테이너를 본선 하역 순서대로 배열하고 양하 컨테이너를 임시 배치하는 공간이다. ①은 에이프런(Apron), ③은 CFS, ④는 정비소(Maintenance Shop)에 해당한다."},{"id":"0b63e6e905","s":0,"n":"106","q":"해상운송에 있어서 정기선운송(Liner)과 부정기선운송(Tramper)의 비교에 대한 설명 중 맞지 않는 것은?","o":["정기선 운송은 이종화물을 취급하고, 부정기선 운송은 동종화물을 취급한다.","정기선 운송은 화주의 요구에 따라 서비스가 조정되고, 부정기선 운송은 선주와 용선자간의 협의에 의해 서비스가 결정된다.","운송계약은 정기선 운송은 선하증권(B/L)으로 체결하고, 부정기선 운송은 용선계약서(Charter Party)로 체결한다.","정기선 운송은 중개인이 화물집화를 담당하는 반면에 부정기선 운송은 영업부 직원이 화물집화를 담당한다."],"a":3,"e":"화물집화 주체가 뒤바뀐 설명이다. 정기선은 선사 영업부 직원이 직접 집화하고, 부정기선은 용선중개인(Chartering Broker)이 선복과 화물을 중개한다."},{"id":"aa18da2548","s":0,"n":"107","q":"다음에서 내륙 컨테이너 기지(Inland Container Depot ; ICD)의 설명과 거리가 먼 것은?","o":["ICD는 원래 내륙통관기지를 뜻하는 Inland Clearance Depot의 의미로 쓰였다.","본선작업과 마샬링(Marshalling) 기능을 수행하는 기능을 갖고 있다.","운송의 거점으로서 대량운송의 실현, 공차율의 감소, 운송회전율의 증가등을 통한 운송의 합리화를 실현하고 있다.","세관 통관하에 수출입 및 연계운송을 위하여 일시적인 장치, 창고보관, 재수출, 일시상륙 등의 기능을 담당하는 장소이다."],"a":1,"e":"본선 하역작업과 마샬링(Marshalling)은 항만 컨테이너 터미널의 고유 기능이다. ICD는 내륙에 위치해 통관·혼재·보관·연계운송을 담당하며 안벽 하역기능은 없다."},{"id":"25c5c3c328","s":0,"n":"108","q":"다음중 편의치적(Flags of Convenience)을 선호하는 이유가 아닌 것은?","o":["운항 및 안전기준의 철저한 이행","자국선원을 승선시키는 것에 비해 인건비 절감","국제금융시장의 이용 용이","운항에 따른 세금의 면제"],"a":0,"e":"편의치적(Flags of Convenience)의 유인은 저렴한 인건비, 조세 감면, 국제금융 접근성, 느슨한 규제이다. 운항·안전기준을 철저히 이행하는 것은 오히려 편의치적국의 취약점이자 회피 대상이다."},{"id":"54b5b73427","s":0,"n":"109","q":"다음은 내륙컨테이너기지(ICD: Inland Container Depot)의 특성을 나타낸 것이다. 특성에 해당되지 않는 것은?","o":["ICD에서는 많은 기능들이 수행되고 있으나 그 중에서도 화물의 혼재, 컨테이너의 배치, 적재 및 해체 등은 필수적인 임무로 간주되고 있다.","ICD는 전통적으로 항만에서 수행되는 기능 및 서비스의 대부분을 담당하고 있는 까닭에 내륙항(Inland Port)이라고도 불리우며, 그 결과 항만에서의 보관시설 부족문제를 해소한다.","ICD의 기능적 구조범위는 매우 넓어 세관, 선사, 철도회사, 트럭회사, 포워더, 은행, 보험회사, 컨테이너 수리소, 포장회사, 관련 정부기관 등이 위치하게 된다.","ICD는 화물의 출발지와 최종목적지가 다른 소량의 컨테이너화물을 만재컨테이너화함으로써 소량화주에게 운송비의 절감을 가져다 줄 수 있으나 대량화주에게는 경제적 의미가 없다."],"a":3,"e":"ICD는 소량화물의 혼재(consolidation)로 소량화주뿐 아니라 대량화주에게도 대량운송·공차율 감소·회전율 향상에 따른 물류비 절감을 제공하므로 대량화주에게 무의미하다는 설명은 옳지 않다."},{"id":"d318992073","s":0,"n":"110","q":"컨테이너선의 변형으로 컨테이너 대신에 규격화된 전용 선박을 운송단위로 사용하며, 부선에 화물을 적재한 상태로 본선에 적입 및 운송하는 선박은 무엇인가?","o":["유송선","래쉬선(LASH)","특수선","카페리(Car Ferry)"],"a":1,"e":"래쉬선(LASH; Lighter Aboard Ship)은 화물을 적재한 부선(barge/lighter)을 그대로 본선에 적입·운송하는 부선운반선으로, 하역방식은 Float on/Float off이다."},{"id":"c817625fc7","s":0,"n":"111","q":"다음 중 화물의 종류나 화주에 관계없이 운송 단위(예를 들면 컨테이너 당)를 기준으로 일률적으로 부과하는 운임은?","o":["FAK Rate","Commodity Rate","Through Rate","Special Rate"],"a":0,"e":"FAK(Freight All Kinds) Rate는 품목·화주를 구분하지 않고 컨테이너 등 운송단위당 동일 요율을 적용하는 무차별운임이다. Commodity Rate는 품목별, Class Rate는 등급별 운임이다."},{"id":"300972a1bd","s":0,"n":"112","q":"해상운송은 운송계약에 따라서 개품운송과 용선운송으로 나눌 수 있다. 다음 중 잘못 설명된 것은 무엇인가?","o":["개품운송의 선박은 주로 정기선을 이용하여 화물을 운송한다.","용선운송의 하역조건은 FIO 조건으로 적양하 비용을 하주가 부담하는 조건이다.","개품운송에서 적용하는 운임은 Tariff Rate운임을 적용한다.","용선운송은 주로 컨테이너화물 및 Unit화물을 운송한다."],"a":3,"e":"용선운송은 철광석·석탄·곡물 등 대량 산화물(bulk cargo) 운송이 주 대상이며, 컨테이너·유닛화물의 정형 운송은 정기선 개품운송의 영역이다."},{"id":"58f1c209a5","s":0,"n":"113","q":"컨테이너 하역방식 중 Barge에 컨테이너 또는 일반화물을 적재하고 barge에 설치되어 있는 crane 또는 elevator에 의하여 하역되는 방식은 어떤 것인가?","o":["Lift on/ Lift off","Sea-Bee Ship","Roll on/ Roll off","Float on/ Float off"],"a":3,"e":"부선(barge)에 화물을 적재한 채 본선에 띄워 넣고 자체 크레인이나 엘리베이터로 처리하는 방식은 Float on/Float off(FO/FO)이다. LO/LO는 크레인 수직하역, RO/RO는 차량 수평하역이다."},{"id":"3f83b61ba2","s":0,"n":"114","q":"외국의 한 수입업자가 국내의 다수 수출업자들로부터 소량의 상품들을 구매하여 동일 시기에 동일지역으로 컨테이너 단위로 운송할 경우 주로 이용될 수 있는 운송형태는?","o":["CFS/CFS","CFS/CY","CY/CY","ICD/CFS"],"a":1,"e":"다수 송화인의 소량화물을 선적지 CFS에서 혼재해 하나의 FCL로 만들고 목적지 CY에서 단일 수하인에게 인도하는 CFS/CY(Buyer's consolidation) 방식이다."},{"id":"fadb71ee1d","s":0,"n":"115","q":"다음 중 이동식 컨테이너 취급장비로서 컨테이너를 차곡차곡 쌓거나 컨테이너를 내리는 일 또는 섀시나 트레일러에 싣고 내리는 일을 하는 것은?","o":["스트래들 캐리어(Straddle Carrier)","갠트리 크레인(Gantry Crane, Shore Crane, Quay Crane)","트랜스테이너(Transtainer, Transfer Crane)","위치 크레인(Winch Crane)"],"a":2,"e":"트랜스테이너(Transfer Crane)는 CY에서 컨테이너를 다단 적재·해체하고 섀시·트레일러에 상하차하는 이동식 야드 장비다. 갠트리 크레인은 안벽 본선하역용 고정 설비다."},{"id":"48cd79a911","s":0,"n":"116","q":"다음 해상운임의 부대비용 중 Detention Charge에 대한 설명은?","o":["북미수출의 경우 도착항에서의 하역 및 터미널 작업비용을 해상운임과는 별도로 징수하는 것으로서 현재 20TEU 컨테이너당으로 부과하고 있다.","적하 또는 양하 일수가 약정된 정박기간을 초과하는 경우 초과일수에 대하여 용선자가 선주에게 지불하는 것으로 1일 또는 1톤당으로 지불하는 금액이다.","화주에게 허용된 시간(Free Time)을 초과하여 컨테이너를 방치하였을 경우 송화인이나 수화인이 선박회사에게 지불해야 할 비용이다.","항해용선계약서에 규정된 시간내에 선적이나 양하를 완료하지 못할 경우 선주에게 지불하는 비용이다."],"a":2,"e":"Detention Charge는 화주가 반출한 컨테이너를 무료사용기간(Free Time) 내에 반납하지 않을 때 선사에 지급하는 장비 지체료다. ①은 DDC, ②·④는 체선료(Demurrage) 설명이다."},{"id":"9f75a657d0","s":0,"n":"117","q":"해상운송은 항해일정의 공시 여부, 운임요율 등에 따라서 정기선 운송과 부정기선운송으로 나뉘어진다. 다음 중 해상운송에 대한 설명으로 올바르지 못한 것은?","o":["정기선은 정기항로에 취항하고 있는 선박을 말하며 주로 완제품이나 반제품 등의 일반화물의 수송에 이용된다.","부정기선은 일정한 항로나 화주를 한정하지 않고 화물이 있을 때마다, 선복의 수요가 있을 때마다 화주가 요구하는 시기와 항로에 따라서 화물을 운송한다.","정기선은 화주에게 양질의 서비스를 제공하기 위해 참단장비를 갖춘 선박을 이용하여, 통상 포장화물의 운송에 이용된다.","부정기선은 해운시황에 따라서 선복의 공급이 불균형적이므로 카르텔을 형성하여 선복수급을 조정할 필요성이 정기선에 비해서 크다."],"a":3,"e":"카르텔(운임동맹) 결성으로 운임·선복을 조정하는 것은 정기선의 특징이다. 부정기선은 수요·공급에 따라 자유경쟁 시장에서 운임이 형성되어 동맹 결성 유인이 약하다."},{"id":"3a720d8774","s":0,"n":"118","q":"정기선 운임의 산정 기준으로 적합하지 않은 것은?","o":["운임의 안정(price stability)","시장의 수요와 공급의 균형(balance between supply and demand in a market)","공동운항(Joint service)","화물 간 교차보조(Cross-subsidization between commodities)"],"a":1,"e":"시장의 수요·공급 균형에 의한 운임 형성은 부정기선(Tramper) 시장의 특성이다. 정기선 운임은 태리프(Tariff)에 기초해 운임 안정, 품목 간 교차보조, 공동운항 등을 기준으로 산정된다."},{"id":"26438efbcd","s":0,"n":"119","q":"정기선과 부정기선 운영에서 해상운임은 어떻게 결정되어 지는가?","o":["수요 측의 운임 부담 능력을 상한과 공급 측의 운송원가를 하한으로 하는 범위내에서 균형에 따라 결정","공급 측인 선사에 의해 일방적으로 결정","운송원가와의 관계는 매우 불확실한 상태에서 결정","가격경쟁의 배제를 주요 협정사항으로 결정"],"a":0,"e":"해상운임은 상한이 수요자(화주)의 운임부담력, 하한이 공급자(선사)의 운송원가인 범위 안에서 수급 균형점으로 결정된다. 원가 이하로는 지속 불가, 부담력 초과 시 화물이 이탈한다."},{"id":"9d867fea3f","s":0,"n":"120","q":"정기선 운임 산정기준에서 화물의 송장가격이 높은 고가품목은 비싼 운임을 적요하고 낮은 품목은 비교적 싼 운임을 적용하는 기준은?","o":["운임의 안정(price stability)","시장의 수요와 공급의 균형(balance between supply and demand in a market)","공동운항(Joint service)","화물 간 교차보조(Cross-subsidization between commodities)"],"a":3,"e":"화물 간 교차보조(Cross-subsidization)로, 운임부담력이 큰 고가품에는 높은 운임을, 저가·대량품에는 낮은 운임을 적용해 전체 항로 수익을 유지하는 종가주의적 산정 기준이다."},{"id":"6486e514d4","s":0,"n":"121","q":"정기선 컨테이너 표준 운임표 규정의 구분 중 해당 되지 않는 것은?","o":["해상운송 규정","항만 및 관련규정 서비스 요율 규정","회원정보규정","내륙운송 규정"],"a":2,"e":"표준 운임표(Tariff)는 해상운송 규정, 항만 및 관련 서비스 요율 규정, 내륙운송 규정으로 구성된다. 회원정보규정은 운임표가 아니라 동맹 조직·규약에 관한 사항이다."},{"id":"217a00b8f5","s":0,"n":"122","q":"정기선 표준 운임표 규정 중 해상운송 규정에 수록된 내용으로 적합하지 않은 것은?","o":["운임산정 기준","컨테이너화물의 혼재","운송주선 수수료","터미널 내 화물 취급료"],"a":3,"e":"터미널 내 화물 취급료(THC)는 항만 및 관련 서비스 요율 규정 항목이다. 해상운송 규정에는 운임산정 기준, 컨테이너 혼재, 운송주선 수수료 등이 수록된다."},{"id":"0fc3020344","s":0,"n":"123","q":"정기선 표준 운이표 규정 중 항만 및 관련 서비스 요율 규종에 수록된 내용으로 적합하지 않은 것은?","o":["터미널 내 화물 취급료","운송관련 서류","소량 컨테이너화물(LCL)","체화료(demurrage), 장비 지체료(detention charge)"],"a":1,"e":"운송관련 서류(B/L 등 서류 규정)는 해상운송 규정에 속한다. 항만 및 관련 서비스 요율 규정에는 THC, LCL 취급료, 체화료(Demurrage), 장비 지체료(Detention) 등이 담긴다."},{"id":"1460db1136","s":0,"n":"124","q":"다음 중 선박의 운항비에 포함되지 않는 것은?","o":["도선료","연료비","검량비","일반관리비"],"a":3,"e":"일반관리비는 본사 조직 유지에 드는 간접비로 선박 단위 운항비에 들어가지 않는다. 도선료·연료비·검량비는 특정 항해에 직접 귀속되는 운항 관련 비용이다."},{"id":"e79d956ae6","s":0,"n":"125","q":"정기선 운임에서 화물의 선적자, 즉 수출업자가 선적지에서 운임을 지불하는 것을 무엇이라고 하는가?","o":["선불운임","이중운임","후불운임","최저운임"],"a":0,"e":"선불운임(Freight Prepaid)으로, CIF·CFR 등 매도인이 운임을 부담하는 조건에서 수출업자가 선적지에서 지급하고 B/L에 Freight Prepaid로 표시된다."},{"id":"b3ca75bb7c","s":0,"n":"126","q":"정기선 운임에서 무역조건이 FOB인 경우 화물이 도착 후 수하인(consignee)또는 그 대리인이 운임을 지불하는 것은?","o":["선불운임(Freight prepaid)","후불운임(Freight collect)","특별 운임(Special rates)","최저운임(Minimum charges)"],"a":1,"e":"후불운임(Freight Collect)이다. FOB에서는 운임 부담이 매수인에게 있어 도착지에서 수하인 또는 그 대리인이 지급하며 B/L에 Freight Collect로 기재된다."},{"id":"12c57a038c","s":0,"n":"127","q":"다음 중 하역비 부담에 의한 운임의 구분이 아닌 것은?","o":["Berth term(Liner term)","FI(Free in)","OCP(overland common point)","FIO(Free in & out)"],"a":2,"e":"OCP(Overland Common Point)는 북미 내륙 공통지점까지의 복합운송 운임으로 운송구간·지역에 따른 구분이다. 하역비 부담 기준 구분은 Berth Term, FI, FO, FIO이다."},{"id":"423be68ffa","s":0,"n":"128","q":"화물을 본선으로 양하하는 비용과 위험 부담은 화주의 책임이며, 받대로 선사는 적하 비용을 부담하는 것은?","o":["Berth term(Liner term)","FO(Free out)","BAF(Bunker adjustment factor)","FI(Free In)"],"a":1,"e":"선주가 양하(Out)에서 면제되는 FO(Free Out) 조건으로, 적하비는 선사가 부담하고 양하비와 그 위험은 화주가 진다. 반대 조건은 FI(Free In)이다."},{"id":"8133bc5f82","s":0,"n":"129","q":"선주가 적하 및 양하의 비용을 모두 부담하혀 제반지용과 위험부담을 지는 것은 다음 중 어느 것인가?","o":["Berth term(Liner term)","FO(Free out)","FIO(Free in & out)","FI(Free In)"],"a":0,"e":"Berth Term(Liner Term)으로, 정기선 개품운송의 기본 조건이며 적하·양하 하역비와 그에 따른 위험을 모두 선주가 부담해 운임에 포함시킨다."},{"id":"b09818d3c6","s":0,"n":"130","q":"다음 중 화물의 가체에 의한 운임 분류중 적당하지 않은 것은?","o":["품목별 운임(Commodity rates)","보통 운임(Common rates)","등급별 운임(Class rates)","전통 운임(Through rates)"],"a":3,"e":"Through Rate(통운임)는 둘 이상의 운송인·구간을 통과하는 전 구간 일괄운임으로 운송구간에 의한 분류에 속한다. 화물의 종류·가치 기준 분류는 품목별·등급별·보통·종가 운임이다."},{"id":"e497b67540","s":0,"n":"131","q":"다음 중 운임동맹이 공통 운임표(common tariff)에 수록하여 동일 품목을 가진 모든 화주에게 동일한 수준으로 부과하는 운임을 말하는 것은?","o":["품목별 운임(Commodity rates)","보통 운임(Common rates)","등급별 운임(Class rates)","종가 운임(Ad-valoren rates)"],"a":1,"e":"보통운임(Common Rates)은 운임동맹이 공통운임표(common tariff)에 등재해 동일 품목을 선적하는 모든 화주에게 차별 없이 동일 수준으로 적용하는 기본 운임이다."},{"id":"72bb53ad2b","s":0,"n":"132","q":"다음 중 운송 구간에 의한 운임 분류의 종류가 아닌 것은?","o":["전통 운임(Through rate)","공동 운임(Joint rate)","구간 운임(Local rates)","이중 운임(Dual rate)"],"a":3,"e":"이중운임(Dual Rate)은 동맹 계약화주와 비계약화주를 차별하는 화주 관계 기준 운임이다. 운송구간 기준 분류는 통운임(Through), 공동운임(Joint), 구간운임(Local)이다."},{"id":"e28b2971ca","s":0,"n":"133","q":"다음 중 물량에 의한 운임 분류로서 적합하지 않은 것은?","o":["우대운송계약운임(Service contract rates)","대량화물우대운임(Time/Volume rates)","독자운임결정권운임(Independent action rates)","특별견적운임(Special quotation rates)"],"a":2,"e":"독자운임결정권운임(Independent Action)은 동맹선사가 비동맹선사와의 경쟁을 위해 동맹 태리프와 달리 독자적으로 신고·적용하는 운임으로, 물량 기준 분류가 아니다."},{"id":"70d0d23a9c","s":0,"n":"134","q":"이중운임(Dual rate)에 관한 설명으로 적합한 것은?","o":["1톤 미만의 소량화물에 적용하는 운임","운임동맹이 저 운임의 비 동맹선사와의 경쟁을 위해 운임동맹과 계약을 체결한 화주에게 약 9.5% 낮은 운임을 적용","화주와의 유대관계를 고려하여 대형화주에게 일반운임보다 낮은 운임을 적용","선사가 일정기간 화주가 제공한 물량의 과다에 따라 차등제로 적용하는 운임"],"a":1,"e":"이중운임제(Dual Rate System)는 동맹이 비동맹 저운임선사에 대응해 동맹과 운임협정(계약)을 맺은 화주에게 비계약화주보다 약 9.5% 낮은 계약운임을 적용하는 제도다."},{"id":"6c163a7b5f","s":0,"n":"135","q":"다음 중 비동맹 선사와의 경쟁을 위한 운임이 아닌 것은?","o":["자유운임(Open rates)","특별운임(Special rates)","특별견적운임(Special quotation rates)","독자운임결정권운임(Independent action rates)"],"a":2,"e":"특별견적운임(Special Quotation Rates)은 대량화물 등에 대해 개별 견적으로 정하는 물량 기준 운임이다. 비동맹 대응 경쟁운임은 자유운임(Open Rate), 특별운임, 독자운임결정권운임이다."},{"id":"488607800e","s":0,"n":"136","q":"운임동맹이 비동맹 선사와의 집화경쟁을 위해 특정품목에 대해 공통 운임(Common rate)보다 낮게 책정한 운임은?","o":["자유운임(Open rates)","특별운임(Special rates)","특별견적운임(Special quotation rates)","독자운임결정권운임(Independent action rates)"],"a":1,"e":"특별운임(Special Rates)으로, 동맹이 비동맹선사와의 집화경쟁이나 화물 유치를 위해 특정 품목·구간에 한해 공통운임보다 낮게 책정하는 일시적 인하운임이다."},{"id":"c5bc1cf62f","s":0,"n":"137","q":"다음 중 정기선에서 컨테이너 이용의 장점과 거리가 먼 것은?","o":["경제성","안정성","신속성","고가성"],"a":3,"e":"컨테이너화의 장점은 하역 신속성, 화물 안전성, 포장·보관비 절감 등 경제성이다. 컨테이너·전용선·터미널에 막대한 자본이 드는 고가성(높은 초기투자)은 단점에 해당한다."},{"id":"962f3b9dfc","s":0,"n":"138","q":"갑작스러운 유가(油價)인상분에 의한 추가적인 비용을 보전하기 위해 부과하는 할증료는?","o":["유류할증료(Bunker adjustment factor)","통화할증료(Currency adjstmen factor)","수에즈 운하 할증료(Suez Canal surcharge)","과중 할증료(Heavy lift charge)"],"a":0,"e":"유류할증료(BAF; Bunker Adjustment Factor)로, 급격한 연료유가 상승분을 보전하기 위해 기본운임에 부가한다. 환율 변동 보전은 통화할증료(CAF)다."},{"id":"0c2f235cbb","s":0,"n":"139","q":"화물의 특수한 요구에 귀속하는 추가 비용을 보전하기 위해 부과하는 운임의 종류가 아닌 것은?","o":["차별항 운임(Outport arbitrary)","선택 항료(Optional charge)","전쟁위험 할증료(War risk premium)","최저운임(Minimum charges)"],"a":3,"e":"최저운임(Minimum Charge)은 소량화물에 대해 정해진 최소 징수액으로 화물의 특수성에 따른 추가비용 보전 항목이 아니다. 차별항 운임·선택항료·전쟁위험할증료는 특수 요구에 따른 부가운임이다."},{"id":"042fbac948","s":0,"n":"140","q":"선박이 최종 목적 항에 직접 기항하지 않아 화물의 환적으로 인해 추가로 발생하는 비용을 보전하기 위해 부과하는 요금은?","o":["선택항료(Optional charge)","터미널 접수료(Terminal receiving charge)","환적료(Transshipment charge)","도착지 인도료(Destination delivery charge)"],"a":2,"e":"환적료(Transshipment Charge)로, 최종 목적항에 직접 기항하지 않아 중간항에서 환적(T/S)할 때 발생하는 추가 하역·보관·연계운송 비용을 보전한다."},{"id":"e79c9c09b8","s":0,"n":"141","q":"화주가 선적 당시에 최종 목적 항을 두개 이상 정하여 최초 항 도착 전에 양하 항을 지정하는 경우 적부상의 문제점을 감안하여 부과하는 요금은?","o":["차별항 운임(Outport arbitrary)","선택 항료(Optional charge)","항구 변경료(Diversion charge)","특별 운항료(Special operaing service charge)"],"a":1,"e":"선택항료(Optional Charge)로, 선적 시 둘 이상의 양륙항을 정해두고 최초항 도착 전 지정하는 경우 선택항 화물을 꺼내기 쉽게 적부(stowage)해야 하는 부담을 반영해 부과한다."},{"id":"3a9f358a01","s":0,"n":"142","q":"정기선 운항 수입의 중 약 80% 이상을 차지하고 있는 수입원은 다음 중 어느 것인가?","o":["운임 수입","대선 수입","부대 수입","스페이스 사용료"],"a":0,"e":"정기선 운항 수입의 80% 이상은 화물운송의 대가인 운임 수입(freight revenue)이며, 대선 수입이나 각종 부대 수입은 보조적 수입원에 불과하다."},{"id":"023878ab19","s":0,"n":"143","q":"자사 선박의 스페이스 중 일부를 타 선사에게 빌려 주는 대가로 합의된 스페이스 사용료(charterage)를 무엇이라고 하는가?","o":["운임 수입","대선 수입","부대 수입","간접 수입"],"a":1,"e":"대선 수입(charterage)으로, 자사 선박의 잔여 선복(slot/space)을 타 선사에 제공하고 받는 스페이스 사용료다. 얼라이언스의 슬롯 차터가 대표적이다."},{"id":"e591895caf","s":0,"n":"144","q":"정기선 운항 수입 중 부대 수입원의 종류가 아닌 것은?","o":["컨테이너 화물 작업장 사용료(CFS charge)","체화료(Demurrage)","지체료(Detention charge)","스페이스 사용료(charterage)"],"a":3,"e":"스페이스 사용료(charterage)는 선복 임대에서 생기는 대선 수입이다. 부대 수입은 CFS charge, 체화료(Demurrage), 지체료(Detention) 등 운송 부수 서비스에서 발생하는 수입이다."},{"id":"51e7e19d75","s":0,"n":"145","q":"정기선 운항과 관련된 비용 중 고정비용(fixed costs)에 해당하지 않는 것은?","o":["자본비(Capital costs)","선박 운항비(Operating costs)","항해 비용(Voyage costs)","직접 비용(Direct costs)"],"a":3,"e":"직접 비용(Direct Costs)은 터미널 비용 등 화물량에 따라 변하는 변동비에 속한다. 고정비는 자본비, 선박 운항비, 항해 비용처럼 적취량과 무관하게 발생하는 비용이다."},{"id":"b5247b930a","s":0,"n":"146","q":"정기선 운항과 관련된 변동 비용(variable costs)중에서 간접비용에 해당되지 않는 것은?","o":["컨테이너, 트레일러 공급비용","터미널 비용","컨테이너, 트레일러 수리 및 정비 비용","적하보험"],"a":1,"e":"터미널 비용은 처리 물량에 직접 대응하는 직접 변동비다. 컨테이너·트레일러 공급비와 수리·정비비, 적하보험 등은 특정 화물에 배부하기 어려운 간접 변동비다."},{"id":"0bdb4d36a7","s":0,"n":"147","q":"다음에서 본선 갑판 상에 컨테이너 하역용 갠트리 크레인을 장착하고 있는 컨테이너 선은?","o":["기어 컨테이너선","세미 컨테이너선","풀 컨테이너선","컨버터블 컨테이너선"],"a":0,"e":"기어(Geared) 컨테이너선으로, 갑판에 자체 갠트리 크레인을 갖춰 하역설비가 없는 항만에서도 자력 하역이 가능하다. 반대는 하역장비가 없는 Gearless 선박이다."},{"id":"7dd5ccac7c","s":0,"n":"148","q":"정기선운영에서 컨테이너 적재를 목적으로 하고 있지만 벌크도 실을 수 있는 겸용 선박은?","o":["기어 컨테이너선","세미 컨테이너선","풀 컨테이너선","컨버터블 컨테이너선"],"a":3,"e":"컨버터블 컨테이너선(Convertible Container Ship)은 화물창의 일부 또는 전부를 컨테이너와 벌크·일반화물용으로 전환할 수 있는 겸용선으로, 시황에 따라 용도를 바꿀 수 있다."},{"id":"543b10d3cf","s":0,"n":"149","q":"컨테이너 선의 하역계획은 육상에서 작성되고 하역과 지휘도 육상에서 주도하지만 재래 정기선에서는 누가 하역계획을 입안하였는가?","o":["선장","갑판장","1등 항해사","통신사"],"a":2,"e":"재래 정기선에서는 화물 적부와 하역계획(stowage plan)을 화물 책임자인 1등 항해사(Chief Officer)가 본선에서 입안했다. 컨테이너선은 육상 플래너가 베이플랜을 작성한다."},{"id":"c1643f4858","s":0,"n":"150","q":"부정기선운영에서 벌크 캐리어로 운송되는 메이저 벌크(Major Bulk)로 해당되지 않는 것은?","o":["철광석","시멘트","석탄","곡물"],"a":1,"e":"시멘트는 마이너 벌크(minor bulk)에 해당한다. 메이저 벌크는 철광석, 석탄, 곡물에 보크사이트·알루미나, 인광석을 포함하는 대량 산화물 5대 품목이다."},{"id":"533fd9e5d0","s":0,"n":"151","q":"벌크선(Bulk carrier)에서 특정 화물을 전용으로 적재하는 선박을?","o":["전용선","범용선","정기선","예인선"],"a":0,"e":"특정 화물만 실을 수 있도록 선체·하역설비를 특화한 선박이 전용선(specialized carrier)으로, 광석전용선·자동차전용선 등이 대표적이다. 범용선은 여러 화물을 겸용 적재한다."},{"id":"596e245105","s":0,"n":"152","q":"다음에서 파나마운하를 통화할 수 있는 최대 선형의 선폭은?","o":["31.2m","32.2m","33.3m","34.2m"],"a":1,"e":"파나마운하 통항 한계선형인 파나막스(Panamax)의 최대 선폭은 약 32.2m(106ft)이며, 이는 갑문(lock) 폭 33.53m에 의해 제약된다."},{"id":"aeb6f55b39","s":0,"n":"153","q":"벌크선에서 세계 어느 항구에도 입항할 수 있는 핸디 사이즈의 선박의 중량으로 적합한 것은?","o":["15,000~20,000 중량톤","15,000~30,000 중량톤","15,000~45,000 중량톤","15,000~50,000 중량톤"],"a":2,"e":"핸디사이즈(Handysize)는 자체 하역설비를 갖추고 수심 제약이 적어 세계 대부분 항만에 입항 가능한 소형 벌크선으로, 통상 1만5천~4만5천 재화중량톤(DWT) 급으로 분류된다."},{"id":"a48b41a597","s":0,"n":"154","q":"부정기선의 경우 신속한 항해나 정확한 스케쥴보다는 무엇이 더 중요한가?","o":["화물의 가치","화물의 출하 시기","저렴한 운임","화물의 수송 단위"],"a":2,"e":"부정기선(tramper)은 저운임부담력 대량 원자재를 실어 나르므로 정시성보다 단위당 저렴한 운임이 핵심 경쟁요소이며, 신속성·정확한 스케줄은 정기선의 강점이다."},{"id":"10bba605a6","s":0,"n":"155","q":"다음에서 부정기선 운항 시 관심을 두어야 할 점은 무엇인가?","o":["적절한 배선","육상설비투자","저렴한 운임","항로및 항해시기"],"a":0,"e":"부정기선은 고정 항로·스케줄이 없어 화물이 있는 곳에 선박을 붙이는 적절한 배선(ship allocation)이 수익을 좌우하며, 공선항해(ballast voyage) 최소화가 그 목표다."},{"id":"fe7d7d2cc8","s":0,"n":"156","q":"다음에서 장기운송계약의 장점으로 관련이 부적절한 것은?","o":["안정된 경영으로 해운산업의 발전에 기여한다.","장기계약을 담보로 자금조달이 쉬워진다.","선주와 화주모두에게 시황변동에 따른 위험을 감소시킬수 있다.","시황변동이나 물가수준을 적절하게 반영을 한다."],"a":3,"e":"장기운송계약(COA·장기수송계약)은 운임을 미리 고정하므로 시황변동이나 물가수준을 즉시 반영하기 어려운 점이 오히려 단점이다. 안정 경영·자금조달 용이·위험분산이 실제 장점이다."},{"id":"a3c4992364","s":0,"n":"157","q":"장기운송계약에 투입되는 선박은 주로 다음 중 어느 선박인가?","o":["범용선","전용선","정기선","예인선"],"a":1,"e":"장기운송계약은 특정 화주의 특정 화물을 반복 수송하므로 그 화물에 최적화된 전용선(specialized carrier)이 투입되는 것이 일반적이다."},{"id":"97ced39c9a","s":0,"n":"158","q":"다음 중 부정기선의 정박기간을 산정할때 고려대상이 아닌 것은?","o":["화물의 종류","양륙지의 싱황","양륙지의 관습","화물의 무게"],"a":3,"e":"정박기간(laytime) 산정은 화물의 종류, 양륙지의 하역능력·혼잡 상황, 그 항의 관습(custom of the port)을 기준으로 하며, 화물의 무게 자체는 산정 기준이 아니다."},{"id":"c5ab5e8537","s":0,"n":"159","q":"선장과 화주는 하역이 종료되면 무슨 서류에 서명을 하고 제출하여야 하나?","o":["하역준비완료통지서(Notice of Readiness)","정박일 계산서(Laydys statement)","항해용선계약서(Voyago charter)","도착지 인도서(Destination delivery statement)"],"a":1,"e":"하역 완료 후 실제 소요된 정박일수를 집계해 선장과 화주가 서명·제출하는 서류가 정박일 계산서(laydays statement)이며, 이를 근거로 체선료·조출료를 정산한다."},{"id":"dfd8083c21","s":0,"n":"160","q":"부정기선의 운임시장에서는 선복의 수급관계에 가장 예민하게 영향을 주는 것은?","o":["정치적 불안정 요인","경제의 호황 또는 불황","대체에너지원의 수요","날씨와 계절적인 요인"],"a":1,"e":"부정기선 운임은 선복 수급에 즉각 반응하는데, 그 수급을 가장 예민하게 움직이는 요인은 세계경제의 호황·불황에 따른 물동량 변동이다."},{"id":"0a9462cf16","s":0,"n":"161","q":"다음 중 정기선 경영회사의 특징 중 맞는 것은?","o":["정기선이란 특정한 항로를 미리 정해진 운항시간표에 의해 운항한다.","정기선은 화물의 운송수요에 따라서 배선 및 운항되는 선박을 말한다.","정기선은 주로 잡화선이다.","정기선의 경우 주로 중개인을 통해 한척의 선박단위로 용선계약이 체결된다."],"a":0,"e":"정기선(liner)은 특정 항로를 미리 공표된 운항시간표(sailing schedule)에 따라 규칙적으로 반복 운항한다. 수요에 따라 배선하거나 중개인을 통해 선박 단위로 용선계약을 맺는 것은 부정기선의 특징이다."},{"id":"46a8a118c0","s":0,"n":"162","q":"부정기선의 수송대상이 되는 화물의 특성으로 맞는 것은?","o":["화물의 운임부담력이 크다.","화물의 출하시기가 규칙적이다.","화물이 대량이며 수송단위가 크다.","화물이 소량다품종이다."],"a":2,"e":"부정기선 화물은 광석·석탄·곡물처럼 대량이고 수송단위가 큰 저가 원자재로, 운임부담력이 작고 출하시기가 불규칙하다. 소량다품종은 정기선 화물의 특성이다."},{"id":"30010873d1","s":0,"n":"163","q":"다음에서 부정기선 시장 및 그 운임에 관한 특징이라고 할 수 있는 것은?","o":["부정기선 시장은 자유경쟁 시장이다.","운임은 운임표에 의해 적용된다.","부정기선 시장은 상황이 매우 안정적이다.","선복에 대한 수요와 공급이 매우 안정적인 패턴을 보인다."],"a":0,"e":"부정기선 시장은 진입장벽이 낮고 다수의 선주가 경합하는 완전경쟁(자유경쟁) 시장으로, 운임표(tariff) 없이 그때그때 수급으로 결정되어 변동성이 매우 크다."},{"id":"689173267f","s":0,"n":"164","q":"다음 중 화물의 성질상 적화와 취급에 특별한 주의를 필요로 하지 않는 화물로서 보통 잡화라 불리는 화물은?","o":["일반화물","고가화물","특별화물","벌크화물"],"a":0,"e":"적부·취급에 특별한 주의가 필요 없는 보통 잡화(general cargo)를 일반화물이라 하며, 고가화물·특별화물은 별도의 취급주의와 할증운임이 적용된다."},{"id":"bc7b662c26","s":0,"n":"165","q":"다음 중 일반 화물의 운송 중 화물 손상의 방지를 위한 조치가 아닌 것은?","o":["적절한 통풍 환기","방수처리","다른화물과 혼적","방화 관리"],"a":2,"e":"통풍환기·방수처리·방화관리는 화물 손상 방지 조치이지만, 성질이 다른 화물을 함께 싣는 혼적은 오염·발열 등 상호작용으로 손상을 유발하므로 오히려 격리(segregation) 대상이다."},{"id":"aa87c39070","s":0,"n":"166","q":"정기 용선자는 부정기선에서는 항해용선자와 같은 대상이 누구 인가?","o":["선주","화주","해상운송인","선박소유자"],"a":1,"e":"정기용선자(time charterer)는 부정기선 시장에서 선복을 빌려 자기 화물을 운송하는 항해용선자와 같은 지위, 즉 화주의 입장에 서게 된다."},{"id":"03b78161f3","s":0,"n":"167","q":"다음에서 정기선항로에서의 정기용선자는 누구인가.?","o":["선주","화주","선박운항자","선박소유자"],"a":2,"e":"정기선 항로에서 정기용선자는 남의 선박을 빌려 자기 이름으로 항로를 운영·배선하는 선박운항자(operator)로서 운송인의 지위를 갖는다."},{"id":"5244b232a5","s":0,"n":"168","q":"다음 중 부정기선 항로에서 항과 하 사이의 물건 운송에 사용하는 계약은?","o":["개품운송계약","항해용선계약","정기용선계약","물건운송계약"],"a":1,"e":"부정기선에서 특정 항 사이의 물건 운송을 위해 선복 전부 또는 일부를 빌리는 계약이 항해용선계약(voyage charter)이며, 개품운송계약은 정기선의 계약형태다."},{"id":"97590173e8","s":0,"n":"169","q":"다음에서 운송물류(transportaion logistics)에 대한 설명으로 적합한 것은?","o":["장소적 효용(space utility)을 창출하기 위해 재화를 한 장소에서 다른 장소까지 이동시키는 공간적 행위를 말한다.","물품의 제고관리를 위해 잘주량을 점검하는 광범위한 분야를 말한다.","물품의 판매분야에서 물자의 흐름만 아닌 원재료 및 부품의 조달의 목적으로 활용하는 경제적 활동이다.","물품을 효율적으로 계획, 실행 및 통제하여 고객의 요구를 만족시켜 주는 과정이다."],"a":0,"e":"운송물류는 재화를 한 장소에서 다른 장소로 이동시켜 장소적 효용(space utility)을 창출하는 공간적 행위로, 재고관리나 조달활동은 물류의 다른 기능영역이다."},{"id":"ff7c52da89","s":0,"n":"170","q":"일반적으로 운송 물류 활동을 구성하는 요소에 해당되는 것이 아닌 것은?","o":["운송 모드","운송 노드","운송 링크","운송 화물"],"a":3,"e":"운송물류 활동은 운송수단인 모드(mode), 결절점인 노드(node), 이들을 잇는 링크(link)로 구성되며, 화물은 그 대상물일 뿐 구성요소가 아니다."},{"id":"7ecb5ba2c5","s":0,"n":"171","q":"화물을 운송하고자 하는 운송수요자가 고려해야할 운송수단이 선택기준으로 타당하지 않은 것은?","o":["화물의 특성","운송 거리","화주의 큭성","운송 비용"],"a":2,"e":"운송수단 선택기준은 화물의 특성, 운송거리, 운송비용, 납기 등 화물과 운송조건 자체에 관한 것이며 화주의 특성은 판단기준이 되지 않는다."},{"id":"b597b8ffd2","s":0,"n":"172","q":"다음 중 화주는 화물의 수량이 적은 경우 선택 가능한 운송수단은?","o":["정기선 운송","부정기선 운송","철도운송","항공운송"],"a":3,"e":"수량이 적고 긴급·고가인 화물은 소량 단위 운송이 가능하고 운임부담력이 뒷받침되는 항공운송이 적합하며, 정기·부정기선은 대량 수송에 유리하다."},{"id":"8ac5375364","s":0,"n":"173","q":"다음에서 운송의 거리에 따라 화주가 합리적으로 선택하여야 하는 운송수단으로 열거된 것 중 적합한 것은?","o":["자동차 운송 - 항공 운송 - 철도 운송 - 복합 운송","자동차 운송 - 철도 운송 - 해상 운송 - 항공 운송","해상 운송 - 철도 운송 - 자동차 운송 - 항공 운송.","복합 운송 - 자동차 운송 - 해상 운송 - 철도 운송"],"a":1,"e":"거리가 짧을 때는 문전운송이 가능한 자동차, 중거리는 철도, 장거리 대량은 해상, 초장거리·긴급은 항공 순으로 선택하는 것이 합리적이다."},{"id":"98ba730127","s":0,"n":"174","q":"다음에서 거리의 장단에 따라 선택할 수 있는 운송 수단 간의 특성을 나열 한 것으로 타당한것은?","o":["컨테이너 도로 - 철도 - 해운","대량벌크화물 연안해운 - 연안해운 - 외항해운","여객 도로 - 해운 - 철도","컨테이너 도로 - 해운 - 철도"],"a":0,"e":"컨테이너 화물은 단거리 도로, 중거리 철도, 장거리 해운이 경제적이며, 여객은 장거리에서 항공·철도가 유리하므로 해운을 중거리에 두는 배열은 타당하지 않다."},{"id":"f250a7de84","s":0,"n":"175","q":"일반적으로 화물이 출고되기 전 또는 수출 신고를 전후해서 선사에 선적예약을 하는 자는 누구인가?","o":["선장","통관사","화주","대리인"],"a":2,"e":"선복예약(booking)은 운송을 의뢰하는 당사자, 즉 화주(송화인)가 출고 전 또는 수출신고 전후에 선사에 신청하는 것이 원칙이다."},{"id":"2509f7be23","s":0,"n":"176","q":"선적예약 화물이 FCL 화물이 아닌 LCL 화물인 경우에는 누가 대행할 수 있는가?","o":["선장","포워더","화주","대리인"],"a":1,"e":"컨테이너 한 개를 채우지 못하는 LCL 화물은 여러 화주의 화물을 혼재(consolidation)해야 하므로 포워더(freight forwarder)가 예약과 혼재를 대행한다."},{"id":"769127de16","s":0,"n":"177","q":"다음에서 1개의 컨테이너 내에 1개 회사의 화물이 적재되는 경우를 설명한 것은?","o":["LCL","CFS","FCL","CY Gate"],"a":2,"e":"하나의 컨테이너를 한 화주(회사)의 화물로 만재하는 경우를 FCL(Full Container Load)이라 하고, 여러 화주 화물을 혼재하면 LCL이 된다."},{"id":"8260e425a5","s":0,"n":"178","q":"다음 중 수출하는 LCL화물을 목적지별로 분류한 다음 컨테이너로 적입하는 장소를 말하는 곳은?","o":["컨테이너 야드","마샬링 야드","컨테이너 프레이트 스테이션","에이프런"],"a":2,"e":"LCL 화물을 목적지별로 분류해 컨테이너에 적입(vanning)하거나 반대로 적출하는 장소는 컨테이너 프레이트 스테이션(CFS)이며, CY는 컨테이너 단위 장치장이다."},{"id":"ec1478152d","s":0,"n":"179","q":"다음에서 해상운송이 육상운송과 다른 점으로 적합한 것은?","o":["해상운송은 연안해운을 제외하고는 국제 무역에 주로 이용된다.","해상운송은 육상운송과 같이 자국내의 물품 운송에 이용된다.","해상운송은 소량의 화물을 운송하는데 이용된다.","해상운송은 신속한 화물의 운송을 위해 이용된다."],"a":0,"e":"해상운송은 연안해운을 제외하면 대량·저가 화물의 국제무역 운송을 담당하는 것이 특징이며, 소량·신속 운송은 항공·육상운송의 영역이다."},{"id":"5650485e0e","s":0,"n":"180","q":"다음에서 컨테이너선이 소형선 보다 더 이점인 이유로 가장 적절한 것은?","o":["선박의 기계와 자동화에 더 유리하기 때문이다.","컨테이너선은 대형선이므로 대량 수송해야 운항효율이 높아져 더 큰 이익이 발생하기 때문이다.","하역관계 업무를 처리할 수 있는 숙련자가 있기 때문이다.","신조선가도 낮은 수준을 유지함으로써 대형선형이 유리하다."],"a":1,"e":"컨테이너선은 규모의 경제(economy of scale)가 크게 작용해 대형선으로 대량 수송할 때 단위당 원가가 낮아지고 운항효율이 높아져 수익성이 커진다."},{"id":"feb74b64b5","s":0,"n":"181","q":"FCL 화물의 송화인은 대여받은 빈 컨테이너에 화물을 적입하여 어디에 반입하는가?","o":["컨테이너야적장(CY)","선석(berth)","마샬링야드 (Marshalling yard)","에이프런(apron)"],"a":0,"e":"FCL 화물의 송화인은 대여받은 빈 컨테이너에 자가 적입(shipper's pack)한 뒤 선사가 지정한 컨테이너야적장(CY)에 반입하여 인도한다."},{"id":"28c848598e","s":0,"n":"182","q":"LCL 화물의 송화인은 화물을 컨테이너에 넣지 않은 채로 어느 곳에 반입하는가?","o":["컨테이너야적장(CY)","컨테이너 프레이트 스테이션(CFS)","마샬링야드 (Marshalling yard)","에이프런(apron)"],"a":1,"e":"LCL 화물의 송화인은 컨테이너에 넣지 않은 낱개 상태로 CFS에 반입하며, 거기서 목적지별 혼재 적입이 이루어진다."},{"id":"bc62593547","s":0,"n":"183","q":"본선이 입항하면 CY 운영자는 집화된 컨테이너를 무엇을 사용하여 선적하는가?","o":["갠트리 크레인(gantry crane)","데릭 포스트(derrick post)","하역용 윈치(winch)","지브 크레인 (jib crane)"],"a":0,"e":"컨테이너 전용부두에서는 안벽에 설치된 갠트리 크레인(container gantry crane)으로 컨테이너를 선적·양하하여 하역 생산성을 확보한다."},{"id":"d8b2ed5528","s":0,"n":"184","q":"FCL 화물의 경우에는 화물인도지시서를 누구에게 제시하고 화물을 인수해야 하는가?","o":["CFS 운영자","포워더","통관사","CY 운영자"],"a":3,"e":"FCL 화물은 컨테이너 단위로 인도되므로 수화인은 화물인도지시서(D/O)를 CY 운영자에게 제시하고 컨테이너째 화물을 인수한다."},{"id":"4c2440f713","s":0,"n":"185","q":"FCL 화물의 경우 빈 컨테이너는 선박회사가 정하는 CY에 반환해야 하는데 만약, 이때 지체되면 무엇을 지급해야 하는가?","o":["선하증권","선박보험","지체료","할증료"],"a":2,"e":"약정 기간을 넘겨 빈 컨테이너 반환이 늦어지면 컨테이너 사용 지연에 대한 지체료(detention charge)를 선사에 지급해야 한다."},{"id":"7cd876f27d","s":0,"n":"186","q":"부정기선 운항시 관심을 두어야 할 점은 적절한 배선인데 이때 고려해야할 점으로 적합하지 않은 것은?","o":["다음 항해가 공선항해가 되지 않도록 계획한다.","많은 수의 선박수를 가지려고 노력해야 한다.","세계 각지에 있어서의 선박의 분포등에 관한 정보를 수집하여야 한다.","물동량의 증감 변화 및 운임의 추세에 대한 정보가 있어야 한다."],"a":1,"e":"적절한 배선의 관건은 공선항해 회피, 세계 각지의 선박 분포 정보, 물동량·운임 추세 파악이며, 단순히 선박 척수를 늘리는 것은 배선 고려사항이 아니다."},{"id":"d273c52f7a","s":0,"n":"187","q":"부정기선의 선적에서 계약이 성립하면 누가 계약에 따라 선박을 적화지에 입항시켜야 하는가?","o":["선장","선주","화주","대리인"],"a":1,"e":"항해용선계약이 성립하면 선복 제공 의무를 지는 선주(shipowner)가 약정 기간 내에 선박을 적화지에 입항시켜 하역준비를 완료해야 한다."},{"id":"e4991705d6","s":0,"n":"188","q":"부정기선의 일종인 벌크선의 선내 적화는 주로 무엇으로 하는가?","o":["갠트리 크레인(Gantry crane)","테릭 포스트(Derrick post)","윈치(Winch)","벨트 컨베이어(Belt conveyor)"],"a":3,"e":"벌크선의 선내 적화는 안벽 로더에서 이어지는 벨트 컨베이어(belt conveyor)로 선창에 흘려 넣는 방식이 주로 사용된다."},{"id":"a4bd3966b4","s":0,"n":"189","q":"부정기선에서 광석이나 소금은 안벽에 설치된 무엇으로 선창에 적재되는가?","o":["벨트 컨베이어(Belt conveyor)","로더(Loader)","윈치(Winch)","프리플로우 컨베이어(Free-flow conveyor)"],"a":1,"e":"광석·소금 등 건화물은 안벽에 설치된 로더(loader)를 통해 컨베이어로 이송되어 선창에 적재된다. 언로더는 반대로 양하에 쓰인다."},{"id":"1d33454627","s":0,"n":"190","q":"부정기선의 하역에서 곡물은 철광석이나 석탄과 같이 무엇으로 퍼서 양화하는가?","o":["언로더(Unloader)","로더(Loader)","그래브(Grab)","사일로(Silo)"],"a":2,"e":"곡물도 철광석·석탄과 마찬가지로 크레인에 매단 그래브(grab, 버킷)로 퍼서 양화하며, 사일로는 육상 저장시설이다."},{"id":"b2ae658984","s":0,"n":"191","q":"부정기선이 도착하여 선장이 화주에게 무엇을 통지하면 그 즉시 적화작업을 시작해야 하는가?","o":["화물인도지시서","소요량증명서","하역준비완료의 통지","원산지 증명서"],"a":2,"e":"선박이 도착해 하역준비가 되었음을 알리는 하역준비완료통지서(N/R, Notice of Readiness)가 화주에게 통지·수리되면 정박기간이 개시되고 즉시 하역에 착수해야 한다."},{"id":"2c620fd076","s":0,"n":"192","q":"다음에서 1등 항해사가 적화계획을 세울 때에는 최대의 경제성이 발생할 수 있게 하기 위해 중점을 두어야 하는 것과 거리가 먼 것은?","o":["적화의 양을 결정한다.","중심의 위치를 적당하게 한다.","트림(배의 전후의 경사)을 최적으로 한다.","선창의 용적을 결정한다."],"a":3,"e":"적화계획(stowage plan)은 적화량 결정, 중심(重心) 위치 조정, 최적 트림 확보에 중점을 두며, 선창 용적은 선박 고유의 제원으로 계획으로 결정할 대상이 아니다."},{"id":"726f226309","s":0,"n":"193","q":"다음 중 화물의 적재, 항해 중의 품질관리 및 양화등 화물에 관한 책임을 지는 자는?","o":["도선사","통신사","1등 항해사","해기사"],"a":2,"e":"선박에서 화물의 적재·항해 중 품질관리·양화 등 화물에 관한 책임을 지는 직책은 1등 항해사(chief officer, cargo officer)이다."},{"id":"b09bde1fbd","s":0,"n":"194","q":"부정기선의 화물인 광석, 강재 등 무거운 화물은 어디까지 적재가 가능한가?","o":["만재 흘수선","흘수표","건현","갑판장 창고"],"a":0,"e":"광석·강재 같은 고비중 중량화물은 용적보다 중량이 제한요소이므로 안전 항해가 허용되는 한계인 만재흘수선(load line)까지 적재할 수 있다."},{"id":"a0464c0cd4","s":0,"n":"195","q":"만재흘수선을 세계적으로 적용하기 위해 전세계의 항로를 4가지 구역으로 구분하였는데 그 구역이 아닌 곳은?","o":["계절동기대","열대","계절열대","아열대"],"a":3,"e":"국제만재흘수선협약상 구역은 하기대·동기대(계절동기대)·열대·계절열대로 구분되며, 아열대라는 지대는 존재하지 않는다."},{"id":"56721472ba","s":0,"n":"196","q":"부정기선에서 화물을 적재 시 만재흘수선을 나타내기 위해 만재 흘수선표를 선박의 어디에 그려 넣어야 하는가?","o":["건현","선체 중앙부의 양현","늑골","용골"],"a":1,"e":"만재흘수선표(load line mark)는 검사·확인이 쉽도록 선체 중앙부(midship)의 좌우 양현 외판에 원판과 표선 형태로 영구 표시한다."},{"id":"bec56dea37","s":0,"n":"197","q":"선박에 화물을 적재할 때 중심의 높이와 관련된 설명으로 바람직하지 못한 것은?","o":["재래 정기선이나 컨테이너선은 화물을 적재할 대 중심의 높이를 조정할 수 있다.","갑판상에 많은 화물을 적재한 컨테이너선을 중심이 높아져 배의 안정성이 나빠진다.","목재 운반선의 경우 화물을 갑판에 많이 적재할 경우 중심이 높아져 배의 안정성이 나빠진다.","광석 전용선과 원유 탱커 등은 적재 방법에 의해 중심의 높이를 조정할 수 있다."],"a":3,"e":"광석전용선과 원유탱커는 화물창·탱크가 고정되어 적재방법으로 중심 높이를 조절할 여지가 거의 없다. 중심 조정이 가능한 것은 재래정기선·컨테이너선이다."},{"id":"44edda4b96","s":0,"n":"198","q":"수심이 앝은 곳에 입출항 시 가능한 한 선수미의 흘
