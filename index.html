수가 똑같게 되도록 무엇을 조절해야 하는가?","o":["트림","적화량","중심","선원 수"],"a":1,"e":"'수심이 얕은 곳 + 선수미 흘수를 똑같게' → 회사 정답은 적화량 조절이다. 선수·선미 화물 배분을 바꿔 등흘수(even keel)를 만든다는 취지로 암기한다. ⚠[정답 논란] 등흘수로 맞추는 대상 자체는 트림(trim)이고 적화량은 그 조절 수단이므로, 일반 이론서는 ①을 정답으로 본다. 다만 채점은 회사 제공 정답 ② 기준이므로 시험에서는 ②로 답할 것.","c":{"t":0,"n":"등흘수로 맞추는 대상 자체는 트림(trim)이고 적화량은 그 조절 수단이므로, 일반 이론서는 ①을 정답으로 본다."}},{"id":"025c9cd64d","s":0,"n":"199","q":"종래의 정기 화물선의 가장 큰 문제점으로 지적되었던 것으로 해당되는 것은?","o":["하역시간이 단축할 수 있다.","하역비용이 절감될 수 있다.","각종화물을 규격용기에 적재할 수 있다.","잡다한 화물을 개별적으로 운송한다."],"a":3,"e":"재래 정기화물선은 잡다한 개별 화물을 낱개로 취급·운송해 하역시간과 하역비가 과다한 것이 최대 문제점이었고, 이를 해결한 것이 컨테이너화(containerization)다."},{"id":"a0ca465643","s":0,"n":"200","q":"다음 중 유조선에 대한 설명으로 적절하지 않은 것은?","o":["중동 등의 원유 생산지로 부터 정유 시설 항구까지 원유를 수송한다.","정유공장에서 소비지로 정재유를 수송하기도 한다.","화물유의 요동을 방지하기 위해 종횡의 유밀 격벽으로 구획되어 있다.","양화지에서 선적지로 되돌아 갈때는 만재상태로 수송한다."],"a":3,"e":"유조선은 액체 단일화물만 실을 수 있어 양화지에서 선적지로 돌아갈 때는 밸러스트를 실은 공선(ballast) 항해를 하며, 만재 왕복은 불가능하다."},{"id":"7933b20b8a","s":0,"n":"201","q":"다음은 탱커를 크기로 분류한 것 중 20만 톤 이상 30만 톤 미만의 탱커는 어는 것인가?","o":["VLCC","ULCC","AFRAMAX","SUEZMAX"],"a":0,"e":"탱커 규모 구분에서 VLCC(Very Large Crude Carrier)가 20만~30만 DWT급이다. ULCC는 30만 톤 초과 초대형선, SUEZMAX는 수에즈운하 통과 한계인 15만 톤 전후, AFRAMAX는 8만~12만 톤급이다."},{"id":"c8b5aa9669","s":0,"n":"202","q":"다음 중 해상운송에 있어서 기술 혁신 사례 중 대형화에 관한 설명 중 적합한 것은?","o":["컨테이너선은 운항 효율면에서 대형선보다는 소형선이 더 효율적이다.","대형화하면 신조선가도 똑같이 올라가기 때문에, 대형화의 수익이 낮아 진다.","제4세대 컨테이너선은 4~5000 TEU, 길이 262~290m로 이른바 포스트 파나막스선이다.","양화지에서 선적지로 되돌아 갈때는 만재상태로 수송한다."],"a":2,"e":"제4세대 컨테이너선은 4,000~5,000TEU급, 길이 262~290m로 파나마운하 폭 제약을 벗어난 포스트 파나막스(Post-Panamax)선이다. 대형화는 규모의 경제로 단위당 원가를 낮추고, 신조선가는 선형 확대에 비례해 오르지 않는다."},{"id":"3fdc2e9c47","s":0,"n":"203","q":"다음 중 카페리에 관한 설명으로 적합한 것은?","o":["자동차만 싣고 운항하는 배이다.","단거리 카페리는 주로 트럭 수송에 이용된다.","수송되는 화물은 컨테이너 수송화물보다 그 가격이 저가이다.","차량 갑판에 자동차를 싣고 가서 램프를 통해 배를 육지로 내린다."],"a":3,"e":"카페리는 차량 갑판(car deck)에 자동차를 적재하고 선수·선미 램프(ramp)를 이용해 자력으로 오르내리는 RORO 방식 선박이다. 여객도 함께 운송하며, 화물 가치는 대체로 컨테이너 화물보다 높고 장거리 노선이 트럭 수송 중심이다."},{"id":"e3502f3b9d","s":0,"n":"204","q":"다음 중 정기선이 컨테이너화 되면서 생기는 단점으로 적합한 것은?","o":["화물운송에 있어서 경제성을 충족시킨다.","화물을 출발하여 수화인에게 전달하는 신속성을 유지시킨다.","화물운송시 화물을 필폐된 용기에 의해 운반되므로 안전성을 확보한다.","운송체제를 구축하는데 막대한 자금이 소요된다."],"a":3,"e":"컨테이너화는 컨테이너·전용선·전용터미널·갠트리크레인 등 일관수송 체제 전체를 갖춰야 하므로 막대한 초기 자본이 소요되는 것이 단점이다. 경제성·신속성·안전성은 모두 컨테이너화의 대표적 장점에 해당한다."},{"id":"46ba7c7a60","s":0,"n":"205","q":"다음에서 컨테이너선을 운영하면 절감되는 항목으로 해당되지 않는 것은?","o":["인건비","창고료","보험료","할증료"],"a":3,"e":"컨테이너 운송은 하역 인건비, 창고료, 포장비, 보험료를 절감시키지만 할증료(surcharge)는 유가·통화·체선 등 외부 요인에 따라 부과되는 운임 부가항목이므로 컨테이너화로 절감되는 비용이 아니다."},{"id":"08215ad359","s":0,"n":"206","q":"다음 재래 정기선이 컨테이너선으로 변화됨으로써 발생되는 이점을 설명한 것으로 해당되지 않는 것은?","o":["컨테이너라는 밀폐된 용기에 넣어 운송하므로 화물을 저렴하게 운송할 수 있다.","별개의 독립된 창고의 역할을 하는 컨테이너이므로, 포장비, 창고료 및 보험료를 절감할 수 있다.","부두에서 화물을 적하 및 양하하는데 많은 인부를 동원해야 하므로 더 많은 일자리를 창출할 수 있다.","규격화된 컨테이너의 사용으로 하역 시간과 선박의 정박기간이 단축된다."],"a":2,"e":"컨테이너화는 기계화 하역으로 항만 인부 수요를 크게 줄이므로 일자리 창출은 오히려 감소한다. 밀폐 용기 효과에 따른 포장비·창고료·보험료 절감과 하역시간·정박기간 단축이 실제 이점이다."},{"id":"f47ba03973","s":0,"n":"207","q":"다음 중 컨테이너 적재를 목적으로 하고 있지만 벌크도 실을 수 있는 겸용 선박은?","o":["풀 컨테이너선(Full container ship)","컨버터블 컨테이너선(Convertible container ship)","세미 컨테이너선(Semi-container ship)","기어레스 컨테이너선(Gearless container ship)"],"a":1,"e":"컨버터블 컨테이너선(convertible container ship)은 화물창의 셀 가이드를 착탈·전환할 수 있어 컨테이너 적재를 주목적으로 하면서 필요 시 벌크화물도 실을 수 있는 겸용선이다."},{"id":"a49df36063","s":0,"n":"208","q":"다음에서 컨테이너와 컨테이너를 넣지 않은 화물(break bulk) 두 가지를 적재하는 장비를 설치한 선박은?","o":["풀 컨테이너선(Full container ship)","컨버터블 컨테이너선(Convertible container ship)","세미 컨테이너선(Semi-container ship)","기어레스 컨테이너선(Gearless container ship)"],"a":2,"e":"세미 컨테이너선(semi-container ship)은 재래 화물선을 개조해 일부 선창에만 컨테이너를 적재하고 나머지에는 브레이크 벌크(break bulk) 화물을 싣도록 양쪽 하역장비를 갖춘 과도기적 선형이다."},{"id":"20ab55207f","s":0,"n":"209","q":"다음에서 LOLO(Lift On Lift On)선의 특성을 설명한 것으로 적합하지 않은 것은?","o":["컨테이너를 육상의 갠트리 크레인으로 싣고 내리는 선박이다.","화물창 내에서는 상하 방향으로 설치된 셀 가이드에 따라서 컨테이너를 중복되게 격납한다.","컨테이너를 트레일러에 의하여 적재하는 방식으로 프크리프트를 사용하여 쌓는다.","갑판 상에 컨테이너를 과적하면 항해 중 복원력에 나쁜 영향을 미칠 수 있다."],"a":2,"e":"트레일러로 끌어 넣고 포크리프트로 쌓는 방식은 RORO(Roll on Roll off)의 특징이다. LOLO선은 육상 갠트리크레인으로 수직 하역하고 셀 가이드(cell guide)에 따라 컨테이너를 다단 격납한다."},{"id":"4bde64231b","s":0,"n":"210","q":"다음은 재래 정기선과 컨테이너선을 비교 설명한 것으로 적절한 것은?","o":["컨테이너선은 재래 정기선과 비교하여 항구에 오래 정박해 있어도 경제성을 절감할 수 있다.","재래 정기선은 선박이 컨테이너선에 비해 소형이므로 하역을 하는 시간을 단축할 수 있다.","재래 정기선은 1등 항해사가 하역계획을 입안하였지만, 컨테이너선은 육상에서 작성되고 하역과 지휘도 육상에서 주도한다.","잡화는 종류가 많으므로 이를 하역하는 데 시간과 비용이 많이 소요되기 때문에 좀 더 소형인 재래 정기선이 능률적이다."],"a":2,"e":"컨테이너선은 적부계획(stowage plan)을 육상의 본선적화감독·터미널 계획부서가 작성하고 하역 지휘도 육상이 주도하는 반면, 재래 정기선은 1등항해사가 하역계획을 입안했다. 컨테이너선은 대형화와 정박기간 단축으로 경제성을 확보한다."},{"id":"7e90d705f9","s":0,"n":"211","q":"다음 중 벌크 캐리어로 운송되는 메이저 벌크(major bulk)품목에서 다소 거리가 먼 것은?","o":["철광석","곡물","석탄","설탕"],"a":3,"e":"메이저 벌크(major bulk)는 철광석·석탄·곡물에 보크사이트/알루미나, 인광석을 더한 대량 산적화물이며, 설탕은 물량이 적은 마이너 벌크(minor bulk)에 속한다."},{"id":"5df1e99ecc","s":0,"n":"212","q":"벌크선이 하역하는 장소는 무엇에 의해 달라지는 가?","o":["운임","화물","부두","용량"],"a":1,"e":"벌크선은 화물별 전용 하역설비와 야드가 필요하므로 적재 화물의 종류에 따라 하역 부두(철광석·석탄·곡물 전용부두 등)가 달라진다."},{"id":"263cd6fc6b","s":0,"n":"213","q":"다음 중 파나막스(Panamax)선의 사이즈와 무게는 어느 정도인가?","o":["선폭 32.2m 이하 2만 중량톤 전후","선폭 32.5m 이상 8만 중량톤 전후","선폭 32.2m 이하 6만 중량톤 전후","선폭 35.0m 이상 2만 중량톤 전후"],"a":2,"e":"파나막스(Panamax)는 파나마운하 통항 한계인 선폭 32.2m(106ft) 이하로 제한되며 재화중량은 6만 중량톤 전후다. 8만 톤급 이상은 포스트 파나막스 또는 케이프사이즈 영역이다."},{"id":"e8b8257497","s":0,"n":"214","q":"벌크선 중 핸디사이즈(Handy size)의 선박은 무게는 어느 정도인가?","o":["1만 5,000 ~ 3만 중량톤","1만 5,000 ~ 4만 5,000중량톤","2만 ~ 4만 중량톤","2만 5,000 ~ 4만 5,000중량톤"],"a":1,"e":"벌크선 선형 구분에서 핸디사이즈(Handy size)는 약 1만 5,000~4만 5,000 중량톤급으로, 자체 하역장비(gear)를 갖춰 소규모 항만에도 입항 가능한 범용선이다."},{"id":"da67b52ec8","s":0,"n":"215","q":"다음에서 RORO(Roll On Roll off)선의 특징을 서술한 것으로 해당되지 않는 것은?","o":["선미 또는 현측에 설치한 램프웨이를 통해 컨테이너를 트레일러에 의해 적재하는 방식이다.","화물창 내에서는 포크리프트를 사용하여 중복으로 쌓아 격납한다.","적재 가능한 컨테이너가 적어 육상의 크레인 설비가 필요하지 않다.","갑판 상에 컨테이너를 과적하면 항해 중 복원력에 나쁜 영향을 미칠 수 있다."],"a":3,"e":"램프웨이 하역, 화물창 내 포크리프트 적재, 육상 크레인 불필요는 모두 RORO선의 특징이다. 갑판상 컨테이너 과적으로 무게중심이 상승해 복원력(GM)이 악화되는 문제는 컨테이너를 다단 적재하는 LOLO형 컨테이너선의 특성이다."},{"id":"35d05e78b5","s":0,"n":"216","q":"다음의 부정기선 영업에 관한 내용을 서술한 것으로 적합하지 않은 것은?","o":["여러 척의 선박을 필요로 하지 않는다.","육상설비에 많은 투자를 할 필요가 없다.","자본 집약적 산업이고 공증운송인으로서의 역할을 한다.","비교적 간단하게 사업을 개시 또는 중지 할 수 있다."],"a":2,"e":"부정기선은 특정 화주와 개별 계약을 맺는 사적계약운송인(private/contract carrier)으로, 불특정 다수를 상대하는 공중운송인(common carrier)은 정기선사다. 소수 선박과 최소 육상설비로 진출입이 쉬운 것은 맞다."},{"id":"062310d468","s":0,"n":"217","q":"다음에서 FOFO(flot on flot off)에 대한 설명으로 올바르지 않는 것은?","o":["다수의 부선에 컨테이너를 비롯 팰릿화된 화물을 수납가능한 방식이다.","선수나 선미에 달린 램프를 통해 트레일러나 지게차 등의 하역기계를 활용한 방식이다.","라쉬선(LASH), 시비선(Sea Bee Carrier) 등이 이 방식을 채용하고 있다.","선상에 장비된 크레인으로 부선채 선적하여 그대로 목적지까지 운반하는 하역방식이다."],"a":1,"e":"선수·선미 램프를 통해 트레일러·지게차로 하역하는 것은 RORO 방식이다. FOFO(Float on Float off)는 부선(barge)에 화물을 담아 본선 크레인으로 부선째 적재해 운송하는 방식으로 LASH선, Sea Bee선이 대표적이다."},{"id":"17877c7ce1","s":0,"n":"218","q":"다음의 장기운송계약의 장점으로 적합하지 않은 것은?","o":["안정된 경영으로 해운 산업의 발전에 기여한다.","장기계약을 담보로 자금 조달이 쉬워진다.","선주와 화주 모두에게 시황변동에 따른 위험을 감소시킬 수 있다.","시황변동이나 물가 수준을 적절하게 반영할 수 있다."],"a":3,"e":"장기운송계약(COA·장기수송계약)은 계약 운임이 고정되어 시황 변동이나 물가 수준을 즉시 반영하기 어려운 것이 오히려 단점이다. 안정적 경영, 자금조달 용이, 쌍방의 시황 위험 감소가 장점이다."},{"id":"a97d6b3929","s":0,"n":"219","q":"다음에서 전용선에 대한 설명으로 올바르지 않은 것은?","o":["장기운송계약에 투입되는 선박으로 주로 이용된다.","운항 원가를 최소화 하는 이상적인 선종이다.","장기운송계약을 통해 운송이 실시 되므로 정기선 영업에 준거한다.","특정화물의 수요가 없을 경우에도 상관없이 최대의 경제성을 발휘한다."],"a":3,"e":"전용선은 특정 화물 전용 구조여서 해당 화물 수요가 없으면 타 화물 전환이 불가능해 경제성이 급격히 떨어진다. 장기운송계약과 결합해 운항원가를 최소화할 때 이상적인 선종이 된다."},{"id":"d902a1cc6d","s":0,"n":"220","q":"장기운송계약의 단점을 보완하기 위해 고려해야 하는 사항으로 해당되지 않는 것은?","o":["환율","연료비","계약년도","물가 상승률"],"a":2,"e":"장기운송계약의 경직성을 보완하려면 환율, 연료비(bunker), 물가상승률 등 원가 변동요인을 에스컬레이션 조항으로 반영해야 한다. 계약년도 자체는 조정 대상 원가요소가 아니다."},{"id":"26fb92e5ab","s":0,"n":"221","q":"다음의 부정기선의 용선방법의 종류에 해당되지 않는 것은?","o":["정기용선","항해용선","나용선","개품운송"],"a":3,"e":"용선계약(charter)의 종류는 정기(기간)용선, 항해용선, 나용선(선체용선)이다. 개품운송(個品運送)은 다수 화주의 화물을 선하증권으로 운송하는 정기선 운송계약으로 용선방법이 아니다."},{"id":"1f1303f661","s":0,"n":"222","q":"다음에서 정기또는 기간용선계약에 대한 개념으로 적당한 것은?","o":["선주와 용선자가 단일항해 운송을 약정하는 것을 말한다.","일정기간 동안 선복의 전부 또는 일부를 용선하는 계약을 말한다.","송하인이 선박회사에 화물의 운송을 신천하면 운송인은 이것을 승낙함으로써 계약이 성립하는 것을 말한다.","선박자체만을 임차하고 인적 및 물적요소를 용선자가 부담하는 선박의 임대차 계약을 말한다."],"a":1,"e":"정기(기간)용선은 선박에 선원과 운항능력을 갖춘 상태로 일정기간 선복의 전부 또는 일부를 빌리는 계약이다. ①은 항해용선, ③은 개품운송계약, ④는 나용선의 개념이다."},{"id":"a41af932e2","s":0,"n":"223","q":"다음에서 정기운송계약 이용의 예에 대한 설명으로 부적절한 것은?","o":["정기선사: 급격하게 증가한 수요를 충족시키고자 할 때","용선자: 다시 제 3자에게 정기용선 또는 항해 용선을 주어 운임의 차액을 얻으려는 상업목적","화주: 일정기간 연속해서 대량의 화물운송이 필요할 때","선주: 선박자체만을 임차하고 용선자가 인적 및 물적요소를 부담할 때"],"a":3,"e":"선박 자체만 임차하고 용선자가 인적·물적 요소를 부담하는 것은 나용선(bareboat charter)이며 정기용선의 이용 예가 아니다. 정기선사의 선복 보충, 재용선 차익 취득, 화주의 계속 대량수송이 전형적 활용 예다."},{"id":"370898303f","s":0,"n":"224","q":"다음 중 정기운송계약의 주요내용과 관계가 먼 것은?","o":["선박명세","용선료 지급","부적운임유치권","감항능력담보"],"a":2,"e":"부적운임(dead freight)에 대한 유치권은 약정 선적량 미달을 다루는 항해용선계약의 사항이다. 정기용선계약에서는 선박명세, 용선료(hire) 지급, 감항능력(seaworthiness) 담보 등이 주요 내용이다."},{"id":"7c73dc60c4","s":0,"n":"225","q":"다음 중 화주가 선적, 양하비용을 전적으로 부담하는 것은?","o":["F.I.O","F.O","F.I","CP"],"a":0,"e":"F.I.O(Free In and Out)는 선주가 선적·양하비 모두에서 자유롭다는 뜻으로 하역비 전액을 화주(용선자)가 부담한다. F.I는 선적비만, F.O는 양하비만 화주 부담이다."},{"id":"c15f4f32aa","s":0,"n":"226","q":"다음중 부정기선 운임의 특징에 대한 설명으로 부적당한 것은?","o":["운임의 결정요인은 장기적으로 경제성장과 교역량을 고려해야 한다.","해운시황에 따라 변동폭이 안정되어 운임의 등락 폭이 적다.","경제적, 정치적인 변수를 중기적인 차원에서 고려해야 한다.","일시적인 수요증감에 따른 선복 과부족역시 운임의 결정요인이 된다."],"a":1,"e":"부정기선 운임은 선복 수급과 시황에 따라 개별 계약으로 결정되므로 등락 폭이 매우 크고 불안정하다. 장기적 경제성장·교역량, 중기적 경제·정치 변수, 일시적 선복 과부족이 모두 운임 결정요인이다."},{"id":"81cce0fdcf","s":0,"n":"227","q":"최근 해상운송이 컨테이너화 되어 가고 있다. 그 이유로 옳은 것은?","o":["자본이 적게 소요된다.","선박의 정박기간이 늘어난다.","하역인부를 많이 고용할 수 있다.","화물을 안전하게 운송할 수 있다."],"a":3,"e":"컨테이너라는 규격화된 밀폐 용기를 사용해 화물의 손상·도난을 막고 안전하게 일관수송할 수 있는 것이 컨테이너화의 근본 이유다. 초기 자본은 오히려 많이 들고 정박기간과 하역인부는 줄어든다."},{"id":"00e0ab3c73","s":0,"n":"228","q":"다음에서 주로 재래의 일반 화물선을 개조하였고 일반화물과 컨테이너 화물을 함께 실을 수 있는 구조의 선박은?","o":["LOLO선","RORO선","LASH선","Semi-container선"],"a":3,"e":"세미 컨테이너선(semi-container ship)은 재래 일반화물선을 개조해 일부 선창을 컨테이너용으로 전용, 일반화물과 컨테이너를 함께 실을 수 있는 구조의 선박이다."},{"id":"875b03d89b","s":0,"n":"229","q":"다음에서 광석 운송선에 대한 설명으로 바람직하지 않은 것은?","o":["광산물을 산적 상태로 선창에 적재하여 운송하는 선박을 말한다.","광석운송선으로 가장 많이 운송되는 화물은 제철 원료인 철광석이다.","선체는 수밀구조를 비롯아여 이중저 및 이중선각등의 특수한 구조를 구비해야 한다.","선창은 배의 중심선을 따라서 구획 설치 되어 있다."],"a":2,"e":"이중선각(double hull)은 기름 유출 방지를 위한 유조선의 요건이며 광석운반선의 필수 구조가 아니다. 광석선은 수밀구조와 높은 이중저(double bottom), 윙탱크, 중심선 방향의 좁은 선창 구획을 특징으로 한다."},{"id":"70a5d2c7d8","s":0,"n":"230","q":"다음 중 광석 운송선의 구조에 관한 설명으로 바람직하지 못한 것은?","o":["선창 내에 임시로 시프팅 보드를 설치하여야 한다.","단면 형상과 강도 면에서도 특수한 구조로 되어 있다.","화물의 무게를 고려 이중저를 보통의 선박보다 높게 배치하여야 한다.","선형은 탱커와 비슷한 선미 기관실형으로 한다."],"a":0,"e":"시프팅 보드(shifting board)는 이동하기 쉬운 곡물 산적화물의 횡이동을 막는 곡물선 장치로 광석선에는 설치하지 않는다. 광석선은 비중이 큰 화물 특성상 이중저를 높이고 특수 단면·강도 구조와 선미기관실형을 채택한다."},{"id":"c9e3ec363d","s":0,"n":"231","q":"다음에서 새깅(Sagging) 현상을 설명한 것으로 적절한 것은?","o":["정지각이 비교적 작은 화물의 적재 시에 양쪽 선측으로 삼각형 형태의 공간이 생긴 현상","선적된 화물이 선박의 동요에 의해 침하와 이동이 일어나는 현상","광석 운송선에서 철광석을 만재 하였을 시 중안 선창의 무게 집중으로 인해 생긴 현상","화물이 온도의 변화에 따라 부피가 변화한 현상"],"a":2,"e":"새깅(sagging)은 광석선처럼 비중 큰 화물을 중앙 선창에 집중 적재해 부력보다 하중이 커져 선체 중앙부가 아래로 처지는 종강도 현상이다. 반대로 중앙이 솟는 것은 호깅(hogging)이다."},{"id":"206ddaa71d","s":0,"n":"232","q":"정지각이 비교적 작은 곡물의 적재 하는 경우 양쪽 선측으로 삼각형 형태의 빈공간이 생겨서 위험할 수 있는데 이를 방지하기 위한 장치는?","o":["이중선각(Double Hull)","셀프 트리밍(Self Trimming)","포크리프트(Forklift)","밸러스트(Ballast)"],"a":1,"e":"셀프 트리밍(self trimming) 선창은 상부 홉퍼형 경사 구조로 화물이 자연히 흘러내려 양측 삼각 공간을 없애 화물 이동(shifting)과 횡경사를 방지한다."},{"id":"0b7dabdf04","s":0,"n":"233","q":"자동차 전용 운송선은 RORO선으로 분류되기도 하는 이유로 타당한 것은?","o":["보통 편도 화물을 운송하고 탱커를 겸하고 있기 때문에","선창내에 시프팅 보드(shifting board)를 설치하였기 때문에","일반적을 본선에는 하역장비가 설치되어 있지 않기 때문에","선수나 선미에 설치된 램프(Ramp)를 이용하거나 선측의 개구부(side port)를 이용하기 때문에"],"a":3,"e":"자동차 전용선(PCC/PCTC)은 선수·선미 램프(ramp)나 선측 개구부(side port)를 통해 차량이 자력 주행으로 승·하선하므로 수직 하역이 아닌 RORO(Roll on Roll off)선으로 분류된다."},{"id":"ecd6d66e62","s":0,"n":"234","q":"다음에서 자동차 전용 운송선의 특징을 설명한 것으로 적합하지 않은 것은?","o":["선창 내에 갑판 (Deck)의 수가 많다.","선창 및 갑판 사이에는 승강 장치와 램프로 연결되어 있다.","선수부에서 선미부에 이르는 좌, 우, 중앙의 3개 종격벽과 많은 횡격벽이 있다.","수선 하부의 면적이 넓어서 풍압력의 영향을 많이 받는다."],"a":2,"e":"선수미를 관통하는 3개 종격벽과 다수 횡격벽은 광석전용선의 구조적 특징이며, 자동차전용선은 차량 이동을 위해 격벽을 최소화한 다층 개방 갑판 구조다. 참고로 풍압은 수선 '상부' 면적이 넓어 크게 받는다."},{"id":"7f19b36a55","s":0,"n":"235","q":"흔히, 천연가스를 훨씬 낮은 극저온의 상태에서 액화시켜 수송하고 있는 운송선은?","o":["LPG선","PCTC선","OAO선","LNG선"],"a":3,"e":"LNG선은 천연가스를 －163℃ 극저온으로 액화해 부피를 약 600분의 1로 줄여 특수 방열 탱크(모스형·멤브레인형)에 담아 수송한다. LPG선은 가압 또는 －42℃ 정도의 저온 액화 방식이다."},{"id":"d87c6e5d00","s":0,"n":"236","q":"선박에서 인간의 몸을 포함한 모든 동물들의 척추와 같은 역할을 하는 구조부재는?","o":["선저 만곡부","용골","늑골","플레어"],"a":1,"e":"용골(keel)은 선저 중심선을 따라 선수에서 선미까지 이어지는 주요 종강력재로, 선체의 척추 역할을 하며 종강도의 기준이 된다."},{"id":"4fa30d34e0","s":0,"n":"237","q":"선박의 선저와 선측을 연결하는 곡선 부분으로 대개의 경우에 원형으로 구성되어 있는 것을 말하는 것은?","o":["선저 만곡부(Bilge)","용골(Keel)","늑판(Floor)","외판 (Shell plating)"],"a":0,"e":"선저 만곡부(bilge)는 선저와 선측을 잇는 원호형 곡선부로, 빌지 킬(bilge keel)을 붙여 횡동요를 줄이기도 한다. 용골은 중심선 종강력재, 늑판은 이중저 횡부재다."},{"id":"a1f4024ac6","s":0,"n":"238","q":"다음 중 외판 철판의 투께를 포함한 선폭으로 주로 입거 시나 운하 통과 시에 이용되는 선폭은?","o":["형폭(Moulded breadth)","전폭(Extreme breadth)","형깊이((Moulded depth)","용골 깊이(Keel depth)"],"a":1,"e":"전폭(extreme breadth)은 외판 강판 두께를 포함한 선체 최대 폭으로, 입거(docking)나 운하·안벽 통과 등 선박 조정에 사용된다. 형폭은 외판 내면 기준 폭이다."},{"id":"f984685543","s":0,"n":"239","q":"우리나라의 선급에서는 배의 깊이를 용골의 상면에서 측정하는데 선박에서 가장 내측의 선을 무엇이라고 하는가?","o":["형깊이((Moulded depth)","용골 깊이(Keel depth)","형선 (Molding line)","흘수(Draft)"],"a":2,"e":"형선(molding line)은 외판 내면, 즉 선체 골재의 가장 내측을 연결한 기준선으로, 우리나라 선급은 용골 상면에서 이 형선을 기준으로 형깊이를 측정한다."},{"id":"6909094028","s":0,"n":"240","q":"선박의 티핑센터가 배 길이의 중앙에 있는데 이는 평균흘수와 중앙 부흘수는 일치하나 약간의 차이를 보이고 있는데 그 이유로 적당하지 않은 것은?","o":["선적화물 과 중령물 선적의 불균형의 요인","밸러스트의 불균형 요인","선제 철판의 휨 현상의 요인","사용되는 미터식 표시법과 피트식 표시법의 차이현상"],"a":3,"e":"미터법과 피트법이라는 단위 표시법의 차이는 환산 문제일 뿐 흘수 자체의 오차 원인이 아니다. 실제 차이는 화물·중량물 적재 불균형, 밸러스트 불균형, 선체 철판의 휨(호깅·새깅)에서 비롯된다."},{"id":"a921ddd274","s":0,"n":"241","q":"선박의 조정이나 선적량의 산출에서 사용하는 거리로 선박법상 그 표시를 규정하고 있는 것은?","o":["형흘수 ((Moulded draft)","용골 흘수 (Keel draft)","전부흘수(Fore draft)","중앙부 흘수(Midship draft)"],"a":1,"e":"용골 흘수(keel draft)는 용골 하면에서 수면까지의 깊이로 실제 선박 조종과 적재량(재화중량) 산출에 쓰이며 선박법상 흘수 표시 규정의 기준이 된다. 형흘수는 형선(외판 내면) 기준 값이다."},{"id":"444b77213a","s":0,"n":"242","q":"선박의 안전을 확보하기 위해 선체 높이의 일정 부분이 물에 잠기지 않도록 하여 예비부력을 확보해야 하는 데 이를 무엇이라 하는가?","o":["건현(Freeboard)","만재 흘수선(Full load line)","횡경사(Heel)","전장(Length over al)"],"a":0,"e":"건현(freeboard)은 만재흘수선상 갑판선 상단까지의 수직거리로, 선체 일정 부분을 물에 잠기지 않게 남겨 예비부력(reserve buoyancy)을 확보해 안전을 지키는 개념이다."},{"id":"10908b1635","s":0,"n":"243","q":"다음은 만재 흘수선에 대한 설명으로 적절한 것은?","o":["선박항해의 안전을 확보할 수 있는 상태에서 허락된 최대의 흘수를 말한다.","선체 높이의 일정 부분이 물에 잠기지 않도록 하여 예비 부력을 확보하는 것을 말한다.","선체의 수면에 잠겨 있는 깊이를 용골에서 수면까지의 높이를 말한다.","안벽계류, 운하통과 및 입거 등 선박 조정에 필요한 선체의 최대 높이를 말한다."],"a":0,"e":"만재흘수선(load line)은 항해 안전을 확보할 수 있는 범위에서 허용되는 최대 흘수, 즉 최소 건현에 대응하는 한계선이다. ②는 건현, ③은 흘수의 정의다."},{"id":"727a66fa7c","s":0,"n":"244","q":"다음에서 원양 및 근해 구역의 산박의 만재 흘수선에 대한 설명으로 옳지 않은 것은?","o":["만재 흘수선 규정에 의해 원양 및 근해 구역을 항행 구역으로 하는 선막은 갑판선이다.","길이 100m를 넘는 선박은 동기북대서양 만재 흘수선을 표시하지 아니한다.","갑판상에 목재를 운송하는 선박은 목재 만재 흘수선의 규정을 따로 받는다.","목재 만제 흘수선은 화물 자체가 부력을 갖기 때문에 일반 만재 흘수선보다 더 얕은 흘수를 허용하고 있다."],"a":3,"e":"목재 만재흘수선은 갑판적 목재 자체가 부력을 갖고 갑판 강도가 보강되므로 일반 만재흘수선보다 건현을 줄여 더 깊은 흘수를 허용한다. 동기북대서양(WNA) 흘수선은 길이 100m 이하 선박에만 표시한다."},{"id":"d013a5272f","s":0,"n":"245","q":"다음에서 만재 흘수선의 표시에 대한 설명으로 타당하지 않은 것은?","o":["어두운 색의 선측에는 백색 또는 황색으로 선명하게 표시한다.","폭 35mm의 선으로 영 현측에 표시한다.","갑판선, 원표 및 각 대역별 만재 흘수선을 표시하는 열쇠 모양의 표시 등의 세부분으로 구성되어 있다.","백색의 선측에는 흑색으로 선명하게 표시한다."],"a":1,"e":"만재흘수선 표시는 폭 25mm의 선으로 양 현측에 표시한다(갑판선도 폭 25mm·길이 300mm). 어두운 선측에는 백색·황색, 백색 선측에는 흑색으로 표시하며 갑판선·원판(디스크)·대역별 흘수선 표시로 구성된다."},{"id":"ceb6db5a09","s":0,"n":"246","q":"다음 중 일반 화물선에서의 횡경사는 무엇을 조정하므로써 바로 잡을 수 있는가?","o":["중앙 흘수","화물의 트리밍","윙 탱크의 밸러스트","플레어"],"a":2,"e":"횡경사(heel)는 좌우 중량 배분의 불균형이므로 좌·우 윙 탱크(wing tank)의 밸러스트를 이송·조절해 바로잡는다. 중앙 흘수나 플레어는 경사 조정과 무관하다."},{"id":"778a6a3433","s":0,"n":"247","q":"벌크화물의 만선 선적 시에 만재 흘수의 제한을 받으므로 횡경사가 잃어나지 않기 위해선 무엇을 해야하나?","o":["횡경사는 윙 탱크의 밸러스트 조정하면 된다.","횡경사의 각도를 높게 유지한다.","예비 부력을 확보하도록 한다.","선창 적재 화물의 트리밍을 잘한다."],"a":3,"e":"벌크화물을 만선 적재하면 만재흘수 제한으로 밸러스트를 추가할 여유가 없으므로, 선창 내 화물을 좌우 균등하게 트리밍(trimming)해 무게 배분으로 횡경사를 막아야 한다."},{"id":"a1a928454b","s":0,"n":"248","q":"대형 화물선이나 유조선 같이 액체화물을 적재하는 선박에 적합한 선박 구조 양식은?","o":["종식 구조","횡식 구조","혼합식 구조","늑골식 구조"],"a":0,"e":"종식 구조(longitudinal system)는 종통재를 촘촘히 배치해 종강도를 크게 확보하므로 선체가 길고 종굽힘 모멘트가 큰 대형 화물선·유조선에 적합하다. 중소형선은 횡식 구조가 일반적이다."},{"id":"10f77f045f","s":0,"n":"249","q":"선박의 구조의 종식구조(Longitudinal system)의 장점으로 관계가 먼 것은?","o":["종강도가 크다.","구겅부제의 무게가 가벼워 선체의 중얄이 감소한다.","선창 내 구조가 복잡하여 건조작업이 쉽다.","선체의 중량이 감소하여 재화적재 중량이 늘어날 수 있다."],"a":2,"e":"종식 구조는 종통 부재가 많아 선창 내부 구조가 복잡해 건조작업이 오히려 어렵고 공사비가 늘어나는 단점이 있다. 큰 종강도, 구조부재 경량화와 그에 따른 재화중량 증가가 장점이다."},{"id":"d1a3c44a27","s":0,"n":"250","q":"대부분의 중소형 화물선의 구조양식으로 채택하고 있는 것은?","o":["종식 구조","횡식 구조","혼합식 구조","늑골식 구조"],"a":1,"e":"횡식 구조(transverse system)는 늑골·늑판 등 횡부재를 주강력재로 삼아 건조가 쉽고 선창 내부가 단순해 종강도 부담이 작은 대부분의 중소형 화물선에 채택된다."},{"id":"a19743cf56","s":0,"n":"251","q":"다음 중 산적 화물선의 선체 구조를 설명한 것으로 올바르지 않은 것은?","o":["화물을 포장하지 않은 상태에서 적재하기 때문에 다른 선종에 비해 특별한 화물창 구조를 가지게 된다.","화물의 선체 동요에 따라 이동하거나 무너지는 것을 방지하기 위해 밸러스트 탱크로 이용하고 있다.","화물을 양하 할 때 불도저와 같은 장비를 선창에 투입할 수 있도록 바닥에 돌기를 제공한다.","내저판의 양현 모서리에 약 45。각 도의 경사판을 붙여 이중저의 강도를 높일 수 있다."],"a":2,"e":"산적화물선의 내저판(탱크탑)은 불도저 등 하역장비 진입과 청소가 쉽도록 평탄하게 보강하며, 돌기를 두면 화물 잔류와 장비 주행을 방해해 설치하지 않는다."},{"id":"6c5f7a3f61","s":0,"n":"252","q":"산적 화물선은 건화물을 주로 운송하므로 산화물이 격벽 보장재에 쌓이지 않도록 무엇을 채용하고 있나?","o":["하부 스톨","선저 외판","상부스톨","파형격벽"],"a":3,"e":"파형격벽(corrugated bulkhead)은 표면에 보강재가 노출되지 않아 산화물이 보강재 위에 쌓이거나 잔류하지 않고, 주름 형상 자체로 강도를 확보한다."},{"id":"65c4c41a12","s":0,"n":"253","q":"산적 화물선에서 산화물의 잔여물이 남지 않고 잘 흘러내리게 하기 위한 구조물은?","o":["하부 스톨","경사판","상부스톨","파형격벽"],"a":1,"e":"화물창 하부의 경사판(호퍼 sloping plate)은 바닥을 기울여 산화물이 중앙으로 자연히 흘러내리게 하므로 잔류물과 청소·소기 부담이 줄어든다."},{"id":"4f74bc8954","s":0,"n":"254","q":"대형 컨테이너선의 설계에 있어서 갑판 하 거덜(Deckgirder)를 설치하지 않는 경우가 많은데 그 이유로 적당한 것은?","o":["대형 창구의 설치에 따른 비틀밍 강도의 약화을 방지하기 위하여","화물을 싣기 위하여 우선적으로 최대한의 넓은 공간을 확보하기 위하여","화물의 적재 및 하역 등의 효율성을 높이기 위하여","둥금새와 보강판을 이용하여 응력 집중에 의한 균열발생을 방지하기 위하여"],"a":2,"e":"갑판 하 거더를 없애면 셀 가이드 설치와 갠트리크레인의 수직 하역에 걸림이 없어 적재·하역 효율이 높아지고, 종·비틀림 강도는 상갑판과 창구 코밍 보강으로 확보한다."},{"id":"fb255f1614","s":0,"n":"255","q":"대부분의 컨테이너 전용선의 상갑판은 두께가 두껍고 폭이 좁은 이유로 타당한 것은?","o":["선체에서 가장 큰 응력이 발생하기 때문에","상갑판 상에 하역장치가 없고 컨테이너를 높이 적재하기 때문에","화물의 충돌 및 기타 사고가 자주 발생하기 때문에","일반적으로 화물을 포장하지 않은 상태로 적재하기 때문에"],"a":1,"e":"'컨테이너 전용선 상갑판이 두껍고 폭이 좁은 이유' → 회사 정답은 상갑판에 하역장치가 없고 컨테이너를 높이 적재하기 때문이다. 대형 창구(hatch)로 갑판 폭이 좁아진다는 점과 함께 암기한다. ⚠[정답 논란] 상갑판은 중립축에서 가장 멀어 종굽힘 응력이 최대로 걸리므로 두껍게 한다는 설명이 정설이며, 일반 이론서는 ①을 정답으로 본다. 다만 채점은 회사 제공 정답 ② 기준이므로 시험에서는 ②로 답할 것.","c":{"t":0,"n":"상갑판은 중립축에서 가장 멀어 종굽힘 응력이 최대로 걸리므로 두껍게 한다는 설명이 정설이며, 일반 이론서는 ①을 정답으로 본다."}},{"id":"7501309643","s":0,"n":"256","q":"컨테이너선의 화물창의 격벽에 대한 설명으로 올바르지 않은 것은?","o":["컨테이너 적재에 편리하도록 비수밀 격벽으로 나누어져 있다.","사람이 오르 내릴 수 있는 플랫폼이 설치되어 있다.","수밀격벽은 선창의 구분뿐만 아니라 비틀림 강도 및 횡강도에 있어서 중요한 역할을 한다.","신체 중앙선에 대하여 하나 또는 대칭으로 2~3개가 설치된다."],"a":3,"e":"중앙선을 기준으로 1개 또는 좌우 대칭 2~3개를 두는 것은 유조선 종통격벽의 특징이며, 컨테이너선 화물창은 셀 구조에 맞춘 횡격벽(수밀·비수밀)이 기본이다."},{"id":"9021b95796","s":0,"n":"257","q":"컨테이너 전용선에 사용하는 창구덮개형식은 어떤형식을 채용하고 있는가?","o":["폰툰(Ponton)형식","구동(Rolling)형식","접이(Folding)형식","싱글풀(Single pull)형식"],"a":0,"e":"컨테이너 전용선은 창구가 매우 커서 폰툰(pontoon)형 덮개를 갠트리크레인으로 통째로 들어 옮기고 그 위에 갑판적을 하는 방식을 쓴다."},{"id":"a2b712622e","s":0,"n":"258","q":"일반적으로 다목적 화물선이나 컨테이너선에는 창구덮개를 Ponton형식을 사용하는 이유로 적당한 것은?","o":["나뉜 부분이 없이 한 몸체로 구성이 되어 튼튼하기 때문에","길이가 폭에 비하여 길기 때문에","화물을 수평으로 격납하는 방식으로 요구되었기 때문에","보냉과 기밀을 필요로 하는 중간 갑판의 창구 덮개가 필요하기 때문에"],"a":0,"e":"폰툰형은 분할·접힘부가 없는 단일 판넬이어서 강도가 크고 그 위에 컨테이너를 적재할 수 있어 대형 창구에 적합하다."},{"id":"651afb54a7","s":0,"n":"259","q":"컨테이너의 적양하의 편리와 이동방지를 위하여 수직으로 설치하는 것으로 컨테이너 전용선의 가장 큰 특징은?","o":["셀 가이드 장치","창구 덮개","창구 코밍","패드아이"],"a":0,"e":"셀 가이드(cell guide)는 화물창 내 수직 안내 레일로, 컨테이너를 자유낙하식으로 적양하하고 선체 동요 시 이동을 막는 전용선의 핵심 구조물이다."},{"id":"41f6b3f143","s":0,"n":"260","q":"다음 중에 VLCC가 주로 운송하는 화물은?","o":["Gas oil","Crude oil","Chemical oil","Diesel oil"],"a":1,"e":"VLCC(Very Large Crude Carrier)는 원유(crude oil) 운송 전용 대형 유조선이며, 제품유·화학품은 프로덕트 탱커나 케미컬 탱커가 담당한다."},{"id":"83fdad977e","s":0,"n":"261","q":"다음 선박 중에서 가장 높은 안전 기준의 구조 및 설비를 필요로 하는 선박은?","o":["유조선","산물선","자동차 운반선","화객선"],"a":3,"e":"여객과 화물을 함께 싣는 화객선은 인명 안전이 우선이므로 SOLAS상 구획·복원성·방화·구명설비 기준이 화물선보다 가장 엄격하게 적용된다."},{"id":"0b1a78177e","s":0,"n":"262","q":"다음 중에 컨테이너 화물을 운송하는 동일한 크기의 선박 중에서 가장 많은 화물을 적재할 수 있는 선박은?","o":["LOLO선","RORO선","LASH선","Barge선"],"a":0,"e":"LO/LO선은 셀 가이드에 컨테이너를 수직으로 층층이 쌓아 선창 용적을 낭비 없이 쓰므로, 램프·차량 통로가 필요한 RO/RO나 바지 적재 방식보다 적재량이 많다."},{"id":"07fced561a","s":0,"n":"263","q":"다음에서 선박의 길이를 나타내는 용어 중에 그 길이가 가장 긴 것은?","o":["전장(LOA)","등록장(RL)","수선간장(LBP)","수선장(LWL)"],"a":0,"e":"전장(LOA, Length Over All)은 선체 최전단에서 최후단까지의 실제 최대 길이여서 등록장·수선간장(LBP)·수선장보다 항상 길다."},{"id":"da8c434a94","s":0,"n":"264","q":"다음에서 만재 흘수선에 대한 설명 중에 옳지 않은 것은?","o":["갑판선의 상면은 건현 갑판의 상면과 일치시킨다.","원표의 중심을 지나는 수평선은 하기 만재 흘수선과 일치한다.","만재 흘수선 원표에 표시하는 한국정부의 표시기호는 \"KR\"이다.","원표를 통과하는 수평선의 상면의 중앙점은 원표의 중심과 일치한다."],"a":2,"e":"만재흘수선 원표 좌우의 문자는 검사·증서 발행 기관을 나타내는 기호로, \"KR\"은 정부 기호가 아니라 한국선급(Korean Register) 기호이므로 정부 표시와 구분해야 한다."},{"id":"73610b508b","s":0,"n":"265","q":"일반 산물선에서 양 현측에 설치하는 현측 탱크에 대한 설명 중 옳지 않은 것은?","o":["현측탱크내부에는 종강력을 위하여 선측 종늑골을 설치한다.","현측 탱크 상부의 갑판은 종강도를 확보하기 위하여 종늑골 형식의 구조이다.","일반적으로 산적 화물의 정지각을 30도로 기준하여 현측 경사판을 배치한다.","현측 탱크는 횡경사보다는 종경사 조정을 위하여 밸러스트 탱크로 이용한다."],"a":3,"e":"현측(톱사이드) 탱크는 공선 시 GM 과대를 억제하고 횡경사·복원성을 조정하는 밸러스트 용도이며, 종경사(트림) 조정은 주로 선수미 탱크가 담당한다."},{"id":"0cd9cba89e","s":0,"n":"266","q":"다음에서 일반 선박의 입거 검사 항목에 대하여 기술한 것으로 적절치 못한 것은?","o":["Bow thruster 검사","Stern tube 베어링 검사","키의 커플링 볼트 고정 상태 검사","선측 중앙부의 만재흘수선표 검사"],"a":3,"e":"만재흘수선표는 선측 수면 위에 있어 부양 상태에서도 확인할 수 있으므로 입거 검사 항목이 아니며, 입거 검사는 선저·타·프로펠러·선미관 등 수중부가 대상이다."},{"id":"370e42aa10","s":0,"n":"267","q":"유조선의 정기 검사 주기로서 옳은 것은?","o":["5년","4년","3년","2년"],"a":0,"e":"선급·정부 검사 체계에서 유조선을 포함한 상선의 정기검사(special survey) 주기는 5년이며 그 사이에 연차·중간검사가 실시된다."},{"id":"9c0b8cfa17","s":0,"n":"268","q":"다음에서 선박의 감항성을 판정하는 요소가 아닌 것은?","o":["선체능력","항해능력","적재능력","보험능력"],"a":3,"e":"감항성(seaworthiness)은 선체능력·운항(항해)능력·감하(적재)능력으로 판정하며, 보험 가입 능력은 계약·경영상 요소로 감항성 요건이 아니다."},{"id":"11359a1372","s":0,"n":"269","q":"다음에서 일등항해사가 적하계획을 세울때 고려해야할 사항으로 적합하지 않은 것은?","o":["선박의 감항성 확보","최대량의 화물 적재","능률적인 하역","화물의 운임료"],"a":3,"e":"운임은 영업·용선 조건에 속하고, 일항사의 적하계획은 감항성 확보, 최대 적재량, 능률적 하역, 화물 손상 방지를 기준으로 수립한다."},{"id":"e8bdaa8377","s":0,"n":"270","q":"다음은 일등항해사가 해상운송에서 담당하고 있는 주요업무에 속하지 않은 것은?","o":["화물의 적재","항해 중의 품질관리","화물의 선하증권발행","양화등 화물에 관한 임무"],"a":2,"e":"선하증권(B/L)은 운송인 또는 그 대리인·선장 명의로 발행되는 서류로 일항사 소관이 아니며, 일항사는 적재·항해 중 화물 관리·양하 업무를 담당한다."},{"id":"d13184a6ae","s":0,"n":"271","q":"다음 중 선박에 화물을 적재할 수있는 큰 공간을 뜻하는 것은?","o":["hold","hatch","deck house","bridge"],"a":0,"e":"hold(선창)는 화물을 적재하는 대형 격납 공간이고, hatch는 그 출입구인 창구, deck house·bridge는 거주·조타 구역이다."},{"id":"9708499c13","s":0,"n":"272","q":"다음에서 적화계획 작성 시 고려해야 할 사항이 아닌 것은?","o":["화물의 성질 및 포장","운송 기간 및 기후","선박의 구조 설비","본선에 탑승한 선원 수"],"a":2,"e":"'적화계획 시 고려사항이 아닌 것' → 회사 정답은 선박의 구조 설비다. 화물의 성질·포장, 운송기간·기후를 3대 고려요소로 묶어 암기한다. ⚠[정답 논란] 선박의 구조·설비는 적화계획의 필수 검토요소이고 본선 승선 선원 수가 적재 배치와 무관하므로, 일반 이론상 정답은 ④다. 다만 채점은 회사 제공 정답 ③ 기준이므로 시험에서는 ③로 답할 것.","c":{"t":3,"n":"선박의 구조·설비는 적화계획의 필수 검토요소이고 본선 승선 선원 수가 적재 배치와 무관하므로, 일반 이론상 정답은 ④다."}},{"id":"79069e3623","s":0,"n":"273","q":"다음에서 컨테이너 외부에 표시되는 항목이 아닌 것은?","o":["소유자의 기호 및 번호","최대 총중량","적재 선박의 이름","소유자의 국적"],"a":2,"e":"컨테이너에는 소유자 기호·번호(BIC code), 소유자 국가코드, 규격·형식 코드, 최대총중량·자체중량 등이 표시되며 적재 선박명은 상시 표기 대상이 아니다."},{"id":"af41b6ba55","s":0,"n":"274","q":"다음에서 선박의 위험 화물을 분류하는 기준에 해당되는 것은?","o":["ISO code","ISM code","SOLAS","IMDG code"],"a":3,"e":"IMDG code(국제해상위험물규칙)가 위험물을 화약류부터 유해성 물질까지 9개 급으로 분류하고 포장·표시·격리·적재 요건을 규정한다."},{"id":"ee5b1b7891","s":0,"n":"275","q":"다음에서 화물의 적화계수에 대한 설명으로 적절한 것은?","o":["화물 1미터톤이 차지하는 선창 용적을 ㎥ 단위로 표시한 수치이다.","화물 1롱톤이 차지하는 선창 용적을 ㎥ 단위로 표시한 수치이다.","화물 1미터톤이 차지하는 선창 용적을 ft³ 단위로 표시한 수치이다.","화물 1롱톤이 차지하는 선창 용적을 ft³ 단위로 표시한 수치이다."],"a":3,"e":"적화계수(stowage factor)는 화물 1롱톤(1,016kg)이 차지하는 선창 용적을 ft³로 나타낸 값으로, 수치가 클수록 용적을 많이 차지하는 경화물이다."},{"id":"2034625cda","s":0,"n":"276","q":"다음 중 위험 화물을 분류하는 IMDG code에서 제 1급에 해당하는 화물은?","o":["화약류","가스류","인화성 액체류","방사성 물질"],"a":0,"e":"IMDG code 제1급은 화약류(explosives)이며, 제2급 가스류, 제3급 인화성 액체류, 제7급 방사성 물질 순으로 구분된다."},{"id":"9ebd091b0c","s":0,"n":"277","q":"다음 IMDG code에서 제 3급인 인화성 액체류를 구분하는 기준은?","o":["35。C이하의 온도에서 인화성 증기를 방출하는 액체","50。C이하의 온도에서 인화성 증기를 방출하는 액체","61。C이하의 온도에서 인화성 증기를 방출하는 액체","45。C이하의 온도에서 인화성 증기를 방출하는 액체"],"a":2,"e":"제3급 인화성 액체류는 밀폐식 시험으로 인화점(flash point) 61℃ 이하에서 인화성 증기를 방출하는 액체를 말한다."},{"id":"44d8865410","s":0,"n":"278","q":"다음에서 위험 화물의 적재위치로서 적절하지 못한 장소는?","o":["화물을 가급적 외부의 충격으로부터 보호할 수 있는 장소이면 좋다.","화물에 대한 계속적인 감시가 가능하고 문제가 발생했을 때 쉽게 접근할 수 있는 장소이어야 한다.","위험성을 초래할 수 있는 물질들을 서로 혼적 불가한 물질로 간주하며 이러한 물질들을 서로 격리해야 한다.","위험 화물은 선박의 안전 운항을 위해 필요한 설비로 가는 통로에 적재한다."],"a":3,"e":"소화·구명설비나 조타·기관실로 통하는 통로에 위험물을 적재하면 비상시 접근·대응이 막히므로 금지되며, 감시·접근이 쉽고 혼적 금지 물질과 격리된 장소가 원칙이다."},{"id":"e931f7bc10","s":0,"n":"279","q":"특별한 위험성을 가지는 물질에 대한 특별요건을 규정한 기준에 해당되는 것은?","o":["IMO code","ISM code","SOLAS","IMDG code"],"a":0,"e":"액화가스·산적 액체화학품 등 특별한 위험성을 가진 물질의 특별요건은 IMO가 채택한 각종 코드(IGC·IBC·BC code 등)에 별도로 규정되어 있다."},{"id":"1fa5d2295f","s":0,"n":"280","q":"다음에서 화물의 틈에 관한 설명으로 올바른 것은?","o":["화물의 종류에 관계없이 동일하다.","선체 중앙부 적재 시 화물 틈이 선수부 적재보다 크다.","화물이 차지하는 용적 이외에 화물과 화물 사이의 빈 공간의 총용적을 말한다.","화물 이동을 방지하기 위한 더니지가 차지하는 공간은 화물 틈에서 제외된다."],"a":2,"e":"화물 틈(broken space)은 화물 자체 용적을 제외한 화물 사이의 빈 공간 총용적으로, 더니지 점유 공간도 포함되고 화물 종류·포장·선창 형상에 따라 달라진다."},{"id":"01e15ca417","s":0,"n":"281","q":"다음 중 화물의 규격화의 구분으로 적당하지 않은 것은?","o":["팰릿화(Palletization)","LASH화(Lighter aboard ship handling)","패키지화(Package)","컨테이너화(Containerization)"],"a":2,"e":"화물 규격화(단위화)는 팰릿화·컨테이너화·라쉬(부선 적재)화로 구분되며, 개별 화물의 단순 포장(package)은 규격화 방식에 해당하지 않는다."},{"id":"adfa9136f5","s":0,"n":"282","q":"다음에서 팰릿화의 설명으로 올바르지 않은 것은?","o":["하역의 능률을 높이기 위하여 사용한다.","팰릿(Pallet) 위에 화물을 정해진 치수로 쌓은 후 팰릿과 화물을 함께 묶어서 규격화하는 방법","독립적으로 사용되기도 하지만 팰릿화한 상태로 컨테이너에 적입할 수 있다.","화물을 실은 부선(lighter)을 본선(ship)에 적재하여 컨테이너 하역 시설이 없는 항만에서 하역하는 방식이다."],"a":3,"e":"④는 부선(lighter)을 본선에 실어 운송하는 라쉬(LASH) 방식 설명이다. 팰릿화는 팰릿 위에 화물을 정해진 치수로 쌓아 함께 결박해 하역 능률을 높이는 단위화 방법이다."},{"id":"1f320e554a","s":0,"n":"283","q":"다음 운송 중에는 일정시간마다 온도를 측정하여 적정온도를 유지해야하는 화물에 해당하는 것은?","o":["냉장화물","고가화물","생동식물 화물","중량화물"],"a":0,"e":"냉장·냉동화물은 품목별 지정 온도를 벗어나면 변질되므로 항해 중 일정 시간마다 창내 온도를 측정·기록하여 적정 온도를 유지해야 한다."},{"id":"59a1a387aa","s":0,"n":"284","q":"적화계획 작성 시 화물의 적재 상태를 표시하기 위한 중요한 자료로 주로 선박의 각 구획을 세분화 한 도면을 무엇이라고 하는가?","o":["화물 적재도","로딩마스터","적화 용적도","하역순서도"],"a":2,"e":"적화 용적도(capacity plan)는 각 선창·탱크의 용적과 중심 위치를 구획별로 세분해 표시한 도면으로, 적화계획과 복원성 계산의 기본 자료다."},{"id":"15cef47f45","s":0,"n":"285","q":"화물의 운송 중 화물 손상이 발생되지 않도록 적절하게 배치해야 하는데 적절한 화물배치에 위배되는 것은?","o":["용적·중량의 두 가지 측면을 고려하여 화물을 구분하여 복원성, 트림에 미치는 영향을 염 두에 두고 배치한다.","귀중품 및 고가품은 별도의 장소에 보관하여 도난, 파손을 방지한다.","양화항의 순서를 고려하여 목적 항까지 가급적 화물을 옮겨 싣는 상황이 발생하지 않도록 적재 장소를 선정한다.","하역 능률의 향상을 위하여 양화항 및 종류가 같은 대량의 화물은 가급적 하나의 선창에 집중시킨다."],"a":3,"e":"동일 양화항·동종 대량화물을 한 선창에 집중시키면 여러 갱(gang)의 병행 작업이 불가능해 하역 능률이 떨어지므로, 복수 선창에 분산 배치하는 것이 원칙이다."},{"id":"676b84951b","s":0,"n":"286","q":"다음은 고가화물에 대한 설명으로서 올바르지 않은 것은?","o":["금괴, 보석, 귀금속, 화폐, 미술품, 정밀 기계 등 무게나 용적에 비하여 값이 비싼 화물을 말한다","고가 화물 선적시에는 담당 사관이 직접 입회하여 포장과 봉인 상태를 검사하고, 선적 서류와 대조하여 확인해야 한다.","일반적으로 고가화물에 대한 운임은 화물의 중량이난 용적에 의한다.","고가화물의 경우 시장 가격에 일정 비율로 부과한 종가운임(Ad valorem freight)제를 취한다."],"a":2,"e":"고가화물의 운임은 중량·용적 기준이 아니라 신고 가액에 일정률을 부과하는 종가운임(ad valorem freight)으로 산정한다."},{"id":"d033851fde","s":0,"n":"287","q":"다음에서 컨테이너화의 장점으로 적절한 것은?","o":["화물을 양화한 후 빈 컨테이너를 반송하는데 비용과 시간이 소요된다.","컨테이너는 자체가 별개의 독립된 창고 역할을 하므로 포장비, 창고비 등의 부대 비용이 절 감된다.","컨테이너를 조작할 수 있는 하역 장비를 갖추지 못한 항만에서는 컨테이너 운송이 불가능 하다.","컨테이너화에 의한 운송을 하기 위해서는 대규모의 투자가 필요하다."],"a":1,"e":"컨테이너는 자체가 독립된 창고·포장 역할을 하므로 포장비·창고비 등 부대비용과 화물 손상이 줄어든다. 공컨테이너 회송, 대규모 투자, 항만 시설 의존은 단점이다."},{"id":"28c3cdca08","s":0,"n":"288","q":"다음에서 컨테이너화의 이점으로 적절하지 못한 것은?","o":["규격화된 컨테이너 사용과 하역의 기계화로 하역 시간이 단축됨에 따라 선박의 재항 시간 이 줄어들어 선박의 회전율이 높아진다.","운송 시간이 단축됨에 따라 재고 비용을 절감할 수 있다.","개개 화물의 조작은 컨테이너 적입시와 반출시 두 번만 이뤄지므로 화물 조작 횟수가 현저 히 감소한다.","대형 장척 화물은 컨테이너를 이용하여 운송할 수 없다."],"a":3,"e":"오픈톱·플랫랙·플랫베드 등 특수 컨테이너를 이용하면 대형·장척 화물도 컨테이너 운송이 가능하므로 이는 이점이 아니라 사실과 다른 설명이다."},{"id":"38db8ecc13","s":0,"n":"289","q":"다음 사항 중 항해중인 대형 선박의 복원력에 가장 큰 영향을 미치는 요소는?","o":["바람","청수사용량 변화","화물의 이동","연료유 사용량의 변화"],"a":3,"e":"항해 중에는 화물이 고박되어 있어 이동이 없고, 이중저 등에서 소비되는 연료유량 변화와 그에 따른 자유표면효과가 GM 변화에 가장 크게 작용한다."},{"id":"aba3f828e5","s":0,"n":"290","q":"내구성이 좋고 제작비용이 비교적 싸서 세계적으로 유통되는 컨테이너는?","o":["강재 컨테이너","알루미늄 컨테이너","FRP 컨테이너","스테인리스 강 컨테이너"],"a":0,"e":"강재(steel) 컨테이너는 강도·내구성이 좋고 제작비가 저렴해 세계적으로 가장 널리 유통되며, 알루미늄·FRP·스테인리스는 경량이나 고가다."},{"id":"06656aee8b","s":0,"n":"291","q":"다음 중 수송비 절감을 위해 현재 가장 일반적으로 사용되고 있는 컨테이너의 규격은?","o":["20ft","25ft","40ft","30ft"],"a":2,"e":"40ft(2TEU) 컨테이너는 20ft 두 개보다 단위 화물당 운송비·하역비가 낮아 현재 국제 운송의 주력 규격으로 쓰인다."},{"id":"5dc4b7e490","s":0,"n":"292","q":"다음에서 입자나 가루된 화물을 운송하기 위한 컨테이너는?","o":["드라이 컨테이너","탱크 컨테이너","냉동 컨테이너","벌크 컨테이너"],"a":3,"e":"벌크 컨테이너는 상부 적입구와 하부 배출구를 갖춘 구조로 곡물·수지·분말 등 분립체 화물을 포장 없이 산적 운송한다."},{"id":"91a6b6053d","s":0,"n":"293","q":"다음에서 적화 계획을 위한 컴퓨터 프로그램인 로딩 마스터(loading master)로 구할 수 있는 일반적인 데이터로 관계가 없는 것은?","o":["GM, 흘수 및 트림","호깅 또는 새깅","화물의 운임단가","전단력 곡선 및 휨 모멘트 곡선 등 선체 세로 강도 곡선"],"a":2,"e":"로딩마스터는 GM·흘수·트림, 호깅/새깅, 전단력·굽힘모멘트 곡선 등 복원성과 종강도 계산을 산출하며, 운임 단가는 영업·상거래 자료로 무관하다."},{"id":"e1329749cc","s":0,"n":"294","q":"다음 중 윗면이 개방되어 크레인으로 위에서 또는 문을 통해 화물을 적입할 수 있는 컨테이너는?","o":["하드 탑 컨테이너(Hard top container)","플랫 래크 컨테이너(Flat rack container)","오픈 톱 컨테이너(Open top container)","드라이 컨테이너(Dry container)"],"a":2,"e":"오픈톱 컨테이너는 지붕이 탈착식 방수 커버로 되어 있어 크레인으로 위에서 적입하거나 후면 문으로 적입할 수 있고, 중량·장척 화물에 적합하다."},{"id":"bf0c53747c","s":0,"n":"295","q":"20ft 컨테이너를 기준으로 2,000개(2,000TEU) 내외 컨테이너를 운송할 수 있는 선박은?","o":["파나맥스(Panamax)","초대형 컨테이너선","포스트 파나맥스(Post Panamax)","핸디 사이즈(Handy size)"],"a":3,"e":"2,000TEU 내외는 핸디(피더)급 컨테이너선에 해당하며, 파나맥스는 약 4,000TEU급, 포스트 파나맥스는 파나마 운하 통과 폭을 넘는 그 이상 급이다."},{"id":"2e94ae04d6","s":0,"n":"296","q":"컨테이너 선의 적부 계획을 수립하는데 가장 중요한 요소는?","o":["선박 운항의 안전성을 확보","선박 운항의 항로성을 확보","선박 운항의 경제성을 확보","선박 운항의 편리성을 확보"],"a":0,"e":"적부계획의 제1원칙은 복원성·종강도·고박 등 운항 안전성 확보이며, 경제성이나 하역 편의는 안전 한도 내에서 추구한다."},{"id":"35fafce3bd","s":0,"n":"297","q":"컨테이너선의 적부계획 수립 시 주안점으로 타당하지 않은 것은?","o":["컨테이너선은 통상 갑판적을 하기 때문에 선체 중심이 높고 풍압 면적이 커서 충분한 GM을 확보할 필요가 있다.","냉동 컨테이너의 적부는 전원 공급 장치가 설치된 위치에 배치하여야 한다.","기항지의 순서, 양하지 서비스 및 하역 방법에 적합한 적부 계획을 수립한다.","하부에 실린 컨테이너에 상부에 실린 컨테이너의 중량이 과도하게 가해져야 선체의 횡동요를 막을 수 있다."],"a":3,"e":"하부 컨테이너에 상부 중량이 과도하게 걸리면 컨테이너 압괴와 구조 손상을 초래하므로 단별 적재 중량 한도를 지켜야 하며, 횡동요 억제와는 관계가 없다."},{"id":"b3ae5ec683","s":0,"n":"298","q":"컨테이너 적부도 중 베이 플랜(Bay plan)에 기재되어야 할 정보로 필요 치 않은 것은?","o":["각 컨테이너의 적부 위치","선적항 및 양하항","컨테이너 화물의 적부 상태","특수화물의 보험 가입여부"],"a":3,"e":"베이 플랜은 적부 위치(베이·로우·티어), 선적항·양하항, 화물 내용과 적부 상태를 나타내는 하역 자료이며, 특수화물의 보험 가입 여부는 기재 대상이 아니다."},{"id":"9da2f232b0","s":0,"n":"299","q":"다음 중 생동식물화물 운송에 대한 설명으로 적합하지 않은 것은?","o":["생동식물 화물(Livestock cargo)은 살아 있는 동물과 식물로 가축류, 어류, 조류, 각종 동물이다.","가축과 같이 살아가는 동물의 운송에는가축 전용컨테이너(Livestock Container)를 이용한다.","생동식물 화물은 잘 관리 해야 하므로, 선원 거주 구역에서 가까운 곳에 적부한다.","생동식물은 일반적으로 상갑판의 통풍이 잘 되는 곳에 적재한다."],"a":2,"e":"생동식물 화물은 악취·오물·소음과 위생 문제 때문에 선원 거주구역에서 떨어진, 통풍이 잘 되는 상갑판에 적부해야 한다."},{"id":"3cb171a363","s":0,"n":"300","q":"베이플랜에서 컨테이너 위치를 6자리의 숫자로 이루어진 셀넘버(cell number)로 구성되는 이때 맨 앞 두자리 숫자를 무엇이라고 하는가?","o":["로우 넘버(Row no.)","슬롯 넘버(Slot no.)","베이 넘버(Bay no.)","티어 넘버(Tier no.)"],"a":2,"e":"셀 넘버 6자리는 앞 2자리가 선수미 방향 위치를 나타내는 베이 넘버, 다음 2자리가 좌우 위치의 로우 넘버, 마지막 2자리가 상하 위치의 티어 넘버로 구성된다."},{"id":"9455e6e4d0","s":0,"n":"301","q":"다음에서 컨테이너에서 횡방향의 위치를 지정하는 번호를 말하는 것은?","o":["로우 넘버(Row no.)","슬롯 넘버(Slot no.)","베이 넘버(Bay no.)","티어 넘버(Tier no.)"],"a":1,"e":"'컨테이너 횡방향 위치를 지정하는 번호' → 회사 정답은 슬롯 넘버(Slot no.)다. 베이(종)·티어(상하)와 짝지어 '횡=슬롯'으로 암기한다. ⚠[정답 논란] 적부위치는 베이(종방향)·로우(횡방향)·티어(상하)로 지정하고 슬롯 넘버는 이 셋을 합친 번호이므로, 일반 이론상 횡방향은 로우 넘버(①)다. 다만 채점은 회사 제공 정답 ② 기준이므로 시험에서는 ②로 답할 것.","c":{"t":0,"n":"적부위치는 베이(종방향)·로우(횡방향)·티어(상하)로 지정하고 슬롯 넘버는 이 셋을 합친 번호이므로, 일반 이론상 횡방향은 로우 넘버(①)다."}},{"id":"f35e0b463a","s":0,"n":"302","q":"다음에서 선적항과 양화항을 편의상 베이플랜 약호로 사용하는데 잘못 기재 된 것은?","o":["PUSAN - PUS","OSAKA - OSK","SIGAPORE - SIN","TOKYO - JAN"],"a":3,"e":"도쿄의 베이플랜 약호는 TYO이며 JAN은 쓰이지 않는다. 부산 PUS, 오사카 OSK, 싱가포르 SIN은 정상 표기."},{"id":"e83b2f7bde","s":0,"n":"303","q":"다음에서 일반적인 하역의 작업의 순서로 적절한 것은?","o":["입항 및 하역 작업 준비 - 하역작업 - 하역 후 정리 작업 - 화물관리","입항 및 하역 작업 준비 - 화물관리 - 하역작업 - 하역 후 정리작업","화물관리 - 입항 및 하역 작업 준비 - 하역작업 - 하역 후 정리 작업","입항 및 하역 작업 준비 - 하역작업 - 화물관리 - 하역 후 정리 작업"],"a":0,"e":"하역은 입항 및 하역작업 준비 → 하역작업 → 하역 후 정리작업 → 항해 중 화물관리(care of cargo) 순으로 진행된다."},{"id":"dbf85c5ff9","s":0,"n":"304","q":"다음 중 컨테이너 하역 시 주의사항으로 부 적절한 것은?","o":["컨테이너 적부도를 참조하여 전체적인 하역 순서와 위험성 여부를 파악하여 두는 것이 좋다.","전반적인 작업의 진행 상황을 파악하여 컨테이너 적부도에 표시하여야 한다.","선체 횡경사가 심하면 하역이 불가능하므로, 횡경사(Heeling)가 5˚ 이상 생기지 않도록 밸러스트로 조절해 주어야 한다.","선적 후 컨테이너의 래싱 작업은 중요하므로 현장에서 직접 확인하여야 한다."],"a":2,"e":"갠트리 크레인 하역은 경사에 민감해 횡경사(heeling)를 통상 1~2° 이내로 억제하며 밸러스트로 상시 조정한다. 5°까지 허용된다는 서술은 부적절."},{"id":"3f73b7cc0c","s":0,"n":"305","q":"다음 중 래싱(Lashing)에 대한 설명으로 올바른 것은?","o":["화물을 다른 화물로부터 보호하기 위한 보호재를 말한다.","화물을 싣고 난 후 선체가 동요할 때 움직이지 않도록 화물을 묶는 것을 말한다.","화물을 동일한 장소에서 적재하지 않고 분리시키는 것을 말한다.","화물이 오손, 눌림, 마찰, 이동으로 인한 손상을 방지하기 위해 통풍을 용이하게 하는 것을 말한다."],"a":1,"e":"래싱(lashing)은 선체 동요 시 화물이 움직이지 않도록 와이어·체인 등으로 고박하는 작업이다. ①은 던니지·보호재, ③은 분리(separation), ④는 통풍 조치."},{"id":"6d328e0a58","s":0,"n":"306","q":"다음은 컨테이너의 적부위치를 나타낸 6자리 숫자이다. 예) 06 02 06 (가) (나) (다) (가)~(다)의 내용에 적합한 내용을 <보기>에서 골라 바르게 짝지은 것은? 보기: ㄱ. 선저로 부터의 높이 ㄴ. 선체의 종방향 표시 ㄷ. 선체의 횡방향 표시","o":["ㄱ ㄴ ㄷ","ㄱ ㄷ ㄴ","ㄴ ㄱ ㄷ","ㄴ ㄷ ㄱ"],"a":3,"e":"6자리 적부번호는 앞 두 자리가 베이(bay, 종방향), 가운데가 로우(row, 횡방향), 끝이 티어(tier, 선저로부터의 높이)를 나타낸다."},{"id":"70cb0eb047","s":0,"n":"307","q":"다음 중 위험 화물의 하역 시 주의해야할 사항으로 적당하지 않은 것은?","o":["하역시 위험 화물에 충격을 주지 않게 하고, 와이어 슬링(Wire sling)이나 훅(Hook)의 사 용을 피한다.","화물의 용기나 포장이 파손된 것과 누설되고 있는 것 등은 선적하지 않는다.","하역이 일시 중단되거나 하역이 끝나면 창구를 폐쇄하여 출입을 통제한다.","위험 화물은 야간이나 승객이 승·하선하는 시간 및 수리 작업을 하는 시간에는 하역한다."],"a":3,"e":"위험화물은 야간, 승객 승·하선 시간, 수리작업 중에는 하역을 피해야 한다. 충격 방지, 파손·누설 용기 불선적, 작업 중단 시 창구 폐쇄는 옳은 조치."},{"id":"737f79f869","s":0,"n":"308","q":"컨테이너 터미널 시설에서 본선 입항 전에 계획된 선적 순서에 따라 슬롯에 컨테이너를 쌓아두는 곳은?","o":["에이프런","컨테이너 야드","마샬링 야드","컨테이너 프레이트 스테이션"],"a":2,"e":"마샬링 야드(marshalling yard)는 본선 입항 전 적부계획 순서대로 컨테이너를 슬롯에 대기시키는 곳이다. 에이프런은 안벽 하역공간, CFS는 LCL 혼재 장소."},{"id":"770e703160","s":0,"n":"309","q":"다음에서 컨테이너의 구조에 대한 설명으로 올바르지 않은 것은?","o":["항구적인 성질을 가지며 반복사용에 적합할 정도로 견고한 것.","수송 중 이적하지 않고 1개 또는 그 이상의 수송방식에 의한 화물의 수송을 용이하게 하고자 특별히 설계한 것","화물의 적입 및 적출이 용이하게 설계되어 있는 것.","3m³ 이상의 내부용적을 가지고 있는 것 등이다."],"a":3,"e":"ISO 컨테이너의 요건은 내부용적 1m³ 이상이므로 3m³ 이상은 틀리다. 내구성·반복사용성, 환적 없는 일관수송, 적입·적출 용이성은 옳다."},{"id":"3d8b696241","s":0,"n":"310","q":"ISO에서 규정한 컨테이너 구비 조건으로 적절하지 않은 것은?","o":["일정기간에 재사용이 가능한 충분한 내구력을 가지고 있을 것.","수송경로를 변경할 때 조작이 용이할 것.","화물의 적양과는 무관하게 설계되어 있을 것.","운송도중 수송경로(수단)가 바뀌는 경우 화물의 적양 없이 일관수송을 할 수 있도록 설계되어 있을 것."],"a":2,"e":"컨테이너는 화물의 적입·적출(적양)이 용이하도록 설계되어야 하므로 적양과 무관하게 설계된다는 서술은 틀리다."},{"id":"27f5142361","s":0,"n":"311","q":"우리나라에서는 언제부터 door to door의 컨테이너 운송수단이 시작되어 는가?","o":["1950년대","1970년대","1990년대","2000년대"],"a":1,"e":"우리나라의 door to door 컨테이너 일관운송은 1970년대에 개시되었다."},{"id":"ce695fdfd0","s":0,"n":"312","q":"다음은 일반적인 하역 작업의 순서에서 적화계획에 따라 1등 항해사와 당신 사관이 감독 지시하는 작업 순서는?","o":["입항 및 하역작업 준비","하역작업","하역 후 작업 정리","화물관리"],"a":1,"e":"적화계획(stowage plan)에 따라 1등항해사와 당직사관이 직접 감독·지시하는 단계는 하역작업 단계다."},{"id":"a10e18051e","s":0,"n":"313","q":"컨테이너가 가장 효율적르로 운송할 수 있는 최적 상품(Prime Containerizable Cargoes)로 해당되지 않는 것은?","o":["전자제품","의약품","의류제품","한계상품"],"a":3,"e":"최적상품(prime containerizable cargo)은 전자제품·의약품·의류처럼 고가로 운임부담력이 큰 화물이며, 한계상품(marginal cargo)은 채산성이 낮아 여기에 들지 않는다."},{"id":"1a196b4ab2","s":0,"n":"314","q":"다음에서 컨테이너 화물의 종류를 설명한 것으로 적절한 것은?","o":["물리적으로 적재할 수 있으나 가격과 운임이 싸고 도난의 위험이 없는 상품을 적합상품이라고 한다.","최적의 상품보다는 값과 운임이 싼 상품인 철제류, 피혁제품, 철판 등은 한계상품이라고 한다.","화물을 물맂거으로 컨테이너화 할 수 없는 것은 극히 드물겠으나 화물의 성질, 용적, 중량 등에 의한 부적합 상품이 있다.","화물의 개별 가격이 싸고 해상운임이 싼 공산품이 컨테이너 화물로서 최적상품이다."],"a":2,"e":"화물의 성질·용적·중량 때문에 컨테이너화가 곤란한 부적합상품(unsuitable cargo)이 존재한다는 설명이 옳다. 최적상품은 가격과 운임부담력이 높은 화물이고, 철제류·피혁제품 등은 적합상품에 가깝다."},{"id":"dba84d01d3","s":0,"n":"315","q":"다음 중 위험물 운송에 대한 각 나라의 관계법규에서 거리가 먼 것은?","o":["미국의 Yellow Book","영국의 Blue Book","호주의 Red Books","일본의 MOT Rules"],"a":0,"e":"미국의 위험물 규정은 연방규칙(CFR)과 USCG 기준으로 Yellow Book이라 부르지 않는다. 영국 Blue Book, 호주 Red Book, 일본 MOT Rules는 실재하는 명칭."},{"id":"a80906eda9","s":0,"n":"316","q":"다음의 부정기선 중 특수전용선에서 중유 및 원유를 주로 수송하는 선박은?","o":["refrigerate ship","lumber carrier","clean tanker","car carrier"],"a":2,"e":"원유·중유 등 유류를 싣는 것은 유조선(tanker)이며 보기 중 탱커는 하나뿐이다. 엄밀히는 원유·중유는 dirty tanker, clean tanker는 휘발유·등유 등 정제유용."},{"id":"d9042efdbc","s":0,"n":"317","q":"다음의 부정기선 시장과 중개인에 대한 설명으로 적합하지 않은 것은?","o":["부정기선의 영업에는 화물운송계약이 있거나 화주로부터 화물을 offer 받아서 선박을 수배하는 경우가 있다.","수많은 선박과 선적지·양륙지를 달리하는 많은 종류의 화물간에 조회(inquiry)가 교환되는 용선해운시장이 형성된다.","세계적 해운시장의 중심은 런던, 뉴욕 및 동경이다.","정기선의 해운동맹과 같은 국제적 cartel 조직은 있고, 시장참여가 자유스런 경쟁시장이다"],"a":3,"e":"부정기선 시장은 해운동맹 같은 국제 카르텔이 없는 자유경쟁 시장이므로 카르텔 조직이 있다는 서술은 틀리다."},{"id":"784cd363b8","s":0,"n":"318","q":"역사적으로 가장 오래되고 전세계의 해운정보가 집중되어 있는 공개된 해운거래소는?","o":["노르웨이 아마렉스","부산 국제해운거래소","런던 발틱해운거래소","뉴욕 증권거래소"],"a":2,"e":"1744년 이래의 런던 발틱해운거래소(Baltic Exchange)가 가장 오래된 공개 해운거래소로 전세계 해운정보가 집중된다."},{"id":"c0e8f258d5","s":0,"n":"319","q":"부정기선의 중개인이 하는 역할로서 관계가 적은 것은?","o":["선박소유자의 대표로서 업무를 수행하고 있다.","세계 각지의 적하품을 찾고 있는 선박 및 적선을 매치(match)시키는 역할을 한다.","선박이용자의 대표로서 업무를 수행하고 있다.","정기용선이나 선박의 매매에 관한 업무는 수행할 수 없다."],"a":3,"e":"용선중개인(chartering broker)은 항해·정기용선 중개뿐 아니라 선박매매(S&P) 중개까지 수행하므로 수행할 수 없다는 서술은 틀리다."},{"id":"d3eb368cca","s":0,"n":"320","q":"다음에서 선복의 전부를 빌리기는 하지만 어느 특정 항해를 위해 용선되는 계약을 무엇이라고 하는가?","o":["전부용선계약(whole charter)","일부용선계약(partial charter)","항해용선계약(voyage charter)","정기용선계약(time charter)"],"a":2,"e":"선복 전부를 특정 1항해 단위로 빌리는 계약은 항해용선계약(voyage charter)이다. 전부용선은 선복 전부 대상의 상위 개념, 정기용선은 기간 기준."},{"id":"49b9084dd8","s":0,"n":"321","q":"다음 중 항해용선계약의 본질로 관계가 적은 것은?","o":["어느 항에서 어느 항까지 화물의 수송을 화주인 용선자(charterer)와 선주(owner) 사이에 맺는 운송계약을 말한다.","계약의 주 내용이 어디까지나 기간으로 계약하는 용선이다.","항해용선은 1항해를 대상으로 하는 단독항해용선(single voyage charter)이 통상이다.","연속항해의 경우에 있어서도 기본적 내용은 단독항해용선의 경우와 거의 같다."],"a":1,"e":"기간을 계약의 주 내용으로 하는 것은 정기용선(time charter)이며, 항해용선은 특정 항 간 화물운송을 목적으로 한다."},{"id":"d5a46034d9","s":0,"n":"322","q":"선주가 용선자에게 선복을 빌려주는 항해용선계약에서의 운임은 실제로 무엇에 의하여 결정되는가?","o":["항해 거리","항해 속도","항해 일정","적재한 화물수량"],"a":3,"e":"항해용선 운임은 실제 적재한 화물수량(운임톤)에 운임률을 곱해 결정된다. 다만 선복용선(lumpsum)은 수량과 무관한 총액 방식."},{"id":"fe52338f0b","s":0,"n":"323","q":"다음에서 A항에서 B 항까지의 계약톤수에 의해서 합계가 얼마로 정하고 실제로 적재수량에는 관계가 없는 방법에 의한 계약은?","o":["전부용선계약(whole charter)","선복용선계약(Lumpsum Charter)","일대용선계약(Daily Charter)","정기용선계약(time charter)"],"a":1,"e":"선복용선계약(lumpsum charter)은 A항~B항 선복에 대해 총액 운임을 정하고 실제 적재수량과 무관하게 지급하는 방식이다."},{"id":"3cb3f5551f","s":0,"n":"324","q":"다음은 항해용선계약을 체결하는 순서로 올바르게 짝 지어진 것은?","o":["Inquiry for ship's space - Firm offer for ship's space - Fixture note - Counter offer","Firm offer for ship's space - Inquiry for ship's space - Fixture note - Counter offer","Firm offer for ship's space - Inquiry for ship's space - Counter offer - Fixture offer","Inquiry for ship's space - Firm offer for ship's space - Counter offer - Firm offer"],"a":0,"e":"선복조회(inquiry)로 시작해 선복확약(firm offer)을 거쳐 선복확약서(fixture note)를 작성하며, 조건이 맞지 않으면 반대청약(counter offer)이 오간다."},{"id":"502a143a57","s":0,"n":"325","q":"선박회사가 제시한 신청서의 유효기간 내에 화주가 firm offer를 수락하면 용선계약이 성립되고 이때 제시하는 증빙서류는?","o":["용선계약서","운임지불서","선복확약서","선박 명세서"],"a":2,"e":"유효기간 내에 화주가 firm offer를 수락하면 용선계약이 성립하고 그 증빙으로 선복확약서(fixture note)를 교부한다. 정식 용선계약서는 이후 작성."},{"id":"4550ec3603","s":0,"n":"326","q":"다음 중 선복확약서에 서명날인 할 수 있는 관계 당사자가 아닌 자는?","o":["선박회사","화주","선장","중개인"],"a":2,"e":"선복확약서에 서명날인하는 당사자는 선박회사, 화주, 중개인이며 선장은 계약 당사자가 아니다."},{"id":"91c1e4f44e","s":0,"n":"327","q":"항해용선계약에서 용선자가 선적 및 양륙의 하역 비용을 부담하고 선주는 항비를부담하는 것은?","o":["Gross Term","F.I.O. Charter","Lumpsum charter","Net Term"],"a":1,"e":"F.I.O.(Free In and Out)는 선적·양륙 하역비를 용선자가 부담하고 항비는 선주가 부담하는 조건이다."},{"id":"92612c99a3","s":0,"n":"328","q":"부정기선에서 사용되는 일반적인 방식으로 선주가 모든 하역비 및 항비를 부담하는 것은?","o":["Gross Term","F.I.O. Charter","Lumpsum charter","Net Term"],"a":0,"e":"Gross Term(Berth Term)은 선주가 하역비와 항비를 모두 부담하는 부정기선의 일반적 조건이다."},{"id":"fd05b6e827","s":0,"n":"329","q":"부정기선의 Gross Term에서 화물은 본선인도가 원칙이므로 부선운임, 체선료, 공휴일 하역, 야각 하역의 할증임과 같은 특별 항만비는 누가 부담하는가?","o":["선주","선장","중개인","용선자"],"a":3,"e":"Gross Term에서도 화물은 본선인도가 원칙이므로 부선운임·체선료·공휴일 및 야간 하역 할증 등 특별항만비는 용선자(화주)가 부담한다."},{"id":"3b30691cad","s":0,"n":"330","q":"용선자는 선박의 사용에 대한 총액의 운임을 지급하고 선박이 운송할 수 있는 화물의 최대 중량을 보증하는 것을?","o":["Gross Term","F.I.O. Charter","Lumpsum charter","Net Term"],"a":2,"e":"Lumpsum charter는 선복 사용에 대해 총액 운임을 지급하고 선주가 적재 가능한 최대 중량을 보증하는 방식이다."},{"id":"f87598e354","s":0,"n":"331","q":"다음 중 북미 및 캐나다 대서양연안으로 부터 세계 각지로 향하는 만선곡물수송용에 사용되는 서식은?","o":["일반용 표준서식","석탄수송용 표준서식","목재수송용 표준서식","곡물수송용 표준서식"],"a":3,"e":"북미·캐나다 대서양연안발 만선 곡물수송에는 곡물수송용 표준서식(Norgrain 등)이 사용된다."},{"id":"aa27d8285e","s":0,"n":"332","q":"정기용선계약에서 용선자는 용선료 외에 지불해야 하는 것과 관계가 먼 것은?","o":["연료비","운항비","중개수수료","입항세"],"a":2,"e":"정기용선에서 중개수수료는 선주 부담이고, 용선자는 용선료 외에 연료비·운항비·입항세 등 변동 운항비용을 부담한다."},{"id":"16ee37c530","s":0,"n":"333","q":"정기용선계약의 표준시식으로 뉴욕상품거래소가 1913년 제정하여 1946년 개정한 양식은?","o":["Baltime","Produce Form","Coastcon Medcon","Benacon"],"a":1,"e":"뉴욕상품거래소가 1913년 제정하고 1946년 개정한 New York Produce Exchange Form(Produce Form)이 정기용선 표준서식이다. Baltime은 BIMCO 양식."},{"id":"a169a879d4","s":0,"n":"334","q":"용선운송계약서에서 \"good steamship called the ~ classed 100A1 at Lloyed's\"와 같이 표시되는것은 무엇을 뜻하는 문구인가?","o":["선박의 표시","선박의 동정","선박의 선명","감항능력의 담보"],"a":3,"e":"\"classed 100A1 at Lloyd's\"는 선급 유지를 통해 선박이 감항능력(seaworthiness)을 갖추었음을 담보하는 문구다."},{"id":"69d5da3485","s":0,"n":"335","q":"다음 중 정기선 화물로 1개의 용적이 특별히 크고 해운동맹의 표정운임률에도 포함시킬 수 없고 취급하기 어려운 화물로 하역에 특별한 준비가 필요하여 할증운임이 부과되는 화물은?","o":["중량화물(Heavy Cargo)","고가화물(Valuable Cargo)","위험화물(Dangerous Cargo)","벌크화물(Bulky Cargo)"],"a":3,"e":"1개 용적이 특별히 크고 표정운임률 적용이 어려워 특별 준비와 할증운임이 필요한 화물은 용적화물(bulky cargo)이다. 중량화물은 무게, 고가화물은 가액 기준."},{"id":"26ca67a880","s":0,"n":"336","q":"다음 일본지역에로의 정기선항로인 한일항로의 운임은 누가 결정하는가?","o":["우리나라 화물선의 화주로 구성된 수송협의회","한국선주협회","한국해기사협회","일본선주협회"],"a":0,"e":"한일항로 운임은 우리나라 화물선 화주로 구성된 수송협의회가 결정한다."},{"id":"ed468c0608","s":0,"n":"337","q":"다음 동남아항로의 환적항으로 올바르게 짝지어진 것은?","o":["Hong Kong, Bangkok","Singapore, Hong Kong","Manila, Port Kelang","Keelung, Djarkata"],"a":1,"e":"동남아항로의 대표적 환적항(transhipment port)은 싱가포르와 홍콩이다."},{"id":"5f53bd7c4a","s":0,"n":"338","q":"다음에서 기항지는 Meblourne, Syndney 드이고 New Zealand 까지는 Local Service로 운송되며 waiver가 면제되고 운임도 비교적 싼 항로는?","o":["동남아 항로","지중해 항로","호주 항로","아프리카 항로"],"a":2,"e":"멜버른·시드니를 기항하고 뉴질랜드까지 로컬 서비스로 연결되며 waiver가 면제되고 운임도 비교적 저렴한 항로는 호주항로다."},{"id":"1f69549329","s":0,"n":"339","q":"다음 국적선 불취항 증명서의 면제의 경우로 해운협정 등 국제조약 및 협약체결 국가가 아닌 국가는?","o":["미국","싱카포르","파키스탄","호주"],"a":3,"e":"미국·싱가포르·파키스탄은 우리나라와 해운협정 등 국제조약을 체결한 국가이지만 호주는 해당하지 않는다."},{"id":"f957b73ed0","s":0,"n":"340","q":"다음에서 지정화물이 되는 경우로 해당되지 않는 것은?","o":["특수사정으로 국적선운송이 불가능한 경우의 화물","계약조건, 무역관행 및 상대국법규 등으로 국적선운송 만이 가능한 경우","국적선운송능력의 부족으로 운송할 수 없는 경우","해난 등 불가피한 사유로 국적선운송이 곤란한 경우"],"a":1,"e":"특수사정·적취능력 부족·해난 등으로 국적선 운송이 불가능하거나 곤란한 경우가 waiver 관련 사유이며, 상대국 법규 등으로 국적선 운송만 가능한 경우는 오히려 국적선 이용이 강제되므로 해당하지 않는다."},{"id":"73f8fd92b6","s":0,"n":"341","q":"최근 우리 나라 국적선회사가 F.E.F.C.에 가맹하여 국적 Full-container선박이 FEFC의 선복용선방식으로 취항하고 있는 항로는?","o":["동남아 항로","유럽 항로","호주 항로","북미주 항로"],"a":1,"e":"국적선사가 F.E.F.C.(Far Eastern Freight Conference)에 가맹해 국적 풀컨테이너선이 선복용선방식으로 취항하는 항로는 유럽항로다."},{"id":"ee960ab49f","s":0,"n":"342","q":"다음 협회 중 어느 곳에서 국적선 운송면제확인서의 발급을 받을 수 있나?","o":["수송협회","해기사협회","한국무역협회","한국선주협회"],"a":3,"e":"국적선 운송면제확인서(waiver)는 한국선주협회가 발급한다."},{"id":"e85a70200b","s":0,"n":"343","q":"항해용선의 운임은 화물의 수량을 기초로 지불되나, 정기용선의 용선료는 무엇에준거하여 지불되는가?","o":["인도기일","항행구역","계약기간","하역시간"],"a":2,"e":"정기용선료는 화물수량이 아니라 계약기간(용선기간)에 준거해 재화중량톤당 월정액 등으로 지급된다."},{"id":"d4a292040c","s":0,"n":"344","q":"다음에서 정기선 운임의 의의로 부적절한 것은?","o":["취항항로 및 발착일시 등에 제약이 있다.","해운동맹(shipping conference)가 결성됭 있다.","정기선 시장에 있어서 경쟁은 뚜렷하고 제약되어 반 독점적이다.","자유운임이 원칙이고 수요공급의 변화에 대한 감수성이 상당히 강하다."],"a":3,"e":"자유운임 원칙과 수요·공급 변화에 민감한 것은 부정기선의 특징이며, 정기선은 해운동맹의 표정운임률(tariff)로 운임이 안정적이다."},{"id":"530c4685b7","s":0,"n":"345","q":"다음에서 국적선 불취항 증명서의 발급 사항의 경우로 해당되지 않은 것은?","o":["성질상 국적선 적재가 불가능한 화물의 경우","컨테이너의 구조를 갖은 선박이 일반잡화를 수송할 경우","선적예정일 5일 전 부터 선적예정일 까지 국적선이 없는 경우","해난 및 기타 불가피안 사유로 국적선 운송이 곤란한 경우"],"a":1,"e":"컨테이너선이 일반잡화를 수송하는 것은 정상적인 국적선 취항이므로 불취항증명서 발급사유가 아니다."},{"id":"e1fd756ee0","s":0,"n":"346","q":"다음 중 정기선 운임의 구성으로 해당되지 않는 것은?","o":["기본운임","할증료","추가요금","보험료"],"a":3,"e":"정기선 운임은 기본운임에 할증료(surcharge)와 추가요금이 더해져 구성되며, 보험료는 화주가 부보하는 비용으로 운임 구성요소가 아니다."},{"id":"cc3b3dfbf0","s":0,"n":"347","q":"정기선 운송에서 다른 화물을 오손시킬 우려가 있는 화물을 무엇이라고 하는가?","o":["정량화물(Fine or Clean Cargo)","조잡화물(Rough Cargo)","산적화물(Break Bulk Cargo)","단위화물(Unit Cargo, Container Cargo)"],"a":1,"e":"다른 화물을 오손시킬 우려가 있는 화물은 조잡화물(rough cargo)이며, 그런 우려가 없는 화물은 정량화물(fine or clean cargo)이다."},{"id":"33158d4288","s":0,"n":"348","q":"다음 정기선 운임의 일종으로 항로별로 기본운임의 %로 정하거나 컨테이너당 또는 톤당 일정액을 정하여 공시하는 형식의 운임은?","o":["기본운임","할증료","추가요금","무차별 운임"],"a":1,"e":"유가·통화 변동 등에 대응해 항로별로 기본운임의 일정 %나 컨테이너·톤당 정액으로 공시하는 운임은 할증료(surcharge)다."},{"id":"9ff7a38475","s":0,"n":"349","q":"다음 중 국적선 불취항 증명서의 면제 사유가 되지 않는 경우는?","o":["해운협정 등 국제조약 및 협약체결국가","우리나라 선사의 적취량을 일정수준 설정한 운임동맹에 가입한 외국선사가 운송하는 화물","복합운송에 의한 MLB서비스가 가능하거나 선복용선방식으로 항로를 취항하는 선복","우리나라 선사가 외국선사와 제휴, 상호 선복을 공동사용하는 경우 국적선사가 사용하는 선복부분에 상당하는 외국선박의 선복"],"a":2,"e":"면제 사유로 열거되는 것은 해운협정 등 조약 체결국, 우리 선사 적취량이 보장된 운임동맹 가입 외국선사 화물, 상호 선복 공동사용분 등이며 MLB 복합운송·선복용선 취항 선복은 여기에 포함되지 않는다."},{"id":"b8ead6e3e1","s":0,"n":"350","q":"화물의 기본운임은 원래 그 화물의 나름대로의 특성이외의 요인 등에 따라 품목별로 차등 부과되는데 이에 해당되지 않는 것은?","o":["운송코스트","운임부담력","화물의 종류","선복의 연식"],"a":3,"e":"기본운임은 운송코스트, 화물의 운임부담력, 화물의 종류 등에 따라 품목별로 차등 부과되며 선복의 연식(선령)은 고려 요소가 아니다."},{"id":"b0a967c532","s":0,"n":"351","q":"다음 중 귀금속 등의 고가품에 적용되는 운임으로 송장가격에 일정률을 곱하여 산출하는 정기선운임은?","o":["종가운임(Ad Valorem Rate)","중량할증운임(heavy cargo surcharge)","인플레 할증료(Inflation Adjustment Factor)","체선할증료(port congestion surcharge)"],"a":0,"e":"종가운임(Ad Valorem Rate)은 귀금속·미술품 등 고가품에 대해 송장가격(invoice value)에 일정률을 곱해 산출하는 정기선운임이다. 나머지는 중량·물가·항만혼잡 등 특정 원인에 부가되는 할증료(surcharge)다."},{"id":"99e13bf900","s":0,"n":"352","q":"용선운송계약에서 계약 본인인 용선자는 청구된 수수료에 대해 제소의 의무를 지니게 되는 이유로 타당한 것은?","o":["용선자가 운임 또는 용선료의 지불을 확보하기 때문이다.","용선자가 상실시간에 대한 보상으로 체선료를 지불해야 하기 때문이다.","적하 및 양하 비용이 용선자 측에서 부담하기 때문이다.","법률상의 난점을 극복하기 위해 중개인이 실제의 본인의 이름을 차용하는 것이다."],"a":3,"e":"중개인(broker)은 자기 이름으로 중개수수료를 청구·제소하기 어려우므로, 중개료 조항(brokerage clause)에서 법률상 난점을 피하기 위해 계약 본인인 용선자의 이름을 차용해 제소하도록 정한 것이다."},{"id":"33bfeff764","s":0,"n":"353","q":"다음은 양륙항 선택화물(Optional Cargo) 할증과 관계된 설명으로 잘못 된 것은?","o":["화물 선적시에 양륙항이 지정되지 않고 출항 후에 화주가 가장 편리한 양륙지를 선적하여 그 항구에서 양륙하여 화물을 인도하는 경우임.","B/L의 양륙항 난에는 예컨대 'London/Hamburg option' 혹은 'Pusan/Inchon option'과 같이 두 개 이상의 항구가 명시됨.","송화인 또는 수화인은 본선의 선적지 출항 후 최초의 선택항 도착 전 일정일(보통 24시간 또는 48시간 전)까지 양륙항을 결정하여 그 항구에 있는 선박회사 대리점에 통고함.","중개인이 선택 지정하여 양륙·하도하는 화물을 Optional Cargo라고 함."],"a":3,"e":"선택양륙항의 지정권은 중개인이 아니라 송화인·수화인(화주)에게 있으며, 최초 선택항 도착 24~48시간 전까지 화주가 양륙항을 결정해 선사 대리점에 통고한다."},{"id":"608fa1165b","s":0,"n":"354","q":"다음 중 해운동맹이 대향화물에 대해 요금을 별도로 정하지 않고 동맹가입선사가 임의로 적용하여 경쟁력을 높이기 위해 적용되는 운임은?","o":["특별운임(special rate)","경쟁운임(open rate)","접속운임(OCP Rate)","최저운임(minimum rate)"],"a":1,"e":"경쟁운임(open rate)은 동맹이 표정운임률을 정하지 않고 가입선사가 자유롭게 운임을 책정하도록 개방한 품목운임으로, 대항화물·저가 대량화물의 경쟁력 확보 수단이다."},{"id":"ab72796a0f","s":0,"n":"355","q":"정기선의 운임이 liner terms로서 선적 및 양륙의 하역비를 선주가 부담해야 하는 이유로 타당한 것은?","o":["화물이 많든 적든 적하품이 있든 없든 반드시 취항하기 때문이다.","운송화물의 대상이 주로 소량의 일반화물이기 때문이다.","부정기선처럼 자유거래에 의하여 결정할 수 있기 때문이다.","다수의 화주로부터 소량화물을 인수하여 운송하고 운임도 공시된 운임표에 따르기 때문이다."],"a":3,"e":"Liner(berth) terms는 다수 화주의 소량 개품화물을 공표된 tariff 운임으로 인수하는 구조이므로 하역비를 화주별로 분리 부과할 수 없어 선적·양륙비를 운임에 포함시켜 선주가 부담한다."},{"id":"4b59390f47","s":0,"n":"356","q":"다음 통운임에 대한 설명으로 바람직하지 못한 것은?","o":["운송구간의 기본운임에 접속지에서 도착지에 이르는 구간의 arbitrary를 가산한 것이다.","Arbitrary를 구성하는 내용은 일부 운송구간의 운임(local freight) 및 접속비용과의 합계이다.","접속비용은 접속을 위한 선적, 양륙비, 접속선 대기를 위한 창고료 등이 있다.","예정 기항지 이외에 적하 혹은 양하를 위해서 기항을 하는 화물에 대해서는 특별한 운임부가율이 설정된 경우이다."],"a":3,"e":"통운임(through freight)은 기본운임에 접속지 이후 구간의 arbitrary(local freight+접속비용)를 가산한 운임이다. ④는 예정 기항지 외 기항에 붙는 기항할증(surcharge)에 관한 설명이다."},{"id":"2b0459e4d5","s":0,"n":"357","q":"다음 중 북미수출의 경우 도착항에서의 하역 및 터미널 작업비용을 해상운임과는 별도로 징수하는 부대비용은?","o":["부두사용료","터미널화물처리비","도착지화물인도비용","컨테이너세"],"a":2,"e":"북미항로에서 도착항의 하역·터미널 작업비를 해상운임과 분리해 징수하는 부대비용은 도착지화물인도비용(DDC, Destination Delivery Charge)이다. THC는 선적지 터미널 작업비를 말한다."},{"id":"0790a4955e","s":0,"n":"358","q":"용선계약시에는 선하증권 국제통일조약을 적용하지 않기 때문에 공공의 질서를 해치지 않는 한 그 범위는 제한이 없으나, 제외조항이 있는데 이에 해당되지 않는 경우는?","o":["선원의 선행(good deeds)","나포·포획(capture and seizure)","관청의 강제관리(restraint of princes)","국적(king's enemies)"],"a":0,"e":"용선계약의 면책(제외)조항에는 나포·포획, 관청의 강제관리, 국왕의 적 등 불가항력적 사유가 열거된다. 선원의 선행은 면책 사유가 될 수 없고, 실제 쟁점이 되는 것은 선원의 악행(barratry)이다."},{"id":"87d99f2528","s":0,"n":"359","q":"미국항로에 취항하는 선사들에게 Tariff에 신고된 운임률이나 기타 조건에 관계없이 독자적인 운임률을 설정할 수 있도록 허용한 운임제도는?","o":["우대운송계약(Service Contract)","독자운임결정권(Independent Action)","기간별 물량별 운임(Time Volume Rate)","지역운임(local freight)"],"a":1,"e":"독자운임결정권(Independent Action)은 미국 해운법이 동맹 tariff 신고 운임률·조건과 무관하게 개별 선사가 독자 운임을 설정·신고할 수 있도록 허용한 제도다."},{"id":"eebb60494a","s":0,"n":"360","q":"다음에서 우대운송계약(Service Contract)에 포함되어 있지 않은 내용은?","o":["계약기간","최저물량","계약운임","중개수수료"],"a":3,"e":"우대운송계약(Service Contract)은 계약기간, 최저물량(minimum quantity), 계약운임률, 위약금 등을 필수 요소로 하며 중개수수료는 계약 내용에 포함되지 않는다."},{"id":"9be32e6211","s":0,"n":"361","q":"다음 중 해상운임의 표시통화에 대한 설명으로 적절하지 않은 것은?","o":["운임률을 표시하는 통화의 종류를 운임의 표시 통화(지급통화)라 한다.","우리 나라를 중심으로 하는 정기선(liner)항로에 있어서는 운임을 거의 미국 통화(U.S. Dollar)와 영국 통화(Sterling Pound)로 표시되어 있다.","운임률(tariff)는 해운동맹에 의해 결정하기 때문에 표시통화는 US Dollar만으로 사용한다.","정기선의 경우 반드시 B/L면에 운임표시통화를 명시하고 있다."],"a":2,"e":"표시통화는 항로와 관행에 따라 US$·Sterling Pound 등 복수 통화가 쓰이며, 동맹이 tariff를 결정한다는 이유로 미달러만 사용된다고 볼 수 없다."},{"id":"805e404a58","s":0,"n":"362","q":"정기선에 의한 개품운송에 있어서는 선불이 원칙이지만 어떤 경우에 후불이 가능한가?","o":["CIF나 CFR계약의 경우","선박회사의 승인이 있는 경우","화주가 고의로 화물의 내용, 가격 또는 중량에 관하여 허위신고를 한 경우.","선적할 때 지정 검량인(sworn measurer)에게 검량을 시키는 경우"],"a":1,"e":"개품운송 운임은 선불(freight prepaid)이 원칙이나 선박회사의 승인이 있는 경우 후불(freight collect)이 허용된다. FOB 등 조건도 선사 승인을 전제로 한다."},{"id":"46f6a33648","s":0,"n":"363","q":"용선계약상의 선박을 다시 제3자에게 용선하는 경우의 허가 및 조건을 나타내는 조항은?","o":["중재조항","공동해손조항","이로","재용선"],"a":3,"e":"재용선(sublet) 조항은 용선한 선박을 다시 제3자에게 용선해 줄 수 있는 허가 여부와 그 조건·원용선계약상 책임 존속 관계를 규정한 조항이다."},{"id":"0c5422d59e","s":0,"n":"364","q":"다음 중 가장 오래된 역사를 지닌 CALCUTTA 해운동맹의 항로는??","o":["영국·인도항로","구주/호주 항로","극동/미태평양 항로","극동/미대서양 항로"],"a":0,"e":"1875년 결성된 캘커타 동맹(Calcutta Conference)은 영국~인도(캘커타) 항로에 조직된 세계 최초의 해운동맹으로 가장 오래된 역사를 지닌다."},{"id":"b8dc19b2b9","s":0,"n":"365","q":"다음에서 정기선 운송의 의의에 대해서 잘못 서술하고 있는 것은?","o":["정기선항로에 취항하고 있는 선박을 말한다.","컨테이너 화물 전용의 컨테이너선과 재래선으로 분류한다.","정해진 기항항 사이를 정해진 운항일정에 따라 항해하고 있다.","산화물을 운송하는 의미로 통상 사용되고 있다."],"a":3,"e":"정기선(liner)은 공표된 스케줄에 따라 정해진 기항지를 규칙적으로 운항하는 개품운송 선박을 뜻하며, 산화물(bulk cargo) 운송은 부정기선(tramper)의 영역이다."},{"id":"e0b2715f35","s":0,"n":"366","q":"다음에서 폐쇄식 동맹(Closed conference)를 잘못 설명하고 있는 것은?","o":["신규가입을 극단으로 제한하는 형태로서 영국식 동맹이라고 부른다.","동맹이 승인할 만한 일정자격과 실적을 갖고 있지 않는 선박회사는 가입시키지 않는 방식이다.","그 항로에 배선하는 의지 및 능력이 있는 선주면 언제라도 자유로이 가입시키는 형태로 미국식 해운동맹이라고 한다.","구주항로나 호주항로 등에 결성되어 있다."],"a":2,"e":"③은 배선 의지·능력만 있으면 자유가입을 허용하는 개방식 동맹(open conference, 미국식) 설명이다. 폐쇄식은 영국식으로 자격·실적 심사를 통해 신규가입을 제한한다."},{"id":"dc79de6abc","s":0,"n":"367","q":"다음 중 해운동맹의 내부규제에 해당되는 사항으로 거리가 먼 것은?","o":["운임협정(rate agreement)","독자운임결정권(Independent Action)","배선협정(sailing agreement)","공동계산협정(pooling agreement)"],"a":1,"e":"동맹의 내부규제는 운임협정·배선협정·공동계산(pooling)·공동경영 등 카르텔적 협정이다. 독자운임결정권은 동맹의 통제를 완화하려고 미국 해운법이 개별 선사에 부여한 권리다."},{"id":"2bc3e297ff","s":0,"n":"368","q":"다음 해운동맹의 내부규제인 배선협정에 대한 설명으로 관계가 없는 것은?","o":["특정의 항로에 있어서 배선선복량을 조절·제한하고 선복과잉에 의한 과당경쟁을 방지하려는 것이다.","일정한 항로에 있어서 항해수, 기항지, 운항 schedule 등을 규제한다.","생산업자간의 수량 카르텔에 해당된다.","각 항로 사정에 따라 이 중 하나 또는 둘 이상을 개별적으로 분리시켜 실시하고 있다"],"a":3,"e":"④는 운임협정·배선협정·풀협정 등 내부규제 전반을 항로 사정에 따라 선택 실시한다는 일반론으로 배선협정 자체의 내용이 아니다. 배선협정은 항해수·기항지·선복량을 규제하는 수량 카르텔이다."},{"id":"6395999ebc","s":0,"n":"369","q":"용선운송계약의 공동해손 조항은 1974년 무슨 규칙에 의해 처리하는 취지의 조항인가?","o":["The New York Produce Exchange Charter양식","Australian Grain Charter 서식","York-Antwerp규칙","Baltic and International Maritime council uniform Time-Charter양식"],"a":2,"e":"공동해손(General Average) 조항은 1974년 York-Antwerp Rules에 따라 정산·처리한다는 취지의 규정이다. 나머지는 용선계약 표준서식 명칭이다."},{"id":"2a6e5b1e47","s":0,"n":"370","q":"다음에서 계약운임제(contract rate system)에 대한 설명으로 올바른 것은?","o":["운임연환불제와는 달리 유보기간은 없이 일정기간 경과 후에 그 환불금을 전액 한 번에 지급한다.","환불에 있어서 그 기간에 이어 계속해서 일정기간 동맹선에만 선적할 것을 조건으로 하여 그 계속되는 일정기간이 경과된 후 환불되는 제도이다.","동맹의 표정운임률에 계약운임률(contract rate)과 비계약운임률(non-contract rate)을 설정하여 화주가 동맹선에만 선적할 것을 계약하면 운임률을 낮게 적용하고 그렇지 않으면 고율의 운임을 적용하는 방식이다.","각 동맹선사들이 일정기간 벌어들인 운임을 사전에 정한 배분율에 따라 배분하는 방법이다."],"a":2,"e":"계약운임제(contract rate system)는 이중운임제로, 동맹선 전용 선적을 계약한 화주에게 낮은 contract rate를, 비계약 화주에게 높은 non-contract rate를 적용한다. ①·②는 운임환불·연환불제, ④는 풀협정이다."},{"id":"615bbbcd18","s":0,"n":"371","q":"다음은 국적선 이용제도의 의의에 대한 설명으로 타당하지 않은 것은?","o":["해운산업육성법 제16조에 의거하여 선박을 이용하여 대통령령이 정하는 주요 화물(지정화물)을 운송하고자 하는 자는 국적선을 이용하여야 하는 제도를 말한다.","우리 나라의 정기선 취항지역에 화물을 운송하고자 하는 자는 국적선을 이용하여야 하는 제도를 말한다.","장기적이고 안정적인 운송체제의 확립 및 외화유출방지를 위해 국적선을 이용하여야 한다는 취지를 담고 있다.","정기선화물은 국적선 불취항증명서(waiver), 지정화물은 국적선 운송면제확인을 받지 않아도 외국선박을 이용할 수 있다"],"a":3,"e":"정기선화물은 국적선 불취항증명서(waiver), 지정화물은 국적선 운송면제확인을 받아야 외국선박 이용이 가능하므로 무조건 이용할 수 있다는 서술은 틀리다."},{"id":"cd9398e137","s":0,"n":"372","q":"다음에서 해운동맹의 단점으로 적합한 것은?","o":["안정적 자본투자로 서비스의 개선을 촉진한다.","합리적 배선으로 경쟁에 의한 낭비를 방지하고 원가를 절감한다.","운임률이 원가보다 동맹의 정책에 좌우되어 불합리하게 책정된다.","동맹의 가입을 통해 영세선사도 생존 가능하다."],"a":2,"e":"동맹의 독점적 성격 때문에 운임률이 원가가 아니라 동맹 정책에 좌우되어 불합리하게 책정되는 것이 대표적 단점이다. ①·②·④는 동맹의 장점에 해당한다."},{"id":"4ac7a3dcfa","s":0,"n":"373","q":"다음 중 용선료의 의미로 적당하지 않은 것은?","o":["운송행위의 보수 선적량 또는 총액운임","운송행위 능력에 관한 보수기간 운임","운송수단인 선박의 임차료","선주와 용선자간의 경비"],"a":3,"e":"용선료는 선복·운송능력 제공에 대한 보수(선복운임·기간운임)나 선박 임차료를 의미하며, 선주와 용선자 사이의 경비 부담(비용분담)은 운임 개념이 아닌 별개 문제다."},{"id":"a5f6ae299e","s":0,"n":"374","q":"다음에서 해운동맹에 가입되었을 경우 이점을 적절하게 설명한 것은?","o":["독점성으로 인해 과대이윤, 서비스의 저하, 클레임의 회피, 보복적 차별우대 등이 있을 수 있다.","발착일이 정확, 자주, 규칙적이며 운송기간이 확정되어 있어 무역거래에 편리하다.","기항수를 가급적 줄이려는 경향이 강해 화주들에게 불편을 준다.","운임환불제, 계약운임제 등이 모두 선사의 일방적 통제하에 이루어진다."],"a":1,"e":"동맹 배선은 발착일이 정확·빈번·규칙적이고 운송기간이 확정되어 무역거래 계획 수립에 유리하다는 이점이 있다. ①·③·④는 독점의 폐해로 단점 쪽이다."},{"id":"b7b6c2cf74","s":0,"n":"375","q":"다음 중 선박회사 또는 해운동맹이 일정기간 동안 일정하게 정해진 품목을 선적한다는 조건부로 화주에게 할인혜택을 주는 운임은?","o":["우대운송계약(Service Contract)","독자운임결정권(Independent Action)","기간별 물량별 운임(Time Volume Rate)","지역운임(local freight)"],"a":2,"e":"기간별 물량별 운임(Time Volume Rate)은 일정기간 내 정해진 품목·물량을 선적할 것을 조건으로 화주에게 운임을 할인해 주는 제도다."},{"id":"f123402960","s":0,"n":"376","q":"화주가 선사에 제출하는 운송의뢰서(application for shipment)로서, 화물의 명세가 기재되는 정기선 운송에 있어서 주요한 서류는?","o":["Shipping Request(S/R ; 선복요청서)","Booking Note(선적예약서)","Booking List(예약일람표)","Equipment Receipt(E/R ; 기기수도증)"],"a":0,"e":"선복요청서(Shipping Request, S/R)는 화주가 화물명세를 기재해 선사에 제출하는 운송의뢰서이며, 이를 근거로 선사가 Booking Note와 Booking List를 작성한다."},{"id":"3c4f1b53d6","s":0,"n":"377","q":"다음 중 항해용선계약에서의 용선자의 책임제한 조항의 의미는?","o":["용선자가 화물을 적재하고 비용을 지불하면 그 책임을 면한다는 뜻이다.","용선계약 불이행의 경우에 지불하여야 할 손해배상예정액을 의마한다.","용선자는 청구된 수수료에 대해 제소의 의무에 대한 뜻이다.","인명과 재산의 구조 또는 salvage를 위하여 이로할 것을 허용하거나 거부한다는 의미이다."],"a":0,"e":"책임제한 조항(cesser clause)은 용선자가 화물을 적재하고 운임 등 비용을 지급하면 이후 책임이 소멸하고 선주는 화물유치권(lien)으로 담보를 확보한다는 취지다."},{"id":"5bfd1f1975","s":0,"n":"378","q":"다음 컨테이너 내적치도(Container load plan)은 컨테이너 적입된 화물의 명세로 작성할 수 있는 자가 아닌 사람은?","o":["화주 또는 포워드","선주","검수인","CFS Operator"],"a":1,"e":"CLP는 FCL의 경우 화주·포워더, LCL의 경우 CFS Operator가 작성하고 검수인이 확인하는 서류로, 선주(선사)가 작성 주체가 되지는 않는다."},{"id":"00be575a74","s":0,"n":"379","q":"세관에 대한 반출입신고서, CFS/CY간 화물인수도의 증거, 본선내 법정보존서류, 양륙지에서 보세운송신고서 및 적출작업(devanning) 자료로 사용되는 정기선의 주요 서류는?","o":["Shipping Order(S/O ; 선적지시서)","Dock Receipt(D/R ; 부두수취증)","Container Load Plan(CLP ; 컨테이너 내적치도)","Mate's Receipt(M/R ; 본선수취증)"],"a":2,"e":"컨테이너 내적치도(Container Load Plan)는 컨테이너별 적입명세서로 세관 반출입신고, CFS/CY 인수도 증빙, 본선 법정보존서류, 양륙지 보세운송·적출(devanning) 자료로 쓰인다."},{"id":"c8f80d00b3","s":0,"n":"380","q":"다음 중 본선수취증에 대한 설명으로 해당되지 않은 내용은?","o":["본선이 M/R에 기재된 상태로 화물을 수취하였음을 인정하는 영수증이다.","선적요청을 받은 선사(또는 대리점)가 송화인에게 교부하는 선적승낙서이다.","M/R은 본선과 송화인간에 화물의 수도가 이루어진 사실을 증명하는 것이다.","선적완료 후 검수집계표(outturn report)에 근거하여 일등항해사(chief mate)가 선적화물과 선적지시서(S/O)를 대조, 송화인(shipper)에게 교부한다."],"a":1,"e":"②는 선사가 선복예약을 승낙해 교부하는 Booking Note(선적승낙서) 설명이다. 본선수취증(M/R)은 일등항해사가 선적화물과 S/O를 대조해 수취 상태를 증명하며 송화인에게 주는 서류다."},{"id":"eef4e8e8b4","s":0,"n":"381","q":"다음 중 해운산업육성법에 근거한 주요 정책화물로 해당되지 않는 것은?","o":["원유","제철원료","액화가스류","의료제품류"],"a":3,"e":"주요 정책(지정)화물은 원유·제철원료·액화가스류 등 국민경제상 중요한 대량 전략물자이며 의료제품류는 이에 포함되지 않는다."},{"id":"6462e771e4","s":0,"n":"382","q":"하역중인 화물의 개수, 화인, 포장상태, 화물사고 등을 기재하는 검수화물목록은 누가 작성하는 가?","o":["화주","선주","검수인","포워더"],"a":2,"e":"검수화물목록은 하역 현장에서 화물의 개수·화인(shipping mark)·포장상태·화물사고를 확인해 기재하는 검수인(tally man)이 작성한다."},{"id":"c1a9a0d3a2","s":0,"n":"383","q":"다음 중 양륙지의 세관 등에 제출하는 중요한 서류이므로 각국의 규정·관습 등을 충분히 숙지할 필요한 주요 서류는?","o":["Delivery Order(D/O ; 인도지시서)","Manifest(M/F ; 적하목록)","Mate's Receipt(M/R ; 본선수취증)","Shipping Order(S/O ; 선적지시서)"],"a":1,"e":"적하목록(Manifest, M/F)은 본선 적재화물의 총괄명세서로 양륙지 세관에 제출하는 핵심 서류이므로 각국의 규정과 관습을 충분히 숙지해야 한다."},{"id":"5e1f2ad861","s":0,"n":"384","q":"다음 정기용선계약의 특별조항애서 보통 break down clause라 불리워지는 것으로 선박의 사고로 인해 운항불능이 되었을 경우 용선료를 조정한다고 하는 취지의 규정은?","o":["연료 및 항비의 부담에 관한 조항","선박상실에 의한 과불금 및 용선료의 반환","off hire조항","배선명령에 대한 용선자의 책임"],"a":2,"e":"off hire(휴항) 조항은 기관고장 등 선박 사고로 운항불능·능력저하가 된 기간의 용선료 지급을 정지·조정하는 규정으로 break down clause라고도 불린다."},{"id":"60471c3ef7","s":0,"n":"385","q":"다음 중 용선자가 선주를 대신해서 선원의 교체를 요구하는 규정은?","o":["배선명령에 대한 용선자의 책임","선박상실에 의한 과불금 및 용선료의 반환","선장 및 기관장에 대한 용선자의 해임청구권","배선명령에 대한 용선자의 책임"],"a":2,"e":"선장 및 기관장에 대한 용선자의 해임청구권 조항으로, 정기용선자가 업무수행에 부적합한 선장·기관장의 교체를 선주에게 요구할 수 있도록 한 규정이다."},{"id":"a133c92145","s":0,"n":"386","q":"다음에서 선박의 인도 및 반환시에 남아있는 기름은 각각 상대방에게 시가로 인계 인수하여야 한다는 규정은?","o":["잔유","입거","off hire조항","선하증권"],"a":0,"e":"잔유(remaining bunkers) 조항으로, 선박 인도 및 반선 시 잔존 연료유를 당시 시가(market price)로 상대방에게 인계·인수하도록 정한다."},{"id":"257e90acca","s":0,"n":"387","q":"다음의 선박 중 일반화물선으로 컨테이너를 운송할 수 있는 구조를 갖지 않은 선박은?","o":["재래화물선(conventional ship)","세미컨테이너선(semi-container ship)","RO/RO선(Roll on/Roll off Vessel)","다목적선(multi-purpose ship)"],"a":0,"e":"재래화물선(conventional ship)은 셀 가이드 등 컨테이너 전용 구조가 없어 컨테이너 운송에 부적합하다. 세미컨테이너선·RO/RO선·다목적선은 컨테이너 적재가 가능하다."},{"id":"032ec234c7","s":0,"n":"388","q":"다음에서 계약당사자의 명칭으로 잘못 짝지어진 것은?","o":["용선자 - Charterer","선주 - Owner","화주 - Forwarder","선박경영자 - Operator"],"a":2,"e":"화주는 Shipper(cargo owner)로 표기되며 Forwarder는 운송주선인이므로 짝이 맞지 않는다. 용선자-Charterer, 선주-Owner, 선박경영자-Operator는 올바른 대응이다."},{"id":"7353017151","s":0,"n":"389","q":"다음에서 부정기선 운임에 대한 종류로서 해당되지 않는 것은?","o":["용적을 단위로 하는 화물운임","화물이 고가인 경우에는 종가운임제","중량을 단위로 하는 화물운임","화물이 저가인 경우에는 최저운임제"],"a":3,"e":"최저운임(minimum rate)은 소량 개품화물에 적용되는 정기선 운임제도이며, 부정기선 운임은 중량·용적 단위 운임과 고가품의 종가운임(ad valorem)으로 구성된다."},{"id":"8a98f6a1fc","s":0,"n":"390","q":"다음 운임 지불방법 중 선불인 경우에 해당되는 경우는?","o":["착불(payable on arrival destination)","양하완료시불(payable on completion of discharging)","B/L 발행시불(payable on signing of B/L)","비례운임(pro rate freight)"],"a":2,"e":"B/L 발행시불(payable on signing of B/L)은 선적 후 선하증권 발행 시점에 지급하는 선불(freight prepaid)이다. 착불·양하완료시불은 후불(freight collect)에 해당한다."},{"id":"679ccbeb5b","s":0,"n":"391","q":"다음에서 당해 항구의 관습적 하역방법 및 하역능력에 따라 할 수 있는 한 빨리 적양 하역을 하는 조건을 말하는 것은?","o":["관습적 조속하역조건","연속작업일조건","호천작업일조건","공휴일작업조건"],"a":0,"e":"관습적 조속하역조건(CQD, Customary Quick Despatch)은 그 항구의 관습적 하역방법·하역능력에 따라 가능한 한 신속히 하역하는 조건으로 정박기간을 일수로 확정하지 않는다."},{"id":"11fae13977","s":0,"n":"392","q":"다음은 호천작업일조건(Weather Working Days)에 관한 설명으로 관계가 먼 것은?","o":["기상조건이 하역 가능한 상태의 날만 정박기일에 산입하는 것으로 현재 가장 많이 택하고 있는 조건이다.","공휴일은 원래 근로일이 아니므로 하역을 하더라도 보통 정박일수에 산입하지 않는다. 이것을 \"Sunday and holidays excepted\"의 첫글자를 따라 SHEX라고 한다.","우천, 파업 및 기타 불가항력 등 어떠한 원인에도 관계없이 하역개시 이후 종료시까지의 일수는 모두 정박기간에 계산하는 방법이다.","어떠한 기상이 하역 가능한 상태인가 하는 것은 화물의 종류에 따라 많은 차이가 있으므로 이러한 문제를 해결하는 방법으로 선장과 화주가 그 때마다 합의 결정하는 것이 현명한 방법이다"],"a":2,"e":"③은 원인을 불문하고 하역개시 후 모든 경과일을 산입하는 연속작업일(running laydays) 설명이다. WWD는 기상이 하역 가능한 날만 정박기간에 계산한다."},{"id":"46385cfccd","s":0,"n":"393","q":"다음은 해약기일에 대한 설명으로 적합하지 않은 내용은?","o":["해약기일(cancelling date)을 약정하여 해약기일이 넘으면 화주는 해약권을 발동할 수 있다.","해약기일은 C/P면에 기재되며","해약기일이 도래하더라도 선박의 운항이 일기나 고장수리 등으로 방해를 받는 수가 많기 때문에 Gencon Form에서는 입항하기 48시간 전에 화주에게 통고해야 한다.","해약기일은 본선 사정상 예정일로부터 대개 30일 정도 여유를 두는 것이 보통이다."],"a":3,"e":"해약기일(cancelling date)은 선적준비 예정일로부터 통상 10~15일 정도의 여유를 두는 것이 관행이며 30일씩 여유를 두지는 않는다."},{"id":"f5a3f5bf3f","s":0,"n":"394","q":"다음의 Gencon Form의 해약조항에 대한 설명으로 관계가 없는 것은?","o":["본선이 지정된 월일에 선적준비를 정돈하지 못하면 용선자에게 본 계약을 해제할 수 있는 선택권을 주고 있다.","본선이 해손으로 지연되는 경우는 가급적 신속히 용선자에게 통고하되 적재준비정돈예정일을 10일 이상 초과할 때는 용선자는 계약의 해제선택권을 갖게 된다.","선택권은 요청이 있을 때 본선 선적예정일의 최소 1일 이전에 통고해야 한다.","용선자의 계약의 해제선택권의 적용은 해약기일을 약정할 때에 한한다."],"a":2,"e":"Gencon 해약조항에서 용선자는 선주의 지연 통고를 받은 후 48시간 내에 계약 해제 여부를 선택·통고해야 하며, 선적예정일 1일 전 통고라는 규정은 없다."},{"id":"314f061a93","s":0,"n":"395","q":"다음에서 초과정박일에 대한 용선자 또는 화주가 선주에게 지급하는 보수는?","o":["손해금","체선료","조출료","중개료"],"a":1,"e":"초과정박일에 대해 용선자·화주가 선주에게 지급하는 보수는 체선료(demurrage)이며, 반대로 정박기간을 절약하면 조출료(despatch money)를 받는다."},{"id":"66d3a3a5f8","s":0,"n":"396","q":"다음은 체선료에 대한 설명으로 올바르지 않은 것은?","o":["실무상으로 초과체박기간에 대해 지연손해금을 물게하는 운송계약은 드물고 통상 초과체박기간에 대해 약정된 체선료를 물고 있다.","초과정박일에 대한 용선자 또는 화주가 선주에게 지급하는 보수이다.","체선료는 1일 24시간을 기준하여 계산한다.","체선료는 불확정손해(unliquidated damage)로서 만약 당사자 사이에 분쟁이 생겨 중재에 회부되거나 소송이 제기되면 각각 중재인 및 법원이 그 손해액을 결정한다."],"a":3,"e":"체선료는 계약에서 미리 약정한 확정손해배상액(liquidated damages)이므로, 중재인이나 법원이 손해액을 산정해야 하는 불확정손해(unliquidated damage)가 아니다."},{"id":"e47d88d2d1","s":0,"n":"397","q":"다음의 조출료(dispatch money)에 대한 설명으로 적절한 것은?","o":["용선계약상 허용된 정박기간 종료전에 하역이 완료되었을 때 그 절약된 기간에 대하여 선주가 용선자에게 지급하는 일종의 상여금이다.","선주가 운임, 부적운임, 체선료 및 체박손해금 등에 대하여 화물의 유치권을 대한 보상액이다.","불가항력 이외의 사유로 용선계약을 위반했을 때 위약 당사자가 그 상대방에게 지불하는 비용을 말한다.","초과정박일에 대한 용선자 또는 화주가 선주에게 지급하는 보수이다."],"a":0,"e":"조출료(despatch money)는 약정 정박기간 종료 전에 하역이 완료된 경우 절약된 기간에 대해 선주가 용선자에게 지급하는 장려금으로, 통상 체선료의 절반 수준이다."},{"id":"31ded5ac14","s":0,"n":"398","q":"다음에서 용선할때 일정량의 운송화물을 계약하였는데 화주가 그 계약수령을 선적하지 못했을 때 선적하지 않은 화물량에 대해 지급하는 운임은?","o":["선복운임","비례운임","부적운임","연속항해운임"],"a":2,"e":"부적운임(dead freight)은 계약한 최소 선적량을 채우지 못한 부족분에 대해 화주가 지급하는 위약금 성격의 운임이다. 선복운임은 총액운임, 비례운임은 중도 양륙 시 거리비례 운임이다."},{"id":"507d4deb43","s":0,"n":"399","q":"다음운 우리나라 해운업법과 그 시행령에 규정된 해운관련 업종 중 순수 해운업으로 분류되는 것은?","o":["해운중개업","선박대여업","해상화물운송사업","해상화물운송주선업"],"a":0,"e":"'해운업법상 순수 해운업' → 회사 정답은 해운중개업이다. 선박대여업·해상화물운송주선업과 구별해 '순수 해운업=해운중개업'으로 암기한다. ⚠[정답 논란] 순수 해운업은 선박으로 직접 운송을 인수·수행하는 해상화물운송사업이고 해운중개업은 해운관련(부대)업으로 분류되므로, 일반 이론상 정답은 ③이다. 다만 채점은 회사 제공 정답 ① 기준이므로 시험에서는 ①로 답할 것.","c":{"t":2,"n":"순수 해운업은 선박으로 직접 운송을 인수·수행하는 해상화물운송사업이고 해운중개업은 해운관련(부대)업으로 분류되므로, 일반 이론상 정답은 ③이다."}},{"id":"b35e4fd839","s":0,"n":"400","q":"다음에서 포장을 하지 않은 상태로 운송하는 화물로서 주로 부정기선 화물의 대부분이 속하는 것은?","o":["건화물(dry cargo)","액상화물(liquid cargo)","산화물(bulk cargo)","기피화물(dirty cargo)"],"a":2,"e":"산화물(bulk cargo)은 곡물·석탄·광석·시멘트처럼 포장하지 않고 살적 상태로 운송하는 화물로, 부정기선(tramper) 화물의 대부분을 차지한다."},{"id":"e129dd2ecd","s":1,"n":"1","q":"다음에서 선하증권(Bill of Lading ; B/L)에 대한 설명으로 맞지 않는 것은?","o":["증권에 명시된 화물수취증이다.","운송의 법적 계약서이다.","운임계산서이다.","기명식 선하증권(Straight B/L)의 경우에는 선하증권의 소유자가 화물에 대한 권리를 갖는다."],"a":2,"e":"선하증권은 화물수취증(receipt), 운송계약의 증거, 권리증권(document of title) 기능을 가지며, 운임이 기재될 뿐 운임계산서 자체는 아니다."},{"id":"a3de367676","s":1,"n":"2","q":"다음에서 선하증권에 종류에 관해 설명한 것으로 적절하지 못한 것은?","o":["무하자선하증권은 화물이 양호한 상태로 적재되어 증권면에 아무런 사고적요(remarks)가 없는 선하증권이다.","수취선하증권은 수하인란에 수하인의 이름이 기재된 선하증권이다.","기명식선하증권은 수하인란에 수하인의 이름이 기재된 선하증권이다.","지시식선하증권은 수하인란에 특정 수하인명이 기재되지 않고 단순히\"to order\", \"to the order of xxBank\" 등으로 기재된 선하증권이다."],"a":1,"e":"수취선하증권(Received B/L)은 선적 전 화물 수령 단계에서 발행되는 증권이며, 수하인란에 특정인의 이름이 기재된 것은 기명식(Straight B/L)이다."},{"id":"78a876eba3","s":1,"n":"3","q":"다음에서 선하증권의 효력의 발생요건으로 거리가 먼 것은?","o":["선하증권의 소지인이 선의로 취득하였을 것","선하증권의 소지인가 해상운송인과의 운송관계일 것","선하증권의 기재사항은 선하증권의 소지인을 위한 것일 것","선하증권은 운송인과 계약당사자간의 채권적인 법률관계 일 것"],"a":3,"e":"④는 운송인과 증권소지인 사이의 채권관계라는 채권적 효력의 내용일 뿐 발생요건이 아니며, 요건은 선의취득·운송관계의 존재·소지인을 위한 기재이다."},{"id":"c8a616b264","s":1,"n":"4","q":"다음 중 선하증권의 채권적 효력의 한계를 설명한 것으로 타당하지 않은 것은?","o":["운송채권의 소멸시효인 1년이 지남으로서 그 효력을 상실한다.","선하증권은 유통성보호를 위한 그 채권적인 효력은 인정되지 않는다.","운송물의 멸실, 훼손 또는 연착이 법정면책사유를 그 원인으로 할 경우 효력을 상실한다.","선하증권의 작성행위 자체가 사기 또는 강박 등의 숨은 흠이 있는 경우에는 무효이다."],"a":1,"e":"채권적 효력은 증권의 유통성 보호를 위해 오히려 인정되는 것이므로 한계 사유가 될 수 없고, 실제 한계는 1년 소멸시효·법정면책사유·의사표시의 흠(사기·강박)이다."},{"id":"ce3a0da013","s":1,"n":"5","q":"다음 중 운송인이 운송물을 수령하고 선하증권을 정당하게 소지할 사람에게 인도하였을 때 발생되는 효력은?","o":["채권적 효력","상환적 효력","물권적 효력","환수적 효력"],"a":2,"e":"운송물을 수령한 뒤 정당한 소지인에게 증권을 교부·인도하면 증권의 교부가 운송물 인도와 동일한 효력을 갖는 물권적 효력(처분증권성)이 발생한다."},{"id":"555a41d444","s":1,"n":"6","q":"다음 중 선하증권의 기능을 올바르게 설명하고 있는 것은?","o":["운송물에 관한 손해, 멸실, 훼손 또는 연착 손해의 경비를 대시 지불하는 것","어음상의 권리의 담보로서 할인은행에 신탁적 양도 또는 질권의 목적으로 처분되는 것","송하인에 대하여 일정한 운임요율을 책정하여 계속적인 운송을 약정할 때 필요로 하는 결제수단","선박이나 적하의 가액과 운임의 반액과의 비율에 다른 운임을 지불하는 수단"],"a":1,"e":"B/L은 유가증권이므로 환어음상 권리의 담보로서 매입(할인)은행에 신탁적 양도 또는 질권 설정의 목적물이 되는 담보·무역금융 기능을 가진다."},{"id":"ddca4e7bb1","s":1,"n":"7","q":"다음에서 선하증권의 법적기능으로 적절하지 않은 것은?","o":["권리증권","운송계약의 증서","화물수령의 증서","손해방지의 증서"],"a":3,"e":"손해방지는 적하보험(cargo insurance)의 영역이며, B/L의 법적 기능은 권리증권·운송계약의 증서·화물수령의 증서에 한정된다."},{"id":"e66495f900","s":1,"n":"8","q":"다음에서 선하증권이 증거증권으로의 기능을 증명하기 위해 갖추고 있어야 할 내용과 거리가 먼 것은?","o":["운송계약의 성립과 내용","운송조건","운송손해보험의 약관","운송인에 의한 운송물의 수령 및 선적"],"a":2,"e":"증거증권으로서는 운송계약의 성립과 내용, 운송조건, 운송인의 화물 수령·선적 사실을 증명하며, 적하보험 약관은 보험증권의 기재사항이다."},{"id":"01b99f76f9","s":1,"n":"9","q":"다음 중 선하증권의 효력에 해당하지 않는 것은?","o":["운송물 인도 영수증","운송계약성립의 증거","운송물 인도청구권 증서","적하목록에 의하여 작성한 공정증서"],"a":3,"e":"적하목록(manifest)에 근거한 공정증서라는 성질은 없고, B/L은 사인이 작성한 유가증권으로 인도영수증·계약성립 증거·인도청구권 표창의 효력을 가진다."},{"id":"a2026cfac5","s":1,"n":"10","q":"다음 중 선하증권의 법적 성질이 아닌 것은?","o":["증거증권","유가증권","보험증권","권원증권"],"a":2,"e":"B/L의 법적 성질은 유가증권·증거증권·권원증권이자 요인·요식·문언·지시·처분·상환·제시증권이며, 보험증권성은 없다(Red B/L만 예외적 겸용)."},{"id":"cb262ba808","s":1,"n":"11","q":"선하증권은 기존의 운송계약상의 법률관계 또는 권리를 증권에 결합시키므로 운송인이 화물 선적을 위하여 수령또는 선적을 요하는 기능은?","o":["요인증권성","상환증권성","제시증권성","처분증권성"],"a":0,"e":"기존 운송계약과 화물의 수령·선적이라는 원인관계를 전제로만 발행될 수 있으므로 요인증권성(要因證券性)에 해당한다."},{"id":"fcb50f7540","s":1,"n":"12","q":"다음의 선하증권 종류에서 운송물의 선적의 뜻을 기재한 선하증권은?","o":["무유보선하증권(Clean B/L)","선적선하증권(Shipped B/L)","수령선하증권(Received B/L)","통선하증권(Through B/L)"],"a":1,"e":"본선 적재 후 \"Shipped on board\"처럼 선적 사실을 기재해 발행하는 것이 선적선하증권(Shipped/On Board B/L)이다."},{"id":"2be1d6710c","s":1,"n":"13","q":"다음 중 선하증권에 \"외관상 양호한 상태로\"(\"in apparent good order and condition\")이 표시된 증권은?","o":["유유보선하증권(Foul B/L)","복합운송선하증권(Multimodal Transport B/L)","무유보선하증권(Clean B/L)","수령선하증권(Received B/L)"],"a":0,"e":"'in apparent good order and condition이 표시된 증권' → 회사 정답은 유(무)유보선하증권(Foul B/L)이다. 보기 ①의 표기 그대로 골라 암기한다. ⚠[정답 논란] 사고적요(remarks)가 없는 증권은 무유보선하증권(Clean B/L)이고 Foul(Dirty) B/L은 하자 적요가 붙은 증권이므로, 일반 이론상 정답은 ③이다. 다만 채점은 회사 제공 정답 ① 기준이므로 시험에서는 ①로 답할 것.","c":{"t":2,"n":"사고적요(remarks)가 없는 증권은 무유보선하증권(Clean B/L)이고 Foul(Dirty) B/L은 하자 적요가 붙은 증권이므로, 일반 이론상 정답은 ③이다."}},{"id":"8340b6bb92","s":1,"n":"14","q":"다음 중 해상화물운송장(Sea-waybill)을 설명한 것으로 적합하지 않은 것은?","o":["해상화물운송장은 유통성을 가지고 있다.","새롭게 항공화물운송장 처럼 선하증권을 대신할 수 있다.","해상화물운송장은 운송화물의 인도에 제시가 필요치 않다.","해상화물운송장은 운송화물의 인도에 환수가 필요치 않다."],"a":0,"e":"해상화물운송장(Sea Waybill)은 비유통성(non-negotiable) 증거서류로 배서 양도가 불가하고, 화물 인도 시 제시나 환수도 요구되지 않는다."},{"id":"f41c024fe7","s":1,"n":"15","q":"다음 중 선하증권의 형식에 따른 분류로 해당되지 않는 것은?","o":["Red B/L","Short form B/L","Long form B/L","Negotiable B/L"],"a":3,"e":"Negotiable/Non-negotiable은 유통성 유무에 따른 구분이고, 형식(양식) 기준 분류는 이면약관 인쇄 여부에 따른 Long/Short form B/L과 Red B/L 등이다."},{"id":"b9d7007434","s":1,"n":"16","q":"다음 중 선하증권의 수하인란에 \"ORDER…\"라는 문구가 포함되어 있는 선하증권은?","o":["기명식 선하증권(Straight B/L)","선적선하증권(Shipped B/L)","지시식 선하증권(Order B/L)","통선하증권(Through B/L)"],"a":2,"e":"수하인란이 \"to order\", \"to the order of ○○Bank\"로 기재되어 배서(endorsement)로 양도되는 것이 지시식 선하증권(Order B/L)이다."},{"id":"ebd6b90480","s":1,"n":"17","q":"다음 중 선화증권(B/L)의 종류에 관한 설명중 틀린 것은?","o":["화물의 인수시점에 따라 Shipped B/L과 Received B/L이 있다.","화물의 상태를 기준으로 Clean B/L과 Stale B/L이 있다.","수화인을 지명하는 방식에 따라 Straight B/L과 Order B/L이 있다.","이면약관이 전부 인쇄되어 있는 Long Form B/L과 그렇지 않은 Short Form B/L이 있다."],"a":1,"e":"화물 상태 기준 분류는 Clean B/L과 Foul(Dirty) B/L이며, Stale B/L은 L/C 제시기간을 넘긴 기간경과 증권으로 상태와 무관하다."},{"id":"0a868200a1","s":1,"n":"18","q":"선하증권은 운송책임구간에 의해서도 분류될 수 있는데 이에 해당되지 않는 선하증권은?","o":["해양선하증권(Ocean B/L)","복합운송증권(Multimodal Transport B/L)","용선계약부 선하증권(Charter Party B/L)","내국선하증권(Domestic B/L)"],"a":2,"e":"용선계약부 선하증권은 운송계약의 형태(용선계약 기초)에 따른 분류이고, 책임구간 기준은 Ocean B/L·복합운송증권·내국(Local) B/L 등이다."},{"id":"b9b72b5879","s":1,"n":"19","q":"다음에서 NOVCC의 화물을 커버하는 선사의 선하증권을 무엇이라고 하는가?","o":["Charter Party B/L","Groupage B/L","Stable B/L","EXPRESS B/L"],"a":1,"e":"선사가 NVOCC(혼재업자)에게 발행해 혼재화물 전체를 커버하는 증권이 Master B/L, 즉 Groupage B/L이다."},{"id":"4e2d1437f3","s":1,"n":"20","q":"화물이 다른 지역에 위치한 2개 이상의 선적항에서 선적되었지만 하나의 선하증권으로 이를 커버하여 발행된 B/L은?","o":["Charter Party B/L","Groupage B/L","Hitchment B/L","EXPRESS B/L"],"a":2,"e":"서로 다른 지역의 2개 이상 선적항에서 나뉘어 적재된 화물을 한 장으로 묶어 발행하는 증권이 Hitchment B/L이다."},{"id":"d00fc1057a","s":1,"n":"21","q":"다음은 선하증권의 발행시기에 대한 설명으로 적합하지 않은 것은?","o":["선하증권의 발행은 수령선하증권주의에 준거한다.","하주(용선자 또는 송하인)으로 부터 운송물을 수령한 후에 발행된다.","하주의 청구에 의하여 발행된다.","수하인의 청구에 의하여 발행된다."],"a":3,"e":"발행 청구권자는 운송물을 인도한 하주(송하인 또는 용선자)이며, 수하인은 발행을 청구할 지위에 없다."},{"id":"7f912f6a56","s":1,"n":"22","q":"다음에서 수하인(Consignee)의 의무가 아닌 것은?","o":["화물수령의무","화물과 OBL상환의무","선하증권발행의무","운임의 지급의무"],"a":2,"e":"선하증권 발행은 운송인의 의무이고, 수하인은 화물 수령, 원본(OBL)과의 상환·제시, Freight Collect 시 운임 지급 의무를 진다."},{"id":"02d98298c5","s":1,"n":"23","q":"다음에서 송하인(Shipper)의 법적의무로 타당하지 않은 것은?","o":["운임의 지급의무","운송에 필요한 각종서류의 제출의무","화물명세의 제공과 그 정확성 담보 의무","목적지에서 화물을 인도받고 OBL 상환의무"],"a":3,"e":"목적지에서 화물을 인도받고 OBL을 상환하는 것은 수하인의 의무이며, 송하인은 운임 지급, 서류 제출, 화물명세의 제공과 정확성 담보 의무를 진다."},{"id":"c9ae956db2","s":1,"n":"24","q":"선화증권상의 기재사항에서 화물명세에 해당되지 않는 사항은?","o":["화물의 종류","화물의 손해보험률","화물의 중량 또는 용적","포장의 종별 및 개수와 기호"],"a":1,"e":"화물명세는 종류, 중량 또는 용적, 포장의 종별·개수·기호 등 화물 자체의 표시이고, 손해보험률은 적하보험 사항으로 기재 대상이 아니다."},{"id":"29f02a1e23","s":1,"n":"25","q":"다음 중 선하증권과 보험증권을 겸하는 증권은 어느 것인가 ?","o":["화물수령증","적선하증권","유보선하증권","선적선하증권"],"a":2,"e":"'선하증권과 보험증권을 겸하는 증권' → 회사 정답은 유보선하증권이다. 보기 ③으로 고정해 암기한다. ⚠[정답 논란] 선하증권과 적하보험증권 기능을 겸하는 것은 적색선하증권(Red B/L)이고 유보선하증권(Foul B/L)에는 보험 기능이 없으므로, 일반 이론상 정답은 ②(적색선하증권)다. 다만 채점은 회사 제공 정답 ③ 기준이므로 시험에서는 ③로 답할 것.","c":{"t":1,"n":"선하증권과 적하보험증권 기능을 겸하는 것은 적색선하증권(Red B/L)이고 유보선하증권(Foul B/L)에는 보험 기능이 없으므로, 일반 이론상 정답은 ②(적색선하증권)다."}},{"id":"e935bb0a66","s":1,"n":"26","q":"다음에서 운송인의 의무, 책임의 개시 장소를 말하는 것은?","o":["Place of Loading","Place of Discharge","Place of Receipt","Place of Delivery"],"a":2,"e":"운송인의 의무·책임은 화물을 수령하는 수취지(Place of Receipt)에서 개시되어 인도지(Place of Delivery)에서 종료된다."},{"id":"a4c64375ac","s":1,"n":"27","q":"다음에서 선하증권의 법정기재사항으로 해당되지 않는 것은?","o":["선박과 운송물의 명세 및 외관상태","용선자, 송하인, 수하인의 명칭","손해보험회사명","선하증권의 발행지와 그 발행년월일 및 통수"],"a":2,"e":"법정기재사항은 선박·운송물의 명세와 외관상태, 용선자·송하인·수하인 명칭, 발행지·발행년월일·발행통수 등이며 보험회사명은 포함되지 않는다."},{"id":"18634ab54d","s":1,"n":"28","q":"다음 중 선화증권통일조약에서 해상운송인의 면책대상으로 인정하고 있지 않은 해상손해는?","o":["포장불충분에 의한 손해","화물고유의 성질에 의한 손해","선장이나 선원의 항해과실로 인한 손해","화물의 선적, 적부, 보관, 인도 등에 관한 상업과실에 기인하는 손해"],"a":3,"e":"헤이그 규칙은 항해과실과 선박관리상 과실 등은 면책하나, 선적·적부·보관·인도에 관한 상업과실(commercial fault)은 면책되지 않는다."},{"id":"35b29f4d10","s":1,"n":"29","q":"다음 중 운송인에 의해 화물이 인도되는 장소는?","o":["Place of Loading","Place of Discharge","Place of Receipt","Place of Delivery"],"a":3,"e":"인도지(Place of Delivery)는 운송인이 수하인에게 화물을 인도하고 운송책임이 종료되는 장소다."},{"id":"c9924bb7dc","s":1,"n":"30","q":"다음 중 할증료(surcharge)의 종류가 아닌 것은?","o":["유류할증료(BFS)","통화할증료(CAF)","Suez surcharge","체선료(demurrage)"],"a":3,"e":"체선료(demurrage)는 약정 정박기간 초과에 따른 지연 배상금이고, 할증료는 BAF/BFS, CAF, 운하 surcharge처럼 기본운임에 부가되는 요금이다."},{"id":"da1943a103","s":1,"n":"31","q":"B/L상에 Freight Collect로 되어 있으면 다음 중 어떠한 정형거래조건을 선택한 경우인가?","o":["CIF","EXW","CIP","FOB"],"a":3,"e":"Freight Collect(운임 착지불)는 매수인이 운임을 부담하는 조건이므로 FOB에 해당하며, CIF·CIP·CFR은 매도인이 부담하는 Freight Prepaid다."},{"id":"af542a0cbe","s":1,"n":"32","q":"선하증권에 기재되는 운송인의 운송행위에 대한 보수로서 운임이 아닌 것은?","o":["기본운임(basic freight)","할증료(surcharge)","기타요금(charge)","보험료(insurance fee)"],"a":3,"e":"운임은 기본운임, 할증료, 기타요금으로 구성되며, 적하보험료는 화주가 보험자에게 지급하는 비용으로 운송인의 운송행위 대가가 아니다."},{"id":"b0d9ddb0f9","s":1,"n":"33","q":"통상적인 선하증권 원본(OBL)의 발행통수는?","o":["1통","2통","3통","4통"],"a":2,"e":"실무상 원본(Original) 3통을 1 set(Full set)로 발행하고 필요한 사본(copy)을 별도로 첨부한다."},{"id":"fe49e05006","s":1,"n":"34","q":"다음에서 선하증권의 발행이 있는 운송물의 인도의 경우에 선하증권과 상환하지 않고 은행의 보증장도 없이 해상운송인이 수하인에게 운송물을 인도하는 편의인도 방법은 ?","o":["보증도","가인도","공탁인도","하도지시서에 의한 인도"],"a":1,"e":"은행의 수입화물선취보증장(L/G) 없이 증권 상환도 없이 인도하는 편의인도가 가인도(공도)이며, 보증도는 L/G를 받고 인도하는 방식이다."},{"id":"d631825a7a","s":1,"n":"35","q":"여러통의 OBL이 발행된 경우, 각통의 효력으로 적합하지 못한 것은?","o":["각통은 독립하여 선하증권의 효력을 가진다.","수통의 OBL과 약정목적지외에서의 화물인도를 한다.","수통의 OBL중 1통과 상환으로 운송물을 인도한 경우 다른 OBL은 그 효력을 잃는다.","목적지에서 OBL 2통을 소지한 자는 화물의 인도를 청구할 수 있으며, 운송인은 인도를 거부하지 못한다."],"a":3,"e":"목적지에서는 수통 중 1통과 상환하면 인도가 완결되고 나머지는 실효되나, 다른 소지인이 나타날 수 있어 운송인은 공탁 등으로 인도를 유보할 수 있으므로 거부 불가라 단정할 수 없다."},{"id":"066b9719b0","s":1,"n":"36","q":"선하증권의 기명날인권자 또는 서명권자는 다음 중 누구인가?","o":["선장","운송인 또는 그 대리인","선박임차인","선박관리인"],"a":1,"e":"선하증권은 운송인의 명의로 발행되며, 선장이나 선박대리점은 운송인의 대리인 자격에서 기명날인·서명한다."},{"id":"5e8b93bcdc","s":1,"n":"37","q":"다음에서 선하증권을 발행 할 수 없는 자는 누구인가?","o":["선장","선박서기","선박임차인","선박관리인"],"a":1,"e":"선박서기(사무원)는 운송인의 대리권이 없어 발행권이 없으며, 선장·선박임차인·선박관리인은 운송인 또는 그 대리인의 지위에서 발행할 수 있다."},{"id":"7a19247c62","s":1,"n":"38","q":"다음에서 선하증권의 물권적 효력의 발생요건을 설명한 것 중 관계가 먼 것은?","o":["정당한 방법에 의한 선하증권의 양도이어야 한다.","선하증권의 취득자 및 운송물의 취득자가 선의이어야 한다.","선하증권을 인도할 때 운송인이 운송물을 점유하고 있어야 한다.","선하증권의 양수인이 양도인에게 선하증권을 배서하고 교부한 때에는 화물이 현실적으로 존재하고 있어야 한다."],"a":3,"e":"물권적 효력에는 정당한 양도, 취득자의 선의, 운송인의 운송물 점유, 화물의 현존이 필요하며, ④는 배서·교부의 방향이 양도인→양수인으로 뒤바뀐 서술이다."},{"id":"90f348dfb7","s":1,"n":"39","q":"다음 중 선하증권의 문언적 효력의 인정사유로서 타당하지 않은 것은?","o":["영미의 금반언의 법리에서 유래되었다.","선하증권의 유통성을 보호하기 위함이다.","선박소유자를 우선적으로 보호하기 위함이다.","선의의 선하증권 취득자를 보호하기 위함이다."],"a":2,"e":"문언적 효력은 영미법의 금반언(estoppel) 법리에서 유래해 증권의 유통성과 선의의 취득자를 보호하기 위한 것으로, 선박소유자 보호를 목적으로 하지 않는다."},{"id":"84317645a8","s":1,"n":"40","q":"다음에서 선하증권에서 채권적 효력이 미치는 당사자는?","o":["선의의 B/L소지인과 운송인 사이","운송인과 송하인사이","선의의 B/L소지인과 선박소유자사이","운송인과 선박임차인사이"],"a":0,"e":"채권적 효력은 증권 기재 문언대로 운송인과 선의의 선하증권 소지인 사이에 채권·채무관계를 발생시킨다."},{"id":"8862ce1db5","s":1,"n":"41","q":"다음 중 항공화물운송장(Airway bill)과 선화증권(Bill of Lading)의 차이점을 비교한 것 중 틀린 것은?","o":["항공화물운송장 - 유가증권이 아닌 단순한 화물수취증 선화증권 - 유가증권","항공화물운송장 - 기명식으로 발행되고 배서, 교부에 의해 양도가능 선화증권 - 지시식 또는 소지인식으로 발행되고 양도가능","항공화물운송장 - 창고에 반입되면 AWB 발행 선화증권 - 선적후 선적선화증권 발행(원칙)","항공화물운송장 - 항공사나 항공사 대리인이 보통 발행 선화증권 - 운송인(선박회사)이 작성"],"a":1,"e":"AWB는 기명식·비유통성 화물수취증으로 배서·교부에 의한 양도가 불가하며, 지시식·소지인식으로 발행되어 양도되는 것은 B/L의 특성이다."},{"id":"c58837246b","s":1,"n":"42","q":"다음에서 선하증권약관의 유효요건으로 해당되지 않는 것은?","o":["약관을 명시할 것","강행법규에 위반되지 않을 것","사법상 일반원칙에 위반되지 않을 것","선하증권과 운송계약에 대한 책임만을 기재할 것"],"a":3,"e":"유효요건은 약관의 명시(개시), 강행법규 위반 금지, 사법상 일반원칙 준수이며, 기재 내용을 운송계약 책임에만 한정하라는 요건은 존재하지 않는다."},{"id":"0bbd2bc921","s":1,"n":"43","q":"다음 중 선하증권의 약관은 강행법규에 위반되지 안하야 한다는 내용을 설명한 것으로 적절하지 않은 것은?","o":["운송인의 법정면책사유 이외의 면책특약금지","운송인의 법정의무를 경감시킬 수 있는 약관일 것","운송인의 법정책임을 경감하는 약관이 아니어야 할 것","화주의 권한을 이유없이 박탈 또는 제한하지 않을 것"],"a":1,"e":"운송인의 법정 의무나 책임을 경감·면제하는 특약은 강행법규 위반으로 무효이므로 ②는 요건과 정반대되는 서술이다."},{"id":"ed64b742b5","s":1,"n":"44","q":"선하증권에 의한 운송의 경우 누가 정당한 수하인인가?","o":["용선자","송하인","중개인","적정하게 배서된 OBL소지인"],"a":3,"e":"지시식 B/L에서는 적법하게 배서된 원본(OBL)의 소지인이 정당한 수하인으로서 운송물 인도청구권을 가진다."},{"id":"3372b67753","s":1,"n":"45","q":"선하증권이 발행되지 않은 경우 예를 들어 SWB에 의한 운송의 경우 누가 정당한 수하인인가?","o":["용선자","당해운송계약상 수하인으로 지정된 자","법원의 제권판결을 받은자","적정하게 배서된 OBL소지인"],"a":1,"e":"SWB는 비유통증권이므로 배서와 무관하게 운송계약상 수하인으로 지정된 기명 수하인이 정당한 수하인이며 신분 확인만으로 인도받는다."},{"id":"d2097f3094","s":1,"n":"46","q":"다음에서 B/L의 임의기재사항으로 적당하지 않은 것은?","o":["항해번호","통지처","화물의 중량","면책약관"],"a":2,"e":"화물의 중량은 상법상 법정기재사항이며, 항해번호·통지처(Notify Party)·면책약관 등이 실무상 임의기재사항이다."},{"id":"1f9a15cd1d","s":1,"n":"47","q":"다음 중 컨테이너의 화물을 혼재하거나 수입물품을 분배하기 이한 장소를 B/L상 어떻게 표시 되는가?","o":["B.A.F","C.F.S","C.A.F","L.C.L"],"a":1,"e":"소량화물(LCL)의 혼재(consolidation)와 수입화물 분배가 이루어지는 장소는 CFS(Container Freight Station)로 표시된다."},{"id":"da73c9c11c","s":1,"n":"48","q":"다음에서 선하증권의 종류와 관련한 다음 기술 중 부적절한 것은?","o":["Straight B/L은 주로 L/C.방식 거래일 경우 교부받게 된다","Surrender B/L은 Original B/L없이 수입자로 하여금 화물인을 가능케 한다.","Stale B/L은 주로 BWT(Bonded Warehouse Transaction)시 많이 이용된다.","선적당시 화물의 포장상태나 수량 등에 어떤 결함 또는 이상이 발견되었을 경우 Clean B/L을 박기 위해서는 선사에 L/I(Letter of Indemnity)를 제출해야 한다."],"a":0,"e":"L/C 거래에서는 은행이 담보권을 확보할 수 있는 지시식(Order B/L)을 요구하므로, 양도성이 없는 기명식(Straight B/L)은 적합하지 않다."},{"id":"55d7d5b748","s":1,"n":"49","q":"B/L에서 Ocean Vessel은 무엇을 기재하는 것인가?","o":["송하인의 성명","수입상의 상호","해상운송 선박명","화물을 선적하는 항구명"],"a":2,"e":"Ocean Vessel 란에는 실제 해상운송을 수행하는 본선(모선)의 선박명을 기재하며, 선적항은 Port of Loading 란에 기재한다."},{"id":"4d758c1a10","s":1,"n":"50","q":"다음 중 해상운송계약의 당사자가 아닌 자는?","o":["해상운송인","수하인","송하인","용선자"],"a":1,"e":"해상운송계약의 당사자는 운송인과 송하인(용선계약에서는 선박소유자와 용선자)이며, 수하인은 당사자가 아니라 증권상 권리를 취득하는 제3자다."},{"id":"f5db6a36f3","s":1,"n":"51","q":"다음 중 B/L 기재사항에서 Carrier Name과 관련된 사항으로 옳지 않은 것은?","o":["B/L 발행권자의 Signature가 표시된다.","B/L 발행권자는 은행에 Signature를 등록하여야 한다.","B/L 발행권자가 Signature를 수정할 경우 재발급이나 Ccorrection 도장을 날인 후 Signature 해야 한다.","중량 및 용적 등 상품의 가격에 영향을 미치지 않는 부분일지라도 Correction 도장을 날인한 후 Signature를 해야 유효하다."],"a":3,"e":"B/L 정정 시 Correction 도장과 서명(signature)이 요구되는 것은 화물의 가액·책임범위에 영향을 주는 중요 기재사항이며, 중량·용적처럼 가격에 영향이 없는 경미한 사항까지 일률적으로 날인·서명해야 유효한 것은 아니다."},{"id":"22e49cad06","s":1,"n":"52","q":"선하증권 기재사항 중에서 Flag란 무엇을 의미하는 가?","o":["Container에 적재된 화물에 봉인을 한 Seal No.를 말한다","화물이 적재되는 Container No.를 표기하는 것을 말한다.","선박의 등록국적을 나타내고 이는 해상사고 시 국제적인 관례인 기국주의에 의한다.","운송인이 책임지고 운송하여 수하인에게 인도하여 주는 장소를 명기하는 것을 말한다."],"a":2,"e":"Flag는 선박의 등록국적(선적국)을 표시하는 항목으로, 해상사고 발생 시 준거법과 관할을 등록국법에 따르게 하는 기국주의(flag state principle)와 직결된다."},{"id":"a195ce8fbe","s":1,"n":"53","q":"다음 중 선하증권에서 기명지시식의 예로 옳은 것은?","o":["“Mr.** or Order\"로 표시하는 것.","“To Order of Mr.**\"으로 표시하는 것.","“To Order\"로만 표시하는 것.","”Mr.** 로 표시하는 것."],"a":1,"e":"기명지시식은 특정인을 지명하면서 그 지시에 따라 양도되도록 한 형태로 \"To Order of Mr.**\"가 전형이다. \"To Order\"만 쓰면 단순지시식, \"Mr.**\"만 쓰면 기명식(straight)이다."},{"id":"63f2953548","s":1,"n":"54","q":"선하증권의 임의기재사항에서 면책조항으로 거리가 먼 것은?","o":["이로조항(Deviation Clause)","부지조항(Unknown Clause)","공동해손조항(General Average Clause)","물품명세(Description of Commodity)"],"a":3,"e":"물품명세(Description of Commodity)는 운송물의 표시로서 법정기재사항에 해당하며, 이로·부지·공동해손조항처럼 운송인의 책임을 제한·배제하는 면책조항(exemption clause)이 아니다."},{"id":"2d3fa9e019","s":1,"n":"55","q":"이명, 재산, 혹은 선박구조, 피난, 연료 등 필수품을 적재하기 위하여 예정항로 이회의 기항이 면책되는 조항은 무엇인가?","o":["이로조항(Deviation Clause)","부지조항(Unknown Clause)","공동해손조항(General Average Clause)","고가품조항(Valuable Goods Clause)"],"a":0,"e":"인명·재산·선박의 구조나 피난, 연료·식료 보급 등 정당한 사유로 예정항로를 벗어나 기항하는 것을 면책시키는 규정이 이로조항(Deviation Clause)이며, 이 경우 이로는 부당이로로 보지 않는다."},{"id":"097f801d37","s":1,"n":"56","q":"본선이 자사선에 의해 구조되었더라도 타사선에 구조된 것과 같이 선주는 구조비를 자사의 화주에게 청구할 수 있다는 내용의 조항은?","o":["잠재하자 조항(Latent defact Clause)","누제이슨조항(New Jason Clause)","공동해손조항(General Average Clause)","위험품조항(Dangerous Goods Clause)"],"a":1,"e":"New Jason Clause에는 구조선이 운송인 소유·운항 선박(자사선)이어도 타사선에 구조된 것과 동일하게 구조료를 청구·정산한다는 sister ship 구조료 조항이 포함되어 있다."},{"id":"e26f7a8ced","s":1,"n":"57","q":"다음에서 선박저당권의 목적으로 될 수 없는 선박은 어느 것인가?","o":["선박의 속구","20톤 미만의 선박","건조중의 선박","선박공유지분"],"a":1,"e":"선박저당권은 등기할 수 있는 선박을 대상으로 하므로 등기 대상이 아닌 20톤 미만 소형선박에는 설정할 수 없다. 선박의 속구, 건조 중의 선박, 선박공유지분은 모두 저당권의 목적이 될 수 있다."},{"id":"2f726c4d52","s":1,"n":"58","q":"다음 중 중계무역에 사용되는 B/L로서 Switch라는 문언이 기재되어 있는 선하증권은?","o":["용선계약부 선하증권(Charter Party B/L)","환적 선하증권(Transhipment B/L)","스위치선하증권(Switch B/L)","약식선하증권(Short From B/L)"],"a":2,"e":"중계무역에서 원 수출자·원산지 등을 노출시키지 않기 위해 제3국에서 기재사항을 바꾸어 재발행하며 Switch 문언이 표시되는 것이 스위치 선하증권(Switch B/L)이다."},{"id":"6ae9506e61","s":1,"n":"59","q":"B/L의 도착항란에 \"Busan option Masan\"이라고 기재하고 수하인이 이중 하나를 선택할 수 잇게 한 B/L은?","o":["목적지 선하증권(Deatination B/L)","해양선회증권(Ocean B/L)","이중목적 선하증권(Dual Purpose B/L)","선택 선하증권(Optional B/L)"],"a":3,"e":"양륙항을 \"Busan option Masan\"처럼 복수로 기재해 두고 수하인이 그중 하나를 선택하도록 한 것이 선택 선하증권(Optional B/L)이며, 선택항 변경 시 옵션운임이 부과된다."},{"id":"2fa4bd1670","s":1,"n":"60","q":"다음에서 해상물건운송인의 권리로서 타당하지 않은 것은?","o":["적하유치권","운임청구권","정박료청구권","선하증권 교부청구권"],"a":3,"e":"선하증권 교부는 송하인의 청구권이고 운송인에게는 발행·교부 의무에 해당한다. 적하유치권, 운임청구권, 정박료(체선료)청구권은 해상물건운송인의 권리다."},{"id":"c9d7b49dff","s":1,"n":"61","q":"선하증권의 경제적효용에 관해 설명한 것과 관계가 적은 것은?","o":["무역화폐의 역할로 무역상품대금의 결제수단이다.","선하증권기재의 물품(대금)에 대한 담보수단이다.","선하증권으로 인해 운송중의 화물의 전매는 불가능하게 한다.","무역거래에 의한 무역조건에 따라 서류에 의한 거래를 가능하게 한
